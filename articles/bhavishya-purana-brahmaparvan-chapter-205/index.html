<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 205 — Description of the Mahādeva-Worship Procedure."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 205 — Description of the Mahādeva-Worship Procedure — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 205 — Description of the Mahādeva-Worship Procedure</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Vyāsa said: Hear again from me, Bhīṣma, the supreme procedure as I speak, by which one constantly worships Mahādeva, Divākara.","punaḥ — again; nibodha — hear; me — from me; bhīṣma — O Bhīṣma; gadataḥ — speaking; paramam vidhim — the supreme procedure; yena — by which; pūjayate — one worships; nityam — constantly; mahādevam — Mahādeva; divākaram — Divākara."],["Abundant, pure radiance and supreme happiness [come]; first in the east, likewise in the southeast, southwest, and the abode of wind.","prabhūtam — abundant; nirmalam tejaḥ — pure radiance; ārādhya — having worshipped; paramam sukham — supreme happiness; pūrvam — first/east; antaḥ — within; tathā — likewise; āgneyyām — in the southeast; naiṛtyām — in the southwest; pavana-ālaye — in the abode of wind."],["In order up to the northeast one should place the seed in the heart; this is the seat of Bhāskara, to be placed by seers of truth.","krameṇa — in order; yāvat — up to; īśānam — the northeast; hṛdi — in the heart; bījam — the seed; ca — and; vinyaset — one should place; bhāskara-āsanam — the seat of Bhāskara; etat — this; tu — indeed; nyastavyam — to be placed; tattva-darśibhiḥ — by seers of truth."],["Above it, then, a lotus with the heart [seed], eight-petalled, with filaments, five-coloured, with filaments.","upariṣṭāt — above; tataḥ — then; tasya — it; hṛdayena — with the heart [seed]; tu — indeed; paṅkajam — a lotus; aṣṭa-patram — eight-petalled; keśara-ālam — with filaments; pañca-varṇa — five-coloured; sa-keśaram — with filaments."],["Beginning with Dīptā in the east up to the region of Mahādeva, one should place the eight śaktis with mantras, beginning with Sarvatomukhī.","dīptā-ādi — beginning with Dīptā; pūrvam ārabhya — beginning from the east; ā-mahādeva-gocharam — up to the region of Mahādeva; śakti-aṣṭakam — eight śaktis; nyaset — one should place; mantraiḥ — with mantras; āditaḥ — beginning with; sarvato-mukhīm — Sarvatomukhī."],["With the seed-syllables at the tips of the filaments, one should worship in due order; then one should invite Bhānu and place him upon the pericarp.","a-bījaiḥ — with seed-syllables; kesara-agreṣu — at the tips of the filaments; krameṇa eva — indeed in due order; ca — and; pūjayet — one should worship; tataḥ — then; tu — indeed; āvāhayet — one should invite; bhānum — Bhānu; sthāpayet — should place; karṇikā-upari — upon the pericarp."],["Having offered to him that and the other [thing], the sky-lotus is to be known; by that same [procedure] are invocation, worship, establishment, and the half [offering].","tasya — to him; upahṛtya — having offered; tam ca anyam — that and another; veditavyam — is to be known; kha-puṣkaram — sky-lotus; tena eva — by that same; āvāhanam — invocation; ca — and; arcya — worship; sthāpanam — establishment; ca — and; ardham eva — the half indeed."],["Pādya, sipping-water, a seat, clothing, scents, and ornaments; flowers and offerings according to rule, and likewise incense, O hero.","pādyam — pādya; ācamanaṃ — sipping-water; sthānam — a seat; vastra — clothing; gandha-ādi-bhūṣaṇam — scents and ornaments; vidhi-nā — according to rule; vīra — O hero; puṣpāṇi — flowers; naivedyam — offerings; dhūpam eva ca — and likewise incense."],["These should be done with faith and devotion; thus Bhāskara is pleased. Even great sinners quickly obtain the fruit they have thought of.","kartavyam — should be done; śraddhayā — with faith; bhaktyā — with devotion; evam — thus; tuṣyati — is pleased; bhāskaraḥ — Bhāskara; mahā-pātakinaḥ api — even great sinners; āśu — quickly; labhante — obtain; cintitam phalam — the desired fruit."],["Having worshipped Āditya, then one should worship the limbs; place the heart in Dīptā, and the head in Bhavānī.","ādityam — Āditya; pūjayitvā — having worshipped; tu — indeed; paścāt — afterwards; aṅgāni — limbs; pūjayet — one should worship; dīptāyām — in Dīptā; hṛdayam — the heart; nyasya — having placed; bhavānyāḥ — of Bhavānī; śirasaḥ — of the head; nyaset — should place."],["One should place the weapon in the directions and intermediate directions, up to the northern end of the directions of Indra and the rest; in the pericarp one should place the eye and worship with its own seed.","dik-vidikṣu — in directions and intermediate directions; nyaset — one should place; astram — the weapon; indra-ādi — beginning with Indra; diśaḥ — directions; uttara-antikam — to the northern end; karṇikāyām — in the pericarp; nyaset — should place; netram — the eye; sva-bījena — with its own seed; tu — indeed; arcayet — should worship."],["With flowers, scents, and incense, one should worship the hearts in due order; afterwards the mantra-knower should worship the womb according to rule.","puṣpaiḥ — with flowers; gandhaiḥ — with scents; dhūpaiḥ ca — and with incense; hṛdayāni — the hearts; krameṇa — in due order; tu — indeed; pūjayitvā — having worshipped; vidhi-vat — according to rule; garbham — the womb; paścāt — afterwards; tu — indeed; mantra-vit — the mantra-knower."],["Outside, to the east, [worship] Manda; to the south, likewise Budha; one should worship Viṣāṇa in the west, and Bhārgava in the north.","bāhyataḥ — outside; pūrvataḥ — to the east; mandam — Manda; dakṣiṇena — to the south; budham — Budha; tathā — likewise; viṣāṇam — Viṣāṇa; paścime — in the west; pūjya — having worshipped; uttareṇa — to the north; tu — indeed; bhārgavam — Bhārgava."],["One should worship Kuja in the southeast and the Sun-born in the southwest; in the northwest one should worship Kṛṣṇa, and in the northeast Vikaca, O king.","āgneyyām — in the southeast; ca — and; kujam — Kuja; pūjya — having worshipped; naiṛtyām — in the southwest; bhānu-deha-jam — the Sun-born; vāyavyām — in the northwest; pūjayet — one should worship; kṛṣṇam — Kṛṣṇa; īśānyām — in the northeast; vikacam — Vikaca; nṛpa — O king."],["Then the wise one should worship the eight guardians of the worlds, beginning with Indra, with various fragrant flowers and delightful incense.","indra-ādi — beginning with Indra; loka-pālān — guardians of the worlds; tataḥ — then; aṣṭau — eight; pūjayet — should worship; budhaḥ — the wise one; su-gandhaiḥ — with fragrant; vividhaiḥ puṣpaiḥ — various flowers; dhūpaiḥ ca eva — and delightful incense."],["One should worship Bhānu in order together with the guardians of the worlds and the planets, with mantras, O best of the Kuru lineage, whoever desires welfare for himself.","krameṇa — in order; pūjayet — one should worship; bhānum — Bhānu; loka-pālaiḥ — with guardians of the worlds; grahaiḥ saha — together with planets; mantraiḥ — with mantras; kuru-kula-śreṣṭha — O best of the Kuru lineage; yaḥ icchet — whoever desires; śreyaḥ — welfare; ātmanaḥ — for himself."],["Where the god Ravi is worshipped according to this procedure, there is no fear from thieves or fire, nor indeed fear from hell.","anena vidhinā — by this procedure; yatra — where; devaḥ — the god; sampūjyate — is worshipped; raviḥ — Ravi; na — no; caura-agni-bhayam — fear from thieves or fire; tatra — there; na ca api — nor indeed; narakāt bhayam — fear from hell."],["There is no fear there from hailstones, poison, and the rest; happiness, health, joy, plentifulness, and unshaken prosperity [arise].","varṣa-upala-viṣa-ādibhyaḥ — from hailstones, poison, and the rest; bhayam — fear; tatra — there; na vidyate — does not exist; sukham — happiness; ārogyam — health; ānandam — joy; su-bhikṣam — plentifulness; acalām śriyam — unshaken prosperity."],["The Āditya situated in the middle within the orb of radiance, ultimately, should always be worshipped by practitioners; no chariot, nor horses.","tejaḥ-bimba-anta-madhya-sthaḥ — situated in the middle within the orb of radiance; ādityaḥ — Āditya; paramārthataḥ — ultimately; yaṣṭavyaḥ — should be worshipped; sādhakaiḥ — by practitioners; nityam — always; na rathaḥ — no chariot; na ca vājinaḥ — nor horses."],["Thus the entire procedure has been told by me to you, Bhīṣma, by which one constantly worships Mahādeva, Divākara.","iti — thus; eṣaḥ — this; vidhiḥ — procedure; ākhyātaḥ — told; mayā — by me; bhīṣma — O Bhīṣma; tava — to you; akhilaḥ — entire; yena — by which; pūjayate — one worships; nityam — constantly; mahādevaḥ — Mahādeva; divākaram — Divākara."],["Having thus worshipped Vivasvat, one should dismiss [him] with the heart-seed; whoever worships Bhānu thus goes to the highest state.","ittham — thus; pūjya — having worshipped; vivasvantam — Vivasvat; hṛd-bījena — with the heart-seed; visarjayet — one should dismiss; yaḥ — whoever; evam — thus; pūjayet — worships; bhānum — Bhānu; saḥ — he; yāti — goes; paramām gatim — to the highest state."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:205,verseCount:21,subtitle:"Chapter 205 — Description of the Mahādeva-Worship Procedure",colophon:""},T);</script></body>
