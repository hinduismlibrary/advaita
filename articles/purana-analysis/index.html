<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f8f4">
  <meta name="description" content="A chapter heat map of Purāṇic citations and inter-Purāṇa parallels.">
  <title>Purāṇa Analysis</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #faf9f6;
      --ink: #292822;
      --muted: #716d63;
      --rule: #dedbd3;
      --empty: #f3e0dd;
      --green: #d5e5d7;
      --green-ink: #2d563a;
      --blue: #d9e5e8;
      --blue-ink: #31525a;
      --gold: #efe2c6;
      --gold-ink: #765b2c;
      --teal: #d3e8e4;
      --teal-ink: #285b52;
      --violet: #e9e1ef;
      --violet-ink: #564268;
      --neutral: #e9e7e1;
      --neutral-ink: #514f48;
      --red: #a3473b;
      --serif: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 13px/1.42 var(--sans); }
    button, select { font: inherit; }
    :focus-visible { outline: 2px solid var(--green-ink); outline-offset: 2px; }
    .page { width: min(1120px, calc(100% - 40px)); margin: 0 auto; }
    .top {
      min-height: 42px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--rule); font-size: 10px; letter-spacing: .09em; text-transform: uppercase;
    }
    .top a { color: inherit; text-decoration: none; }
    .top a:first-child { font-weight: 650; }
    .top a:last-child { color: var(--muted); }
    header { padding: 24px 0 17px; border-bottom: 1px solid var(--ink); }
    h1 { margin: 0; font: 400 clamp(34px, 4.3vw, 46px)/1.02 var(--serif); letter-spacing: -.035em; }
    .chooser { display: flex; align-items: center; gap: 11px; padding: 12px 0 9px; }
    .chooser label { color: var(--muted); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
    .chooser select {
      min-width: min(310px, 72vw); max-width: 100%; padding: 7px 30px 7px 9px;
      border: 1px solid var(--rule); border-radius: 3px; color: var(--ink); background: #fff;
    }
    .legend { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 17px; padding: 0 0 10px; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 11px; height: 11px; border: 1px solid var(--rule); border-radius: 3px; background: var(--empty); }
    .legend-swatch.quoted { border-color: #b8cdbb; background: var(--green); }
    .legend-swatch.parallel { border-color: #bfd0d3; background: var(--blue); }
    .legend-swatch.contents { border-color: #d8c59c; background: var(--gold); }
    .legend-swatch.pilgrimage { border-color: #b6d2cc; background: var(--teal); }
    .legend-swatch.mahatmya { border-color: #cbbbd5; background: var(--violet); }
    .legend-swatch.subject { border-color: #cbc8bf; background: var(--neutral); }
    .legend-swatch.chapter-relation { border-color: #bdbab2; background: var(--neutral); border-style: dashed; }
    .legend-swatch.commentary { border-color: #cbbbd5; background: #fff; box-shadow: inset 0 -3px var(--violet-ink); }
    .legend-dot { width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--red); }
    #map { padding: 3px 0 18px; }
    .section-row { display: grid; grid-template-columns: 128px minmax(0,1fr); gap: 12px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
    .section-label { padding-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.3; }
    .section-content { min-width: 0; }
    .cells { display: grid; grid-template-columns: repeat(auto-fill, 22px); gap: 2px; align-content: start; }
    .tile {
      position: relative; display: grid; place-items: center; width: 22px; height: 22px;
      padding: 0; border: 1px solid #e5c5c0; border-radius: 3px; color: #855f58;
      background: var(--empty); font-size: 10px; line-height: 1; font-variant-numeric: tabular-nums; cursor: pointer;
      transition: border-color .12s ease, background-color .12s ease;
    }
    .tile.quoted { border-color: #b8cdbb; color: var(--green-ink); background: var(--green); font-weight: 650; }
    .tile.parallel { border-color: #bfd0d3; color: var(--blue-ink); background: var(--blue); font-weight: 650; }
    .tile.contents:not(.quoted):not(.parallel):not(.both) { border-color: #d8c59c; color: var(--gold-ink); background: var(--gold); }
    .tile.contents::before { position: absolute; top: 1px; left: 1px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold-ink); content: ""; }
    .tile.pilgrimage:not(.quoted):not(.parallel):not(.both):not(.contents) { border-color: #b6d2cc; color: var(--teal-ink); background: var(--teal); }
    .tile.pilgrimage::before { position: absolute; top: 1px; right: 1px; width: 4px; height: 4px; border-radius: 50%; background: var(--teal-ink); content: ""; }
    .tile.mahatmya:not(.quoted):not(.parallel):not(.both):not(.contents):not(.pilgrimage) { border-color: #cbbbd5; color: var(--violet-ink); background: var(--violet); }
    .tile.mahatmya::before { position: absolute; bottom: 1px; left: 1px; width: 4px; height: 4px; border-radius: 50%; background: var(--violet-ink); content: ""; }
    .tile.subject:not(.quoted):not(.parallel):not(.both):not(.contents):not(.pilgrimage):not(.mahatmya) { border-color: #cbc8bf; color: var(--neutral-ink); background: var(--neutral); }
    .tile.subject { border-style: dashed; }
    .tile.chapter-relation:not(.quoted):not(.parallel):not(.both):not(.contents):not(.pilgrimage):not(.mahatmya):not(.subject) { border-color: #bdbab2; color: var(--neutral-ink); background: var(--neutral); }
    .tile.chapter-relation { border-style: dashed; }
    .tile.commentary { border-bottom: 3px solid var(--violet-ink); }
    .tile.both { border-color: #b8cdbb; color: var(--ink); background: linear-gradient(135deg,var(--green) 0 49%,var(--blue) 51% 100%); font-weight: 700; }
    .tile:hover, .tile[aria-expanded="true"] { border-color: var(--ink); }
    .tile[aria-expanded="true"] { box-shadow: inset 0 0 0 1px var(--ink); }
    .tile.unmatched::after { position: absolute; right: 1px; bottom: 1px; width: 5px; height: 5px; border-radius: 50%; background: var(--red); content: ""; }
    .detail { margin: 5px 0 1px; padding: 8px 10px; border: 1px solid var(--rule); border-left: 2px solid var(--ink); border-radius: 3px; background: #fff; }
    .detail[hidden] { display: none; }
    .detail h2 { margin: 0 0 6px; font: 400 17px/1.15 var(--serif); }
    .group { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; padding: 5px 0 0; }
    .group + .group { margin-top: 4px; border-top: 1px solid #e9e6df; }
    .group h3 { margin: 2px 0 0; color: var(--muted); font: 650 9px/1.3 var(--sans); letter-spacing: .06em; text-transform: uppercase; }
    .entries { min-width: 0; margin: 0; padding: 0; list-style: none; }
    .entry { padding: 1px 0 4px; overflow-wrap: anywhere; }
    .work { font-weight: 600; }
    .work-link { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 2px; }
    .refs { display: block; padding-top: 1px; color: #45433d; font-variant-numeric: tabular-nums; }
    .pair { font-variant-numeric: tabular-nums; }
    .arrow { padding: 0 6px; color: var(--muted); }
    .note { display: block; padding-top: 2px; color: #5f5b53; font: italic 12px/1.35 var(--serif); }
    .no-entry { margin: 0; color: var(--muted); font-size: 11px; }
    .error { padding: 14px 0; color: var(--red); }
    .analysis-row { border-top: 1px solid var(--ink); border-bottom: 0; padding-top: 8px; padding-bottom: 8px; }
    .analysis-title { margin: 0; padding-top: 3px; color: var(--ink); font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; }
    .analysis-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 16px; margin: 0; }
    .analysis-item { display: flex; flex-direction: column-reverse; align-items: flex-start; justify-content: flex-end; gap: 2px; min-height: 54px; padding: 6px 0 5px; border-bottom: 1px solid var(--rule); }
    .analysis-item dt { color: var(--muted); font-size: 9px; line-height: 1.35; }
    .analysis-item dd { margin: 0; color: var(--ink); font: 400 clamp(19px, 2.1vw, 23px)/1.05 var(--serif); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
    .analysis-item dd small { display: block; margin-top: 4px; color: var(--muted); font: 400 9px/1.3 var(--sans); letter-spacing: 0; }
    @media (max-width: 760px) {
      .page { width: calc(100% - 26px); }
      header { padding: 20px 0 14px; }
      .section-row { grid-template-columns: 88px minmax(0,1fr); gap: 7px; padding: 4px 0; }
      .section-label { font-size: 9px; }
      .cells { grid-template-columns: repeat(auto-fill, 21px); gap: 2px; }
      .tile { width: 21px; height: 21px; }
      .group { grid-template-columns: 66px minmax(0,1fr); gap: 5px; }
      .analysis-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
      .analysis-item { min-height: 60px; padding: 8px 0 7px; }
    }
    @media (max-width: 380px) {
      .page { width: calc(100% - 20px); }
      .section-row { grid-template-columns: 72px minmax(0,1fr); gap: 5px; }
      .group { grid-template-columns: 58px minmax(0,1fr); gap: 4px; }
      .analysis-grid { gap: 0 9px; }
      .analysis-item dt { font-size: 8.5px; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="page">
    <nav class="top" aria-label="Site">
      <a href="/advaita/">Viveka Dṛṣṭi</a>
      <a href="/advaita/pages/purana-library/">Purāṇa Library</a>
    </nav>
    <header><h1>Purāṇa Analysis</h1></header>
    <div class="chooser">
      <label for="purana">Purāṇa</label>
      <select id="purana" aria-label="Choose a Purāṇa"></select>
    </div>
    <div class="legend" aria-label="Heat map key">
      <span class="legend-item"><i class="legend-swatch" aria-hidden="true"></i>No located reference</span>
      <span class="legend-item"><i class="legend-swatch quoted" aria-hidden="true"></i>Quoted elsewhere</span>
      <span class="legend-item"><i class="legend-swatch parallel" aria-hidden="true"></i>Verse parallel</span>
      <span class="legend-item"><i class="legend-swatch chapter-relation" aria-hidden="true"></i>Chapter link only</span>
      <span class="legend-item"><i class="legend-swatch commentary" aria-hidden="true"></i>Commentary</span>
      <span class="legend-item"><i class="legend-swatch contents" aria-hidden="true"></i>Purāṇa list / measures</span>
      <span class="legend-item"><i class="legend-swatch pilgrimage" aria-hidden="true"></i>Tīrtha / sacred places</span>
      <span class="legend-item"><i class="legend-swatch mahatmya" aria-hidden="true"></i>Bhāgavata-māhātmya</span>
      <span class="legend-item"><i class="legend-swatch subject" aria-hidden="true"></i>Other subject</span>
      <span class="legend-item"><i class="legend-dot" aria-hidden="true"></i>Unmatched citation</span>
    </div>
    <main id="map" aria-live="polite"></main>
  </div>
  <script>
    (() => {
      const map = document.getElementById("map");
      const select = document.getElementById("purana");
      let data = null;
      let selectedTile = null;
      let selectedDetail = null;

      function chapterNumber(section, chapter) {
        return (section.numbering ? section.numbering + "." : "") + chapter;
      }

      function expandChapterSpec(spec) {
        const out = [];
        for (const item of String(spec).split(",")) {
          const match = item.trim().match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);
          if (!match) continue;
          const first = Number(match[1]);
          const last = Number(match[2] || match[1]);
          for (let n = first; n <= last; n += 1) out.push(String(n));
        }
        return out;
      }

      function addGroup(parent, label, entries, type, section = null) {
        if (!entries || !entries.length) return;
        const group = document.createElement("section");
        group.className = "group";
        const heading = document.createElement("h3");
        heading.textContent = label;
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          if (type === "quoted") {
            const work = document.createElement("span");
            work.className = "work";
            const name = entry.work === "Work title unclear" ? "Work not identified" : entry.work;
            const author = entry.author?.trim() || "Author not identified";
            work.textContent = `${name} — ${author}`;
            item.appendChild(work);
            if (entry.refs?.length) {
              const refs = document.createElement("span");
              refs.className = "refs";
              refs.textContent = entry.refs.map(ref => {
                const scoped = section?.part && !section.prefix ? section.part + " " + ref : ref;
                return scoped.replace(/–\?/g, "–[end unclear]");
              }).join(", ");
              item.appendChild(refs);
            }
            if (entry.refs?.some(ref => ref.includes("–?"))) {
              const note = document.createElement("span");
              note.className = "note";
              note.textContent = "One or more range endpoints are unreadable.";
              item.appendChild(note);
            }
            if (entry.note) {
              const note = document.createElement("span");
              note.className = "note";
              note.textContent = entry.note;
              item.appendChild(note);
            }
          } else if (type === "parallel" || type === "chapterRelations") {
            const pair = document.createElement("span");
            pair.className = "pair";
            const refs = Array.isArray(entry.members)
              ? entry.members
              : [entry.left, entry.right].filter(Boolean);
            pair.textContent = refs.join(" ↔ ");
            item.appendChild(pair);
            if (type === "chapterRelations" && !entry.note) {
              const levelNote = document.createElement("span");
              levelNote.className = "note";
              levelNote.textContent = "Chapter link only; no verse-to-verse match is stated.";
              item.appendChild(levelNote);
            }
            if (entry.note) {
              const note = document.createElement("span");
              note.className = "note";
              note.textContent = entry.note;
              item.appendChild(note);
            }
          } else {
            if (entry.work) {
              const work = document.createElement("span");
              work.className = "work";
              const author = entry.author?.trim() || "Author not identified";
              work.textContent = `${entry.work} — ${author}`;
              item.appendChild(work);
            }
            if (entry.refs && entry.refs.length) {
              const refs = document.createElement("span");
              refs.className = "refs";
              refs.textContent = entry.refs.join(", ");
              item.appendChild(refs);
            }
            const note = document.createElement("span");
            note.className = "note";
            note.textContent = entry.note || "Quoted line not located.";
            item.appendChild(note);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function addContentsGroup(parent, entries) {
        if (!entries?.length) return;
        const group = document.createElement("section");
        group.className = "group";
        const heading = document.createElement("h3");
        heading.textContent = "Contents";
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          const title = document.createElement(entry.url ? "a" : "span");
          title.className = entry.url ? "work work-link" : "work";
          title.textContent = entry.label;
          if (entry.url) {
            title.href = entry.url;
            title.target = "_blank";
            title.rel = "noopener noreferrer";
          }
          const ref = document.createElement("span");
          ref.className = "refs";
          ref.textContent = entry.ref;
          item.append(title, ref);
          if (entry.details?.length) {
            const details = document.createElement("span");
            details.className = "refs contents-details";
            details.textContent = entry.details.join(" · ");
            item.appendChild(details);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function addTaggedGroup(parent, headingText, entries) {
        if (!entries?.length) return;
        const group = document.createElement("section");
        group.className = "group";
        const heading = document.createElement("h3");
        heading.textContent = headingText;
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          const label = document.createElement("span");
          label.className = "work";
          label.textContent = entry.label;
          const ref = document.createElement("span");
          ref.className = "refs";
          ref.textContent = entry.ref;
          item.append(label, ref);
          if (entry.details?.length) {
            const details = document.createElement("span");
            details.className = "refs contents-details";
            details.textContent = entry.details.join(" · ");
            item.appendChild(details);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function addTextReferencesGroup(parent, entries) {
        if (!entries?.length) return;
        const group = document.createElement("section");
        group.className = "group";
        const heading = document.createElement("h3");
        heading.textContent = "Textual reference";
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          const title = document.createElement("span");
          title.className = "work";
          title.textContent = entry.label;
          const ref = document.createElement("span");
          ref.className = "refs";
          ref.textContent = entry.ref;
          item.append(title, ref);
          if (entry.details?.length) {
            const details = document.createElement("span");
            details.className = "refs contents-details";
            details.textContent = entry.details.join(" · ");
            item.appendChild(details);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function applySubjectIndex(payload, subjectIndex) {
        const profiles = new Map(payload.puranas.map(item => [item.id, item]));
        for (const extra of subjectIndex.puranas || []) {
          if (!profiles.has(extra.id)) {
            payload.puranas.push(extra);
            profiles.set(extra.id, extra);
          }
        }
        for (const patch of subjectIndex.patches || []) {
          const purana = profiles.get(patch.id);
          const section = purana?.sections.find(item => item.id === patch.section);
          if (!section) continue;
          const current = section.chapters[patch.chapter] || {};
          for (const [field, value] of Object.entries(patch.record || {})) {
            if (!Array.isArray(value)) {
              current[field] = value;
              continue;
            }
            const entries = current[field] || (current[field] = []);
            for (const entry of value) {
              const key = JSON.stringify(entry);
              if (!entries.some(existing => JSON.stringify(existing) === key)) entries.push(entry);
            }
          }
          section.chapters[patch.chapter] = current;
        }
        return payload;
      }

      function showChapter(purana, section, chapter, record, tile, content) {
        if (selectedTile === tile) {
          selectedDetail?.remove();
          tile.setAttribute("aria-expanded", "false");
          selectedTile = null;
          selectedDetail = null;
          return;
        }
        if (selectedTile) selectedTile.setAttribute("aria-expanded", "false");
        selectedDetail?.remove();
        selectedTile = tile;
        tile.setAttribute("aria-expanded", "true");
        const detail = document.createElement("section");
        detail.className = "detail";
        detail.setAttribute("aria-label", "Chapter references");
        const title = document.createElement("h2");
        const sectionName = section.part || (section.book ? section.label : "");
        const chapterRef = chapterNumber(section, chapter);
        title.textContent = sectionName
          ? `${purana.name} · ${sectionName} · ${chapterRef}`
          : `${purana.name} ${chapterRef}`;
        detail.appendChild(title);
        addGroup(detail, "Quoted in", record.quoted, "quoted", section);
        addGroup(detail, "Parallel", record.parallel, "parallel");
        addGroup(detail, "Chapter link only", record.chapterRelations, "chapterRelations");
        addTextReferencesGroup(detail, record.textReferences);
        addContentsGroup(detail, record.contents);
        addTaggedGroup(detail, "Commentary", record.commentaryCitations);
        addTaggedGroup(detail, "Tīrtha / sacred places", record.topics?.filter(entry => entry.kind === "pilgrimage"));
        addTaggedGroup(detail, "Bhāgavata-māhātmya", record.topics?.filter(entry => entry.kind === "mahatmya"));
        addTaggedGroup(detail, "Subject", record.topics?.filter(entry => entry.kind === "subject"));
        addGroup(detail, "Unmatched", record.missing, "missing");
        if (!record.quoted?.length && !record.parallel?.length && !record.chapterRelations?.length && !record.textReferences?.length && !record.contents?.length && !record.commentaryCitations?.length && !record.topics?.length && !record.missing?.length) {
          const empty = document.createElement("p");
          empty.className = "no-entry";
          empty.textContent = "No indexed citation or subject for this chapter.";
          detail.appendChild(empty);
        }
        content.appendChild(detail);
        selectedDetail = detail;
        requestAnimationFrame(() => detail.scrollIntoView({ behavior: "smooth", block: "nearest" }));
      }

      function addAnalysis(puranas, combined = false) {
        let total = 0;
        let quotedChapters = 0;
        let parallelChapters = 0;
        let emptySectionChapters = 0;
        let parallelOnlyChapters = 0;
        let verseReferenceEntries = 0;
        let chapterLevelQuotes = 0;
        const verseComparisonEntries = new Set();
        const counterpartLoci = new Set();
        const selectedNames = new Set(puranas.map(purana => purana.name));
        for (const purana of puranas) {
          for (const section of purana.sections) {
            total += section.last;
            let sectionHasReferences = false;
            for (let chapter = 1; chapter <= section.last; chapter += 1) {
              const record = section.chapters[String(chapter)] || {};
              const hasQuoted = Boolean(record.quoted?.length);
              const hasParallel = Boolean(record.parallel?.some(entry => entry.level !== "chapter"));
              const hasChapterRelation = Boolean(record.chapterRelations?.length || record.parallel?.some(entry => entry.level === "chapter"));
              const hasContents = Boolean(record.contents?.length);
              const hasNote = Boolean(record.missing?.length);
              if (hasQuoted) {
                quotedChapters += 1;
                for (const witness of record.quoted) {
                  verseReferenceEntries += witness.refs?.length || 0;
                  if (!witness.refs?.length) chapterLevelQuotes += 1;
                }
              }
              if (hasParallel) {
                parallelChapters += 1;
                for (const entry of record.parallel) {
                  const key = JSON.stringify(entry);
                  if (entry.level !== "chapter") verseComparisonEntries.add(key);
                  if (entry.loci?.length) {
                    for (const source of entry.loci) {
                      if (!selectedNames.has(source.p)) continue;
                      for (const target of entry.loci) {
                        if (target.p === source.p) continue;
                        for (const chapter of expandChapterSpec(target.c)) {
                          counterpartLoci.add(target.p + "|" + target.s + "|" + chapter);
                        }
                      }
                    }
                  }
                }
              }
              if (hasParallel && !hasQuoted) parallelOnlyChapters += 1;
              if (hasQuoted || hasParallel || hasChapterRelation || hasContents || hasNote || record.textReferences?.length || record.commentaryCitations?.length || record.topics?.length) sectionHasReferences = true;
            }
            if (!sectionHasReferences) emptySectionChapters += section.last;
          }
        }
        const percent = (value, denominator) => denominator
          ? (100 * value / denominator).toFixed(1) + "%"
          : "—";
        const row = document.createElement("section");
        row.className = "section-row analysis-row";
        const heading = document.createElement("h2");
        heading.className = "section-label analysis-title";
        heading.textContent = combined ? "Combined analysis" : "Analysis";
        const content = document.createElement("div");
        content.className = "section-content";
        const metrics = document.createElement("dl");
        metrics.className = "analysis-grid";
        const quoteDetail = verseReferenceEntries.toLocaleString("en-GB") + " verse-reference entries · " +
          chapterLevelQuotes.toLocaleString("en-GB") + " chapter-level records";
        const parallelDetail = combined
          ? verseComparisonEntries.size.toLocaleString("en-GB") + " verse-paired comparison groups"
          : verseComparisonEntries.size.toLocaleString("en-GB") + " verse-paired groups · " +
            counterpartLoci.size.toLocaleString("en-GB") + " other-Purāṇa chapters";
        const values = [
          ["Total chapters", total.toLocaleString("en-GB"), "chapter slots in displayed sections"],
          ["Total chapters quoted", quotedChapters.toLocaleString("en-GB"), quoteDetail],
          ["Total chapters found parallel", parallelChapters.toLocaleString("en-GB"), parallelDetail],
          ["% quoted", percent(quotedChapters, total)],
          ["% found elsewhere", percent(parallelChapters, total)],
          ["% quoted · empty sections removed", percent(quotedChapters, total - emptySectionChapters)],
          ["% quoted · parallel-only chapters removed", percent(quotedChapters, total - parallelOnlyChapters)],
        ];
        for (const [label, value, detail] of values) {
          const item = document.createElement("div");
          item.className = "analysis-item";
          const term = document.createElement("dt");
          term.textContent = label;
          const number = document.createElement("dd");
          number.textContent = value;
          if (detail) {
            const small = document.createElement("small");
            small.textContent = detail;
            number.appendChild(small);
          }
          item.append(term, number);
          metrics.appendChild(item);
        }
        content.appendChild(metrics);
        row.append(heading, content);
        map.appendChild(row);
      }

      function renderMaps(puranas, combined = false) {
        selectedTile = null;
        selectedDetail = null;
        map.replaceChildren();
        for (const purana of puranas) {
          for (const section of purana.sections) {
            const row = document.createElement("section");
            row.className = "section-row";
            const label = document.createElement("div");
            label.className = "section-label";
            label.textContent = combined ? purana.name + " · " + section.label : section.label;
            const content = document.createElement("div");
            content.className = "section-content";
            const cells = document.createElement("div");
            cells.className = "cells";
            for (let chapter = 1; chapter <= section.last; chapter += 1) {
              const record = section.chapters[String(chapter)] || {};
              const hasQuoted = Boolean(record.quoted?.length);
              const hasParallel = Boolean(record.parallel?.some(entry => entry.level !== "chapter"));
              const hasChapterRelation = Boolean(record.chapterRelations?.length || record.parallel?.some(entry => entry.level === "chapter"));
              const hasMissing = Boolean(record.missing?.length);
              const hasContents = Boolean(record.contents?.length);
              const hasPilgrimage = Boolean(record.topics?.some(entry => entry.kind === "pilgrimage"));
              const hasMahatmya = Boolean(record.topics?.some(entry => entry.kind === "mahatmya"));
              const hasSubject = Boolean(record.topics?.some(entry => entry.kind === "subject"));
              const hasCommentary = Boolean(record.commentaryCitations?.length);
              const tile = document.createElement("button");
              tile.type = "button";
              tile.className = "tile";
              tile.textContent = String(chapter);
              tile.setAttribute("aria-expanded", "false");
              if (hasQuoted && hasParallel) tile.classList.add("both");
              else if (hasQuoted) tile.classList.add("quoted");
              else if (hasParallel) tile.classList.add("parallel");
              if (hasContents) tile.classList.add("contents");
              if (hasPilgrimage) tile.classList.add("pilgrimage");
              if (hasMahatmya) tile.classList.add("mahatmya");
              if (hasSubject) tile.classList.add("subject");
              if (hasChapterRelation) tile.classList.add("chapter-relation");
              if (hasCommentary) tile.classList.add("commentary");
              if (hasMissing) tile.classList.add("unmatched");
              const states = [
                hasQuoted && "quoted elsewhere",
                hasParallel && "verse parallel listed",
                hasChapterRelation && "chapter link only; no verse-to-verse match stated",
                hasContents && "lists Purāṇic contents",
                hasPilgrimage && "tīrtha or sacred-place material",
                hasMahatmya && "Bhāgavata-māhātmya",
                hasSubject && "subject note",
                hasCommentary && "commentary available",
                hasMissing && "unmatched quotation",
              ].filter(Boolean);
              tile.setAttribute("aria-label", purana.name + " · " + section.label + " · " +
                chapterNumber(section, chapter) + (states.length ? ": " + states.join("; ") : ": no located reference"));
              tile.title = purana.name + " · " + section.label + " · " + chapterNumber(section, chapter);
              tile.addEventListener("click", () => showChapter(purana, section, chapter, record, tile, content));
              cells.appendChild(tile);
            }
            content.appendChild(cells);
            row.append(label, content);
            map.appendChild(row);
          }
        }
        addAnalysis(puranas, combined);
      }

      function render(purana) {
        renderMaps([purana]);
      }

      function renderCombined() {
        renderMaps(data.puranas, true);
      }

      Promise.all([fetch("./data.json"), fetch("./subject-index.json")])
        .then(async ([dataResponse, subjectResponse]) => {
          if (!dataResponse.ok || !subjectResponse.ok) throw new Error("Chapter data unavailable");
          const [payload, subjectIndex] = await Promise.all([dataResponse.json(), subjectResponse.json()]);
          data = applySubjectIndex(payload, subjectIndex);
          const combinedOption = document.createElement("option");
          combinedOption.value = "all-combined";
          combinedOption.textContent = "All Purāṇas combined";
          select.appendChild(combinedOption);
          for (const purana of [...data.puranas].sort((a, b) => a.name.localeCompare(b.name, "en"))) {
            const option = document.createElement("option");
            option.value = purana.id;
            option.textContent = purana.name;
            select.appendChild(option);
          }
          select.value = data.default;
          if (!select.value && data.puranas.length) select.value = data.puranas[0].id;
          render(data.puranas.find(item => item.id === select.value));
          if (select.value === "all-combined") renderCombined();
          select.addEventListener("change", () => {
            if (select.value === "all-combined") {
              renderCombined();
              return;
            }
            const purana = data.puranas.find(item => item.id === select.value);
            if (purana) render(purana);
          });
        })
        .catch(() => {
          const error = document.createElement("p");
          error.className = "error";
          error.textContent = "Chapter data could not be loaded.";
          map.appendChild(error);
        });
    })();
  </script>
</body>
</html>
