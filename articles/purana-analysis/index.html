<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f8f4">
  <meta name="description" content="A chapter heat map of Purāṇic citations and inter-Purāṇa parallels.">
  <title>Purāṇa Analysis</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fff;
      --ink: #262821;
      --muted: #74766f;
      --rule: #e4e6df;
      --green: #dcebe0;
      --green-ink: #315d40;
      --violet: #ece5f2;
      --violet-ink: #674b7a;
      --blue: #dfeaf0;
      --blue-ink: #3e6274;
      --neutral: #f3f4f0;
      --amber: #f2e7cf;
      --amber-ink: #765a24;
      --subject: #edeee9;
      --serif: Georgia, "Times New Roman", serif;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 13px/1.45 var(--sans); }
    button { font: inherit; }
    :focus-visible { outline: 2px solid var(--green-ink); outline-offset: 2px; }
    .page { width: min(1280px, calc(100% - 48px)); margin: 0 auto; }
    .top { min-height: 42px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--rule); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .top a { color: inherit; text-decoration: none; }
    .top a:first-child { font-weight: 650; }
    .top a:last-child { color: var(--muted); }
    header { padding: 26px 0 18px; border-bottom: 1px solid var(--ink); }
    h1 { margin: 0; font: 400 clamp(32px, 4vw, 44px)/1.05 var(--serif); letter-spacing: -.035em; }
    .dek { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    .workspace { display: grid; grid-template-columns: 205px minmax(0, 1fr); gap: clamp(24px, 4vw, 54px); align-items: start; padding: 26px 0 0; }
    .contents-panel { position: sticky; top: 18px; min-width: 0; }
    .contents-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-bottom: 9px; border-bottom: 1px solid var(--rule); }
    .contents-heading h2 { margin: 0; font: 400 21px/1.1 var(--serif); }
    .contents-heading span { color: var(--muted); font-size: 9px; }
    #contents { display: flex; flex-direction: column; gap: 14px; margin-top: 13px; }
    .contents-button { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: baseline; gap: 8px; padding: 6px 7px; border: 0; border-left: 2px solid transparent; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
    .contents-button:hover { background: #f7f8f5; }
    .contents-button.active { border-left-color: var(--green-ink); background: #f0f5f1; }
    .contents-name { min-width: 0; font-size: 11px; line-height: 1.35; }
    .contents-category { color: var(--muted); font-size: 8px; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
    .evidence-count { color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
    .viewer { min-width: 0; }
    .selected-heading { display: flex; align-items: end; justify-content: space-between; gap: 18px; padding: 0 0 12px; border-bottom: 1px solid var(--ink); }
    .selected-category { margin: 0 0 4px; color: var(--muted); font-size: 9px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; }
    #selected-name { margin: 0; font: 400 clamp(25px, 3vw, 35px)/1.05 var(--serif); letter-spacing: -.03em; }
    .selected-evidence { margin: 0 0 2px; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 17px; padding: 10px 0 9px; border-bottom: 1px solid var(--rule); color: var(--muted); font-size: 10px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 10px; height: 10px; border-radius: 2px; background: #f1f2ee; }
    .legend-swatch.quoted { background: var(--green); }
    .legend-swatch.bhashya { background: var(--violet); }
    .legend-swatch.parallel { background: var(--blue); }
    .legend-swatch.mention { background: var(--amber); }
    .legend-swatch.subject { background: var(--subject); }
    .legend-swatch.none { border: 1px solid #e8e9e4; background: #f5f6f3; }
    #map { padding: 8px 0 22px; }
    .section-row { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--rule); }
    .section-label { padding-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .section-content { min-width: 0; }
    .cells { display: grid; grid-template-columns: repeat(auto-fill, 24px); gap: 3px; align-content: start; }
    .tile { position: relative; display: grid; place-items: center; width: 24px; height: 24px; padding: 0; border: 1px solid #e8e9e4; border-radius: 3px; color: #8a8d85; background: #f5f6f3; font-size: 10px; line-height: 1; font-variant-numeric: tabular-nums; cursor: pointer; }
    .tile.quoted { border-color: #bfd2c2; color: var(--green-ink); background: var(--green); font-weight: 650; }
    .tile.bhashya { border-color: #d3c4de; color: var(--violet-ink); background: var(--violet); }
    .tile.parallel { border-color: #c7d9e1; color: var(--blue-ink); background: var(--blue); font-weight: 650; }
    .tile.mention { border-color: #dfd0b1; color: var(--amber-ink); background: var(--amber); }
    .tile.subject { border-color: #d9ddd5; color: #565a52; background: var(--subject); }
    .tile.mixed { border-color: #d4d7d0; color: var(--ink); background: conic-gradient(from -45deg, var(--tile-evidence)); font-weight: 650; }
    .tile:hover, .tile[aria-expanded="true"] { border-color: var(--ink); }
    .tile[aria-expanded="true"] { box-shadow: inset 0 0 0 1px var(--ink); }
    .detail { margin: 6px 0 2px; padding: 9px 11px; border: 1px solid var(--rule); border-left: 2px solid var(--ink); border-radius: 3px; background: #fff; }
    .detail[hidden] { display: none; }
    .detail h2 { margin: 0 0 7px; font: 400 17px/1.2 var(--serif); }
    .group { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 5px 0 0; }
    .group + .group { margin-top: 4px; border-top: 1px solid #eff0ec; }
    .group h3 { margin: 2px 0 0; color: var(--muted); font: 650 9px/1.4 var(--sans); letter-spacing: .05em; text-transform: uppercase; }
    .group-quoted h3 { color: var(--green-ink); }
    .group-bhashya h3 { color: var(--violet-ink); }
    .group-parallel h3 { color: var(--blue-ink); }
    .group-mention h3 { color: var(--amber-ink); }
    .entries { min-width: 0; margin: 0; padding: 0; list-style: none; }
    .entry { padding: 1px 0 4px; overflow-wrap: anywhere; }
    .work { font-weight: 600; }
    .work-link { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 2px; }
    .refs { display: block; padding-top: 1px; color: #4e514b; font-variant-numeric: tabular-nums; }
    .pair { font-variant-numeric: tabular-nums; }
    .arrow { padding: 0 6px; color: var(--muted); }
    .note { display: block; padding-top: 2px; color: #6a6d65; font: italic 12px/1.4 var(--serif); }
    .no-entry { margin: 0; color: var(--muted); font-size: 11px; }
    .error { padding: 14px 0; color: #9b443c; }
    .commentary-panel { margin: 25px 0 42px; border-top: 1px solid var(--ink); }
    .commentary-disclosure > summary { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 13px 0; cursor: pointer; list-style: none; }
    .commentary-disclosure > summary::-webkit-details-marker { display: none; }
    .commentary-disclosure > summary::after { content: "+"; order: 2; color: var(--muted); }
    .commentary-disclosure[open] > summary::after { content: "−"; }
    .commentary-title { font: 400 22px/1.1 var(--serif); }
    .commentary-count { margin-left: auto; color: var(--muted); font-size: 10px; text-align: right; }
    .commentary-note { margin: 0 0 13px; color: var(--muted); font-size: 10px; }
    .commentary-section { margin: 15px 0 0; }
    .commentary-section h3 { margin: 0 0 6px; color: var(--muted); font-size: 9px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; }
    .commentary-grid { display: grid; grid-template-columns: 1fr; gap: 3px; }
    .commentary-card { min-width: 0; border-bottom: 1px solid var(--rule); }
    .commentary-card > summary { display: grid; grid-template-columns: minmax(0, 1fr) minmax(100px, .6fr) auto; align-items: baseline; gap: 10px; padding: 7px 2px; cursor: pointer; list-style: none; }
    .commentary-card > summary::-webkit-details-marker { display: none; }
    .commentary-card > summary::before { color: var(--muted); content: "+"; }
    .commentary-card[open] > summary::before { content: "−"; }
    .commentary-card h4 { grid-column: 2; grid-row: 1; margin: 0; font: 500 13px/1.3 var(--serif); }
    .commentary-author { grid-column: 2; grid-row: 2; margin: 0; color: var(--muted); font-size: 10px; }
    .commentary-period { grid-column: 3; grid-row: 1 / span 2; margin: 0; color: var(--muted); font-size: 9px; white-space: nowrap; }
    .commentary-body { padding: 0 0 9px 20px; }
    .commentary-scope, .commentary-body-note { margin: 3px 0; color: var(--muted); font-size: 10px; }
    .commentary-status { display: inline-block; margin-top: 5px; color: var(--green-ink); font-size: 9px; }
    .commentary-status.uncertain { color: var(--violet-ink); }
    .commentary-sources { display: flex; flex-wrap: wrap; gap: 4px 13px; margin-top: 5px; font-size: 9px; }
    .commentary-sources a, .source-list a { color: var(--green-ink); text-underline-offset: 2px; }
    .commentary-empty { margin: 8px 0 12px; color: var(--muted); font-size: 10px; }
    .source-details { margin: 17px 0 24px; padding-top: 9px; border-top: 1px solid var(--rule); }
    .source-details > summary { color: var(--muted); font-size: 10px; cursor: pointer; }
    .source-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 18px; margin-top: 9px; font-size: 9px; }
    .source-limit { margin: 9px 0 0; color: var(--muted); font-size: 9px; }
    @media (max-width: 760px) {
      .page { width: calc(100% - 28px); }
      header { padding: 21px 0 14px; }
      .workspace { grid-template-columns: 1fr; gap: 18px; padding-top: 18px; }
      .contents-panel { position: static; }
      #contents { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
      .contents-group { min-width: 0; }
      .section-row { grid-template-columns: 82px minmax(0, 1fr); gap: 7px; }
      .section-label { font-size: 9px; }
      .cells { grid-template-columns: repeat(auto-fill, 22px); gap: 2px; }
      .tile { width: 22px; height: 22px; }
      .group { grid-template-columns: 72px minmax(0, 1fr); gap: 7px; }
      .commentary-card > summary { grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; }
      .commentary-card > summary::before { grid-column: 1; grid-row: 1 / span 2; }
      .commentary-card h4, .commentary-author { grid-column: 2; }
      .commentary-period { grid-column: 2; grid-row: 3; }
      .source-list { grid-template-columns: 1fr; }
    }
  
    /* Quiet, compact layout: keep the data, remove the extra framing. */
    .page { width: min(1400px, calc(100% - 44px)); }
    header { padding: 15px 0 11px; border-bottom-color: var(--rule); }
    h1 { font-size: 23px; }
    .dek, .contents-heading span { display: none; }
    .workspace { grid-template-columns: 250px minmax(0, 1fr); gap: clamp(24px, 3vw, 42px); padding-top: 18px; }
    .contents-heading { padding-bottom: 8px; }
    .contents-heading h2 { font-size: 18px; }
    #contents { gap: 1px; margin-top: 5px; max-height: calc(100vh - 112px); overflow-y: auto; }
    .contents-button { padding: 5px 7px; }
    .selected-evidence { font-size: 11px; }
    .legend { gap: 6px 14px; padding: 9px 0 8px; font-size: 9px; }
    .section-row { padding: 5px 0; }
    .commentary-panel { margin-top: 18px; }
    .commentary-title { font-size: 19px; }
    .commentary-search { width: min(100%, 320px); margin: 0 0 12px; padding: 7px 9px; border: 1px solid var(--rule); border-radius: 3px; font-size: 11px; }
    .commentary-card[hidden], .commentary-section[hidden] { display: none; }
    .group-quoted { border-left-color: var(--green-ink); }
    .group-parallel { border-left-color: var(--blue-ink); }
    .group-bhashya, .group-chapterRelations { border-left-color: var(--violet-ink); }
    .group-other, .group-missing { border-left-color: #b8bcb4; }
    @media (max-width: 760px) {
      .page { width: calc(100% - 28px); }
      .workspace { grid-template-columns: 1fr; gap: 15px; padding-top: 14px; }
      #contents { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px 10px; max-height: none; }
    }
    .view-tabs { display: flex; gap: 18px; margin: 0 0 2px; border-bottom: 1px solid var(--rule); }
    .view-tab { display: inline-flex; align-items: baseline; gap: 6px; padding: 8px 0; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; }
    .view-tab.active { border-bottom-color: var(--ink); color: var(--ink); }
    .view-count { color: var(--muted); font-size: 9px; font-variant-numeric: tabular-nums; }
    #map-pane[hidden], .commentary-panel[hidden] { display: none; }
    .commentary-panel { margin: 0 0 42px; border-top: 0; }
    .commentary-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 11px 0 5px; border-bottom: 1px solid var(--rule); }
    .commentary-title { font: 400 19px/1.1 var(--serif); }
    .commentary-note { margin: 0; color: var(--muted); font-size: 9px; }
    .commentary-search { margin-top: 10px; }
    .commentary-status.boundary { color: var(--blue-ink); }
    .commentary-empty { padding: 6px 0; }
    @media (max-width: 760px) {
      .commentary-head { align-items: start; flex-direction: column; gap: 4px; }
    }
    /* Grouped contents keep the side index scannable. */
    #contents { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
    .contents-group-title { margin: 0 0 5px; color: var(--muted); font-size: 9px; font-weight: 650; letter-spacing: .07em; text-transform: uppercase; }
    .contents-list { display: flex; flex-direction: column; gap: 1px; }
    .contents-button { grid-template-columns: minmax(0, 1fr) auto; gap: 7px; padding: 5px 7px; }
    .contents-name { grid-column: 1; grid-row: 1; }
    .evidence-count { grid-column: 2; grid-row: 1; align-self: center; }
    .contents-category { display: none; }
    .legend { gap: 6px 12px; }
    @media (max-width: 760px) {
      #contents { display: flex; flex-direction: column; gap: 13px; max-height: none; }
      .contents-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 8px; }
    }
    .commentary-section-collapsed { margin-top: 13px; border-top: 1px solid var(--rule); }
    .commentary-section-summary { padding: 7px 0; color: var(--muted); font-size: 10px; cursor: pointer; list-style: none; }
    .commentary-section-summary::-webkit-details-marker { display: none; }
    .commentary-section-summary::after { float: right; content: "+"; }
    .commentary-section-collapsed[open] > .commentary-section-summary::after { content: "−"; }
  </style>
</head>
<body>
  <div class="page">
    <nav class="top" aria-label="Site">
      <a href="/advaita/">Viveka Dṛṣṭi</a>
      <a href="/advaita/pages/purana-library/">Purāṇa Library</a>
    </nav>
    <header>
      <h1>Purāṇa Analysis</h1>
      
    </header>
    <div class="workspace">
      <aside class="contents-panel" aria-label="Purāṇa contents">
        <div class="contents-heading">
          <h2>Contents</h2>
          
        </div>
        <nav id="contents" aria-label="Purāṇas"></nav>
      </aside>
      <div class="viewer">
        <div class="selected-heading">
          <div>
            <p id="selected-category" class="selected-category">Loading</p>
            <h2 id="selected-name">Purāṇas</h2>
          </div>
          <p id="selected-evidence" class="selected-evidence"></p>
        </div>
    <nav class="view-tabs" aria-label="Selected Purāṇa view">
      <button id="citations-tab" class="view-tab active" type="button" aria-pressed="true">Citations</button>
      <button id="bhashyas-tab" class="view-tab" type="button" aria-pressed="false">Bhāṣyas <span id="commentary-count" class="view-count"></span></button>
    </nav>
    <div id="map-pane">
      <div class="legend" aria-label="Heat map key">
        <span class="legend-item"><i class="legend-swatch none" aria-hidden="true"></i>None</span>
        <span class="legend-item"><i class="legend-swatch quoted" aria-hidden="true"></i>Quoted</span>
        <span class="legend-item"><i class="legend-swatch bhashya" aria-hidden="true"></i>Commentary</span>
        <span class="legend-item"><i class="legend-swatch parallel" aria-hidden="true"></i>Parallel</span>
        <span class="legend-item"><i class="legend-swatch mention" aria-hidden="true"></i>Purāṇa mention</span>
        <span class="legend-item"><i class="legend-swatch subject" aria-hidden="true"></i>Subject</span>
      </div>
      <main id="map" aria-live="polite"></main>
    </div>
    <section id="commentary-panel" class="commentary-panel" aria-labelledby="commentary-heading" hidden>
      <div class="commentary-head">
        <h2 id="commentary-heading" class="commentary-title">Bhāṣyas</h2>
        <span class="commentary-note">Through Nīlakaṇṭha · late 17th c.</span>
      </div>
      <input id="commentary-search" class="commentary-search" type="search" placeholder="Search title or author" aria-label="Search bhāṣya titles, authors, scope, or date">
      <div id="commentary-list"></div>
      <details class="source-details">
        <summary>Sources</summary>
        <div id="commentary-sources" class="source-list"></div>
        <p class="source-limit">Later works excluded · unclear dates uncounted.</p>
      </details>
    </section>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const map = document.getElementById("map");
      const contents = document.getElementById("contents");
      const selectedName = document.getElementById("selected-name");
      const selectedCategory = document.getElementById("selected-category");
      const selectedEvidence = document.getElementById("selected-evidence");
      const commentaryList = document.getElementById("commentary-list");
      const commentarySearch = document.getElementById("commentary-search");
      const commentaryCount = document.getElementById("commentary-count");
      const commentarySources = document.getElementById("commentary-sources");
      const citationsTab = document.getElementById("citations-tab");
      const bhashyasTab = document.getElementById("bhashyas-tab");
      const mapPane = document.getElementById("map-pane");
      const commentaryPanel = document.getElementById("commentary-panel");
      let commentaryData = null;
      let data = null;
      let selectedTile = null;
      let selectedDetail = null;

      function chapterNumber(section, chapter) {
        return (section.numbering ? section.numbering + "." : "") + chapter;
      }

      function expandChapterSpec(spec) {
        const out = [];
        for (const item of String(spec).split(",")) {
          const match = item.trim().match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);
          if (!match) continue;
          const first = Number(match[1]);
          const last = Number(match[2] || match[1]);
          for (let n = first; n <= last; n += 1) out.push(String(n));
        }
        return out;
      }

      function addGroup(parent, label, entries, type, section = null) {
        if (!entries || !entries.length) return;
        const group = document.createElement("section");
        group.className = "group group-" + (type === "chapterRelations" ? "mention" : type === "missing" ? "subject" : type);
        const heading = document.createElement("h3");
        heading.textContent = label;
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          if (type === "quoted") {
            const work = document.createElement("span");
            work.className = "work";
            const name = entry.work === "Work title unclear" ? "Work not identified" : entry.work;
            const author = entry.author?.trim() || "Author not identified";
            work.textContent = `${name} — ${author}`;
            item.appendChild(work);
            if (entry.refs?.length) {
              const refs = document.createElement("span");
              refs.className = "refs";
              refs.textContent = entry.refs.map(ref => {
                const scoped = section?.part && !section.prefix ? section.part + " " + ref : ref;
                return scoped.replace(/–\?/g, "–[end unclear]");
              }).join(", ");
              item.appendChild(refs);
            }
            if (entry.refs?.some(ref => ref.includes("–?"))) {
              const note = document.createElement("span");
              note.className = "note";
              note.textContent = "One or more range endpoints are unreadable.";
              item.appendChild(note);
            }
            if (entry.note) {
              const note = document.createElement("span");
              note.className = "note";
              note.textContent = entry.note;
              item.appendChild(note);
            }
          } else if (type === "parallel" || type === "chapterRelations") {
            const pair = document.createElement("span");
            pair.className = "pair";
            const refs = Array.isArray(entry.members)
              ? entry.members
              : [entry.left, entry.right].filter(Boolean);
            pair.textContent = refs.join(" ↔ ");
            item.appendChild(pair);
            if (entry.note) {
              const note = document.createElement("span");
              note.className = "note";
              note.textContent = entry.note;
              item.appendChild(note);
            }
          } else {
            if (entry.work) {
              const work = document.createElement("span");
              work.className = "work";
              const author = entry.author?.trim() || "Author not identified";
              work.textContent = `${entry.work} — ${author}`;
              item.appendChild(work);
            }
            if (entry.refs && entry.refs.length) {
              const refs = document.createElement("span");
              refs.className = "refs";
              refs.textContent = entry.refs.join(", ");
              item.appendChild(refs);
            }
            const note = document.createElement("span");
            note.className = "note";
            note.textContent = entry.note || "Quoted line not located.";
            item.appendChild(note);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function addContentsGroup(parent, entries) {
        if (!entries?.length) return;
        const group = document.createElement("section");
        group.className = "group group-other";
        const heading = document.createElement("h3");
        heading.textContent = "Contents";
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          const title = document.createElement(entry.url ? "a" : "span");
          title.className = entry.url ? "work work-link" : "work";
          title.textContent = entry.label;
          if (entry.url) {
            title.href = entry.url;
            title.target = "_blank";
            title.rel = "noopener noreferrer";
          }
          const ref = document.createElement("span");
          ref.className = "refs";
          ref.textContent = entry.ref;
          item.append(title, ref);
          if (entry.details?.length) {
            const details = document.createElement("span");
            details.className = "refs contents-details";
            details.textContent = entry.details.join(" · ");
            item.appendChild(details);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function addTaggedGroup(parent, headingText, entries) {
        if (!entries?.length) return;
        const isCommentary = /commentary/i.test(headingText);
        const group = document.createElement("section");
        group.className = "group " + (isCommentary ? "group-bhashya" : "group-subject");
        const heading = document.createElement("h3");
        heading.textContent = headingText;
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          const label = document.createElement("span");
          label.className = "work";
          label.textContent = entry.label;
          const ref = document.createElement("span");
          ref.className = "refs";
          ref.textContent = entry.ref;
          item.append(label, ref);
          const detailsText = (entry.details || [])
            .filter(text => !/^Full chapter commentary; not an external quotation\.?$/i.test(text))
            .join(" · ");
          if (detailsText) {
            const details = document.createElement("span");
            details.className = "refs contents-details";
            details.textContent = detailsText;
            item.appendChild(details);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function addTextReferencesGroup(parent, entries) {
        if (!entries?.length) return;
        const group = document.createElement("section");
        group.className = "group group-other";
        const heading = document.createElement("h3");
        heading.textContent = "Textual reference";
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          const title = document.createElement("span");
          title.className = "work";
          title.textContent = entry.label;
          const ref = document.createElement("span");
          ref.className = "refs";
          ref.textContent = entry.ref;
          item.append(title, ref);
          if (entry.details?.length) {
            const details = document.createElement("span");
            details.className = "refs contents-details";
            details.textContent = entry.details.join(" · ");
            item.appendChild(details);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function evidenceCount(purana) {
        const fields = ["quoted", "parallel", "chapterRelations", "textReferences", "contents", "commentaryCitations", "topics"];
        const repeatedRelations = { parallel: new Set(), chapterRelations: new Set() };
        let count = 0;
        for (const section of purana.sections || []) {
          for (const record of Object.values(section.chapters || {})) {
            for (const field of fields) {
              const entries = record[field] || [];
              if (field === "parallel" || field === "chapterRelations") {
                for (const entry of entries) {
                  const key = JSON.stringify(entry);
                  if (!repeatedRelations[field].has(key)) {
                    repeatedRelations[field].add(key);
                    count += 1;
                  }
                }
              } else {
                count += entries.length;
              }
            }
          }
        }
        return count;
      }

      function applySubjectIndex(payload, subjectIndex) {
        const profiles = new Map(payload.puranas.map(item => [item.id, item]));
        for (const extra of subjectIndex.puranas || []) {
          if (!profiles.has(extra.id)) {
            payload.puranas.push(extra);
            profiles.set(extra.id, extra);
          }
        }
        for (const patch of subjectIndex.patches || []) {
          const purana = profiles.get(patch.id);
          const section = purana?.sections.find(item => item.id === patch.section);
          if (!section) continue;
          const current = section.chapters[patch.chapter] || {};
          for (const [field, value] of Object.entries(patch.record || {})) {
            if (!Array.isArray(value)) {
              current[field] = value;
              continue;
            }
            const entries = current[field] || (current[field] = []);
            for (const entry of value) {
              const key = JSON.stringify(entry);
              if (!entries.some(existing => JSON.stringify(existing) === key)) entries.push(entry);
            }
          }
          section.chapters[patch.chapter] = current;
        }
        payload.puranas = payload.puranas.filter(item => evidenceCount(item) > 0);
        return payload;
      }

      function showChapter(purana, section, chapter, record, tile, content) {
        if (selectedTile === tile) {
          selectedDetail?.remove();
          tile.setAttribute("aria-expanded", "false");
          selectedTile = null;
          selectedDetail = null;
          return;
        }
        if (selectedTile) selectedTile.setAttribute("aria-expanded", "false");
        selectedDetail?.remove();
        selectedTile = tile;
        tile.setAttribute("aria-expanded", "true");
        const detail = document.createElement("section");
        detail.className = "detail";
        detail.setAttribute("aria-label", "Chapter evidence");
        const title = document.createElement("h2");
        const sectionName = section.part || (section.book ? section.label : "");
        const chapterRef = chapterNumber(section, chapter);
        title.textContent = sectionName
          ? `${purana.name} · ${sectionName} · ${chapterRef}`
          : `${purana.name} ${chapterRef}`;
        detail.appendChild(title);

        const chapterCitations = (record.quoted || []).filter(entry =>
          entry.refs?.length || /chapter cited/i.test(entry.note || "")
        );
        addGroup(detail, "Quoted", chapterCitations, "quoted", section);
        addGroup(detail, "Parallel", (record.parallel || []).filter(entry => entry.level !== "chapter"), "parallel");
        const chapterRelations = [
          ...(record.chapterRelations || []),
          ...(record.parallel || []).filter(entry => entry.level === "chapter")
        ];
        addGroup(detail, "Chapter relation", chapterRelations, "chapterRelations");
        addTextReferencesGroup(detail, record.textReferences);
        addContentsGroup(detail, record.contents);
        addTaggedGroup(detail, "Commentary", record.commentaryCitations);
        addTaggedGroup(detail, "Subject", record.topics);
        addGroup(detail, "Unmatched", record.missing, "missing");
        const hasRecord = ["quoted", "parallel", "chapterRelations", "textReferences", "contents", "commentaryCitations", "topics", "missing"]
          .some(field => record[field]?.length);
        if (!hasRecord) {
          const empty = document.createElement("p");
          empty.className = "no-entry";
          empty.textContent = "No attestation.";
          detail.appendChild(empty);
        }
        content.appendChild(detail);
        selectedDetail = detail;
        requestAnimationFrame(() => detail.scrollIntoView({ behavior: "smooth", block: "nearest" }));
      }

      function renderMaps(puranas) {
        selectedTile = null;
        selectedDetail = null;
        map.replaceChildren();
        const colorFor = {
          quoted: "var(--green)",
          bhashya: "var(--violet)",
          parallel: "var(--blue)",
          mention: "var(--amber)",
          subject: "var(--subject)"
        };
        for (const purana of puranas) {
          for (const section of purana.sections) {
            const row = document.createElement("section");
            row.className = "section-row";
            const label = document.createElement("div");
            label.className = "section-label";
            label.textContent = section.label;
            const content = document.createElement("div");
            content.className = "section-content";
            const cells = document.createElement("div");
            cells.className = "cells";
            for (let chapter = 1; chapter <= section.last; chapter += 1) {
              const record = section.chapters[String(chapter)] || {};
              const quoteEntries = record.quoted || [];
              const isChapterCitation = entry => /chapter cited/i.test(entry.note || "");
              const evidence = [];
              if (quoteEntries.some(entry => entry.refs?.length || isChapterCitation(entry))) evidence.push("quoted");
              if (quoteEntries.some(entry => !entry.refs?.length && !isChapterCitation(entry)) || record.commentaryCitations?.length) evidence.push("bhashya");
              if (record.parallel?.some(entry => entry.level !== "chapter")) evidence.push("parallel");
              if (
                record.puranaMentions?.length ||
                record.textReferences?.length ||
                record.contents?.length ||
                record.chapterRelations?.length ||
                record.parallel?.some(entry => entry.level === "chapter") ||
                record.topics?.some(entry => /purana|puranic/i.test([entry.label, ...(entry.details || [])].join(" ")))
              ) evidence.push("mention");
              if (record.topics?.some(entry => !/purana|puranic/i.test([entry.label, ...(entry.details || [])].join(" "))) || record.missing?.length) evidence.push("subject");

              const tile = document.createElement("button");
              tile.type = "button";
              tile.className = "tile";
              tile.textContent = String(chapter);
              tile.setAttribute("aria-expanded", "false");
              tile.dataset.evidence = evidence.join(" ") || "none";
              if (evidence.length === 1) tile.classList.add(evidence[0]);
              else if (evidence.length > 1) {
                tile.classList.add("mixed");
                const step = 360 / evidence.length;
                const wedges = evidence.map((kind, index) =>
                  `${colorFor[kind]} ${index * step}deg ${(index + 1) * step}deg`
                ).join(", ");
                tile.style.setProperty("--tile-evidence", wedges);
              }
              const labels = {
                quoted: "quoted",
                bhashya: "commentary",
                parallel: "parallel",
                mention: "Purāṇa mention or list",
                subject: "subject"
              };
              const states = evidence.map(kind => labels[kind]);
              const evidenceLabel = states.join("; ") || "no attestation";
              tile.setAttribute("aria-label", purana.name + " · " + section.label + " · " +
                chapterNumber(section, chapter) + ": " + evidenceLabel);
              tile.title = purana.name + " · " + section.label + " · " + chapterNumber(section, chapter) + " · " + evidenceLabel;
              tile.addEventListener("click", () => showChapter(purana, section, chapter, record, tile, content));
              cells.appendChild(tile);
            }
            content.appendChild(cells);
            row.append(label, content);
            map.appendChild(row);
          }
        }
      }

      const upaIds = new Set([
        "brhannaradiya-purana",
        "devi-bhagavata-purana",
        "devi-purana",
        "kalika-purana",
        "mahabhagavata-purana",
        "brhaddharma-purana",
        "narasimha-purana",
        "kriyayogasara",
        "kalki-purana",
        "samba-purana"
      ]);

      function categoryFor(purana) {
        return upaIds.has(purana.id) ? "Upa" : "Mahā";
      }

      function setActiveContents(id) {
        for (const button of document.querySelectorAll(".contents-button[data-purana]")) {
          const active = button.dataset.purana === id;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        }
      }

      function renderContents() {
        contents.replaceChildren();
        const items = [...data.puranas].sort((a, b) =>
          evidenceCount(b) - evidenceCount(a) || a.name.localeCompare(b.name, "en")
        );
        const categories = ["Mahā", "Upa"];
        for (const categoryName of categories) {
          const members = items.filter(item => categoryFor(item) === categoryName);
          if (!members.length) continue;
          const group = document.createElement("section");
          group.className = "contents-group";
          const heading = document.createElement("h3");
          heading.className = "contents-group-title";
          heading.textContent = categoryName === "Upa" ? "Upapurāṇas" : "Mahāpurāṇas";
          const list = document.createElement("div");
          list.className = "contents-list";
          for (const purana of members) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "contents-button";
            button.dataset.purana = purana.id;
            button.setAttribute("aria-pressed", "false");

            const name = document.createElement("span");
            name.className = "contents-name";
            name.textContent = purana.name;
            const count = document.createElement("span");
            count.className = "evidence-count";
            count.textContent = evidenceCount(purana).toLocaleString();
            count.setAttribute("aria-label", evidenceCount(purana).toLocaleString() + " evidence records");
            button.append(name, count);
            button.addEventListener("click", () => render(purana));
            list.appendChild(button);
          }
          group.append(heading, list);
          contents.appendChild(group);
        }
      }

      function addCommentarySection(label, items, status, collapsible = false) {
        if (!items.length) return;
        const section = document.createElement(collapsible ? "details" : "section");
        section.className = "commentary-section" + (collapsible ? " commentary-section-collapsed" : "");
        const heading = document.createElement(collapsible ? "summary" : "h3");
        if (collapsible) heading.className = "commentary-section-summary";
        heading.textContent = collapsible ? label + " · " + items.length : label;
        const grid = document.createElement("div");
        grid.className = "commentary-grid";
        for (const entry of items) {
          const card = document.createElement("details");
          card.className = "commentary-card";
          card.dataset.search = [entry.work, entry.author, entry.scope, entry.period, entry.note].join(" ").toLocaleLowerCase();

          const summary = document.createElement("summary");
          const work = document.createElement("h4");
          work.textContent = entry.work;
          const author = document.createElement("p");
          author.className = "commentary-author";
          author.textContent = entry.author;
          const period = document.createElement("p");
          period.className = "commentary-period";
          period.textContent = entry.period;
          summary.append(work, author, period);

          const body = document.createElement("div");
          body.className = "commentary-body";
          const scope = document.createElement("p");
          scope.className = "commentary-scope";
          scope.textContent = entry.scope;
          body.appendChild(scope);
          if (entry.note) {
            const note = document.createElement("p");
            note.className = "commentary-body-note";
            note.textContent = entry.note;
            body.appendChild(note);
          }

          const sources = document.createElement("div");
          sources.className = "commentary-sources";
          for (const sourceId of [...new Set(entry.sourceIds || [])]) {
            const source = commentaryData.sources[sourceId];
            if (!source) continue;
            const link = document.createElement("a");
            link.href = source.url;
            link.target = "_blank";
            link.rel = "noreferrer";
            link.textContent = source.label;
            sources.appendChild(link);
          }
          if (sources.childElementCount) body.appendChild(sources);
          card.append(summary, body);
          grid.appendChild(card);
        }
        section.append(heading, grid);
        commentaryList.appendChild(section);
      }

      function renderCommentaries(puranaId) {
        commentaryList.replaceChildren();
        const entries = commentaryData.entries.filter(entry =>
          entry.puranaId === puranaId && entry.status !== "post-cutoff"
        );
        const dated = entries.filter(entry => entry.status === "within-cutoff");
        const boundary = entries.filter(entry => entry.status === "boundary");
        const unresolved = entries.filter(entry => entry.status === "date-unverified");
        const verifiedCount = dated.length + boundary.length;
        commentaryCount.textContent = verifiedCount.toLocaleString();
        commentaryCount.title = `${verifiedCount} dated through Nīlakaṇṭha · ${unresolved.length} date unclear`;
        commentarySearch.value = "";
        addCommentarySection("Before Nīlakaṇṭha", dated, "within-cutoff");
        addCommentarySection("Nīlakaṇṭha", boundary, "boundary");
        addCommentarySection("Date unclear", unresolved, "date-unverified", true);
        if (verifiedCount === 0) {
          const note = document.createElement("p");
          note.className = "commentary-empty";
          note.textContent = "No dated bhāṣya found.";
          commentaryList.appendChild(note);
        }
        commentarySearch.oninput = () => {
          const query = commentarySearch.value.trim().toLocaleLowerCase();
          for (const section of commentaryList.querySelectorAll(".commentary-section")) {
            const cards = [...section.querySelectorAll(".commentary-card")];
            const shown = cards.filter(card => {
              const match = !query || card.dataset.search.includes(query);
              card.hidden = !match;
              return match;
            }).length;
            section.hidden = shown === 0;
            if (section.tagName === "DETAILS") section.open = Boolean(query && shown);
          }
        };
      }

      function setView(view) {
        const showBhashyas = view === "bhashyas";
        mapPane.hidden = showBhashyas;
        commentaryPanel.hidden = !showBhashyas;
        citationsTab.classList.toggle("active", !showBhashyas);
        bhashyasTab.classList.toggle("active", showBhashyas);
        citationsTab.setAttribute("aria-pressed", String(!showBhashyas));
        bhashyasTab.setAttribute("aria-pressed", String(showBhashyas));
      }

      citationsTab.addEventListener("click", () => setView("citations"));
      bhashyasTab.addEventListener("click", () => setView("bhashyas"));
      function renderSourceList() {
        commentarySources.replaceChildren();
        const sources = Object.values(commentaryData.sources)
          .map(source => [source.label, source.url]);
        const seen = new Set();
        for (const [label, url] of sources) {
          const key = url;
          if (seen.has(key)) continue;
          seen.add(key);
          const link = document.createElement("a");
          link.href = url;
          link.target = "_blank";
          link.rel = "noreferrer";
          link.textContent = label;
          commentarySources.appendChild(link);
        }
      }

      function render(purana) {
        if (!purana) return;
        setActiveContents(purana.id);
        selectedCategory.textContent = categoryFor(purana);
        selectedName.textContent = purana.name;
        selectedEvidence.textContent = evidenceCount(purana).toLocaleString();
        selectedEvidence.title = evidenceCount(purana).toLocaleString() + " evidence records";
        renderMaps([purana]);
        renderCommentaries(purana.id);
      }

      Promise.all([fetch("./data.json"), fetch("./subject-index.json"), fetch("./commentaries.json")])
        .then(async ([dataResponse, subjectResponse, commentaryResponse]) => {
          if (!dataResponse.ok || !subjectResponse.ok || !commentaryResponse.ok) throw new Error("Chapter data unavailable");
          const [payload, subjectIndex, commentaryPayload] = await Promise.all([
            dataResponse.json(), subjectResponse.json(), commentaryResponse.json()
          ]);
          data = applySubjectIndex(payload, subjectIndex);
          data.puranas = data.puranas.filter(item => evidenceCount(item) > 0);
          commentaryData = commentaryPayload;
          renderSourceList();
          renderContents();
          const initial = data.puranas.find(item => item.id === data.default) || data.puranas[0];
          render(initial);
        })        .catch(() => {
          const error = document.createElement("p");
          error.className = "error";
          error.textContent = "Chapter data could not be loaded.";
          map.appendChild(error);
        });
    })();
  </script>
</body>
</html>
