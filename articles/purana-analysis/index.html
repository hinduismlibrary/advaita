<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f8f8f4">
  <meta name="description" content="A chapter heat map of Purāṇic citations and exact textual parallels.">
  <title>Purāṇa Analysis</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f8f4;
      --ink: #252823;
      --muted: #72766e;
      --rule: #d7d9d1;
      --empty: #eeefe9;
      --green: #bfd4c3;
      --green-ink: #244c35;
      --blue: #c3d7dc;
      --blue-ink: #28515b;
      --red: #a4473b;
      --serif: Georgia, 'Times New Roman', serif;
      --sans: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 13px/1.42 var(--sans); }
    button, select { font: inherit; }
    :focus-visible { outline: 2px solid var(--green-ink); outline-offset: 2px; }
    .page { width: min(1160px, calc(100% - 36px)); margin: 0 auto; }
    .top {
      min-height: 40px; display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--ink); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
    }
    .top a { color: inherit; text-decoration: none; }
    .top a:first-child { font-weight: 700; }
    .top a:last-child { color: var(--muted); }
    header { padding: 23px 0 15px; border-bottom: 1px solid var(--ink); }
    h1 { margin: 0; font: 400 clamp(34px, 4.4vw, 46px)/1.02 var(--serif); letter-spacing: -.04em; }
    .chooser { display: flex; align-items: center; gap: 10px; padding: 13px 0 11px; border-bottom: 1px solid var(--rule); }
    .chooser label { color: var(--muted); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
    .chooser select {
      min-width: min(310px, 72vw); max-width: 100%; padding: 6px 28px 6px 8px;
      border: 1px solid var(--rule); border-radius: 2px; color: var(--ink); background: #fff;
    }
    #map { padding: 2px 0 16px; }
    .section-row { display: grid; grid-template-columns: 122px minmax(0,1fr); gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--rule); }
    .section-label { padding-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.25; }
    .section-content { min-width: 0; }
    .cells { display: grid; grid-template-columns: repeat(24, 22px); gap: 3px; align-content: start; }
    .tile {
      position: relative; display: grid; place-items: center; width: 22px; height: 22px;
      padding: 0; border: 1px solid #dfe1d9; border-radius: 2px; color: #777b73;
      background: var(--empty); font-size: 10px; line-height: 1; font-variant-numeric: tabular-nums; cursor: pointer;
    }
    .tile.quoted { border-color: #a9c3ae; color: var(--green-ink); background: var(--green); font-weight: 700; }
    .tile.parallel { border-color: #a9c7cd; color: var(--blue-ink); background: var(--blue); font-weight: 700; }
    .tile.both { border-color: #a9c3ae; color: var(--ink); background: linear-gradient(135deg,var(--green) 0 49%,var(--blue) 51% 100%); font-weight: 700; }
    .tile:hover, .tile[aria-expanded="true"] { border-color: var(--ink); }
    .tile[aria-expanded="true"] { box-shadow: inset 0 0 0 1px var(--ink); }
    .tile.unmatched::after { position: absolute; right: 1px; bottom: 1px; width: 5px; height: 5px; background: var(--red); content: ""; }
    .detail { margin: 5px 0 1px; padding: 8px 10px; border: 1px solid var(--rule); border-left: 2px solid var(--ink); background: #fff; }
    .detail[hidden] { display: none; }
    .detail h2 { margin: 0 0 6px; font: 400 17px/1.15 var(--serif); }
    .group { display: grid; grid-template-columns: 78px minmax(0,1fr); gap: 8px; padding: 5px 0 0; }
    .group + .group { margin-top: 4px; border-top: 1px solid #e7e8e2; }
    .group h3 { margin: 2px 0 0; color: var(--muted); font: 700 9px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
    .entries { min-width: 0; margin: 0; padding: 0; list-style: none; }
    .entry { padding: 1px 0 4px; overflow-wrap: anywhere; }
    .work { font-weight: 600; }
    .refs { display: block; padding-top: 1px; color: #42463f; font-variant-numeric: tabular-nums; }
    .pair { font-variant-numeric: tabular-nums; }
    .arrow { padding: 0 6px; color: var(--muted); }
    .note { display: block; padding-top: 2px; color: #565b53; font: italic 12px/1.35 var(--serif); }
    .no-entry { margin: 0; color: var(--muted); font-size: 11px; }
    .error { padding: 14px 0; color: var(--red); }
    .analysis-row { border-top: 1px solid var(--ink); border-bottom: 0; padding-top: 8px; padding-bottom: 12px; }
    .analysis-title { margin: 0; padding-top: 2px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .analysis-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0 18px; margin: 0; }
    .analysis-item { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--rule); }
    .analysis-item dt { color: var(--muted); font-size: 10px; }
    .analysis-item dd { margin: 0; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
    .analysis-formula { grid-column: 1 / -1; margin: 5px 0 0; color: var(--muted); font-size: 10px; }
    @media (max-width: 760px) {
      .page { width: calc(100% - 24px); }
      header { padding: 19px 0 12px; }
      .chooser { padding: 10px 0; }
      .section-row { grid-template-columns: 92px minmax(0,1fr); gap: 5px; padding: 4px 0; }
      .section-label { font-size: 9px; }
      .cells { grid-template-columns: repeat(12, 22px); gap: 3px; }
      .group { grid-template-columns: 66px minmax(0,1fr); gap: 5px; }
      .analysis-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
    }
    @media (max-width: 360px) {
      .page { width: calc(100% - 18px); }
      .section-row { grid-template-columns: 74px minmax(0,1fr); gap: 4px; }
      .cells { grid-template-columns: repeat(10, 21px); gap: 2px; }
      .tile { width: 21px; height: 21px; font-size: 9px; }
      .group { grid-template-columns: 58px minmax(0,1fr); gap: 4px; }
      .analysis-grid { grid-template-columns: 1fr; }
      .analysis-formula { grid-column: 1; }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="page">
    <nav class="top" aria-label="Site">
      <a href="/advaita/">Viveka Dṛṣṭi</a>
      <a href="/advaita/pages/purana-library/">Purāṇa Library</a>
    </nav>
    <header><h1>Purāṇa Analysis</h1></header>
    <div class="chooser">
      <label for="purana">Purāṇa</label>
      <select id="purana" aria-label="Choose a Purāṇa"></select>
    </div>
    <main id="map" aria-live="polite"></main>
  </div>
  <script>
    (() => {
      const map = document.getElementById("map");
      const select = document.getElementById("purana");
      let data = null;
      let selectedTile = null;
      let selectedDetail = null;

      function chapterNumber(section, chapter) {
        return (section.numbering ? section.numbering + "." : "") + chapter;
      }

      function addGroup(parent, label, entries, type) {
        if (!entries || !entries.length) return;
        const group = document.createElement("section");
        group.className = "group";
        const heading = document.createElement("h3");
        heading.textContent = label;
        group.appendChild(heading);
        const list = document.createElement("ul");
        list.className = "entries";
        for (const entry of entries) {
          const item = document.createElement("li");
          item.className = "entry";
          if (type === "quoted") {
            const work = document.createElement("span");
            work.className = "work";
            const name = entry.work === "Work title unclear" ? "Work not identified" : entry.work;
            const author = entry.author?.trim() || "Author not identified";
            work.textContent = `${name} — ${author}`;
            const refs = document.createElement("span");
            refs.className = "refs";
            refs.textContent = entry.refs.join(", ");
            item.append(work, refs);
          } else if (type === "parallel") {
            const pair = document.createElement("span");
            pair.className = "pair";
            pair.append(document.createTextNode(entry.left));
            const arrow = document.createElement("span");
            arrow.className = "arrow";
            arrow.textContent = "↔";
            pair.append(arrow, document.createTextNode(entry.right));
            item.appendChild(pair);
            if (entry.note) {
              const note = document.createElement("span");
              note.className = "note";
              note.textContent = entry.note;
              item.appendChild(note);
            }
          } else {
            if (entry.work) {
              const work = document.createElement("span");
              work.className = "work";
              const author = entry.author?.trim() || "Author not identified";
              work.textContent = `${entry.work} — ${author}`;
              item.appendChild(work);
            }
            if (entry.refs && entry.refs.length) {
              const refs = document.createElement("span");
              refs.className = "refs";
              refs.textContent = entry.refs.join(", ");
              item.appendChild(refs);
            }
            const note = document.createElement("span");
            note.className = "note";
            note.textContent = entry.note || "Quoted line not located.";
            item.appendChild(note);
          }
          list.appendChild(item);
        }
        group.appendChild(list);
        parent.appendChild(group);
      }

      function showChapter(purana, section, chapter, record, tile, content) {
        if (selectedTile === tile) {
          selectedDetail?.remove();
          tile.setAttribute("aria-expanded", "false");
          selectedTile = null;
          selectedDetail = null;
          return;
        }
        if (selectedTile) selectedTile.setAttribute("aria-expanded", "false");
        selectedDetail?.remove();
        selectedTile = tile;
        tile.setAttribute("aria-expanded", "true");
        const detail = document.createElement("section");
        detail.className = "detail";
        detail.setAttribute("aria-label", "Chapter references");
        const title = document.createElement("h2");
        title.textContent = `${purana.name} ${chapterNumber(section, chapter)}`;
        detail.appendChild(title);
        addGroup(detail, "Quoted in", record.quoted, "quoted");
        addGroup(detail, "Parallel", record.parallel, "parallel");
        addGroup(detail, "Unmatched", record.missing, "missing");
        if (!record.quoted?.length && !record.parallel?.length && !record.missing?.length) {
          const empty = document.createElement("p");
          empty.className = "no-entry";
          empty.textContent = "No citation listed for this chapter.";
          detail.appendChild(empty);
        }
        content.appendChild(detail);
        selectedDetail = detail;
        requestAnimationFrame(() => detail.scrollIntoView({ behavior: "smooth", block: "nearest" }));
      }

      function addAnalysis(puranas, combined = false) {
        const total = puranas.reduce((sum, purana) => sum + purana.sections.reduce((sectionTotal, section) => sectionTotal + section.last, 0), 0);
        let quoted = 0;
        let parallel = 0;
        let both = 0;
        let either = 0;
        let unmatchedNotes = 0;
        let unmatchedChapters = 0;
        let citationEntries = 0;
        for (const purana of puranas) {
          for (const section of purana.sections) {
            for (let chapter = 1; chapter <= section.last; chapter += 1) {
              const record = section.chapters[String(chapter)] || {};
              const hasQuoted = Boolean(record.quoted?.length);
              const hasParallel = Boolean(record.parallel?.length);
              if (hasQuoted) quoted += 1;
              if (hasParallel) parallel += 1;
              if (hasQuoted && hasParallel) both += 1;
              if (hasQuoted || hasParallel) either += 1;
              const notes = record.missing?.length || 0;
              unmatchedNotes += notes;
              if (notes) unmatchedChapters += 1;
              citationEntries += record.quoted?.length || 0;
            }
          }
        }
        let sectionCount = 0;
        let emptySections = 0;
        let emptySectionChapters = 0;
        for (const purana of puranas) {
          for (const section of purana.sections) {
            sectionCount += 1;
            let hasReference = false;
            for (let chapter = 1; chapter <= section.last; chapter += 1) {
              const record = section.chapters[String(chapter)] || {};
              if (record.quoted?.length || record.parallel?.length || record.missing?.length) hasReference = true;
            }
            if (!hasReference) {
              emptySections += 1;
              emptySectionChapters += section.last;
            }
          }
        }
        const chaptersWithoutMatch = total - either;
        const remainingAfterEmptyGroups = total - emptySectionChapters;
        const coverageAfterExclusion = either / remainingAfterEmptyGroups;
        const percent = value => `${(100 * value / total).toFixed(1)}%`;
        const row = document.createElement("section");
        row.className = "section-row analysis-row";
        const heading = document.createElement("h2");
        heading.className = "section-label analysis-title";
        heading.textContent = combined ? "Combined analysis" : "Analysis";
        const content = document.createElement("div");
        content.className = "section-content";
        const metrics = document.createElement("dl");
        metrics.className = "analysis-grid";
        const values = [
          ...(combined ? [["Purāṇas", String(puranas.length)]] : []),
          ["Total chapters", `${total} · 100%`],
          ["Chapters quoted elsewhere", `${quoted} · ${percent(quoted)}`],
          ["Chapters with exact Purāṇa parallels", `${parallel} · ${percent(parallel)}`],
          ["Both kinds of match", `${both} · ${percent(both)}`],
          ["At least one match", `${either} · ${percent(either)}`],
          ...(combined ? [
            ["Chapters without a match", `${chaptersWithoutMatch} · ${percent(chaptersWithoutMatch)}`],
            ["Section groups with no references", `${emptySections} of ${sectionCount} · ${(100 * emptySections / sectionCount).toFixed(1)}%`],
            ["Chapters in empty groups", `${emptySectionChapters} · ${percent(emptySectionChapters)}`],
            ["Chapters after excluding empty groups", String(remainingAfterEmptyGroups)],
            ["Matched chapters after exclusion", `${either} of ${remainingAfterEmptyGroups} · ${(100 * coverageAfterExclusion).toFixed(1)}%`],
            ["Quotation entries", String(citationEntries)],
          ] : []),
          ["Unmatched citation notes", `${unmatchedNotes} in ${unmatchedChapters} chapters`],
        ];
        for (const [label, value] of values) {
          const item = document.createElement("div");
          item.className = "analysis-item";
          const term = document.createElement("dt");
          term.textContent = label;
          const number = document.createElement("dd");
          number.textContent = value;
          item.append(term, number);
          metrics.appendChild(item);
        }
        const formula = document.createElement("p");
        formula.className = "analysis-formula";
        formula.textContent = combined ? `Matched chapters = quoted + parallel − both (${quoted} + ${parallel} − ${both} = ${either}). An empty group has no quotation, parallel, or unmatched note in any chapter. Excluding ${emptySections} empty groups removes ${emptySectionChapters} of ${total} chapter positions; coverage then is ${either}/${remainingAfterEmptyGroups} = ${(100 * coverageAfterExclusion).toFixed(1)}%. Each Purāṇa’s chapter positions are counted separately.` : `At least one match = quoted chapters + parallel chapters − chapters with both (${quoted} + ${parallel} − ${both} = ${either}). Percentages use ${total} chapters counted across ${puranas.length} Purāṇas.`;
        metrics.appendChild(formula);
        content.appendChild(metrics);
        row.append(heading, content);
        map.appendChild(row);
      }

      function render(purana) {
        selectedTile = null;
        selectedDetail = null;
        map.replaceChildren();
        for (const section of purana.sections) {
          const row = document.createElement("section");
          row.className = "section-row";
          const label = document.createElement("div");
          label.className = "section-label";
          label.textContent = section.label;
          const content = document.createElement("div");
          content.className = "section-content";
          const cells = document.createElement("div");
          cells.className = "cells";
          for (let chapter = 1; chapter <= section.last; chapter += 1) {
            const record = section.chapters[String(chapter)] || {};
            const hasQuoted = Boolean(record.quoted?.length);
            const hasParallel = Boolean(record.parallel?.length);
            const hasMissing = Boolean(record.missing?.length);
            const tile = document.createElement("button");
            tile.type = "button";
            tile.className = "tile";
            tile.textContent = String(chapter);
            tile.setAttribute("aria-expanded", "false");
            if (hasQuoted && hasParallel) tile.classList.add("both");
            else if (hasQuoted) tile.classList.add("quoted");
            else if (hasParallel) tile.classList.add("parallel");
            if (hasMissing) tile.classList.add("unmatched");
            const states = [hasQuoted && "quoted in another work", hasParallel && "exact parallel", hasMissing && "unmatched line"].filter(Boolean);
            tile.setAttribute("aria-label", `${purana.name} ${chapterNumber(section, chapter)}${states.length ? ": " + states.join("; ") : ": no citation listed"}`);
            tile.title = `${chapterNumber(section, chapter)}`;
            tile.addEventListener("click", () => showChapter(purana, section, chapter, record, tile, content));
            cells.appendChild(tile);
          }
          content.appendChild(cells);
          row.append(label, content);
          map.appendChild(row);
        }
        addAnalysis([purana]);
      }

      function renderCombined() {
        selectedTile = null;
        selectedDetail = null;
        map.replaceChildren();
        addAnalysis(data.puranas, true);
      }

      fetch("./data.json")
        .then(response => {
          if (!response.ok) throw new Error("Chapter data unavailable");
          return response.json();
        })
        .then(payload => {
          data = payload;
          const combinedOption = document.createElement("option");
          combinedOption.value = "all-combined";
          combinedOption.textContent = "All Purāṇas combined";
          select.appendChild(combinedOption);
          for (const purana of data.puranas) {
            const option = document.createElement("option");
            option.value = purana.id;
            option.textContent = purana.name;
            select.appendChild(option);
          }
          select.value = data.default;
          if (!select.value && data.puranas.length) select.value = data.puranas[0].id;
          render(data.puranas.find(item => item.id === select.value));
          if (select.value === "all-combined") renderCombined();
          select.addEventListener("change", () => {
            if (select.value === "all-combined") {
              renderCombined();
              return;
            }
            const purana = data.puranas.find(item => item.id === select.value);
            if (purana) render(purana);
          });
        })
        .catch(() => {
          const error = document.createElement("p");
          error.className = "error";
          error.textContent = "Chapter data could not be loaded.";
          map.appendChild(error);
        });
    })();
  </script>
</body>
</html>
