<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 213 — Solar Worship Procedure."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 213 — Solar Worship Procedure — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 213 — Solar Worship Procedure</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-212/">← Chapter 212</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-214/">Chapter 214 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Sumantu said: Having seen the fire-god, Divākara abiding in the fire, one should utter the Ghu-syllable together with his retinue. May he protect.","dṛṣṭvā—having seen; pāvakam devam—the fire-god; pāvaka-stham—abiding in fire; divākaram—Divākara; avyāt—may he protect; sa-parivāram—together with retinue; ghukāram—the Ghu-syllable; parikīrtayet—one should utter."],["When this is done, there is purification of the fire, without doubt. Then one should place it in the lotus-womb or in the heart-fire.","evam kṛte—when this is done; śodhanam—purification; syāt—there is; pāvakasya—of the fire; na saṃśayaḥ—without doubt; padma-garbhe—in the lotus-womb; hṛdaya-agnau—in the heart-fire; samākṣipet—one should place."],["The god of gods is invited, directly, without doubt. With Oṃ, one hundred oblations, with concentration on the eye-unguent,","āvāhitaḥ—invited; bhavet—becomes; deva-devaḥ—the god of gods; sākṣāt—directly; na saṃśayaḥ—without doubt; oṃkāreṇa—with Oṃ; āhuti-śatam—one hundred oblations; netra-añjana-samādhinā—with concentration on the eye-unguent."],["then one should give five oblations for the pleasure of the limbs, O king. Thereafter the discerning one should perform dismissal with the heart [mantra].","pañca-āhutīḥ—five oblations; tataḥ—then; dadyāt—should give; aṅgānām prītaye—for the pleasure of the limbs; nṛpa—O king; visarjanam—dismissal; tataḥ—thereafter; kuryāt—should perform; hṛdayena—with the heart [mantra]; vicakṣaṇaḥ—the discerning one."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:213,verseCount:4,subtitle:"Chapter 213 — Solar Worship Procedure",colophon:""},T);</script></body>
