g in Pāvaka, one should proclaim the syllable Ghu with his retinue; may he protect.","dṛṣṭvā—having seen; tu—but; pāvakam—the god Pāvaka; devam—the god; pāvaka-stham—abiding in Pāvaka; divākaram—Divākara; avyāt—may he protect; sa-parivāram—with his retinue; ghukāram—the syllable Ghu; parikīrtayet—one should proclaim."],["When this is done, purification of Pāvaka should occur, without doubt. Then, in the lotus interior or in the heart-fire, one should place [it].","evam—thus; kṛte—when done; śodhanam—purification; syāt—should occur; pāvakasya—of Pāvaka; na—not; saṃśayaḥ—doubt; padma-garbhe—in the lotus interior; tataḥ—then; vā—or; atha—then; hṛdaya-agnau—in the heart-fire; samākṣipet—one should place."],["The god of gods is directly invoked, without doubt, by a hundred oblations with Oṃ, with concentration like eye-unguent.","āvāhitaḥ—invoked; bhavet—becomes; deva-devaḥ—the god of gods; sākṣāt—directly; na—not; saṃśayaḥ—doubt; oṃkāreṇa—with Oṃ; āhuti-śatam—a hundred oblations; netra-añjana-samādhinā—with concentration like eye-unguent."],["Then one should give five oblations for the satisfaction of the limbs, O king. Thereafter, the discerning one should perform dismissal with the heart [mantra].","pañca-āhutīḥ—five oblations; tataḥ—then; dadyāt—one should give; aṅgānām—of the limbs; prītaye—for satisfaction; nṛpa—O king; visarjanam—dismissal; tataḥ—thereafter; kuryāt—one should perform; hṛdayena—with the heart [mantra]; vicakṣaṇaḥ—the discerning one."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:213,verseCount:4,subtitle:"Chapter 213 — Solar Worship Procedure",colophon:""},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body>
