<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 206 — Greatness of Sun Worship."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 206 — Greatness of Sun Worship — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 206 — Greatness of Sun Worship</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Bhīṣma said: Tell the supreme extraction of the mantra, joined with the powers of the mudrās and with corresponding form and colour, the excellent Purāṇic [method].","mantra-uddhāram — extraction of the mantra; param — supreme; brūhi — tell; mudrā-śakti-samanvitam — joined with the powers of the mudrās; rūpa-varṇa-samam — with corresponding form and colour; ca eva — and indeed; paurāṇikam — Purāṇic; anuttamam — excellent."],["Vyāsa said: Hear, Bhīṣma, great-armed one, how I shall tell you, O sinless one, the extraction of the Purāṇic mantras, apart from the Vedic [ones].","śṛṇu — hear; bhīṣma — O Bhīṣma; mahā-bāho — O great-armed one; yathā — how; vakṣyāmi — I shall tell; te — to you; anagha — O sinless one; paurāṇikānām — of the Purāṇic; mantrāṇām — mantras; uddhāram — extraction; vaidikāt ṛte — apart from the Vedic."],["Joined with a repha and adorned with coral, the last among the semivowels is indeed said to have Brahmā as its deity.","varṇa-repha-samāyuktam — joined with a letter and repha; vidrumeṇa — with coral; eva — indeed; bhūṣitam — adorned; antaḥ-sthānām — among the semivowels; hi — indeed; antyam — the last; vai — indeed; brahma-daivatyaṃ — having Brahmā as deity; ucyate — is said."],["Joined with bindu and repha, and likewise with a long mātrā, the initiation syllable is declared; the second has Viṣṇu as its deity.","bindu-repha-samāyuktam — joined with bindu and repha; dīrghayā mātrayā — with a long mātrā; tathā — likewise; dīkṣā-akṣaram — initiation syllable; samuddiṣṭam — declared; dvitīyam — the second; viṣṇu-daivatam — having Viṣṇu as deity."],["The third is likewise declared with visarga, O lord of people; that third is indeed said by the wise to have Rudra as its deity.","tṛtīyam — the third; tu — indeed; tathā — likewise; proktam — declared; sa-visargam — with visarga; jana-adhipa — O lord of people; saḥ — that; tṛtīyaḥ — third; budhaiḥ — by the wise; proktaḥ — said; rudra-daivataḥ — having Rudra as deity; eva hi — indeed."],["This great Bhāskara himself is the three-letter mantra-form, rare, supreme, secret, the three gods, worshipped by the gods.","bhāskaraḥ ayam — this Bhāskara; mahān — great; sākṣāt — himself; mantra-mūrtiḥ — mantra-form; tri-akṣaraḥ — three-letter; durlabhaḥ — rare; paramaḥ — supreme; guhyaḥ — secret; tri-devaḥ — the three gods; deva-pūjitaḥ — worshipped by gods."],["Whoever recites this with devotion goes to the highest course; then I shall tell the mudrā, the supreme cause of presence.","yaḥ — whoever; tu — indeed; idam — this; japate — recites; bhaktyā — with devotion; saḥ — he; yāti — goes; paramām gatim — to the highest course; tataḥ — then; ca — and; mudrām — the mudrā; vakṣyāmi — I shall tell; sānnidhya-kāraṇam param — the supreme cause of presence."],["Having made the hands lotus-shaped, with the middle fingers joined in the middle, one should bend a finger there; it is called the vi-mudrā.","padma-ākārau — lotus-shaped; karau — hands; kṛtvā — having made; madhye — in the middle; śliṣṭe — joined; tu — indeed; madhyame — the middle fingers; aṅgulim — a finger; kṣārayet — one should bend; tasmin — there; vi-mudrā — vi-mudrā; iti — thus; ca — and; saḥ ucyate — it is called."],["Bound with this, O king, one becomes dear to Bhāskara; in all great fears it protects like a mother.","anayā — with this; baddhayā — bound; rājan — O king; bhāskarasya — to Bhāskara; priyaḥ — dear; bhavet — one becomes; mahā-bhayeṣu sarveṣu — in all great fears; mātṛ-vat — like a mother; parirakṣati — it protects."],["Its heart should be known as the excellent letter that is remembered; covered over coral, it is always situated in the heart.","hṛdayam — heart; tasya — of it; vijñeyam — should be known; yat — which; akṣara-varam — excellent letter; smṛtam — remembered; vidruma-upari — over coral; saṃchannam — covered; hṛt-gatam — situated in the heart; tat — that; gatam sadā — always situated."],["‘Arka is in the head’ is said, O Bharata; the three great utterances and the flaming crest likewise.","śirasi — in the head; arkam — Arka; iti — thus; proktam — said; deva-devasya — of the God of gods; bhārata — O Bharata; mahā-vyāhṛtayaḥ — great utterances; tisraḥ — three; tathā — likewise; rājvalinī — flaming; śikhā — crest."],["This knowledge of the great Āditya is eight-syllabled; the practitioner who remembers it is not obstructed by anyone.","aṣṭa-akṣarā — eight-syllabled; tu — indeed; vidyā — knowledge; iyam — this; ādityasya — of Āditya; mahātmanaḥ — the great; yaḥ — whoever; smaret — remembers; sādhakaḥ — practitioner; tu — indeed; enam — him/this; na asau — he is not; kenāpi — by anyone; bādhyate — obstructed."],["Joined with A, bindu, repha, and likewise, the letter ha has Agni as its deity; the armor is dear to Bhāskara.","akāreṇa — with A; samāyuktam — joined; bindu-repha-samanvitam — with bindu and repha; hakāram — the letter ha; agni-daivatam — having Agni as deity; kavacam — armor; bhāskara-priyam — dear to Bhāskara."],["This one letter is declared unbreakable; whoever remembers it destroys the wicked and the obstacles, no doubt.","eka-akṣaram — one letter; idam — this; proktam — declared; abhedyam — unbreakable; yaḥ — whoever; smaret — remembers; idam — this; duṣṭānām — of the wicked; ca eva — and indeed; vighnānām — of obstacles; nāśanam — destruction; na atra saṃśayaḥ — no doubt."],["Repha with visarga is remembered as the one-letter weapon; it destroys evil deeds for the practitioner, no doubt.","sa-visargaḥ — with visarga; rephaḥ — repha; iti — thus; astram — weapon; eka-akṣaram — one-letter; smṛtam — remembered; nāśayet — destroys; duṣṭa-karmāṇi — evil deeds; sādhakasya — of the practitioner; na saṃśayaḥ — no doubt."],["Having made the two hands facing each other, joined, with fingers interlaced; the little finger is joined with the ring finger, and the index with the middle finger.","saṃmukhau — facing each other; tau — the two; karau — hands; kṛtvā — having made; śliṣṭau — joined; tu — indeed; grathita-aṅgulī — with fingers interlaced; kaniṣṭhena — with the little finger; anāmike — the ring finger; yojye — should be joined; tarjanyau — the index fingers; madhyame — with the middle fingers; tathā — likewise."],["With the heart, head, crest, and skin, this mudrā is called Vyoma; one should make the index finger of the left hand raised, with a bent fist.","hṛt — heart; śiraḥ — head; sa-śikhā — with crest; carma — skin; mudrā iyam — this mudrā; vyoma-sañjñitā — called Vyoma; muṣṭi-vakra-ucchritam — raised with a bent fist; kuryāt — one should make; savya-hastasya — of the left hand; tarjanim — the index finger."],["The mudrā beginning with the word ‘Māla’ is declared to be the weapon; famous as Trāsanī, causing fear to all the vipras.","māla-śabda-kṛta-ādiḥ — beginning with the word Māla; tu — indeed; mudrā — mudrā; hi — surely; astrasya — of the weapon; kīrtitā — declared; trāsanī-nāma — named Trāsanī; vikhyātā — famous; sarva-vipra-bhayaṃkarī — causing fear to all vipras."],["That fourth one joined with karṇa and bindu, O great-minded one, is the eye of Bhāskara; it is said to have Agni as its deity.","karṇa-bindu-samāyuktam — joined with karṇa and bindu; yam — which; caturtham — fourth; mahā-mate — O great-minded one; bhāskarasya — of Bhāskara; tu — indeed; idam netram — this eye; agni-daivatam — having Agni as deity; ucyate — is said."],["For the leaders of practitioners, remembrance is indeed [a means] for the destruction of what is endless;","smaraḥ — remembrance; syāt — may be; sādhaka-indrāṇām — for leaders of practitioners; dur-antam — the endless; nāśane — in destruction; dhruvam — surely."],["The middle and index fingers of the left hand are raised; then bending the little and ring fingers with the thumb, one should touch this to the eyes; it is declared the eye-mudrā.","madhyamā — middle finger; tarjani — index finger; ca eva — and; savya-hastasya — of the left hand; ucchritam — raised; kaniṣṭhā-anāmike — little and ring fingers; kuñcya — bending; aṅguṣṭhena — with the thumb; tataḥ — then; krāmet — should proceed; netrābhyām — to the eyes; spṛśet — should touch; enām — this; netra-mudrā — eye-mudrā; prakīrtitā — declared."],["It is famed by the name Govṛṣā; it should show the divine sphere. ‘Rāṃ’ is Dīptāri; then Sūkṣmāri and Jayā, O Bhīṣma, are declared.","go-vṛṣā — Govṛṣā; nāma — by name; vikhyātā — famed; darśayet — should show; divya-gocharam — the divine sphere; rām — Rāṃ; dīpta-āri — Dīptāri; tataḥ — then; sūkṣma-ārī — Sūkṣmāri; jayā — Jayā; bhīṣma — O Bhīṣma; ucyate — are declared."],["‘Ubhāhvārūṃ’ is Vibhūti; Vimalā is declared ‘Reṃ’; Aghahā, O great-armed one, is declared ‘Rauṃ’ as Vidyutā.","ubhāhvārūm — “Ubhāhvārūṃ”; vibhūtiḥ — Vibhūti; vimalā — Vimalā; reṃ — Reṃ; prakīrtitā — declared; agha-hā — Aghahā; mahā-bāho — O great-armed one; vidyutā — Vidyutā; rauṃ — Rauṃ; prakīrtitā — declared."],["Govṛṣā is named ‘Raṃ’; and likewise Vīrabhadrakarī is ‘Sarva’; these śaktis are indeed spoken of in seed-forms.","go-vṛṣā — Govṛṣā; nāma — named; ram — Raṃ; sarvam — Sarva; vīrabhadrakarī — Vīrabhadrakarī; tathā — likewise; iti — thus; etāḥ — these; bīja-rūpāḥ — seed-forms; tu — indeed; kathitāḥ — spoken; ca eva — and."],["Having made the hands upward-facing, bending the fingers of the left [hand], one should place the thumbs above and move them again and again.","uttānau — upward-facing; tu — indeed; karau — hands; kṛtvā — having made; savya — the left [hand]; ākuñcya — bending; tataḥ — then; aṅgulīḥ — fingers; kuryāt — one should make; upari — above; ca — and; aṅguṣṭhau — the thumbs; cālayet — should move; punaḥ punaḥ — again and again."],["One should show these mudrās for all the śaktis; the ninth is named Vidyutā and is Sarvatomukhī.","sarvāsām — for all; ca eva — indeed and; śaktīnām — śaktis; etāḥ mudrāḥ — these mudrās; pradarśayet — one should show; nāmnā — by name; ca — and; vidyutā — Vidyutā; eva — indeed; navamī — ninth; sarvato-mukhī — Sarvatomukhī."],["These names of the śaktis have been told briefly, with their seeds, O great-armed one, by me in affection, O Bharata.","nāmāni — names; etāni — these; śaktīnām — of the śaktis; samāsāt — briefly; kathitāni — told; tu — indeed; sa-bījāni — with their seeds; mahā-bāho — O great-armed one; mayā — by me; snehena — in affection; bhārata — O Bharata."],["Hear the seeds of the planets and their forms from me as I speak: ‘Bhaṃ’ everywhere, and likewise ‘Khaṃ’, O bearer of the seed and wonder.","grahāṇām — of the planets; śṛṇu — hear; bījāni — seeds; rūpam ca — and forms; gadataḥ mama — from me speaking; sarvatra — everywhere; bham — Bhaṃ; tathā — likewise; kham — Khaṃ; ca — and; kañja-kūtuhala-udvaha — O bearer of lotus-wonder."],["All are illuminated with Oṃ-syllables and joined with salutations at the end; they should be used at the time of worship and likewise at the time of japa.","oṃ-kārāḥ — Oṃ-syllables; dīpitāḥ — illuminated; sarve — all; namaskāra-anta-yojitāḥ — joined with salutations at the end; pūjā-kāle — at worship-time; prayoktavyāḥ — should be used; japa-kāle — at japa-time; tathā eva — likewise."],["At the time of homa, the mantra should end with Svāhā and be joined with the ṣaṭkāra; all are joined with bindu, and the crest is adorned with bindu.","homa-kāle — at homa-time; tu — indeed; svāhā-antam — ending with Svāhā; mantram — the mantra; ṣaṭ-kāra-saṃyutam — joined with ṣaṭkāra; sarve — all; bindu-yutāḥ — joined with bindu; bhīṣma — O Bhīṣma; śikhā — crest; bindu-vibhūṣitāḥ — adorned with bindu."],["The planets beginning with Soma and ending with Ketu are thus declared; I shall tell these mudrās, which grant all accomplishments.","soma-ādyāḥ — beginning with Soma; ketu-paryantāḥ — ending with Ketu; grahāḥ — planets; hi — indeed; evam — thus; prakīrtitāḥ — declared; etāḥ mudrāḥ — these mudrās; pravakṣyāmi — I shall tell; sarva-siddhi-pradāyikāḥ — granting all accomplishments."],["Having made the hands beautiful, joined and extended, this is the mudrā for salutation, causing the planets’ presence.","su-mukhau — beautiful; tu — indeed; karau — hands; kṛtvā — having made; śliṣṭau — joined; ca eva — and; prasāritau — extended; iyam mudrā — this mudrā; namaskāre — for salutation; graha-sānnidhya-kārikā — causing the planets’ presence."],["The extraction of the mantra has been told to you, secret and rare, O king; hear the form of the gods as the time for meditation has arrived.","mantra-uddhāraḥ — extraction of the mantra; tava — to you; ākhyātaḥ — told; rahasyaḥ — secret; durlabhaḥ — rare; nṛpa — O king; śṛṇuṣva — hear; rūpam — form; devānām — of the gods; dhyāna-kāle — at meditation-time; hi — indeed; upasthite — having arrived."],["Bright in colour for japa, greatly radiant, situated upon a white lotus, complete with all marks and adorned with all ornaments.","japa-avarṇam — coloured for japa; mahā-tejam — greatly radiant; śveta-padma-upari-sthitam — situated upon a white lotus; sarva-lakṣaṇa-sampannam — complete with all marks; sarva-ābharaṇa-bhūṣitam — adorned with all ornaments."],["Likewise one-faced, two-armed, with the Moon and lotus at the shoulder; and in the maṇḍala, situated in the middle, wearing a red garment.","tathā — likewise; eka-vaktram — one-faced; dvi-bhujam — two-armed; soma-paṅkaja-kandharam — with Moon and lotus at the shoulder; maṇḍalena — in the maṇḍala; ca — and; rūpam — form; tu — indeed; madhya-stham — situated in the middle; rakta-vāsasam — wearing a red garment."],["This is the form of Mārtaṇḍa; pure, bathed, senses conquered, whoever remembers [him] at the three times, O Bhīṣma, standing with one mind,","mārtaṇḍasya — of Mārtaṇḍa; idam rūpam — this form; śuciḥ — pure; snātaḥ — bathed; jita-indriyaḥ — senses conquered; tri-kālam — at the three times; yaḥ — whoever; smaret — remembers; bhīṣma — O Bhīṣma; eka-cittaḥ — with one mind; vyavasthitaḥ — standing."],["He soon becomes in the world like Dhanada in wealth; he is released from all enjoyments, becomes radiant and strong.","saḥ — he; acirāt — soon; bhavati — becomes; loke — in the world; vittena — in wealth; dhana-da-upamaḥ — like Dhanada; mucyate — is released; sarva-bhogaiḥ — from all enjoyments; tu — indeed; tejasvī — radiant; balavān — strong; bhavet — becomes."],["The heart, upper part, crest, and face; these are red-coloured and dark, adorned with all ornaments.","hṛdayam — heart; ca — and; uttama-aṅgam — upper part; ca — and; śikhā — crest; vai — indeed; vaktram eva ca — and the face; rakta-varṇāḥ — red-coloured; ime — these; śyāmāḥ — dark; sarva-ābharaṇa-bhūṣitāḥ — adorned with all ornaments."],["With hands granting boons and fearlessness, the practitioner should meditate; the weapon resembles a mass of lightning, fierce, with a terrible moon.","vara-da — granting boons; abhaya-hastāḥ — hands giving fearlessness; ca — and; dhyātavyāḥ — should be meditated upon; sādhakena — by the practitioner; tu — indeed; taḍit-puñja-nibham — resembling a mass of lightning; śastram — weapon; raudram — fierce; candra-karālinam — with a terrible moon."],["This distinction is indeed told: by nature it is Kāmarūpa; my śaktis, Dīptā and the rest, are to be meditated upon, shaped like a flaming crest.","viśeṣaḥ — distinction; kathitaḥ — told; hi — indeed; eṣaḥ — this; kāma-rūpaḥ — Kāmarūpa; sva-bhāvataḥ — by nature; dīptā — Dīptā; dīpta-śikhā-ākārāḥ — shaped like a flaming crest; dhyātavyāḥ — should be meditated upon; mama — my; śaktayaḥ — śaktis."],["One should remember Soma as white, Kuja as red; Budha as gentle and eight-footed, and Guru as yellow-coloured.","śveta-varṇam — white-coloured; smaret — should remember; somam — Soma; rakta-varṇam — red-coloured; kujam — Kuja; smaret — should remember; saumyam — Budha; aṣṭa-pada-ābham — resembling eight feet; ca — and; gurum — Guru; pīta-varṇakam — yellow-coloured."],["White like conch and milk, Kāṇa resembling collyrium; one should remember Rāhu like a dust-whirl, and Vikaca as smoky.","śaṅkha-kṣīra-nibham — resembling conch and milk; śvetam — white; kāṇam — Kāṇa; ca — and; añjana-sannibham — resembling collyrium; raja-āvarta-nibham — resembling a dust-whirl; rāhum — Rāhu; dhūmram — smoky; ca — and; vikacam — Vikaca; smaret — should remember."],["The left hands placed at the hips, the right ones giving fearlessness; red-browed, red-eyed, red-faced, with half the body made into joined hands.","vāma-hastau — left hands; kaṭi-nyastau — placed at the hips; dakṣiṇau — right ones; ca — and; abhaya-pradau — giving fearlessness; rakta-bhrū — red-browed; rakta-netra-āsya — red-eyed and red-faced; ardha-kāya-kṛta-añjaliḥ — with half the body made into joined hands."],["Those who thus meditate on Bhānu together with the planets, O best of kings, quickly obtain great accomplishment, no doubt.","iti — thus; bhānum — Bhānu; grahaiḥ sārdham — together with the planets; ye — those who; dhyāyanti — meditate; nṛpa-uttama — O best of kings; labhante — obtain; te — they; mahā-siddhim — great accomplishment; acirāt — quickly; na atra saṃśayaḥ — no doubt."],["This whole account of the planets has been told to you, Bhīṣma; hearing it, humans on earth are freed from all sins.","tava — to you; ākhyātam — told; idam — this; vakttram — account; grahāṇām — of the planets; bhīṣma — O Bhīṣma; kṛtsnaśaḥ — entirely; yat — which; śrutvā — hearing; sarva-pāpebhyaḥ — from all sins; mucyante — are freed; bhuvi — on earth; mānavāḥ — humans."],["By this procedure, Bhīṣma, one should always worship the god Divākara three times a day with devotion, O hero, endowed with faith.","anena vidhinā — by this procedure; bhīṣma — O Bhīṣma; sadā — always; devam — the god; divākaram — Divākara; tri-kālam — three times a day; pūjayet — one should worship; bhaktyā — with devotion; vīra — O hero; śraddhā-samanvitaḥ — endowed with faith."],["Worshipping thus the all-god Divākara, freed from Brahma-hatya, one may attain the state of Mahādeva.","ittham — thus; pūjayamānaḥ — worshipping; tu — indeed; sarva-devam — the all-god; divākaram — Divākara; brahma-hatyā-vinirmuktaḥ — freed from Brahma-hatya; mahādeva-tvam — the state of Mahādeva; āpnuyāt — may attain."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:206,verseCount:47,subtitle:"Chapter 206 — Greatness of Sun Worship",colophon:""},T);</script></body>
