<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 210 — Sun-Worship Procedure."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 210 — Sun-Worship Procedure — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 210 — Sun-Worship Procedure</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-209/">← Chapter 209</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-211/">Chapter 211 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Sumantu said: This Saptamī observance has been told to you briefly. I shall speak of it again in detail; hear with a one-pointed mind, O lord.","iti—thus; eṣaḥ—this; saptamī-kalpaḥ—Saptamī observance; samāsāt—in brief; kathitaḥ—told; vist arāt—in detail; vacmi—I shall speak; śṛṇu—hear."],["Having fasted on the sixth of Phālguna’s bright fortnight and bathed, one should worship Bhāskara with scents, flowers, and unguents.","phālguna-amala-pakṣasya—of Phālguna’s bright fortnight; ṣaṣṭhyām—on the sixth; upoṣitaḥ—having fasted; snātvā—having bathed; pūjayet—should worship."],["O mighty-armed one, [worship] Divākara with Arka flowers, fragrant gugguḷu, white karavīra, and sandalwood.","arka-puṣpaiḥ—with Arka flowers; sugandhinā—with fragrant; guggulena—with gugguḷu; śvetena—with white; karavīreṇa—with karavīra; candanena—with sandalwood."],["Having offered jaggery-water for Ravi’s pleasure, worship Bhānu by day; at night the wise one should sleep before him, continually awake, reciting the supreme Bhauma-japa.","guḍa-udakena—with jaggery-water; naivedyam—offering; nivedya—having offered; rātrau—at night; tasya agrataḥ—before him; japan—reciting; vinidraḥ—sleepless."],["Śatānīka said: What is that supreme, excellent recitation dear to the Lord,","kim—what; tat—that; param—supreme; bhagavataḥ—of the Lord; priyam—dear; jāpyam—recitation; anuttamam—excellent."],["which men should recite with devotion before Bhānu? Tell me that, and especially the mantras, incense, and lamps by which I may worship Divākara while reciting it.","japtavyam—to be recited; paraiḥ—by men; bhaktyā—with devotion; bhānuḥ agrataḥ—before Bhānu; tan me brūhi—tell that to me; mantrān—mantras; dhūpa-dīpān—incense and lamps."],["Sumantu said: I shall tell you in brief, O best of the Bharatas, not in detail.","vacmi—I shall tell; te—to you; bhārata-śreṣṭha—O best of the Bharatas; samāsāt—in brief; na vistarāt—not in detail."],["With the six-syllabled mantra, one should perform everything with a collected mind: japa, homa, and worship, always after a hundred recitations.","ṣaḍ-akṣareṇa—with six syllables; mantreṇa—with mantra; kuryāt—should do; samāhitaḥ—collected; japam—japa; homam—homa; pūjām—worship."],["First, having performed Sāvitrī-japa a hundred thousand times, one should then perform all the rest of japa and the like, undisturbed.","sāvitryā—of Sāvitrī; japam—japa; pūrvam—first; kṛtvā—having done; śata-sahasraśaḥ—a hundred thousand times; paścāt—afterward."],["“Oṃ bhoḥ Sāvitrī, we meditate on Bhāskara, the thousand-rayed one; by that, may the Sun impel [us].”","oṃ—Oṃ; bhāskarāya—on Bhāskara; sahasra-raśmi—thousand-rayed; dhīmahi—we meditate; sūryaḥ—the Sun; pracodayāt—may impel."],["Japa alone was declared supreme on Saptamī by Bhānu himself. By reciting it once, a person becomes purified; there is no doubt.","japaḥ eva—japa alone; paraḥ—supreme; proktaḥ—declared; saptamyām—on Saptamī; sakṛt—once; pūtaḥ—purified."],["At dawn on Saptamī, with mind controlled and reciting, one should worship Bhāskara with devotion according to the procedure stated before, O king.","prabhāte—at dawn; japan—reciting; niyata-mānasaḥ—mind-controlled; pūjayet—should worship; bhaktyā—with devotion; pūrva-ukta-vidhinā—by the procedure stated before."],["One should feed Brāhmaṇas with faith and according to one’s ability, O king, and [offer] heavenly enjoyments with many kinds of foods and eatables.","śraddhayā—with faith; bhojayet—should feed; brāhmaṇān—Brāhmaṇas; śaktitaḥ—according to ability; divyān bhogān—heavenly enjoyments; bhakṣya-bhojyaiḥ—with foods and eatables."],["One should not be miserly with wealth; one should feed the Bhojakas well. One should not feed non-Sauras; one should carefully feed the Sauras.","vitta-śāṭhyam—miserliness with wealth; na kuryāt—should not do; bhojakān—the Bhojakas; prabhojayet—should feed well; asaurān—non-Sauras; saurān—the Sauras."],["Śatānīka said: Which Brāhmaṇas are to be fed and which are not, O best knower of Brahman? In which observances on Saptamī is Divākara worshipped?","ke—who; bhojyāḥ—to be fed; na bhojyāḥ—not to be fed; brāhmaṇāḥ—Brāhmaṇas; saptamyām—on Saptamī; deva-devaḥ—god of gods; divākaraḥ—Divākara."],["A Brāhmaṇa who performs Saptamī is fit to be fed as a Ghaṭī; one outside the Sauras is not to be fed, nor one who has eaten at Divākara’s [rite].","ghaṭī-bhojyaḥ—fit to be fed as Ghaṭī; vipraḥ—Brāhmaṇa; saptamīm kurute—performs Saptamī; saura-bhinneṣu—among non-Sauras; abhojyaḥ—not to be fed."],["These twice-born are briefly declared fit to be fed by Āditya, O king, best of the Kuru lineage; now hear those unfit to be fed.","ete—these; bhojyāḥ—fit to be fed; dvijāḥ—twice-born; ādityena—by Āditya; proktāḥ—declared; abhojyān—unfit to be fed; śṛṇu—hear."],["One who has a wife and co-wife, one afflicted by leprosy, one devoted to another deity, and a pointer-out of the constellations,","sa-bhāryaḥ—having a wife; sa-patiḥ—having a co-wife; kuṣṭha-rogaiḥ hataḥ—afflicted by leprosy; anya-devatā-bhaktaḥ—devoted to another deity; nakṣatra-sūcakaḥ—pointer-out of constellations."],["one intent on slandering others, and a Devalaka—these were considered unfit to be fed by Savitṛ, the god himself.","para-apavāda-nirataḥ—intent on slander; devalakaḥ—Devalaka; abhojyāḥ—unfit to be fed; savitrā—by Savitṛ; cintitāḥ—considered."],["Śatānīka said: Tell me the characteristics of all the Brāhmaṇas declared fit to be fed and the twice-born declared unfit.","ye—those; bhojyāḥ—to be fed; brāhmaṇāḥ—Brāhmaṇas; proktāḥ—declared; abhojyāḥ—not to be fed; lakṣaṇam—characteristics; brūhi—tell."],["Sumantu said: You have asked well, O king. I shall describe it completely: the assembly of Brāhmaṇas who recite the threefold Veda.","sādhu—well; pṛṣṭaḥ asmi—I have been asked; kīrtayāmi—I shall describe; kṛtsnaśaḥ—completely; trayī vidyām—the threefold Veda; kadambaḥ—assembly."],["That is called the Ghaṭa by the god Bhānu himself, O king. The one who possesses that Ghaṭa is called Ghaṭī by the twice-born.","ghaṭā iti uktā—called Ghaṭa; svayam—himself; bhānunā—by Bhānu; vidyate—exists; yasya—in whom; ghaṭī iti—as Ghaṭī; ucyate—is called."],["The assembly of Brāhmaṇas, Kṣatriyas, Vaiśyas, and Śūdras, O hero, [is] sacred book-recitation, listened to with devotion according to rule.","brahma-kṣatra-viśām—of Brāhmaṇas, Kṣatriyas, Vaiśyas; śūdrāṇām ca—and of Śūdras; śṛṇvatām—of listeners; puṇyam—sacred; pustaka-vācanam—book-recitation."],["Thus the monthly prescribed homa was told by Bhānu, O tiger among the Kurus, by him who himself travels through the sky.","māse—monthly; nibaddhasya—prescribed; homasya—of homa; kathitam—told; svayam—himself; ākāśa-gāminā—by the sky-traveller."],["Whoever becomes the performer of it is considered by me its agent; that Brāhmaṇa is always dear to Bhāskara, O tiger among kings.","kartā—performer; bhavet—becomes; karakaḥ—agent; mataḥ—considered; vipraḥ—Brāhmaṇa; iṣṭaḥ—dear; bhāskarasya—to Bhāskara."],["Vyāsa and those living by Jaya, and Jīvakas, are alike. These Purāṇas with the Itihāsas were called “Jaya” here by the radiant god himself, O Bhārata.","jaya-upajīvī—one living by Jaya; vyāsaḥ—Vyāsa; samaḥ—alike; jīvakaḥ—Jīvaka; purāṇāni—Purāṇas; sa-itihāsāni—with Itihāsas; jaya iti—as Jaya; kathitāni—called."],["He who supports one Brāhmaṇa and lives by him is to be known as one who lives by Jaya, and also as a reciter, O king.","ekam—one; brāhmaṇam—Brāhmaṇa; nivāsayan—supporting; upajīvati—lives by; jaya-upajīvī—living by Jaya; vācakaḥ—reciter."],["Whoever knows the Āruṇeya and other śāstras, Saptāśvatilaka, and the Sauras, that Brāhmaṇa is a Saur, a knower of truth.","āruṇeya-ādi-śāstrāṇi—the Āruṇeya and other śāstras; saptāśva-tilakam—Saptāśvatilaka; jānāti—knows; sauraḥ—a Saur; tattva-vit—knower of truth."],["Whoever worships Bhāskara always, O best of kings, and the Bhojakas likewise as the god Divākara,","pūjayet—worships; satatam—always; bhāskaram—Bhāskara; bhojakān—the Bhojakas; devam—as god; divākaram—Divākara."],["is to be known as a devotee of Bhāskara and should carefully be fed. This is the mark of those fit to be fed; hear of the unfit.","bhaktaḥ—devotee; bhojanīyaḥ—to be fed; prayatnataḥ—carefully; lakṣaṇam—mark; abhojyānām—of the unfit; śṛṇu—hear."],["A Brāhmaṇa whose wife is a Vṛṣalī, especially, and one who is the husband of another’s wife—he is the lowest Brāhmaṇa.","vṛṣalī—Vṛṣalī; yasya—whose; bhāryā—wife; para-bhāryā-patiḥ—husband of another’s wife; brāhmaṇa-adhamaḥ—lowest Brāhmaṇa."],["A leprous Brāhmaṇa struck by fate, a slayer of a Brāhmaṇa, and one who obtains a Bhojaka but does not worship him in that way,","daivena nihataḥ—struck by fate; kuṣṭhī—leprous; brahma-ghātakaḥ—slayer of a Brāhmaṇa; bhojakam vindate—obtains a Bhojaka; na pūjayet—does not worship."],["is to be known as a worshipper of another deity, that Brāhmaṇa, O delight of the Kurus. Know the Āditya Bhojaka as arisen from Bhānu’s body.","anya-deva-bhaktaḥ—worshipper of another deity; vipraḥ—Brāhmaṇa; ādityam bhojakam—Āditya Bhojaka; vidyāt—know; bhānoḥ deha-samudbhavam—arisen from Bhānu’s body."],["Whoever does not worship Āditya is never fit to be fed. Bald, deformed, fair, and likewise bearing a conch-flower,","na ādityam pūjayet—does not worship Āditya; na kadācana—never; bhojyaḥ—to be fed; muṇḍaḥ—bald; vyaṅga-dharaḥ—deformed; gauraḥ—fair; śaṅkha-puṣpa-dharaḥ—bearing a conch-flower."],["When a Bhojaka enters a man’s house, O king, the gods and ancestors go to that house of Bhāskara’s [servant].","gṛhe—into the house; yāti—goes; bhojakaḥ—a Bhojaka; devāḥ—the gods; pitaraḥ—the ancestors; yānti—go; bhāskarasya—of Bhāskara."],["Demons, spirits, Piśācas, and even Yoginīs flee from the householder’s home where a Bhojaka eats once.","rakṣaḥ—demons; bhūta—spirits; piśācāḥ—Piśācas; yoginyaḥ—Yoginīs; palāyitāḥ—flee; sakṛt—once; bhuṅkte—eats."],["For seven years Bhāskara is satisfied. Therefore a wise man should always feed those divine Bhojakas; a Brāhmaṇa who reviles them is never to be fed.","sapta-saṃvatsaram—for seven years; tṛptaḥ—satisfied; bhāskaraḥ—Bhāskara; bhojayet—should feed; divyān bhojakān—divine Bhojakas; nindati—reviles; na bhojyaḥ—not to be fed."],["A woman who leaves her own husband and goes freely to another is called a Svairiṇī, very sinful and defiling the family.","nijam bhartāram—her own husband; utsṛjya—having left; anyatra—to another; gacchati—goes; svairiṇī—Svairiṇī; pāpiṣṭhā—very sinful; kula-dūṣiṇī—defiling the family."],["A woman who delights in secret [relations], O king, through the fault of her conduct, is known as a Svairiṇī, a destroyer in the family.","pracchannam—secretly; rocate—delights; nārī—a woman; doṣataḥ—through fault; svairiṇī—Svairiṇī; kule—in the family; nāśinī—destroyer."],["A Brāhmaṇa attached to her is to be known as attached to a Svairiṇī; a stage-liver, storyteller, and common dancer,","yasyām—in her; rataḥ—attached; vipraḥ—Brāhmaṇa; svairiṇī-rataḥ—attached to a Svairiṇī; raṅga-upajīvī—stage-liver; kathakaḥ—storyteller; prākṛta-nartakaḥ—common dancer."],["one who lives by the stage, O king, and one who begs much—these two names are declared for a storyteller; by this deed he is excessive, O delight of the Kurus.","raṅga-upajīvī—stage-liver; bahu-yācakaḥ—one who begs much; dve nāmanī—two names; kathakasya—of a storyteller; udvṛttaḥ—excessive."],["A Brāhmaṇa who sings praise loudly in a public assembly is called a stage-liver; this is declared to be the second [kind].","stutim—praise; gāyate—sings; proccaiḥ—loudly; jana-saṃsadi—in public assembly; raṅga-upajīvī—stage-liver; dvitīyaḥ—second."],["Indication and narration are declared in all śāstras, O Bhārata. Whoever points out the constellations is a pointer-out of stars.","sūcanam—indication; kathanam—narration; sarva-śāstreṣu—in all śāstras; ṛkṣāṇi—constellations; nakṣatra-sūcakaḥ—pointer-out of stars."],["Śatānīka said: Alas, what great hardship there is in what you say about Brāhmaṇas! Astrology, a Vedāṅga, is declared the sixth by the wise.","mahat kaṣṭam—great hardship; dvijān prati—regarding Brāhmaṇas; veda-aṅgam—Vedāṅga; jyotiḥ-śāstram—astrology; ṣaṣṭham—sixth; manīṣibhiḥ—by the wise."],["Would a Brāhmaṇa not be incomplete, lacking that sixth limb? What would become of a Brāhmaṇa through reading it for one unfit to be fed?","ṣaḍ-aṅgaḥ—having six limbs; na bhavet—would not be; rahitena—lacking; abhojye—for one unfit to be fed; paṭhanāt—through reading; syāt—would become."],["A Brāhmaṇa fit to be fed went wholly [there], and the purposeless [became] purposeless. Consider it and tell me, O Brāhmaṇa; I have a great doubt here.","bhojyaḥ—fit to be fed; akhaṇḍam—wholly; yayau—went; anarthakena—by the purposeless; anarthakam—purposeless; vimṛśya—considering; saṃśayaḥ—doubt."],["Sumantu said: You have asked well; hear the decision here. The limb of a Brāhmaṇa whose livelihood this is should be understood,","sādhu—well; pṛṣṭaḥ asmi—I have been asked; nirṇayaḥ—decision; jīvyam—livelihood; idam—this; aṅgam—limb; jñeyam—to be understood."],["[One who earns] through annual astrology, knowing the nakṣatras, is not fit to be fed, O king, if this is his livelihood.","sāṃvatsareṇa—by annual astrology; jyotiṣā—by astrology; nakṣatra-sūcakaḥ—pointer of nakṣatras; na bhojyaḥ—not fit to be fed; jīvikā—livelihood."],["Without cause, one who speaks of others’ faults in private, and hides their virtues, is intent on slander.","niṣkāraṇam—without cause; parāṇām—of others; parokṣam—in private; doṣa-kīrtanam—speaking of faults; guṇānām—of virtues; guptiḥ—concealment; parivāda-paraḥ—intent on slander."],["A Brāhmaṇa who performs work as a livelihood, O king, and worship of the gods in a shrine,","brāhmaṇaḥ—Brāhmaṇa; vṛttyā—for livelihood; karma—work; karoti—performs; devatā-āyatane—in a shrine; devānām—of the gods; pūjanam—worship."],["and takes charge of and eats the offering—he is a Devalaka, O king, a low Brāhmaṇa.","ādhipatyam—charge; bhakṣaṇam—eating; naivedyasya—of offering; devalaḥ—Devalaka; brāhmaṇa-adhamaḥ—low Brāhmaṇa."],["Brāhmaṇas have no authority to worship earthly deities for livelihood, O tiger among the Bharatas, especially in taking charge.","na adhikāraḥ—no authority; viprāṇām—of Brāhmaṇas; bhaumānām—earthly; deva-pūjane—in deity-worship; vṛttyā—for livelihood; ādhipatye—in charge."],["A Brāhmaṇa who worships a goddess from greed for wealth, for livelihood, O best of the Kuru lineage, surely goes to hell.","devīm—a goddess; pūjayate—worships; dravya-lobhataḥ—from greed for wealth; vṛttyai—for livelihood; narakam—to hell; dhruvam—surely."],["In every temple and in fire-rites, whoever acts from greed for wealth, O virtuous one, obtains a downward course.","deva-ālayeṣu—in temples; agni-kāryam—in fire-rites; dravya-lobhena—from greed for wealth; adhaḥ-gatim—a downward course; avāpnuyāt—obtains."],["In every temple except Śiva’s temple, worship of the gods or fire-rites, O king,","varjayitvā—excepting; śiva-ālayam—Śiva’s temple; devānām pūjanam—worship of the gods; agni-kāryeṣu—in fire-rites."],["the Bhojakas are remembered as having authority, without doubt. Worshipping the gods, they attain the highest state.","adhikāraḥ—authority; smṛtaḥ—is remembered; bhojakānām—of Bhojakas; na saṃśayaḥ—without doubt; pūjayantaḥ—worshipping; parām gatim—the highest state."],["Because they eat the offering and feed Bhāskara, and worship the gods by the divine tantra, they have gone [to the highest state].","naivedyam—offering; bhuñjate—they eat; bhojayanti—they feed; bhāskaram—Bhāskara; divya-tantreṇa—by divine tantra; te gatāḥ—they have gone."],["Having worshipped the gods and eaten the Lord’s offering, they go to the highest abode where the god Divākara is.","pūjayitvā—having worshipped; devān—the gods; naivedyam—offering; bhakṣya—having eaten; paramam sthānam—the highest abode; divākaraḥ—Divākara."],["A Brāhmaṇa should also say to him when the occasion is pressing, O great-minded one: “I shall do this for welfare, not for myself or for you, O lord.”","brāhmaṇaḥ—a Brāhmaṇa; brūyāt—should say; tīkṣṇe sati—when urgent; evaṃ kariṣye—I shall do thus; śreyaḥ-artham—for welfare; na ātmanaḥ—not for myself."],["Having addressed him thus, he should go home, O delight of the Kurus. The next day, having worshipped Divākara with devotion,","āmantrya—having addressed; gacchet—should go; sva-gṛham—to his home; pare ahni—on the next day; sampūjya—having worshipped; bhaktyā—with devotion."],["and having made the fire, O king, he should then feed Brāhmaṇas rice and mung beans, fragrant mung beans indeed,","pāvakam—the fire; kṛtvā—having made; brāhmaṇān—Brāhmaṇas; bhojayet—should feed; śāli-odanam—cooked rice; mudgam—mung beans."],["and cakes, jaggery-cakes, milk, and curds, O king. With these Bhāskara becomes satisfied, O best of men.","apūpān—cakes; guḍa-pūpān—jaggery-cakes; payaḥ—milk; dadhi—curds; tṛptim āyāti—becomes satisfied."],["Hear from me what is forbidden, O best of the Bharatas: kulattha beans, lentils, niṣpāva beans, and the like,","varjyāni—forbidden; kulatthakān—kulattha beans; masūrān—lentils; niṣpāva-ādīn—niṣpāva beans and the like."],["śisruka and other things, and likewise rājamāṣa beans—one who desires his welfare should not offer these to Bhāskara.","śisrukam—śisruka; anyat—other; rājamāṣān—rājamāṣa beans; na dadyāt—should not give; bhāskare—to Bhāskara; śreyaḥ—welfare."],["Nor should one give to Bhāskara anything foul-smelling, pungent, very small, or grains of rice mixed together.","dur-gandham—foul-smelling; kaṭukam—pungent; ati-alpam—very small; vim iśrān—mixed; taṇḍulān—rice grains; na dadyāt—should not give."],["Having thus fed the Brāhmaṇa, one should partake of the Arka-cup, bowing to the god with the head and with water.","bhojya—having fed; dvijam—the twice-born; prāśayet—should partake; arka-sampuṭam—the Arka-cup; praṇamya—having bowed; śirasā—with the head; udakena—with water."],["Whoever, having taken the banner, worships elsewhere for livelihood—his ancestors do not eat, nor the gods, nor human beings.","ketanam—banner; gṛhītvā—having taken; anyatra—elsewhere; bhajate—worships; na aśnanti—do not eat; pitaraḥ—ancestors; devāḥ—gods; mānavāḥ—humans."],["Leaving the city, O king, and going to the northeast, [find] an excellent Arka plant in a clean place, neither too high nor too low.","niṣkramya—leaving; nagarāt—the city; pūrva-uttarām diśam—the northeast; śucau deśe—in a clean place; arkam uttamam—excellent Arka; na ati-ucce—not too high; na ati-nīce—not too low."],["Having seen it grown, O mighty-armed one, worship it, O best of birds; its branches are directed toward the northeast, O king.","jātam—grown; dṛṣṭvā—having seen; pūjayitvā—having worshipped; śākhāḥ—branches; pūrva-uttara-gatāḥ—directed northeast."],["At the branch-tip, in a very fine vessel resting on a sprout, firmly joined and not separate, having worshipped, one should return home.","śākhāyāḥ agrataḥ—at the branch-tip; pātre—in a vessel; su-sūkṣme—very fine; pallava-āśrite—resting on a sprout; suśliṣṭe—firmly joined; gṛham āvrajet—should return home."],["Having bathed, one should worship Vivasvat with Arka flowers, O best of birds, and, having fed Brāhmaṇas, [say], “May Arka be pleased.”","snātaḥ—having bathed; vivasvantam—Vivasvat; arka-puṣpaiḥ—with Arka flowers; brāhmaṇān bhojayitvā—having fed Brāhmaṇas; arkaḥ me prīyatām—may Arka be pleased with me."],["Then, restrained in speech, one should partake of the Arka-cup with the mantra, without touching the cup with the teeth, before the god, O hero.","mantreṇa—with the mantra; arka-puṭam—the Arka-cup; bhuñjīta—should eat; vāk-yataḥ—restrained in speech; deva-agrataḥ—before the god; daśanaiḥ—with teeth; aspṛśan—not touching."],["“Oṃ, Arka-cup, auspiciousness to you; may there always be auspiciousness to Arka. Make auspiciousness for me also; become the giver of expiation.”","oṃ—Oṃ; arka-sampuṭa—Arka-cup; bhadram te—auspiciousness to you; arkam—to Arka; sadā—always; mama api—for me also; kuru—make; prāyaścitta-pradaḥ—giver of expiation."],["Reciting this mantra, remembering Arka, and standing facing east, one should partake of it with water, O king.","imam mantram—this mantra; japan—reciting; smaran—remembering; arkam—Arka; sthitvā—standing; pūrva-mukhaḥ—facing east; vāriṇā saha—with water."],["Whoever partakes, O king, reaches the highest state, without touching with his teeth that cup called Arka, O hero.","prāśya—having partaken; yaḥ—whoever; saḥ yāti—he goes; paramām gatim—to the highest state; dantaiḥ aspṛśya—not touching with teeth; arka-saṃjñitam—called Arka."],["By this procedure Saptamī should always be performed throughout the year, O mighty-armed one, with faith, for Arka’s pleasure.","anena vidhinā—by this procedure; kartavyā—to be done; saptamī—Saptamī; sadā—always; yāvat varṣe—throughout the year; arkasya prītaye—for Arka’s pleasure."],["The man who performs this Saptamī, pleasing Bhāskara, has inexhaustible, unshakable wealth for seven generations.","imām saptamīm—this Saptamī; kuryāt—performs; bhāskaram prīṇayan—pleasing Bhāskara; akṣayam—inexhaustible; vittam—wealth; sapta-pauruṣam—for seven generations."],["Gold, silver, copper, and gold likewise. Having performed this, Kauthumi attained success and went suddenly.","suvarṇam—gold; rajatam—silver; tāmram—copper; kṛtvā—having done; siddhim āyātaḥ—attained success; kauthumiḥ—Kauthumi; sahasā—suddenly; gataḥ—went."],["Freed from leprosy, King Jayastoma, Bṛhadbala-dhvaja, Kopī, Yājñavalkya, and Kṛṣṇaja,","kuṣṭha-rogāt—from leprosy; muktaḥ—freed; jaya-stomaḥ—Jayastoma; mahī-patiḥ—king; bṛhad-bala-dhvajaḥ—Bṛhadbala-dhvaja; yājñavalkyaḥ—Yājñavalkya; kṛṣṇa-jaḥ—Kṛṣṇaja."],["having worshipped Arka, attained equality with Arka. This Saptamī is most blessed, sacred, and sin-destroying.","arkam—Arka; samārādhya—having worshipped; arka-sāmyatām—equality with Arka; dhan yatamā—most blessed; puṇyā—sacred; pāpa-nāśinī—sin-destroying."],["Especially for those reading, hearing, and performing it, O king, this should always be done according to rule, for welfare, O sinless one.","paṭhatām—of those reading; śṛṇvatām—of those hearing; kurvatām—of those doing; viśeṣataḥ—especially; sadā kāryā—always to be done; vidhi-vat—according to rule; śreyase—for welfare."],["Śatānīka said: I have heard many times how Janaka and others attained success by worshipping Bhānu, but I have not heard how Kauthumi did so.","janaka-ādayaḥ—Janaka and others; siddhim gatāḥ—attained success; bhānum—Bhānu; prapūjya—having worshipped; śrutam mayā—heard by me; bahuśaḥ—many times; na śrutam—not heard; kauthumiḥ yathā—how Kauthumi."],["Having attained success by worshipping Arka and been freed from leprosy, O good-vowed one, who was that Brāhmaṇa Kauthumi, and how did he obtain leprosy?","siddhim—success; gataḥ—having attained; arkam—Arka; ārādhya—having worshipped; kuṣṭhāt—from leprosy; muktaḥ—freed; ca—and; suvrata—O good-vowed one; kaḥ—who; asau—that; kauthumiḥ—Kauthumi; vipraḥ—Brāhmaṇa; katham—how; kuṣṭham—leprosy; avāptavān—obtained."],["How did he worship Bhānu, lord of the gods, O twice-born? Tell me all this completely, in brief, O Brāhmaṇa.","katham—how; ārādhayāmāsa—worshipped; bhānum—Bhānu; deva-patim—lord of the gods; dvija—O twice-born; etat—this; me—to me; vipra—O Brāhmaṇa; nikhilam—completely; kīrtayasva—tell; samāsataḥ—in brief."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:210,verseCount:84,subtitle:"Chapter 210 — Sun-Worship Procedure",colophon:""},T);</script></body>
