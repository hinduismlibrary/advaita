<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 201 — Procedure for Worship of the Solar-Orb Deities."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 201 — Procedure for Worship of the Solar-Orb Deities — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 201 — Procedure for Worship of the Solar-Orb Deities</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Vyāsa said. Now I shall tell you the dialogue that increases dharma, of the eldest of the gods and Keśava, O Bhārata.","atha — now; tvām — to you; kathayiṣyāmi — I shall tell; aham — I; saṃvādam — dialogue; dharma-vardhanam — increasing dharma; sura-jyeṣṭhasya — of the eldest of the gods; devasya — of the god; keśavasya ca — and of Keśava; bhārata — O Bharata."],["In Manovatī, Viṣṇu bowed his head to the eldest of the gods, the four faced one seated comfortably, and spoke these words.","manovatyām — in Manovatī; sura-jyeṣṭham — the eldest of gods; sukha-āsīnam — seated comfortably; catur-mukham — the four-faced one; praṇamya — having bowed; śirasā — with the head; viṣṇuḥ — Viṣṇu; idam vacanam — these words; abravīt — spoke."],["Viṣṇu said. O Bhagavān, Lord of the gods, eldest of the gods, four faced one, tell the procedure for worship of the great souled Bhāskara.","bhagavan — O Bhagavan; deva-deva-īśa — Lord of gods; sura-jyeṣṭha — eldest of gods; catur-mukha — O four-faced one; ārādhana-vidhim — procedure of worship; brūhi — tell; bhāskarasya — of Bhāskara; mahātmanaḥ — the great-souled."],["How should one worship Bhānu, the lord of day, situated in the maṇḍala. Tell me here the group of deities by which I may worship the all pervading one.","katham — how; ārādhayet — should worship; bhānum — Bhānu; maṇḍala-stham — situated in the maṇḍala; divas-patim — the Lord of day; brūhi — tell; me — me; atra — here; gaṇam devam — group of deities; yena — by which; aham — I; pūjaye — may worship; vibhum — the Mighty One."],["Brahmā said. Well, well, O mighty armed one. Well have I been asked, O bearer of the earth. Hear with one mind the procedure for worshipping Bhāskara.","sādhu sādhu — well, well; mahā-bāho — O great-armed one; sādhu — well; pṛṣṭaḥ asmi — I have been asked; bhūdhara — O bearer of the earth; śṛṇu — hear; eka-manāḥ — with one mind; deva — O god; bhāskara-ārādhane — for worshipping Bhāskara; vidhim — the procedure."],["Having worshipped the pure god Khaṣolka, Vibhāvasu, one should place them in the east, middle, southeast, at Virūpākṣa, and among the radiant ones.","khaṣolkam — Khaṣolka; nirmalam devam — the pure god; pūjayitvā — having worshipped; vibhāvasum — Vibhāvasu; pūrve — in the east; madhye — in the middle; tathā — likewise; āgneyyām — in the southeast; virūpākṣe — at Virūpākṣa; prabham jane — among the radiant ones."],["In due order up to the northeast, one should place them in the heart with the seed. This is the seat of Khaṣolka, placed by the best of men.","krameṇa — in order; yāvat — up to; īśānīm — the northeast; hṛdi — in the heart; bījena — with the seed; vinyaset — one should place; khaṣolka-āsanam — Khaṣolka’s seat; etat — this; tu — indeed; vinyastam — placed; mānava-uttamaiḥ — by the best of men."],["Then above it, with the heart, a kañcuka, joined with seven coverings, eight petalled, with a pericarp.","tataḥ — then; tasya upariṣṭāt — above it; hṛdayena — with the heart [seed]; tu — indeed; kañcukam — a covering; sapta-āvaraṇa-saṃyuktam — joined with seven coverings; aṣṭa-patram — eight-petalled; sa-karṇikam — with a pericarp."],["With hanging filaments, five coloured, greatly wonderful, made according to the procedure for the ritual ground, by the procedure stated in the śāstra.","kesara-ālamba-devatvam — deity with filaments; pañca-varṇam — five-coloured; mahā-adbhutam — greatly wonderful; parīkṣā-bhūmi-vidhi-vat — according to the procedure of the testing ground; śāstra-ukta-vidhinā — by the procedure stated in the śāstra; kṛtam — made."],["Beginning with Dīptā in the east, up to the region of Īśāna, the mantra knower should place the eight śaktis, with Sarvatomukhī in the middle.","dīptā-ādi — beginning with Dīptā; pūrvāt ārabhya — beginning from the east; yāvat — up to; īśāna-gocharam — the northeast region; nyaset — should place; śakti-aṣṭakam — the eight śaktis; mantrī — the mantra-knower; madhyataḥ — in the middle; sarvato-mukhīm — Sarvatomukhī."],["Dīptā, Sūkṣmā, Jayā, Bhadrā, Vibhūti, and likewise Vimalā. Amoghā and Vidyutā, and ninth, Sarvatomukhī.","dīptā — Dīptā; sūkṣmā — Sūkṣmā; jayā — Jayā; bhadrā — Bhadrā; vibhūtiḥ — Vibhūti; vimalā tathā — and likewise Vimalā; amoghā — Amoghā; vidyutā ca — and Vidyutā; navamī — ninth; sarvato-mukhī — Sarvatomukhī."],["Then one should invite Bhānu and place him upon the pericarp. Having performed attendance with this mantra, O good vowed one.","tataḥ — then; āvāhayet — one should invite; bhānum — Bhānu; sthāpayet — should place; karṇika-upari — upon the pericarp; upasthānam — attendance; tu — indeed; vai — certainly; kṛtvā — having made; mantreṇa anena — with this mantra; su-vrata — O good-vowed one."],["Udutyaṃ Jātavedasam is declared the mantra. With the mantra Agnim Dūtena, O one of good vows.","udutyam-jātavedasam — “Udutyaṃ Jātavedasam”; iti — thus; mantraḥ — the mantra; prakīrtitaḥ — is declared; agnim-dūtena — with “Agnim Dūtena”; mantreṇa — with the mantra; anena — this; viśva-su-vrata — O one of universal good vows."],["With the mantra Ā Kṛṣṇena Rajasā one should worship. With the mantra Haṃsaḥ Śuciṣad one should worship Arka.","ā-kṛṣṇena-rajasā — “Ā Kṛṣṇena Rajasā”; mantreṇa — with the mantra; anena — this; ca — and; arcayet — one should worship; haṃsaḥ-śuciṣat — “Haṃsaḥ Śuciṣad”; iti — thus; mantreṇa — with the mantra; arkam — Arka; prapūjayet — should worship well."],["With Apaptetārakam one should worship the goddess Dīptā. With Adṛśramasya Ketavaḥ one should worship the subtle goddess.","apaptetārakam — “Apaptetārakam”; devī-dīptā — goddess Dīptā; anena — with this; prapūjayet — one should worship well; adṛśramasya-ketavaḥ — “Adṛśramasya Ketavaḥ”; sūkṣmām devīm — the subtle goddess; samarcayet — one should worship."],["With Taraṇir Viśvadarśa one should always worship Jayā. With Pratyaṅ Devānāṃ Viśe one should worship the goddess Bhadrā.","taraṇiḥ-viśvadarśa — “Taraṇir Viśvadarśa”; iti — thus; anena — with this; satatam — always; jayam — Jayā; pratyaṅ-devānām-viśe — “Pratyaṅ Devānāṃ Viśe”; bhadrām devīm — goddess Bhadrā; samarcayet — one should worship."],["One should always worship Vibhūti with Yenāpāvakacakṣasā. With the mantra Vidyām Eṣi one should always worship Vimalā.","vibhūtim — Vibhūti; arcayet — one should worship; nityam — always; yena-apāvaka-cakṣasā — “Yenāpāvaka-cakṣasā”; vidyām-eṣi — “Vidyām Eṣi”; mantreṇa — with the mantra; hi — indeed; anena — this; vimalām — Vimalā; sadā — always."],["One should always worship Amoghā with this mantra, O good vowed one. One should always worship the ninth goddess, Sarvatomukhī.","amoghām — Amoghā; pūjayet — one should worship; nityam — always; mantreṇa anena — with this mantra; su-vrata — O good-vowed one; navamīm devīm — the ninth goddess; pūjayet — one should worship; satatam — always; sarvato-mukhīm — Sarvatomukhī."],["With this mantra of Kṛṣṇa, Udvayantam, and likewise Udyann Adya Mitra Homam, one should proceed to the first syllable.","mantreṇa anena — with this mantra; kṛṣṇasya — of Kṛṣṇa; udvayantam — “Udvayantam”; iti — thus; iha — here; udyan-adya-mitra-homam — “Udyann Adya Mitra Homam”; prathamam akṣaram — the first syllable; vrajet — one should proceed."],["One should worship the second, Kṛṣṇa, Hari among the white ones in battle. Udagād Ayam Ādityaḥ is likewise the third.","dvitīyam — the second; pūjayet — one should worship; kṛṣṇam — Kṛṣṇa; śukleṣu — among the white ones; harim — Hari; āhave — in battle; udagāt ayam ādityaḥ — “Udagād Ayam Ādityaḥ”; anena api — by this also; tṛtīyakam — the third."],["Tat Savitur Vareṇyam is declared as the fourth. Mahito Mahitoya should be recited as a five verse hymn.","tat-savituḥ-vareṇyam — “Tat Savitur Vareṇyam”; iti — thus; caturtham — fourth; parikīrtitam — declared; mahitaḥ-mahitoya — “Mahito Mahitoya”; iti — thus; pañca-ṛcam — five verses; parikīrtayet — should recite."],["Hiraṇyagarbhaḥ Samavartata is declared the sixth seed. Savitā Paścātāt Purastāt is the seventh, O best of gods.","hiraṇya-garbhaḥ-samavartata — “Hiraṇyagarbhaḥ Samavartata”; ṣaṣṭham — sixth; bījam — seed; prakīrtitam — declared; savitā — Savitā; paścāt — behind; purastāt — before; saptamam — seventh; deva-sattama — O best of gods."],["Having placed the seeds thus, the twice born should establish Āditya. The wise one should establish Āditya in meditation and worship all of them.","evam — thus; bījāni — seeds; vinyasya — having placed; ādityam — Āditya; sthāpayet — should establish; dvijaḥ — the twice-born; ādityam — Āditya; sthāpayet — should establish; dhyāne — in meditation; sarveṣām — of all; pūjayet — should worship; budhaḥ — the wise one."],["Outside, all around Indra and the others, O tiger among gods, the red coloured, greatly radiant one stands upon a white lotus.","bāhyataḥ — outside; deva-śārdūla — O tiger among gods; indra-ādīnām — of Indra and the others; samantataḥ — on every side; rakta-varṇam — red-coloured; mahā-tejam — greatly radiant; śita-padma-upari-sthitam — standing upon a white lotus."],["Joined with all marks, adorned with all ornaments, two armed, with one wheel, gentle, with lotus and bow in hand.","sarva-lakṣaṇa-saṃyuktam — joined with all marks; sarva-ābharaṇa-bhūṣitam — adorned with all ornaments; dvi-bhujam — two-armed; ca — and; eka-cakram — having one wheel; saumyam — gentle; padma-dhanuḥ-karam — with lotus and bow in hand."],["Situated in the middle of that circular orb, very radiant, this form of Āditya is worshipped in all worlds.","vartulam — circular; tena bimbena — by that orb; madhya-stham — situated in the middle; ati-tejasam — very radiant; ādityasya — of Āditya; tu — indeed; idam rūpam — this form; sarva-lokeṣu — in all worlds; pūjitam — worshipped."],["Having meditated, one should always worship the sthaṇḍila supported by the maṇḍala.","dhyātvā — having meditated; sampūjayet — should worship; nityam — always; sthaṇḍilam — on the sthandila; maṇḍala-āśritam — resting upon the maṇḍala."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:201,verseCount:27,subtitle:"Chapter 201 — Procedure for Worship of the Solar-Orb Deities",colophon:""},T);</script></body>
