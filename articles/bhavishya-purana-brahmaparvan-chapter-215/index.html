Saptamī, remembered with neem leaves, supreme and destroying disease.","tṛtīyām—the third; saptamīm—Saptamī; vīra—O hero; śṛṇu—hear; gadataḥ mām—from me speaking; nimba-patraiḥ—with neem leaves; smṛtā—remembered; paramā—supreme; roga-nāśinī—destroying disease."],["What other worship procedure is there by which one worships Ravi, the god of gods Śārṅgapāṇi, bearer of conch, discus, and mace.","yathā—by which; arcana-vidhiḥ—worship-procedure; anyaḥ—another; yena—by which; pūjayate—worships; ravim—Ravi; deva-devaḥ—god of gods; śārṅga-pāṇiḥ—Śārṅgapāṇi; śaṅkha-cakra-gadā-dharaḥ—bearing conch, discus, and mace."],["Now I speak the worship procedure. Hear from me the extraction of the mantras.","atha—now; arcana-vidhim—worship-procedure; vacmi—I shall speak; mantra-uddhāram—mantra-extraction; nibodha—hear; me—from me."],["Oṃ, salutation to Khaṣolka, the root mantra. Oṃ, Viṭi Viṭi, the head. Oṃ, to the thousand rayed one, the weapon. Oṃ, to the thousand rayed one, the upper bond. Oṃ, to the dense one, source of beings, salutation, thus the bond of beings. Oṃ, blaze, blaze, kindle, kindle, fire enclosure.","khaṣolkāya namaḥ—salutation to Khaṣolka; mūla-mantraḥ—root-mantra; viṭi viṭi—Viṭi Viṭi; śiraḥ—head; sahasra-raśmaye—to the thousand-rayed one; astram—weapon; ūrdhva-bandhaḥ—upper bond; ghanāya—to the dense one; bhūta-bhāvine—to source of beings; jvala—blaze; prajvala—burn; agni-prakara—fire-enclosure."],["Oṃ, we know Āditya. We meditate on Viśvabhāga. May that Sun impel us.","oṃ—Oṃ; ādityāya—to Āditya; vidmahe—we know; viśva-bhāgāya—to the all-pervading one; dhīmahi—we meditate; tat naḥ—that [one] for us; sūryaḥ—the Sun; pracodayāt—may impel; gāyatrī-saṃkalīkaraṇam—joining together of the Gāyatrī; idam—this."],["This is the joining of the Gāyatrī. Oṃ, salutation to Dharmātman in the northeast. Oṃ, salutation to Dakṣiṇa in the southeast. Oṃ, salutation to Vajrapāṇi, the boundless one, in the north. Oṃ, salutation to Śyāma Piṅgala in the northeast. Oṃ, salutation to Amṛta in the southeast. Oṃ, salutation to Budha, son of Soma, in the south. Oṃ, salutation to Vāgīśvara, lord of all knowledge, in the southwest. Oṃ, salutation to Śukra, the great seer, Bhūta, in the west. Oṃ, salutation to Īśvara, whose self is the Sun, in the northwest. Oṃ, salutation to Kṛtavat in the north. Oṃ, salutation to Rāhu in the northeast. Oṃ, salutation to Antara, whose self is the Sun, in the east. Oṃ, salutation to Dhruva in the northeast. Oṃ, O blessed Pūṣan, garlanded one, lord of the whole world, rider of seven horses, ruler of the earth, receive the radiant form that has reached the summit of supreme attainment, endless flame, flame. This is the invocation mantra. Oṃ, salutation to the blessed Āditya, thousand rayed one, for returning again as you please.","dharmātmane namaḥ—to Dharmātman, salutation; dakṣiṇāya namaḥ—to Dakṣiṇa; vajra-pāṇaye anantāya—to Vajrapāṇi, the infinite; śyāma-piṅgalāya—to Śyāma-Piṅgala; amṛtāya—to Amṛta; budhāya soma-sutāya—to Budha, son of Soma; vāg-īśvarāya sarva-vidyā-adhipataye—to Vāgīśvara, lord of all knowledge; śukrāya mahāṛṣaye bhūtāya—to Śukra, great seer, Bhūta; īśvarāya sūryātmane—to Īśvara, Sun-self; kṛtavate—to Kṛtavat; rāhave—to Rāhu; dhruvāya—to Dhruva; āvāhana-mantraḥ—invocation-mantra; bhagavate—blessed; pūṣan—Pūṣan; sakala-jagat-pate—lord of the whole world; sapta-aśva-vāhana—rider of seven horses; gṛhṇa—receive; tejo-rūpam—radiant form; ananta-jvāla—endless flame; punar-āgamanāya—for return again."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:215,verseCount:6,subtitle:"Chapter 215 — Solar Mantra Extraction",colophon:""},T);</script></body>
