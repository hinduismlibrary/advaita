<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 194 — Dreams in the Sun–Aruṇa Dialogue."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 194 — Dreams in the Sun–Aruṇa Dialogue — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 194 — Dreams in the Sun–Aruṇa Dialogue</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Now I shall speak further what fruits are obtained from the various dreams seen on Saptamī by a man observing a fixed vow.","ataḥ param — thereafter; pravakṣyāmi — I shall speak; yaiḥ yaiḥ — from whichever; yat phalam — what fruit; aśnute — one obtains; svapne dṛṣṭe — when seen in a dream; tu saptamyām — on Saptamī; puruṣaḥ — a man; niyata-vrataḥ — observing a fixed vow."],["Having properly completed all acts beginning with japa and homa, one should take a bed on the ground and contemplate the God of gods.","samāpya — having completed; vidhi-vat — according to rule; sarvām — all; japa-homa-ādikām kriyām — acts beginning with japa and homa; bhūmau — on the ground; śayyām samāsthāya — having taken a bed; deva-devam — the God of gods; vicintayet — one should contemplate."],["If a man asleep sees the Sun in a dream, or Indra’s banner, or the Moon, all prosperities are his.","hanta — indeed; suptaḥ — asleep; yadi — if; naraḥ — a man; paśyet — sees; svapne — in a dream; divākaram — the Sun; śakra-dhvajam vā — or Indra’s banner; candram vā — or the Moon; tasya — for him; sarvāḥ samṛddhayaḥ — all prosperities."],["A water-vessel, fly-whisk, mirror, and gold ornaments; a flow of blood and falling hair are causes of prosperity; climbing a tree in a dream quickly brings prosperity in battle.","bhṛṅgāra — water-vessel; camara — fly-whisk; ādarśa — mirror; kanaka-ābharaṇāni ca — and gold ornaments; rudhirasya srutiḥ — flow of blood; keśa-pātam — falling hair; aiśvarya-kārakaḥ — causes of prosperity; svapne — in a dream; vṛkṣa-adhirohe — in climbing a tree; tu — indeed; kṣipram — quickly; aiśvaryam āhave — prosperity in battle."],["Milking a female buffalo, lioness, monitor lizard, or cow with one’s own hand, and binding them, bring kingship; touching the navel brings an evil mind.","dohanam — milking; mahiṣī-siṃhī-godha-dhenūnām — of female buffaloes, lionesses, monitor lizards, and cows; kare sve — with one’s own hand; bandhaḥ ca āsām — and their binding; rājya-lābhaḥ — gain of kingship; nābheḥ sparśe tu — but at the touch of the navel; durmatiḥ — an evil mind."],["Killing a sheep and eating it oneself, [eating] a lion, a lotus, one’s own limb and bone, fire, and drinking liquor, O lord of birds","avim hatvā — having killed a sheep; svayam khādet — one would eat oneself; siṃham — a lion; ambujam eva ca — and a lotus; sva-aṅgam — one’s own limb; asthi — bone; hutāśam ca — and fire; surā-pānam — drinking liquor; khaga-adhipa — O lord of birds."],["a man who eats pāyasa in a golden or silver vessel, or on a lotus leaf, has equal prosperity.","haime vā — in a golden [vessel], or; rājate vā — in a silver [one]; yaḥ — whoever; bhuṃkte — eats; pāyasam — pāyasa; naraḥ — a man; pātre tu — in a vessel; padma-patre vā — or on a lotus leaf; tasya — for him; aiśvaryam samam bhavet — prosperity becomes equal."],["Victory in gambling or in battle is happiness-bringing; the burning of one’s own body and binding of the head bring prosperity.","dyūte — in gambling; ca — and; atha vā — or; yuddhe — in battle; vijayaḥ — victory; hi — indeed; sukha-āvahaḥ — happiness-bringing; gātrasya svasya jvalanam — burning of one’s own body; śiraḥ-bandhaḥ ca — and binding of the head; bhūtaye — for prosperity."],["White garlands and garments, horses, animals, and birds are always praised as gains; smearing with excrement as well.","mālyāmbarāṇām śuklānām — of white garlands and garments; hayānām — of horses; paśu-pakṣiṇām — animals and birds; sadā — always; lābham praśaṃsanti — they praise as gain; viṣṭhānām ca anulepanam — and smearing with excrement."],["Riding a horse brings quick [success], riding a chariot brings children; having many heads and arms creates wealth for a householder.","haya-yāne — in riding a horse; bhavet kṣipram — it comes quickly; ratha-yāne — in riding a chariot; prajā-āgamaḥ — arrival of children; nānā-śiraḥ-bāhutā ca — and having many heads and arms; gṛha-sthām — for a householder; kurute śriyam — makes prosperity."],["Going to one who should not be approached is auspicious; Veda-study is excellent; gods, foremost dvijas, heroes, gurus, elders, and ascetics.","agamya-gamanam — going to an inaccessible woman; dhanyam — auspicious; veda-adhyayanam — Veda-study; uttamam — excellent; deva-dvija-śreṣṭha-vīra-guru-vṛddha-tapasvinaḥ — gods, foremost dvijas, heroes, gurus, elders, and ascetics."],["Whatever these say to a man in a dream, they know to be true; their sight is auspicious and their words are blessings, O lord of birds.","yat vadanti — what they say; naram — to a man; svapne — in a dream; satyam eva — as true indeed; iti — thus; tat viduḥ — they know that; praśastam — auspicious; darśanam ca — and the sight; eṣām — of these; āśīrvādaḥ — a blessing; khaga-adhipa — O lord of birds."],["There is kingship when one’s own head is cut off; wealth comes from a great killing; weeping brings food, and bonds bring kingship.","rājyam syāt — there would be kingship; sva-śiraḥ-chede — in the cutting off of one’s own head; dhanam — wealth; bahu-vadhe bhavet — comes from a great killing; rudite — in weeping; bhakṣya-samprāptiḥ — attainment of food; rājyam — kingship; nigada-bandhane — in being bound in chains."],["He who boldly mounts a mountain, horse, lion, bull, or elephant indeed obtains great sovereignty.","parvatam — a mountain; turagam — a horse; siṃham — a lion; vṛṣabham — a bull; gajam eva hi — and indeed an elephant; yaḥ — whoever; vikramya — boldly; adhirohati — mounts; mahad-aiśvaryam āpnoti — obtains great sovereignty."],["Taking planets and stars in hand, turning Marīci, and uprooting mountains, one becomes king on earth.","āgṛhṇānaḥ — taking; grahān — planets; tārāḥ — stars; marīcim — Marīci/ray; parivartayan — turning; unmūlayati — uproots; parvatān ca — and mountains; rājā bhavati — becomes king; bhūtale — on earth."],["The coming out of all the intestines from the body, O lord of birds, and drinking oceans and rivers cause prosperity and happiness.","dehāt niṣkrāntiḥ — coming out from the body; antrāṇām sarveṣām — of all the intestines; khaga-adhipa — O lord of birds; pānam — drinking; samudra-saritām — oceans and rivers; aiśvarya-sukha-kārakam — causes prosperity and happiness."],["Whoever, by strength, reaches even the far shore of the ocean, O hero, will have firm offspring, O lord of birds.","balam — by strength; ca — and; ambu-nidhim vā api — even the ocean; tīrtha-pāram — the far shore; prayāti yaḥ — whoever reaches; tasya — his; apatyam — offspring; bhavet — will be; vīra — O hero; acalam ca — and firm; khaga-adhipa — O lord of birds."],["Wealth comes quickly if a worm eats [one]; there is gain and sight of beautiful limbs, union with auspicious things, health, and wealth.","bhavati — comes to be; artha-āgamaḥ — arrival of wealth; śīghram — quickly; kṛmiḥ vā — or a worm; yadi bhakṣayet — if it eats; aṅgānām surūpāṇām — of beautiful limbs; lābhaḥ — gain; darśanam eva ca — and seeing; saṃyogaḥ ca eva — and union; māṅgalyaiḥ — with auspicious things; ārogyam — health; dhanam eva ca — and wealth."],["In the dream that is declared to bring prosperity and kingship, there is no doubt [about its result] on the seventh; heard on the fourth, it is excellent.","aiśvaryam — prosperity; rājya-lābhaḥ ca — and gain of kingship; yasmin svapne — in whichever dream; udāhṛtaḥ — declared; saptasyāt — on the seventh [day/night]; na saṃdehaḥ — no doubt; caturbhiḥ — on the fourth; śrutaḥ — heard/seen; uttamaḥ — excellent."],["On the fifth, abundance of sons; on the sixth, long life, sons, and wealth; on the seventh, various desires; on the eighth, varied fame.","pañcabhiḥ — on the fifth; putra-bāhulyam — abundance of sons; ṣaḍbhiḥ — on the sixth; āyuḥ — long life; sutān — sons; dhanam — wealth; saptabhiḥ — on the seventh; vividhān kāmān — various desires; aṣṭabhiḥ — on the eighth; vividham yaśaḥ — varied fame."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:194,verseCount:20,subtitle:"Chapter 194 — Dreams in the Sun–Aruṇa Dialogue",colophon:""},T);</script></body></html>
