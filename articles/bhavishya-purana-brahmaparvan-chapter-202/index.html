<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 202 — Procedure for Worshipping Āditya."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 202 — Procedure for Worshipping Āditya — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 202 — Procedure for Worshipping Āditya</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Viṣṇu said. O best of the gods, tell me the procedure by which a man should worship Bhāskara situated in the maṇḍala with devotion.","maṇḍala-stham — situated in the maṇḍala; sura-śreṣṭha — O best of gods; vidhinā — according to rule; yena — by which; bhāskaram — Bhāskara; pūjayet — would worship; mānavaḥ — a man; bhaktyā — with devotion; saḥ vidhiḥ — that procedure; kathyatām — let it be told; mama — to me."],["By what procedure should one worship Bhāskara, born from the lotus, situated in the image, all pervading, the god worshipped by gods and asuras.","pūjayet — should worship; vidhinā — by the procedure; yena — by which; bhāskaram — Bhāskara; padma-sambhavam — born from the lotus; mūrti-stham — situated in the image; sarva-gam — all-pervading; devam — god; pūjitam — worshipped; sa-sura-asuraiḥ — by gods and asuras."],["Brahmā said. Well, Kṛṣṇa, O mighty armed one, well have I been asked, O good vowed one. Hear with one mind first how one should worship him situated in the image.","sādhu — well; kṛṣṇa — O Kṛṣṇa; mahā-bāho — O great-armed one; sādhu pṛṣṭaḥ asmi — well have I been asked; su-vrata — O good-vowed one; śṛṇu — hear; eka-manāḥ — with one mind; pūrvam — first; mūrti-stham — situated in the image; yena — how; pūjayet — one should worship."],["With the mantra Iṣe Tvā one should always worship the upper body. With the mantra Agnim Īḷe one should worship the right hand.","iṣe-tvety — “Iṣe Tvā”; mantreṇa — with the mantra; uttama-aṅgam — upper body; sadā — always; arcayet — one should worship; agnim-īḷe — “Agnim Īḷe”; mantreṇa — with the mantra; pūjayet — one should worship; dakṣiṇe kare — the right hand."],["With the mantra Agnā Āyāhi one should worship the feet of the god. With the mantra Ājighre one should worship with a flower garland.","agna āyāhi — “Agnā Āyāhi”; mantreṇa — with the mantra; pādau — feet; devasya — of the god; pūjayet — one should worship; ājighre — “Ājighre”; ca — and; mantreṇa — with the mantra; puṣpa-mālayā — with a flower garland; pūjayet — one should worship."],["With the mantra Yogayogati one should cast a handful of released flowers. With Samudraṃ Gaccha, as declared, one should bathe Ravi.","yoga-yogati — “Yogayogati”; mantreṇa — with the mantra; mukta-puṣpa-añjalim — a released handful of flowers; kṣipet — should cast; samudram gaccha — “Samudraṃ Gaccha”; yat proktam — as declared; anena — with this; snāpayet — should bathe; ravim — Ravi."],["With what is declared as Imaṃ Me Gaṅge, likewise, O bearer of the earth. With the mantra Samudrajye one should apply pastes.","imam me gaṅge — “Imaṃ Me Gaṅge”; iti — thus; yat proktam — what is declared; anena api — likewise with this; bhūdhara — O bearer of the earth; samudra-jye — “Samudrajye”; mantreṇa — with the mantra; kaṣāyaiḥ — with pastes; parirūpayet — one should apply."],["One should bathe with milk, O Kṛṣṇa, by the mantra Āpyāyasva. With the mantra Dadhikrāvṇe one should bathe Ravi with curds, as with curds.","snāpayet — should bathe; payasā — with milk; kṛṣṇa — O Kṛṣṇa; āpyāyasva — “Āpyāyasva”; mantra-taḥ — by the mantra; dadhikrāvṇā — with “Dadhikrāvṇe”; iti — thus; vai — indeed; dadhnā — with curd; snāpayet — should bathe; dadhivat — as with curd; ravim — Ravi."],["The supreme bath is with ghee by Tejo Asi Śukram. Bathing with herbs by the mantra Yā Oṣadhīḥ is remembered.","tejaḥ asi śukram — “Tejo’si Śukram”; iti — thus; ca — and; ghṛtena — with ghee; snapanam param — supreme bathing; yā oṣadhīḥ — “Yā Oṣadhīḥ”; iti — thus; mantreṇa — with the mantra; snānam — bathing; oṣadhibhiḥ — with herbs; smṛtam — is remembered."],["Then one should massage with two footed verses, O lord of gods. One should perform the bath all at once with the mantra Mā Nastoke.","udvartayet — one should massage; tataḥ — then; dvipadābhiḥ — with the two-footed [mantras]; sura-adhipa — O lord of gods; mānastoke — “Mā Nastoke”; mantreṇa — with the mantra; yugapat — all at once; snānam — bathing; ācaret — one should perform."],["One should bathe with scented water by the mantra Viṣṇor Arāṭ. With the golden mantra one should offer arghya and pādya.","viṣṇor arāṭ — “Viṣṇor Arāṭ”; mantreṇa — with the mantra; snāpayet — should bathe; gandha-vāriṇā — with scented water; sauvarṇena — with the golden [mantra]; tu — indeed; mantreṇa — with the mantra; arghyam — arghya; pādyam — pādya; nivedayet — should offer."],["With the mantra Idaṃ Viṣṇur Vicakrame one should offer arghya. With the mantra Vedo Asi one should offer the upavīta.","idam viṣṇuḥ vicakrame — “Idaṃ Viṣṇur Vicakrame”; mantreṇa — with the mantra; arghyam — arghya; pradāpayet — one should offer; vedaḥ asi — “Vedo’si”; iti — thus; hi — indeed; mantreṇa — with the mantra; upavītam — the upavīta; pradāpayet — one should offer."],["With the mantra Bṛhaspate one should give garments to Bhānu. One should apply the flower garland that brings prosperity.","bṛhaspate — “Bṛhaspate”; mantreṇa — with the mantra; dadyāt — should give; vastrāṇi — garments; bhānave — to Bhānu; yena — by which; śriyam — prosperity; prakurvāṇām — making; puṣpa-mālam — a flower garland; prayojayet — should apply."],["With the mantra Dhūra Asi one should give incense with guggulu. With the mantra Samiddho Añjana one should give collyrium.","dhūra asi — “Dhūra Asi”; iti — thus; mantreṇa — with the mantra; dhūpam — incense; dadyāt — should give; sa-guggulam — together with guggulu; samiddhaḥ — “Samiddho”; añjana-mantreṇa — with the collyrium mantra; añjanam — collyrium; tu — indeed; prayacchati — one gives."],["With the mantra Yuñjāni one should worship Bhānu with rocanā. The wise one should make it reddish for long life.","yuñjānī — “Yuñjānī”; iti — thus; mantreṇa — with the mantra; bhānum — Bhānu; rocanayā — with rocanā; arcayet — one should worship; āraktakam — red; ca — and; vai — indeed; kuryāt — should make; dīrgha-āyuṣṭvāya — for long life; vai — indeed; budhaḥ — the wise one."],["With the thousand headed Puruṣa one should worship Ravi in the pond. With the mantra Saṃbhava one should touch the lotus eyed one.","sahasra-śīrṣā — thousand-headed; puruṣaḥ — Puruṣa; ravim — Ravi; sarasi — in the lake; pūjayet — one should worship; saṃbhava — “Saṃbhava”; iti — thus; mantreṇa — with the mantra; padma-netre — the lotus-eyed one; parāmṛśet — one should touch."],["With Viśvataś Cakṣuḥ one should touch the body of Bhānu. With this mantra Śrīś Ca Te Lakṣmīś Ca one should worship.","viśvataḥ cakṣuḥ — “Viśvataś Cakṣuḥ”; iti — thus; bhānoḥ — of Bhānu; deham — the body; samālabhet — one should touch; śrīḥ ca te lakṣmīḥ ca — “Śrīś Ca Te Lakṣmīś Ca”; iti — thus; mantreṇa anena — with this mantra; pūjayet — one should worship."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:202,verseCount:17,subtitle:"Chapter 202 — Procedure for Worshipping Āditya",colophon:""},T);</script></body>
