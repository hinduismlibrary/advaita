<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 209 — The Monthly Saptamī Vow."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 209 — The Monthly Saptamī Vow — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 209 — The Monthly Saptamī Vow</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-208/">← Chapter 208</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-210/">Chapter 210 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Sumantu said. Whoever observes twelve bright Saptamīs, eating cow dung, or barley, or even withered leaves,","yaḥ — whoever; kṣipet — spends; go-maya-āhāraḥ — having cow-dung as food; śuklāḥ dvādaśa saptamīḥ — the twelve bright Saptamīs; athavā — or; yāvaka-āhāraḥ — having barley as food; śīrṇa-parṇa-aśanaḥ api vā — or even eating withered leaves."],["Or eating milk, or one meal, or again food from alms, or even water, having worshipped Divākara, the wise one","kṣīra-aśī — living on milk; ca — and; eka-bhaktaḥ — taking one meal; vā — or; bhikṣā-āhāraḥ — living on alms; athavā punaḥ — or again; jala-āhāraḥ api vā — or even living on water; vidvān — the wise one; pūjayitvā — having worshipped; divākaram — Divākara."],["With various flower offerings, lotuses, fragrant white lilies, and utpala flowers, and with various kinds of scents, incense, gugguḷu, and sandalwood,","puṣpa-upahāraiḥ vividhaiḥ — with various flower-offerings; padma — lotuses; saugandhika — fragrant flowers; utpalaiḥ — with utpala flowers; nānā-prakāraiḥ gandhaiḥ — with various kinds of scents; dhūpaiḥ — with incense; guggulu-candanaiḥ — with gugguḷu and sandalwood."],["With dark scents, pāyasa and the like, varied and richly adorned, having worshipped the excellent Brāhmaṇas with gold, food, and the like, a man","kṛṣṇa-gandha-pāyasa-ādyaiḥ — with dark scents, pāyasa, and the like; vicitraiḥ — varied; su-vibhūṣitaiḥ — richly adorned; arcayitvā — having worshipped; dvijān śreṣṭhān — foremost twice-born; hiraṇya-anna-ādibhiḥ — with gold, food, and the like; naraḥ — a man."],["Obtains that fruit which here, O hero, is obtained only from Ravi through sacrifices with abundant dakṣiṇā.","saḥ — he; tat-phalam — that fruit; avāpnoti — obtains; kratubhiḥ — through sacrifices; bhūri-dakṣiṇaiḥ — with abundant sacrificial gifts; yat — which; iha — here; tapyate — is undergone, practiced; vīra — O hero; prāpyate — is obtained; kevalam — only; raveḥ — from Ravi."],["Having mounted an excellent vehicle, he is honoured in the world of the Sun. Then, when his merit is exhausted, O king, he is born in a great family.","vimāna-varam — an excellent vehicle; ārūḍhaḥ — having mounted; sūrya-loke — in the world of the Sun; mahīyate — is honored; tataḥ — then; puṇya-kṣayāt — when merit is exhausted; rājan — O king; kule mahati — in a great family; jāyate — is born."],["Thus, each month, with devotion and a composed mind, one should worship Vivasvat according to rule, and recite the names.","evam — thus; bhaktyā — with devotion; vivasvantam — Vivasvat; prati-māsam — each month; samāhitaḥ — with collected mind; pūjayet — one should worship; vidhi-vat — according to rule; bhaktyā — with devotion; nāmāni — names; parikīrtayet — should recite."],["In Caitra he is Viṣṇu, in Mādhava indeed Aryaman, in Śukra Vivasvat, and in Śuci Divākara.","caitrike māsi — in the month Caitra; viṣṇuḥ — Viṣṇu; mādhave — in Mādhava; aryamā iti vai — indeed Aryaman; śukre māse — in the month Śukra; vivasvān — Vivasvat; śucau māse — in the month Śuci; divākaraḥ — Divākara."],["In Śrāvaṇa he is Parjanya, in Nabhasya Varuṇa. Then he is known as Mārtaṇḍa, and again as Bhārgava in Kārttika.","parjanyaḥ — Parjanya; śrāvaṇe māsi — in the month Śrāvaṇa; nabhasye — in Bhādrapada; varuṇaḥ tathā — Varuṇa likewise; mārtaṇḍa iti — as Mārtaṇḍa; ca vijñeyaḥ — is to be known; kārtike — in Kārttika; bhārgavaḥ punaḥ — again Bhārgava."],["In Mārgaśīrṣa Mitra is always declared by the wise. In Pauṣa, Pūṣan is to be worshipped with effort.","mārgaśīrṣe api — also in Mārgaśīrṣa; mitraḥ — Mitra; tu — indeed; kīrtitaḥ — declared; satatam — always; budhaiḥ — by the wise; pūṣā — Pūṣan; pauṣe — in Pauṣa; tu vai — indeed; māsi — in the month; pūjanīyaḥ — to be worshipped; prayatnataḥ — with effort."],["In Māgha he is known as Bhaga, and in Phālguna Tvaṣṭṛ. In this order one should recite the names for the pleasure of Ravi.","māghe — in Māgha; bhaga iti — as Bhaga; vijñeyaḥ — is to be known; tvaṣṭā — Tvaṣṭṛ; ca eva — and indeed; phālgune — in Phālguna; evam krameṇa — in this order; nāmāni — names; kīrtayet — one should recite; prītaye — for the pleasure; raveḥ — of Ravi."],["Whoever performs this procedure of incense worship on Saptamī with a composed mind and devotion goes to the highest state.","dhūpa-arcana-vidhim imam — this procedure of incense-worship; saptamyām — on Saptamī; su-samāhitaḥ — with a well-collected mind; yaḥ — whoever; karoti — performs; naraḥ — a man; bhaktyā — with devotion; saḥ yāti — he goes; paramām gatim — to the highest state."],["Then, O lord, all this was told to you as the most secret. It should never be given to an uninitiated pupil or a non devotee,","tataḥ — then; te — to you; sarvam — all; ākhyātam — told; yathā — as; guhya-tamam — most secret; vibhoḥ — of the Lord; na eva deyam — should never be given; aśiṣyāya — to an uninitiated pupil; na abhaktāya — not to a non-devotee; kadācana — ever."],["Nor should it be given to an evildoer or an atheist. It should not be given to an ingrate, an atheist, O hero, or one of cruel action.","na ca — and not; pāpa-kṛte — to an evildoer; deyam — to be given; na deyam — not to be given; nāstikāya vā — or to an atheist; kṛta-ghne — to an ingrate; nāstike — to an atheist; vīra — O hero; na deyam — not to be given; krūra-karmiṇi — to one of cruel action."],["Whoever always hears this excellent Saptamī vow, and whoever also reads it, controlled and endowed with supreme faith,","yaḥ — whoever; idam — this; śṛṇuyāt — hears; nityam — always; saptamī-vratam uttamam — excellent Saptamī-vow; paṭhet — reads; yaḥ ca api — and whoever also; niyataḥ — controlled; śraddhayā parayā anvitaḥ — endowed with supreme faith."],["Having obtained happiness in this world, he is honoured in the world of the Sun. When his merit is exhausted, returning here, he becomes king on earth.","iha loke — in this world; sukham — happiness; prāpya — having obtained; sūrya-loke — in the world of the Sun; mahīyate — is honored; puṇya-kṣayāt — when merit is exhausted; iha āgatya — coming here; rājā bhavati — becomes king; bhūtale — on the earth."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:209,verseCount:16,subtitle:"Chapter 209 — The Monthly Saptamī Vow",colophon:""},T);</script></body>
