<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 187 — The Greatness of the Cow in Solar Dharma."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 187 — The Greatness of the Cow in Solar Dharma — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-1" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 187 — The Greatness of the Cow in Solar Dharma</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-186/">← Chapter 186</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-188/">Chapter 188 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-3"></script><script>const R=[["What meritorious deeds do humans perform here and go to heaven, born in the human world and thereafter proceeding to the heavenly world?","kāni puṇyāni — what meritorious deeds; kṛtvā iha — having done here; mānavāḥ — humans; svargaṃ gacchanti — go to heaven; manuṣyaloke sambhūtāḥ — born in the human world; svarloke gāminaḥ — going to the heavenly world; param — thereafter."],["The sacrifice of action, the sacrifice of austerity, self-study, meditation-made, and the sacrifice of knowledge—these five are proclaimed great sacrifices.","karma-yajñaḥ — sacrifice of action; tapaḥ-yajñaḥ — sacrifice of austerity; svādhyāyaḥ — self-study; dhyāna-nirmitaḥ — made through meditation; jñāna-yajñaḥ — sacrifice of knowledge; ca — and; pañca ete — these five; mahā-yajñāḥ — great sacrifices; prakīrtitāḥ — are proclaimed."],["Of these very sacrifices, which is remembered as the highest? And what is the fruit of these sacrifice-fruits; what would be the destination?","eteṣām eva yajñānām — of these very sacrifices; uttamaḥ — highest; katamaḥ — which; smṛtaḥ — is remembered; etad-yajña-phalānām — of these fruits of sacrifice; ca — and; kim phalam — what fruit; kā gatiḥ — what destination; bhavet — would there be."],["How many distinctions of dharma and adharma are proclaimed? Tell their means in how many ways, and the destinations, as they are.","dharma-adharma-prabhedāḥ — distinctions of dharma and adharma; kiyantaḥ — how many; parikīrtitāḥ — are proclaimed; tat-sādhanāni — their means; katidhā — in how many ways; gatayaḥ — destinations; ca — and; yathā — as they are; vada — tell."],["O Bird, what marks arise in people who were hell-dwellers and have come again to earth, when the remaining karma has been exhausted?","khaga — O Bird; nārakiṇām puṃsām — of people who were hell-dwellers; āgatānām punaḥ kṣitau — come again to earth; kāni cihnāni — what marks; jāyante — arise; mukta-śeṣeṇa karmaṇā — when the remaining karma has been released/exhausted."],["How are embodied beings released from the terrible great ocean of becoming, crowded with dharma and adharma and rich in the foam of suffering beginning with birth in the womb?","mahā-bhava-arṇavāt — from the great ocean of becoming; ghorāt — terrible; dharma-adharma-abhisaṃkulāt — crowded with dharma and adharma; garbha-ādi-duḥkha-phena-āḍhyāt — rich in the foam of suffering beginning with the womb; dehinaḥ — embodied beings; katham mucyante — how are released."],["Thus addressed, the radiant Bhagavān Bhānu replied, with regard to the meaning of all the questions, both concisely and at length.","iti uktaḥ — thus addressed; bhagavān bhānuḥ — the blessed Bhānu; sarva-praśna-artham — concerning the meaning of all the questions; ādarāt — attentively; pratyuvāca — replied; mahā-tejāḥ — greatly radiant; samāsa-vyāsa-yogataḥ — by way of brief and extended treatment."],["Hear, O hero, as I speak, the meritorious dharma that gives heaven and liberation as its fruit, carries one across the ocean of hell, and removes sin.","svarga-apavarga-phala-dam — giving heaven and liberation as fruit; naraka-arṇava-tāraṇam — carrying across the ocean of hell; dharmam — dharma; pāpa-haram — removing sin; puṇyam — meritorious; śṛṇu — hear; śūra — O hero; prabhāṣataḥ — as I speak."],["Dharma is always preceded by faith, is established with faith at its beginning, middle, and end, and rests on faith as its foundation; faith is proclaimed.","śraddhā-pūrvaḥ — preceded by faith; sadā — always; dharmaḥ — dharma; śraddhā-madhya-anta-saṃsthitaḥ — established in faith at middle and end; śraddhā-niṣṭha-pratiṣṭhaḥ — resting on faith as its foundation; ca — and; śraddhā — faith; prakīrtitā — is proclaimed."],["The subtle essences of śruti and mantra, Pradhāna, Puruṣa, and Īśvara are grasped through faith alone, and not by another eye.","śruti-mantra-rasāḥ — essences of śruti and mantra; sūkṣmāḥ — subtle; pradhāna-puruṣa-īśvaraḥ — Pradhāna, Puruṣa, and Īśvara; śraddhā-mātreṇa — by faith alone; gṛhyante — are grasped; na — not; pareṇa cakṣuṣā — by another eye."],["By many bodily hardships, nor by heaps of wealth, is subtle dharma attained by those without faith, even if they are gods.","kāya-kleśaiḥ — by bodily hardships; na bahubhiḥ — not by many; na ca eva — nor indeed; arthasya rāśibhiḥ — by heaps of wealth; dharmaḥ sūkṣmaḥ — subtle dharma; saṃprāpyate — is attained; śraddhā-hīnaiḥ — by those without faith; surair api — even by gods."],["Faith is the supreme subtle dharma; faith is sacrifice, oblation, and austerity; faith is liberation and heaven; faith is this whole world.","śraddhā — faith; dharmaḥ paraḥ sūkṣmaḥ — the supreme subtle dharma; śraddhā — faith; yajña-āhutam — sacrifice and oblation; tapaḥ — austerity; śraddhā — faith; mokṣaḥ — liberation; ca — and; svargaḥ — heaven; ca — and; śraddhā — faith; sarvam idam jagat — this whole world."],["He who gives all his possessions, or even his life, without faith obtains no fruit at all; therefore let him be devoted to faith.","sarvasvam — all possessions; jīvitam vā api — or even life; dadyāt — gives; aśraddhayā — without faith; yaḥ — whoever; na āpnuyāt — does not obtain; saḥ — he; phalam kiñcit — any fruit; tasmāt — therefore; śraddhā-paraḥ bhavet — let him be devoted to faith."],["Thus all my dharmas are proclaimed as consisting of faith. A person should worship with faith; with faith he should meditate, and with faith worship.","evam — thus; śraddhā-mayāḥ — consisting of faith; sarve — all; mama dharmāḥ — my dharmas; prakīrtitāḥ — are proclaimed; pūjyaḥ — to be worshipped; tu — indeed; śraddhayā — with faith; puṃsā — by a person; dhyeyaḥ — to be meditated upon; pūjyaḥ ca — and to be worshipped; śraddhayā — with faith."],["For the attainment of eligibility and the giving of great essence and liberation, this wondrous, doubtful statement was spoken by one ignorant.","adhikārasya prāpti-artham — for attaining eligibility; mahā-sāra-vimukti-dam — giving great essence and liberation; ajñāt — by/from one ignorant; uktam — spoken; sa-saṃdigdham — doubtful; vākyam etat — this statement; mama adbhutam — my wondrous [statement]."],["My statement is divine, produces various accomplishments, delights the minds of people, is profound in its certain meaning, and is pleasing.","nānā-siddhi-karam — producing various accomplishments; divyam — divine; loka-citta-urañjanam — delighting the minds of people; su-niścita-artha-gambhīram — profound in its certain meaning; vākyam — statement; mama — my; manoramam — pleasing."],["The wise know this two-footed one as the ocean of my mind. It is known as Khaṣolka, the circle together with Śiva, O Bird.","mat-mānasa-samudraḥ — ocean of my mind; hi — indeed; dvipadaḥ ayam — this two-footed one; viduḥ budhāḥ — the wise know; saḥ — that; Khaṣolka iti — as Khaṣolka; vikhyātaḥ — known; sa-śivam maṇḍalam — a circle together with Śiva; khaga — O Bird."],["Beyond the qualities of the three deities, all-knowing, ruler who knows all, that Supreme of mine is situated in the one-syllabled mantra ‘Oṃ.’","deva-traya-guṇa-atītaḥ — beyond the qualities of the three deities; sarva-jñaḥ — all-knowing; sarva-vit-prabhuḥ — ruler who knows all; oṃ iti eka-akṣare mantre — in the one-syllabled mantra ‘Oṃ’; sthitaḥ — situated; saḥ — he; paramaḥ mama — my Supreme."],["As this terrible ocean of saṃsāra has arisen beginninglessly, so Khaṣolka too is beginningless, purifying the ocean of saṃsāra.","yathā — just as; anādi-pravṛttaḥ — proceeding beginninglessly; ayam — this; ghoraḥ — terrible; saṃsāra-sāgaraḥ — ocean of saṃsāra; Khaṣolkaḥ api — Khaṣolka too; tathā — so; anādiḥ — beginningless; saṃsāra-arṇava-śodhanaḥ — purifier of the ocean of saṃsāra."],["Just as medicine, by its nature, is opposed to diseases, so this is a cause of liberation for those seeking release and an accomplisher of every aim.","vyādhīnām — of diseases; bheṣajam — medicine; yadvat — just as; pratipakṣa-svabhāvataḥ — by an opposing nature; mokṣiṇām — for those seeking release; mukti-hetuḥ — cause of liberation; ca — and; siddhaḥ — accomplished/effective; sarva-artha-sādhakaḥ — accomplisher of every aim."],["This mantra, my designation, is always remembered as the denoted. I am both designation and denoted reality, accomplished by mantra, O Khecara.","mama-abhidhāna-mantraḥ ayam — this mantra of my designation; abhidhēyaḥ — the denoted; sadā smṛtaḥ — always remembered; abhidhāna-abhidhēyaḥ aham — I am designation and denoted; mantra-siddhaḥ — accomplished by mantra; asmi — am; khecara — O Khecara."],["Here the Veda is situated in the six-syllabled mantra for reaching the mind; or, when one syllable is released, it is remembered in the world as five-syllabled.","vedaḥ — Veda; manogame — in reaching the mind; ca atra — and here; ṣaḍ-akṣara-matra-sthitaḥ — situated in the six-syllabled mantra; yat vā — or; muktaḥ eka-akṣareṇa — released by one syllable; loke — in the world; pañca-akṣaraḥ smṛtaḥ — remembered as five-syllabled."],["What need has he of many mantras or very extensive śāstras, in whose heart this mantra, ‘namaḥ Khaṣolka,’ is established?","kim — what need; tasya — for him; bahubhiḥ mantraiḥ — of many mantras; śāstraiḥ vā — or śāstras; bahu-vistaraiḥ — very extensive; yasya — whose; namaḥ Khaṣolka iti mantraḥ ayam — this mantra ‘namaḥ Khaṣolka’; hṛdi saṃsthitaḥ — is established in the heart."],["By him it is studied, heard, and all performed, by whom my six-syllabled utterance, ‘Oṃ namaḥ Khaṣolka,’ is [recited].","tena — by him; adhītam — studied; śrutam — heard; tena — by him; sarvam anuṣṭhitam — all performed; yena — by whom; oṃ namaḥ Khaṣolka iti — ‘Oṃ namaḥ Khaṣolka’; mama vākyam — my utterance; ṣaḍ-akṣaram — six-syllabled."],["All this speech of mine is injunction, not a passage of praise. I shall tell you its entirety, the highest meaning of my words; ask this after bowing, O great-minded Vainateya.","vidhi-vākyam — an injunctive statement; idam sarvam — all this; na artha-vādam — not a passage of praise; vacaḥ mama — my speech; etat — this; te — to you; vakṣyate — will be told; aśeṣam — entirely; mama vākya-artham uttamam — the highest meaning of my words; pṛcchasva — ask; imam — this; praṇamya — having bowed; āśu — now; vainateya — O Vainateya; mahā-mate — great-minded."],["Sumantu said: Having heard Bhānu’s words, mighty Vainateya bowed with devotion to Saptāśvatilaka and spoke, O Bharata.","sumantuḥ uvāca — Sumantu said; śrutvā — having heard; vacanam bhānoḥ — Bhānu’s words; vainateyaḥ — Vainateya; mahā-balaḥ — of great strength; saptāśvatilakam — to Saptāśvatilaka; bhaktyā — with devotion; praṇamya — having bowed; uvāca — spoke; bhārata — O Bharata."],["Aruṇa said: Tell me, tiger among gods, what I ask, O great-minded one. What is the nature of this utterance of Bhānu? Tell its meaning, Lord.","anūruḥ uvāca — Aruṇa said; brūhi mām — tell me; deva-śārdūla — O tiger among gods; yat pṛcchāmi — what I ask; mahā-mate — O great-minded one; kīdṛk vākyam idam — what sort of statement is this; bhānoḥ — of Bhānu; vākya-artham — the meaning of the statement; brūhi — tell; prabho — O Lord."],["Saptāśvatilaka said: That pure statement which was composed by Bhagavān, free from all faults and all-knowing, is authoritative, without doubt.","saptāśvatilakaḥ uvāca — Saptāśvatilaka said; vimukta-aśeṣa-doṣeṇa — by one freed from all faults; sarva-jñena bhagena — by the all-knowing Bhagavān; yat — which; praṇītam — composed; amalam vākyam — pure statement; tat pramāṇam — that is authoritative; na saṃśayaḥ — no doubt."],["Because he is called Mārtāṇḍa by the wise, one obtains merit according to what is true; through lack of faith, one falls downward.","yasmāt — because; mārtāṇḍa-nāma — the name Mārtāṇḍa; asau — he; kathyate — is called; manīṣibhiḥ — by the wise; yathārtham — according to truth; puṇyam āpnoti — one obtains merit; aśraddhayā — through lack of faith; tu — but; adhaḥ patati — one falls downward."],["One should worship as the Sun the teacher who speaks the solar teaching, who lifts a person submerged in the ocean of saṃsāra.","saura-vākya-pravaktāram — the speaker of solar teaching; sūryavat — like the Sun; pūjayet — one should worship; gurum — the teacher; saṃsāra-arṇave nimagnam — submerged in the ocean of saṃsāra; yaḥ — who; janam — a person; samuddharate — lifts up."],["Who is equal to that teacher, with the water of solar dharma in his hand, who slowly extinguishes one scorched by the fire of ignorance? Who would not honour him, [who cools] with the nectar of knowledge?","saura-dharma-ambu-hastena — with the water of solar dharma in his hand; kaḥ — who; tena sadṛśaḥ guruḥ — a teacher equal to him; ajñāna-vahni-saṃtaptaṃ — one scorched by the fire of ignorance; nirvāpayati — extinguishes; yaḥ — who; śanaiḥ — gradually; jñāna-amṛtena — with the nectar of knowledge; bhaktā — devoted; kaḥ tam na pratipūjayet — who would not honour him?"],["Neither by a great kingdom nor by heaps of wealth is the pacification of ignorance obtained, which brings happiness in the next world.","na eva — neither indeed; rājyena mahatā — by a great kingdom; na ca eva — nor indeed; artha-rāśibhiḥ — by heaps of wealth; ajñāna-śamanam — pacification of ignorance; par loke — in the next world; sukha-āvaham — bringing happiness; prāptam — obtained."],["Whatever fine speech is spoken by the God of gods for the attainment of heaven and liberation is to be understood as well-spoken.","svarga-apavarga-siddhi-artham — for attaining heaven and liberation; bhāṣitam yat — whatever is spoken; śobhanam — fine; vākyam — statement; te — to you; deva-devena — by the God of gods; tat vijñeyam — that is to be understood; su-bhāṣitam — well-spoken."],["The speech of those who follow attachment, hatred, intolerance, anger, desire, and thirst is called ill-spoken because it leads to hell.","rāga-dveṣa-akṣamā-krodha-kāma-tṛṣṇā-anusāriṇām — of those following attachment, hatred, intolerance, anger, desire, and thirst; vākyam — speech; niraya-hetutvāt — because it is a cause of hell; tat durbhāṣitam ucyate — that is called ill-spoken."],["What is the use of that speech, even if in Sanskrit and joined with gentle conversation, when it is speech delighting in ignorance and causing the suffering of saṃsāra?","saṃskṛtena api — even in Sanskrit; kim tena — what is the use of that; mṛdu-ālāpa-saṅginā — joined with gentle conversation; avidyā-ārāma-vākyena — by speech delighting in ignorance; saṃsāra-kleśa-hetunā — causing the suffering of saṃsāra."],["That speech, hearing which merit arises and attachment and the rest are destroyed, is to be known as exceedingly beautiful, even if it is unattractive.","yat śrutvā — hearing which; jāyate puṇyam — merit arises; rāga-ādīnām — of attachment and the rest; ca saṃkṣayaḥ — and destruction; virūpam api — even if unattractive; tat vākyam — that speech; vijñeyam — is to be understood; ati-śobhanam — as exceedingly beautiful."],["The Smṛtis, Bhārata, Vedas, and very great śāstras are interwoven with dharma and meaning only for the wearing away of one’s lifespan.","smṛtayaḥ — Smṛtis; bhāratam — Bhārata; vedāḥ — Vedas; śāstrāṇi su-mahānti — very great śāstras; dharma-artha-sam-grathitaḥ — interwoven with dharma and meaning; sva-āyuṣaḥ kṣapaṇāya eva — only for wearing away one’s lifespan."],["For people of deluded minds in the world of sons, wives, and the rest, scripture, beginningless, has issued from the mouth for those who know saṃsāra.","putra-dāra-ādi-saṃsāre — in the worldly life of sons, wives, and the rest; narāṇām mūḍha-cetasām — of people with deluded minds; saṃsāra-viduṣām — for those who know saṃsāra; śāstram — scripture; anādi-mukha-nirgatam — issued from the beginningless mouth."],["You desire to know all this: ‘This is best; this is to be known.’ Even one with a thousand-year lifespan does not reach the end of scripture.","idam śreṣṭham — this is best; idam jñeyam — this is to be known; sarvam — all; tvam jñātum icchasi — you desire to know; api — even; varṣa-sahasra-āyuḥ — one with a thousand-year lifespan; śāstra-antam na adhigacchati — does not reach scripture’s end."],["Having discerned the imperishable principle alone, and that life is greatly deceptive, one should leave all śāstras and practise for the next world.","vijñāya — having discerned; akṣara-tan-mātram — that imperishable principle alone; jīvitam ca ati-vañcanam — and that life is greatly deceptive; vihāya — leaving; sarva-śāstrāṇi — all śāstras; para-lokam samācaret — one should practise for the next world."],["What use is even a learned and capable person among embodied beings, if he is unable to bear the burden of merit for the next world?","paṇḍitena api — even with a learned person; kim — what use; tena — with him; samarthena — capable; dehinām — among embodied beings; yaḥ — who; puṇya-bhāram — the burden of merit; udvoḍhum — to bear; aśaktaḥ — unable; pāralaukikam — for the next world."],["Even a learned man is a fool, and even one endowed with power is powerless, if he is unable to proclaim the greatness of solar knowledge.","paṇḍitaḥ api — even a learned man; saḥ — he; mūrkhaḥ syāt — would be a fool; śakti-yuktaḥ api — even endowed with power; aśaktikaḥ — powerless; yaḥ — who; saura-jñāna-māhātmyam — the greatness of solar knowledge; uccārayitum — to proclaim; akṣamaḥ — unable."],["Therefore he is learned and capable, an ascetic with controlled senses, who is intent on considering the true nature of solar knowledge.","tasmāt — therefore; saḥ paṇḍitaḥ — he is learned; śaktaḥ — capable; saḥ tapasvī — he is an ascetic; jita-indriyaḥ — with senses conquered; yaḥ — who; saura-jñāna-sad-bhāvam — the true nature of solar knowledge; ālocayitum udyataḥ — intent on considering."],["Even if a king gives the whole earth, wealth, and gold, if he asks unjustly, a guru should not instruct him.","yaḥ nṛpaḥ — whichever king; pradadyāt — might give; kṛtsnām kṣmām — the whole earth; dhanam kāñcanam tathā — wealth and gold likewise; sarvam anyāyataḥ pṛcchet — asks everything unjustly; na tasya upadiśet guruḥ — a guru should not instruct him."],["He who hears the dharma of Ravi and speaks it rightly goes to a good place; in the opposite case, to hell.","yaḥ — whoever; śṛṇoti — hears; raveḥ dharmam — the dharma of Ravi; nyāyataḥ — rightly; saḥ ca vakti — and speaks it; tataḥ — then; gacchati su-sthānam — goes to a good place; narakam — to hell; tat-viparyaye — in the opposite case."],["He who worships Ravi according to the six-syllable rule with the milk of a given cow quickly becomes foremost among people.","datta-go-doha-saṃbhūtaḥ — arising from the milking of a given cow; ṣaḍ-akṣara-vidhānataḥ — according to the six-syllable rule; raviḥ sampūjitaḥ — Ravi being worshipped; śīghram — quickly; narāṇām — among people; tulyatā bhṛśam — great distinction/elevation."],["Long ago, five cows arose from the ocean of milk, churned by gods and asuras, mothers of the whole world.","surāsuraiḥ — by gods and asuras; mathyamānāt — being churned; kṣīrodāt sāgarāt — from the ocean of milk; purā — long ago; pañca gāvaḥ — five cows; samutpannāḥ — arose; sarva-lokasya mātaraḥ — mothers of the whole world."],["Nandā, Subhadrā, Surabhī, Sumanā, and Śobhanāvatī: the cows, radiant like the Sun, arose and came into being.","nandā — Nandā; subhadrā — Subhadrā; surabhī — Surabhī; sumanā — Sumanā; śobhanāvatī — Śobhanāvatī; gāvaḥ — cows; sūrya-samā-bhāsaḥ — radiant like the Sun; utpannāḥ — arose; kṛtim āgatāḥ — came into created existence."],["For the benefit of all worlds and for the satisfaction of the gods, the cows remain resorting to me, for the bathing of Bhāskara.","sarva-loka-upakāra-artham — for the benefit of all worlds; devānām tarpaṇāya ca — and for the satisfaction of the gods; mām āśritya sthitāḥ — remain resorting to me; gāvaḥ — the cows; snānārtham — for bathing; bhāskarasya tu — of Bhāskara."],["Their limbs are sacred; the six tastes, O best of birds, are established in all beings beginning with birds—understand this.","tāsām aṅgāni — their limbs; puṇyāni — sacred; ṣaḍ-rasāḥ — the six tastes; khaga-sattama — O best of birds; khaga-ādiṣu ca sarveṣu — in all, beginning with birds; sthirāṇi — established; iti upadhāraya — understand thus."],["Cow dung, rocanā, urine, milk, curd, and ghee of cows are six sacred limbs and are also bestowers of every accomplishment.","go-mayam — cow dung; rocanam — rocanā; mūtram — urine; kṣīram — milk; dadhi — curd; ghṛtam — ghee; gavām — of cows; ṣaḍ-aṅgāni — six limbs; pavitrāṇi — sacred; sarva-siddhi-karāṇi — causing every accomplishment; ca — and."],["From cow dung arose the glorious bilva tree, beloved of the Sun; there Śrī, holding a lotus, dwells, and therefore it is remembered as a tree.","go-mayāt — from cow dung; utthitaḥ — arisen; śrīmān — glorious; bilva-vṛkṣaḥ — bilva tree; arka-vallabhaḥ — beloved of the Sun; tatra — there; āste — dwells; padma-hastā śrīḥ — Śrī with a lotus in her hand; vṛkṣaḥ tena ca saḥ smṛtaḥ — therefore it is remembered as a tree."],["From cow dung arise blue lilies and lotuses again; gorocanā is auspicious, purifying, and bestowing every desire.","paṅkāni — mire; utpala-padma — blue lilies and lotuses; punaḥ jātāni — are born again; go-mayāt — from cow dung; go-rocanā — gorocanā; māṅgalya — auspicious; pavitram — purifying; sarva-kāma-dam — bestowing every desire."],["Guggulu, fragrant and pleasing to behold, is born from cow urine; it is food for all the gods, especially Bhāskara.","go-mūtrāt — from cow urine; gugguluḥ jātaḥ — guggulu is born; su-gandhiḥ — fragrant; priya-darśanaḥ — pleasing to behold; āhāraḥ — food; sarva-devānām — of all the gods; bhāskarasya viśeṣataḥ — especially of Bhāskara."],["Whatever seed there is of the world is to be known as arising from milk; all auspicious things arose from curd for the accomplishment of aims.","yat bījam jagataḥ kiñcit — whatever seed of the world; tat jñeyam — that is to be known; kṣīra-saṃbhavam — arising from milk; dadhnaḥ — from curd; sarvāṇi — all; jātāni — arose; māṅgalyāni — auspicious things; artha-siddhaye — for accomplishment of aims."],["Amṛta arose from ghee, exceedingly dear to the immortals; therefore whoever bathes Ravi with ghee, milk, and curd…","ghṛtāt — from ghee; amṛtam utpannam — amṛta arose; amarāṇām — to the immortals; ati-priyam — exceedingly dear; tasmāt — therefore; ghṛtena — with ghee; payasā — with milk; dadhnā — with curd; yaḥ — whoever; snāpayet ravim — bathes Ravi."],["…should wash him afterward with warm water and astringents; having bathed him with cool water afterward, one should anoint Bhānu with rocanā.","tat-ante — after that; ca — and; uṣṇa-toyena — with warm water; kaṣāyaiḥ ca — and with astringents; nirūpayet — should wash/prepare; snāpya — having bathed; śīta-ambunā — with cool water; paścāt — afterward; bhānum — Bhānu; rocanayā ālabhet — should anoint with rocanā."],["One should worship with bilva leaves, lotuses, and blue lotuses; afterward, O Bird, one should give arghya together with vajra and guggulu.","pūjayet — one should worship; bilva-patraiḥ — with bilva leaves; padmaiḥ — with lotuses; nīla-utpalaiḥ tathā — and blue lilies; arghyam dadyāt — one should give arghya; tataḥ paścāt — afterward; sa-vajram guggulam — vajra and guggulu together; khaga — O Bird."],["One should offer pāyasa, curd-rice, vajra together with honey, and various foods, with true devotion.","pāyasam — pāyasa; dadhi-bhaktam — curd-rice; ca — and; vajram — vajra; madhuṇā saha — together with honey; nivedayet — one should offer; ca — and; sad-bhaktyā — with true devotion; vividhāni bhakṣyāṇi — various foods."],["Having made circumambulation, afterward one should bow and ask forgiveness; by this procedure one worships Bhānu, the lord of the day, with six limbs.","kṛtvā pradakṣiṇam — having made circumambulation; paścāt — afterward; praṇipatya — having bowed; kṣamāpayet — one should ask forgiveness; anena vidhinā — by this procedure; bhānum — Bhānu; ṣaḍ-aṅgena — with six limbs; divas-patim — lord of the day."],["In this world and in the next he obtains all desires, having worshipped the gracious Ravi by this six-limbed procedure.","iha loke — in this world; pare ca eva — and indeed in the next; sarvān kāmān — all desires; saḥ gacchati — he obtains; ṣaḍ-aṅga-vidhinā — by the six-limbed procedure; tam pūjya — having worshipped him; evam — thus; su-manāḥ ravim — the gracious Ravi."],["The wise one leads twenty-one families to heaven; having established them in heaven, he himself goes to that station named Jyotiṣ.","sa-dhīmān — the wise one; svargam nayet — leads to heaven; kulānām eka-viṃśatim — twenty-one families; svarge sthāpya — having established in heaven; svayam gacchet — he himself goes; jyautiṣam nāma tat padam — to that station named Jyotiṣ."],["The valiant Bhojakas, appointed by their share for divine service, go with their lord to the supreme splendour of glorious Bhānu.","aṃśena — by their share; bhojakāḥ — Bhojakas; vīrāḥ — valiant; deva-kārye niyojitāḥ — appointed for divine service; prayānti — go; svāminā sārdham — with their lord; śrīmat-bhānum — glorious Bhānu; param mahaḥ — supreme splendour."],["Having enjoyed abundant pleasures, a Bhojaka, equal to pleasure, returns here in time and becomes sole king on earth.","bhuktvā — having enjoyed; bhogān tu vipulān — abundant pleasures; bhojakaḥ — a Bhojaka; bhoga-sammitaḥ — equal to pleasure; kālāt — after a time; punaḥ iha āgataḥ — having returned here again; pṛthivyām — on earth; eka-rāṭ bhavet — becomes sole king."],["Whatever flower, leaf, fruit, or water is used in the worship of Bhāskara, and the solar cows, go to the world of the Sun, without doubt.","puṣpam — flower; patram — leaf; phalam — fruit; toyam — water; yat gatam — whatever has gone/been offered; bhāskara-arcanē — in worship of Bhāskara; saura-gāvaḥ ca — and solar cows; gacchanti — go; sūrya-lokam — to the world of the Sun; na saṃśayaḥ — without doubt."],["He who drinks at a meal the milk of a cow not given to Bhānu goes to a terrible hell, not having made an offering to Ravi.","yaḥ — whoever; pibet — drinks; bhojane — at a meal; dhenoḥ payaḥ — the cow’s milk; adattā — not given; bhānave — to Bhānu; saḥ gacchet — he goes; narakam ghoram — to a terrible hell; akurvan — not making; tarpaṇam raveḥ — an offering to Ravi."],["One should drink the milk of Bhāskara’s cows once [at the proper time]; with that milk, O best of birds, one should bathe the deity.","eka-kālam — once/at one time; pibet kṣīram — one should drink milk; dhenūnām bhāskarasya tu — of Bhāskara’s cows; anena — with this; snāpayet devam — one should bathe the deity; kṣīreṇa — with milk; khaga-sattama — O best of birds."],["Whatever milk there is at dawn from the cows of Bhāskara, with all of that one should bathe Bhānu, elder brother of Garuḍa.","pratyūṣe — at dawn; yat kṣīram bhavet — whatever milk there is; dhenūnām bhāskarasya tu — of Bhāskara’s cows; snāpayet tena vai — one should bathe with that indeed; bhānum — Bhānu; kṛtsnena — with all of it; garuḍa-agraja — O elder brother of Garuḍa."],["Whoever enjoys all of it and does not offer it to the deity, for as many years as there are hair-follicles on a cow’s body, is cooked in hell.","yaḥ tu — whoever; lokam sarvam — all [of it]; bhajet — enjoys; na devāya nivedayet — does not offer to the deity; yāvantaḥ — as many as; roma-kūpāḥ — hair-follicles; gavām dehe — on cows’ bodies; tāvat varṣa-sahasrāṇi — for that many thousands of years; narake pacyate — is cooked in hell."],["Whoever hears Ravi being worshipped or already worshipped, and whoever approves on hearing, enjoys the fruit of sacrifice.","pūjitam — worshipped; pūjyamānam vā — or being worshipped; yaḥ kaścit — whoever; śṛṇuyāt ravim — hears of Ravi; śrutvā — having heard; anumodate yaḥ tu — and whoever approves; saḥ — he; yajña-phalam aśnute — enjoys the fruit of sacrifice."],["Seeing Bhāskara worshipped, one is released from all sins; having joyfully bowed to Bhānu, one is honoured in his world.","bhāskaram pūjitam dṛṣṭvā — seeing Bhāskara worshipped; sarva-pāpaiḥ pramucyate — one is released from all sins; harṣāt — joyfully; praṇamya vai bhānum — having indeed bowed to Bhānu; tasya loke mahīyate — one is honoured in his world."],["A person who sees Ravi being worshipped with devotion, O Bird, would also obtain the entire fruit of sacrifice, without doubt.","pūjyamānam ravim — Ravi being worshipped; bhaktyā — with devotion; yaḥ paśyet mānavaḥ — whoever among humans sees; khaga — O Bird; saḥ api — he also; yajña-phalam kṛtsnam — the entire fruit of sacrifice; prāpnuyāt — would obtain; na atra saṃśayaḥ — here there is no doubt."],["Whoever approves on hearing of Divākara being worshipped obtains all that fruit through Bhāskara’s grace.","śrutvā — having heard; anumodate yaḥ tu — whoever approves; pūjyamānam divākaram — Divākara being worshipped; tat sarvam phalam — all that fruit; āpnoti — obtains; prasādāt bhāskarasya tu — through Bhāskara’s grace."],["A gift made with devotion, following one birth, is remembered as yielding a thousand births to those without japa-yajña; giving to those who live by japa lasts until the universal dissolution.","eka-janma-anugam — following one birth; dānam — a gift; bhaktyā yat ca niveditam — which is offered with devotion; japa-yajñāt viyuktebhyaḥ — to those separated from japa-yajña; sahasra-bhavikam smṛtam — is remembered as lasting a thousand births; ā-bhūta-samplava-sthāyi — enduring until universal dissolution; pradānam — giving; japa-jīvinām — to those who live by japa."],["Even what is given, however little, to a reciter, O lord of birds, serves the giver’s enjoyment until the great dissolution.","ati-alpam api — even very little; yat dattam — what is given; vācakāya — to a reciter; khaga-adhipa — O lord of birds; tat — that; mahā-pralayam yāvat — until the great dissolution; dātuḥ bhogāya kalpate — becomes for the giver’s enjoyment."],["For those who understand, no gift is in any way small; joined with place, time, procedure, faith, and a worthy recipient, it is imperishable.","na dānam alpam — no gift is small; bahudhā kiñcit asti — anything in any way exists; vijānatām — for those who understand; deśa-kāla-vidhi-śraddhā-pātra-yuktam — joined with place, time, procedure, faith, and recipient; tat akṣayam — that is imperishable."],["What is given, offered in fire, and done in the proper place and time, by the proper procedure and with faith, bears endless fruit.","pātre deśe ca kāle ca — to a worthy recipient, in the proper place and time; vidhinā — by procedure; śraddhayā ca — and with faith; yat dattam — what is given; hutam — offered in fire; kṛtam ca eva — and indeed done; tat ananta-phalam bhavet — that bears endless fruit."],["Even half a sesame seed, O hero, given with faith and devotion according to rule to a worthy recipient, fulfills every desire.","tila-ardham api — even half a sesame seed; yat vīra — which, O hero; dīyate — is given; śraddhayā — with faith; dvija — O dvija; sat-pātre — to a worthy recipient; vidhi-vat — according to rule; bhaktyā — with devotion; tat bhavet sarva-kāmikam — that becomes capable of fulfilling every desire."],["That recipient who has bathed in the waters of knowledge and been cleansed by the ashes of good conduct is proclaimed highest among all recipients.","yat snātam — who is bathed; jñāna-salilaiḥ — with the waters of knowledge; śīla-bhasma-pramārjitam — cleansed by the ashes of good conduct; tat pātram — that recipient; sarva-pātrebhyaḥ uttamam — highest among all recipients; parikīrtitam — is proclaimed."],["Japa, restraint, and discipline of people rescue them from the ocean of saṃsāra; that is remembered as the supreme recipient for the ignorant, whose eyes are sinful.","japaḥ — japa; damaḥ — restraint; yamaḥ — discipline; puṃsām — of people; trātā — rescuer; saṃsāra-sāgarāt — from the ocean of saṃsāra; ajñānām — for the ignorant; pāpa-netrāṇām — whose eyes are sinful; tat-pātram — that recipient; paramam smṛtam — is remembered as supreme."],["A śāstra furnished with the raft of knowledge surely carries the ignorant across the great ocean of sin. Would a stone carry a stone?","jñāna-plavena upetam — furnished with the raft of knowledge; śāstram — śāstra; pāpa-mahā-arṇavāt — from the great ocean of sin; ajñān — the ignorant; saṃtārayet — would carry across; nūnam — surely; kim — would; śilā — a stone; śilām tārayet — carry a stone across?"],["Whatever fruit belongs to the waist-enjoyment of Veda-knowing twice-born men, that fruit comes to one who lives by japa through the giving of the ‘hantakāra.’","dvijānām — of twice-born men; veda-viduṣām — knowing the Veda; kaṭi-saṃbhogi yat phalam — whatever fruit is enjoyed at the waist/meal; hantakāra-pradānena — by giving hantakāra; tat phalam — that fruit; japa-jīvine — to one who lives by japa."],["When a jīva comes to his house and eats, honoured with honour, he lifts up his family situated in the ocean of hell.","jīvaḥ — a living being/reciter; yasya gṛhe — in whose house; etya — having come; bhuṅkte — eats; sat-kṛti-sat-kṛtaḥ — honoured with due respect; kulam — the family; uttārayet — lifts across; tasya — his; naraka-arṇava-saṃsthitam — situated in the ocean of hell."],["Whatever fruit is proclaimed in sacrifices, Agnihotra, and tīrthas, one obtains that entire fruit by giving food to those who practise japa.","yajña-agni-homa-tīrtheṣu — in sacrifices, Agnihotra, and tīrthas; yat phalam — whatever fruit; parikīrtitam — is proclaimed; japi­nām anna-dānena — by giving food to practitioners of japa; tat samagram phalam labhet — one obtains that entire fruit."],["Having given food once with faith to a Bhojaka of tranquil mind and intent on contemplation, one is released from all sins.","bhojine — to a Bhojaka/eater; śānta-cittāya — of tranquil mind; paridhyāna-ratāya ca — and devoted to contemplation; śraddhayā — with faith; annam sakṛt dattvā — having given food once; sarva-pāpaiḥ pramucyate — one is released from all sins."],["Having fed once with devotion those who practise japa, are joined with peace, and have their minds offered to Āditya, one obtains all desires.","japa-kān — practitioners of japa; śānti-saṃyuktān — joined with peace; āditya-arpita-cetasaḥ — whose minds are offered to Āditya; bhojayitvā — having fed; sakṛt — once; bhaktyā — with devotion; sarvān kāmān avāpnuyāt — one obtains all desires."],["He who continually feeds [them], meditating on the hymn of Ravi, thereby directly makes that food become food eaten [by him].","dhyāyamānaḥ — meditating; raveḥ sūktam — on the hymn of Ravi; bhojayet — should feed; satatam ca yaḥ — and whoever continually; tataḥ — then; sākṣāt — directly; anena eva — by this very act; tat bhuktam aśanam bhavet — that becomes food eaten."],["A man who feeds a Bhojaka at a śrāddha, dedicating [it] to the ancestors, undoubtedly attains the station of Bhānu.","pitṝn uddiśya — with the ancestors as recipients; yaḥ — whoever; śrāddhe — at a śrāddha; bhojayet bhojakam naraḥ — a man feeds a Bhojaka; saḥ — he; sthānam samavāpnoti — attains the station; bhānavīyam — of Bhānu; asaṃśayam — without doubt."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:187,verseCount:88,subtitle:"Chapter 187 — The Greatness of the Cow in Solar Dharma",colophon:""},T);</script></body></html>
