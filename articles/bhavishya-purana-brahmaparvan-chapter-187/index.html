<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 187 — The Greatness of the Cow in Solar Dharma."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 187 — The Greatness of the Cow in Solar Dharma — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-2" rel="stylesheet"/><style>.bp-source span,.bp-reader details{display:none!important}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 187 — The Greatness of the Cow in Solar Dharma</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-186/">← Chapter 186</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-188/">Chapter 188 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-2"></script><script>const R=[["Anūru said: What meritorious acts do people born in the human world perform here to reach heaven and thereafter go to the heavenly world?","kāni puṇyāni — what meritorious deeds; kṛtvā iha — having done here; mānavāḥ — humans; svargaṃ gacchanti — go to heaven; manuṣyaloke sambhūtāḥ — born in the human world; svarloke gāminaḥ — going to the heavenly world; param — thereafter.","।। अनूरुरुवाच ।।\nकानि पुण्यानि कृत्वेह स्वर्गं गच्छंति मानवाः ।। मनुष्यलोके संभूताः स्वर्लोके गामिनः परम् ॥ १ ॥"],["The sacrifice of action, the sacrifice of austerity, self-study, meditation, and the sacrifice of knowledge—these five are proclaimed as the great sacrifices.","karma-yajñaḥ — sacrifice of action; tapaḥ-yajñaḥ — sacrifice of austerity; svādhyāyaḥ — self-study; dhyāna-nirmitaḥ — made through meditation; jñāna-yajñaḥ — sacrifice of knowledge; ca — and; pañca ete — these five; mahā-yajñāḥ — great sacrifices; prakīrtitāḥ — are proclaimed.","कर्मयज्ञस्तपोयज्ञः स्वाध्यायो ध्याननिर्मितः ।। ज्ञानयज्ञश्च पंचैते महायज्ञाः प्रकीर्तिताः ॥ २ ॥"],["Which of these sacrifices is held to be the highest? What is the fruit of these sacrifices, and what would their destination be?","eteṣām eva yajñānām — of these very sacrifices; uttamaḥ — highest; katamaḥ — which; smṛtaḥ — is remembered; etad-yajña-phalānām — of these fruits of sacrifice; ca — and; kim phalam — what fruit; kā gatiḥ — what destination; bhavet — would there be.","एतेषामेव यज्ञानामुत्तमः कतमः स्मृतः ।। एतद्यज्ञफलानां च किं फलं का गतिर्भवेत् ॥ ३ ॥"],["How many distinctions of righteousness and unrighteousness are proclaimed? Tell me their means, how many kinds they are, and their destinations, as they are.","dharma-adharma-prabhedāḥ — distinctions of dharma and adharma; kiyantaḥ — how many; parikīrtitāḥ — are proclaimed; tat-sādhanāni — their means; katidhā — in how many ways; gatayaḥ — destinations; ca — and; yathā — as they are; vada — tell.","धर्माधर्मप्रभेदाश्च कियन्तः परिकीर्तिताः ।। तत्साधनानि कतिधा गतयश्च यथा वद ॥ ४ ॥"],["O bird, what signs arise in people returning to earth from hell, when the residue of their actions has been exhausted?","khaga — O Bird; nārakiṇām puṃsām — of people who were hell-dwellers; āgatānām punaḥ kṣitau — come again to earth; kāni cihnāni — what marks; jāyante — arise; mukta-śeṣeṇa karmaṇā — when the remaining karma has been released/exhausted.","खग नारकिणां पुंसामागतानां पुनः क्षितौ ।। कानि चिह्नानि जायन्ते मुक्तशेषेण कर्मणा ॥ ५ ॥"],["How are embodied beings freed from the dreadful great ocean of existence, crowded with righteousness and unrighteousness, rich in the foam of suffering beginning with the womb?","mahā-bhava-arṇavāt — from the great ocean of becoming; ghorāt — terrible; dharma-adharma-abhisaṃkulāt — crowded with dharma and adharma; garbha-ādi-duḥkha-phena-āḍhyāt — rich in the foam of suffering beginning with the womb; dehinaḥ — embodied beings; katham mucyante — how are released.","महाभवार्णवाद्घोराद्धर्माधर्माभिसंकुलात् ।। गर्भादिदुःखफेनाढ्यान्मुच्यंते देहिनः कथम् ॥ ६ ॥"],["Thus addressed, the greatly radiant Sun replied respectfully concerning all the questions, both briefly and in detail.","iti uktaḥ — thus addressed; bhagavān bhānuḥ — the blessed Bhānu; sarva-praśna-artham — concerning the meaning of all the questions; ādarāt — attentively; pratyuvāca — replied; mahā-tejāḥ — greatly radiant; samāsa-vyāsa-yogataḥ — by way of brief and extended treatment.","इत्युक्तो भगवान्भानुः सर्वप्रश्नार्थमादरात् ।। प्रत्युवाच महातेजाः समासव्यासयोगतः ॥ ७ ॥"],["The Sun said: Hear, O hero, as I speak, the meritorious righteousness that yields heaven and liberation, carries one across the ocean of hell, and removes sin.","svarga-apavarga-phala-dam — giving heaven and liberation as fruit; naraka-arṇava-tāraṇam — carrying across the ocean of hell; dharmam — dharma; pāpa-haram — removing sin; puṇyam — meritorious; śṛṇu — hear; śūra — O hero; prabhāṣataḥ — as I speak.","।। आदित्य उवाच ।।\nस्वर्गापवर्गफलदं नरकार्णवतारणम् ।। धर्मं पापहरं पुण्यं शृणु शूर प्रभाषतः ॥ ८ ॥"],["Righteousness always begins with faith, remains established in faith at the middle and end, and has faith as its firm foundation; faith is proclaimed as righteousness.","śraddhā-pūrvaḥ — preceded by faith; sadā — always; dharmaḥ — dharma; śraddhā-madhya-anta-saṃsthitaḥ — established in faith at middle and end; śraddhā-niṣṭha-pratiṣṭhaḥ — resting on faith as its foundation; ca — and; śraddhā — faith; prakīrtitā — is proclaimed.","श्रद्धापूर्वः सदा धर्मः श्रद्धामध्यांतसंस्थितः ।। श्रद्धानिष्ठप्रतिष्ठश्च धर्मः श्रद्धा प्रकीर्तिता ॥ ९ ॥"],["The subtle essences of the Vedas and mantras, and the Lord of primordial matter and spirit, are grasped by faith alone, not by another eye.","śruti-mantra-rasāḥ — essences of śruti and mantra; sūkṣmāḥ — subtle; pradhāna-puruṣa-īśvaraḥ — Pradhāna, Puruṣa, and Īśvara; śraddhā-mātreṇa — by faith alone; gṛhyante — are grasped; na — not; pareṇa cakṣuṣā — by another eye.","श्रुतिमंत्ररसाः सूक्ष्माः प्रधानपुरुषेश्वरः ।। श्रद्धामात्रेण गृह्यंते न परेण च चक्षुषा ॥ १० ॥"],["Subtle righteousness is not attained through many bodily hardships or heaps of wealth, even by gods who lack faith.","kāya-kleśaiḥ — by bodily hardships; na bahubhiḥ — not by many; na ca eva — nor indeed; arthasya rāśibhiḥ — by heaps of wealth; dharmaḥ sūkṣmaḥ — subtle dharma; saṃprāpyate — is attained; śraddhā-hīnaiḥ — by those without faith; surair api — even by gods.","कायक्लेशैर्न बहुभिर्न चैवार्थस्य राशिभिः ।। धर्मः संप्राप्यते सूक्ष्मः श्रद्धाहीनैः सुरैरपि ॥ ११ ॥"],["Faith is the highest, subtle righteousness; faith is sacrifice, offering, and austerity; faith is liberation and heaven; faith is this entire world.","śraddhā — faith; dharmaḥ paraḥ sūkṣmaḥ — the supreme subtle dharma; śraddhā — faith; yajña-āhutam — sacrifice and oblation; tapaḥ — austerity; śraddhā — faith; mokṣaḥ — liberation; ca — and; svargaḥ — heaven; ca — and; śraddhā — faith; sarvam idam jagat — this whole world.","श्रद्धा धर्मः परः सूक्ष्मः श्रद्धा यज्ञाहुतं तपः।। श्रद्धा मोक्षश्च स्वर्गश्च श्रद्धा सर्वमिदं जगत् ॥ १२ ॥"],["Whoever gives all his possessions, or even his life, without faith obtains no fruit at all; therefore he should be devoted to faith.","sarvasvam — all possessions; jīvitam vā api — or even life; dadyāt — gives; aśraddhayā — without faith; yaḥ — whoever; na āpnuyāt — does not obtain; saḥ — he; phalam kiñcit — any fruit; tasmāt — therefore; śraddhā-paraḥ bhavet — let him be devoted to faith.","सर्वस्वं जीवितं वापि दद्यादश्रद्धया च यः ।। नाप्नुयात्स फलं किंचित्तस्माच्छ्रद्धापरो भवेत् ॥ १३ ॥"],["Thus all my teachings of righteousness are proclaimed as consisting of faith. A person should honor with faith and meditate upon and honor the one worthy of worship with faith.","evam — thus; śraddhā-mayāḥ — consisting of faith; sarve — all; mama dharmāḥ — my dharmas; prakīrtitāḥ — are proclaimed; pūjyaḥ — to be worshipped; tu — indeed; śraddhayā — with faith; puṃsā — by a person; dhyeyaḥ — to be meditated upon; pūjyaḥ ca — and to be worshipped; śraddhayā — with faith.","एवं श्रद्धामयाः सर्वे मम धर्माः प्रकीर्तिताः ।। पूज्यस्तु श्रद्धया पुंसा ध्येयः पूज्यश्च श्रद्धया ॥ १४ ॥"],["This wondrous statement of mine, spoken in ignorance and doubt, is for attaining eligibility and bestows great essence and liberation.","adhikārasya prāpti-artham — for attaining eligibility; mahā-sāra-vimukti-dam — giving great essence and liberation; ajñāt — by/from one ignorant; uktam — spoken; sa-saṃdigdham — doubtful; vākyam etat — this statement; mama adbhutam — my wondrous [statement].","अधिकारस्य प्राप्त्यर्थं महासारविमुक्तिदम् ।। अज्ञादुक्तं ससंदिग्धं वाक्यमेतन्ममाद्भुतम् ॥ १५ ॥"],["My statement is divine, grants various attainments, delights the minds of people, and is pleasing in its profound, certain meaning.","nānā-siddhi-karam — producing various accomplishments; divyam — divine; loka-citta-urañjanam — delighting the minds of people; su-niścita-artha-gambhīram — profound in its certain meaning; vākyam — statement; mama — my; manoramam — pleasing.","नानासिद्धिकरं दिव्यं लोकचित्तानुरंजनम् ।। सुनिश्चितार्थगंभीरं वाक्यं मम मनोरमम् ॥ १६ ॥"],["The wise know this couplet to be the ocean of my mind. It is called Khaṣolka, an auspicious circle, O bird.","mat-mānasa-samudraḥ — ocean of my mind; hi — indeed; dvipadaḥ ayam — this two-footed one; viduḥ budhāḥ — the wise know; saḥ — that; Khaṣolka iti — as Khaṣolka; vikhyātaḥ — known; sa-śivam maṇḍalam — a circle together with Śiva; khaga — O Bird.","मन्मानससमुद्रो हि द्विपदोयं विदुर्बुधाः ।। स खषोल्केति विख्यातः सशिवं मंडलं खग ॥ १७ ॥"],["The supreme one of mine, beyond the qualities of the three gods, omniscient, all-knowing, and sovereign, abides in the one-syllable mantra, Om.","deva-traya-guṇa-atītaḥ — beyond the qualities of the three deities; sarva-jñaḥ — all-knowing; sarva-vit-prabhuḥ — ruler who knows all; oṃ iti eka-akṣare mantre — in the one-syllabled mantra ‘Oṃ’; sthitaḥ — situated; saḥ — he; paramaḥ mama — my Supreme.","देवत्रयगुणातीतः सर्वज्ञः सर्ववित्प्रभुः ।। ओमित्येकाक्षरे मंत्रे स्थितः स परमो मम ॥ १८ ॥"],["Just as this dreadful ocean of worldly existence has proceeded without beginning, so Khaṣolka too is without beginning and cleanses the ocean of worldly existence.","yathā — just as; anādi-pravṛttaḥ — proceeding beginninglessly; ayam — this; ghoraḥ — terrible; saṃsāra-sāgaraḥ — ocean of saṃsāra; Khaṣolkaḥ api — Khaṣolka too; tathā — so; anādiḥ — beginningless; saṃsāra-arṇava-śodhanaḥ — purifier of the ocean of saṃsāra.","यथानादिप्रवृत्तोयं घोरः संसारसागरः ।। खषोल्कोपि तथानादिः संसारार्णवशोधनः ॥ १९ ॥"],["It is a remedy for diseases by its very opposite nature; it is the cause of liberation for those seeking release, perfected and accomplishing every purpose.","vyādhīnām — of diseases; bheṣajam — medicine; yadvat — just as; pratipakṣa-svabhāvataḥ — by an opposing nature; mokṣiṇām — for those seeking release; mukti-hetuḥ — cause of liberation; ca — and; siddhaḥ — accomplished/effective; sarva-artha-sādhakaḥ — accomplisher of every aim.","व्याधीनां भेषजं यद्वत्प्र तिपक्षस्वभावतः ।। मोक्षिणां मुक्तिहेतुश्च सिद्धः सर्वार्थसाधकः ॥ २० ॥"],["This mantra bearing my name is always remembered as its named object. I am both the name and what is named; I am perfected by the mantra, O sky-goer.","mama-abhidhāna-mantraḥ ayam — this mantra of my designation; abhidhēyaḥ — the denoted; sadā smṛtaḥ — always remembered; abhidhāna-abhidhēyaḥ aham — I am designation and denoted; mantra-siddhaḥ — accomplished by mantra; asmi — am; khecara — O Khecara.","ममाभिधानमन्त्रोयमभिधेयः सदा स्मृतः ।। अभिधानाभिधेयोहं मन्त्रसिद्धोऽस्मि खेचर ॥ २१ ॥"],["The Veda is accessible to the mind and is situated here in a six-syllable mantra; or, with one syllable removed, it is remembered in the world as five-syllabled.","vedaḥ — Veda; manogame — in reaching the mind; ca atra — and here; ṣaḍ-akṣara-matra-sthitaḥ — situated in the six-syllabled mantra; yat vā — or; muktaḥ eka-akṣareṇa — released by one syllable; loke — in the world; pañca-akṣaraḥ smṛtaḥ — remembered as five-syllabled.","वेदो मनोगमे चात्र षडक्षरमंत्रस्थितः ।। यद्वा मुक्तोऽक्षरैकेन लोके पञ्चाक्षरः स्मृतः ॥ २२ ॥"],["What need has one of many mantras or extensive scriptures, in whose heart this mantra, “Om, homage to Khaṣolka,” is established?","kim — what need; tasya — for him; bahubhiḥ mantraiḥ — of many mantras; śāstraiḥ vā — or śāstras; bahu-vistaraiḥ — very extensive; yasya — whose; namaḥ Khaṣolka iti mantraḥ ayam — this mantra ‘namaḥ Khaṣolka’; hṛdi saṃsthitaḥ — is established in the heart.","किं तस्य बहुभिर्मन्त्रैः शास्त्रैर्वा बहुविस्तरैः ।। यस्यों नमः खषोल्केति मन्त्रोऽयं हृदि संस्थितः ॥ २३ ॥"],["By the person who speaks my six-syllable utterance, “Om, homage to Khaṣolka,” the Veda has been studied and heard, and everything has been performed.","tena — by him; adhītam — studied; śrutam — heard; tena — by him; sarvam anuṣṭhitam — all performed; yena — by whom; oṃ namaḥ Khaṣolka iti — ‘Oṃ namaḥ Khaṣolka’; mama vākyam — my utterance; ṣaḍ-akṣaram — six-syllabled.","तेनाधीतं श्रुतं तेन तेन सर्वमनुष्ठितम् ।। येनों नमः खषोल्केति मम वाक्यं षडक्षरम् ॥ २४ ॥"],["All this is prescriptive speech; my words are not a mere eulogy. I shall tell you completely the highest meaning of my words. Ask this at once after bowing, O wise son of Vinatā.","vidhi-vākyam — an injunctive statement; idam sarvam — all this; na artha-vādam — not a passage of praise; vacaḥ mama — my speech; etat — this; te — to you; vakṣyate — will be told; aśeṣam — entirely; mama vākya-artham uttamam — the highest meaning of my words; pṛcchasva — ask; imam — this; praṇamya — having bowed; āśu — now; vainateya — O Vainateya; mahā-mate — great-minded.","विधिवाक्यमिदं सर्वं नार्थवादं वचो मम ।। एतत्ते वक्ष्यतेऽशेषं मम वाक्यार्थमुत्तमम् ।। पृच्छस्वेमं प्रणम्याशु वैनतेय महामते ॥ २५ ॥"],["Sumantu said: Having heard the Sun’s words, the mighty son of Vinatā bowed devotedly to the mark of the Seven-Horsed Sun and spoke, O Bharata.","sumantuḥ uvāca — Sumantu said; śrutvā — having heard; vacanam bhānoḥ — Bhānu’s words; vainateyaḥ — Vainateya; mahā-balaḥ — of great strength; saptāśvatilakam — to Saptāśvatilaka; bhaktyā — with devotion; praṇamya — having bowed; uvāca — spoke; bhārata — O Bharata.","।। सुमन्तुरुवाच ।।\nश्रुत्वा तु वचनं भानोर्वैनतेयो महाबलः ।। सप्ताश्वतिलकं भक्त्या प्रणम्योवाच भारत ॥ २६ ॥"],["Anūru said: Tell me what I ask, O tiger among gods, O great-minded one. What kind of statement is this of the Sun? Tell me the meaning of the words, O lord.","anūruḥ uvāca — Aruṇa said; brūhi mām — tell me; deva-śārdūla — O tiger among gods; yat pṛcchāmi — what I ask; mahā-mate — O great-minded one; kīdṛk vākyam idam — what sort of statement is this; bhānoḥ — of Bhānu; vākya-artham — the meaning of the statement; brūhi — tell; prabho — O Lord.","।। अनूरुरुवाच ।।\nब्रूहि मां देवशार्दूल यत्पृच्छामि महामते ।। कीदृग्वाक्यमिदं भानोर्वाक्यार्थं ब्रूहि च प्रभो ॥ २७ ॥"],["The Seven-Horsed Sun said: Whatever pure statement is composed by the flawless, all-knowing Lord is authoritative, without doubt.","saptāśvatilakaḥ uvāca — Saptāśvatilaka said; vimukta-aśeṣa-doṣeṇa — by one freed from all faults; sarva-jñena bhagena — by the all-knowing Bhagavān; yat — which; praṇītam — composed; amalam vākyam — pure statement; tat pramāṇam — that is authoritative; na saṃśayaḥ — no doubt.","।। सप्ताश्वतिलक उवाच ।।\nविमुक्ताशेषदोषेण सर्वज्ञेन भगेन यत् ।। प्रणीतममलं वाक्यं तत्प्रमाणं न संशयः ॥ २८ ॥"],["Since the wise call him Mārtāṇḍa, one truly obtains merit; through lack of faith, one falls downward.","yasmāt — because; mārtāṇḍa-nāma — the name Mārtāṇḍa; asau — he; kathyate — is called; manīṣibhiḥ — by the wise; yathārtham — according to truth; puṇyam āpnoti — one obtains merit; aśraddhayā — through lack of faith; tu — but; adhaḥ patati — one falls downward.","यस्मान्मार्तंड नामासौ कथ्यते च मनीषिभिः ।। यथार्थं पुण्यमाप्नोति पतत्यश्रद्धया त्वधः ॥ २९ ॥"],["One should honor as the Sun the teacher who proclaims the Sun’s teaching, who raises a person sunk in the ocean of worldly existence.","saura-vākya-pravaktāram — the speaker of solar teaching; sūryavat — like the Sun; pūjayet — one should worship; gurum — the teacher; saṃsāra-arṇave nimagnam — submerged in the ocean of saṃsāra; yaḥ — who; janam — a person; samuddharate — lifts up.","सौरवाक्यप्रवक्तारं सूरवत्पूजयेद्गुरुम् ।। संसारार्णव निर्मग्नं यः समुद्धरते जनम् ॥ ३० ॥"],["What teacher is equal to that one? With the water of the Sun’s teaching in his hand, he slowly quenches the one scorched by the fire of ignorance. What devotee would not honor him with the nectar of knowledge?","saura-dharma-ambu-hastena — with the water of solar dharma in his hand; kaḥ — who; tena sadṛśaḥ guruḥ — a teacher equal to him; ajñāna-vahni-saṃtaptaṃ — one scorched by the fire of ignorance; nirvāpayati — extinguishes; yaḥ — who; śanaiḥ — gradually; jñāna-amṛtena — with the nectar of knowledge; bhaktā — devoted; kaḥ tam na pratipūjayet — who would not honour him?","सौरधर्माम्बुहस्तेन कस्तेन सदृशो गुरुः ।। अज्ञानवह्निसंतप्तं निर्वापयति यः शनैः ।। ज्ञानामृतेन वै भक्ता कस्तं न प्रतिपूजयेत् ॥ ३१ ॥"],["Neither through a great kingdom nor through heaps of wealth is the quelling of ignorance, which brings happiness in the next world, attained.","na eva — neither indeed; rājyena mahatā — by a great kingdom; na ca eva — nor indeed; artha-rāśibhiḥ — by heaps of wealth; ajñāna-śamanam — pacification of ignorance; par loke — in the next world; sukha-āvaham — bringing happiness; prāptam — obtained.","नैव राज्येन महता न चैवार्थस्य राशिभिः ।। प्राप्तमज्ञानशमनं परलोके सुखावहम् ॥ ३२ ॥"],["Whatever fine statement is spoken by the God of gods for attaining heaven and liberation, that should be known as well spoken.","svarga-apavarga-siddhi-artham — for attaining heaven and liberation; bhāṣitam yat — whatever is spoken; śobhanam — fine; vākyam — statement; te — to you; deva-devena — by the God of gods; tat vijñeyam — that is to be understood; su-bhāṣitam — well-spoken.","स्वर्गापवर्ग सिद्ध्यर्थं भाषितं यत्तु शोभनम् ।। वाक्यं ते देवदेवेन तद्विज्ञेयं सुभाषितम् ॥ ३३ ॥"],["The speech of those who follow passion, hatred, intolerance, anger, desire, and thirst is called ill-spoken, because it leads to hell.","rāga-dveṣa-akṣamā-krodha-kāma-tṛṣṇā-anusāriṇām — of those following attachment, hatred, intolerance, anger, desire, and thirst; vākyam — speech; niraya-hetutvāt — because it is a cause of hell; tat durbhāṣitam ucyate — that is called ill-spoken.","रागद्वेषाक्षमाक्रोधकामतृष्णानुसारिणाम् ।। वाक्यं निरय हेतुत्वात्तद्दुर्भाषितमुच्यते ॥ ३४ ॥"],["What use is speech in Sanskrit, even when joined with gentle talk, if it delights in ignorance and causes the suffering of worldly existence?","saṃskṛtena api — even in Sanskrit; kim tena — what is the use of that; mṛdu-ālāpa-saṅginā — joined with gentle conversation; avidyā-ārāma-vākyena — by speech delighting in ignorance; saṃsāra-kleśa-hetunā — causing the suffering of saṃsāra.","संस्कृतेनापि किं तेन मृदुलालापसंगिना ।। अविद्यारामवाक्येन संसारक्लेशहेतुना ॥ ३५ ॥"],["That speech, on hearing which merit arises and passion and the rest diminish, should be known as exceedingly beautiful, even if misshapen.","yat śrutvā — hearing which; jāyate puṇyam — merit arises; rāga-ādīnām — of attachment and the rest; ca saṃkṣayaḥ — and destruction; virūpam api — even if unattractive; tat vākyam — that speech; vijñeyam — is to be understood; ati-śobhanam — as exceedingly beautiful.","यच्छ्रुत्वा जायते पुण्यं रागादीनां च संक्षयः ।। विरूपमपि तद्वाक्यं विज्ञेयमतिशोभनम् ॥ ३६ ॥"],["The remembered texts, the Mahābhārata, the Vedas, and the great scriptures, with righteousness and purpose woven together, are only for wearing away one’s lifespan.","smṛtayaḥ — Smṛtis; bhāratam — Bhārata; vedāḥ — Vedas; śāstrāṇi su-mahānti — very great śāstras; dharma-artha-sam-grathitaḥ — interwoven with dharma and meaning; sva-āyuṣaḥ kṣapaṇāya eva — only for wearing away one’s lifespan.","स्मृतयो भारतं वेदाः शास्त्राणि सुमहांति च ।। स्वायुषः क्षपणायैव धमोऽर्थसमग्रन्थितः ॥ ३७ ॥"],["In the worldly life of sons, wives, and the rest, the beginningless scripture came from the mouths of those who know worldly existence, for men of deluded minds.","putra-dāra-ādi-saṃsāre — in the worldly life of sons, wives, and the rest; narāṇām mūḍha-cetasām — of people with deluded minds; saṃsāra-viduṣām — for those who know saṃsāra; śāstram — scripture; anādi-mukha-nirgatam — issued from the beginningless mouth.","पुत्रदारादिसंसारे नराणां मूढचेतसाम् ।। संसारविदुषां शास्त्रमनादि मुखनिर्गतम् ॥ ३८ ॥"],["You wish to know all: “This is best; this is to be known.” Even one who lives a thousand years does not reach the end of scripture.","idam śreṣṭham — this is best; idam jñeyam — this is to be known; sarvam — all; tvam jñātum icchasi — you desire to know; api — even; varṣa-sahasra-āyuḥ — one with a thousand-year lifespan; śāstra-antam na adhigacchati — does not reach scripture’s end.","इदं श्रेष्ठमिदं ज्ञेयं सर्वं त्वं ज्ञातुमिच्छसि ।। अपि वर्षसहस्रायुः शास्त्रान्तं नाधिगच्छति ॥ ३९ ॥"],["Knowing the imperishable syllable alone, and that life is a great deception, one should set aside all scriptures and pursue the next world.","vijñāya — having discerned; akṣara-tan-mātram — that imperishable principle alone; jīvitam ca ati-vañcanam — and that life is greatly deceptive; vihāya — leaving; sarva-śāstrāṇi — all śāstras; para-lokam samācaret — one should practise for the next world.","विज्ञायाक्षरतन्मात्रं जीवितं चातिवंचनम् ।। विहाय सर्वशास्त्राणि परलोकं समाचरेत् ॥ ४० ॥"],["What use is a learned and capable person among embodied beings if he is unable to bear the burden of merit for the next world?","paṇḍitena api — even with a learned person; kim — what use; tena — with him; samarthena — capable; dehinām — among embodied beings; yaḥ — who; puṇya-bhāram — the burden of merit; udvoḍhum — to bear; aśaktaḥ — unable; pāralaukikam — for the next world.","पण्डितेनापि किं तेन समर्थेन च देहिनाम् ।। यः पुण्यभारमुद्वोढुमशक्तः पारलौकिकम् ॥ ४१ ॥"],["Even a learned person is a fool, powerless despite having power, if he is unable to proclaim the greatness of the Sun’s knowledge.","paṇḍitaḥ api — even a learned man; saḥ — he; mūrkhaḥ syāt — would be a fool; śakti-yuktaḥ api — even endowed with power; aśaktikaḥ — powerless; yaḥ — who; saura-jñāna-māhātmyam — the greatness of solar knowledge; uccārayitum — to proclaim; akṣamaḥ — unable.","पण्डितोऽपि स मूर्खः स्याच्छक्तियुक्तोऽप्यशक्तिकः ।। यः सौरज्ञानमाहात्म्यमुच्चारयितुमक्षमः ॥ ४२ ॥"],["Therefore he is learned and capable, an ascetic who has conquered his senses, who is intent on considering the true nature of the Sun’s knowledge.","tasmāt — therefore; saḥ paṇḍitaḥ — he is learned; śaktaḥ — capable; saḥ tapasvī — he is an ascetic; jita-indriyaḥ — with senses conquered; yaḥ — who; saura-jñāna-sad-bhāvam — the true nature of solar knowledge; ālocayitum udyataḥ — intent on considering.","तस्मात्स पंडितः शक्तः स तपस्वी जितेन्द्रियः ।। यः सौरज्ञानसद्भावमालोचयितुमुद्यतः ॥ ४३ ॥"],["Even if a king gives the whole earth, wealth, and gold, a teacher should not instruct him if he asks for everything unjustly.","yaḥ nṛpaḥ — whichever king; pradadyāt — might give; kṛtsnām kṣmām — the whole earth; dhanam kāñcanam tathā — wealth and gold likewise; sarvam anyāyataḥ pṛcchet — asks everything unjustly; na tasya upadiśet guruḥ — a guru should not instruct him.","यः प्रदद्यान्नृपः कृत्स्नां क्ष्मां धनं कांचनं तथा ।। सर्वमन्यायतः पृछेन्न तस्योपदिशेद्गुरुः ॥ ४४ ॥"],["He who properly hears and speaks the Sun’s teaching goes to a good abode; in the opposite case, to hell.","yaḥ — whoever; śṛṇoti — hears; raveḥ dharmam — the dharma of Ravi; nyāyataḥ — rightly; saḥ ca vakti — and speaks it; tataḥ — then; gacchati su-sthānam — goes to a good place; narakam — to hell; tat-viparyaye — in the opposite case.","यः शृणोति रवेर्धर्मं न्यायतः स च वक्ति च ।। ततो गच्छति सुस्थानं नरकं तद्विपर्यये ॥ ४५ ॥"],["When the Sun is worshipped with milk from a donated cow according to the six-syllable rite, men quickly attain great equality.","datta-go-doha-saṃbhūtaḥ — arising from the milking of a given cow; ṣaḍ-akṣara-vidhānataḥ — according to the six-syllable rule; raviḥ sampūjitaḥ — Ravi being worshipped; śīghram — quickly; narāṇām — among people; tulyatā bhṛśam — great distinction/elevation.","दत्तगोदोहसंभूतः षडक्षरविधानतः ।। रविः संपूजितः शीघ्रं नराणां तुल्यता भृशम् ॥ ४६ ॥"],["Long ago, five cows arose from the Ocean of Milk, churned by gods and antigods; they are mothers of all the worlds.","surāsuraiḥ — by gods and asuras; mathyamānāt — being churned; kṣīrodāt sāgarāt — from the ocean of milk; purā — long ago; pañca gāvaḥ — five cows; samutpannāḥ — arose; sarva-lokasya mātaraḥ — mothers of the whole world.","सुरासुरैर्मथ्यमानात्क्षीरोदात्सागरात्पुरा ।। पञ्च गावः समुत्पन्नाः सर्वलो कस्य मातरः ॥ ४७ ॥"],["Nandā, Subhadrā, Surabhī, Sumanā, and Śobhanāvatī—the cows arose, shining with splendor equal to the Sun and having taken form.","nandā — Nandā; subhadrā — Subhadrā; surabhī — Surabhī; sumanā — Sumanā; śobhanāvatī — Śobhanāvatī; gāvaḥ — cows; sūrya-samā-bhāsaḥ — radiant like the Sun; utpannāḥ — arose; kṛtim āgatāḥ — came into created existence.","नंदा सुभद्रा सुरभी सुमना शोभनावती ।। गावः सूर्यसमा भासा उत्पन्नाः कृतिमागताः ॥ ४८ ॥"],["For the benefit of all worlds and the satisfaction of the gods, the cows, having taken refuge in me, remain for the bathing of the Sun.","sarva-loka-upakāra-artham — for the benefit of all worlds; devānām tarpaṇāya ca — and for the satisfaction of the gods; mām āśritya sthitāḥ — remain resorting to me; gāvaḥ — the cows; snānārtham — for bathing; bhāskarasya tu — of Bhāskara.","सर्वलोकोपकारार्थं देवानां तर्पणाय च ।। मामाश्रित्य स्थिता गावः स्नानार्थं भास्करस्य तु ॥ ४९ ॥"],["O best of birds, their sacred parts are six in number; know that they are present among all creatures.","tāsām aṅgāni — their limbs; puṇyāni — sacred; ṣaḍ-rasāḥ — the six tastes; khaga-sattama — O best of birds; khaga-ādiṣu ca sarveṣu — in all, beginning with birds; sthirāṇi — established; iti upadhāraya — understand thus.","तासामंगानि पुण्यानि षड्रसाः खगसत्तम ।। खगादिषु च सर्वेषु स्थिराणीत्युपधारय ॥ ५० ॥"],["Cow dung, yellow pigment, urine, milk, curd, and ghee are the six pure constituents of cows, each bringing every accomplishment.","go-mayam — cow dung; rocanam — rocanā; mūtram — urine; kṣīram — milk; dadhi — curd; ghṛtam — ghee; gavām — of cows; ṣaḍ-aṅgāni — six limbs; pavitrāṇi — sacred; sarva-siddhi-karāṇi — causing every accomplishment; ca — and.","गोमयं रोचनं मूत्रं क्षीरं दधि घृतं गवाम् ।। षडंगानि पवित्राणि सर्वसिद्धिकराणि च ॥ ५१ ॥"],["From cow dung arose the glorious wood-apple tree, dear to the Sun. The lotus-handed goddess of prosperity dwells there; therefore that tree is renowned.","go-mayāt — from cow dung; utthitaḥ — arisen; śrīmān — glorious; bilva-vṛkṣaḥ — bilva tree; arka-vallabhaḥ — beloved of the Sun; tatra — there; āste — dwells; padma-hastā śrīḥ — Śrī with a lotus in her hand; vṛkṣaḥ tena ca saḥ smṛtaḥ — therefore it is remembered as a tree.","गोमयादुत्थितः श्रीमान्बिल्ववृक्षोऽर्कवल्लभः ।। तत्रास्ते पद्महस्ता श्रीर्वृक्षस्तेन च स स्मृतः ॥ ५२ ॥"],["Mud, blue lotuses, and lotuses were again born from cow dung; yellow cow pigment is auspicious, pure, and fulfills every desire.","paṅkāni — mire; utpala-padma — blue lilies and lotuses; punaḥ jātāni — are born again; go-mayāt — from cow dung; go-rocanā — gorocanā; māṅgalya — auspicious; pavitram — purifying; sarva-kāma-dam — bestowing every desire.","पंकान्युत्पलपद्मानि पुनर्जातानि गोमयात् ।। गोरोचनं च मंगल्य पवित्रं सर्वकामदम् ॥ ५३ ॥"],["Guggul resin, fragrant and lovely to behold, arose from cow urine; it is food for all the gods, especially the Sun.","go-mūtrāt — from cow urine; gugguluḥ jātaḥ — guggulu is born; su-gandhiḥ — fragrant; priya-darśanaḥ — pleasing to behold; āhāraḥ — food; sarva-devānām — of all the gods; bhāskarasya viśeṣataḥ — especially of Bhāskara.","गोमूत्राद्गुग्गुलुर्जातः सुगंधिः प्रियदर्शनः ।। आहारः सर्वदेवानां भास्करस्य विशेषतः ॥ ५४ ॥"],["Whatever seed there is in the world should be known as born from milk; all auspicious things arise from curd for the fulfillment of aims.","yat bījam jagataḥ kiñcit — whatever seed of the world; tat jñeyam — that is to be known; kṣīra-saṃbhavam — arising from milk; dadhnaḥ — from curd; sarvāṇi — all; jātāni — arose; māṅgalyāni — auspicious things; artha-siddhaye — for accomplishment of aims.","यद्बीजं जगतः किंचित्तज्ज्ञेयं क्षीरसंभवम् ।। दध्नः सर्वाणि जातानि मांगल्यान्यर्थसिद्धये ॥ ५५ ॥"],["Nectar, exceedingly dear to the immortals, arose from ghee; therefore one should bathe the Sun with ghee, milk, and curd.","ghṛtāt — from ghee; amṛtam utpannam — amṛta arose; amarāṇām — to the immortals; ati-priyam — exceedingly dear; tasmāt — therefore; ghṛtena — with ghee; payasā — with milk; dadhnā — with curd; yaḥ — whoever; snāpayet ravim — bathes Ravi.","घृतादमृतमुत्पन्नममराणामतिप्रियम् ।। तस्माद्धृतेन पयसा दध्ना यः स्नापयेद्रविम् ॥ ५६ ॥"],["After that, he should cleanse him with warm water and astringents; having bathed him with cool water, he should anoint the Sun with yellow pigment.","tat-ante — after that; ca — and; uṣṇa-toyena — with warm water; kaṣāyaiḥ ca — and with astringents; nirūpayet — should wash/prepare; snāpya — having bathed; śīta-ambunā — with cool water; paścāt — afterward; bhānum — Bhānu; rocanayā ālabhet — should anoint with rocanā.","तदंते चोष्णतोयेन कषायैश्च निरूपयेत् ।। स्नाप्य शीतांबुना पश्चाद्भानुं रोचनयालभेत् ॥ ५७ ॥"],["He should worship with wood-apple leaves, lotuses, and blue lotuses; then he should offer a water offering, followed by diamond and guggul resin, O bird.","pūjayet — one should worship; bilva-patraiḥ — with bilva leaves; padmaiḥ — with lotuses; nīla-utpalaiḥ tathā — and blue lilies; arghyam dadyāt — one should give arghya; tataḥ paścāt — afterward; sa-vajram guggulam — vajra and guggulu together; khaga — O Bird.","पूजयेद्बिल्वपत्रैश्च पद्मैर्नीलोत्पलैस्तथा ।। अर्घ्यं दद्यात्ततः पश्चात्सवज्रं गुग्गुलं खग ॥ ५८ ॥"],["He should offer rice pudding, curd rice, a diamond with honey, and various foods, with true devotion.","pāyasam — pāyasa; dadhi-bhaktam — curd-rice; ca — and; vajram — vajra; madhuṇā saha — together with honey; nivedayet — one should offer; ca — and; sad-bhaktyā — with true devotion; vividhāni bhakṣyāṇi — various foods.","पायसं दधिभक्तं च वज्रं च मधुना सह ।। निवेदयेच्च सद्भक्त्या भक्ष्याणि विविधानि च ॥ ५९ ॥"],["Then, having circumambulated and bowed down, he should ask forgiveness. By this rite he worships the Sun, lord of the day, with six parts.","kṛtvā pradakṣiṇam — having made circumambulation; paścāt — afterward; praṇipatya — having bowed; kṣamāpayet — one should ask forgiveness; anena vidhinā — by this procedure; bhānum — Bhānu; ṣaḍ-aṅgena — with six limbs; divas-patim — lord of the day.","कृत्वा प्रदक्षिणं पश्चात्प्रणिपत्य क्षमापयेत् ।। अनेन विधिना भानुं षडंगेन दिवस्पतिम् ॥ ६० ॥"],["Having thus worshipped the cheerful Sun by the six-part rite, he obtains all desires in this world and the next.","iha loke — in this world; pare ca eva — and indeed in the next; sarvān kāmān — all desires; saḥ gacchati — he obtains; ṣaḍ-aṅga-vidhinā — by the six-limbed procedure; tam pūjya — having worshipped him; evam — thus; su-manāḥ ravim — the gracious Ravi.","इह लोके परे चैव सर्वान्कामान्स गच्छति ।। षडंगविधिना तं चापूज्यैवं सुमना रविम् ॥ ६१ ॥"],["The wise man carries twenty-one generations of families to heaven; having established them in heaven, he himself goes to that celestial station.","sa-dhīmān — the wise one; svargam nayet — leads to heaven; kulānām eka-viṃśatim — twenty-one families; svarge sthāpya — having established in heaven; svayam gacchet — he himself goes; jyautiṣam nāma tat padam — to that station named Jyotiṣ.","स्वर्गं नयेत्सधीमांस्तु कुलानामेकविंशतिम् ।। स्वर्गे स्थाप्य स्वयं गच्छेज्ज्यौतिषं नाम तत्पदम् ॥ ६२ ॥"],["O hero, the Sun-priests are appointed in part for the work of the gods; they go with their lord to the highest, glorious light of the Sun.","aṃśena — by their share; bhojakāḥ — Bhojakas; vīrāḥ — valiant; deva-kārye niyojitāḥ — appointed for divine service; prayānti — go; svāminā sārdham — with their lord; śrīmat-bhānum — glorious Bhānu; param mahaḥ — supreme splendour.","अंशेन भोजका वीर देवकार्ये नियोजिताः ।। प्रयांति स्वामिना सार्धं श्रीमद्भानुं परं महः ॥ ६३ ॥"],["Having enjoyed abundant pleasures, the Sun-priest, equal in enjoyment, returns here in time and becomes a sole ruler on earth.","bhuktvā — having enjoyed; bhogān tu vipulān — abundant pleasures; bhojakaḥ — a Bhojaka; bhoga-sammitaḥ — equal to pleasure; kālāt — after a time; punaḥ iha āgataḥ — having returned here again; pṛthivyām — on earth; eka-rāṭ bhavet — becomes sole king.","भुक्त्वा भोगांस्तु विपुलान्भोजको भोगसंमितः ।। कालात्पुनरिहायातः पृथिव्यामेकराड्भवेत् ॥ ६४ ॥"],["Flowers, leaves, fruit, and water used in the Sun’s worship, along with Sun-worshippers and cows, go to the world of the Sun, without doubt.","puṣpam — flower; patram — leaf; phalam — fruit; toyam — water; yat gatam — whatever has gone/been offered; bhāskara-arcanē — in worship of Bhāskara; saura-gāvaḥ ca — and solar cows; gacchanti — go; sūrya-lokam — to the world of the Sun; na saṃśayaḥ — without doubt.","पुष्पं पत्रं फलं तोयं यद्गतं भास्करार्चने ।। सौरा गावश्च गच्छंति सूर्यलोकं न संशयः ॥ ६५ ॥"],["Whoever drinks at a meal the milk of a cow without offering it to the Sun goes to dreadful hell, having made no offering to the Sun.","yaḥ — whoever; pibet — drinks; bhojane — at a meal; dhenoḥ payaḥ — the cow’s milk; adattā — not given; bhānave — to Bhānu; saḥ gacchet — he goes; narakam ghoram — to a terrible hell; akurvan — not making; tarpaṇam raveḥ — an offering to Ravi.","यः पिबेद्भोजने धेनोरदत्ता भानवे पयः ।। स गच्छेन्नरकं घोरमकुर्वंस्तर्पणं रवेः ॥ ६६ ॥"],["Whatever milk is present at dawn from the Sun’s cows, one should bathe the Sun with all of it, O elder brother of Garuḍa.","eka-kālam — once/at one time; pibet kṣīram — one should drink milk; dhenūnām bhāskarasya tu — of Bhāskara’s cows; anena — with this; snāpayet devam — one should bathe the deity; kṣīreṇa — with milk; khaga-sattama — O best of birds.","एककालं पिबेत्क्षीरं धेनूनां भास्करस्य तु ।। अनेन स्नापयेद्देवं क्षीरेण खगसत्तम ॥ ६७ ॥"],["Whatever milk is present at dawn from the Sun’s cows, one should bathe the Sun with all of it, O elder brother of Garuḍa.","pratyūṣe — at dawn; yat kṣīram bhavet — whatever milk there is; dhenūnām bhāskarasya tu — of Bhāskara’s cows; snāpayet tena vai — one should bathe with that indeed; bhānum — Bhānu; kṛtsnena — with all of it; garuḍa-agraja — O elder brother of Garuḍa.","प्रत्यूषे यद्भवेत्क्षीरं धेनूनां भास्करस्य तु ।। स्नापयेत्तेन वै भानुं कृत्स्नेन गरुडाग्रज ॥ ६८ ॥"],["Whoever consumes all of it and does not offer it to the deity is cooked in hell for as many thousand years as there are hair pores on a cow’s body, O lord of birds.","yaḥ tu — whoever; lokam sarvam — all [of it]; bhajet — enjoys; na devāya nivedayet — does not offer to the deity; yāvantaḥ — as many as; roma-kūpāḥ — hair-follicles; gavām dehe — on cows’ bodies; tāvat varṣa-sahasrāṇi — for that many thousands of years; narake pacyate — is cooked in hell.","यस्तु लोको भजेत्सर्व न देवाय निवेदयेत् ।। यावन्तो रोमकूपाश्च गवां देहे खगाधिप ।। तावद्वर्षसहस्राणि नरके पच्यते खग ॥ ६९ ॥"],["Whoever hears the Sun, worshipped or being worshipped, and whoever approves after hearing, obtains the fruit of sacrifice.","pūjitam — worshipped; pūjyamānam vā — or being worshipped; yaḥ kaścit — whoever; śṛṇuyāt ravim — hears of Ravi; śrutvā — having heard; anumodate yaḥ tu — and whoever approves; saḥ — he; yajña-phalam aśnute — enjoys the fruit of sacrifice.","पूजितं पूज्यमानं वा यः कश्चिच्छृणुयाद्रविम् ।। श्रुत्वानुमोदते यस्तु स यज्ञफलमश्नुते ॥ ७० ॥"],["Seeing the Sun worshipped, one is freed from all sins; having joyfully bowed to the Sun, one is honored in the Sun’s world.","bhāskaram pūjitam dṛṣṭvā — seeing Bhāskara worshipped; sarva-pāpaiḥ pramucyate — one is released from all sins; harṣāt — joyfully; praṇamya vai bhānum — having indeed bowed to Bhānu; tasya loke mahīyate — one is honoured in his world.","भास्करं पूजितं दृष्ट्वा सर्वपापैः प्रमुच्यते ।। हर्षात्प्रणम्य वै भानुं तस्य लोके महीयते ॥ ७१ ॥"],["O bird, whoever among people sees the Sun being worshipped with devotion also obtains the entire fruit of sacrifice, without doubt.","pūjyamānam ravim — Ravi being worshipped; bhaktyā — with devotion; yaḥ paśyet mānavaḥ — whoever among humans sees; khaga — O Bird; saḥ api — he also; yajña-phalam kṛtsnam — the entire fruit of sacrifice; prāpnuyāt — would obtain; na atra saṃśayaḥ — here there is no doubt.","पूज्यमानं रविं भक्त्या यः पश्येन्मानवः खग ।। सोऽपि यज्ञफलं कृत्स्नं प्राप्नुयान्नात्र संशयः ॥ ७२ ॥"],["Whoever hears and approves while the Day-maker is being worshipped obtains all that fruit through the Sun’s favor.","śrutvā — having heard; anumodate yaḥ tu — whoever approves; pūjyamānam divākaram — Divākara being worshipped; tat sarvam phalam — all that fruit; āpnoti — obtains; prasādāt bhāskarasya tu — through Bhāskara’s grace.","श्रुत्वानुमोदते यस्तु पूज्यमानं दिवाकरम् ।। तत्सर्वं फलमाप्नोति प्रसादाद्भास्करस्य तु ॥ ७३ ॥"],["A gift offered with devotion follows for one birth; among those without the sacrifice of recitation, it is said to last for a thousand births. A gift to those who live by recitation lasts until the cosmic dissolution.","eka-janma-anugam — following one birth; dānam — a gift; bhaktyā yat ca niveditam — which is offered with devotion; japa-yajñāt viyuktebhyaḥ — to those separated from japa-yajña; sahasra-bhavikam smṛtam — is remembered as lasting a thousand births; ā-bhūta-samplava-sthāyi — enduring until universal dissolution; pradānam — giving; japa-jīvinām — to those who live by japa.","एकजन्मानुगं दानं भक्त्या यच्च निवेदितम् ।। जपयज्ञाद्वियुक्तेभ्यः सहस्रभविकं स्मृतम् ।। आभूतसंप्लव स्थायि प्रदानं जपजीविनाम् ॥ ७४ ॥"],["Even a very small gift to a reciter, O lord of birds, serves for the donor’s enjoyment until the great dissolution.","ati-alpam api — even very little; yat dattam — what is given; vācakāya — to a reciter; khaga-adhipa — O lord of birds; tat — that; mahā-pralayam yāvat — until the great dissolution; dātuḥ bhogāya kalpate — becomes for the giver’s enjoyment.","अत्यल्पमपि यद्दत्तं वाचकाय खगाधिप ।। तन्महाप्रलयं यावद्दातुर्भोगाय कल्पते ॥ ७५ ॥"],["For those who understand, no gift is small in any way; joined with place, time, rite, faith, and a worthy recipient, it is inexhaustible.","na dānam alpam — no gift is small; bahudhā kiñcit asti — anything in any way exists; vijānatām — for those who understand; deśa-kāla-vidhi-śraddhā-pātra-yuktam — joined with place, time, procedure, faith, and recipient; tat akṣayam — that is imperishable.","न दानमल्पं बहुधा किंचिदस्ति विजानताम् ।। देशकालविधिश्रद्धापात्रयुक्तं तदक्षयम् ॥ ७६ ॥"],["Whatever is given, offered into the fire, or done to a worthy recipient in the proper place and time, with rite and faith, becomes of endless fruit.","pātre deśe ca kāle ca — to a worthy recipient, in the proper place and time; vidhinā — by procedure; śraddhayā ca — and with faith; yat dattam — what is given; hutam — offered in fire; kṛtam ca eva — and indeed done; tat ananta-phalam bhavet — that bears endless fruit.","पात्रे देशे च काले च विधिना श्रद्धया च यत् ।। दत्तं हुतं कृतं चैव तदनंतफलं भवेत् ॥ ७७ ॥"],["Even half a sesame seed, given with faith, O Brahmin, to a worthy recipient according to rule and with devotion, fulfills every desire.","tila-ardham api — even half a sesame seed; yat vīra — which, O hero; dīyate — is given; śraddhayā — with faith; dvija — O dvija; sat-pātre — to a worthy recipient; vidhi-vat — according to rule; bhaktyā — with devotion; tat bhavet sarva-kāmikam — that becomes capable of fulfilling every desire.","तिलार्धमपि यद्वीर दीयते श्रद्धया द्विज ।। सत्पात्रे विधिवद्भक्त्या तद्भवेत्सर्वकामिकम् ॥ ७८ ॥"],["A person bathed in the waters of knowledge and cleansed with the ash of good conduct is proclaimed the highest recipient among all recipients.","yat snātam — who is bathed; jñāna-salilaiḥ — with the waters of knowledge; śīla-bhasma-pramārjitam — cleansed by the ashes of good conduct; tat pātram — that recipient; sarva-pātrebhyaḥ uttamam — highest among all recipients; parikīrtitam — is proclaimed.","यत्स्नातं ज्ञानसलिलैः शीलभस्मप्रमार्जितम् ।। स्नान तत्पात्रं सर्वपात्रेभ्य उत्तमं परिकीर्तितम् ॥ ७९ ॥"],["Recitation, self-restraint, and observance save people from the ocean of worldly existence; such a person is held to be the highest recipient for the ignorant, whose eyes are turned to sin.","japaḥ — japa; damaḥ — restraint; yamaḥ — discipline; puṃsām — of people; trātā — rescuer; saṃsāra-sāgarāt — from the ocean of saṃsāra; ajñānām — for the ignorant; pāpa-netrāṇām — whose eyes are sinful; tat-pātram — that recipient; paramam smṛtam — is remembered as supreme.","जपो दमो यमः पुंसां त्राता संसारसागरात् ।। अज्ञानां पापनेत्राणां तत्पात्रं परमं स्मृतम् ॥ ८० ॥"],["A scripture equipped with the raft of knowledge surely carries the ignorant across the great ocean of sin. Can a stone carry a stone?","jñāna-plavena upetam — furnished with the raft of knowledge; śāstram — śāstra; pāpa-mahā-arṇavāt — from the great ocean of sin; ajñān — the ignorant; saṃtārayet — would carry across; nūnam — surely; kim — would; śilā — a stone; śilām tārayet — carry a stone across?","ज्ञानप्लवेन चोपेतं शास्त्रं पापमहार्णवात् ।। अज्ञान्संतारयेन्नूनं किं शिला तारयेच्छिलाम् ॥ ८१ ॥"],["The merit gained by feeding Brahmins learned in the Vedas is gained also by giving a meal offering to one who lives by recitation.","dvijānām — of twice-born men; veda-viduṣām — knowing the Veda; kaṭi-saṃbhogi yat phalam — whatever fruit is enjoyed at the waist/meal; hantakāra-pradānena — by giving hantakāra; tat phalam — that fruit; japa-jīvine — to one who lives by japa.","द्विजानां वेदविदुषां कटिसंभोगि यत्फलम् ।। हंतकारप्रदानेन तत्फलं जपजीविने ॥ ८२ ॥"],["When a living being comes to his house and eats, honored with hospitality, he raises his family dwelling in the ocean of hell.","jīvaḥ — a living being/reciter; yasya gṛhe — in whose house; etya — having come; bhuṅkte — eats; sat-kṛti-sat-kṛtaḥ — honoured with due respect; kulam — the family; uttārayet — lifts across; tasya — his; naraka-arṇava-saṃsthitam — situated in the ocean of hell.","जीवो यस्यैत्य गृहे च भुङ्क्ते सत्कृतिसत्कृतः ।। कुलमुत्तारयेत्तस्य नरकार्णवसंस्थितम् ॥ ८३ ॥"],["By giving food to those who recite, one obtains the entire fruit proclaimed for sacrifices, fire offerings, and pilgrimage places.","yajña-agni-homa-tīrtheṣu — in sacrifices, Agnihotra, and tīrthas; yat phalam — whatever fruit; parikīrtitam — is proclaimed; japi­nām anna-dānena — by giving food to practitioners of japa; tat samagram phalam labhet — one obtains that entire fruit.","यज्ञाग्निहोमतीर्थेषु यत्फलं परिकीर्तितम् ।। जपिनामन्नदानेन तत्समग्रं फल लभेत् ॥ ८४ ॥"],["Having once given food with faith to a reciter of tranquil mind and devoted to contemplation, one is freed from all sins.","bhojine — to a Bhojaka/eater; śānta-cittāya — of tranquil mind; paridhyāna-ratāya ca — and devoted to contemplation; śraddhayā — with faith; annam sakṛt dattvā — having given food once; sarva-pāpaiḥ pramucyate — one is released from all sins.","भोजिने शांतचित्ताय परिध्यानरताय च ।। श्रद्धयान्नं सकृद्दत्त्वा सर्वपापैः प्रमुच्यते ॥ ८५ ॥"],["Having once fed with devotion those who recite, are joined with peace, and whose minds are offered to the Sun, one obtains all desires.","japa-kān — practitioners of japa; śānti-saṃyuktān — joined with peace; āditya-arpita-cetasaḥ — whose minds are offered to Āditya; bhojayitvā — having fed; sakṛt — once; bhaktyā — with devotion; sarvān kāmān avāpnuyāt — one obtains all desires.","जपकाञ्छांतिसंयुक्तानादित्यार्पितचेतसः ।। भोजयित्वा सकृद्भक्त्या सर्वान्कामानवाप्नुयात् ॥ ८६ ॥"],["Whoever continually feeds while meditating on the Sun’s hymn, by that very act the food is directly consumed.","dhyāyamānaḥ — meditating; raveḥ sūktam — on the hymn of Ravi; bhojayet — should feed; satatam ca yaḥ — and whoever continually; tataḥ — then; sākṣāt — directly; anena eva — by this very act; tat bhuktam aśanam bhavet — that becomes food eaten.","ध्यायमानो रवेः सूक्तं भोजयेत्सततं च यः ।। ततः साक्षादनेनैव तद्भुक्तमशन भवेत् ॥ ८७ ॥"],["A man who feeds a Sun-priest at an ancestral rite, dedicating it to the ancestors, undoubtedly attains the Sun’s abode.","pitṝn uddiśya — with the ancestors as recipients; yaḥ — whoever; śrāddhe — at a śrāddha; bhojayet bhojakam naraḥ — a man feeds a Bhojaka; saḥ — he; sthānam samavāpnoti — attains the station; bhānavīyam — of Bhānu; asaṃśayam — without doubt.","पितॄनुदिश्य यः श्राद्धे भोजयेद्भोजकं नरः ।। स स्थानं समवाप्नोति भानवीयमसंशयः ॥ ८८ ॥"]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1],sa:r[2]}]));renderBhavishyaLiveChapter({chapter:187,verseCount:88,subtitle:"Chapter 187 — The Greatness of the Cow in Solar Dharma",colophon:"",preferEmbeddedSanskrit:true},T);</script></body></html>
