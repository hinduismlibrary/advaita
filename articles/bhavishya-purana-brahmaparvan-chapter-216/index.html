<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 216 — Āditya’s Greatness and the Method of Hearing the Purāṇa."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 216 — Āditya’s Greatness and the Method of Hearing the Purāṇa — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-2" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 216 — Āditya’s Greatness and the Method of Hearing the Purāṇa</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav" aria-label="Chapter navigation"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-215/">← Chapter 215</a><a href="/advaita/pages/bhavishya-purana-brahmaparvan/">Chapter contents</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-2"></script><script>const R={"1":["Sumantu said, Hear the procedure of worship, O king. For what purpose should one carefully sprinkle with water purified by mantra, being well composed.","śṛṇuṣva—hear; arcā-vidhim—the procedure of worship; rājan—O king; mantra-pūtena—with mantra-purified; vāriṇā—with water; prokṣaṇīyam—to be sprinkled; kimartham—for what purpose; prayatnena—with care; susamāhitaḥ—composed."],"2":["Having placed the mantra in the heart and the other limbs, the knower of mantras should meditate on himself as Bhāskara, accompanied by attendants.","hṛdaya-ādiṣu—in the heart and other [limbs]; aṅgeṣu—in the limbs; mantram—the mantra; vinyasya—having placed; mantra-vit—the knower of mantra; ātmānam—the self; bhāskaram—as Bhāskara; dhyātvā—having meditated; paricāra-samanvitaḥ—accompanied by attendants."],"3":["He should perform the sweeping mudrā and the awakening of the directions, and likewise the purification of the ground in the netherworld and of the sky.","kuryāt—he should perform; sammārjanīm mudrām—the sweeping mudrā; diśām—of the directions; pratibodhanam—the awakening; pātāle—in the netherworld; bhū-śodhanam—purification of the ground; nabhasaḥ—of the sky; ca—and; tathā—in that way."],"4":["This is the procedure of worship, granting the desired things of all. This lotus is proclaimed by all the wise, O hero.","arcanasya—of worship; prakāraḥ—procedure; ayam—this; sarveṣām—for all; īpsita-pradaḥ—granting desired things; sarvaiḥ api—by all; budhaiḥ—wise ones; vīra—O hero; padmam—lotus; etat—this; prakīrtitam—declared."],"5":["He should draw an eight petalled lotus with its pericarp in a clean place. Then, having formed the invocation mudrā, he should invoke Ravi.","aṣṭa-patram—eight-petalled; likhet—he should draw; padmam—a lotus; śucau deśe—in a clean place; sa-karṇikam—with its pericarp; tataḥ—then; āvāhanīm mudrām—the invocation mudrā; baddhvā—having formed; āvāhayet—he should invoke; ravim—Ravi."],"6":["There he should bathe Khaṣolka, the form that produces desire. He should establish and also bathe the mantra bodied one with mantras.","khaṣolkam—Khaṣolka; snāpayet—he should bathe; tatra—there; svarūpam—the form; lobha-dāyakam—producing desire; sthāpayet—he should establish; snāpayet—and bathe; ca eva—also; mantraiḥ—with mantras; mantra-śarīriṇam—the one whose body is mantra."],"7":["A person should place the heart of the deity in the southeast, the head in the northeast, and the crest in the southwest.","āgneyyām—in the southeast; diśi—in the direction; devasya—of the deity; hṛdayam—the heart; sthāpayet—he should place; naraḥ—a person; aiśānyām—in the northeast; śiraḥ—the head; sthāpya—having placed; nairṛtyām—in the southwest; vinyaset—he should place; śikhām—the crest."],"8":["He should place the eyes in the east. He should be one pointed in heart. Having invoked, one should place the armour and also the weapon in the west.","paurandaryām—in Indra’s direction [the east]; nyaset—he should place; netre—the eyes; ekāgra-hṛdayaḥ—one whose mind is one-pointed; tu—and; saḥ—he; āvāhya—having invoked; ekam—one; kavacam—the armour; vāruṇyām—in the western direction; astram—the weapon; eva—also."],"9":["He should place Soma in the northeast, Lohita in the east, Somatapana in the southeast, and Bṛhaspati in the south.","aiśānyām—in the northeast; sthāpayet—he should place; somam—Soma; paurandaryām—in the east; tu—and; lohitaḥ—Lohita; āgneyyām—in the southeast; somatapanam—Somatapana; yāmyām—in the south; ca—and; bṛhaspatim—Bṛhaspati."],"10":["In the southwest he should place Śukra, the Dānava, in the west Śanaiścara, in the northwest Ketu, and in the north Rāhu.","nairṛtyām—in the southwest; dānavam—Dānava; śukram—Śukra; vāruṇyām—in the west; śanaiścaram—Śanaiścara; vāyavyām—in the northwest; ketum—Ketu; kauberyām—in the north; rāhum—Rāhu; eva—indeed."],"11":["In the second enclosure, one should place the twelve mighty Ādityas, born from the radiance of the gods and descended from Kaśyapa.","dvitīyāyām—in the second; kakṣāyām—in the enclosure; deva-tejaḥ-samudbhavān—born from the radiance of the gods; sthāpayet—he should place; dvādaśa-ādityān—the twelve Ādityas; kāśyapeyān—descendants of Kaśyapa; mahā-balān—mighty."],"12":["Bhaga, Sūrya, Yama, Mitra, Varuṇa, Savitṛ, Dhātṛ, and the mighty Vivasvat.","bhagaḥ—Bhaga; sūryaḥ—Sūrya; yamaḥ—Yama; mitraḥ—Mitra; varuṇaḥ—Varuṇa; savitā—Savitṛ; dhātā—Dhātṛ; vivasvān—Vivasvat; mahā-balaḥ—mighty."],"13":["Tvaṣṭṛ, Pūṣan, Rudra, and Viṣṇu are named as the twelfth. One should place Indra in the east, Yama in the south, Varuṇa in the west, Kubera in the north, Īśvara in the northeast, the deity of fire in the southeast, the deities of ancestors in the southwest, and Vāyu in the northwest. Jaya, Vijayā, Jayantī, Aparājitā, Śeṣa, Vāsuki, Revatī, Vināyaka, Mahāśvetā, Mahādevī, Rājñī, and Suvarcalā.","tvaṣṭā—Tvaṣṭṛ; pūṣā—Pūṣan; rudraḥ—Rudra; dvādaśaḥ—the twelfth; viṣṇuḥ—Viṣṇu; ucyate—is called; pūrve—in the east; indrāya—for Indra; dakṣiṇe—in the south; yamāya—for Yama; paścime—in the west; varuṇāya—for Varuṇa; uttare—in the north; kuberāya—for Kubera; aiśānyām—in the northeast; īśvarāya—for Īśvara; āgneyyām—in the southeast; agni-devatāyai—for the deity Agni; nairṛtyām—in the southwest; pitṛ-devebhyaḥ—for the ancestral deities; vāyavyām—in the northwest; vāyave—for Vāyu; jayā—Jayā; vijayā—Vijayā; jayantī—Jayantī; aparājitā—Aparājitā; śeṣaḥ—Śeṣa; vāsukiḥ—Vāsuki; revatī—Revatī; vināyakaḥ—Vināyaka; mahāśvetā—Mahāśvetā; mahādevī—Mahādevī; rājñī—Rājñī; suvarcalā—Suvarcalā."],"14":["Likewise another assembly of gods may be here and there. A celebrated yoga is also declared in the south.","tathā—likewise; anyaḥ—another; vā api—or even; devānām—of the gods; samūhaḥ—assembly; tatra tatra—here and there; yogaḥ—yoga; proktaḥ—declared; dakṣiṇe—in the south."],"15":["In the shining place in front, the knower should place Siddhi, Vṛddhi, the goddess Smṛti, Śrī, and Utpalamālinī.","purastāt—in front/east; bhāsura-sthāne—in the radiant place; sthāpanīyāḥ—to be placed; vijānatā—by the knower; siddhiḥ—Siddhi; vṛddhiḥ—Vṛddhi; smṛtiḥ—Smṛti; devī—the goddess; śrīḥ—Śrī; utpala-mālinī—Utpalamālinī."],"16":["On his own right side he should place Prajñāvatī, Kṣudhā, Hārītā, and Buddhi, worshipped everywhere, O hero.","sthāpyā—to be placed; sva-dakṣiṇe pārśve—on his own right side; loka-pūjyā—worshipped by the world; samantataḥ—everywhere; prājñāvatī—Prajñāvatī; kṣudhā—Kṣudhā; vīra—O hero; hārītā—Hārītā; buddhiḥ—Buddhi; eva—also."],"17":["Buddhimatī should always be placed by those desiring Śrī, or by Vivasvat. Ṛddhi, Visṛṣṭi, Paurṇamāsī, and Vibhāvarī should be placed on his own north side. These are the divine powers.","sthāpya—to be placed; buddhimatī—Buddhimatī; nityam—always; śrī-kāmaiḥ—by those desiring prosperity; vā—or; vivasvataḥ—of Vivasvat; ṛddhiḥ—Ṛddhi; visṛṣṭiḥ—Visṛṣṭi; paurṇamāsī—Paurṇamāsī; vibhāvarī—Vibhāvarī; svottare pārśve—on his own northern side; sthāpyāḥ—to be placed; iti—thus; etāḥ—these; deva-śaktayaḥ—divine powers."],"18":["A lamp, food, ornaments, clothing, and flowers should be given by mantra to the god of gods, with attendants and embodied form.","dīpaḥ—a lamp; annam—food; alaṃkāraḥ—ornament; vāsaḥ—clothing; puṣpāṇi—flowers; mantrataḥ—with mantra; deyāni—are to be given; deva-devāya—to the Lord of gods; sa-anugāya—with his attendants; sa-mūrtaye—to his embodied form."],"19":["Whoever always worships Bhāskara by this procedure, having attained the highest desires, then goes to the abode of Bhānu.","vidhinā anena—by this procedure; satatam—always; sadā—continually; yaḥ—whoever; arcayati—worships; bhāskaram—Bhāskara; samprāpya—having obtained; paramān kāmān—the highest desires; tataḥ—then; bhānu-sadam—to the abode of Bhānu; vrajet—he goes."],"20":["O king, whoever offers food to Bhāskara by this procedure should say, You are neem, bitter in nature, and the abode of Āditya. You remove all disease, be peaceful, and always be my food.","anena vidhinā—by this procedure; yaḥ—whoever; bhojayet—offers food; bhāskaram—to Bhāskara; nṛpa—O king; tvam—you; nimbaḥ—neem; kaṭuka-ātmā asi—are of a bitter nature; āditya-nilayaḥ—the abode of Āditya; sarva-roga-haraḥ—destroyer of all diseases; śāntaḥ—peaceful; bhava—be; me—for me; prāśanam—food to be eaten; sadā—always."],"21":["Having eaten thus, he should recite on the ground before the deity, O king. Having fed the Brāhmaṇas, he should then give the dakṣiṇā according to his means.","ittham—thus; prāśya—having eaten; japet—he should recite; bhūmau—on the ground; devasya purataḥ—in front of the deity; nṛpa—O king; brāhmaṇān—the Brāhmaṇas; bhojayitvā—having fed; śaktyā—according to his means; dakṣiṇām—a gift; dattvā—having given."],"22":["Afterwards, with speech restrained, he should eat sweet food without salt. This Saptamī is to be performed for one year.","bhuñjīta—he should eat; vāg-yataḥ—with speech restrained; paścāt—afterwards; madhuram—sweet; kṣāra-varjitam—free from salt; iti—thus; eṣā—this; varṣa-paryantam—for a year; kartavyā—is to be performed; ca eva—and indeed; saptamī—Saptamī."],"23":["One who performs this Saptamī is released from all diseases. Freed from all disease, he goes to the world of the Sun.","kurvāṇaḥ—observing; saptamīm—Saptamī; etām—this; sarva-rogaiḥ—from all diseases; pramucyate—is released; sarva-roga-vinirmuktaḥ—freed from every disease; sūrya-lokam—to the world of the Sun; saḥ—he; gacchati—goes."],"24":["Sumantu said, Then in the month of Bhādrapada, in the bright fortnight, O king, having fasted on Saptamī, one should worship Ravi according to rule.","sumantuḥ uvāca—Sumantu said; atha—then; bhādrapade māsi—in the month of Bhādrapada; site pakṣe—in the bright fortnight; mahīpate—O king; kṛtvā upavāsam—having fasted; saptamyām—on the seventh day; vidhi-vat—properly; pūjayet—one should worship; ravim—Ravi."],"25":["Here one should worship Bhāskara by the procedure of Maheśvara. On the eighth day, having bathed again, one should worship Divākara.","māheśvareṇa vidhinā—by the procedure of Maheśvara; pūjayet—one should worship; atra—here; bhāskaram—Bhāskara; aṣṭamyām—on the eighth day; punaḥ—again; snātaḥ—having bathed; pūjayitvā—having worshipped; divākaram—Divākara."],"26":["He should give fruits to the Vipras, saying May Mārtāṇḍa be pleased, dates, coconuts, and citron fruits.","dadyāt—he should give; phalāni—fruits; viprebhyaḥ—to the Brāhmaṇas; mārtaṇḍaḥ prīyatām—May Mārtāṇḍa be pleased; kharjūram—dates; nālikeram—coconut; mātuliṅga-phalāni—citron fruits; ca—and."],"27":["Having also offered mango fruits before the deity, thus the fruit of Saptamī has been told to you from the beginning, O king.","devasya purataḥ—in front of the deity; dattvā—having given; tathā—and also; āmra-phalāni—mango fruits; ca—and; iti—thus; te—to you; kathitam—told; rājan—O king; saptamī-phalam—the fruit of Saptamī; āditaḥ—from the beginning."],"28":["This great and most excellent austerity of Bhāskara, hearing which a person is freed from Brahmahatyā, O lord of men.","mahā-tapaḥ—great austerity; mahā-śreṣṭham—most excellent; bhāskarasya—of Bhāskara; viśām-pate—O lord of people; yat—which; śrutvā—having heard; mānavaḥ—a person; rājan—O king; mucyate—is released; brahma-hatyayā—from Brahmin-slaying."],"29":["Likewise, this supreme festival called Brahma, hearing which people are freed from all sins, O king.","tathā—likewise; idam—this; paramam—supreme; parva—observance; kathitam—declared; brahma-saṃjñitam—called Brahma; yat—which; śrutvā—having heard; sarva-pāpebhyaḥ—from all sins; mucyante—are released; mānavāḥ—people; nṛpa—O king."],"30":["A person obtains the whole fruit of a thousand Aśvamedhas, a hundred Vājapeyas, visiting all tīrthas, studying the Veda, and giving the earth.","aśvamedha-sahasrasya—of a thousand Aśvamedhas; vājapeya-śatasya—of a hundred Vājapeyas; sarva-tīrtha-abhigamane—visiting all tīrthas; veda-abhyāse—in studying the Vedas; yat phalam—the fruit that is; pṛthivī-dāne—in giving the earth; tat sarvam—all that; prāpnuyāt—one obtains; naraḥ—a person."],"31":["A person obtains the fruit of a thousand Rājasūyas, a hundred Vājapeyas, and a hundred thousand gifts.","rāja-sūya-sahasrasya—of a thousand Rājasūyas; vājapeya-śatasya—of a hundred Vājapeyas; sahasra-śata-dānasya—of a hundred thousand gifts; phalam—the fruit; vindati—obtains; mānavaḥ—a person."],"32":["A Brāhmaṇa goes to the state of a scribe, a Kṣatriya reaches Brāhmaṇa status, a Vaiśya goes to Kṣatriya status, and a Śūdra to Vaiśya status.","lekhatvam—the status of a scribe; brāhmaṇaḥ—a Brāhmaṇa; gacchet—attains; kṣatriyaḥ—a Kṣatriya; vipratām—the status of a Brāhmaṇa; vrajet—attains; vaiśyaḥ—a Vaiśya; api—also; kṣatratām—the status of a Kṣatriya; yāti—attains; śūdraḥ—a Śūdra; vaiśyatvam—the status of a Vaiśya; eva—indeed."],"33":["Sūtas, Māgadhas, bards, and others born from mixed unions also go to the highest state by hearing the Purāṇa, O lord.","sūta-māgadha-bandya-ādyāḥ—Sūtas, Māgadhas, panegyrists, and others; ye—who; ca—and; anye—others; saṃkara-udbhavāḥ—born of mixed unions; te—they; api—even; yānti—go; uttamam sthānam—to the highest state; purāṇa-śravaṇāt—through hearing the Purāṇa; vibho—O lord."],"34":["Among people there is no purifier other than Itihāsa and Purāṇa. By hearing them alone one is released from all sins.","itihāsa-purāṇābhyām—than Itihāsa and Purāṇa; na—not; anyat—anything else; pāvanam—purifying; nṛṇām—for people; yeṣām—of which; śravaṇa-mātreṇa—by merely hearing; mucyate—one is released; sarva-kilbiṣaiḥ—from every sin."],"35":["The fruit of those who hear according to the rule is indeed as stated, O tiger among kings. There is no doubt about this, and the same is for those who recite, O lord of men.","vidhinā—according to the rule; rāja-śārdūla—O tiger among kings; śṛṇvatām—of those hearing; yat phalam—the fruit which; kila—indeed; yathā-uktam—as stated; na—not; atra—here; saṃdehaḥ—doubt; paṭhatām—of those reciting; ca—and; viśām-pate—O lord of people."],"36":["Śatānīka said, O Lord, by what rule should people hear the Bhārata, the deeds of Rāmabhadra, and especially the Purāṇas.","śatānīkaḥ uvāca—Śatānīka said; bhagavan—O lord; kena vidhinā—by what rule; śrotavyam—is to be heard; bhāratam—the Bhārata; naraiḥ—by people; caritam—the deeds; rāma-bhadrasya—of Rāmabhadra; purāṇāni—the Purāṇas; viśeṣataḥ—especially."],"37":["How should the Vaiṣṇava dharmas, all the Śaiva dharmas, and also those of the Sauras be heard. Tell me the rule for hearing, O best of Brāhmaṇas.","katham—how; vaiṣṇavāḥ dharmāḥ—the Vaiṣṇava duties; śiva-dharmāḥ—the Śaiva duties; aśeṣataḥ—entirely; saurāṇām—of the Sauras; ca api—and also; vipra-indra—O best of Brāhmaṇas; ucyatām—let it be told; śravaṇe—for hearing; vidhiḥ—the rule."],"38":["How should it be recited, O best of the twice born. Tell me the characteristics of this great reciter.","vācanīyam—to be recited; katham—how; ca api—and also; vācakaḥ—the reciter; dvija-sattama—O best of the twice-born; lakṣaṇam—the characteristics; ca—and; asya—of this; me—to me; brūhi—tell; vācakasya—of the reciter; mahātmanaḥ—great-souled."],"39":["Tell me his form and the form of the great Khaṣolka. What fruit arises when the reciter is properly honoured, O twice born.","svarūpam—the nature; ca—and; asya—of him; me—to me; brūhi—tell; khaṣolkasya—of Khaṣolka; mahātmanaḥ—great; phalam—the fruit; ca—and; pūjite—when honoured; kim—what; syāt—arises; vācake—for the reciter; vidhi-vat—properly; dvija—O twice-born."],"40":["How should listeners honour the reciter at each pāraṇa. At the completion of each parvan, what should be given to the reciter, and what should be done for success at each parvan.","pāraṇe pāraṇe—at each completion of the fast; pūjyaḥ—to be honoured; vācakaḥ—the reciter; śrāvakaiḥ—by listeners; katham—how; samāpte—when completed; bhagavan—O lord; kiṃ kiṃ—what things; deyam—are to be given; parvaṇi—at the observance; vācake—to the reciter; na ca—and also; kim—what; kārya-siddham—brings success in the undertaking; yat—which; siddham—is accomplished; parvaṇi parvaṇi—at each observance."],"41":["Sumantu said, You have asked well, O king, concerning Itihāsa and Purāṇa.","sumantuḥ uvāca—Sumantu said; samyak—well; pṛṣṭaḥ—asked; asmi—I am; rājendra—O king; itihāsa-purāṇayoḥ—about Itihāsa and Purāṇa."],"42":["O mighty armed one, hear from me the rule for hearing that was formerly spoken, when asked, by the blessed teacher Viriñci of great radiance.","śravaṇe—for hearing; tu—indeed; mahā-bāho—O mighty-armed one; śrūyatām—let it be heard; yat—which; mayā—by me; purā—formerly; pṛṣṭaḥ—being asked; uvāca—spoke; mahā-tejāḥ—greatly radiant; viriñciḥ—Viriñci; bhagavān—the Lord; guruḥ—the teacher."],"43":["Now I shall tell you this rule for hearing the Purāṇa. Having heard Itihāsa and Purāṇas with devotion, especially, one is freed from all sins, including Brahmahatyā, O Lord.","hanta—now; te—to you; kathayāmi—I shall tell; eṣaḥ—this; purāṇa-śravaṇe—for hearing the Purāṇa; vidhiḥ—rule; itihāsa-purāṇāni—Itihāsa and Purāṇas; śrutvā—having heard; bhaktyā—with devotion; viśeṣataḥ—especially; mucyate—one is released; sarva-pāpebhyaḥ—from all sins; brahma-hatyā-ādibhiḥ—from those beginning with Brahmin-slaying; vibho—O lord."],"44":["Whoever hears in the evening, morning, and night, having become pure, pleases Viṣṇu, Brahmā, and Śaṅkara.","sāyam—in the evening; prātaḥ—in the morning; tathā—and; rātrau—at night; śuciḥ—pure; bhūtvā—having become; śṛṇoti—hears; yaḥ—whoever; tasya—of him; viṣṇuḥ—Viṣṇu; tathā—and; brahmā—Brahmā; tuṣyate—is pleased; śaṅkaraḥ—Śaṅkara; tathā—also."],"45":["At dawn Lord Brahmā is pleased, at the end of the day Hari is pleased, and at night the mighty Mahādeva is pleased with those who hear. Some perform the pāraṇa in ten day periods.","pratyūṣe—at dawn; bhagavān brahmā—Lord Brahmā; dina-ante—at day’s end; tuṣyate—is pleased; hariḥ—Hari; mahādevaḥ—Mahādeva; rātrau—at night; śṛṇvatām—of those who hear; tuṣyate—is pleased; vibhuḥ—the mighty one; pāraṇāni—the completions of the fast; daśa-aheṣu—on the tenth days; eke—some; kurvanti—perform; tāni—them; bhoḥ—O."],"46":["O tiger among kings, hear the fruit of those who listen, and the rule here for the reciter and the listeners, O lord of people.","bhavet—there is; vai—indeed; rāja-śārdūla—O tiger among kings; śṛṇu—hear; teṣām—of them; ca—and; yat phalam—what fruit; vidhānam—the rule; vācakasya—for the reciter; iha—here; śṛṇvatām—and for those listening; viśām-pate—O lord of people."],"47":["Having put on clean clothes, one should come from home to a place appointed for the occasion. Then, having circumambulated, one should remain there before the deity.","śuddha-vāsāḥ—wearing clean clothes; gṛhāt— from home; etya—having come; sthānam—to the place; yat—which; samaya-anvitam—appointed for the occasion; pradakṣiṇam—circumambulation; tataḥ—then; gatvā—having gone; yasmin—in which; tatra—there; devaḥ—the deity; eva—indeed."],"48":["Then he should take a seat that is neither too high nor too low. O king, that should always be the seat of the instructor.","na—not; ati-uccham—too high; na—not; ati-nīcam—too low; ca—and; āsanam—a seat; bhajate—he takes; tataḥ—then; āsanam—the seat; tasya—of him; vai—indeed; rājan—O king; bodhakasya—of the instructor; sadā—always; bhavet—should be."],"49":["O joy of the Kurus, the listeners should bow to and worship it. It is called the Vyāsa seat, the seat of the teacher.","vandanīyam—to be saluted; prapūjya—having worshipped; ca—and; śrotṛbhiḥ—by listeners; kuru-nandana—O joy of the Kurus; vyāsa-pīṭham—the seat of Vyāsa; tat—that; proktam—is called; guroḥ—of the teacher; āsanam—the seat; ādiśet—one should declare."],"50":["Listeners should not sit on the seat of the reciter, O king, just as servants do not sit on the seat of a king, nor sons on the seat of their father.","na—not; sthēyam—to be sat upon; śrāvakaiḥ—by listeners; tasmāt—therefore; vācakasya-āsane—on the reciter’s seat; nṛpa—O king; rāja-āsane—on the king’s seat; yathā—as; bhṛtyaiḥ—by servants; yathā—as; putraiḥ—by sons; pituḥ—of the father; nṛpa—O king."],"51":["As a child regards the teacher, O hero, so he is considered their teacher. Having first worshipped the gods, and especially the Brāhmaṇas,","yathā—as; śiśuḥ—a child; guroḥ—of the teacher; vīra—O hero; saḥ—he; teṣām—for them; hi—indeed; guruḥ—teacher; mataḥ—is considered; deva-arcām—the images of the gods; agrataḥ—first; kṛtvā—having done; brāhmaṇa-arcām—the worship of Brāhmaṇas; viśeṣataḥ—especially."],"52":["Then the listener should sit and hear, O king. Having gathered all who have arrived, he should take up the book.","upa-viśya—having sat down; tataḥ—then; paścāt—afterwards; śrāvakaḥ—the listener; śṛṇuyāt—should hear; nṛpa—O king; samastān—all; āgatān—arrived; kṛtvā—having gathered; tataḥ—then; pustakam—the book; ādadet—he should take."],"53":["Having bowed his head to the book, O lord of people, the reciter should loosen its knot. Having released the thread, he should bind it again and recite.","praṇamya—having bowed; śirasā—with the head; tasya—its; pustakasya—book; viśām-pate—O lord of people; granthim—the knot; ca—and; śithilām—loose; kuryāt—he should make; vācakaḥ—the reciter; kuru-nandana—O joy of the Kurus; punaḥ—again; badhnīta—he should bind; tat sūtram—that thread; tat—that; muktvā—having opened; vācayet—he should recite; kvacit—at some point."],"54":["One should know the book to be threefold. The thread is called Vāsuki, the leaves are Lord Brahmā, and the letters are Janārdana.","tri-vidham—threefold; pustakam—the book; vidyāt—one should know; sūtram—the thread; vāsukiḥ—Vāsuki; ucyate—is called; patrāṇi—the leaves; bhagavān brahmā—Lord Brahmā; akṣarāṇi—the letters; janārdanaḥ—Janārdana."],"55":["Śaṅkara is also the thread, the lines are all the deities, and fire is in the thread. Bhānu is established in the middle.","śaṅkaraḥ—Śaṅkara; tathā—and; sūtram—the thread; paṅktayaḥ—the lines; sarva-devatāḥ—all the deities; pāvakaḥ—fire; ca—and; tathā—also; sūtre—in the thread; madhye—in the middle; bhānuḥ—the Sun; samāśritaḥ—is established."],"56":["All the planets stand in front, and likewise the directions, O Lord. Meru is always remembered as the pin, and the hole is called the sky.","agre—in front; sthitāḥ—standing; grahāḥ—the planets; sarve—all; diśaḥ—the directions; vā—or; api—also; tathā—likewise; vibho—O mighty one; smṛtaḥ—is remembered; meruḥ—Meru; sadā—always; śaṅkuḥ—the pin; chidram—the hole; ākāśam—the sky; ucyate—is called."],"57":["The two wooden pieces, below and above, are declared to be Heaven and Earth. The śaṅkha is likewise declared to be the Moon.","yantra-dvayam—the pair of supports; kāṣṭha-mayam—made of wood; adhaḥ—below; ūrdhvam—above; yat—which; udāhṛtam—is described; dyāvā-pṛthivyoḥ—of heaven and earth; śaṅkhaḥ—the śaṅkha; tathā—and; candraḥ—the Moon; udāhṛtaḥ—is declared."],"58":["Thus this book is made of deities and worshipped by the gods. It is to be saluted and worshipped, and placed in the house for prosperity.","ittham—thus; deva-mayam—made of deities; hi—indeed; etat—this; pustakam—book; deva-pūjitam—worshipped by the gods; namasyam—to be saluted; pūjanīyam—to be worshipped; ca—and; gṛhe—in the house; sthāpyam—to be placed; vibhūtaye—for prosperity."],"59":["Whoever, being an excellent man, makes its thread long and offers it goes to the supreme abode where the Sun god is.","yaḥ—whoever; asya—of this; sūtram—the thread; bṛhat—long; kṛtvā—having made; prayacchati—offers; nara-uttamaḥ—excellent person; saḥ—he; yāti—goes; paramam sthānam—to the supreme abode; yatra—where; devaḥ—the god; divākaraḥ—the Sun."],"60":["Having prepared the vessel and taken it in both hands, O king, the reciter should bow his head to all, to Brahmā and the others, and to Vyāsa, Vālmīki, Vidhi, Viṣṇu, Śiva, and Ravi.","nirūpya—having prepared; pātram—the vessel; rājendra—O king; karābhyām—with both hands; gṛhya—having taken; vācakaḥ—the reciter; praṇamya—having bowed; śirasā—with the head; sarvān—to all; brahma-ādīn—beginning with Brahmā; vyāsam—Vyāsa; vālmīkim—Vālmīki; vidhim—Vidhi; viṣṇum—Viṣṇu; śivam—Śiva; ravim—Ravi."],"61":["Then, having recited their salutation, the reciter should address the Vipras with devotion, O joy of the Kurus.","namaskāram—salutation; atha—then; eṣām—of these; tu—indeed; paṭhitvā—having recited; kuru-nandana—O joy of the Kurus; tataḥ—then; asau—he; vyāharet—should address; viprān—the Brāhmaṇas; vācakaḥ—the reciter; śraddhayā anvitah—endowed with reverence."],"62":["Uninterrupted, steady, wondrous, heroic, powerful, with joined syllables and words, endowed with rasa and bhāva.","alambitam—unbroken; ataḥ—then; stabdham—steady; adbhutam—wondrous; vīram—bold; ūrjitam—forceful; asaṃsakta—connected; akṣara-padam—syllables and words; rasa-bhāva-samanvitam—endowed with rasa and bhāva."],"63":["The reciter should speak with the seven notes, displaying all the rasas at their proper times, O lord of people.","sapta-svara-samāyuktam—joined with seven notes; kāle kāle—at the proper times; viśām-pate—O lord of people; pradarśayan—displaying; rasān—all rasas; sarvān—all; vācakaḥ—the reciter; vyāharet—should speak; nṛpa—O king."],"64":["Having heard Itihāsa, Purāṇas, and the deeds of Rāma from such a Brāhmaṇa reciter with reverence,","īdṛśāt—from such; vācakāt—from a reciter; viprāt—from a Brāhmaṇa; śrutvā—having heard; śraddhā-samanvitaḥ—endowed with reverence; itihāsa-purāṇāni—Itihāsa and Purāṇas; rāmasya—of Rāma; caritam—the deeds; tathā—and."],"65":["A listener abiding by the rule and pure should hear and obtain the fruit. A Brāhmaṇa, Kṣatriya, Vaiśya, and especially Śūdra,","niyama-sthaḥ—observing the rule; śuciḥ—pure; śrotā—the listener; śṛṇuyāt—should hear; phalam—the fruit; aśnute—obtains; brāhmaṇaḥ—Brāhmaṇa; kṣatriyaḥ—Kṣatriya; vaiśyaḥ—Vaiśya; śūdraḥ—Śūdra; ca api—and also; viśeṣataḥ—especially."],"66":["Obtains the fruit of the Aśvamedha, all desires, freedom from every disease, and great merit, and may go to the excellent supreme abode of the deity.","aśvamedham—the Aśvamedha; avāpnoti—obtains; sarvān kāmān—all desires; avāpnoti—obtains; rogaiḥ—from diseases; ca—and; mucyate—is released; sarvaiḥ—from all; mahat puṇyam—great merit; ca—and; vindati—gains; gacchet—may go; vā—or; paramam sthānam—to the supreme abode; devasya—of the deity; adbhutam—wondrous; uttamam—excellent."],"67":["Having bathed and gathered at the house of the reciter, the listeners should bow their heads to the Brāhmaṇa reciter with reverence, O king.","snātaiḥ—having bathed; gṛham—to the house; samāgamya—having come together; śrotṛbhiḥ—by the listeners; vācakasya—of the reciter; praṇamya—having bowed; śirasā—with the head; vipram—the Brāhmaṇa; vācakam—the reciter; śraddhayā—with reverence; nṛpa—O king."],"68":["Taking their seats, they should remain facing the reciter, O tiger among kings, with speech restrained and minds composed.","āsanam—a seat; samāśritya—having taken; sthātavyam—they should remain; vācakasya—of the reciter; tu—indeed; saṃmukham—facing; rāja-śārdūla—O tiger among kings; vāg-yataiḥ—with speech restrained; su-samāhitaiḥ—with composed minds."],"69":["When the reciter has offered salutation to Vyāsa, the listeners should not speak, O mighty armed one, except when they have a question.","vācakena—by the reciter; namaskāre—when salutation is made; kṛte—done; vyāsasya—to Vyāsa; bhūpate—O king; na—not; vaktavyam—to be spoken; mahā-bāho—O mighty-armed one; śrāvakaiḥ—by listeners; saṃśayāt ṛte—except for a question."],"70":["When there is a question, the reciter should be asked after being respectfully approached, for he is their teacher and is called a relative according to dharma.","saṃśaye—when there is a question; sati—being; praṣṭavyaḥ—to be asked; vācakaḥ—the reciter; saṃprasādya—having respectfully approached; yataḥ—for; saḥ—he; teṣām—their; guruḥ—teacher; dharmataḥ—according to dharma; bandhuḥ—relative; ucyate—is called."],"71":["The reciter too should speak what is for their understanding, for all teachers are for the benefit of everyone, O king.","vācakena—by the reciter; api—also; vaktavyam—to be spoken; yat—that which; syāt—may be; teṣām—for them; nibodhanam—understanding; anugrahāya—for the benefit; sarveṣām—of all; aśeṣāḥ—all; guravaḥ—teachers; nṛpa—O king."],"72":["Salutations and the rest are to be heard, and one should say, May there be auspiciousness. All the varṇas should be restrained in speech, O lord of the earth.","namaskārādayaḥ—greetings and the like; śrāvyāḥ—to be heard; śivam astu—may there be auspiciousness; iti—thus; vodyate—is spoken; vāg-yataiḥ—with speech restrained; nṛpa-śārdūla—O tiger among kings; varṇaiḥ—by the varṇas; sarvaiḥ—all; mahī-pate—O lord of the earth."],"73":["Vaiśyas should be in front of Śūdras, and Kṣatriyas in front of Vaiśyas. The reciter should speak standing among them all, and men born of mixed unions should be behind the Śūdras, O king.","śūdrāṇām—in front of the Śūdras; purataḥ—in front; vaiśyāḥ—the Vaiśyas; vaiśyānām—in front of the Vaiśyas; kṣatriṇaḥ—the Kṣatriyas; madhya-sthitaḥ—standing in the middle; atha—then; sarveṣām—of all; vācakaḥ—the reciter; vyāharet—should speak; ye—those; saṃkara-jāḥ—born of mixed unions; narāḥ—men; te—they; śūdra-pṛṣṭhataḥ—behind the Śūdras."],"74":["One should regard a Brāhmaṇa as the reciter and honour no one born of another varṇa. Hearing the speech of a reciter born of another varṇa, one goes to Naraka.","brāhmaṇam—a Brāhmaṇa; vācakam—as reciter; vidyāt—one should know; na—not; anya-varṇajam—born in another varṇa; ādadīta—one should honour; śrutvā—having heard; anya-varṇajāt—from one born in another varṇa; vācam—speech; vācakāt—from a reciter; narakam—to Naraka; vrajet—one goes."],"75":["Thus, as those varṇas hear in proper order, a pāraṇa should take place each month, O king, O joy of the Kurus.","ittham—thus; śṛṇvatām—of those hearing; teṣām—of them; varṇānām—of the varṇas; anupūrvaśaḥ—in proper order; māsi māsi—each month; bhavet—should take place; rājan—O king; pāraṇam—the completion of the fast; kuru-nandana—O joy of the Kurus."],"76":["For his own welfare, a wise person should honour the reciter, O king. When a month is complete, one māṣa of gold should be given to the best of the twice born.","śreyaḥ-artham—for welfare; ātmanaḥ—of oneself; rājan—O king; pūjayet—should honour; vācakam—the reciter; budhaḥ—a wise person; māsi pūrṇe—when the month is complete; dvija-śreṣṭhe—to the excellent twice-born; dātavyam—is to be given; svarṇa-māṣakam—one māṣa of gold."],"77":["A Brāhmaṇa should give one, a Kṣatriya two, and a Vaiśya three to the reciter, O best of the twice born, O mighty armed one.","brāhmaṇena—by a Brāhmaṇa; ekaḥ—one; deyaḥ—is to be given; kṣatriyasya—by a Kṣatriya; dve—two; vācakāya—to the reciter; dvija-śreṣṭha—O excellent twice-born; vaiśyena—by a Vaiśya; api—also; trayam—three; tathā—likewise."],"78":["A Śūdra should give four gold māṣas to the reciter each month with reverence, O best of the twice born.","śūdreṇa—by a Śūdra; eva—indeed; catvāraḥ—four; dātavyāḥ—are to be given; svarṇa-māṣakāḥ—gold māṣas; māsi māsi—each month; dvija-śreṣṭha—O best of the twice-born; śraddhayā—with reverence; vācakāya—to the reciter."],"79":["At the first pāraṇa, a person who honours the reciter according to his means obtains the fruit of the Agniṣṭoma sacrifice.","prathame—in the first; pāraṇe—pāraṇa; rājan—O king; vācakam—the reciter; pūjya—having honoured; śaktitaḥ—according to one’s means; agniṣṭomasya—of the Agniṣṭoma; yajñasya—sacrifice; phalam—the fruit; vindati—obtains; mānavaḥ—a person."],"80":["Beginning with Kārttika and continuing until Kārttika, O Acyuta, whoever performs the Agniṣṭoma, Gosava, and Jyotiṣṭoma sacrifices, O king,","kārtika-ādīn—beginning with Kārttika; samārabhya—beginning; yāvat—until; kārttikam—Kārttika; acyuta—O Acyuta; agniṣṭomam—the Agniṣṭoma; gosavam—the Gosava; jyotiṣṭomam—the Jyotiṣṭoma; tathā—also; nṛpa—O king."],"81":["And the Sautrāmaṇi, Vājapeya, Vaiṣṇava, Māheśvara, Brāhma, and Puṇḍarīka sacrifices, O Lord,","sautrāmaṇim—the Sautrāmaṇi; vājapeyam—the Vājapeya; vaiṣṇavam—the Vaiṣṇava; ca—and; tathā—also; vibho—O lord; māheśvaram—the Māheśvara; brāhmam—the Brāhma; puṇḍarīkam—the Puṇḍarīka; yajeta—one should perform."],"82":["Obtains in due order over twelve months the fruit of the Āditya sacrifice, the Rājasūya, and the Aśvamedha, O king. Having obtained these fruits of sacrifice, he goes to the highest worlds.","āditya-yajñasya—of the Āditya sacrifice; tathā—and; rājasūya-aśvamedhayoḥ—of the Rājasūya and Aśvamedha; phalam—the fruit; prāpnoti—obtains; rājendra—O king; māsaiḥ—by months; dvādaśabhiḥ—twelve; kramāt—in due order; yajña-phalam—the fruit of sacrifice; prāpya—having obtained; yāti—one goes; lokān—to worlds; tathā—and; uttamān—highest."],"83":["Having mounted a vehicle furnished with a diamond altar and adorned with gems and jewels, O king, one rejoices in the abode of Śakra.","vajra-vedikā-sampannam—furnished with a diamond altar; maṇi-ratna-vibhūṣitam—adorned with gems and jewels; vimānam—a vehicle; āsthitaḥ—having mounted; rājan—O king; modate—rejoices; śakra-mandire—in Śakra’s abode."],"84":["Then one goes to the abode of the Moon, then to the abode of Varuṇa. Having gone to the house of Śociṣkeśa, one goes to the house of Cailavila.","tataḥ—then; candrasya—of the Moon; bhavane—to the abode; vāruṇe—to Varuṇa’s; bhavane—to abode; tataḥ—then; śociṣkeśa-gṛhe—to the house of Śociṣkeśa; gatvā—having gone; gacchet—one goes; cailavila-gṛhe—to the house of Cailavila."],"85":["Having gone to the house of Dhiṣaṇa, then to Citraśikhaṇḍin, and having reached Vṛddhaśravas, one goes to the temple of the lotus born. Thus it is, O best of kings, no doubt should be made here.","dhiṣaṇasya—of Dhiṣaṇa; gṛham—the house; gatvā—having gone; tataḥ—then; citraśikhaṇḍinaḥ—of Citraśikhaṇḍin; vṛddhaśravasam—Vṛddhaśravas; āsādya—having reached; gacchet—one goes; kaṃjaja-mandire—to the abode of the lotus-born; evam eva—just so; nṛpa-śreṣṭha—O best of kings; na—not; vicāraṇā—doubt."],"86":["This fruit has been declared for people who hear continually. O king, one who hears according to rule obtains this fruit in a year.","phalam—the fruit; etat—this; samuddiṣṭam—declared; śṛṇvatām—for those who hear; satatam—continually; nṛṇām—of people; etat phalam—this fruit; vatsareṇa—in a year; śṛṇvataḥ—of one hearing; vidhitaḥ—according to rule; nṛpa—O king."],"87":["These measures arise in a year for those who hear, O tiger among kings, and give to the reciter.","etāni—these; parimāṇāni—measures; vatsareṇa—in a year; bhavanti—arise; vai—indeed; śṛṇvatām—for those hearing; nṛpa-śārdūla—O tiger among kings; dadatām—and giving; vācakāya—to the reciter; vai—indeed."],"88":["One, two, three, and four should be given here to the reciter each month, O lord of men.","ekam—one; ca—and; dve—two; tathā—and; trīṇi—three; catvāri—four; ca—and; viśām-pate—O lord of people; deyāni—are to be given; vācakāya—to the reciter; iha—here; māsi māsi—each month; nara-adhipa—O lord of men."],"89":["O best of kings, at the completion of the observance the reciter should again be honoured by the Brāhmaṇas and the rest according to the divisions of all the varṇas.","brāhmaṇa-ādyaiḥ—beginning with Brāhmaṇas; nṛpa-śreṣṭha—O excellent king; sarva-varṇa-vibhāgaśaḥ—according to the divisions of all varṇas; samāpte—when completed; parvaṇi—at the observance; tathā—also; vācakam—the reciter; pūjayet—should honour; punaḥ—again."],"90":["He should honour the Brāhmaṇa reciter with every desired thing, with divine perfumes and garlands, and with various garments.","vācakam—the reciter; brāhmaṇam—the Brāhmaṇa; ca—and; eva—indeed; sarva-kāmaiḥ—with all desired things; prapūjayet—should honour; gandha-mālya-ādibhiḥ—with perfumes, garlands, and the like; divyaiḥ—divine; vā—or; śobhiḥ—with splendid; vividhaiḥ—various; api—also."],"91":["Having given gold, silver, gold ornaments, cows, and bronze milking vessels to the reciter, one should then honour the Vipras.","vācakāya—to the reciter; pradattvā—having given; tu—indeed; tataḥ—then; viprān—the Brāhmaṇas; prapūjayet—one should honour; hiraṇyam—gold; rajatam—silver; rukmam—gold ornaments; gāḥ—cows; ca—and; kāṃsya-upadohanāḥ—bronze milking vessels."],"92":["By giving to the reciter here one obtains the fruit of what was heard. Just as food with dakṣiṇā is proclaimed at śrāddha time, so what is heard is declared to be with dakṣiṇā, O best of kings.","dattvā—having given; vācakāya—to the reciter; iha—here; tataḥ—then; śrutasya—of what was heard; prāpyate—is obtained; phalam—the fruit; yathā—as; sa-dakṣiṇam—with a gift; annam—food; śrāddha-kāle—at śrāddha; prakīrtitam—is declared; tathā—likewise; śrutam—hearing; nṛpa-śreṣṭha—O excellent king; sa-dakṣiṇam—with a gift; udāhṛtam—is stated."],"93":["One should honour the reciter, then honour the scribe. When the observance is complete, O Lord, one should especially honour him.","vācakam—the reciter; pūjayet—one should honour; yasmāt—because; paścāt—afterwards; lekhaka-pūjanam—honouring the scribe; samāpte—when completed; parvaṇi—at the observance; vibho—O lord; viśeṣeṇa—especially; eva—indeed; ca—and; arcayet—one should worship."],"94":["He by whom the reciter is honoured has honoured the deities. When the reciter is pleased, my supreme pleasure arises.","vācakaḥ—the reciter; pūjitaḥ—honoured; yena—by whom; pūjitāḥ—honoured; tena—by him; devatāḥ—the deities; vācake—when the reciter; parituṣṭe—is fully pleased; ca—and; mama—my; prītiḥ—pleasure; anuttamā—supreme."],"95":{"omit":true},"96":["The śāstras abide on the tip of whose tongue, and the range of whose knowledge is seen, O king of the earth. Which twice born is equal to him, dear one.","iti—thus; vedhāḥ—Brahmā; sadā—always; prāha—spoke; devānām purataḥ—in the presence of the gods; purā—of old; tasmin tuṣṭe—when he is pleased; jagat sarvam—the whole world; tuṣṭam—pleased; bhavati—becomes; nityaśaḥ—always; tasmāt—therefore; prapūjayet—one should honour; vipram—the Brāhmaṇa; vācakam—the reciter; nṛpa-sattama—O excellent king; na tulyaṃ—there is no equal; vācakena—to the reciter; iha—here; pātra-dānasya—of a gift to a worthy recipient; vidyate—is found."],"97":["There is no recipient equal to him on earth among men. Therefore the wise know that food should always first be given to him. When a Brāhmaṇa reciter eats at a śrāddha with faith, the ancestors of that person remain satisfied for a hundred years, O king.","tiṣṭhanti—remain; yasya—whose; śāstrāṇi—scriptures; jihvā-agre—on the tip of the tongue; pṛthivī-pate—O lord of the earth; dṛṣṭaḥ—seen; ca—and; gocaraḥ—range; tāta—dear one; kaḥ—who; tena—than him; sadṛśaḥ—equal; dvijaḥ—twice-born."],"98":["As Bhāskara is remembered as the foremost among all the gods here, likewise the recitation should be clear, wondrous, peaceful, with distinct syllables and words, joined with a melodious voice, rasa, and bhāva.","na—not; tulyaṃ—equal; vidyate—is found; tena—to him; bhuvi—on earth; pātram—a worthy recipient; nareṣu—among people; vai—indeed; tasmāt—therefore; annam—food; sadā—always; pūrvam—first; tasmai—to him; deyam—is to be given; viduḥ—the wise know; śrāddhe—at śrāddha; yasya—whose; dvijaḥ—a twice-born; bhuṅkte—eats; vācakaḥ—the reciter; śraddhā-anvitaḥ—with reverence; pitaraḥ—ancestors; tasya—of him; tṛptāḥ—satisfied; varṣa-śatam—for a hundred years; nṛpa—O king."],"99":["Understanding the meaning of the whole text very well, one should recite its meaning among the varṇas beginning with Brāhmaṇas, O king.","yathā—as; iha—here; sarva-devānām—of all the gods; bhāskaraḥ—Bhāskara; pravaraḥ—foremost; smṛtaḥ—is remembered; vispaṣṭam—clear; adbhutam—wondrous; śāntam—peaceful; spaṣṭa-akṣara-padam—with distinct syllables and words; kala-svara-samāyuktam—joined with a melodious voice; rasa-bhāva-samanvitam—endowed with rasa and bhāva."],"100":["A Brāhmaṇa who recites thus is called Vyāsa, O king. One who speaks otherwise should be known by the name Vaktṛ.","budhyamānaḥ—understanding; sadā—always; atyartham—very well; grantha-artham—the meaning of the text; kṛtsnaśaḥ—entirely; nṛpa—O king; brāhmaṇa-ādiṣu—among those beginning with Brāhmaṇas; varṇeṣu—varṇas; grantha-artham—the meaning of the text; vācayet—one should recite; nṛpa—O king."],"101":["Where a reciter of this kind, resembling Vyāsa, lives in a region or a city, that region is remembered as excellent, O king.","yaḥ—who; evam—thus; vācayet—recites; rājanya—O king; vipraḥ—a Brāhmaṇa; vyāsaḥ—Vyāsa; ucyate—is called; ataḥ anyathā—otherwise; kathayitā—speaker; jñeyaḥ—is to be known; asau—he; vaktṛ-nāmakaḥ—named Vaktṛ."],"102":["Those who dwell diligently in that region remembered as excellent are blessed, great souled, and fulfilled, without doubt.","ittham-bhūtaḥ—of this kind; vaset—lives; yasmin—in which; vācakaḥ—the reciter; vyāsa-sannibhaḥ—resembling Vyāsa; deśe—in a region; atha—or; pattane—in a city; rājan—O king; saḥ—that; deśaḥ—region; pravaraḥ—excellent; smṛtaḥ—is remembered."],"103":["A city without Vyāsa never shines, O hero, just as a day without the Sun and a night without the Moon.","te—they; dhanyāḥ—blessed; te—they; mahātmānaḥ—great-souled; te—they; kṛta-arthāḥ—fulfilled; na—not; saṃśayaḥ—doubt; vasanti—dwell; yatnataḥ—with effort; yasmin—in which; saḥ—that; deśaḥ—region; pravaraḥ—excellent; smṛtaḥ—is remembered."],"104":["As a lake without a lotus does not shine, O king, so no city without Vyāsa shines.","na—not; śobhate—shines; puram—a city; vīra—O hero; vyāsa-hīnam—without Vyāsa; kadācana—ever; yathā—as; arka-hīnam—without the Sun; dinam—a day; ca—and; candra-hīnā—without the Moon; niśā—a night."],"105":["A lake without a lotus does not shine, O king; likewise, no city without Vyāsa shines anywhere.","na—not; rājate—shines; saras—a lake; yadvat—as; padminī—lotus; rahitam—without; nṛpa—O king; tathā—so; vyāsa-vihīnam—without Vyāsa; tu—but; rājate—shines; na—not; puram—a city; kvacit—anywhere."],"106":["The fruit obtained by people who bow to the reciter with devotion, O joy of the Kurus, is not obtained through a thousand sacrifices.","praṇamya—having bowed; vācakam—to the reciter; bhaktyā—with devotion; yat phalam—the fruit which; prāpyate—is obtained; naraiḥ—by people; na—not; tat—that; kratu-sahasreṇa—through a thousand sacrifices; prāpyate—is obtained; kuru-nandana—O joy of the Kurus."],"107":["As all the planets are on one side and the Sun alone on the other, so all the twice born are on one side and that reciter alone on the other.","yathā—as; ekataḥ—on one side; grahāḥ—the planets; sarve—all; ekataḥ—on one side; divākaraḥ—the Sun; tathā—so; ekataḥ—on one side; dvijāḥ—the twice-born; sarve—all; ekataḥ—on one side; saḥ—that; vācakaḥ—the reciter."],"108":["As no āgama on earth is equal to the Veda, so no Brāhmaṇa on earth is equal to Vyāsa.","yathā—as; veda-samaḥ—equal to the Veda; na—not; asti—is; āgamaḥ—scripture; bhuvi—on earth; kaścana—any; tathā—so; vyāsa-samaḥ—equal to Vyāsa; na—not; asti—is; brāhmaṇaḥ—a Brāhmaṇa; bhuvi—on earth; kaścana—any."],"109":["No second pilgrimage place is declared equal to Kurukṣetra. No river is equal to Gaṅgā, and no deity is superior to Bhāskara.","kuru-kṣetra-samam—equal to Kurukṣetra; tīrtham—pilgrimage; na—not; dvitīyam—a second; pracakṣate—they declare; na—not; nadī—a river; gaṅgayā—to Gaṅgā; tulyā—equal; na—not; devaḥ—a deity; bhāskarāt—from Bhāskara; varaḥ—superior."],"110":["There is no merit equal to the horse sacrifice, no sin equal to the killing of a Brahmin, and no happiness equal to the joy when a son is born.","na—not; aśvamedha-samam—equal to the horse sacrifice; puṇyam—merit; na—not; pāpam—sin; brahma-hatyayā—by killing a Brahmin; putra-janma-sukhaiḥ—to the happiness from a son being born; tulyam—equal; na—not; sukham—happiness; vidyate—is found; yathā—as.","नाश्वमेधसमं पुण्यं न पापं ब्रह्महत्यया । पुत्रजन्मसुखैस्तुल्यं न सुखं विद्यते यथा ॥ ११० ॥"],"111":["Thus no Vipra equal to Vyāsa is found anywhere, O king. He is the supreme purifier of people in rites for the gods and ancestors.","tathā—so; vyāsa-samaḥ—equal to Vyāsa; vipraḥ—a Brāhmaṇa; na—not; kvacit—anywhere; prāpyate—is found; nṛpa—O king; daive—in rites for the gods; karmaṇi—in rites; pitrye—and ancestral; ca—and; pāvanaḥ—purifier; paramaḥ—supreme; nṛṇām—of people."],"112":["There is no one superior to Vyāsa, this is the Vedic śruti. Among thousands of Brāhmaṇas, this Brāhmaṇa is declared best when Vyāsa sits and eats in the assembly of Brāhmaṇas.","na—not; asti—is; vyāsa-samaḥ—equal to Vyāsa; śreṣṭhaḥ—superior; iti—thus; iyam—this; vaidikī—Vedic; śrutiḥ—śruti; atha—and; vipra-sahasrāṇām—among thousands of Brāhmaṇas; vipraḥ—a Brāhmaṇa; ayam—this; śreṣṭhaḥ—best; īritaḥ—is declared; upaviṣṭaḥ—seated; yadā—when; bhuṅkte—eats; vyāsaḥ—Vyāsa; vai—indeed; vipra-maṇḍale—in the assembly of Brāhmaṇas."],"113":["The purifying things at śrāddha were formerly told to me by Brahmā, O tiger among kings. Hear them according to rule.","śrāddhe—at śrāddha; tāta—dear one; pavitrāṇi—purifying things; kathitāni—were told; purā—formerly; mama—to me; brahmaṇā—by Brahmā; rāja-śārdūla—O tiger among kings; śṛṇu—hear; tāni—them; yathā-vidhi—according to rule."],"114":["Honey, pāyasa, kāla greens, sesame, and kutapa, likewise silver vessels, Brāhmaṇas, and the reciter.","madhu—honey; pāyasam—milk-pudding; kāla-śākam—kāla greens; tilāḥ—sesame; kutapaḥ—kutapa; tathā—and; rājatam—silver; ca—and; api—also; pātreṣu—in vessels; brāhmaṇeṣu—among Brāhmaṇas; atha—then; vācakaḥ—the reciter."],"115":["In the rites for the gods and ancestors, the reciter, the ascetic, and one who knows the six limbs are to be known as purifiers of the row.","daive—in rites for the gods; karmaṇi—in rites; pitrye—and ancestral; ca—and; saḥ—he; jñeyaḥ—is to be known; paṅkti-pāvanaḥ—as purifier of the row; vācakaḥ—the reciter; ca—and; yatiḥ—the ascetic; ca—and; tathā—and; yaḥ—who; ṣaḍ-aṅga-vit—knows the six limbs."],"116":["All these, O best of kings, are to be known as purifiers of the row. These are the two names of the reciter, now hear their meaning.","ete—all these; sarve—all; nṛpa-śreṣṭha—O best of kings; vijñeyāḥ—are to be known; paṅkti-pāvanāḥ—as purifiers of the row; nāmanī—two names; vācakasya—of the reciter; ete—these; śṛṇu—hear; artham—the meaning; atha—now; etayoḥ—of these two."],"117":["Since the twice born recites the Itihāsas and Purāṇas known as Jaya and lives by them, the reciter has gained the fame of Jaya upajīvī, O king.","itihāsa-purāṇāni—Itihāsa and Purāṇas; jayā—Jaya; iti—thus; viditāni—known; vai—indeed; upajīvati—lives by; yasmāt—because; vācayānaḥ—reciting; dvijaḥ—the twice-born; nṛpa—O king; jaya-upajīvī—living by Jaya; tena—therefore; asau—he; gataḥ—obtained; khyātim—renown; tu—indeed; vācakaḥ—the reciter."],"118":["Clear, wondrous, peaceful, with clear syllables, joined with a melodious voice, endowed with rasa and bhāva.","vispaṣṭam—clear; adbhutam—wondrous; śāntam—peaceful; spaṣṭa-akṣaram—with distinct syllables; idam—this; tathā—and; kala-svara-samāyuktam—joined with a melodious voice; rasa-bhāva-samanvitam—endowed with rasa and bhāva."],"119":["Striving greatly to know the entire meaning of the text, O king, he should likewise convey its meaning among the varṇas beginning with Brāhmaṇas.","budhyamānaḥ—understanding; atha—or; atyartham—very well; grantha-artham—the meaning of the text; kṛtsnaśaḥ—entirely; nṛpa—O king; brāhmaṇa-ādiṣu—among those beginning with Brāhmaṇas; varṇeṣu—varṇas; grantha-artham—the meaning of the text; ca—and; arpayet—one should present; tathā—in that way."],"120":["A Brāhmaṇa who recites thus is called Vyāsa, O king. One reciting otherwise never attains the state of Vyāsa.","yaḥ—who; evam—thus; vācayet—recites; rājanya—O king; vipraḥ—a Brāhmaṇa; vyāsaḥ—Vyāsa; ucyate—is called; ataḥ anyathā—otherwise; vācayitā—one who recites; na—not; gacchet—attains; vyāsatām—the state of Vyāsa; kvacit—ever."],"121":["Know the reciter to be threefold according to the division of qualities, always. The listener too is threefold according to qualities, O mighty armed one.","tri-vidham—threefold; vācakam—the reciter; vidyāt—one should know; sadā—always; guṇa-vibhedataḥ—according to the division of qualities; śrāvakam—the listener; ca—and; mahā-bāho—O mighty-armed one; tri-vidham—threefold; guṇa-bhedataḥ—according to qualities."],"122":["Hear about these two as I describe them, hurried and unclear, lengthy, and devoid of tone.","dvau—two; etau—these; kathyamānau—being described; tu—indeed; nibodha—understand; gadataḥ—from me speaking; mama—my; abhidrūtam—hurried; tathā—and; aspaṣṭam—unclear; vistaram—lengthy; svara-varjitam—without proper tone."],"123":["Without word division and likewise devoid of meaning, not understanding the meaning of the text, and devoid of desired enthusiasm.","pada-ccheda-vihīnam—without word-separation; ca—and; tathā—and; bhāva-vivarjitam—devoid of meaning; abudhyamānaḥ—not understanding; grantha-artham—the meaning of the text; abhīṣṭa-utsāha-varjitaḥ—without desired enthusiasm."],"124":["Whoever recites in this way, O lord of the earth, is angry, unpleasant in speech, and a corrupter of the text through ignorance.","īdṛśam—such; vācayet—recites; yaḥ—whoever; vācakaḥ—the reciter; kṣmādhipa-īśvara—O lord of the earth; krodhanaḥ—angry; apriya-vādī—speaking unpleasantly; ca—and; ajñānāt—from ignorance; grantha-dūṣakaḥ—corruptor of the text."],"125":["He is not understood and is difficult to understand, and is to be known as the lowest reciter. Clear, wondrous, peaceful, endowed with rasa and bhāva.","budhyate—is understood; na—not; ca—and; kaṣṭāt—with difficulty; saḥ—he; jñeyaḥ—is to be known; vācaka-adhamaḥ—as the lowest reciter; vispaṣṭam—clear; adbhutam—wondrous; śāntam—peaceful; rasa-bhāva-samanvitam—endowed with rasa and bhāva."],"126":["A reciter who recites without understanding the meaning of the text is known as rājasa, O king. Now hear the sāttvika one.","abudhyamānaḥ—not understanding; grantha-artham—the meaning of the text; vācayet—recites; yaḥ—who; vācakaḥ—the reciter; saḥ—that one; jñeyaḥ—is to be known; rājasikaḥ—as rājasa; rājan—O king; idānīm—now; sāttvikam—the sāttvika one; śṛṇu—hear."],"127":["Clear, wondrous, peaceful, with distinct syllables and words, joined with a melodious voice, endowed with rasa and bhāva.","vispaṣṭam—clear; adbhutam—wondrous; śāntam—peaceful; spaṣṭa-akṣara-padam—with distinct syllables and words; kala-svara-samāyuktam—joined with a melodious voice; rasa-bhāva-samanvitam—endowed with rasa and bhāva."],"128":["One who understands the entire meaning of the text very well is properly an ācārya among the varṇas beginning with Brāhmaṇas, O king.","atyartham—very well; budhyamānaḥ—understanding; grantha-artham—the meaning of the text; kṛtsnaśaḥ—entirely; nṛpa—O king; brāhmaṇa-ādiṣu—among those beginning with Brāhmaṇas; varṇeṣu—varṇas; ācāryaḥ—an ācārya; vidhi-vat—properly; nṛpa—O king."],"129":["One who recites thus is known by the wise as sāttvika. One devoid of faith and devotion, exceedingly greedy and harsh,","yaḥ—who; evam—thus; vācayet—recites; rājan—O king; saḥ—he; jñeyaḥ—is to be known; sāttvikaḥ—as sāttvika; budhaiḥ—by the wise; śraddhā—reverence; bhakti—devotion; vihīnaḥ—without; yaḥ—who; lobhiṣṭhaḥ—greedy; kaṭukaḥ—harsh; yathā—as."],"130":["Intent on argument, O king, and possessed of envy, receiving the dakṣiṇā for regular, occasional, and desired rites, O king,","hetu-vāda-paraḥ—intent on argument; rājan—O king; tathā—and; asūyā-samanvitaḥ—possessed of envy; nityām—regular; naimittikām—occasional; kāmyām—desired; ādadat—receiving; dakṣiṇām—the gift; nṛpa—O king."],"131":["The reciter of this kind, O mighty armed one, and the person who listens to him are to be known as tāmasa, O king.","vācakaḥ—the reciter; yaḥ—who; mahā-bāho—O mighty-armed one; śṛṇuyāt—listens; yaḥ—whoever; mānavaḥ—a person; saḥ—that one; jñeyaḥ—is to be known; tāmasaḥ—as tāmasa; rājan—O king; śrāvakaḥ—the listener; mānavaḥ—a person; api—also."],"132":["A wise man should not recite before him, O hero. Whoever hears by chance, without faith and devotion,","na—not; tasya—in front of him; purataḥ—in the presence; vīra—O hero; vācayet—one should recite; prājñaḥ—a wise person; eva—indeed; prasaṅgāt—by chance; śṛṇuyāt—hears; yaḥ—whoever; śraddhā-bhakti-vivarjitaḥ—without reverence and devotion."],"133":["Is known as rājasa, O king, one who is merely an object of curiosity. Having abandoned all tasks, with devotion and faith,","rājan—O king; kautuka-pātram—an object of curiosity; tu—indeed; saḥ—he; jñeyaḥ—is to be known; rājasikaḥ—as rājasa; bhavet—would be."],"134":["Whoever continually honours the reciter with faith and joy in regular, occasional, and desired rites, and likewise honours the gurus and deities,","saṃtyajya—having abandoned; sarva-kāryāṇi—all tasks; bhaktyā—with devotion; śraddhā-samanvitaḥ—endowed with reverence; satatam—continually; pūjayet—worships; yaḥ—whoever; vācakam—the reciter; śraddhayā—with reverence; mudā—with joy; nitye—in regular rites; naimittike—in occasional rites; kāmye—in desired rites; gurūn—teachers; devatāḥ—deities; tathā—and."],"135":["Whoever listens thus, O hero, is known by the wise as sāttvika. Vyāsa is to be worshipped by listeners according to Vyāsa's words, O king.","yaḥ—whoever; evam—thus; śṛṇuyāt—hears; vīra—O hero; saḥ—he; jñeyaḥ—is to be known; sāttvikaḥ—as sāttvika; budhaiḥ—by the wise; vyāsaḥ—Vyāsa; pūjyaḥ—to be worshipped; śrāvakāṇām—by listeners; yathā—according to; vyāsa-vacaḥ—Vyāsa’s teaching; nṛpa—O king."],"136":["Therefore no one is more worthy of worship for listeners, O best of kings, because he is always their teacher and giver of knowledge, O king.","tasmāt—therefore; pūjyatamaḥ—most worthy of worship; na—not; anyaḥ—another; śrāvakāṇām—for listeners; nṛpa-uttama—O best of kings; yataḥ—because; saḥ—he; vai—indeed; guruḥ—teacher; teṣām—their; jñāna-dātā—giver of knowledge; sadā—always; nṛpa—O king."],"137":["No other relative is declared for the four varṇas here except Vyāsa, O best of kings. This is Vedic śruti.","caturṇām—of the four; iha—here; varṇānām—varṇas; na—not; anyaḥ—another; bandhuḥ—relative; pracakṣyate—is declared; vyāsāt—apart from Vyāsa; ṛte—except; nṛpa-śreṣṭha—O best of kings; iti—thus; iyam—this; vaidikī—Vedic; śrutiḥ—śruti."],"138":["Therefore, with every effort, one should always honour the reciter. He is the teacher, father, mother, relative, and friend.","tasmāt—therefore; sarva-prayatnena—with every effort; pūjayet—one should honour; vācakam—the reciter; sadā—always; saḥ—he; guruḥ—teacher; saḥ—he; pitā—father; mātā—mother; saḥ—he; bandhuḥ—relative; saḥ—he; suhṛt—friend; tathā—and."],"139":["The reciter is the teacher of all, from Brāhmaṇas onward, O tiger among kings. Thus Vyāsa is to be known as guru, worshipped and honoured by the twice born.","vācakaḥ—the reciter; nṛpa-śārdūla—O tiger among kings; vipra-ādīnām—of those beginning with Brāhmaṇas; aśeṣataḥ—entirely; ittham—thus; vyāsaḥ—Vyāsa; guruḥ—as teacher; jñeyaḥ—is to be known; pūjyaḥ—to be worshipped; mānyaḥ—to be honoured; dvijātibhiḥ—by the twice-born."],"140":["Those who hear him, O king, call him their guru. The time for honouring him is declared for listeners.","śṛṇvanti—hear; ye—those who; narāḥ—people; rājan—O king; teṣām—their; guruḥ—teacher; ucyate—is called; pūjā-artham—for worship; tasya—of him; samayaḥ—the time; śrāvakāṇām—for listeners; udāhṛtaḥ—is declared."],"141":["Those who hear, O best of kings, should each month give one gold māṣa separately to the reciter.","ye—those who; śṛṇvanti—hear; nṛpa-śreṣṭha—O best of kings; māsi māsi—each month; dadanti—give; te—they; svarṇa-māṣakam—one gold māṣa; ekasmai—to one; vācakāya—to the reciter; pṛthak pṛthak—individually."],"142":["On the twelfth day, the new moon, or at the Sun's transit, that is his regular dakṣiṇā, and that for one's own welfare.","dvādaśyām—on the twelfth day; ca—and; amāvāsyāyām—on the new-moon day; atha—or; ravisaṃkrame—at the Sun’s transit; sā—that; nityā—regular; dakṣiṇā—gift; tasmai—for him; yā—which; ca—and; śreyaḥ-artham—for welfare; ātmanaḥ—of oneself."],"143":["At the solstice, the equinox, and an eclipse of the Moon or Sun, and when the dark fortnight arrives, a gift should be made to him according to one's means.","ayane—at the solstice; viṣuve—at the equinox; ca—and; eva—indeed; candra-sūrya-grahe—at an eclipse of Moon or Sun; tathā—and; prāpte—when arrived; vā—or; apara-pakṣe—in the dark fortnight; dānam—a gift; tasya—to him; sva-śaktitaḥ—according to one’s means."],"144":["It should be given to him by the listeners, dear one, and to no one else, O king. The listeners should always give to him first for their welfare.","deyam—is to be given; syāt—should be; śrāvakaiḥ—by listeners; tāta—dear one; tam—to him; muktvā—except; na—not; anyataḥ—to another; nṛpa—O king; prathamam—first; tasya—to him; dātavyam—is to be given; śreyaḥ-artham—for welfare; śrāvakaiḥ—by listeners; sadā—always."],"145":["If listeners give to another without first giving to him, O king, they have shown disrespect to the reciter.","adattvā—without giving; tasya—to him; ye—who; anyasmai—to another; samprayacchanti—give; śrāvakāḥ—listeners; avamānaḥ—disrespect; kṛtaḥ—is done; taiḥ—by them; vācakasya—to the reciter; bhavet—would be; nṛpa—O king."],"146":["Hear, O fair faced one, the result obtained by all the varṇas beginning with Brāhmaṇas through showing him disrespect.","kṛtvā—having done; avamānam—disrespect; atha—then; taiḥ—by them; prāpyate—is obtained; yat phalam—the fruit which; nṛpa—O king; brāhmaṇa-ādyaiḥ—beginning with Brāhmaṇas; samastaiḥ—by all; ca—and; tat—that; śṛṇuṣva—hear; vara-ānana—O fair-faced one."],"147":["A Brāhmaṇa becomes a Śūdra, a Kṣatriya becomes a crow, and so too a Vaiśya is born as one. A Śūdra goes to the state of a Caṇḍāla.","śūdratvam—the state of a Śūdra; brāhmaṇaḥ—a Brāhmaṇa; yāti—goes; kṣatriyaḥ—a Kṣatriya; yāti—goes; kākatām—the state of a crow; jāyate—is born; ca—and; tathā—likewise; vaiśyaḥ—a Vaiśya; tathā—likewise; jāyate—is born; śūdraḥ—a Śūdra; caṇḍālatām—the state of a Caṇḍāla; vrajet—attains."],"148":["Therefore the wise should first honour the reciter, O best of kings, in distress and in old age too, because he is remembered as guru.","tasmāt—therefore; pūjyaḥ—to be honoured; nṛpa-śreṣṭha—O best of kings; prathamam—first; vācakaḥ—the reciter; budhaiḥ—by the wise; āpat-kāle—in distress; ca—and; vṛddhau—in old age; ca—and; yataḥ—because; asau—he; guruḥ—as teacher; smṛtaḥ—is remembered."],"149":["In the Vaiśākha ayana, O hero, on the third day, and in Kārttika and Mārgaśīrṣa, he should be honoured first.","vaiśākha-ayane—during the Vaiśākha ayana; vīra—O hero; tṛtīyāyām—on the third day; ca—and; su-vrata—O righteous one; kārttikyām—in Kārttika; atha—and; mārgyām—in Mārgaśīrṣa; ca—and; sampūjyaḥ—to be honoured; prathamam—first; bhavet—should be."],"150":["At other festivals too he is remembered as worthy of honour according to dharma, O lord. Hiraṇya and suvarṇa, wealth and grain likewise.","parvasu—at festivals; anyeṣu—other; ca—and; vibho—O lord; sampūjyaḥ—to be honoured; dharmataḥ—according to dharma; smṛtaḥ—is declared; hiraṇyam—gold; suvarṇam—gold; dhanam—wealth; dhānyam—grain; tathā—also."],"151":["And cooked food and meat too, O joy of the Kurus, should be given first to him by the listeners, O best of kings.","annam—food; ca—and; api—also; tathā—and; pakvam—prepared; māṃsam—meat; ca—and; kuru-nandana—O joy of the Kurus; dātavyam—is to be given; prathamam—first; tasmai—to him; śrāvakaiḥ—by listeners; nṛpa-sattama—O best of kings."],"152":["The reciter should always dwell comfortably, O king. One should act so that he is not afflicted by the pairs of opposites, O fair faced one.","vācakaḥ—the reciter; tu—but; yathā—as; nityam—always; sukham—comfortably; āste—dwells; nara-adhipa—O king; na—not; pīḍyate—is afflicted; yathā—as; dvandvaiḥ—by pairs of opposites; tathā—thus; kāryam—is to be done; vara-ānana—O fair-faced one."],"153":["In winter woollen garments should be given, O best one, and an umbrella in the rainy season. Sandals at the proper time, and things suited to the season.","hemante—in winter; lomaśāḥ—fur garments; deyāḥ—are to be given; chatram—an umbrella; prāvṛṣi—in the rainy season; sat-tama—O good one; upānahau—sandals; kāla-yogye—at the proper time; kāle—in season; ca—and; eva—indeed; anulomaśaḥ—suited to it."],"154":["Those listeners whose reciter is thus freed from hardships are blessed in the world, and they have reached the highest state.","ittham—thus; dvandva-vinirmuktaḥ—free from the pairs of opposites; saḥ—he; yeṣām—whose; vācakaḥ—reciter; nṛpa—O king; te—they; dhanyāḥ—blessed; śrāvakāḥ—listeners; loke—in the world; te—they; gatāḥ—have gone; paramam padam—to the highest state."],"155":["How could a discerning man seek happiness for himself, O hero, when the guru is in difficulty, O king, since he is remembered as guru.","ātmanā—for oneself; tu—indeed; katham—how; vīra—O hero; sukham—happiness; icchet—would desire; vicakṣaṇaḥ—a discerning person; viṣama-sthe—when in difficulty; gurau—the teacher; rājan—O king; yataḥ—since; ca—and; saḥ—he; guruḥ—as teacher; smṛtaḥ—is remembered."],"156":["Therefore he should remove the hardship of reciters and listeners. The listeners should make an effort for the reciter, O lord of men.","vācaka-śrāvakāṇām—of reciters and listeners; ca—and; tasmāt—therefore; dvandvam—hardship; vighātayet—one should remove; yatnaḥ—effort; kāryaḥ—is to be made; śrāvakaiḥ—by listeners; ca—and; vācakasya—for the reciter; janādhipa—O lord of men."],"157":["Thus Vyāsa is always to be honoured first for welfare, O king, as a husband is honoured by all women, O lord of the earth.","ittham—thus; pūjyaḥ—to be honoured; sadā—always; vyāsaḥ—Vyāsa; śreyaḥ-artham—for welfare; prathamam—first; nṛpa—O king; bhartā—the husband; pūjyaḥ—is honoured; yathā—as; strīṇām—by women; sarvāsām—by all; vai—indeed; mahī-pate—O lord of the earth."],"158":["Likewise, among listeners, the reciter is said to be worthy of worship, as the teacher is for disciples and Bhagavān Hari for the devotees.","śrāvakāṇām—by listeners; tathā—likewise; rājan—O king; vācakaḥ—the reciter; pūjyaḥ—worthy of worship; ucyate—is declared; upādhyāyaḥ—the teacher; tu—and; śiṣyāṇām—for disciples; yathā—as; bhāgavataḥ—for devotees; hariḥ—Hari."],"159":["As Bhānu is for the Sauras and Śaṅkara for the Śaivas, so the reciter is to be worshipped by listeners, O king.","saurāṇām—by the Sauras; ca—and; yathā—as; bhānuḥ—Bhānu; śaivānām—by the Śaivas; śaṅkaraḥ—Śaṅkara; yathā—as; vācakaḥ—the reciter; tu—and; tathā—so; pūjyaḥ—worthy of worship; śrāvakāṇām—by listeners; nara-adhipa—O king."],"160":["One desiring prosperity, always giving dakṣiṇā, should listen. Give that reciter the previously stated māṣa, O king.","dakṣiṇām—the gift; dadatā—giving; nityam—always; śrotavyam—to be heard; bhūtim—prosperity; icchatā—by one desiring; pūrva-ukta-māṣakam—the previously stated māṣa; tasmai—to him; vācakāya—to the reciter; janādhipa—O lord of men."],"161":["When he cannot give a māṣa of gold, then a māṣa of silver should be given for welfare, O king.","yadā—when; dātum—to give; na—not; śaknoti—is able; māṣakam—a māṣa; kāñcanasya—of gold; tu—indeed; rajatasya—of silver; tadā—then; deyam—is to be given; māṣakam—a māṣa; śreyase—for welfare; nṛpa—O king."],"162":["In its absence, he should give hiraṇya, free from stinginess about wealth. Even earth is to be given, for one obtains good and auspicious fruit.","tat-abhāve—in its absence; hiraṇyam—gold; ca—and; vitta-śāṭhya-vivarjitaḥ—free from stinginess with wealth; mṛttikā—earth; api—even; hi—indeed; dātavyā—is to be given; prāpnoti—one obtains; sat-phalam—good fruit; śubham—auspicious."],"163":["This is the regular dakṣiṇā to be given each month, O king. The occasional dakṣiṇā is for eclipses and other festivals, O king.","iti—thus; eṣā—this; dakṣiṇā—gift; nityā—regular; māsi māsi—each month; bhavet—should be; nṛpa—O king; naimittikā—occasional; bhavet—is to be; rājan—O king; grahaṇa-ādiṣu—at eclipses and the like; parvasu—festivals."],"164":["At the completion of the observance, O lord, one desiring prosperity should give clean garments adorned with perfume and garlands.","amale—clean; vāsasī—garments; rājan—O king; gandha-mālya-vibhūṣaṇe—adorned with perfume and garlands; samāpte—when completed; parvaṇi—at the observance; vibho—O lord; dātavye—are to be given; bhūtim—prosperity; icchatā—by one desiring."],"165":["Knowing the completion of all, the listener should surely honour him. Whoever wishes for the fruit of what was heard should even sell himself.","jñātvā—having known; sarva-samāptim—the complete ending; pūjayet—should honour; śrāvakaḥ—the listener; dhruvam—surely; ātmānam—oneself; api—even; vikrīya—having sold; yaḥ—who; icchet—desires; sa-phalam—with fruit; śrutam—what was heard."],"166":["Whoever always listens without giving the occasional and regular dakṣiṇā, his hearing is fruitless.","naimittikām—the occasional; ca—and; nityām—the regular; ca—and; dakṣiṇām—the gift; apradāya—without giving; śṛṇoti—hears; ca—and; sadā—always; yaḥ—whoever; tasya—of him; tat—that; niṣphalam—fruitless; śrutam—hearing."],"167":["As one does not obtain the fruit of sacrifices without dakṣiṇā, so hearing without dakṣiṇā is held to be fruitless, O king.","yathā—as; dakṣiṇā-hīnāt—from one without a gift; yajñāt—from a sacrifice; na—not; phalam—the fruit; aśnute—one obtains; tathā—so; śrutam—hearing; ca—and; rājendra—O king; dakṣiṇā-rahitam—without a gift; smṛtam—is considered."],"168":["The regular dakṣiṇā should be fourfold at the completion of the observance, O king, O lord. Thus spoke Bhagavān Śiva.","catur-guṇā—fourfold; bhavet—should be; rājan—O king; yā—that; nityā—regular; dakṣiṇā—gift; vibho—O lord; samāpte—at the completion; parvaṇi—of the observance; vibho—O lord; iti—thus; āha—spoke; bhagavān śivaḥ—Bhagavān Śiva."],"169":["Thus, O king, the rule for hearing the Purāṇa has been told, for the fruit of an act without rule does not arise.","iti—thus; eṣaḥ—this; kathitaḥ—told; rājan—O king; purāṇa-śravaṇe—for hearing the Purāṇa; vidhiḥ—the rule; yataḥ—because; vidhihīnam—without rule; tu—indeed; na—not; karma-phalam—the fruit of the act; udyate—arises."],"170":["Bathing, giving, japa, homa, and worship of ancestors and gods are known to be according to rule in this world, O joy of the Kurus.","snānam—bathing; dānam—giving; japaḥ—recitation; homaḥ—offering; pitṛ-deva-abhipūjanam—worship of ancestors and gods; vidhi-pūrvam—according to rule; smṛtam—is held; jñeyam—is to be known; yathā—as; iha—here; kuru-nandana—O joy of the Kurus."],"171":["Likewise, hearing the Purāṇa gives fruit, O tiger among kings. I have told you how hearing is done according to rule.","phala-dam—fruit-giving; nṛpa-śārdūla—O tiger among kings; purāṇa-śravaṇam—hearing the Purāṇa; tathā—likewise; yathā—as; ayam—this; kathitaḥ—told; tubhyam—to you; vidhinā—according to rule; śravaṇam—hearing; mayā—by me."],"172":["According to what has been stated, as spoken by the Brahmavādin, that Brāhmaṇa, O great king, is honoured in all worlds.","yathā-uktam—as stated; tu—indeed; yathā—as; jīvam—living; yathā-uktam—as stated; brahma-vādinā—by the speaker of Brahman; saḥ—that; brāhmaṇaḥ—Brāhmaṇa; mahā-rāja—O great king; sarva-lokeṣu—in all worlds; pūjitaḥ—is honoured."],"173":["As heard, O mighty armed one, I have told you this, the greatness of Bhāskara and the greatness of the reciter.","yathā-śrutam—as heard; mahā-bāho—O mighty-armed one; tathā—so; idam—this; kathitam—is told; tava—to you; bhāskarasya—of Bhāskara; tu—and; māhātmyam—the greatness; vācakasya—of the reciter; tu—and; māhātmyam—the greatness."],"174":["Likewise, the Saptamī observance removes the fear of all sins. Whoever continually worships by this procedure,","tathā—likewise; saptamī-kalpaḥ—the Saptamī observance; sarva-pāpa-bhaya-apahaḥ—removing the fear of all sins; anena vidhinā—by this procedure; yaḥ—whoever; pūjayet—worships; satatam—continually; naraḥ—a person."],"175":["Having reached Bhaga's world, one is celebrated in the three worlds. Then, having reached Arka's world, one goes to the world of Citraśikhaṇḍin.","bhaga-lokam—the world of Bhaga; samāsādya—having reached; triṣu lokeṣu—in the three worlds; gīyate—is celebrated; tataḥ—then; arka-lokam—the world of Arka; āsādya—having reached; gacchet—one goes; citraśikhaṇḍinaḥ—to Citraśikhaṇḍin."],"176":["From there, O mighty armed one, one goes to the world of Divākara. Then, going from Arka's world, he attains Goloka.","tasmāt—from there; api—also; mahā-bāho—O mighty-armed one; gacchet—one goes; lokam—to the world; divākaram—of Divākara; arka-lokāt—from Arka’s world; tataḥ—then; yātaḥ—having gone; tataḥ—then; go-lokam—Goloka; aśnute—attains."],"177":["Then he goes to the world of Ṛta, and beyond that to the world of the lotus born. The fruit of ten Rājasūyas and a hundred Agniṣṭomas","ṛtasya—of Ṛta; ca—and; tataḥ—then; gacchet—one goes; kaṃja-jasya—of the lotus-born; tataḥ—then; param—beyond; daśānām—of ten; rāja-sūyānām—Rājasūyas; agniṣṭoma-śatasya—of a hundred Agniṣṭomas; ca—and."],"178":["He obtains through hearing, according to Pitāmaha's word.","śravaṇāt—through hearing; phalam—the fruit; āpnoti—one obtains; pitāmaha-vacaḥ yathā—according to the words of the Grandfather."]};const T=Object.fromEntries(Object.entries(R).map(([n,r])=>[n,r.omit?r:{en:r[0],wfw:r[1],sa:r[2],note:r[3]}]));renderBhavishyaLiveChapter({chapter:216,verseCount:178,subtitle:"Chapter 216 — Āditya’s Greatness and the Method of Hearing the Purāṇa",colophon:""},T);</script></body></html>
