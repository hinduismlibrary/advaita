<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 193 — Procedure for the Tooth-Cleaning Stick."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 193 — Procedure for the Tooth-Cleaning Stick — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-2" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 193 — Procedure for the Tooth-Cleaning Stick</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-192/">← Chapter 192</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-194/">Chapter 194 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-2"></script><script>const R=[["On the solstice, equinox, weekday, solar ingress, and eclipse, one should always worship the Sun, especially on the seventh lunar day.","ayane — on the solstice; viṣuve — on the equinox; vāre — on a weekday; saṃkrāntau — at the solar ingress; grahaṇe tathā — and at an eclipse; pūjayet — one should worship; satatam — always; bhānum — the Sun; saptamyām tu — especially on the seventh lunar day.","अयने विषुवे वारे संक्रान्तौ ग्रहणे तथा । पूजयेत्सततं भानुं सप्तम्यां तु विशेषतः ॥ १ ॥"],["O son of Vinatā, learn the procedure for the seventh-day vow. This is indeed the supreme secret, the highest worship of the Sun.","vainateya — O son of Vinatā; nibodha — learn; tvam — you; vidhānam — the procedure; saptamī-vrate — for the seventh-day vow; etat hi — this indeed; paramam guhyam — the supreme secret; raveḥ ārādhanam param — the highest worship of the Sun.","वैनतेय निबोध त्वं विधानं सप्तमीव्रते । एतद्धि परमं गुह्यं रवेराराधनं परम् ॥ २ ॥"],["The first is with white mustard seeds, the second with milkweed leaves, the third is to be done with black pepper, and the fourth with sesame.","siddhārthakaiḥ — with white mustard seeds; tu — indeed; prathamā — the first; dvitīyā — the second; ca — and; arka-sampuṭaiḥ — with milkweed leaves; tṛtīyā — the third; maricaiḥ — with black pepper; kāryā — is to be done; caturthī — the fourth; tila — with sesame.","सिद्धार्थकैस्तु प्रथमा द्वितीया चार्कसंपुटैः । तृतीया मरिचैः कार्या चतुर्थी तिल सप्तमी ॥ ३ ॥"],["The Saptamī with cooked rice, O hero, is so called. These seven seventh-day observances are to be performed by one desiring prosperity.","saptamī — the seventh-day observance; ca — and; odanaiḥ — with cooked rice; vīra — O hero; saptamī parikīrtitā — is so called; iti etāḥ — thus these; sapta saptamyaḥ — seven seventh-day observances; kartavyāḥ — are to be performed; bhūtim icchatā — by one desiring prosperity.","सप्तमी चौदनैर्वीर सप्तमी परिकीर्तिता । इत्येताः सप्त सप्तम्यः कर्तव्या भूतिमिच्छता ॥ ४ ॥"],["Now I shall tell their characteristics in sequence. The bright seventh lunar day is to be observed in Māgha or Mārgaśīrṣa.","tathā ca — and now; anu-krame — in sequence; tāsām — of these; lakṣaṇam — the characteristics; kathayāmi aham — I shall tell; māghe vā — in Māgha or; mārgaśīrṣe vā — in Mārgaśīrṣa; kāryā — to be observed; śuklā tu saptamī — the bright-fortnight seventh lunar day.","तथा चानुक्रमे तासां लक्षणं कथयाम्यहम् । माघे वा मार्गशीर्षे वा कार्या शुक्ला तु सप्तमी ॥ ५ ॥"],["For an ill person there is no rule concerning fortnight or month. One should clean the teeth when half a watch remains.","ārtasya — for an ill person; tu — indeed; na niyamaḥ — there is no rule; pakṣa-māsa-kṛtaḥ — concerning fortnight or month; bhavet — may be; ardha-prahara-śeṣe — when half a watch remains; tu — indeed; kuryāt — one should do; danta-dhāvanam — tooth-cleaning with a stick.","आर्तस्य तु न नियमः पक्षमासकृतो भवेत् । अर्धप्रहरशेषे तु कुर्याद्वै दन्तधावनम् ॥ ६ ॥"],["I shall tell the trees desired there on the fifth day. The mahua brings gain of a son; the false daisy removes sorrow.","pañcamyām — on the fifth day; tatra — there; ye vṛkṣāḥ — which trees; kāmitāḥ — are desired; tān vadāmi aham — I shall tell them; madhūke — with the mahua; putra-lābhaḥ syāt — there is gain of a son; duḥkha-hā — sorrow-removing; mārkavaḥ bhavet — the false daisy becomes.","पञ्चम्यां तत्र ये वृक्षाः कामितास्तान्वदाम्यहम् । मधूके पुत्रलाभः स्याद्दुःखहा मार्कवो भवेत् ॥ ७ ॥"],["With jujube and Indian nightshade one is quickly freed from disease; prosperity comes from bael, and increase from the catechu tree.","badaryā — with jujube; ca bṛhatyā — and Indian nightshade; kṣipram — quickly; rogāt pramucyate — one is freed from disease; aiśvaryam ca bhavet — and prosperity arises; bilvaiḥ — from bael; khadireṇa — from the catechu tree; ca saṃcayaḥ — and increase.","बदर्या च बृहत्या च क्षिप्रं रोगात्प्रमुच्यते । ऐश्वर्यं च भवेद्बिल्वैः खदिरेण च संचयः ॥ ८ ॥"],["Enemies are destroyed by the bur-flower tree; wealth is gained from the Hiptage creeper; from the Malabar nut shrub one attains eminence everywhere.","śatru-kṣayaḥ — destruction of enemies; kadambeṣu — by the bur-flower tree; artha-lābhaḥ — gain of wealth; ati-muktake — from the Hiptage creeper; gurutām yāti — one attains eminence; sarvatra — everywhere; āṭaruṣaka-saṃbhavaiḥ — from the Malabar nut shrub.","शत्रुक्षयः कदम्बेष्वर्थलाभोतिमुक्तके । गुरुतां याति सर्वत्र आटरूषकसंभवैः ॥ ९ ॥"],["The sacred fig brings prominence among relatives and bestows fame. From the oleander comes firm knowledge, without doubt.","jñāti-pradhānatām yāti — one attains prominence among relatives; aśvatthaḥ — the sacred fig; yacchate yaśaḥ — bestows fame; karavīrāt — from the oleander; parijñānam — knowledge; acalam syāt — becomes firm; na saṃśayaḥ — without doubt.","ज्ञातिप्रधानतां याति अश्वत्थो यच्छते यशः । करवीरात्परिज्ञानमचलं स्यान्न संशयः ॥ १० ॥"],["One obtains abundant prosperity from the placement of the siris tree; for one using the beautyberry, the highest good fortune comes.","śriyam — prosperity; prāpnoti — one obtains; vipulām — abundant; śirīṣasya niveśane — from the placement of the siris tree; priyaṅgum sevyamānasya — for one using the beautyberry; saubhāgyam paramam — the highest good fortune; bhavet — comes to be.","श्रियं प्राप्नोति विपुलां शिरीषस्य निवेशने । प्रियङ्गुं सेव्यमानस्य सौभाग्यं परमं भवेत् ॥ ११ ॥"],["For accomplishing the desired aim, seated comfortably and restraining speech, having placed the desired wish in the heart and consecrated it, the wise one should chew the tooth-stick with this mantra.","abhīpsitārtha-siddhy-artham — for accomplishing the desired aim; sukha-āsīnaḥ — seated comfortably; atha — then; vāk-yataḥ — with speech restrained; kāmam — the desired wish; yathā-iṣṭa-hṛdaye kṛtvā — having placed in the heart as desired; samabhimantrya ca — and having consecrated it with a mantra; mantreṇa anena — with this mantra; mati-mān — the wise one; aśnīyāt — should chew; danta-dhāvanam — the tooth-stick.","अभीप्सितार्थसिद्ध्यर्थं सुखासीनोऽथ वाग्यतः । कामं यथेष्टहृदये कृत्वा समभिमन्त्र्य च । मन्त्रेणानेन मतिमानश्नीयाद्दन्तधावनम् ॥ १२ ॥"],["Having granted a boon, you know, O wish-granting plant. Grant me success always. O tooth-stick, homage to you.","varam dattvā — having granted a boon; abhijānāsi — you know; kāma-dam — wish-granting; ca — and; vanaspate — O plant; siddhim prayaccha me — grant me success; nityam — always; danta-kāṣṭha — O tooth-stick; namaḥ astu te — homage to you.","वरं दत्त्वाभिजानासि कामदं च वनस्पते । सिद्धिं प्रयच्छ मे नित्यं दन्तकाष्ठ नमोऽस्तु ते ॥ १३ ॥"],["Having recited thus three times, one should chew the tooth-stick. Afterwards, having washed the stick, one should place it in a clean place.","trīn vārān — three times; parijapya — having recited; evam — thus; bhakṣayet — one should chew; danta-dhāvanam — the tooth-stick; paścāt — afterwards; prakṣālya — having washed; kāṣṭham tu — the stick; śucau deśe — in a clean place; vinikṣipet — one should place.","त्रीन्वारान्परिजप्यैवं भक्षयेद्दन्तधावनम् । पश्चात्प्रक्षाल्य काष्ठं तु शुचौ देशे विनिक्षिपेत् ॥ १४ ॥"],["If it falls upward, there is success; likewise if it lies facing toward one. If it falls otherwise, one should pick it up and cast it again.","ūrdhve nipatite — if fallen upward; siddhiḥ — success; tathā ca — and likewise; abhimukhe sthite — if it lies facing toward one; ataḥ anyathā tu — but otherwise; patite — if fallen; ānīya — having brought it back; punaḥ utsṛjet — one should cast it again.","ऊर्ध्वे निपतिते सिद्धिस्तथा चाभिमुखे स्थिते । अतोन्यथा तु पतिते आनीय पुनरुत्सृजेत् ॥ १५ ॥"],["If the tooth-stick faces away on three attempts, one should know it to be unsuccessful; that seventh-day observance is not to be accepted.","parāṅ-mukham — facing away; yadi bhavet — if it becomes; trīn vārān — three times; danta-dhāvanam — the tooth-stick; asiddhām — unsuccessful; tu vijānīyāt — one should know; na grāhyā — not to be accepted; sā tu saptamī — that seventh-day observance.","पराङ्मुखं यदि भवेत्त्रीन्वारान्दन्तधावनम् । असिद्धां तु विजानीयान्न ग्राह्या सा तु सप्तमी ॥ १६ ॥"],["The celibate student should sleep that night in auspicious observance, wearing uninjured clothing, pure, and with proper conduct.","brahma-cārī — the celibate student; tu — indeed; tām rātrim — that night; svapet — should sleep; maṅgala-sevayā — in auspicious observance; bibhrat — wearing; vāsaḥ — clothing; anupahatam — uninjured; śuciḥ — pure; ācāra-saṃyutaḥ — endowed with proper conduct.","ब्रह्मचारी तु तां रात्रिं स्वप्यान्मङ्गलसेवया । बिभ्रद्वासोऽनुपहतं शुचिराचारसंयुतः ॥ १७ ॥"],["When that night has passed, rising in the morning, O bird, the wise one should rinse his mouth and chew the tooth-stick.","tasyām rātryām — that night; vyatītāyām — having passed; prātaḥ — in the morning; utthāya — having risen; vai — indeed; khaga — O bird; prakṣālayet mukham — one should rinse the mouth; dhī-mān — the wise one; aśnīyāt — should chew; danta-dhāvanam — the tooth-stick.","तस्यां रात्र्यां व्यतीतायां प्रातरुत्थाय वै खग । प्रक्षालयेन्मुखं धीमानश्नीयाद्दन्तधावनम् ॥ १८ ॥"],["Having sat down and become pure, having bowed with the head to the Sun, and performed recitation as desired, one should offer into the fire.","upaviśya — having sat down; śuciḥ bhūtvā — having become pure; praṇamya śirasā ravim — having bowed with the head to the Sun; japam yathā-iṣṭam kṛtvā — having performed recitation as desired; juhuyāt ca — and one should offer; hutāśane — into the fire.","उपविश्य शुचिर्भूत्वा प्रणम्य शिरसा रविम् । जपं यथेष्टं कृत्वा तु जुहुयाच्च हुताशने ॥ १९ ॥"],["Then in the afternoon, having bathed with earth, cow dung, and water, having undertaken the observance according to rule, one should be silent, dressed in white, and pure.","tataḥ — then; aparāhna-samaye — in the afternoon; snātvā — having bathed; mṛd-go-maya-ambubhiḥ — with earth, cow dung, and water; vidhi-vat — according to rule; niyamam kṛtvā — having undertaken the observance; maunī — silent; śukla-ambaraḥ — dressed in white; śuciḥ — pure.","ततोऽपराह्नसमये स्नात्वा मृद्गोमयाम्बुभिः । विधिवन्नियमं कृत्वा मौनी शुक्लाम्बरः शुचिः ॥ २० ॥"],["Having performed the rite and worshipped with devotion the god of gods, the Sun, one should sleep before the deity, intent on reciting the Gāyatrī.","pūjayitvā — having worshipped; vidhim — the rite; bhaktyā — with devotion; deva-devam — the god of gods; divākaram — the Sun; svapet — one should sleep; devasya purataḥ — before the deity; gāyatrī-japa-tat-paraḥ — intent on reciting the Gāyatrī.","पूजयित्वा विधिं भक्त्या देवदेवं दिवाकरम् । स्वप्याद्देवस्य पुरतो गायत्रीजपतत्परः ॥ २१ ॥"]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1],sa:r[2]}]));renderBhavishyaLiveChapter({chapter:193,verseCount:21,preferEmbeddedSanskrit:true,subtitle:"Chapter 193 — Procedure for the Tooth-Cleaning Stick",colophon:""},T);</script></body></html>
