<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 193 — Tooth-Stick Procedure."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 193 — Tooth-Stick Procedure — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 193 — Tooth-Stick Procedure</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-192/">← Chapter 192</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-194/">Chapter 194 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["On the ayana, equinox, weekday, saṅkrānti, and eclipse, one should always worship Bhānu, especially on Saptamī.","ayane — on an ayana; viṣuve — on the equinox; vāre — on a weekday; saṅkrāntau — at saṅkrānti; grahaṇe tathā — and at an eclipse; pūjayet — one should worship; satatam — always; bhānum — Bhānu; saptamyām tu — but on Saptamī; viśeṣataḥ — especially."],["Listen, Vainateya, to the procedure of the Saptamī vow. This is the supreme secret, the highest worship of Ravi.","vainateya — O Vainateya; nibodha — understand/listen; tvam — you; vidhānam — the procedure; saptamī-vrate — of the Saptamī vow; etat hi — this indeed; paramam guhyam — the supreme secret; raveḥ ārādhanam param — the highest worship of Ravi."],["The first is with siddhārthaka seeds, the second with arka leaves, the third with pepper, and the fourth with sesame.","siddhārthakaiḥ — with siddhārthaka seeds; tu — indeed; prathamā — the first; dvitīyā — the second; ca — and; arka-sampuṭaiḥ — with arka-folds; tṛtīyā — the third; maricaiḥ — with pepper; kāryā — is to be done; caturthī — the fourth; tila — with sesame."],["And the Saptamī with rice, O hero, is called Saptamī. These seven Saptamīs are to be performed by one desiring prosperity.","saptamī — the Saptamī; ca — and; odanaiḥ — with rice; vīra — O hero; saptamī parikīrtitā — is declared the Saptamī; iti etāḥ — thus these; sapta saptamyaḥ — seven Saptamīs; kartavyāḥ — are to be performed; bhūtim icchatā — by one desiring prosperity."],["Now I shall tell their characteristics in sequence. The bright fortnight Saptamī is to be performed in Māgha or Mārgaśīrṣa.","tathā — and; ca — now; anu-krame — in sequence; tāsām — of these; lakṣaṇam — the characteristics; kathayāmi aham — I shall tell; māghe vā — in Māgha or; mārgaśīrṣe vā — in Mārgaśīrṣa; kāryā — to be performed; śuklā tu saptamī — the bright-fortnight Saptamī."],["For an afflicted person, there is no rule regarding fortnight or month. When half a watch remains, one should perform tooth cleaning.","ārtasya — for an afflicted person; tu — indeed; na niyamaḥ — there is no rule; pakṣa-māsa-kṛtaḥ — concerning fortnight or month; bhavet — may be; ardha-prahara-śeṣe — when half a watch remains; tu — indeed; kuryāt vai — one should perform; danta-dhāvanam — tooth-cleaning."],["I shall tell the trees desired for the fifth day. With Madhūka there is gain of a son, and Mārkava becomes a remover of sorrow.","pañcamyām — on the fifth day; tatra — there; ye vṛkṣāḥ — which trees; kāmitāḥ — desired; tān vadāmi aham — I shall tell them; madhūke — with Madhūka; putra-lābhaḥ syāt — there would be gain of a son; duḥkha-hā — remover of sorrow; mārkavaḥ bhavet — Mārkava would be."],["With Badarī and Bṛhatī one is quickly freed from disease. Prosperity comes from bilva, and accumulation from khadira.","badaryā — with Badarī; ca bṛhatyā — and with Bṛhatī; kṣipram — quickly; rogāt pramucyate — one is freed from disease; aiśvaryam — prosperity; ca bhavet — comes; bilvaiḥ — from bilva; khadireṇa — from khadira; ca saṃcayaḥ — and accumulation."],["Destruction of enemies comes from kadamba, gain of wealth from atimukta, and from what arises from āṭaruṣa one attains importance everywhere.","śatru-kṣayaḥ — destruction of enemies; kadambeṣu — with kadamba; artha-lābhaḥ — gain of wealth; ati-muktake — with atimukta; gurutām yāti — one attains importance; sarvatra — everywhere; āṭaruṣaka-saṃbhavaiḥ — by what arises from āṭaruṣa."],["Aśvattha brings prominence among kin and bestows fame. From Karavīra comes firm knowledge, without doubt.","jñāti-pradhānatām yāti — one attains prominence among kin; aśvatthaḥ — Aśvattha; yacchate yaśaḥ — bestows fame; karavīrāt — from Karavīra; parijñānam — knowledge; acalam syāt — becomes firm; na saṃśayaḥ — without doubt."],["One obtains abundant prosperity by the placement of Śirīṣa. For one serving Priyaṅgu, the highest good fortune arises.","śriyam — prosperity; prāpnoti — one obtains; vipulām — abundant; śirīṣasya niveśane — by offering Śirīṣa; priyaṅgum — Priyaṅgu; sevyamānasya — for one serving; saubhāgyam paramam — the highest good fortune; bhavet — comes to be."],["For accomplishing the desired aim, seated comfortably and restraining speech, having placed the desired wish in the heart and invoked it, the wise one should chew the tooth stick with this mantra.","abhīpsita-artha-siddhy-artham — for accomplishing the desired aim; sukha-āsīnaḥ — seated comfortably; atha — then; vāk-yataḥ — restraining speech; kāmam — the desired wish; yathā-iṣṭa-hṛdaye kṛtvā — placing in the heart as desired; samabhimantrya ca — and having invoked; mantreṇa anena — with this mantra; mati-mān — the wise one; aśnīyāt — should eat/chew; danta-dhāvanam — the tooth-stick."],["Having given a boon, you know, O desire giving plant. Grant me success always, O tooth stick. Homage to you.","varam dattvā — granting a boon; abhijānāsi — you are known/understood; kāma-dam — wish-fulfilling; ca — and; vanaspate — O plant; siddhim prayaccha me — grant me success; nityam — always; danta-kāṣṭha — O tooth-stick; namaḥ astu te — homage to you."],["Having recited thus three times, one should chew the tooth stick. Afterwards, having rinsed the wood, one should place it in a clean place.","trīn vārān — three times; parijapya — having recited; evam — thus; bhakṣayet — one should chew; danta-dhāvanam — the tooth-stick; paścāt — afterward; prakṣālya — having rinsed; kāṣṭham tu — the wood; śucau deśe — in a clean place; vinikṣipet — one should place."],["If it falls upward, there is success, and likewise if it lies facing one. If it falls otherwise, one should pick it up and cast it again.","ūrdhve nipatite — if fallen upward; siddhiḥ — success; tathā — likewise; ca abhimukhe sthite — if it lies facing one; ataḥ anyathā tu — but otherwise; patite — if fallen; ānīya — having brought it back; punaḥ utsṛjet — one should cast it again."],["If the tooth stick is turned away after three rounds, one should know it to be unsuccessful. That Saptamī is not to be accepted.","parāṅ-mukham — turned away; yadi bhavet — if it becomes; trīn vārān — three times; danta-dhāvanam — the tooth-cleaning; asiddhām — unsuccessful; tu vijānīyāt — one should know; na grāhyā — not to be undertaken; sā tu saptamī — that Saptamī."],["A brahmacārin should sleep that night in auspicious service, wearing uninjured clothing, pure, and endowed with proper conduct.","brahma-cārī — a brahmacārin; tu — indeed; tām rātrim — that night; svapet — should sleep; maṅgala-sevayā — engaged in auspicious service; bibhrat — wearing; vāsas — clothing; anupahatam — uninjured; śuciḥ — pure; ācāra-saṃyutaḥ — joined with proper conduct."],["When that night has passed, rising in the morning, O bird, the wise one should rinse his mouth and chew the tooth stick.","tasyām rātryām — that night; vyatītāyām — having passed; prātaḥ — in the morning; utthāya — having risen; vai — indeed; khaga — O Bird; prakṣālayet mukham — one should rinse the mouth; dhī-mān — the wise one; aśnīyāt — should chew; danta-dhāvanam — the tooth-stick."],["Having sat down and become pure, and bowed with the head to Ravi, having performed japa as desired, one should offer into the fire.","upaviśya — having sat down; śuciḥ bhūtvā — having become pure; praṇamya śirasā ravim — having bowed with his head to Ravi; japam yathā-iṣṭam kṛtvā tu — having performed japa as desired; juhuyāt ca — and should offer; hutāśane — into the fire."],["Then in the afternoon, having bathed with earth, cow dung, and water, having properly undertaken the observance, silent, dressed in white, and pure,","tataḥ — then; aparāhna-samaye — in the afternoon; snātvā — having bathed; mṛt-go-maya-ambubhiḥ — with earth, cow-dung, and water; vidhi-vat — properly; niyamam kṛtvā — having undertaken the observance; maunī — silent; śukla-ambaraḥ — dressed in white; śuciḥ — pure."],["Having worshipped with devotion the God of gods, Divākara, one should sleep before the deity, intent on Gāyatrī japa.","pūjayitvā — having worshipped; vidhim — according to rule; bhaktyā — with devotion; deva-devam — the God of gods; divākaram — Divākara; svapet — should sleep; devasya purataḥ — before the deity; gāyatrī-japa-tat-paraḥ — intent on Gāyatrī-japa."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:193,verseCount:21,subtitle:"Chapter 193 — Tooth-Stick Procedure",colophon:""},T);</script></body></html>
