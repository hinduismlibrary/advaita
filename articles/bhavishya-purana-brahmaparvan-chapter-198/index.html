<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 198 — Description of the Vyāsa–Bhīṣma Dialogue."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 198 — Description of the Vyāsa–Bhīṣma Dialogue — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 198 — Description of the Vyāsa–Bhīṣma Dialogue</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Śatānīka said. What is the one deity in the world, and what indeed is the one refuge. Praising whom, worshipping whom, do humans attain good.","kim — what; ekam daivatam — one deity; loke — in the world; kim vā — and what; ekam parāyaṇam — one refuge; stuvantaḥ — praising; kam — whom; kam arcataḥ — whom worshipping; prāpnuyuḥ — would attain; mānavāḥ — humans; śubham — good."],["What is dharma among all dharmas, and who is considered worthy of worship by you. Whom do Brahmā and the others worship, and who is first among the dwellers in the three heavens.","kaḥ dharmaḥ — what dharma; sarva-dharmāṇām — among all dharmas; kaḥ ca — and who; pūjyaḥ — worthy of worship; mataḥ tava — considered by you; brahma-ādayaḥ — Brahmā and the others; kam arcanti — whom do they worship; kaḥ ca ādiḥ — and who is first; tri-diva-okasām — among the dwellers of the three heavens."],["Sumantu said. Here I shall tell you the sin destroying dialogue of Bhīṣma, O tiger among men, and the great souled Vyāsa.","atra — here; aham — I; te — to you; pravakṣyāmi — shall tell; saṃvādam — dialogue; pāpa-nāśanam — sin-destroying; bhīṣmasya — of Bhīṣma; nara-śārdūla — O tiger among men; vyāsasya ca — and of Vyāsa; mahātmanaḥ — the great-souled."],["Sumanthu saw Mahāvyāsa seated comfortably on the bank of the Gaṅgā, O best of the twice born, very radiant like blazing fire.","sukha-āsīnam — seated comfortably; mahā-vyāsam — the great Vyāsa; gaṅgā-kūle — on the bank of the Gaṅgā; dvija-uttama — O best of the twice-born; tam dṛṣṭvā — seeing him; su-mahā-tejāḥ — greatly radiant; jvalantam iva — as if blazing; pāvakam — fire."],["The god Nārāyaṇa himself, equal to the Sun in radiance, the hero bowed his head to him, the supreme abode of all śāstras.","sākṣāt — himself; nārāyaṇam devam — the god Nārāyaṇa; tejasā — in radiance; āditya-sannibham — equal to the Sun; praṇamya — having bowed; śirasā — with the head; vīra — O hero; sarva-śāstra-ālayam — the abode of all śāstras; param — highest."],["The maker of the Mahābhārata, the highest touchstone of Veda meaning, the teacher of the supreme sages and royal sages, O Bhārata.","mahābhārata-kartāram — maker of the Mahābhārata; veda-artha-nikaṣam — touchstone of Veda-meaning; param — highest; ācāryam — teacher; parama-ṛṣīṇām — of the greatest seers; rāja-ṛṣīṇām ca — and of royal seers; bhārata — O Bharata."],["The maker of the Kuru lineage, my highest deity, was asked by the tiger of the Kurus, endowed with devotion to the twice born.","kartāram — maker; kuru-vaṃśasya — of the Kuru lineage; daivatam — deity; paramam — highest; mama — my; papraccha — asked; kuru-śārdūlaḥ — the tiger among Kurus; dvija-bhaktyā — with devotion to the twice-born; samanvitaḥ — endowed."],["The great souled, greatly radiant Bhīṣma then asked the sage about the greatness of Bhāskara, the God of gods, abiding in the mind.","deva-devasya — of the God of gods; māhātmyam — majesty; citta-stham — abiding in the mind; bhāskarasya — of Bhāskara; tu — indeed; saḥ — he; mahātmā — great-souled; mahā-tejāḥ — greatly radiant; bhīṣmaḥ — Bhīṣma; pūrvam — formerly; munim — the sage; tathā — thus."],["Bhīṣma said. O Bhagavān, O best of the twice born, Pārāśarya, great minded one, all lore, with the moving and unmoving, has been told to me by you.","bhagavan — O Bhagavan; dvija-śārdūla — O tiger among twice-born; pārāśarya — O Pārāśarya; mahā-mate — O great-minded; mama — to me; ākhyātam — told; tvayā — by you; sarvam vāṅmayam — all lore; sa-cara-acaram — with moving and unmoving."],["Even now my doubt about Bhāskara remains, O best of sages. First the salutation to him, then that of the others.","bhāskarasya — about Bhāskara; muni-śreṣṭha — O best of sages; saṃśayaḥ — doubt; adya api — even now; vartate — remains; ādau — first; tasya — to him; namaskāram — homage; anyeṣām — to the others; tat-anantaram — thereafter."],["Tell me truly, with reason, about Brahmā and the others, Rudra and the rest. Who is this Bhāskara, O Brahman, from where was he born, and what is he called.","brahma-ādīnām — about Brahmā and the others; rudra-ādyaiḥ — and Rudra and the rest; brūhi — tell; tattvena — truly; hetunā — with reason; kaḥ eṣaḥ — who is this; bhāskaraḥ — Bhāskara; brahman — O Brahman; kutaḥ jātaḥ — from where born; kaḥ ucyate — what is he called."],["Tell it in due order, for my curiosity is indeed great. You are skilled in the world, therefore you are fit to speak.","kīrtayasva — tell; yathā-nyāyam — in due order; kautukam — curiosity; hi — indeed; param — great; mama — my; kuśalaḥ — skilled; hi — indeed; bhavān — you; loke — in the world; tasmāt — therefore; tvam — you; vaktum arhasi — are fit to speak."],["Vyāsa said. Ah, you are greatly confused, no doubt. The perfected gods beginning with Brahmā praise and worship him with pūjā.","aho — ah; tava — your; mahat kaṣṭam — great difficulty; pramūḍhaḥ asi — you are confused; na saṃśayaḥ — no doubt; stuvantaḥ — praising; ca — and; tam — him; arcābhiḥ — with worship; siddhāḥ surāḥ — perfected gods; brahma-ādayaḥ — beginning with Brahmā."],["Of all the gods Āditya is called the origin. He destroys all the darkness situated in the directions and intermediate directions.","sarveṣām eva — of all indeed; devānām — gods; ādiḥ — origin; ādityaḥ — the Sun; ucyate — is called; saḥ — he; hanti — destroys; timiram — darkness; sarvam — all; dik-vidikṣu — in directions and intermediate directions; vyavasthitam — situated."],["He is the dharma of all dharmas, and he is considered the most worthy of worship. Brahmā and the others worship him, and he is the first of the dwellers in heaven.","saḥ — he; dharmaḥ — dharma; sarva-dharmāṇām — of all dharmas; saḥ ca — and he; pūjya-tamaḥ — most worthy of worship; mataḥ — considered; brahma-ādayaḥ — Brahmā and the others; tam arcanti — worship him; saḥ ca ādiḥ — and he is first; tri-diva-okasām — of the dwellers in heaven."],["Aditi is the chaste wife of Kaśyapa, and therefore he is called Āditya. Or because he is the first maker, he is called Āditya.","aditiḥ — Aditi; kaśyapa-satī — the chaste wife of Kaśyapa; ādityaḥ — Āditya; tena — therefore; ca ucyate — he is called; ādi-kartā — first maker; atha vā — or; yasmāt — because; tasmāt — therefore; ādityaḥ ucyate — he is called Āditya."],["From Āditya this whole world proceeds, with gods, asuras, gandharvas, yakṣas, serpents, and rākṣasas.","tasmāt — from him; etat sarvam jagat — this whole world; ādityāt — from Āditya; sampravartate — proceeds; sa-deva-asuram — with gods and asuras; sa-gandharvam — with gandharvas; sa-yakṣa-uraga-rākṣasam — with yakṣas, serpents, and rākṣasas."],["Rudra and Upendra, and likewise Indra, Brahmā, Dakṣa, and Kaśyapa, all have Āditya as their deity, as do the other gods and dānavas.","rudra — Rudra; upendrau — and Upendra; tathā — likewise; indraḥ — Indra; brahmā — Brahmā; dakṣaḥ — Dakṣa; atha — and; kaśyapaḥ — Kaśyapa; āditya-devatāḥ — deities of Āditya; sarve — all; tathā — likewise; anye — other; deva-dānavāḥ — gods and demons."],["Virinci arose from the mouth, and Rudra from the chest. Upendra from the right hand, and Dhātā likewise from the left hand.","mukhāt — from the mouth; bhūtaḥ — arose; virinciḥ — Virinci; tu — indeed; rudraḥ — Rudra; vakṣaḥ-sthalāt — from the chest; tataḥ — then; upendraḥ — Upendra; dakṣiṇāt hastāt — from the right hand; dhātā — Dhātā; vāma-karāt tathā — likewise from the left hand."],["Dakṣa from the sole of the left foot, and Kaśyapa from the right. Thus were born the other gods, asuras, humans, and birds. Therefore Āditya is worshipped among all the gods.","vāma-pāda-talāt — from the sole of the left foot; dakṣaḥ — Dakṣa; dakṣiṇāt — from the right; kaśyapaḥ tathā — likewise Kaśyapa; iti — thus; utpannāḥ — born; tathā — likewise; anye — others; deva-asura-nara-khagāḥ — gods, asuras, humans, and birds; tena — therefore; asau — that; devaḥ — god; ādityaḥ — Āditya; sarva-deveṣu — among all gods; pūjitaḥ — is worshipped."],["Bhīṣma said. If Bhāskara is thus sung in the directions and intermediate directions, if this is his power, Pārāśarya, Lord of the world,","yadi — if; ittham — thus; gīyate — is sung; vīra — O hero; dik-vidikṣu — in directions and intermediate directions; saḥ bhāskaraḥ — that Bhāskara; yadi — if; tasya — his; prabhāvaḥ ayam — this power; pārāśarya — O Pārāśarya; jagat-pate — O Lord of the world."],["For what reason is he overcome by rākṣasas at the three sandhyās, protected again by the twice born, and again moving like a wheel. Why is he seized by Rāhu, though not to be seized, O best of the twice born.","saḥ — he; kim artham — for what reason; tri-sandhyam — at the three junctions; rākṣasaiḥ — by rākṣasas; paribhūyate — is overcome; dvijaiḥ — by twice-born ones; saṃrakṣyate — is protected; bhūyaḥ — again; cakra-vat — like a wheel; bhramati — moves; punaḥ — again; rāhuṇā — by Rāhu; gṛhyate — is seized; agrahyaḥ — not to be seized; tat kim artham — why is that; dvija-uttama — O best of twice-born."],["Vyāsa said. Piśācas, serpents, rākṣasas, ḍākinīs, and dānavas, Dakṣiṇāgni burns them in anger, and Bhāskara attacks them.","piśāca-uraga-rakṣāṃsi — piśācas, serpents, and rākṣasas; ḍākinī-dānavān — ḍākinīs and dānavas; tathā — likewise; dakṣiṇa-agniḥ — Dakṣiṇāgni; dahet — burns; krodhāt — in anger; tam — them; ākrāmati — attacks; bhāskaraḥ — Bhāskara."],["At the three sandhyās the three gods are present in the orb of Ravi. This is the power of a muhūrta, and likewise in what is difficult and what is seen.","tri-sandhyam — at the three junctions; tu — indeed; trayaḥ devāḥ — three gods; sānnidhyam — presence; ravi-maṇḍale — in the orb of Ravi; muhūrtasya — of a muhūrta; prabhāvaḥ ayam — this is the power; asādhye — in what is difficult to accomplish; dṛṣṭake — in what is seen; tathā — likewise."],["With reference to that one alone, dharma proceeds in the world. When he is bowed to and praised, all the gods are bowed to.","tam ekam eva — that one alone; uddiśya — with reference to; loke — in the world; dharmaḥ — dharma; pravartate — proceeds; namaskṛte — when bowed to; stute — praised; tasmin — he; sarve devāḥ — all gods; namaskṛtāḥ — are bowed to."],["At the three sandhyās Bhāskara is bowed to three times by the gods of the earth. Rāhu is situated beneath the orb of Āditya, no doubt.","tri-sandhyam — at the three junctions; vasudhā-devaiḥ — by the gods of the earth; bhāskaraḥ — Bhāskara; triḥ — three times; praṇamyate — is bowed to; rāhuḥ — Rāhu; āditya-bimbasya — of Āditya’s orb; sthitaḥ — situated; adhastāt — below; na saṃśayaḥ — no doubt."],["Desiring nectar, stationed in an aerial car as long as nectar flows, one should then declare the orb obscured by an aerial car to be an eclipse.","amṛta-arthī — desiring nectar; vimāna-sthaḥ — stationed in an aerial car; yāvat — as long as; saṃsravate — flows; amṛtam — nectar; vimāna-antaritam — obscured by another aerial car; bimbam — the orb; ādiśet — one should declare; grahaṇam — an eclipse; tataḥ — then."],["No one is able to overpower Āditya, who surely burns. Ravi moves for the knowledge of days, nights, and muhūrtas.","na kaścit — no one; dharṣitum — to oppress; śaktaḥ — able; ādityaḥ — Āditya; dahate — burns; dhruvam — surely; divā-rātri-muhūrtānām — of day, night, and muhūrtas; jñānāya — for knowledge; ākramate — moves across; raviḥ — Ravi."],["Without Āditya there is no night, no day, no tarpaṇa, nor adharma nor dharma. By him the moving and unmoving are seen.","na ādityena vinā — without Āditya; rātriḥ — night; na — not; dinam — day; na ca — nor; tarpaṇam — tarpaṇa; na adharmaḥ — no adharma; na atha vā dharmaḥ — nor dharma; tena — by him; dṛṣṭam — seen; cara-acaram — the moving and unmoving."],["Āditya indeed protects all. Āditya always creates. All this has been fully told, that which you asked of me.","ādityaḥ — Āditya; pāti — protects; vai — indeed; sarvam — all; ādityaḥ — Āditya; sṛjate — creates; sadā — always; etat sarvam — all this; samākhyātam — fully told; yat — what; pṛṣṭam — asked; bhavatā — by you; mama — of me."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:198,verseCount:30,subtitle:"Chapter 198 — Description of the Vyāsa–Bhīṣma Dialogue",colophon:""},T);</script></body>
