<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 192 — Saptāśvatilaka–Anūru Dialogue."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 192 — Saptāśvatilaka–Anūru Dialogue — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 192 — Saptāśvatilaka–Anūru Dialogue</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-191/">← Chapter 191</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">Chapter 193 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Terrible and producing terror for sinners and evildoers, [it is] to be reached by those in the womb, those being born, children, the young, and the middle-aged.","saṃtrāsa-jananam — producing terror; ghoram — terrible; pāpānām — for sinners; pāpa-kāriṇām — for evildoers; garbha-sthaiḥ — by those in the womb; jāyamānaiḥ — those being born; ca — and; bālaiḥ — by children; taruṇa-madhyamaiḥ — by the young and middle-aged."],["By women, men, eunuchs, and the old, it is to be gone to among all beings; there embodied beings must experience good and evil fruit.","strī-puṃ-napuṃsakaiḥ — by women, men, and eunuchs; vṛddhaiḥ — by the old; gantavyam — it must be gone to; sarva-jantuṣu — among all beings; śubha-aśubha-phalam — good and evil fruit; tatra — there; bhoktavyam — must be experienced; dehibhiḥ tathā — likewise by embodied beings."],["Whatever good and evil has been spoken near Dharmarāja by all the truthful ones established in dharma, beginning with Citragupta, that deed done must indeed be experienced, as judged.","citragupta-ādibhiḥ sarvaiḥ — by all, beginning with Citragupta; dharma-sthaiḥ — established in dharma; satya-vādibhiḥ — truthful speakers; proktam — spoken; vai — indeed; dharma-rājasya nikaṭe — near Dharmarāja; yat śubha-aśubham — whatever good and evil; avaśyam — surely; kṛtam karma — deed done; bhoktavyam — must be experienced; tat vicāritam — that is judged."],["Those who have done good deeds, are gentle-minded, and are endowed with compassion, go by a gentle way to the abode of Yama.","tatra — there; ye — those who; śubha-karmāṇaḥ — have done good deeds; saumya-cittāḥ — gentle-minded; dayā-anvitāḥ — endowed with compassion; te narāḥ — those people; yānti — go; saumyenā — by a gentle way; yathā — to; yama-niketanam — the dwelling of Yama."],["He who gives footwear, wood, and an umbrella to the foremost dvijas goes happily to the abode of Yama through great dharma.","yaḥ — whoever; pradadyāt — gives; dvija-indrāṇām — to the foremost dvijas; upānat — footwear; kāṣṭha — wood; chatram — umbrella; saḥ — he; dharmeṇa mahatā — through great dharma; sukham — happily; yāti — goes; yama-ālayam — to Yama’s abode."],["A man who enters a divine shrine wearing footwear, especially the inner sanctum, meets with terror.","sa-upānatkaḥ — wearing footwear; naraḥ — a man; yaḥ — who; deva-āyatanam — a divine shrine; āviśet — enters; viśeṣataḥ — especially; garbha-gṛham — the inner sanctum; saḥ — he; saṃtrāsam upāśnute — meets with terror."],["Gifts of footwear and food in particular: by this distinction of giving, a man goes easily to the city of Dharmarāja; therefore he should practise dharma.","sa-upānatkāni dānāni — gifts of footwear; tathā — and; annam tu viśeṣataḥ — food in particular; evam dāna-viśeṣeṇa — by this distinction of giving; dharma-rāja-puram — to the city of Dharmarāja; naraḥ — a man; yasmāt yāti sukhena eva — since he goes quite happily; tasmāt — therefore; dharmam samācaret — he should practise dharma."],["But those men who do cruel deeds and delight in sin, O Bird, go by the terrible southern way to the abode of Yama.","ye punaḥ — but those; krūra-karmāṇaḥ — doing cruel deeds; narāḥ — men; pāpa-ratāḥ — delighting in sin; khaga — O Bird; te — they; ghorena — by the terrible [way]; tathā — thus; yānti — go; dakṣiṇena — by the southern way; yama-ālayam — to the abode of Yama."],["The city of Vaivasvata is to be known as eighty-six thousand and eighty yojanas, established in many forms.","ṣaḍ-aśīti-sahasrāṇi — eighty-six thousand; yojanānām — yojanas; aśīti ca — and eighty; vaivasvata-puram — the city of Vaivasvata; jñeyam — is to be known; nānā-rūpam — of many forms; iti sthitam — thus established."],["It appears near to people of good conduct, and very far to sinners travelling by the dreadful way.","samīpa-stham iva ābhāti — appears as if nearby; narāṇām — to people; śubha-cāriṇām — of good conduct; pāpānām — to sinners; ati-dūra-stham — very far; tathā — and; raudreṇa gacchatām — for those travelling by the dreadful way."],["[The way is] joined with sharp thorns, covered with gravel, with razor-edged swords and stones.","tīkṣṇa-kaṇṭaka-yuktena — joined with sharp thorns; śarkarā-nicitena — heaped with gravel; ca — and; kṣura-dhāra-ati-nistriṃśaiḥ — with swords having very sharp razor edges; pāṣāṇaiḥ — with stones; cintitena — strewn/imagined."],["At some places, with a great sun and terrible pits, [they are] cut by iron stakes and furnished with swords.","kvacit — in some places; arkeṇa mahatā — by a great sun; duranta-khātakaiḥ — with terrible pits; loha-śaṅkubhiḥ — by iron stakes; ācchinnāḥ — cut; tathā — and; khaḍgaiḥ samanvitāḥ — furnished with swords."],["Then, by falling bright mountains crowded with trees and a rampart of pretas, the distressed go along the road.","tataḥ — then; patadbhiḥ — by falling; vimalaiḥ parvataiḥ — bright mountains; vṛkṣa-saṃkulaiḥ — crowded with trees; preta-prākāra-yuktena — with a rampart of pretas; yānti — they go; mārgeṇa — along the road; duḥkhitāḥ — distressed."],["In some places with uneven pits, in others with slippery clods, with very hot sand and sharp stakes.","kvacit — in some places; viṣama-gartābhiḥ — with uneven pits; kvacit — in others; loṣṭaiḥ sa-picchalaiḥ — with clods and slippery things; su-tapta-vālukābhiḥ — with very hot sand; tathā — and; tīkṣṇaiḥ śaṅkubhiḥ — with sharp stakes."],["At times covered by bamboo forests woven with many branches, along a difficult, very dreadful, unsupported road of darkness.","aneka-śākhā-racitaiḥ — woven with many branches; vyāptaiḥ — covered; vaṃśa-vanaiḥ — with bamboo forests; kvacit — at times; kaṣṭena — with difficulty; tamasaḥ mārge — on the road of darkness; anālambe — unsupported; su-dāruṇi — very dreadful."],["Then in some places covered with thorny thickets and forest fire, in others with heated stones, and in others covered with snow.","atha — then; śṛṅgāṭakaiḥ — with thorny thickets; vyāptaiḥ — covered; kvacit — in some places; dāva-agninā — with forest fire; punaḥ — again; kvacit — in some places; tapta-śilābhiḥ — with heated stones; ca — and; kvacit — in some places; vyāptam himena — covered with snow."],["In some places they are plunged up to the throat in sand; in others it is filled with foul water, and in others with burning dung.","kvacit — in some places; vālukayā vyāptam — covered with sand; ākaṇṭha-antam — up to the throat; praveśayet — one makes [them] enter; kvacit — in some places; duṣṭa-ambunā vyāptam — filled with foul water; kvacit ca — and in some places; kariṣa-agninā — with burning dung."],["In some places with lions, in some with tigers, with fierce biting insects; in some places with huge leeches, and again with pythons.","kvacit — in some places; siṃhaiḥ — with lions; kvacit — in some places; vyāghraiḥ — with tigers; daṃśaiḥ — with biting insects; kīṭaiḥ ca dāruṇaiḥ — and with fierce insects; kvacit — in some places; mahā-jalaukābhiḥ — with huge leeches; kvacit ca — and in some places; ajagaraiḥ — with pythons."],["With fierce flies in some places, with highly poisonous snakes, and with mighty young elephants, maddened by strength and trampling.","makṣikābhiḥ — with flies; ca raudrābhiḥ — fierce; kvacit — in some places; sarpaiḥ viṣa-ulbaṇaiḥ — with snakes of intense poison; mahā-gaja-indra-yūnaiḥ — with mighty young elephants; bala-unmattaiḥ — maddened by strength; pramāthibhiḥ — trampling."],["With great bulls whose sharp horns furrow the road, with great-horned buffaloes, and with camels maddened and intoxicated.","panthānam ullikhadbhiḥ — furrowing the road; tīkṣṇa-śṛṅgaiḥ — with sharp horns; mahā-vṛṣaiḥ — with great bulls; mahā-śṛṅgaiḥ ca — and with great horns; mahiṣaiḥ — with buffaloes; uṣṭraiḥ — with camels; mattaiḥ — maddened; mada-āturaiḥ — intoxicated."],["Tormented indeed by fierce ḍākinīs, hideous rākṣasas, and very terrible diseases, they go on.","ḍākinībhiḥ — by ḍākinīs; ca raudrābhiḥ — fierce; vikrālaiḥ rākṣasaiḥ — by hideous rākṣasas; vyādhibhiḥ — by diseases; mahā-ghoraiḥ — very terrible; pīḍyamānāḥ — tormented; vrajanti hi — they indeed proceed."],["Struck by a wind mixed with great nooses, extremely fierce, and by a rain of huge stones, they go without shelter.","mahā-pāśa-vimiśreṇa — mixed with great nooses; mahā-caṇḍena vāyunā — by an extremely fierce wind; mahā-pāṣāṇa-varṣeṇa — by a rain of huge stones; hanyamānāḥ — being struck; nirāśrayāḥ — without shelter."],["They go indeed, torn by lightning strikes in some places, struck by falling clusters of thunderbolts and by dreadful meteors.","kvacit — in some places; vidyut-prapātena — by lightning strikes; dīryamāṇāḥ — being torn; vrajanti hi — they indeed go; patadbhiḥ — by falling; vajra-saṃghātaiḥ — clusters of thunderbolts; ulkā-pātaiḥ ca dāruṇaiḥ — and dreadful meteor-falls."],["They go, burning from a rain of blazing coals; they go, tormented by the great dark [force].","pradīpta-aṅgāra-varṣeṇa — by a rain of blazing coals; dahyamānāḥ — burning; vrajanti hi — they indeed go; mahā-andhakāra-śukreṇa — by the great dark [force]; pīḍyamānāḥ — tormented; vrajanti hi — they indeed go."],["They are frightened again and again by the dreadful thunder of great clouds, and are filled all around with sharp stones.","mahā-megha-ravaiḥ — by the thunder of great clouds; ghoraiḥ — dreadful; vitrasyante — they are frightened; muhuḥ muhuḥ — again and again; tīkṣṇa-pāṣāṇa-yuktena — with sharp stones; pūryamāṇāḥ — being filled; samantataḥ — all around."],["They proceed, afflicted by great streams of razor-sharp water; they are frightened again and again by the dreadful thunder of great clouds.","mahā-kṣura-ambu-dhārābhiḥ — by great streams of razor-sharp water; sevyamānāḥ — afflicted/served; vrajanti hi — they indeed proceed; mahā-megha-ravaiḥ ghoraiḥ — by dreadful thunder of great clouds; vitrasyante — they are frightened; muhuḥ muhuḥ — again and again."],["By a fiercely cold, sharp, and dry wind, on a dreadful road without provisions","bhṛśam — fiercely; śītena — by cold; tīkṣṇena — sharp; rūkṣeṇa — dry; mārutena ca — and by wind; ittham — thus; mārgeṇa raudreṇa — by a dreadful road; pātheya-rahitena ca — and without provisions."],["unsupported, dangerous, deserted all around, without rest, great and difficult to escape","nirālam­bena — unsupported; durgeṇa — dangerous; nirjanena — deserted; samantataḥ — all around; aviśrāmeṇa — without rest; mahatā — great; vigata-āpāya-durdharaiḥ — difficult to escape from danger."],["all embodied beings who are deluded and evildoers are led. Knowing this, a man should do merit and abandon sin; by merit he goes to divinehood, by sin he goes to hell.","nīyante — are led; dehinaḥ sarve — all embodied beings; ye mūḍhāḥ — who are deluded; pāpa-kāriṇaḥ — evildoers; iti jñātvā — knowing thus; naraḥ — a man; kuryāt puṇyam — should do merit; pāpam ca varjayet — and abandon sin; puṇyena — by merit; yāti devatvam — he goes to divinehood; pāpena — by sin; narakam vrajet — he goes to hell."],["Those by whom the Lord of gods, Ravi, has been worshipped even a little in the mind, never see the face of Yama, O Bird.","yaiḥ — by whom; manāk api — even a little; deva-īśaḥ — the Lord of gods; manasā pūjitaḥ raviḥ — Ravi worshipped in the mind; te — they; kadā api na paśyanti — never see; yamasya vadanam — the face of Yama; khaga — O Bird."],["But because of very terrible sins, for a little time by your command they become kings of pretas; then they go to the city of Ravi.","kiṃ tu — but; pāpaiḥ mahā-ghoraiḥ — because of very terrible sins; kiñcit kālam — for a little time; tava ājñayā — by your command; bhavanti — they become; preta-rājānaḥ — kings of pretas; tataḥ — then; yānti — they go; raveḥ puram — to the city of Ravi."],["Those who on earth worship Bhāskara with their whole being are not stained by sin, like a lotus leaf by water.","ye — those who; punaḥ — indeed; sarva-bhāvena — with their whole being; bhajante — worship; bhuvi — on earth; bhāskaram — Bhāskara; na te lim­panti — they are not stained; pāpena — by sin; padma-patram iva — like a lotus leaf; ambhasā — by water."],["Therefore a man should constantly practise devotion to Bhāskara; whoever desires abundant wealth should worship Bhānu with faith.","tasmāt — therefore; prakuryāt — should practise; bhaktim — devotion; vai — indeed; bhāskare — to Bhāskara; satatam — constantly; naraḥ — a man; śraddhayā — with faith; pūjayet bhānum — should worship Bhānu; yaḥ icchet — whoever desires; vipulam dhanam — abundant wealth."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:192,verseCount:33,subtitle:"Chapter 192 — Saptāśvatilaka–Anūru Dialogue",colophon:""},T);</script></body></html>
