<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 188 — Honoring the Sun Priests."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 188 — Honoring the Sun Priests — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-2" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 188 — Honoring the Sun Priests</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-187/">← Chapter 187</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-189/">Chapter 189 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-2"></script><script>const R=[["The Seven-Horsed Sun said: One should offer all cooked food to the Sun and make an offering into the fire. Having made the fire offering, O hero, one should place ritual offerings throughout all directions.","sūryāya — to the Sun; sarva-pāka-annam — all cooked food; nivedya — having offered; agnau — in the fire; ca — and; homayet — one should make an oblation; hutvā agnau — having offered in the fire; prakṣipet — one should cast; balim — bali; dikṣu samantataḥ — in all directions all around.","सप्ताश्व उवाच ।। सूर्याय सर्वपाकान्नं निवेद्याग्नौ च होमयेत् ।। हुत्वाग्नौ प्रक्षिपेद्वीर बलिं दिक्षु समंततः ॥ १ ॥"],["Whoever eats for himself each day all cooked food meant for the Sun, fire, teacher, and Brahmins without first offering it eats sin.","sūrya-agni-guru-viprāṇām — for the Sun, fire, guru, and vipras; sarva-pāka-annam — all cooked food; anvaham — every day; yaḥ — whoever; anivedya — without offering; ātmanā bhuṅkte — eats for himself; saḥ naraḥ — that man; kilbiṣam bhuṅkte — eats sin.","सूर्याग्निगुरुविप्राणां सर्वपाकान्नमन्वहम् ।। योऽनिवेद्यात्मना भुंक्ते स भुंक्ते किल्बिषं नरः ॥ २ ॥"],["Through farming, animal husbandry, trade, anger, loss of truth, and the rest, people’s sins increase, as also through the five slaughtering faults.","kṛṣi-pālye — in farming and tending; ca vāṇijye — and in trade; krodha-satya-kṣaya-ādibhiḥ — through anger, loss of truth, and the rest; puṃsām pāpāni — people’s sins; vardhante — increase; sūnā-doṣaiḥ ca pañcabhiḥ — and through the five slaughtering faults.","कृषिपाल्ये च वाणिज्ये क्रोधसत्यक्षयादिभिः ।। पुंसां पापानि वर्धंते सूनादोषैश्च पंचभिः ॥ ३ ॥"],["The pounding block, grinding stone, hearth, water jar, and broom are a householder’s five slaughtering places; because of them he does not go to heaven.","kaṇḍanī — pounder; peṣaṇī — grinder; cullī — hearth; uda-kumbhaḥ — water-pot; pramārjanī — broom; pañca sūnāḥ — five slaughtering places; gṛhasthasya — of a householder; tena — because of them; svargam na gacchati — he does not go to heaven.","कंडनी पेषणी चुल्ली उदकुंभः प्रमार्जनी ।। पंच सूना गृहस्थस्य तेन स्वर्गं न गच्छति ॥ ४ ॥"],["Through worship of the Sun, fire, and teacher, one is not stained by these sins or other terrible transgressions; therefore one should always worship them.","sūrya-agni-guru-pūjābhiḥ — by worship of the Sun, fire, and guru; pāpaiḥ etaiḥ — by these sins; na lipyate — one is not stained; anyaiḥ ca — and by other; pātakaiḥ ghoraiḥ — terrible transgressions; tasmāt — therefore; sampūjayet sadā — one should always worship.","सूर्याग्निगुरुपूजाभिः पापैरेतैर्न लिप्यते ।। अन्यैश्च पातकैघोरैस्तस्मात्संपूजयेत्सदा ॥ ५ ॥"],["For as many portions of food as are offered to the Sun, fire, and teacher, for that many thousand years the giver dwells in the Sun’s city.","sūrya-agni-guru-naivedyam — the offering to the Sun, fire, and guru; yāvat syāt — however many there may be; anna-saṃkhyayā — by the count of food portions; tāvat varṣa-sahasrāṇi — for that many thousands of years; dātā — the giver; sūrya-pure — in the city of the Sun; vaset — dwells.","सूर्याग्निगुरुनैवेद्यं यावत्स्यादन्नसंख्यया ।। तावद्वर्षसहस्राणि दाता सूर्यपुरे वसेत् ॥ ६ ॥"],["Food offered with ghee and cakes earns tenfold merit; with accompaniments, a hundredfold, O bird.","ghṛta-pūpa-yutaiḥ — with ghee-cakes; siktaiḥ — sprinkled; puṇyam — merit; daśa-guṇa-uttaram — tenfold; avadaṃśa-guṇaiḥ yuktam — joined with the qualities/portions of side-dishes; puṇyam — merit; śata-guṇam — hundredfold; khaga — O Bird.","घृतपूपयुतैः सिक्तैः पुण्यं दशगुणोत्तरम् ।। अवदंशगुणैर्युक्तं पुण्यं शतगुणं खग ॥ ७ ॥"],["An offering of sixty-day rice yields a thousandfold fruit; an offering of fragrant rice is understood to yield ten thousandfold.","ṣaṣṭika-audana-naivedyam — an offering of ṣaṣṭika rice; sahasra-guṇitam phalam — fruit multiplied a thousandfold; su-gandha-śāli-naivedyam — an offering of fragrant śāli rice; vijñeyam — is to be understood; ayuta-uttaram — multiplied ten thousandfold.","षष्टिकौदननैवेद्यं सहस्रगुणितं फलम् ।। सुगंधशालिनैवेद्यं विज्ञेयमयुतोत्तरम् ॥ ८ ॥"],["Foods, meals, drinks, and gifts of every kind should always be offered to the Sun, fire, teacher, and virtuous people. Having offered the food stated above, one obtains imperishable fruit.","bhakṣya-anna-pāna-dānāni — gifts of eatables, food, and drink; tat-phalāni tathā tathā — their fruits in such and such measure; yat vā tat vā — whatever it may be; sadā deyam — should always be given; sūrya-agni-guru-sādhuṣu — to the Sun, fire, guru, and good people; bhakṣyam nivedya — having offered food; pūrvoktam — stated before; akṣayam phalam labhate — one obtains imperishable fruit.","भक्ष्यान्नपानदानानि तत्फलानि तथातथा ।। यद्वा तद्वा सदा देयं सूर्याग्निगुरुसाधुषु ।। भक्ष्यं निवेद्य पूर्वोक्तमक्षयं लभते फलम् ॥ ९ ॥"],["Whoever thus worships the Sun, God among gods, lifts his ancestors from all sins and leads them to heaven.","evam — thus; yaḥ — whoever; bhaktim kurute — performs devotion; deva-deve divākare — to Divākara, god of gods; saḥ — he; pitṝn — ancestors; sarva-pāpebhyaḥ — from all sins; samuddhṛtya — lifting out; divam nayet — leads to heaven.","एवं यः कुरुते भक्तिं देव देवे दिवाकरे ।। स पितॄन्सर्वपापेभ्यः समुद्धृत्य दिवं नयेत् ॥ १० ॥"],["By seeing the Sun one gains the merit of bathing in the Ganges; by bowing, O bird, one gains the purification of all sacred fords.","gaṅgā-snānam — bathing in the Gaṅgā; idam puṇyam — this merit; darśanāt raveḥ — from seeing Ravi; prāpnuyāt — one obtains; sarva-tīrtha-abhiṣekam — the ablution of all sacred fords; ca — and; praṇāmāt vindate — one obtains by bowing; khaga — O Bird.","गंगास्नानमिदं पुण्यं दर्शनात्प्राप्नुयाद्रवेः ।। सर्वतीर्थाभिषेकं च प्रणामाद्विंदते खग ॥ ११ ॥"],["Having bowed with the head to the Sun, one is freed from all sins. By serving him at twilight, one is honored in the Sun’s world.","mucyate — one is freed; sarva-pāpebhyaḥ — from all sins; praṇamya śirasā ravim — having bowed with the head to Ravi; śuśrūṣet — one should serve; ca — and; sandhyāyām — at twilight; sūrya-loke mahīyate — one is honoured in the world of the Sun.","मुच्यते सर्वपापेभ्यः प्रणम्य शिरसा रविम् ।। शुश्रूषेत च संध्यायां सूर्यलोके महीयते ॥ १२ ॥"],["Through him, Brahmā, Viṣṇu, and the Great Lord are worshipped at once; the ancestors and all gods too are worshipped in the Sun.","yugapat — at once; pūjitāḥ — worshipped; tena — by him; brahmā-viṣṇu-maheśvarāḥ — Brahmā, Viṣṇu, and Maheśvara; pitaraḥ — ancestors; sarva-devāḥ ca — and all gods; bhaveyuḥ pūjitāḥ — would become worshipped; ravau — in Ravi.","युगपत्पूजितास्तेन ब्रह्मविष्णु महेश्वराः ।। पितरः सर्वदेवाश्च भवेयुः पूजिता रवौ ॥ १३ ॥"],["His ancestors rejoice like farmers in a well-ploughed field when he, with devotion at the ancestor rite, feeds a Brahmin who lives by sacred recitation.","tuṣyanti — are pleased; pitaraḥ tasya — his ancestors; su-kṛṣṭena iva — as with a well-ploughed field; karṣukāḥ — farmers; yaḥ — whoever; śrāddhe — at śrāddha; bhojayet — feeds; bhaktyā — with devotion; brāhmaṇam — a Brāhmaṇa; japa-jīvinam — one who lives by japa.","तुष्यंति पितरस्तस्य सुकृष्टेनेव कर्षुकाः ।। यः श्राद्धे भोजयेद्भक्त्या ब्राह्मणं जपजीविनम् ॥ १४ ॥"],["Will someone in our family deliver us, O lord of birds—the one who, after worshipping the Sun at the ancestor rite, feeds a Brahmin who lives by sacred recitation?","api — indeed/would; naḥ kule — from our family; kañcit — someone; uddharet — raise; kim — would?; khaga-īśvara — O lord of birds; yaḥ — whoever; sampūjya ravim — having worshipped Ravi; śrāddhe — at śrāddha; bhojayet — feeds; japa-jīvinam — one who lives by japa.","अपि नः स कुले कंचिदुद्धरेत्किं खगेश्वर ।। यः संपूज्य रविं श्राद्धे भोजयेज्जपजीविनम् ॥ १५ ॥"],["His ancestors are satisfied, and the grandfathers sing: “Today the wise one in our family will feed a reciter.”","tṛpyanti — are satisfied; pitaraḥ tasya — his ancestors; gāyanti ca — and sing; pitāmahāḥ — the grandfathers: adya — today; naḥ kule — in our family; saḥ prājñaḥ — that wise one; vācakam bhojayiṣyati — will feed a reciter.","तृप्यंति पितरस्तस्य गायंति च पितामहाः ।। अद्य नः स कुले प्राज्ञो वाचकं भोजयिष्यति ॥ १६ ॥"],["Seeing the learned one in the Purana arrive and sit among them, all plants rejoice: “We too will go to the imperishable heaven.”","purāṇa-vidam — a knower of the Purāṇa; āyāntam — having come; dṛṣṭvā eva — on seeing; saha saṃsthitāḥ — remaining together; krīḍanti — rejoice/play; oṣadhayaḥ sarvāḥ — all the plants; yāsyāmaḥ — we shall go; svargam akṣayam — to imperishable heaven.","पुराणविदमायांतं दृष्ट्वैव सह संस्थिताः ।। क्रीडंत्योषधयः सर्वा यास्यामः स्वर्गमक्षयम् ॥ १७ ॥"],["For the blessing of the worlds and to test faith, ancestors and gods move about in the form of guests.","anugrahāya lokānām — for the blessing of the worlds; śraddhāyāḥ ca parīkṣaṇe — and for testing faith; caranti — move about; atithi-rūpeṇa — in the form of a guest; pitaraḥ — ancestors; devatāḥ tathā — and the gods.","अनुग्रहाय लोकानां श्रद्धायाश्च परीक्षणे ।। चरंत्यतिथिरूपेण पितरो देवतास्तथा ।। ॥ १८ ॥"],["Therefore, when a guest arrives, one should go before him with joined hands and offer welcome, a seat, water for the feet, a respectful water offering, a bath, food, a bed, and the rest.","tasmāt — therefore; atithim āyāntam — a guest arriving; agre gacchet — one should go before; kṛta-añjaliḥ — with joined hands; svāgata-āsana-pādya-arghya-snāna-anna-śayana-ādibhiḥ — with welcome, seat, foot-water, arghya, bath, food, bed, and the rest.","तस्मादतिथिमायांतमग्रे गच्छेत्कृतांजलिः ।। स्वागतासनपाद्यार्घ्यस्नानान्नशयनादिभिः ॥ १९ ॥"],["The wise should not consider whether a guest who arrives at the proper time is handsome or misshapen, dirty or wearing dirty garments.","rūpa-anvitam — handsome; virūpam vā — or misshapen; malinām — dirty; malināmbaram — wearing dirty clothes; velāyām — at the proper time; atithim prāptam — a guest who has arrived; paṇḍitaḥ — the wise person; na vicārayet — should not consider.","रूपान्वितं विरूपं वा मलिनं मलिनांबरम् ।। वेलायामतिथिं प्राप्तं पंडितो न विचारयेत् ॥ २० ॥"],["The Sun is always present in the bodies of the Sun-priests. Those who abandon the Sun-priests abide in every sin; head down and feet above, they fall into hell’s fires.","bhojakānām śarīreṣu — in the bodies of Bhojakas; nityam — constantly; sannihitaḥ raviḥ — Ravi is present; ye bhojakān tyajanti — those who abandon Bhojakas; anye — others; sarva-pāpeṣu avasthitāḥ — remain in all sins; adho-mukha-ūrdhva-pādāḥ — face downward, feet upward; te patanti — they fall; naraka-agniṣu — into hell fires.","भोजकानां शरीरेषु नित्यं सन्निहितो रविः ।। ये भोजकास्त्यजंत्यन्ये सर्वपापेष्ववस्थिताः ।। अधोमुखोर्द्ध्वपादास्ते पतंति नरकाग्निषु ॥ २१ ॥"],["Their mouths split by worms and their bodies heated by fire, they are tormented by dreadful weapons for the span of fourteen Indras.","kṛmibhiḥ bhinna-vadanāḥ — mouths split by worms; tapyamānāḥ ca vahninā — and heated by fire; pīḍyante — they are tormented; ca — and; āyudhaiḥ ghoraiḥ — by terrible weapons; yāvat — for as long as; indrāḥ caturdaśa — fourteen Indras.","कृमिभिर्भिन्नवदनास्तप्यमानाश्च वह्निना ।। पीड्यंते चायुधै र्घोंरैर्यावदिंद्राश्चतुर्दश ॥ २२ ॥"],["Those fools who listen to slander against Brahmins are especially cooked in hell by my will.","ye — those who; ca — and; apavādam — slander; śṛṇvanti — hear; vimūḍhāḥ — deluded; brāhmaṇeṣu — among Brāhmaṇas; vai — indeed; te — they; viśeṣeṇa — especially; pacyante — are cooked; narakeṣu — in hells; mat-icchayā — by my will.","ये चापवादं शृण्वंति विमूढा ब्राह्मणेषु वै ।। ते विशेषेण पच्यंते नरकेषु मदिच्छया ॥ २३ ॥"],["Of all recipients, the reciter is the best recipient. Therefore, with a composed mind, one should honor him with every effort.","sarveṣām eva pātrāṇām — of all recipients; sat-pātram — worthy recipient; jāpakaḥ paraḥ — the jāpaka is highest; tasmāt — therefore; sarva-prayatnena — with every effort; pūjayet — one should worship; su-samāhitaḥ — fully composed.","सर्वेषामेव पात्राणां सत्पात्रं जापकः परः ।। तस्मात्सर्वप्रयत्नेन पूजयेत्सुसमाहितः ॥ २४ ॥"]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1],sa:r[2]}]));renderBhavishyaLiveChapter({chapter:188,verseCount:24,preferEmbeddedSanskrit:true,subtitle:"Chapter 188 — Honoring the Sun Priests",colophon:""},T);</script></body></html>
