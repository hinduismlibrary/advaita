should offer all cooked food to the Sun and make an offering in the fire; having offered into the fire, O hero, one should cast bali all around in the directions.","sūryāya — to the Sun; sarva-pāka-annam — all cooked food; nivedya — having offered; agnau — in the fire; ca — and; homayet — one should make an oblation; hutvā agnau — having offered in the fire; prakṣipet — one should cast; balim — bali; dikṣu samantataḥ — in all directions all around."],["The man who each day eats for himself all cooked food meant for the Sun, fire, guru, and vipras without offering it, eats sin.","sūrya-agni-guru-viprāṇām — for the Sun, fire, guru, and vipras; sarva-pāka-annam — all cooked food; anvaham — every day; yaḥ — whoever; anivedya — without offering; ātmanā bhuṅkte — eats for himself; saḥ naraḥ — that man; kilbiṣam bhuṅkte — eats sin."],["In farming, animal tending, and trade, and through anger, loss of truth, and the rest, people’s sins increase, as also through the five faults of slaughter.","kṛṣi-pālye — in farming and tending; ca vāṇijye — and in trade; krodha-satya-kṣaya-ādibhiḥ — through anger, loss of truth, and the rest; puṃsām pāpāni — people’s sins; vardhante — increase; sūnā-doṣaiḥ ca pañcabhiḥ — and through the five slaughtering faults."],["The pounder, grinder, hearth, water-pot, and broom are the householder’s five slaughtering places; because of them he does not go to heaven.","kaṇḍanī — pounder; peṣaṇī — grinder; cullī — hearth; uda-kumbhaḥ — water-pot; pramārjanī — broom; pañca sūnāḥ — five slaughtering places; gṛhasthasya — of a householder; tena — because of them; svargam na gacchati — he does not go to heaven."],["By worship of the Sun, fire, and guru, one is not stained by these sins or by other terrible transgressions; therefore one should always worship.","sūrya-agni-guru-pūjābhiḥ — by worship of the Sun, fire, and guru; pāpaiḥ etaiḥ — by these sins; na lipyate — one is not stained; anyaiḥ ca — and by other; pātakaiḥ ghoraiḥ — terrible transgressions; tasmāt — therefore; sampūjayet sadā — one should always worship."],["For as many food portions as are in the offerings to the Sun, fire, and guru, for that many thousands of years the giver dwells in the city of the Sun.","sūrya-agni-guru-naivedyam — the offering to the Sun, fire, and guru; yāvat syāt — however many there may be; anna-saṃkhyayā — by the count of food portions; tāvat varṣa-sahasrāṇi — for that many thousands of years; dātā — the giver; sūrya-pure — in the city of the Sun; vaset — dwells."],["When sprinkled with ghee-cakes, the merit is tenfold; joined with side-dishes, the merit is hundredfold, O Bird.","ghṛta-pūpa-yutaiḥ — with ghee-cakes; siktaiḥ — sprinkled; puṇyam — merit; daśa-guṇa-uttaram — tenfold; avadaṃśa-guṇaiḥ yuktam — joined with the qualities/portions of side-dishes; puṇyam — merit; śata-guṇam — hundredfold; khaga — O Bird."],["An offering of ṣaṣṭika rice has a fruit multiplied a thousandfold; an offering of fragrant śāli rice is understood to be multiplied ten thousandfold.","ṣaṣṭika-audana-naivedyam — an offering of ṣaṣṭika rice; sahasra-guṇitam phalam — fruit multiplied a thousandfold; su-gandha-śāli-naivedyam — an offering of fragrant śāli rice; vijñeyam — is to be understood; ayuta-uttaram — multiplied ten thousandfold."],["Food, drink, and gifts of eatables, in whatever measure, should always be given to the Sun, fire, guru, and good people; having offered the food stated before, one obtains imperishable fruit.","bhakṣya-anna-pāna-dānāni — gifts of eatables, food, and drink; tat-phalāni tathā tathā — their fruits in such and such measure; yat vā tat vā — whatever it may be; sadā deyam — should always be given; sūrya-agni-guru-sādhuṣu — to the Sun, fire, guru, and good people; bhakṣyam nivedya — having offered food; pūrvoktam — stated before; akṣayam phalam labhate — one obtains imperishable fruit."],["Whoever thus performs devotion to the God, the god Divākara, lifts his ancestors out of all sins and leads them to heaven.","evam — thus; yaḥ — whoever; bhaktim kurute — performs devotion; deva-deve divākare — to Divākara, god of gods; saḥ — he; pitṝn — ancestors; sarva-pāpebhyaḥ — from all sins; samuddhṛtya — lifting out; divam nayet — leads to heaven."],["By seeing Ravi one obtains the merit of bathing in the Gaṅgā; by bowing, O Bird, one obtains the ablution of all sacred fords.","gaṅgā-snānam — bathing in the Gaṅgā; idam puṇyam — this merit; darśanāt raveḥ — from seeing Ravi; prāpnuyāt — one obtains; sarva-tīrtha-abhiṣekam — the ablution of all sacred fords; ca — and; praṇāmāt vindate — one obtains by bowing; khaga — O Bird."],["Having bowed with his head to Ravi, one is freed from all sins; and serving at twilight, one is honoured in the world of the Sun.","mucyate — one is freed; sarva-pāpebhyaḥ — from all sins; praṇamya śirasā ravim — having bowed with the head to Ravi; śuśrūṣet — one should serve; ca — and; sandhyāyām — at twilight; sūrya-loke mahīyate — one is honoured in the world of the Sun."],["By him Brahmā, Viṣṇu, and Maheśvara are worshipped at once; and the ancestors and all the gods become worshipped in Ravi.","yugapat — at once; pūjitāḥ — worshipped; tena — by him; brahmā-viṣṇu-maheśvarāḥ — Brahmā, Viṣṇu, and Maheśvara; pitaraḥ — ancestors; sarva-devāḥ ca — and all gods; bhaveyuḥ pūjitāḥ — would become worshipped; ravau — in Ravi."],["His ancestors are pleased, as farmers in a well-ploughed field, when he feeds with devotion at śrāddha a Brāhmaṇa who lives by japa.","tuṣyanti — are pleased; pitaraḥ tasya — his ancestors; su-kṛṣṭena iva — as with a well-ploughed field; karṣukāḥ — farmers; yaḥ — whoever; śrāddhe — at śrāddha; bhojayet — feeds; bhaktyā — with devotion; brāhmaṇam — a Brāhmaṇa; japa-jīvinam — one who lives by japa."],["Would he raise someone from our family, O lord of birds, who, having worshipped Ravi at śrāddha, feeds one who lives by japa?","api — indeed/would; naḥ kule — from our family; kañcit — someone; uddharet — raise; kim — would?; khaga-īśvara — O lord of birds; yaḥ — whoever; sampūjya ravim — having worshipped Ravi; śrāddhe — at śrāddha; bhojayet — feeds; japa-jīvinam — one who lives by japa."],["His ancestors are satisfied, and the grandfathers sing: ‘Today the wise one in our family will feed a reciter.’","tṛpyanti — are satisfied; pitaraḥ tasya — his ancestors; gāyanti ca — and sing; pitāmahāḥ — the grandfathers: adya — today; naḥ kule — in our family; saḥ prājñaḥ — that wise one; vācakam bhojayiṣyati — will feed a reciter."],["Seeing a knower of the Purāṇa who has come and sits with them, all the plants rejoice: ‘We shall go to imperishable heaven.’","purāṇa-vidam — a knower of the Purāṇa; āyāntam — having come; dṛṣṭvā eva — on seeing; saha saṃsthitāḥ — remaining together; krīḍanti — rejoice/play; oṣadhayaḥ sarvāḥ — all the plants; yāsyāmaḥ — we shall go; svargam akṣayam — to imperishable heaven."],["For the blessing of the worlds and for testing faith, the ancestors and gods move about in the form of a guest.","anugrahāya lokānām — for the blessing of the worlds; śraddhāyāḥ ca parīkṣaṇe — and for testing faith; caranti — move about; atithi-rūpeṇa — in the form of a guest; pitaraḥ — ancestors; devatāḥ tathā — and the gods."],["Therefore, when a guest arrives, one should go before him with joined hands, with welcome, a seat, water for the feet, arghya, bathing, food, a bed, and the rest.","tasmāt — therefore; atithim āyāntam — a guest arriving; agre gacchet — one should go before; kṛta-añjaliḥ — with joined hands; svāgata-āsana-pādya-arghya-snāna-anna-śayana-ādibhiḥ — with welcome, seat, foot-water, arghya, bath, food, bed, and the rest."],["The wise person should not consider whether the guest who arrives at the proper time is handsome or misshapen, dirty or wearing dirty clothes.","rūpa-anvitam — handsome; virūpam vā — or misshapen; malinām — dirty; malināmbaram — wearing dirty clothes; velāyām — at the proper time; atithim prāptam — a guest who has arrived; paṇḍitaḥ — the wise person; na vicārayet — should not consider."],["Ravi is constantly present in the bodies of Bhojakas. Those who abandon the Bhojakas remain in all sins; face downward and feet upward, they fall into the fires of hell.","bhojakānām śarīreṣu — in the bodies of Bhojakas; nityam — constantly; sannihitaḥ raviḥ — Ravi is present; ye bhojakān tyajanti — those who abandon Bhojakas; anye — others; sarva-pāpeṣu avasthitāḥ — remain in all sins; adho-mukha-ūrdhva-pādāḥ — face downward, feet upward; te patanti — they fall; naraka-agniṣu — into hell fires."],["Their mouths split by worms and their bodies heated by fire, they are tormented by terrible weapons for as long as there are fourteen Indras.","kṛmibhiḥ bhinna-vadanāḥ — mouths split by worms; tapyamānāḥ ca vahninā — and heated by fire; pīḍyante — they are tormented; ca — and; āyudhaiḥ ghoraiḥ — by terrible weapons; yāvat — for as long as; indrāḥ caturdaśa — fourteen Indras."],["Those deluded ones who hear slander among Brāhmaṇas are especially cooked in hells by my will.","ye — those who; ca — and; apavādam — slander; śṛṇvanti — hear; vimūḍhāḥ — deluded; brāhmaṇeṣu — among Brāhmaṇas; vai — indeed; te — they; viśeṣeṇa — especially; pacyante — are cooked; narakeṣu — in hells; mat-icchayā — by my will."],["Of all recipients, the jāpaka is the highest worthy recipient; therefore one should worship him with a fully composed mind, by every effort.","sarveṣām eva pātrāṇām — of all recipients; sat-pātram — worthy recipient; jāpakaḥ paraḥ — the jāpaka is highest; tasmāt — therefore; sarva-prayatnena — with every effort; pūjayet — one should worship; su-samāhitaḥ — fully composed."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:188,verseCount:24,subtitle:"Chapter 188 — Description of Honoring the Bhojakas",colophon:""},T);</script></body></html>
