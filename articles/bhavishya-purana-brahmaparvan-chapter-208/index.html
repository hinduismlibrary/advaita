<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 208 — The Seven Saptamī Vows."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 208 — The Seven Saptamī Vows — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 208 — The Seven Saptamī Vows</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-207/">← Chapter 207</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-209/">Chapter 209 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Śatānīka said: Tell me again of the Saptamī, for the pleasure of Bhāskara, O best of the twice-born. What becomes here of the man who fasts?","śatānīkaḥ uvāca — Śatānīka said; punaḥ — again; me brūhi — tell me; saptamyām — on Saptamī; prītaye — for the pleasure; bhāskarasya — of Bhāskara; dvija-uttama — O best of the twice-born; upoṣitaḥ — having fasted; bhavati — becomes; iha — here; naraḥ — a man; yaḥ tu — who indeed."],["Sumantu said: The seven Saptamīs have been told, O great-minded one. There are many more, O tiger among the Kurus; hear these further from me.","kathitāḥ — have been told; sapta saptamyaḥ — seven Saptamīs; punaḥ — again; asmin — in this; mahā-mate — O great-minded one; bahavaḥ — many; kuru-śārdūla — O tiger among the Kurus; bhūyaḥ — further; etāḥ — these; śṛṇu — hear; me — from me."],["The seven Saptamīs were themselves previously declared by Āditya to Aruṇa, O mighty-armed one.","svayam — themselves; yāḥ — which; kathitāḥ — declared; pūrvam — previously; ādityena — by Āditya; khaga-adhipa — O lord of birds; aruṇasya — to Aruṇa; mahā-bāho — O mighty-armed one; saptamyaḥ sapta — seven Saptamīs."],["One is with Arka-cups; the second likewise with pepper; the third with neem leaves; the fourth is the Fruit-Saptamī.","arka-sampuṭakaiḥ — with Arka-cups; ekā — one; dvitīyā — the second; maricaiḥ — with pepper; tathā — likewise; tṛtīyā — the third; nimbapatraiḥ — with neem leaves; caturthī — the fourth; phala-saptamī — Fruit-Saptamī."],["The fifth is Anodanā; the sixth is known as Vijayā Saptamī; the seventh is to be known as Kāmikā. Hear their procedure from me.","anodanā — Anodanā; pañcamī — the fifth; syāt — is; ṣaṣṭhī — the sixth; vijaya-saptamī — Vijayā Saptamī; saptamī — the seventh; kāmikā — Kāmikā; jñeyā — to be known; vidhim — procedure; tāsām — of them; nibodha — hear, understand; me — from me."],["In the bright fortnight, on a Sunday, during the southern or northern course, at an eclipse, or under the Sun’s nakṣatra, one should undertake the seven Saptamīs.","śukla-pakṣe — in the bright fortnight; ravi-dine — on a Sunday; dakṣiṇe ca uttara-ayaṇe — in the southern or northern course; grahaṇe — at an eclipse; sūrya-nakṣatre — under the Sun’s nakṣatra; gṛhṇīyāt — one should undertake; sapta saptamīḥ — the seven Saptamīs."],["He should be a good brahmacārin, endowed with purity and self-control, devoted to Sun-worship, restrained, and intent on japa and homa.","saḥ — he; su-brahmacārī — a good brahmacārin; syāt — should be; śauca-yuktaḥ — endowed with purity; jita-indriyaḥ — having conquered the senses; sūrya-arcana-rataḥ — devoted to Sun-worship; dāntaḥ — restrained; japa-homa-paraḥ — intent on japa and homa; tathā — likewise."],["On the fifth, a man should perform the daily mental observance. On the sixth, he should not engage in sexual intercourse and should avoid honey and meat.","pañcamyām eva — on the fifth alone; puruṣaḥ — a man; kuryāt — should perform; nityam — daily; manātmakam — mental; ṣaṣṭhyām — on the sixth; na maithunam gacchet — should not engage in sexual intercourse; madhu-māṃsam ca — and honey and meat; varjayet — should avoid."],["He should perform one with Arka-cups, another with pepper, another with neem leaves; on the one called Fruit-Saptamī he should undertake fruit.","arka-sampuṭakaiḥ — with Arka-cups; ekām — one; tathā anyām — and another; maricaiḥ — with pepper; nayet — should perform; tathā aparām — and another; nimba-patraiḥ — with neem leaves; phala-ākhyāyām — in the one called Fruit-Saptamī; phalam — fruit; caret — he should undertake."],["Anodanā should be observed according to rule, without food. One should perform Vijayā Saptamī, living on air for a day and night.","anodanām — Anodanā; anna-rahitaḥ — without food; upāsīta — one should observe; yathā-vidhi — according to rule; ahaḥ-rātram — day and night; vāyu-bhakṣaḥ — living on air; kuryāt — one should perform; vijaya-saptamīm — Vijayā Saptamī."],["Likewise, a discerning person should perform one Saptamī each month according to rule, gladly; thereafter he should perform Kāmikā.","tathā — likewise; ekām saptamīm — one Saptamī; kṛtvā — having performed; prati-māsam — each month; vicakṣaṇaḥ — a discerning person; kuryāt — should perform; yathā-vidhi — according to rule; mudā — gladly; tataḥ — thereafter; kurvīta — should perform; kāmikām — Kāmikā."],["Having written their names separately on leaves, he should put all those leaves into a new pot.","āsām — of these; likhitvā — having written; nāmāni — names; patrakeṣu — on leaves; pṛthak pṛthak — separately; tāni sarvāṇi patrāṇi — all those leaves; kṣipet — he should put; abhinave ghaṭe — into a new pot."],["A man who does not know this purpose, or is outside the customary way, should draw one; he should make no deliberation.","tat-artham — this purpose; yaḥ — whoever; na jānāti — does not know; loka-vāhyaḥ api vā — or outside the customary way; naraḥ — a man; tena — by him; hi — indeed; uddhārayet — one should draw; ekam — one; na kuryāt — one should not make; vicāraṇām — deliberation."],["By that very procedure, whoever performs that penance each month, until the seven Saptamīs are completed, that is known as Kāmikā.","tena eva vidhinā — by that very procedure; yaḥ tu — whoever; prati-māsam — each month; tat tapaḥ — that penance; kuryāt — performs; yāvat — until; sapta eva saptamyaḥ — all seven Saptamīs; sā — that; tu — indeed; kāmikā — Kāmikā; vijñeyā — is to be known."],["These seven Saptamīs were declared by Vivasvat himself. Whoever performs them with devotion goes to the abode of Arka, O king.","iti — thus; etāḥ — these; sapta saptamyaḥ — seven Saptamīs; svayam — himself; proktāḥ — declared; vivasvatā — by Vivasvat; kurvīta — performs; yaḥ naraḥ — whoever; bhaktyā — with devotion; saḥ yāti — he goes; arka-sadaḥ — to the abode of Arka; nṛpa — O king."],["From the Arka-cups, wealth is unshakable for seven generations; from pepper there is union always with dear ones, sons, and others.","arka-sampuṭakaiḥ — by Arka-cups; vittam — wealth; acalam — unshakable; sapta-pauruṣam — for seven generations; maricaiḥ — by pepper; saṅgamaḥ — union; syāt — comes to be; vai — indeed; priyaiḥ — with dear ones; putra-ādibhiḥ — with sons and others; sadā — always."],["All diseases perish through neem leaves, without doubt. From fruits, sons and grandsons, and a plentiful daughter's son [are obtained].","sarva-rogāḥ — all diseases; praṇaśyanti — perish; nimba-patraiḥ — through neem leaves; na saṃśayaḥ — without doubt; phalaiḥ tu — from fruits; putra-pautrāḥ ca — sons and grandsons; dauhitraḥ ca api — and also a daughter's son; puṣkalaḥ — plentiful."],["From this [come] wealth, wealth, grain, gold, silver, livestock, gold, and health always, O king.","ataḥ — from this; dhanam dhanam — wealth, wealth; dhānyam — grain; suvarṇam — gold; rajatam — silver; tathā — and; paśuḥ — livestock; hiraṇyam ca — and gold; ārogyam — health; satatam — always; nṛpa — O king."],["By fasting, one conquers enemies always through Vijayā. Kāmikā fulfills desires for the one who observes it according to rule.","upoṣya — fasting; vijayām — Vijayā; śatrūn — enemies; rājan — O king; jayati — conquers; nityaśaḥ — always; sādhayet — fulfills; kāmadā — Kāmikā; kāmān — desires; vidhi-vat — according to rule; samupāsitā — observed."],["A son-seeker obtains a son; a wealth-seeker obtains inexhaustible wealth; a knowledge-seeker obtains knowledge; a kingdom-seeker obtains a kingdom. This Kāmikā grants all desires, O delight of the Kurus.","putra-kāmaḥ — a son-seeker; labhet — obtains; putram — a son; artha-kāmaḥ — a wealth-seeker; artham akṣayam — inexhaustible wealth; vidyā-kāmaḥ — a knowledge-seeker; labhet — obtains; vidyām — knowledge; rājya-arthī — a kingdom-seeker; rājyam āpnuyāt — obtains a kingdom; kṛtsnān kāmān — all desires; dadāti — grants; eṣā — this; kāmadā — Kāmikā; kuru-nandana — O delight of the Kurus."],["A man or a woman who performs the Saptamī-vow as stated, with a controlled self, goes to the highest state.","naraḥ vā — a man, or; yadi vā nārī — or a woman; yathā-uktam — as stated; saptamī-vratam — the Saptamī-vow; karoti — performs; niyata-ātmā — with a controlled self; vai — indeed; saḥ yāti — that one goes; paramām gatim — to the highest state."],["There is nothing difficult for them in the three worlds, those who are devoted to the Lord of the worlds, keepers of vows, with vows firmly observed.","na — not; teṣām — for them; triṣu lokeṣu — in the three worlds; kiñcit — anything; asti — is; durlabham — difficult to obtain; ye — who; bhaktyā — with devotion; loka-nāthasya — to the Lord of the worlds; vratinaḥ — keepers of vows; saṃśita-vratāḥ — whose vows are firmly observed."],["Through various vows, or very difficult austerities, or sacrifices with many gifts, one does not obtain that fruit.","vrataiḥ — through vows; tu — indeed; vividhaiḥ — various; vīra — O hero; tapobhiḥ vā — or through austerities; su-duṣkaraiḥ — very difficult; na — not; tat phalam — that fruit; avāpnoti — one obtains; yajñaiḥ vā — or through sacrifices; bahu-dakṣiṇaiḥ — with many gifts."],["Not even by bathing at tīrthas, gifts, homas, and worship does one obtain the fruit that is obtained by worshipping on Saptamī, which gives liberation, as Lord Ravi declared, O best of kings seeking liberation.","tīrtha-abhiṣecanaiḥ vā api — even by bathing at tīrthas; dāna-homa-arcanaiḥ tathā — and by gifts, homas, and worship; yat phalam — what fruit; pūjayitum — by worshipping; saptamyām — on Saptamī; prāpya — obtaining; mokṣa-dam — giving liberation; yathā — as; āha — declared; bhagavān raviḥ — Lord Ravi; mokṣa-arthī — O liberation-seeker; pārthiva-śreṣṭha — O best of kings."],["Having taken food at night on the Sun's day, one should worship Ravi with devotion. A faithful person attains an unshakable abode; certainly, without doubt, his dwelling is in the world of the Sun.","kṛtvā — having done; āditya-dine — on the Sun's day; naktam — a night meal; bhaktyā — with devotion; sampūjayet — one should worship; ravim — Ravi; acalam sthānam — an unshakable abode; āpnoti — attains; mānavaḥ — a person; śraddhayā anvitaḥ — endowed with faith; sūrya-loke — in the world of the Sun; niyatam — certainly; tasya vāsaḥ — his dwelling; na saṃśayaḥ — without doubt."],["A man who worships Bhāskara with devotion on Saptamī has an unobstructed course to the worlds of Brahmā, Indra, and Rudra.","yaḥ tu — whoever; pūjayate — worships; bhaktyā — with devotion; saptamyām — on Saptamī; bhāskaram — Bhāskara; naraḥ — a man; brahma-indra-rudra-lokeṣu — to the worlds of Brahmā, Indra, and Rudra; tasya — for him; apratihatā — unobstructed; gatiḥ — course."],["There is no blind man, leper, impotent man, deformed man, or poor man in the family of the one who observes the Saptamī-vow, O hero.","na andhaḥ — no blind man; na kuṣṭhī — no leper; na klībaḥ — no impotent man; na vyaṅgaḥ — no deformed man; na ca nirdhanaḥ — nor a poor man; kule tasya — in that one's family; bhavet — would be; vīra — O hero; yaḥ caret — who observes; saptamī-vratam — the Saptamī-vow."],["A seeker of knowledge obtains knowledge; a seeker of wealth obtains wealth. A seeker of a wife obtains a beautiful woman and sons, O Bhārata.","vidyā-arthī — a seeker of knowledge; labhate — obtains; vidyām — knowledge; dhana-arthī — a seeker of wealth; dhanam āpnuyāt — obtains wealth; bhāryā-arthī — a seeker of a wife; rūpa-sampannām — endowed with beauty; striyam — a woman; putrān ca — and sons; bhārata — O Bhārata."],["When a breach of the vow occurs through greed, heedlessness, or delusion, then one should not eat for three nights or should shave the hair.","lobhāt — through greed; pramādāt — through heedlessness; mohāt ca — and through delusion; vrata-bhaṅgaḥ — breach of the vow; yadā bhavet — when it occurs; tadā — then; tri-rātram — for three nights; na aśnīyāt — one should not eat; kuryāt vā — or should perform; keśa-muṇḍanam — shaving of the hair."],["Having performed this expiation, one should become a votary again, until the seven Saptamīs are completed, O lord of birds.","prāyaścittam idam — this expiation; kṛtvā — having performed; punaḥ eva — again; vratī bhavet — one should become a votary; sapta eva — all seven; yāvat saptamyaḥ — until the Saptamīs; bhavanti — are completed; khaga-īśvara — O lord of birds."],["Having worshipped on the Sun's Saptamī with garlands, incense, and the like, a man should feed Brāhmaṇas according to his ability and obtain imperishable heaven.","abhyarcya — having worshipped; sūrya-saptamyām — on the Sun's Saptamī; mālya-dhūpa-ādibhiḥ — with garlands, incense, and the like; naraḥ — a man; bhojayitvā — having fed; dvijān — twice-born; śaktyā — according to ability; prāpnuyāt — should obtain; svargam akṣayam — imperishable heaven."],["Whoever gives gold to the foremost Brāhmaṇas on Saptamī obtains that imperishable [fruit] and goes to the world of the Sun.","saptamyām — on Saptamī; vipra-mukhyebhyaḥ — to the foremost Brāhmaṇas; hiraṇyam — gold; yaḥ prayacchati — whoever gives; saḥ — he; tat akṣayam — that imperishable [fruit]; āpnoti — obtains; sūrya-lokam ca — and to the world of the Sun; gacchati — goes."],["Thus has been proclaimed, O hero, this excellent Saptamī-vow. I shall speak further again; listen with a one-pointed mind, O king.","iti — thus; idam — this; kīrtitam — proclaimed; vīra — O hero; saptamī-vratam uttamam — excellent Saptamī-vow; bhūyaḥ eva — again further; abhidhāsyāmi — I shall speak; śṛṇu — listen; eka-manāḥ — with a one-pointed mind; nṛpa — O king."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:208,verseCount:33,subtitle:"Chapter 208 — The Seven Saptamī Vows",colophon:""},T);</script></body>
