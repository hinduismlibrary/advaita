<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 203 — Procedure for Worshipping Bhāskara."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 203 — Procedure for Worshipping Bhāskara — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 203 — Procedure for Worshipping Bhāskara</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Viṣṇu said. Tell me briefly the procedure for worship of the sky, O four faced one. How should the eight horned sky of Bhāskara be worshipped.","vyoma-pūjā-vidhim — procedure for worshipping the sky; brūhi — tell; samāsāt — in brief; catur-ānana — O four-faced one; aṣṭa-śṛṅgam — eight-horned; katham — how; vyoma — sky; pūjayet — should worship; bhāskarasya — of Bhāskara; tu — indeed."],["Brahmā said. Hear from me, Kṛṣṇa, the procedure for worship of the sky, how the wise worship the eight horned sky.","vyoma-pūjā-vidhim — procedure for worshipping the sky; kṛṣṇa — O Kṛṣṇa; nibodha — hear; gadataḥ mama — from me speaking; aṣṭa-śṛṅgam — eight-horned; yathā — how; vyoma — sky; pūjayanti — worship; manīṣiṇaḥ — the wise."],["Having made it of gold, silver, copper, and stone, O mighty armed one, one should worship the eight horned sky by this procedure.","sauvarṇam — of gold; rājātam — of silver; tāmram — copper; kṛtvā — having made; ca — and; aśma-mayam — of stone; tathā — likewise; aṣṭa-śṛṅgam — the eight-horned [form]; mahā-bāho — O great-armed one; anena vidhinā — by this procedure; arcayet — one should worship."],["First one should worship Bhānu in the middle with a mantra, O good vowed one, with many clusters of flowers, Mahiṣā Vo Mahāya.","prathamam — first; pūjayet — one should worship; bhānum — Bhānu; madhye — in the middle; mantreṇa — with the mantra; su-vrata — O good-vowed one; mahiṣā vo mahāya — “Mahiṣā Vo Mahāya”; nānā-puṣpa-kadambakaiḥ — with many clusters of flowers."],["One should always worship the whole horn with the mantra Trātāram Indram. Or one should worship with Udiratām Avara.","trātāram-indram — “Trātāram Indram”; mantreṇa — with the mantra; sarva-śṛṅgam — the whole horn; sadā — always; arcayet — one should worship; udiratām-avara — “Udiratām Avara”; iti — thus; atha vā — or; anena — with this; pūjayet — one should worship."],["With the mantra Āyaṃ Gaur, one should worship the southwest horn. With Rakṣohaṇam Vājinam, one should worship the destroyer of Asuras.","āyam-gaur — “Āyaṃ Gaur”; iti — thus; mantreṇa — with the mantra; naiṛta-śṛṅgam — the southwest horn; arcayet — one should worship; rakṣohaṇam-vājinam — “Rakṣohaṇam Vājinam”; vā — or; pūjayet — one should worship; asura-antakam — the destroyer of Asuras."],["One should worship with Indrasomāntapataye, or with Abhitvā Śūra No Numa one should worship the northeast horn.","indra-somānta-pataye — “Indrasomāntapataye”; hi — indeed; atha vā — or; anena — with this; pūjayet — one should worship; abhittvā-śūra-no-numa — “Abhitvā Śūra No Numa”; aiśānam — northeast; śṛṅgam — horn; arcayet — one should worship."],["Thus they always worship Bhānu all around, O Acyuta. Or one should worship with Yenedam Bhūtam.","evam — thus; bhānum — Bhānu; ca — and; paritaḥ — all around; pūjayanti — they worship; sadā — always; acyuta — O Acyuta; yena-idam-bhūtam — “Yenedam Bhūtam”; iti — thus; vai — indeed; atha vā — or; anena — with this; pūjayet — one should worship."],["With Namo Astu Sarvapāpebhyaḥ one should always worship the sky seat. Those men constantly obtain desires, no doubt.","namaḥ astu sarva-pāpebhyaḥ — “Namo Astu Sarvapāpebhyaḥ”; vyoma-pīṭham — sky-seat; sadā — always; arcayet — one should worship; te narāḥ — those men; satatam — constantly; kāmān — desires; prāpnuvanti — obtain; na saṃśayaḥ — no doubt."],["You alone are among the Rudras and Vasus. By that one should worship in the forenoon. In the afternoon one should always worship with Tad Viṣṇoḥ Paramaṃ Padam and Haṃsaḥ Śuciṣad.","tvam ekaḥ — you alone; rudrāṇām — of the Rudras; vasūnām — of the Vasus; pūrvāhne — in the forenoon; tena — with that; pūjayet — one should worship; tad-viṣṇoḥ-paramam-padam — “Tad Viṣṇoḥ Paramaṃ Padam”; haṃsaḥ-śuciṣat — “Haṃsaḥ Śuciṣad”; iti — thus; aparāhne — in the afternoon; sadā — always; arcayet — one should worship."],["Thus they worship Bhānu together with the planets, O lord of the assembly. They obtain all the various desires, no doubt.","evam — thus; bhānum — Bhānu; grahaiḥ sārdham — together with the planets; pūjayanti — they worship; sadā — always; sat-pate — O lord of the assembly; te — they; sarvān — all; vividhān kāmān — various desires; prāpnuvanti — obtain; na saṃśayaḥ — no doubt."],["Having given clean garments with a pavitra to the guru, and likewise sandals and a golden ring, O Kṛṣṇa.","vimale vāsasī — clean garments; dattvā — having given; gurave — to the guru; sa-pavitrake — together with a pavitra; upānahau — sandals; tathā — likewise; kṛṣṇa — O Kṛṣṇa; sauvarṇam aṅgulīyakam — a golden ring."],["Various scents and flowers, many kinds of foods and eatables. Whoever worships Ravi by this procedure while fasting becomes a man with many sons, much wealth, and good fortune.","gandha-puṣpāṇi — scents and flowers; citrāṇi — various; bhakṣya-bhojyāni — foods and meals; anekśaḥ — many kinds; anena vidhinā — by this procedure; yaḥ — whoever; tu — indeed; sa-upavāsaḥ — while fasting; arcayet — worships; ravim — Ravi; bahu-putraḥ — with many sons; bahu-dhanaḥ — with much wealth; saḥ naraḥ — that man; bhavya-vān — fortunate; bhavet — becomes."],["Whoever worships Ravi while fasting in the northern course obtains the fruit of an Aśvamedha and is born with many sons.","uttare ayane — in the northern course; yaḥ tu — whoever; sa-upavāsaḥ — while fasting; arcayet — worships; ravim — Ravi; saḥ — he; aśvamedha-phalam — fruit of an Aśvamedha; vindet — obtains; bahu-putraḥ — with many sons; ca — and; jāyate — is born."],["Having fasted at the equinox, whoever worships Ravi becomes one with many sons, much wealth, and fame.","kṛtvā upavāsam — having fasted; viṣuve — at the equinox; yaḥ tu — whoever; pūjayate — worships; ravim — Ravi; bahu-putraḥ — with many sons; bahu-dhanaḥ — with much wealth; kīrtimān — famed; ca api — and also; jāyate — becomes."],["Having fasted during an eclipse of the Moon or Sun, one should worship Bhāskara with devotion. He goes to the world of Brahmā.","kṛtvā upavāsam — having fasted; grahaṇe — during an eclipse; vidhivat — according to rule; candra-sūryayoḥ — of the Moon and Sun; pūjayet — one should worship; bhāskaram — Bhāskara; bhaktyā — with devotion; brahma-lokam — to the world of Brahmā; saḥ — he; gacchati — goes."],["Thus the procedure for worshipping Bhāskara has been told to you, Viṣṇu. Hearing it, a man is honored in my world with devotion.","iti — thus; te — to you; kathitaḥ — told; viṣṇo — O Viṣṇu; bhāskara-ārādhane — in worship of Bhāskara; vidhiḥ — procedure; yam — which; śrutvā — hearing; puruṣaḥ — a man; bhaktyā — with devotion; mama loke — in my world; mahīyate — is honored."],["Returning again to earth, Kṛṣṇa, he becomes a king on earth, with many sons and much wealth, undefeated in battles.","punaḥ etya — returning again; mahīm — to earth; kṛṣṇa — O Kṛṣṇa; rājā — a king; bhavati — becomes; bhū-tale — on the ground; bahu-putraḥ — with many sons; bahu-dhanaḥ — with much wealth; samareṣu — in battles; aparājitaḥ — undefeated."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:203,verseCount:18,subtitle:"Chapter 203 — Procedure for Worshipping Bhāskara",colophon:""},T);</script></body>
