<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 200 — Description of Solar Dharma."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 200 — Description of Solar Dharma — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 200 — Description of Solar Dharma</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Bhīṣma said: The bathing procedure that removes sin has been told to you, O Brahman; I shall worship by the proper procedure of Brahmā-worship, by which indeed [it is done].","kathitaḥ — told; te — to you; snāna-vidhiḥ — bathing procedure; brahman — O Brahman; vai — indeed; pāpa-hārakaḥ — removing sin; samyak — properly; brahma-arcana-vidhim — procedure of Brahmā-worship; pūjayiṣyāmi — I shall worship; yena — by which; vai — indeed."],["Vyāsa said: Now I shall tell you the procedure for worshipping Āditya, in a secluded, victorious place, pleasant and beautiful.","hanta — now; te — to you; sampravakṣyāmi — I shall tell; vidhim — the procedure; āditya-pūjane — in worship of Āditya; vivikte — secluded; vijaya-sthāne — in a victorious place; su-prasanne — pleasant; su-śobhane — beautiful."],["The mantra-knower should worship Bhāskara, with the body made straight, seated upon a bhadra-seat, facing east, the best sādhaka.","pūjayet — should worship; bhāskaram — Bhāskara; mantrī — mantra-knower; saralī-kṛta-vigrahaḥ — with the body made straight; bhadra-āsana-samārūḍhaḥ — seated upon a bhadra-seat; prāṅ-mukhaḥ — facing east; sādhaka-uttamaḥ — the best sādhaka."],["A man should place his own limbs with the weapon-seed mantra, placing them well from the thumb first through to the little finger.","astra-bījena mantreṇa — with the weapon-seed mantra; naraḥ — a man; sva-aṅgāni — his own limbs; vinyaset — should place; aṅguṣṭham — the thumb; āditaḥ kṛtvā — making first; kaniṣṭha-antam — up to the little finger; su-vinyaset — should place well."],["He should always place them in order, the heart and the rest ending in phaṭ; placing them in the eyes and palms, O hero, the mantra-knower [does the rite] beginning with arghya.","hṛdaya-ādīn — the heart and the rest; phaṭ-antān — ending in phaṭ; tān — them; vinyaset — should place; kramataḥ — in order; sadā — always; netra-pāṇi-tale — in the eyes and palms; vīra — O hero; nyasya — having placed; arghya-ādi — beginning with arghya; mantra-vit — the mantra-knower."],["The fourth in the ya-class, joined with karṇa and bindu, is declared the eye-seed, of the form of light, no doubt.","ya-varge — in the ya-class; ya-caturtham — the fourth [letter]; tu — indeed; karṇa-bindu-samanvitam — joined with karṇa and bindu; netra-bījam — eye-seed; iti — thus; proktam — declared; jyotiḥ-rūpam — of the form of light; na saṃśayaḥ — no doubt."],["Afterwards the wise one should place the three-syllable Sun armor; that I told you, O hero, when you asked about the mantra-king.","paścāt — afterwards; tu — indeed; tri-akṣaram — three-syllable; sūryam — Sun; kavacam — armor; vinyaset — should place; budhaḥ — the wise one; kathitam — told; tat — that; mayā — by me; vīra — O hero; mantra-rāja-iti — as the mantra-king; pṛcchataḥ — when asking."],["Then he should perform prāṇāyāma, uttering the first seed; then, in the remaining order, having offered, he becomes stainless by the power of Bhīṣma.","prāṇāyāmam — prāṇāyāma; tataḥ — then; kuryāt — should perform; prathamam bījam — the first seed; udgiran — uttering; śeṣa-krameṇa — in the remaining order; hutvā — having offered; ayam — this one; viraje — becomes stainless; bhīṣma-śaktitaḥ — by Bhīṣma’s power."],["Then by the three fierce ones self-purification is accomplished; having purified the self thus, one should place the Sun all around.","tribhiḥ eva — by the three indeed; tataḥ — then; ghoraiḥ — fierce; ātma-śuddhiḥ — self-purification; kṛtā bhavet — is accomplished; iti — thus; saṃśodhya — having purified; ca — and; ātmānam — the self; sūryam — the Sun; sarva-antikam — all around; nyaset — one should place."],["Having placed the heart in the heart and the head on the head, the letter which is spoken of in the twenty-one alphabet-mothers,","hṛdaye — in the heart; hṛdayam — the heart; nyasya — having placed; śiraḥ — the head; śirasi — on the head; vinyaset — one should place; eka-viṃśati-mātṛkāyāḥ — of the twenty-one alphabet-mothers; akṣaram — the letter; yat — which; prakīrtitam — is spoken of."],["It is known as the heart-seed, the incomparable place of Brahmā; worship of Arka with the head is declared in the world as Arka.","hṛd-bījam — heart-seed; iti — thus; vikhyātam — known; brahma-sthānam — place of Brahmā; anaupamam — incomparable; śirasā — with the head; arkasya pūjā — worship of Arka; tu — indeed; loke — in the world; arkaḥ — Arka; pratikathyate — is declared."],["One should place the crest on the crest, and armor on the body; place the eye in the eyes, and the weapon likewise in the hands.","śikhāyām — on the crest; tu — indeed; śikhām — the crest; nyaset — one should place; śarīre — on the body; kavacam — the armor; nyaset — should place; netrayoḥ — in the eyes; vinyaset — should place; netram — the eye; karayoḥ — in the hands; astram eva ca — and indeed the weapon."],["The great utterances, O king, and likewise the blazing crest; the letters ha and ra and ku, together with bindu,","mahā-vyāhṛtayaḥ — the great utterances; rājan — O king; tathā — likewise; rājvalinī — blazing; śikhā — crest; hakāraḥ — letter ha; ca — and; rakāraḥ — letter ra; ca — and; kukāraḥ — letter ku; bindunā saha — together with bindu."],["And these indeed are spoken of as the armor of these; one should place the eye in the eyes and the weapon in the hands.","eteṣām — of these; samayāḥ — the prescribed forms; ca eva — indeed and; kavacam — armor; parikathyate — is spoken of; netrayoḥ — in the eyes; vinyaset — one should place; netram — the eye; karayoḥ — in the hands; astram eva ca — and indeed the weapon."],["Having placed the limbs thus, he is bound by no one; enemies become friends, and in the absence of gain one should obtain gain.","evam — thus; aṅgāni — limbs; vinyasya — having placed; na asau — he is not; kenāpi — by anyone; bādhyate — bound; śatravaḥ — enemies; mitratām yānti — become friends; alābhe — in absence of gain; lābham āpnuyāt — one should obtain gain."],["Knowing oneself as Bhāskara, as stated by the seers of truth, then one should worship Bhānu again according to rule on the sthandila.","ātmānam — oneself; bhāskaram — Bhāskara; jñātvā — knowing; yathā-uktam — as stated; tattva-darśibhiḥ — by seers of truth; tataḥ tu — then; pūjayet — one should worship; bhānum — Bhānu; sthaṇḍile — on the sthandila; vidhi-vat — according to rule; punaḥ — again."],["Having made a divine flower-basket on the right side, and having made [a vessel] beautifully on the left, filled with water in copper,","kṛtvā — having made; tu — indeed; dakṣiṇe pārśve — on the right side; divya-puṣpa-karaṇḍakam — a divine flower-basket; kṛtvā — having made; su-śobhite — beautifully; vāme — on the left; tāmra-pūrṇena vāriṇā — filled with water in copper."],["Having washed it with the weapon [mantra] and filled it, and likewise with the remaining mantras and waters, having consecrated it, one should then place it covered with armor.","astreṇa — with the weapon [mantra]; kṣālitām — washed; pūrṇām — filled; śeṣam — the remainder; mantraiḥ — with mantras; jalaiḥ tathā — and likewise with waters; abhimantrya — having consecrated; tataḥ — then; sthāpya — having placed; kavacena — with armor; avaguṇṭhitām — covered."],["The things arranged for worship on the sthandila, all of them the wise one should sprinkle with water, and the arghya-vessel too; then the mantra-knower should recite the mantra with one mind.","sthaṇḍile — on the sthandila; dravyāṇi — things; pūjā-artham — for worship; kalpitāni — arranged; tu — indeed; sarvāṇi — all; prokṣayet — should sprinkle; vidvān — the wise one; arghya-pātram — the arghya-vessel; jalenā — with water; tu — indeed; tataḥ — then; mantram japet — should recite the mantra; paścāt — afterwards; eka-cittena — with one mind; mantra-vit — the mantra-knower."],["Bhīṣma said: The procedure told by the wise with mantras together with the Purāṇas,","purāṇa-sahitaiḥ mantraiḥ — with mantras together with the Purāṇas; yaḥ — which; vidhiḥ — procedure; kathitaḥ — told; budhaiḥ — by the wise; bhīṣmaḥ uvāca — Bhīṣma said."],["That has been known wholly by me and told repeatedly by the twice-born; how Ravi is worshipped with the various mantras stated in the Veda,","saḥ — that; mayā — by me; viditaḥ — known; kṛtsnaḥ — wholly; kathitaḥ — told; na ekashaḥ — repeatedly; dvijaiḥ — by the twice-born; veda-uktaiḥ — stated in the Veda; vividhaiḥ mantraiḥ — with various mantras; yathā — how; sampūjyate — is worshipped; raviḥ — Ravi."],["Tell me all that Vedic procedure in the same way, O best of rites.","tathā — in the same way; me — to me; brūhi — tell; sakalam — all; vaidikam — Vedic; vidhi-sattama — O best of rites."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:200,verseCount:22,subtitle:"Chapter 200 — Description of Solar Dharma",colophon:""},T);</script></body>
