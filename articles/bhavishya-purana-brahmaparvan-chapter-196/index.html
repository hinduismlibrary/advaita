<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 196 — Description of Name-Worship Procedure."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 196 — Description of Name-Worship Procedure — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-1" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 196 — Description of Name-Worship Procedure</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Having passed the meal, a man should make friendliness everywhere on Saptamī, O elder brother of Garuḍa; he should avoid injury to living beings.","atītya — having passed; bhuktam — the meal; puruṣaḥ — a man; saptamyām — on Saptamī; maitrīm vidadhyāt — should make friendliness; sarvatra — everywhere; jīva-hiṃsām — injury to living beings; vivarjayet — should avoid."],["On Saptamī he should not touch oil, should not wear blue clothing, should not lie with a woman, and should not engage in dice.","saptamyām — on Saptamī; na spṛśet — should not touch; tailam — oil; nīlam vastram — blue clothing; na dhārayet — should not wear; na śayīta — should not lie; striyā sārdham — with a woman; na seveta — should not engage in; dur-udaram — dice."],["He should not weep with a fall of tears, nor meditate on piśācas; he should not pull lice from the head, nor speak in vain; he should avoid speaking ill of another and excessive speech.","na rudyāt — should not weep; aśru-pātena — with tears falling; na vā — nor; dhyāyet — meditate; piśācakān — on piśācas; na ākṛṣet — should not pull; śirasaḥ — from the head; yūkāḥ — lice; na vṛthā-vādam ācaret — should not speak in vain; parasya aniṣṭa-kathanam — ill-speech of another; ati-vādam — excessive speech; varjayet — should avoid."],["He should not strike any creature, nor enter at any time; entering the house of Ravi, one incurs Brahma-hatya.","na kañcit — no one; tāḍayet — should strike; jantum — creature; na viśet — should not enter; kadācana — at any time; brahma-hatyām — Brahma-hatya; avāpnoti — incurs; viśamānaḥ — entering; raveḥ gṛham — the house of Ravi."],["These rules for the Sauras have been declared, O elder brother of Garuḍa, especially for Bhojakas, formerly by Bhānu to me, O sinless one.","iti — thus; ete — these; samayāḥ — rules; proktāḥ — declared; saurāṇām — for the Sauras; garuḍa-agraja — O elder brother of Garuḍa; bhojakānām — for Bhojakas; viśeṣeṇa — especially; purā — formerly; me — to me; bhānunā — by Bhānu; anagha — O sinless one."],["A Bhojaka who abandons wealth out of greed for increase, O tiger among birds, surely goes constantly to hell, O hero.","bhojakaḥ — a Bhojaka; khaga-śārdūla — O tiger among birds; yaḥ — who; lobhāt — out of greed; dravyam — wealth; utsṛjet — abandons; vṛddhyai — for increase; tu — indeed; satatam — constantly; saḥ — he; gacchet — goes; narakam — to hell; dhruvam — surely; vīra — O hero."],["If a Bhojaka is engaged for a special [offering] at less than a hundred, O lord of birds, and for five hundred indeed,","viśeṣe — for a special [offering]; ca — and; alpa-śate — at less than a hundred; kāma-yāne — in a desired undertaking; khaga-adhipa — O lord of birds; prayujyamānaḥ — engaged; bhojakaḥ tu — a Bhojaka indeed; pañcakena śatena — for five hundred indeed."],["He becomes one needing expiation, O hero, and is not fit for the worship of Ravi. Having performed the Sāntapana kṛcchra, he should worship Ravi there.","prāyaścittī — one needing expiation; bhavet — becomes; vīra — O hero; na ca arhah — and is not fit; pūjane raveḥ — for Ravi’s worship; kṛtvā — having performed; sāntapanam kṛcchram — the Sāntapana kṛcchra; tatraḥ — there; sampūjayet — should worship; ravim — Ravi."],["An installation of another deity is not to be performed by a Bhojaka; having done that, a man undergoes expiation, O best of birds.","na anya-deva-pratiṣṭhā — no installation of another deity; tu — indeed; kartavyā — is to be performed; bhojakena — by a Bhojaka; kṛtvā — having done; tu — indeed; tām — that; khaga-śreṣṭha — O best of birds; prāyaścittīyate — undergoes expiation; naraḥ — a man."],["Therefore a Bhojaka should not do that, O best of birds; excepting the god Bhāskara, he should not dedicate [anything] to another god.","tasmāt — therefore; tām — that; na kuryāt — should not do; vai — indeed; bhojakaḥ — a Bhojaka; khaga-sattama — O best of birds; muktvā — excepting; bhāskaram devam — the god Bhāskara; na anyam devam — no other god; nivedayet — should dedicate [to]."],["Having made the reception of the gods beginning with Brahmā, O lord of birds, a Bhojaka should not touch Bhānu; he should perform a kṛcchra for purification.","kṛtvā — having made; adhiveśam — reception; devānām — of the gods; brahma-ādīnām — beginning with Brahmā; khaga-adhipa — O lord of birds; bhojakaḥ — a Bhojaka; na spṛśet — should not touch; bhānum — Bhānu; kuryāt — should perform; kṛcchram — a kṛcchra; ca — and; śuddhaye — for purification."],["Having performed a kṛcchra according to rule for the sake of purification, O lord of birds, then a man becomes qualified to worship Bhānu.","kṛtvā — having performed; kṛcchram — a kṛcchra; vidhi-vat — according to rule; śuddheḥ hetum — for the sake of purification; khaga-adhipa — O lord of birds; tataḥ — then; pūjayitum — to worship; bhānum — Bhānu; adhikārī — qualified; bhavet — becomes; naraḥ — a man."],["One should not give what is unknown, faded, or spoiled; one desiring prosperity should not give a stale garland.","na vijñātam — what is unknown; pradātavyam — should be given; na mlānam — not faded; na ca dūṣitam — nor spoiled; na ca paryuṣitam mālyam — nor a stale garland; dātavyam — should be given; ṛddhim icchatā — by one desiring prosperity."],["He who removes [flowers] from the deity out of greed for flowers is wicked; a Bhojaka [should give] fragrant flowers, not others.","devam ullocayet — removes [from] the deity; yaḥ — whoever; saḥ — he; khalaḥ — is wicked; puṣpa-lobhataḥ — from greed for flowers; puṣpāṇi — flowers; ca — and; su-gandhīni — fragrant; bhojakaḥ — a Bhojaka; na itarāṇi — not others."],["A Bhojaka deluded by greed incurs Brahma-hatya; reaching Mahāraurava, he is cooked for eternal years.","brahma-hatyām — Brahma-hatya; avāpnoti — incurs; bhojakaḥ — a Bhojaka; lobha-mohitaḥ — deluded by greed; mahārauravam — Mahāraurava; āsādya — reaching; pacyate — is cooked; śāśvatīḥ samāḥ — for eternal years."],["Now I shall tell you the supreme procedure of the incense offering, and what fruit comes from each incense offered to the God of gods.","hanta — now; te — to you; kīrtayiṣyāmi — I shall tell; dhūpa-dāna-vidhim — the procedure of incense offering; param — supreme; pradāne — in offering; deva-devasyā — to the God of gods; yena dhūpena — by which incense; yat phalam — what fruit."],["By sandalwood incense Ravi creates presence; a person should offer whatever he desires in his mind.","sadā — always; candana-dhūpena — by sandalwood incense; sānnidhyam — presence; kurute — creates; raviḥ — Ravi; pradadyāt — should offer; mānase — in the mind; ca eva — indeed; yat yat — whatever; icchati — desires; mānavaḥ — a person."],["Likewise, by aguru incense he gives the desired boon; one desiring health or a woman should always burn guggulu.","tathā eva — likewise; aguru-dhūpena — by aguru incense; varam — a boon; dadyāt — he gives; abhīpsitam — desired; ārogyam vā — health, or; striyam — a woman; prepsuḥ — one desiring; nityadā — always; guggulum — guggulu; dahet — should burn."],["By the offering of incense Bhānumān always gives auspiciousness; he gives health and a woman, and the highest happiness comes to be.","maṅgalam — auspiciousness; dhūpa-dānena — by incense offering; sadā — always; yacchati — gives; bhānumān — Bhānumān; ārogyam — health; ca — and; striyam — a woman; dadyāt — gives; saukhyam — happiness; ca — and; paramam — highest; bhavet — comes to be."],["By saffron incense a man obtains good fortune; by incense of Śrīvāsaka, trade becomes successful.","sadā — always; kuṅkuma-dhūpena — by saffron incense; saubhāgyam — good fortune; labhate — obtains; naraḥ — a man; śrīvāsakasya dhūpena — by incense of Śrīvāsaka; vāṇijyam — trade; sa-phalam — successful; bhavet — becomes."],["For one giving a juice endowed with all tastes, the arrival of wealth is certain; from burning deodar, food becomes inexhaustible.","rasam — juice; sarva-rasa-upetam — endowed with all tastes; dadataḥ — for one giving; artha-āgamaḥ — arrival of wealth; dhruvam — certain; deva-dārum — deodar; ca — and; dahataḥ — for one burning; bhavati — becomes; annam — food; akṣayam — inexhaustible."],["Smearing with saffron gives the fruit of all desires; having become happy in this world, the giver may attain heaven.","vilepanam — smearing; kuṅkumena — with saffron; sarva-kāma-phala-pradam — giving the fruit of all desires; iha loke — in this world; sukhī bhūtvā — having become happy; dātā — the giver; svargam — heaven; avāpnuyāt — may attain."],["By giving sandalwood he obtains prosperity and life; by giving red sandalwood Divākara gives everything.","candanasya pradānena — by giving sandalwood; śriyam — prosperity; āyuḥ ca — and life; vindati — he obtains; rakta-candana-dānena — by giving red sandalwood; sarvam — everything; dadyāt — may give; divākaraḥ — Divākara."],["Even afflicted by hundreds of diseases, one may quickly obtain health; by fragrant incense sticks a man obtains supreme fragrance.","api — even; roga-śataiḥ — by hundreds of diseases; grastaiḥ — afflicted; kṣipra — quickly; ārogyam — health; avāpnuyāt — one may obtain; varti-gandhaiḥ — by fragrant incense sticks; saugandhyam — fragrance; paramam — supreme; vindate — obtains; naraḥ — a man."],["By musk anointings one obtains incomparable lordship; with scents mixed with camphor one becomes lord over rulers of the earth.","kastūrikā-lepanakaiḥ — by musk anointings; aiśvaryam — lordship; atulam — incomparable; labhet — one obtains; karpūra-saṃyutaiḥ gandhaiḥ — with scents mixed with camphor; kṣmā-adhipa-adhipatiḥ — lord over rulers of the earth; bhavet — one becomes."],["What could a man obtain equal to the fourfold fragrance? I consider that the house of the gods which one smears with devotion.","catuḥ-samena gandhena — with the fourfold fragrance; kim — what; tulyaṃ — equal; prāpnuyāt — could obtain; naraḥ — a man; deva-āgāram — the house of the gods; tu — indeed; tat — that; manye — I consider; bhaktyā — with devotion; yaḥ — which; upalepayet — one smears."],["He is quickly freed from diseases; the man becomes one who enjoys. The eighteen leprosies and the other diseases of people all perish if one smears with clay.","saḥ — he; rogāt — from disease; mucyate — is freed; kṣipram — quickly; puruṣaḥ — a man; bhogavān — one who enjoys; bhavati — becomes; aṣṭādaśa — eighteen; iha — here; kuṣṭhāni — leprosies; ye ca anye — and whatever other; vyādhayaḥ — diseases; nṛṇām — of people; pralayaṃ yānti — perish; te sarve — all those; mṛdā — with clay; yadi upalepayet — if one smears."],["Among all smearings, red sandalwood is best; there is nothing beyond it that is more pleasing to Bhānu.","pralepanānām sarveṣām — among all smearings; rakta-candanam — red sandalwood; uttamam — best; na ataḥ parataram — nothing beyond this; kiñcit — anything; bhānoḥ — for Bhānu; tuṣṭi-karam — pleasing; param — supremely."],["What would not be [obtained] by him in the world who smears with this? He, rich in all desired things, is honored in the Sun-world.","kim — what; tasya — for him; na bhavet — would not be; loke — in the world; yaḥ — who; hi — indeed; anena — with this; pralepayet — smears; sarva-kāma-samṛddhaḥ — rich in all desired things; asau — he; sūrya-loke — in the Sun-world; mahīyate — is honored."],["Having smeared the house of Ravi, one should again make a maṇḍala; with one, one obtains good fortune and excellent health.","upalipya — having smeared; raveḥ gṛham — the house of Ravi; kuryāt — one should make; vai — indeed; maṇḍalam — a maṇḍala; punaḥ — again; ekena — with one; atha — then; samāpnoti — one obtains; bhāgyam — good fortune; ārogyam uttamam — excellent health."],["By three and seven, unbroken, a child or another man; by him one should cause the gods to be given [offerings], and should not prevent them; by this rule one should perform the seven Saptamīs.","tribhiḥ saptabhiḥ — by three and seven; acchinnā — unbroken; bālaḥ vā — a child, or; anyaḥ api — another; yaḥ naraḥ — a man; tena — by him; pradāpayet — should cause to be given; devān — to the gods; kuryāt — should do; tān na nivārayet — should not prevent them; anena vidhinā — by this rule; kuryāt — should perform; yāvatīḥ sapta saptamīḥ — all seven Saptamīs."],["These indeed are the seven Saptamīs as told by Vivasvat; a man who observes them with devotion is released from all sins.","etāḥ vai — these indeed; sapta saptamyaḥ — seven Saptamīs; yathā proktāḥ — as told; vivasvatā — by Vivasvat; kurvīta — observes; yaḥ naraḥ — whoever; bhaktyā — with devotion; sarva-pāpaiḥ — from all sins; pramucyate — is released."],["[He obtains] wealth with arka leaves, union with the beloved with peppers, destruction of disease with neem leaves, and desired sons with fruits; then he should give wealth, grain, and gold to Vivasvat.","arka-sampuṭakaiḥ — with arka leaves; vittam — wealth; maricaiḥ — with peppers; priya-saṅgamam — union with the beloved; nimba-patraiḥ — with neem leaves; roga-nāśam — destruction of disease; phalaiḥ — with fruits; putrān yathepsitān — desired sons; dhanam — wealth; dhānyam — grain; suvarṇam — and gold; ca — and; tataḥ — then; dadyāt — should give; vivasvate — to Vivasvat."],["He obtains great victory everywhere, O sky-goer; the Kāmika obtains all desires, there is no doubt.","jayam — victory; prāpnoti — obtains; vipulam — great; kṛtvā — having performed; sarvatra — everywhere; khe-cara — O sky-goer; sarvān kāmān — all desires; kāmikaḥ — the Kāmika; tu — indeed; prāpnuyāt — obtains; na atra saṃśayaḥ — there is no doubt."],["Whether man or woman, whoever performs the Saptamī vow as stated, O best of birds, goes to the highest state.","naraḥ vā — a man, or; yadi vā nārī — whether a woman; yathā-uktam — as stated; saptamī-vratam — the Saptamī vow; yaḥ karoti — whoever performs; khaga-śreṣṭha — O best of birds; saḥ — he; yāti — goes; paramam padam — to the highest state."],["Nothing whatever is difficult for them in the three worlds, who are vow-observers devoted to the Lord of the world, with their senses restrained.","na teṣām — for them there is not; triṣu lokeṣu — in the three worlds; kiñcit — anything; asti — is; durlabham — difficult; ye — who; bhaktyā — with devotion; loka-nāthasya — to the Lord of the world; vratinaḥ — vow-observers; saṃyata-indriyāḥ — with senses restrained."],["Their fruit is that of all sacrifices, as declared in the Veda; by that, Brahmā, Indra, and Viṣṇu are worshipped, there is no doubt.","sarva-yajña-phalam — the fruit of all sacrifices; teṣām — for them; yathā — as; veda-uditam — declared in the Veda; bhavet — may be; brahma-indra-viṣṇavaḥ — Brahmā, Indra, and Viṣṇu; tena — by that; pūjitāḥ — are worshipped; na atra saṃśayaḥ — there is no doubt."],["One who observes the Saptamī vow never becomes blind, leprous, impotent, deformed, or poor.","na andhaḥ — not blind; na kuṣṭhī — not leprous; na klībaḥ — not impotent; na vyaṅgaḥ — not deformed; na ca nirdhanaḥ — nor poor; kadā api — ever; bhavet — becomes; kaścit — anyone; yaḥ caret — who observes; saptamī-vratam — the Saptamī vow."],["One desiring a son obtains long-lived sons from one rich in sacred learning; nothing is difficult for them in the three worlds; one desiring enjoyment obtains enjoyments by this vow, O good-vowed one.","putra-arthī — one desiring a son; śruti-sampannāt — from one rich in sacred learning; labhet — obtains; putrān — sons; cirāyuṣaḥ — long-lived; na teṣām — for them there is not; triṣu lokeṣu — in the three worlds; kiñcit — anything; durlabham — difficult; bhoga-arthī — one desiring enjoyment; labhate — obtains; bhogān — enjoyments; vratena anena — by this vow; su-vrata — O good-vowed one."],["When the vow is broken through anger, carelessness, or greed, having done this expiation, the vow-observer should become so again.","krodhāt — through anger; pramādāt — through carelessness; lobhāt ca — and through greed; vrata-bhaṅgaḥ — breaking of the vow; yadā bhavet — when it occurs; prāyaścittam idam — this expiation; kṛtvā — having done; punaḥ eva — again indeed; vratī bhavet — one should become a vow-observer."],["When the seven Saptamīs have come, O bird, having worshipped Bhāskara on them with garlands, incense, and the rest, and having fed Brāhmaṇas according to one’s capacity, one obtains imperishable heaven.","sapta eva — exactly seven; yāvat — when; saptamyaḥ — Saptamīs; samprāptāḥ — have come; guruṇā — by the teacher; khaga — O bird; tāsu — on them; bhāskaram — Bhāskara; abhyarcya — having worshipped; mālya-dhūpa-ādibhiḥ — with garlands, incense, and the rest; naraḥ — a man; bhojayitvā — having fed; dvijān — Brāhmaṇas; śaktyā — according to capacity; prāpnuyāt — obtains; svargam akṣayam — imperishable heaven."],["Whoever gives food to the chief Brāhmaṇas on Saptamī, O lord of birds, that becomes imperishable for him, and he goes to the house of the Sun.","saptamyām — on Saptamī; vipra-mukhya-ebhyaḥ — to the chief Brāhmaṇas; yaḥ — whoever; annam — food; dadyāt — gives; khaga-īśvara — O lord of birds; tat — that; akṣayam — imperishable; bhavet — becomes; tasya — for him; saḥ — he; sūrya-gṛham — the house of the Sun; vrajet — goes."],["Thus the excellent Saptamī vow has been told to you, O hero; again I shall speak, listen to me as I speak, O sinless one.","iti — thus; te — to you; kīrtitam — told; vīra — O hero; saptamī-vratam uttamam — the excellent Saptamī vow; bhūyaḥ eva — again; abhidhāsyāmi — I shall speak; śṛṇu — listen; me — to me; vadataḥ — speaking; anagha — O sinless one."],["By the power of which vow one enjoys the Kāmika fruit, [that is] the bright Saptamī, O tiger among birds, named Dvādaśī.","yena — by which; vrata-prabhāveṇa — by the power of the vow; kāmikam phalam — the Kāmika fruit; aśnute — one enjoys; saptamīm — Saptamī; khaga-śārdūla — O tiger among birds; śuklām — bright; dvādaśa-nāmikām — named Dvādaśī."],["One may eat cow urine and cow dung, or eat only once in six periods, or eat barley, or even eat fallen leaves;","go-mūtra — cow urine; go-maya — cow dung; āhāraḥ — food; ṣaḍ-vṛta-āhāraḥ — food during six observances; eva ca — and indeed; atha vā — or; yāvaka-āhāraḥ — eating barley; śīrṇa-parṇa-aśanaḥ api vā — or even eating fallen leaves."],["Or one who drinks milk, or takes one meal, or eats morsels, or again eats only water, being wise, should worship Divākara.","kṣīra-aśī — milk-drinker; ca — and; eka-bhaktam vā — or taking one meal; siktha-āhāraḥ — eating morsels; atha vā punaḥ — or again; jala-āhāraḥ — eating water; atha vā — or; vidvān — the wise one; pūjayet — should worship; divākaram — Divākara."],["With various flower offerings—lotuses, fragrant [flowers], and blue water-lilies—and with various scents and incense of guggulu and sandalwood,","puṣpa-upahāraiḥ vividhaiḥ — with various flower offerings; padma — lotuses; saugandhika — fragrant [flowers]; utpalaiḥ — and blue water-lilies; nānā-prakāraiḥ gandhaiḥ — with various scents; dhūpaiḥ — with incense; guggulu-candanaiḥ — of guggulu and sandalwood."],["With kṛśaras, pāyasa, various ornaments; having worshipped, O best of Brāhmaṇas, with food, clothes, and ornaments,","kṛśaraiḥ — with kṛśaras; pāyasa-annaiḥ — with pāyasa foods; vividhaiḥ — various; ca — and; vibhūṣaṇaiḥ — with ornaments; arcayitvā — having worshipped; dvija-śreṣṭha — O best of Brāhmaṇas; bhakṣya-vasttra-ādi-bhūṣaṇaiḥ — with foods, clothes, and ornaments."],["Having obtained the fruit of all fortnights, he then goes to the Sun-world; at the end of austerity, O hero, he is born in a great family.","sarva-pakṣa-phalam — the fruit of all fortnights; prāpya — having obtained; sūrya-lokam — to the Sun-world; tataḥ — then; vrajet — he goes; tapasā ante — at the end of austerity; tataḥ — then; vīra — O hero; kule mahati — in a great family; jāyate — he is born."],["One should carefully recite the names in due order: in Māgha, and in the month Phālguna, and in Chaitra, O elder brother of Garuḍa;","yathā-kramam — in due order; prayatnena — carefully; nāmāni — the names; parikīrtayet — one should recite; māghe — in Māgha; ca — and; phālgune māsi — in the month Phālguna; caitre ca — and in Chaitra; garuḍa-agraja — O elder brother of Garuḍa."],["In Vaiśākha, then in Jyeṣṭha, in Āṣāḍha, and likewise in Śrāvaṇa; in the month Bhādrapada, O hero, and also in Āśvayuja, O bird;","vaiśākhe — in Vaiśākha; tu — and; atha — then; jyeṣṭhe — in Jyeṣṭha; āṣāḍhe — in Āṣāḍha; śrāvaṇe tathā — and likewise in Śrāvaṇa; māsi bhādrapade — in the month Bhādrapada; vīra — O hero; tathā — and; āśvayuje — in Āśvayuja; khaga — O bird."],["In Mārgashīrṣa and likewise in Pauṣa one should always worship Ravi: Vibhāvasu, Vivasvat, Bhāskara, O best of birds;","mārgaśīrṣe — in Mārgashīrṣa; tathā — likewise; pauṣe — in Pauṣa; pūjayet — one should worship; satatam — always; ravim — Ravi; vibhāvasum — Vibhāvasu; vivasvantam — Vivasvat; bhāskaram — Bhāskara; pakṣi-sattama — O best of birds."],["Vikartana, Patanga, and Sahasrāṃśu, O lord of birds; these are the divine names in these months, O sky-goer.","vikartanam — Vikartana; pataṅgam — Patanga; ca — and; sahasrāṃśum — Sahasrāṃśu; khaga-adhipa — O lord of birds; etāni — these; deva-nāmāni — divine names; māseṣu eteṣu — in these months; khe-cara — O sky-goer."],["One should worship the Lord of gods, difficult even for gods to attain; in this order one should worship Tīkṣṇāṃśu by the names.","pūjayet — one should worship; deva-deveśam — the Lord of gods; devānām api — even for gods; durlabham — difficult to attain; evam krameṇa — in this order; tīkṣṇāṃśum — Tīkṣṇāṃśu; nāmabhiḥ — with names; pari-pūjayet — should worship."],["Thus this secret has been fully told by me to you, O bird; it should not be given to a nondevotee, nor at any time to a nonstudent.","iti evam — thus; te — to you; samākhyātam — fully told; mayā — by me; guhyam idam — this secret; khaga — O bird; abaktāya — to a nondevotee; na dātavyam — should not be given; na aśiṣyāya — nor to a nonstudent; kathaṃcana — at any time."],["Nor should it be given to a sinner, O hero, O son of Vinatā; it should be given to a Brāhmaṇa for the destruction of disease, O good-vowed one.","na ca — nor; pāpa-kṛte — to a sinner; vīra — O hero; dātavyam — should be given; vinatā-ātmaja — O son of Vinatā; vyādheḥ nāśana-arthāya — for destruction of disease; deyam — should be given; viprāya — to a Brāhmaṇa; su-vrata — O good-vowed one."],["Having given, one obtains heaven; and having heard according to rule, O bird.","dattvā — having given; svargam — heaven; avāpnoti — one obtains; śrutvā ca — and having heard; vidhi-vat — according to rule; khaga — O bird."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:196,verseCount:57,subtitle:"Chapter 196 — Description of Name-Worship Procedure",colophon:""},T);</script></body>
