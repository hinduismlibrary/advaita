<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 189 — Saptāśva and Anūru on Solar Dharma."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 189 — Saptāśva and Anūru on Solar Dharma — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 189 — Saptāśva and Anūru on Solar Dharma</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-188/">← Chapter 188</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-190/">Chapter 190 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["As the contents of an unbaked vessel perish in a broken vessel, so a gift neglecting japa perishes with its recipient, as good seed sown in saline soil becomes fruitless.","āmā-pātra-rasāḥ — juices of raw vessels; yathā — just as; naśyante — perish; naśya-bhājane — in a perishing vessel; japa-upekṣe — when japa is neglected; tathā — so; dānam — a gift; saha pātreṇa — together with the recipient; naśyati — perishes; sat-bījam — good seed; ūṣare — in saline ground; samuptam — sown; niṣphalam bhavet — becomes fruitless."],["As an oblation poured into ashes is fruitless for the sacrificer, so a gift to a Brāhmaṇa without japa is meaningless.","bhasmani iva — as in ashes; hutam havyam — an oblation offered; yathā — just as; hotuḥ — for the sacrificer; niṣphalam — fruitless; japena rahite vipre — to a Brāhmaṇa lacking japa; tathā — so; dānam — a gift; nirarthakam — is fruitless."],["As a eunuch is fruitless among women, and a cow is fruitless among cows, so the birth of a Brāhmaṇa without japa is fruitless.","yathā — as; ṣaṇḍhaḥ — a eunuch; aphalaḥ — fruitless; strīṣu — with women; yathā — as; gauḥ — a cow; gavi — among cows; ca aphalā — and fruitless; brāhmaṇasya — of a Brāhmaṇa; tathā — so; janma — birth; japa-hīnasya — of one without japa; niṣphalam — fruitless."],["As one crossing water by an iron boat sinks into the water, so the giver, giver, and receiver fall into blind darkness.","loha-uḍupena — with an iron boat; prataran — crossing; nimajjati — sinks; udake — in water; yathā — as; dātā dātā ca grahītā ca — the giver, the giver, and the receiver; patati — fall; andhe tamasi — in blind darkness; atha — then."],["Whatever is given with compassion toward all beings and with faith, O bird, is to be known as the supreme gift that fulfils all desires.","kāruṇyāt — through compassion; sarva-bhūteṣu — toward all beings; śraddhayā — with faith; yat pradīyate — whatever is given; dānam — gift; tat vai — that indeed; khaga — O Bird; jñeyam — is to be known; sarva-kāmikam — fulfilling all desires; uttamam — excellent."],["Whatever is given to the distressed, blind, poor, children, the aged, and the sick, O best of birds, has endless fruit.","dīnān — to the distressed; andha — blind; kṛpaṇānām — and poor; ca — and; bāla-vṛddha-ātureṣu — to children, the old, and the sick; yat dīyate — whatever is given; khaga-śreṣṭha — O best of birds; tasya — of that; ananta-phalam — endless fruit; bhavet — comes to be."],["For the good do not receive while aiming at their own benefit. They received for the benefit of the giver, beginning with hearing and the rest.","na hi — indeed not; svārtham samuddiśya — with one’s own interest intended; pratigṛhṇanti — do they receive; sādhavaḥ — the good; dātuḥ eva upakārāya — only for the donor’s benefit; jagṛhuḥ — they received; śravaṇa-ādayaḥ — hearing and the rest."],["For the benefit of the giver, the petitioner says give to me, because the giver goes upward while the receiver remains below.","dātuḥ eva upakārāya — for the donor’s own benefit; vadati — says; arthī — the petitioner; dada­sva me — ‘give to me’; yasmāt — because; dātā — the donor; prayāti ūrdhvam — goes upward; adhaḥ tiṣṭhet — remains below; pratigrahī — the receiver."],["The petitioner, speaking well, says give and seems to make wealth known. The petitioning I did earlier was indeed the fruit of not giving.","dehi iti — ‘give,’ thus; su-vadan — speaking well; arthī — the petitioner; dhanam — wealth; bodhayati iva — seems to make [one] aware; saḥ — he; yat mayā kṛtam arthitvam — the petitioning done by me; prage — early; adāna-phalam hi tat — that indeed is the fruit of non-giving."],["Miserly people do not say give and make others aware. This is the state of non giving, when we ask house to house.","bodhayanti na — they do not make [others] aware; yācante — they beg; dehi iti — saying ‘give’; kṛpaṇāḥ janāḥ — miserly people; avasthā iyam — this is the condition; adānasya — of non-giving; yadi yācāmaḥ — if we ask; gṛhe gṛhe — from house to house."],["When a petitioner comes to a house, who would not honour him. Who is this petitioner who should not be honoured, asking day after day.","āyāti — comes; arthī — a petitioner; gṛham — to a house; yaḥ tu — whoever; kaḥ tam na pratipūjayet — who would not honour him?; kaḥ ayam arthī — who is this petitioner; na pūjyaḥ syāt — who should not be honoured; yācamānaḥ — asking; dine dine — day after day."],["Those who by force join even unwilling ones to dependence on people, and ask day after day, show themselves to the giver.","yat balāt api — even by force; anicchantam — one unwilling; yojayanti — they join/engage; nara-āśrayān — human dependents/supporters; ahani ahani — day after day; yācante — they ask; dātuḥ — to the giver; te — they; darśayanti hi — indeed make [it] seen."],["One stands below and another stands above. The difference between giver and petitioner is indicated by the hands alone.","ekaḥ — one; tiṣṭhati — stands; ca adhaḥ — below; anyā ca — and another; upari tiṣṭhati — stands above; dātṛ-yācakayoḥ — between giver and petitioner; bhedaḥ — the distinction; karābhyām eva — by the hands alone; sūcitaḥ — is indicated."],["He who, when a petitioner has arrived, leaves aside the gift and looks for a worthy recipient, though engaged in all actions, is not a giver in the truest sense.","yaḥ — whoever; prāptāya arthine — to the petitioner who has arrived; dānam tyaktvā — leaving aside the gift; pātram udīkṣate — looks for a worthy recipient; sarva-karmasu yuktatvāt — though engaged in all actions; na dātā pār­mārthikaḥ — is not a giver in the true sense."],["If people were not petitioners, how would the dharma of giving exist. Let the gift be for petitioners, welcome, welcome dear.","yadi arthinaḥ narāḥ na syuḥ — if people were not petitioners; dāna-dharmaḥ katham bhavet — how would the dharma of giving exist?; tat — therefore; arthīṣu — for petitioners; bhavet dānam — let there be giving; svāgatam svāgatam priyam — welcome, welcome, dear."],["Water for the feet follows as the seven steps to heaven. According to thought and non thought, when and for whom does it perish.","pāda-udakam — water for the feet; anuvrajyāt — follows/attends; svarga-sopāna-saptakam — the seven stair-steps of heaven; cintā-acintā-anurūpeṇa — according to thought and reflection; kadā — when; kasya — for whom; vinaśyati — does it perish."],["It is fitting to give even half a morsel from the portion of oneself to constant petitioners. The wise say that a gift bereft of affection is lost.","grāsāt — from a morsel; ardham api grāsam — even half a morsel; yuktam — fitting; dātum — to give; sad-arthinām — to constant petitioners; dānam — giving; priya-vinirmuktam — devoid of affection; naṣṭam — lost; āhuḥ manīṣiṇaḥ — the wise say."],["Therefore one desiring endless fruit should give with honour. Even a refusal, skilful in affectionate persuasion, is better.","tasmāt — therefore; satkṛtya — with honour; dātavyam — one should give; ananta-phalam icchatā — by one desiring endless fruit; pratyākhyānam api — even a refusal; śreyaḥ — is better; priya-anunaya-peśalam — skilful in affectionate conciliation."],["That is not a gift which is stained by disrespect and harshness. Better that it not be given than given to petitioners with an angry heart.","na tat dānam — that is not a gift; asat-kāra-pāruṣya-malinīkṛtam — stained by disrespect and harshness; varam — better; na dattam — not given; arthibhyaḥ — to petitioners; saṃkruddhena antarātmanā — with an inwardly angry heart."],["There is no wealth, affection, or dharma devoid of love. Giving, observance, sacrifice, meditation, oblation, and austerity, all done with effort, are fruitless when anger is present, O bird.","na tat dhanam — there is no such wealth; na ca prītiḥ — nor affection; na dharmaḥ — nor dharma; priya-varjitaḥ — devoid of kindness; dāna-pradāna-niyama-yajña-dhyānam — giving, donation, observance, sacrifice, meditation; hutam — oblation; tapaḥ — austerity; yatnena api kṛtam sarvam — all even done with effort; krodhaḥ asya niṣphalam — anger makes it fruitless."],["He who gives what is worshipped with faith, and receives what is worshipped, both go to heaven. In the opposite case, they go to hell.","yaḥ — whoever; śraddhayā arcitam — worshipfully offered with faith; dadyāt — gives; prati-gṛhṇāti ca — and receives; arcitam — what was offered; tau ubhau — those two; gacchataḥ svargam — go to heaven; narakam — to hell; tat-viparyayāt — from the opposite."],["Generosity, welcome, friendship, compassion, and jealousy, by these five, giving to a guru has great fruit for the giver.","audāryam — generosity; svāgatam — welcome; maitrī — friendship; anukampā — compassion; ca matsaraḥ — and jealousy/rivalry; pañcabhiḥ tu — by these five; gurau dānam — a gift to a guru; dātuḥ dāne — in the giver’s giving; mahā-phalam — has great fruit."],["Vārāṇasī, Kurukṣetra, Prayāga, and Puṣkara, Gātaṭa, the ocean, and the Naimiṣa forest.","vārāṇasī — Vārāṇasī; kurukṣetram — Kurukṣetra; prayāgam — Prayāga; puṣkarāṇi ca — and Puṣkaras; gātaṭam — Gātaṭa; samudraḥ ca — and the ocean; naimiṣa-araṇyam eva ca — and the Naimiṣa forest."],["Mūlasthāna, greatly holy, and Puṇḍīrasvāmi, Kālapriya, O best of birds, and also Kṣīrikāvāsa.","mūla-sthānam — Mūlasthāna; mahā-puṇyam — greatly holy; puṇḍīra-svāmi­kam tathā — and Puṇḍīrasvāmi; kāla-priyam — Kālapriya; khaga-śreṣṭha — O best of birds; kṣīrikā-vāsam eva ca — and also Kṣīrikāvāsa."],["These places are proclaimed as frequented by gods and siddhas. All Sun shrines are holy, as are all rivers, mountains, and places where cows, siddhas, and sages dwell.","iti ete deśāḥ — these places; kīrtitāḥ — are proclaimed; sura-siddha-niṣevitāḥ — frequented by gods and siddhas; sarve sūrya-āśramāḥ — all Sun-shrines; puṇyāḥ — holy; sarvāḥ nadyaḥ — all rivers; sa-parvatāḥ — together with mountains; go-siddha-muni-vāsāḥ ca — and abodes of cows, siddhas, and sages; deśāḥ — places; puṇyāḥ prakīrtitāḥ — are proclaimed holy."],["Whatever little is given in the precincts of Sun shrines is to be known as having endless fruit, through the power of the sacred place.","sūrya-āyatana-saṃsthānām — in the precincts of Sun-temples; yat yat alpam — whatever little; tu dīyate — is given; tat ananta-phalam — that has endless fruit; jñeyam — is to be known; vacaḥ-kṣetra-anubhāvataḥ — through the declaration and power of the sacred place."],["The eclipses of the Moon and Sun, the northern course, the excellent equinox, Vyatīpāta, and Ṣaḍaśītimukha.","grahaṇam — eclipse; candra-sūryābhyām — of Moon and Sun; uttara-ayanam — northern course; uttamam — excellent; viṣuvam — equinox; savya­tīpātam — Vyatīpāta; ṣaḍaśīti-mukham tathā — and Ṣaḍaśītimukha."],["Day openings, saṅkrānti, and the sacred Viṣupada, O bird, this is declared as the time that increases merit among people.","dina-chidrāṇi — day-openings; saṅkrāntiḥ — saṅkrānti; puṇyam viṣupadam — sacred Viṣupada; khaga — O Bird; iti — thus; kālaḥ samaḥ khyātaḥ — time is declared alike/equivalent; puṃsām — for people; puṇya-vardhanaḥ — increasing merit."],["Devotional feeling, supreme affection, dharma, contemplation fixed only on dharma, and understanding are known as the five equivalents of faith.","bhakti-bhāvaḥ — devotional feeling; parā prītiḥ — supreme affection; dharmaḥ — dharma; dharma-eka-bhāvanaḥ — contemplation devoted only to dharma; pratipattiḥ — understanding; iti jñeyam — thus to be known; śraddhā-paryāya-pañcakam — five equivalents of faith."],["The supreme gift presented with faith according to rule to a worthy recipient should therefore be given by one who desires the imperishable, taking faith as support.","śraddhayā — with faith; vidhi-vat — according to rule; pātre — to a worthy recipient; pratipāditam — given; uttamam — the best; tasmāt — therefore; śraddhām samāsthāya — taking faith as support; deyaṃ — should be given; akṣayam icchatā — by one desiring imperishable [fruit]."],["Whatever gift is presented with faith according to rule to a worthy recipient is to be known as having endless fruit, even if only the measure of a bhāra.","yat dānam — whatever gift; śraddhayā — with faith; pātre — to a worthy recipient; vidhi-vat pratipāditam — given according to rule; tat — that; ananta-phalam — has endless fruit; jñeyam — is to be known; api vā — even; bhāra-mātrakam — only the weight of a bhāra."],["Whoever gives even a little with faith to the afflicted, poor, and virtuous obtains all desires and worlds. The wise declare that faith itself is giving.","ārtēṣu — to the afflicted; dīneṣu — to the poor; guṇa-anviteṣu — and to those endowed with good qualities; yaḥ — whoever; śraddhayā — with faith; svalpam api — even a little; pradadyāt — gives; saḥ — he; sarva-kāmān samupaiti — obtains all desires; lokān ca — and worlds; śraddhā eva dānam — faith itself is giving; pravadanti taj-jñāḥ — the wise say."],["Faith is known as the supreme gift, faith indeed is the supreme austerity. Here they call faith a sacrifice, faith the highest observance.","śraddhā — faith; dānam param jñeyam — is to be known as the highest gift; śraddhā eva — faith indeed; tapaḥ param — the highest austerity; śraddhām yajñam uśanti iha — here they call faith a sacrifice; śraddhā param upoṣitam — faith is the highest observance."],["Non injury, forbearance, truth, modesty, faith, restraint of the senses, giving, sacrifice, austerity, and meditation, these ten are means of dharma.","atha — now; ahiṃsā — non-injury; kṣamā — forbearance; satyam — truth; hrīḥ — modesty; śraddhā — faith; indriya-saṃyamaḥ — restraint of the senses; dānam — giving; iṣṭam — sacrifice; tapaḥ — austerity; dhyānam — meditation; daśakam — the ten; dharma-sādhanam — means of dharma."],["They are to be destroyed by all these, or by the solar dharmas practised together. One path is proclaimed for reaching the abode of the Sun.","hantavyāḥ — are to be destroyed; taiḥ samastaiḥ vā — by all these together, or; sūrya-dharmaiḥ — by solar dharmas; anuṣṭhitaiḥ — practised; sūrya-okasām — of the Sun’s abode; ca — and; samprāpteḥ — for reaching; gatiḥ ekā — one path; prakīrtitā — is proclaimed."],["As Earth is remembered as the supreme peace for all beings, therefore a wise man should perform great merit, desiring my world.","yathā — just as; bhūḥ — earth; sarva-bhūtānām — for all beings; śāntiḥ atiśayaḥ — supreme peace; smṛtaḥ — is remembered; tasmāt — therefore; sudhīḥ — the wise one; mahat puṇyam kuryāt — should perform great merit; mama-loka-īpsayā — desiring my world."],["The sinner who forms an intent toward the wife or property of another, and abandons a guru who is distressed, helpless, gone abroad, or oppressed by enemies.","para-strī-dravya-saṅkalpam — a desire for another man’s wife or property; yaḥ — whoever; sāpekṣam karoti — forms with interest; ca — and; gurum — a guru; ārtam — suffering; aśaktam vā — or helpless; videśe prasthitam tathā — likewise gone abroad; aribhiḥ paribhūtam ca — and oppressed by enemies; saṃtyajet — abandons; pāpa-kṛt — a sinner."],["And whoever shows contempt toward the wife, friends, or sons of that guru, that sin is to be known as equal to reviling the guru.","tat-bhāryā-mitra-putreṣu — toward his wife, friends, and sons; yaḥ — whoever; avajñām karoti — shows contempt; ca — and; iti etat pātakam — this sin; jñeyam — is to be known; guru-nindā-samam bhavet — as equal to reviling the guru."],["A killer of a Brāhmaṇa, a drinker of liquor, a thief, and one who approaches the guru bed are great sinners, and one joined with them is the fifth.","brahma-ghnaḥ — killer of a Brāhmaṇa; surā-paḥ — drinker of liquor; steyī — thief; guru-talpagaḥ — one who approaches the guru’s bed; mahā-pātakinaḥ — great sinners; tu ete — these indeed; tat-saṃyogī ca — and one associated with them; pañcamaḥ — is the fifth."],["Whoever from anger, hatred, fear, or greed speaks a grave offence to a Brāhmaṇa that ends life is declared a killer of a Brāhmaṇa.","krodhāt — from anger; dveṣāt — hatred; bhayāt — fear; lobhāt — or greed; brāhmaṇasya — to a Brāhmaṇa; vadet yaḥ — whoever speaks; prāṇa-āntikam — life-ending; mahā-doṣam — a grave offence; brahma-hā — a killer of a Brāhmaṇa; saḥ udāhṛtaḥ — he is declared."],["Whoever, having summoned a Brāhmaṇa who is begging and has nothing, says there is nothing, is declared a Caṇḍāla.","brāhmaṇam — a Brāhmaṇa; ca samāhūya — and having summoned; yācamānam akiñcanam — begging and possessing nothing; yat nāsti iti — ‘there is nothing’; ca yaḥ brūyāt — whoever says; saḥ — he; caṇḍālam udāhṛtaḥ — is declared a Caṇḍāla."],["Whoever takes land previously given to gods, dvijas, and cows, even if lost with time, is called a killer of a Brāhmaṇa.","deva-dvija-gavām — of gods, dvijas, and cows; bhūmim — land; pūrva-dattām — previously given; haret yaḥ — whoever takes; pranaṣṭām api — even if lost; kāle tu — with time; tam — him; āhuḥ — they call; brahma-ghātakam — a killer of a Brāhmaṇa."],["The dull witted man who, having studied the knowledge of Ravi, abandons it has a sin equal to that of a liquor drinker, O virtuous one.","adhītya — having studied; yaḥ — whoever; raveḥ jñānam — Ravi’s knowledge; parityajati — abandons; manda-dhīḥ — dull-witted; surā-peṇa samam — equal to a liquor-drinker; jñeyam — to be known; tasya pāpam — his sin; ca — and; su-vrata — O virtuous one."],["Abandonment of Agnihotra and the acts of the five sacrifices, abandonment of mother and father, false testimony, and killing a friend.","agni-hotra-parityāgaḥ — abandoning Agnihotra; pañca-yajñīya-karmaṇām — the acts of the five sacrifices; mātā-pitṛ-parityāgaḥ — abandoning mother and father; kūṭa-sākṣyam — false testimony; suhṛd-vadhaḥ — killing a friend."],["What is displeasing to the devotees of the Sun, eating forbidden food, and likewise killing innocent living beings.","apriyam — what is hateful; sūrya-bhaktānām — to the Sun’s devotees; abhākṣyasya bhakṣaṇam — eating what should not be eaten; evam — likewise; niraparādhānām prāṇinām — of innocent living beings; ca — and; pramāraṇam — killing."],["There is no sovereignty over all these in the excellent city of the gods. Rather, the lord of all grants sovereignty over the world of the self.","sarva-ādhipatyam — sovereignty over all; eteṣām — of these; nāsti — does not exist; deva-pura-uttame — in the excellent city of the gods; ātma-loka-ādhipatyam tu — rather, sovereignty over one’s own world; yacchet — may grant; sarva-jat-patiḥ — the lord of all."],["Some people devoted to the yoga of knowledge are liberated here itself. Others turn again in saṃsāra, intent on enjoyment.","ke cit — some; atra eva — here itself; mucyante — are released; jñāna-yoga-parāḥ — devoted to the yoga of knowledge; narāḥ — people; āvartante — turn again; punaḥ — again; ca anye — and others; saṃsāre — in saṃsāra; bhoga-tat-parāḥ — intent on enjoyment."],["Therefore one seeking liberation should abandon attachment to enjoyment. Detached and peaceful in mind, one should attain the solar world.","tasmāt — therefore; vimokṣam anvicchan — seeking liberation; bhoga-āsaktim — attachment to enjoyment; vivarjayet — should abandon; viraktaḥ — detached; śānta-citta-ātmā — with a peaceful mind; saura-lokam avāpnuyāt — should attain the solar world."],["Those whose hearts are unattached and who chant this incidentally, for them too one speaks according to their experience.","yat ca api — and also those who; asakta-hṛdayāḥ — whose hearts are unattached; japanti imam — chant this; prasaṅgataḥ — incidentally/as occasion arises; teṣām api — to them also; vadati ekaḥ — one speaks; sva-anubhāva-anurūpataḥ — according to one’s own experience."],["Those embodied beings who do not worship Bhānu even once, Ravi grants enjoyments in the world of piśācas.","tat na arcayanti ye — those who do not worship that; bhānum — Bhānu; sakṛt — even once; ucchiṣṭa-dehinaḥ — embodied ones bearing remnants/impurity; teṣām — to them; piśāca-loke — in the world of piśācas; tu — indeed; bhānuḥ — Bhānu; bhogān prayacchati — grants enjoyments."],["Those cruel ones who repeat the name of Bhānu twice with angry eyes, Ravi grants them great fortune in the world of rākṣasas.","dviḥ japanti — repeat twice; ca — and; ye — those who; bhānum — Bhānu; krūrāḥ — cruel; saṃkruddha-locanāḥ — with angry eyes; rakṣaḥ-loke — in the world of rākṣasas; raviḥ — Ravi; teṣām — to them; mahā-bhāgyam prayacchati — grants great fortune."],["Those who worship Bhānu three times, people devoted to wine and meat, Ravi grants divine enjoyments in the world of sages.","triḥ arcayanti — worship three times; ye — those who; bhānum — Bhānu; madya-māṃsa-ratāḥ — devoted to wine and meat; narāḥ — men; ṛṣi-loke — in the world of sages; raviḥ — Ravi; teṣām — to them; bhogān divyān prayacchati — grants divine enjoyments."],["Those who perform dance and song before the Sun three or four times, as they please, go to the dwelling of the Gandharvas, O bird.","ye — those who; nṛtya-gītam — dance and song; kurvanti — perform; triḥ-caturdhā — three or four times; yadṛcchayā — as they please; sūryasya agre — before the Sun; te yānti — they go; gandharva-bhavanam — to the dwelling of the Gandharvas; khaga — O Bird."],["People worship the lord of cows intending fame. For them Bhānu grants all desires in the abode of Śakra.","lokāḥ — people; khyātim samuddiśya — intending fame; pūjayanti — worship; ca — and; go-patim — the lord of cows; teṣām — for them; śakra-ālaye — in the abode of Śakra; bhānuḥ — Bhānu; kāmān sarvān prayacchati — grants all desires."],["Whoever worships Ravi six times with a mind attached to desire, Ravi grants enjoyments to that person in the world of Prajāpati.","kāma-āsaktena cittena — with a mind attached to desire; yaḥ — whoever; ṣaṭ — six times; arcayate — worships; ravim — Ravi; prājāpatye loke — in the world of Prajāpati; raviḥ — Ravi; tasya — for him; bhogān prayacchati — grants enjoyments."],["Whoever worships Citrabhānu nine times, O lord of birds, goes to the world of Viṣṇu and rejoices with Viṣṇu.","nava-kṛtvaḥ — nine times; arcayet yaḥ — whoever worships; tu — indeed; citra-bhānum — Citrabhānu; khaga-adhipa — O lord of birds; saḥ yāti — he goes; viṣṇu-sālokyam — to Viṣṇu’s world; viṣṇunā saha — together with Viṣṇu; modate — rejoices."],["Beyond that too is a station pleasing to beings, with divine qualities beyond measure and vimānas fulfilling every desire.","tasmāt api param — beyond that too; sthānam — a station; yat — which; bhūtānām — to beings; manoharam — pleasing; aprameya-guṇaiḥ — with immeasurable qualities; divyaiḥ vimānaiḥ — with divine vehicles; sarva-kāmikaiḥ — fulfilling all desires."],["It is filled with countless things, red ochre paintings, crowded with many houses, and shining like crores of suns.","asaṃkhyaiḥ vastubhiḥ — with countless things; vyāptam — filled; gairikaiḥ — with ochre-coloured things; rakta-citrakaiḥ — with red-coloured paintings; nānā-gṛha-samākīrṇaiḥ — crowded with many houses; sūrya-koṭi-sama-prabham — shining like a crore of suns."],["Those who worship dvijas go to that station. There they dwell and rejoice, O best of birds. Beyond that too is the station called the solar Jyotiṣka.","tat sthānam — to that station; te pragacchanti — they go; arcayanti ca ye — those who worship; dvijān — dvijas; tatra loke — in that world; khaga-śreṣṭha — O best of birds; vasanti — they dwell; viharanti ca — and rejoice; tasmāt api param — beyond that too; sthānam — a station; jyautiṣkam — Jyotiṣka; sauram ucyate — is called solar."],["Thus by the power of the Sun, people attain stations even through inferior acts, according to the measure of faith and disposition.","evam — thus; sūrya-anubhāvena — by the Sun’s power; nikṛṣṭena api karmaṇā — even by an inferior act; naraiḥ — by people; sthānāni avāpyante — stations are attained; śraddhā-bhāva-anurūpataḥ — according to the measure of faith and disposition."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:189,verseCount:60,subtitle:"Chapter 189 — Saptāśva and Anūru on Solar Dharma",colophon:""},T);</script></body></html>
