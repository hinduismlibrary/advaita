<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 189 — Dialogue of the Seven-Horsed Sun on Solar Duty."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 189 — Dialogue of the Seven-Horsed Sun on Solar Duty — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-6" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 189 — Dialogue of the Seven-Horsed Sun on Solar Duty</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-188/">← Chapter 188</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-190/">Chapter 190 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20261019-unified-theme-4"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-6"></script><script>const R=[["The Seven-Horsed Sun said: As the contents of an unbaked vessel perish when it breaks, so a gift made without sacred recitation perishes with its recipient; as good seed sown in salty soil is fruitless.","āmā-pātra-rasāḥ — juices of raw vessels; yathā — just as; naśyante — perish; naśya-bhājane — in a perishing vessel; japa-upekṣe — when japa is neglected; tathā — so; dānam — a gift; saha pātreṇa — together with the recipient; naśyati — perishes; sat-bījam — good seed; ūṣare — in saline ground; samuptam — sown; niṣphalam bhavet — becomes fruitless.","सप्ताश्वतिलक उवाच ।। आमपात्ररसा यद्वन्नश्यंते नश्यभाजने ।। जपोपेक्षे तथा दानं सह पात्रेण नश्यति ।। सद्बीजमूषरे यद्वत्समुप्तं निष्फलं भवेत् ॥ १ ॥"],["As an offering poured into ashes is fruitless for the sacrificer, so a gift to a Brahmin without sacred recitation is fruitless.","bhasmani iva — as in ashes; hutam havyam — an oblation offered; yathā — just as; hotuḥ — for the sacrificer; niṣphalam — fruitless; japena rahite vipre — to a Brāhmaṇa lacking japa; tathā — so; dānam — a gift; nirarthakam — is fruitless.","भस्मनीव हुतं हव्यं यथा होतुश्च निष्फलम् ।। जपेन रहिते विप्रे तथा दानं निरर्थकम् ॥ २ ॥"],["As a eunuch is unfruitful among women and a cow among cows, so the birth of a Brahmin without sacred recitation is fruitless.","yathā — as; ṣaṇḍhaḥ — a eunuch; aphalaḥ — fruitless; strīṣu — with women; yathā — as; gauḥ — a cow; gavi — among cows; ca aphalā — and fruitless; brāhmaṇasya — of a Brāhmaṇa; tathā — so; janma — birth; japa-hīnasya — of one without japa; niṣphalam — fruitless.","यथा षण्ढोऽफलः स्त्रीषु यथा गौर्गवि चाफला ।। ब्राह्मणस्य तथा जन्म जपहीनस्य निष्फलम् ॥ ३ ॥"],["As a man crossing water in an iron boat sinks into the water, so the giver and the receiver fall into blind darkness.","loha-uḍupena — with an iron boat; prataran — crossing; nimajjati — sinks; udake — in water; yathā — as; dātā dātā ca grahītā ca — the giver, the giver, and the receiver; patati — fall; andhe tamasi — in blind darkness; atha — then.","लोहोडुपेन प्रतरन्निमज्जत्युदके यथा ।। दाता दाता ग्रहीता च पतत्यंधे तमस्यथ ॥ ४ ॥"],["Whatever is given with compassion toward all beings and with faith, O bird, is to be known as the highest gift, fulfilling all desires.","kāruṇyāt — through compassion; sarva-bhūteṣu — toward all beings; śraddhayā — with faith; yat pradīyate — whatever is given; dānam — gift; tat vai — that indeed; khaga — O Bird; jñeyam — is to be known; sarva-kāmikam — fulfilling all desires; uttamam — excellent.","कारुण्यात्सर्वभूतेषु श्रद्धया यत्प्रदीयते ।। दानं तद्वै खग ज्ञेयं सार्वकामिकमुत्तमम् ॥ ५ ॥"],["Whatever is given to the distressed, the blind, the poor, children, the aged, and the sick, O best of birds, has endless fruit.","dīnān — to the distressed; andha — blind; kṛpaṇānām — and poor; ca — and; bāla-vṛddha-ātureṣu — to children, the old, and the sick; yat dīyate — whatever is given; khaga-śreṣṭha — O best of birds; tasya — of that; ananta-phalam — endless fruit; bhavet — comes to be.","दीनांधकृपणानां च बालवृद्धातुरेषु च ।। यद्दीयते खगश्रेष्ठ तस्यानन्तफलं भवेत् ॥ ६ ॥"],["The virtuous do not receive with their own interest in view; they receive for the giver’s benefit alone, beginning with hearing and the rest.","na hi — indeed not; svārtham samuddiśya — with one’s own interest intended; pratigṛhṇanti — do they receive; sādhavaḥ — the good; dātuḥ eva upakārāya — only for the donor’s benefit; jagṛhuḥ — they received; śravaṇa-ādayaḥ — hearing and the rest.","न हि स्वार्थं समुद्दिश्य प्रतिगृह्णंति साधवः ।। दातुरेवोपकाराय जगृहुः श्रवणादयः ॥ ७ ॥"],["For the giver’s benefit, the petitioner says, “Give to me”; the giver rises upward while the receiver remains below.","dātuḥ eva upakārāya — for the donor’s own benefit; vadati — says; arthī — the petitioner; dada­sva me — ‘give to me’; yasmāt — because; dātā — the donor; prayāti ūrdhvam — goes upward; adhaḥ tiṣṭhet — remains below; pratigrahī — the receiver.","दातुरेवोपकाराय वदत्यर्थी ददस्व मे ।। यस्माद्दाता प्रयात्यूर्ध्वमधस्तिष्ठेत्प्रतिग्रही ॥ ८ ॥"],["The petitioner speaks pleasantly, saying, “Give,” and seems to make wealth known. The request I made earlier was indeed the fruit of not giving.","dehi iti — ‘give,’ thus; su-vadan — speaking well; arthī — the petitioner; dhanam — wealth; bodhayati iva — seems to make [one] aware; saḥ — he; yat mayā kṛtam arthitvam — the petitioning done by me; prage — early; adāna-phalam hi tat — that indeed is the fruit of non-giving.","देहीति सुवदन्नर्थी धनं बोधयतीव सः ।। यन्मया कृतमर्थित्वं प्रगेऽदानफलं हि तत् ॥ ९ ॥"],["Miserly people do not make their need known, though they ask, “Give.” This is the condition of not giving: when we beg from house to house.","bodhayanti na — they do not make [others] aware; yācante — they beg; dehi iti — saying ‘give’; kṛpaṇāḥ janāḥ — miserly people; avasthā iyam — this is the condition; adānasya — of non-giving; yadi yācāmaḥ — if we ask; gṛhe gṛhe — from house to house.","बोधयंति न याचन्ते देहीति कृपणा जनाः ।। अवस्थेयमदानस्य यद्याचामो गृहेगृहे ॥ १० ॥"],["When a petitioner comes to a house, who would not honor him? Who is this petitioner who should not be honored, asking day after day?","āyāti — comes; arthī — a petitioner; gṛham — to a house; yaḥ tu — whoever; kaḥ tam na pratipūjayet — who would not honour him?; kaḥ ayam arthī — who is this petitioner; na pūjyaḥ syāt — who should not be honoured; yācamānaḥ — asking; dine dine — day after day.","आयात्यर्थी गृहं यस्तु कस्तं न प्रतिपूजयेत् ।। कोयमर्थी न पूज्यः स्याद्याचमानो दिनेदिने ॥ ११ ॥"],["Those who compel even an unwilling person to depend on others and beg day after day show themselves to the giver.","yat balāt api — even by force; anicchantam — one unwilling; yojayanti — they join/engage; nara-āśrayān — human dependents/supporters; ahani ahani — day after day; yācante — they ask; dātuḥ — to the giver; te — they; darśayanti hi — indeed make [it] seen.","यद्बलादप्यनिच्छंतं योजयंति नराश्रयान् ।। अहन्यहनि याचंते दातुस्ते दर्शयंति हि ।। ॥ १२ ॥"],["One stands below and another above; the difference between giver and petitioner is shown by the hands alone.","ekaḥ — one; tiṣṭhati — stands; ca adhaḥ — below; anyā ca — and another; upari tiṣṭhati — stands above; dātṛ-yācakayoḥ — between giver and petitioner; bhedaḥ — the distinction; karābhyām eva — by the hands alone; sūcitaḥ — is indicated.","एकस्तिष्ठति चाधस्तादन्यश्चोपरि तिष्ठति ।। दातृयाचकयोर्भेदः कराभ्यामेव सूचितः ॥ १३ ॥"],["Whoever, when a petitioner arrives, sets aside the gift and looks for a worthy recipient is not truly a giver, though engaged in every action.","yaḥ — whoever; prāptāya arthine — to the petitioner who has arrived; dānam tyaktvā — leaving aside the gift; pātram udīkṣate — looks for a worthy recipient; sarva-karmasu yuktatvāt — though engaged in all actions; na dātā pār­mārthikaḥ — is not a giver in the true sense.","यः प्राप्तायार्थिने दानं त्यक्त्वा पात्र मुदीक्षते ।। सर्वकर्मसु युक्तत्वान्न दाता पारमार्थिकः ॥ १४ ॥"],["If there were no petitioners, how would the practice of giving exist? Let a gift be made to petitioners: welcome, welcome, dear one.","yadi arthinaḥ narāḥ na syuḥ — if people were not petitioners; dāna-dharmaḥ katham bhavet — how would the dharma of giving exist?; tat — therefore; arthīṣu — for petitioners; bhavet dānam — let there be giving; svāgatam svāgatam priyam — welcome, welcome, dear.","यद्यर्थिनो नरा न स्युर्दानधर्मः कथं भवेत्।। तदर्थिषु भवेद्दानं स्वागतं स्वागतं प्रियम्।। ॥ १५ ॥"],["Water for washing the feet leads to the seven steps to heaven. According to thought and lack of thought, when, and for whom, does it perish?","pāda-udakam — water for the feet; anuvrajyāt — follows/attends; svarga-sopāna-saptakam — the seven stair-steps of heaven; cintā-acintā-anurūpeṇa — according to thought and reflection; kadā — when; kasya — for whom; vinaśyati — does it perish.","पादोदकमनुव्रज्यात्स्वर्गसोपानसप्तकम् ।। चिंताचिंतानुरूपेण कदा कस्य विनष्यति ॥ १६ ॥"],["It is fitting to give even half a mouthful from one’s own bite to constant petitioners. The wise say a gift without affection is lost.","grāsāt — from a morsel; ardham api grāsam — even half a morsel; yuktam — fitting; dātum — to give; sad-arthinām — to constant petitioners; dānam — giving; priya-vinirmuktam — devoid of affection; naṣṭam — lost; āhuḥ manīṣiṇaḥ — the wise say.","ग्रासादर्धमपि ग्रासं युक्तं दातुं सदार्थिनाम् ।। दानं प्रियविनिर्मुक्तं नष्टमाहुर्मनीषिणः ॥ १७ ॥"],["Therefore one who desires endless fruit should give with honor. Even a refusal spoken with gentle affection is better.","tasmāt — therefore; satkṛtya — with honour; dātavyam — one should give; ananta-phalam icchatā — by one desiring endless fruit; pratyākhyānam api — even a refusal; śreyaḥ — is better; priya-anunaya-peśalam — skilful in affectionate conciliation.","तस्मात्सत्कृत्य दातव्यमनंतफलमिच्छता ।। प्रेत्याख्यानमपि श्रेयः प्रियानुनयपेश लम् ॥ १८ ॥"],["That is no gift which is stained by disrespect and harshness. Better not to give than to give petitioners with an angry heart.","na tat dānam — that is not a gift; asat-kāra-pāruṣya-malinīkṛtam — stained by disrespect and harshness; varam — better; na dattam — not given; arthibhyaḥ — to petitioners; saṃkruddhena antarātmanā — with an inwardly angry heart.","न तद्दानमसत्कारपारुष्यमलिनीकृतम् ।। वरं न दत्तमर्थिभ्यः संक्रुद्धेनांतरात्मना ॥ १९ ॥"],["No wealth, affection, or righteousness is free from kindness. Giving, offering, observance, sacrifice, meditation, oblation, and austerity, even when done with effort, are fruitless through anger, O bird.","na tat dhanam — there is no such wealth; na ca prītiḥ — nor affection; na dharmaḥ — nor dharma; priya-varjitaḥ — devoid of kindness; dāna-pradāna-niyama-yajña-dhyānam — giving, donation, observance, sacrifice, meditation; hutam — oblation; tapaḥ — austerity; yatnena api kṛtam sarvam — all even done with effort; krodhaḥ asya niṣphalam — anger makes it fruitless.","न तद्धनं न च प्रीतिर्न धर्मः प्रियवर्जितः ।। दानप्रदाननियमयज्ञध्यानं हुतं तपः ।। यत्नेनापि कृतं सर्वं क्रोधोऽस्य निष्फलं खग ॥ २० ॥"],["Whoever gives what has been reverently offered with faith, and receives it reverently, both go to heaven; in the opposite case, they go to hell.","yaḥ — whoever; śraddhayā arcitam — worshipfully offered with faith; dadyāt — gives; prati-gṛhṇāti ca — and receives; arcitam — what was offered; tau ubhau — those two; gacchataḥ svargam — go to heaven; narakam — to hell; tat-viparyayāt — from the opposite.","यः श्रद्धयार्चितं दद्यात्प्रति गृह्णाति चार्चितम् ।। तावुभौ गच्छतः स्वर्गं नरक तद्विपर्ययात् ॥ २१ ॥"],["Generosity, welcome, friendship, compassion, and rivalry—through these five, giving to a teacher bears great fruit for the giver.","audāryam — generosity; svāgatam — welcome; maitrī — friendship; anukampā — compassion; ca matsaraḥ — and jealousy/rivalry; pañcabhiḥ tu — by these five; gurau dānam — a gift to a guru; dātuḥ dāne — in the giver’s giving; mahā-phalam — has great fruit.","औदार्यं स्वागतं मैत्री ह्यनुकंपा च मत्सरः ।। पंचभिस्तु गुरौ दानं दातुर्दाने महाफलम् ॥ २२ ॥"],["Vārāṇasī, Kurukṣetra, Prayāga, Puṣkara, Gātaṭa, the ocean, and the Naimiṣa forest.","vārāṇasī — Vārāṇasī; kurukṣetram — Kurukṣetra; prayāgam — Prayāga; puṣkarāṇi ca — and Puṣkaras; gātaṭam — Gātaṭa; samudraḥ ca — and the ocean; naimiṣa-araṇyam eva ca — and the Naimiṣa forest.","वाराणसी कुरुक्षेत्रं प्रयागं पुष्कराणि च ।। गातटं समुद्रश्च नैमिषारण्यमेव च ॥ २३ ॥"],["Mūlasthāna, greatly holy; Puṇḍīrasvāmi, Kālapriya, and Kṣīrikāvāsa as well, O best of birds.","mūla-sthānam — Mūlasthāna; mahā-puṇyam — greatly holy; puṇḍīra-svāmi­kam tathā — and Puṇḍīrasvāmi; kāla-priyam — Kālapriya; khaga-śreṣṭha — O best of birds; kṣīrikā-vāsam eva ca — and also Kṣīrikāvāsa.","मूलस्थानं महापुण्यं पुंडीरस्वामिकं तथा ।। कालप्रियं खगश्रेष्ठ क्षीरिकावास एव च ॥ २४ ॥"],["These places, frequented by gods and perfected beings, are declared holy. All Sun shrines, all rivers and mountains, and places where cows, perfected beings, and sages dwell are sacred.","iti ete deśāḥ — these places; kīrtitāḥ — are proclaimed; sura-siddha-niṣevitāḥ — frequented by gods and siddhas; sarve sūrya-āśramāḥ — all Sun-shrines; puṇyāḥ — holy; sarvāḥ nadyaḥ — all rivers; sa-parvatāḥ — together with mountains; go-siddha-muni-vāsāḥ ca — and abodes of cows, siddhas, and sages; deśāḥ — places; puṇyāḥ prakīrtitāḥ — are proclaimed holy.","इत्येते कीर्तिता देशाः सुरसिद्धनिषेविताः ।। सर्वे सूर्याश्रमाः पुण्याः सर्वा नद्यः सपर्वताः ।। गोसिद्धमुनि वासाश्च देशाः पुण्याः प्रकीर्तिताः ॥ २५ ॥"],["Whatever small gift is given at a Sun shrine is known to bear endless fruit through the power of the sacred place.","sūrya-āyatana-saṃsthānām — in the precincts of Sun-temples; yat yat alpam — whatever little; tu dīyate — is given; tat ananta-phalam — that has endless fruit; jñeyam — is to be known; vacaḥ-kṣetra-anubhāvataḥ — through the declaration and power of the sacred place.","सूर्यायतनसंस्थानां यद्यदल्पं तु दीयते ।। तदनंतफलं ज्ञेयं वचः क्षेत्रानुभावतः ॥ २६ ॥"],["Solar and lunar eclipses, the Sun’s northward course, the equinox, the Sun–Moon opposite-course alignment, and the 86-degree points.","grahaṇam — eclipse; candra-sūryābhyām — of Moon and Sun; uttara-ayanam — northern course; uttamam — excellent; viṣuvam — equinox; savya­tīpātam — Vyatīpāta; ṣaḍaśīti-mukham tathā — and Ṣaḍaśītimukha.","ग्रहणं चंद्रसूर्याभ्यामुत्तरायणमुत्तमम् ।। विषुवं सव्यतीपातं षडशीतिमुखं तथा ॥ २७ ॥"],["Changes of the Moon at the beginning or end of a half-day, the Sun’s passage into a new sign, and the sacred equinoctial point, O bird—these are declared times that increase people’s merit.","dina-chidrāṇi — day-openings; saṅkrāntiḥ — saṅkrānti; puṇyam viṣupadam — sacred Viṣupada; khaga — O Bird; iti — thus; kālaḥ samaḥ khyātaḥ — time is declared alike/equivalent; puṃsām — for people; puṇya-vardhanaḥ — increasing merit.","दिनच्छिद्राणि संक्रांतिः पुण्यं विषुपदं खग ।। इति कालः समा ख्यातः पुंसां पुण्यविवर्धनः ॥ २८ ॥"],["Devotion, supreme love, righteousness, contemplation solely on righteousness, and understanding are known as the five equivalents of faith.","bhakti-bhāvaḥ — devotional feeling; parā prītiḥ — supreme affection; dharmaḥ — dharma; dharma-eka-bhāvanaḥ — contemplation devoted only to dharma; pratipattiḥ — understanding; iti jñeyam — thus to be known; śraddhā-paryāya-pañcakam — five equivalents of faith.","भक्तिभावः परा प्रीतिर्धर्मो धर्मैकभावनः ।। प्रतिपत्तिरिति ज्ञेयं श्रद्धापर्यायपंचकम् ॥ २९ ॥"],["The highest gift, given with faith and according to rule to a worthy recipient, should therefore be bestowed by one seeking the imperishable, holding faith as support.","śraddhayā — with faith; vidhi-vat — according to rule; pātre — to a worthy recipient; pratipāditam — given; uttamam — the best; tasmāt — therefore; śraddhām samāsthāya — taking faith as support; deyaṃ — should be given; akṣayam icchatā — by one desiring imperishable [fruit].","श्रद्धया विधिवत्पात्रे प्रतिपादितमुत्तमम् ।। तस्माच्छ्रद्धां समास्थाय देयमक्षयमिच्छता ॥ ३० ॥"],["Whatever gift is given according to rule, with faith, to a worthy recipient is known to bear endless fruit, even if it weighs only one load.","yat dānam — whatever gift; śraddhayā — with faith; pātre — to a worthy recipient; vidhi-vat pratipāditam — given according to rule; tat — that; ananta-phalam — has endless fruit; jñeyam — is to be known; api vā — even; bhāra-mātrakam — only the weight of a bhāra.","यद्दानं श्रद्धया पात्रे विधिवत्प्रतिपादितम् ।। तदनंतफलं ज्ञेय मपि वा भारमात्रकम् ॥ ३१ ॥"],["Whoever gives even a little with faith to the afflicted, the poor, and those endowed with virtue obtains all desires and worlds; the wise declare that faith itself is giving.","ārtēṣu — to the afflicted; dīneṣu — to the poor; guṇa-anviteṣu — and to those endowed with good qualities; yaḥ — whoever; śraddhayā — with faith; svalpam api — even a little; pradadyāt — gives; saḥ — he; sarva-kāmān samupaiti — obtains all desires; lokān ca — and worlds; śraddhā eva dānam — faith itself is giving; pravadanti taj-jñāḥ — the wise say.","आर्तेषु दीनेषु गुणान्वितेषु यः श्रद्धया स्वल्पमपि प्रदद्यात् ।। स सर्वकामान्समुपैति लोकाञ्च्छ्रद्धैव दानं प्रवदंति तज्ज्ञाः ॥ ३२ ॥"],["Faith is to be known as the highest gift; faith is indeed the highest austerity. Here they call faith a sacrifice, and faith the highest fast.","śraddhā — faith; dānam param jñeyam — is to be known as the highest gift; śraddhā eva — faith indeed; tapaḥ param — the highest austerity; śraddhām yajñam uśanti iha — here they call faith a sacrifice; śraddhā param upoṣitam — faith is the highest observance.","श्रद्धा दानं परं ज्ञेयं श्रद्धा एव तपः परम् ।। श्रद्धां यज्ञमुशन्तीह श्रद्धा परमुपोषितम् ॥ ३३ ॥"],["Nonviolence, patience, truth, modesty, faith, restraint of the senses, giving, sacrifice, austerity, and meditation—these ten are means of righteousness.","atha — now; ahiṃsā — non-injury; kṣamā — forbearance; satyam — truth; hrīḥ — modesty; śraddhā — faith; indriya-saṃyamaḥ — restraint of the senses; dānam — giving; iṣṭam — sacrifice; tapaḥ — austerity; dhyānam — meditation; daśakam — the ten; dharma-sādhanam — means of dharma.","अथाहिंसा क्षमा सत्यं ह्रीः श्रद्धेंद्रियसंयमः ।। दानमिष्टं तपो ध्यानं दशकं धर्मसाधनम् ॥ ३४ ॥"],["Sins are destroyed by all these practices or by observing the rites of the Sun; one path is declared for reaching the Sun’s abode.","hantavyāḥ — are to be destroyed; taiḥ samastaiḥ vā — by all these together, or; sūrya-dharmaiḥ — by solar dharmas; anuṣṭhitaiḥ — practised; sūrya-okasām — of the Sun’s abode; ca — and; samprāpteḥ — for reaching; gatiḥ ekā — one path; prakīrtitā — is proclaimed.","हंतव्यस्तैः समस्तैर्वा सूर्यधर्मैरनुष्ठितैः ।। सूर्यौकसां च संप्राप्तेर्गतिरेका प्रकीर्तिता ॥ ३५ ॥"],["As Earth is considered the highest peace for all beings, a wise one should perform great merit, desiring my world.","yathā — just as; bhūḥ — earth; sarva-bhūtānām — for all beings; śāntiḥ atiśayaḥ — supreme peace; smṛtaḥ — is remembered; tasmāt — therefore; sudhīḥ — the wise one; mahat puṇyam kuryāt — should perform great merit; mama-loka-īpsayā — desiring my world.","यथा भूः सर्वभूतानां शांतिरतिशयः स्मृतः ।। कुर्यात्पुण्यं महत्तस्मान्मम लोकेप्सया सुधी ॥ ३६ ॥"],["The sinner who intends to take another man’s wife or property, and abandons a teacher who is suffering, helpless, away in a foreign land, or oppressed by enemies.","para-strī-dravya-saṅkalpam — a desire for another man’s wife or property; yaḥ — whoever; sāpekṣam karoti — forms with interest; ca — and; gurum — a guru; ārtam — suffering; aśaktam vā — or helpless; videśe prasthitam tathā — likewise gone abroad; aribhiḥ paribhūtam ca — and oppressed by enemies; saṃtyajet — abandons; pāpa-kṛt — a sinner.","परस्त्रीद्रव्यसंकल्पं यः सापेक्षं करोति च ।। गुरुमार्तमशक्तं वा विदेशे प्रस्थितं तथा ।। अरिभिः परिभूतं च संत्यजेच्चैव पापकृत् ॥ ३७ ॥"],["Whoever shows contempt for that teacher’s wife, friends, or sons commits a sin considered equal to reviling the teacher.","tat-bhāryā-mitra-putreṣu — toward his wife, friends, and sons; yaḥ — whoever; avajñām karoti — shows contempt; ca — and; iti etat pātakam — this sin; jñeyam — is to be known; guru-nindā-samam bhavet — as equal to reviling the guru.","तद्भार्यामित्रपुत्रेषु यश्चावज्ञां करोति च ।। इत्येतत्पातकं ज्ञेयं गुरुनिंदासमं भवेत् ॥ ३८ ॥"],["A killer of a Brahmin, a liquor drinker, a thief, and one who has relations with a teacher’s wife are great sinners; one who associates with them is the fifth.","brahma-ghnaḥ — killer of a Brāhmaṇa; surā-paḥ — drinker of liquor; steyī — thief; guru-talpagaḥ — one who approaches the guru’s bed; mahā-pātakinaḥ — great sinners; tu ete — these indeed; tat-saṃyogī ca — and one associated with them; pañcamaḥ — is the fifth.","ब्रह्मघ्नश्च सुरापश्च स्तेयी च गुरुतल्पगः ।। महापातकिनस्त्वेते तत्संयोगी च पञ्चमः ॥ ३९ ॥"],["Whoever, from anger, hatred, fear, or greed, utters to a Brahmin a grave offense that leads to death is declared a killer of a Brahmin.","krodhāt — from anger; dveṣāt — hatred; bhayāt — fear; lobhāt — or greed; brāhmaṇasya — to a Brāhmaṇa; vadet yaḥ — whoever speaks; prāṇa-āntikam — life-ending; mahā-doṣam — a grave offence; brahma-hā — a killer of a Brāhmaṇa; saḥ udāhṛtaḥ — he is declared.","क्रोधाद्द्वेषाद्भयाल्लोभाद्ब्राह्मणस्य वदेत यः ।। प्राणांतिकं महादोषं ब्रह्महा स उदाहृतः ॥ ४० ॥"],["Whoever summons a penniless Brahmin who has come begging and then says, “I have nothing,” is declared an outcaste.","brāhmaṇam — a Brāhmaṇa; ca samāhūya — and having summoned; yācamānam akiñcanam — begging and possessing nothing; yat nāsti iti — ‘there is nothing’; ca yaḥ brūyāt — whoever says; saḥ — he; caṇḍālam udāhṛtaḥ — is declared a Caṇḍāla.","ब्राह्मणं च समाहूय याचमानमकिंचनम् ।। यन्नास्तीति च यो ब्रूयात्स चाण्डालं उदाहृतः ॥ ४१ ॥"],["Whoever seizes land previously given to gods, twice-born men, or cows, even if it has since been lost, is called a killer of a Brahmin.","deva-dvija-gavām — of gods, dvijas, and cows; bhūmim — land; pūrva-dattām — previously given; haret yaḥ — whoever takes; pranaṣṭām api — even if lost; kāle tu — with time; tam — him; āhuḥ — they call; brahma-ghātakam — a killer of a Brāhmaṇa.","देवद्विजगवां भूमिं पूर्वदत्तां हरेत यः ।। प्रनष्टामपि काले तु तमाहुर्ब्रह्मघातकम् ॥ ४२ ॥"],["The dull-witted man who studies the Sun’s teaching and then abandons it incurs a sin equal to that of a liquor drinker, O virtuous one.","adhītya — having studied; yaḥ — whoever; raveḥ jñānam — Ravi’s knowledge; parityajati — abandons; manda-dhīḥ — dull-witted; surā-peṇa samam — equal to a liquor-drinker; jñeyam — to be known; tasya pāpam — his sin; ca — and; su-vrata — O virtuous one.","अधीत्य यो रवेर्ज्ञानं परित्यजति मंदधीः ।। सुरापेन समं ज्ञेयं तस्य पापं च सुव्रत ॥ ४३ ॥"],["Abandoning the daily fire offering and the acts of the five sacrifices; abandoning one’s mother and father; false testimony; killing a friend.","agni-hotra-parityāgaḥ — abandoning Agnihotra; pañca-yajñīya-karmaṇām — the acts of the five sacrifices; mātā-pitṛ-parityāgaḥ — abandoning mother and father; kūṭa-sākṣyam — false testimony; suhṛd-vadhaḥ — killing a friend.","अग्निहोत्रपरित्यागः पंचयज्ञियकर्मणाम् ।। मातापितृपरित्यागः कूटसाक्ष्यं सुहृद्वधः ॥ ४४ ॥"],["What displeases the Sun’s devotees, eating forbidden food, and killing innocent living beings.","apriyam — what is hateful; sūrya-bhaktānām — to the Sun’s devotees; abhākṣyasya bhakṣaṇam — eating what should not be eaten; evam — likewise; niraparādhānām prāṇinām — of innocent living beings; ca — and; pramāraṇam — killing.","अप्रियं सूर्यभक्तानामभक्ष्यस्य च भक्षणम् ।। एवं निरपराधानां प्राणिनां च प्रमारणम् ॥ ४५ ॥"],["In the highest city of the gods, they have no sovereignty over all; rather, the Lord of All grants them sovereignty in their own world.","sarva-ādhipatyam — sovereignty over all; eteṣām — of these; nāsti — does not exist; deva-pura-uttame — in the excellent city of the gods; ātma-loka-ādhipatyam tu — rather, sovereignty over one’s own world; yacchet — may grant; sarva-jat-patiḥ — the lord of all.","सर्वाधिपत्यमेतेषां नास्ति देवपुरोत्तमे ।। आत्मलोकाधिपत्यं तु यच्छेत्सर्वजत्पतिः ॥ ४६ ॥"],["Some people devoted to the path of knowledge are liberated here itself; others, intent on enjoyment, return again to the cycle of rebirth.","ke cit — some; atra eva — here itself; mucyante — are released; jñāna-yoga-parāḥ — devoted to the yoga of knowledge; narāḥ — people; āvartante — turn again; punaḥ — again; ca anye — and others; saṃsāre — in saṃsāra; bhoga-tat-parāḥ — intent on enjoyment.","केचिदत्रैव मुच्यन्ते ज्ञानयोगपरा नराः ।। आवर्तंते पुनश्चान्ये संसारे भोगतत्पराः ॥ ४७ ॥"],["Therefore one seeking liberation should abandon attachment to enjoyment; detached and peaceful in mind, one should attain the Sun’s world.","tasmāt — therefore; vimokṣam anvicchan — seeking liberation; bhoga-āsaktim — attachment to enjoyment; vivarjayet — should abandon; viraktaḥ — detached; śānta-citta-ātmā — with a peaceful mind; saura-lokam avāpnuyāt — should attain the solar world.","तस्माद्विमोक्षमन्विच्छन्भोगासक्तिं विवर्जयेत् ।। विरक्तः शांतचित्तात्मा सौरलोकमवाप्नुयात् ॥ ४८ ॥"],["Those whose hearts are unattached and who recite this as occasion arises—one speaks to them too according to one’s own experience.","yat ca api — and also those who; asakta-hṛdayāḥ — whose hearts are unattached; japanti imam — chant this; prasaṅgataḥ — incidentally/as occasion arises; teṣām api — to them also; vadati ekaḥ — one speaks; sva-anubhāva-anurūpataḥ — according to one’s own experience.","यच्चाप्यसक्तहृदया जपन्तीमं प्रसंगतः ।। तेषामपि वदत्येकः स्वानुभावानुरूपतः ॥ ४९ ॥"],["Those impure in body who never worship the Sun even once are given enjoyments by the Sun in the world of ghosts.","tat na arcayanti ye — those who do not worship that; bhānum — Bhānu; sakṛt — even once; ucchiṣṭa-dehinaḥ — embodied ones bearing remnants/impurity; teṣām — to them; piśāca-loke — in the world of piśācas; tu — indeed; bhānuḥ — Bhānu; bhogān prayacchati — grants enjoyments.","तन्नार्चयन्ति ये भानुं सकृदुच्छिष्टदेहिनः ।। तेषां पिशाचलोके तु भोगान्भानुः प्रयच्छति ॥ ५० ॥"],["Those cruel men who recite the Sun’s name twice, their eyes filled with anger, are granted great fortune by the Sun in the world of demons.","dviḥ japanti — repeat twice; ca — and; ye — those who; bhānum — Bhānu; krūrāḥ — cruel; saṃkruddha-locanāḥ — with angry eyes; rakṣaḥ-loke — in the world of rākṣasas; raviḥ — Ravi; teṣām — to them; mahā-bhāgyam prayacchati — grants great fortune.","द्विर्जपंति च ये भानुं क्रूराः संक्रुद्धलोचनाः ।। रक्षोलोके रविस्तेषां महाभाग्यं प्रयच्छति ॥ ५१ ॥"],["Those who worship the Sun three times, though devoted to liquor and meat, are granted divine enjoyments by the Sun in the world of sages.","triḥ arcayanti — worship three times; ye — those who; bhānum — Bhānu; madya-māṃsa-ratāḥ — devoted to wine and meat; narāḥ — men; ṛṣi-loke — in the world of sages; raviḥ — Ravi; teṣām — to them; bhogān divyān prayacchati — grants divine enjoyments.","त्रिरर्चयन्ति ये भानुं मद्यमांसरता नराः ।। ऋषिलोके रविस्तेषां भोगान्दिव्यान्प्रयच्छति ॥ ५२ ॥"],["Those who dance and sing before the Sun three or four times, as they please, go to the abode of celestial musicians, O bird.","ye — those who; nṛtya-gītam — dance and song; kurvanti — perform; triḥ-caturdhā — three or four times; yadṛcchayā — as they please; sūryasya agre — before the Sun; te yānti — they go; gandharva-bhavanam — to the dwelling of the Gandharvas; khaga — O Bird.","ये नृत्यगीतं कुर्वंति त्रिश्चतुर्धा यदृच्छया ।। सूर्यस्याग्रे तु ते यांति गंधर्वभवनं खग ॥ ५३ ॥"],["People worship the Lord of Cows seeking fame; for them the Sun grants every desire in Indra’s abode.","lokāḥ — people; khyātim samuddiśya — intending fame; pūjayanti — worship; ca — and; go-patim — the lord of cows; teṣām — for them; śakra-ālaye — in the abode of Śakra; bhānuḥ — Bhānu; kāmān sarvān prayacchati — grants all desires.","लोकाः ख्यातिं समुद्दिश्य पूजयंति च गोपतिम् ।। तेषां शक्रालये भानुः कामान्त्सर्वान्प्रयच्छति ॥ ५४ ॥"],["Whoever worships the Sun six times with a mind attached to desire is granted enjoyments by the Sun in the world of the Lord of Creatures.","kāma-āsaktena cittena — with a mind attached to desire; yaḥ — whoever; ṣaṭ — six times; arcayate — worships; ravim — Ravi; prājāpatye loke — in the world of Prajāpati; raviḥ — Ravi; tasya — for him; bhogān prayacchati — grants enjoyments.","कामासक्तेन चित्तेन यः षडर्चयते रविम् ।। प्राजापत्ये रविस्तस्य लोके भोगान्प्रयच्छति ॥ ५५ ॥"],["Whoever worships the Bright-Rayed Sun nine times, O lord of birds, goes to Viṣṇu’s world and rejoices with Viṣṇu.","nava-kṛtvaḥ — nine times; arcayet yaḥ — whoever worships; tu — indeed; citra-bhānum — Citrabhānu; khaga-adhipa — O lord of birds; saḥ yāti — he goes; viṣṇu-sālokyam — to Viṣṇu’s world; viṣṇunā saha — together with Viṣṇu; modate — rejoices.","नवकृत्वोर्चयेद्यस्तु चित्रभानुं खगाधिप ।। स याति विष्णुसालोक्यं विष्णुना सह मोदते ॥ ५६ ॥"],["Beyond that too is a station pleasing to beings, with immeasurable divine qualities and wish-fulfilling celestial cars.","tasmāt api param — beyond that too; sthānam — a station; yat — which; bhūtānām — to beings; manoharam — pleasing; aprameya-guṇaiḥ — with immeasurable qualities; divyaiḥ vimānaiḥ — with divine vehicles; sarva-kāmikaiḥ — fulfilling all desires.","तस्मादपि परं स्थानं यद्भूतानां मनोहरम् ।। अप्रमेयगुणैदिव्यैर्विमानैः सार्वकामिकैः ॥ ५७ ॥"],["It is filled with countless things and red-ochre paintings, crowded with many houses, and shining like a crore suns.","asaṃkhyaiḥ vastubhiḥ — with countless things; vyāptam — filled; gairikaiḥ — with ochre-coloured things; rakta-citrakaiḥ — with red-coloured paintings; nānā-gṛha-samākīrṇaiḥ — crowded with many houses; sūrya-koṭi-sama-prabham — shining like a crore of suns.","असंख्यैर्वस्तुभिर्व्याप्तं गैरिकै रक्तचित्रकैः ।। नानागृहसमाकीर्णैः सूर्यकोटिसमप्रभम् ॥ ५८ ॥"],["Those who honor the twice-born go to that place. There they dwell and rejoice, O best of birds. Beyond it lies a further place called the Sun’s Realm of Light.","tat sthānam — to that station; te pragacchanti — they go; arcayanti ca ye — those who worship; dvijān — dvijas; tatra loke — in that world; khaga-śreṣṭha — O best of birds; vasanti — they dwell; viharanti ca — and rejoice; tasmāt api param — beyond that too; sthānam — a station; jyautiṣkam — Jyotiṣka; sauram ucyate — is called solar.","तत्स्थानं ते प्रगच्छंति अर्चयन्ति च ये द्विजान् ।। तत्र लोके खगश्रेष्ठ वसंति विहरंति च ।। तस्मादपि परं स्थानं ज्योतिष्कं सौरमुच्यते ॥ ५९ ॥"],["Thus, by the Sun’s power, people attain realms even through inferior deeds, according to their faith and disposition.","evam — thus; sūrya-anubhāvena — by the Sun’s power; nikṛṣṭena api karmaṇā — even by an inferior act; naraiḥ — by people; sthānāni avāpyante — stations are attained; śraddhā-bhāva-anurūpataḥ — according to the measure of faith and disposition.","एवं सूर्यानुभावेन निकृष्टेनापि कर्मणा ।। नरैः स्थानान्यवाप्यन्ते श्रद्धाभावानुरूपतः ।। ॥ ६० ॥"]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1],sa:r[2]}]));renderBhavishyaLiveChapter({chapter:189,verseCount:60,preferEmbeddedSanskrit:true,subtitle:"Chapter 189 — Dialogue of the Seven-Horsed Sun on Solar Duty",colophon:""},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body></html>
