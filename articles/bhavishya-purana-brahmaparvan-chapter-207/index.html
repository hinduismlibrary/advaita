of the god Bhāskara has been spoken by you. Brahmā, Viṣṇu, Śiva, and the others always worship him.","aho — ah; devasya — of the god; māhātmyam — greatness; bhāskarasya — of Bhāskara; tvayā uditam — spoken by you; pūjayanti — worship; sadā — always; hi — indeed; enam — him; brahma-viṣṇu-śivādayaḥ — Brahmā, Viṣṇu, Śiva, and the others."],["Vyāsa said. So it is, without doubt, as you say, O Bhārata. There is no god equal to the Sun, and no course equal to the Sun.","evam — so; etat — this; na saṃdehaḥ — there is no doubt; yathā — as; vadasi — you say; bhārata — O Bhārata; nāsti — there is not; sūrya-samaḥ — equal to the Sun; devaḥ — a god; sūrya-samā — equal to the Sun; gatiḥ — course."],["There is no Brahman equal to the Sun, no oblation equal to the Sun. There is no dharma equal to the Sun, no wealth equal to the Sun.","nāsti — there is not; sūrya-samam — equal to the Sun; brahma — Brahman; hutam — oblation; dharmaḥ — dharma; dhanam — wealth."],["There is no desire apart from the Sun, no position apart from the Sun. There is no relative equal to the Sun, no friend equal to the Sun.","nāsti — there is not; sūryāt ṛte — apart from the Sun; kāmaḥ — desire; padam — position; sūrya-samaḥ — equal to the Sun; bandhuḥ — relative; suhṛt — friend."],["There is no mother equal to the Sun, no guru equal to the Sun. There is no tīrtha equal to the Sun, nothing purer than that.","nāsti — there is not; sūrya-samā — equal to the Sun; mātā — mother; guruḥ — guru; tīrtham — tīrtha; tataḥ param — beyond that; na pavitram — nothing pure[r]."],["Know him as the one deity and as the refuge of the worlds, the deities, and the ancestors, O Bhārata.","tam — him; ekam — one; daivatam — deity; vidyāt — one should know; arka-parāyaṇam — devoted to Arka, refuge in Arka; lokānām — of the worlds; devatānām — of the deities; pitṝṇām ca api — and also of the ancestors; bhārata — O Bhārata."],["Those worshipping and praising him attain the highest state. Those who have taken refuge in him with devotion are freed from the ocean of existence.","tam arcantaḥ — those worshipping him; stuvantaḥ ca — and praising; prāpnuvanti — attain; parām gatim — the highest state; te — they; prapannāḥ — having taken refuge; bhaktyā — with devotion; muktāḥ — freed; bhava-sāgarāt — from the ocean of existence."],["Kings, thieves, planets, snakes, poverty, and troubles are not able to afflict when Bhāskara is pleased.","rājā — king; corāḥ — thieves; grahāḥ — planets; sarpāḥ — snakes; dāridryam — poverty; duḥkha-sampadaḥ — collections of distress; na ete — these are not; pīḍayitum śaktāḥ — able to afflict; prasanne — when pleased; bhāskare sati — Bhāskara being."],["Vyāsa said. Thus, O dear mighty armed one, that god devoted to Bhāskara is to be worshipped, bowed to, and meditated upon.","evam — thus; tāta — dear one; mahā-bāho — O mighty-armed one; devaḥ — god; bhāskara-tat-paraḥ — intent on Bhāskara; saḥ — he; pūjyaḥ — to be worshipped; namaskāryaḥ — to be saluted; dhyātavyaḥ — to be meditated upon; eva — indeed."],["This is a visible deity, the god of gods, to be honored with reverence. What use is saying much. Hear what I shall say.","pratyakṣa-devatā — visible deity; hi — indeed; eṣā — this; deva-devaḥ ayam — this god of gods; ādarāt — with honor; atha kim bahunā uktena — then what by much speaking; yat vakṣyāmi — what I shall say; nibodha — hear, understand; me — from me."],["Even a sinful son should worship on the days of Āditya. Those people who worship indeed reach the highest state.","pūjayet — should worship; tanayaḥ — son; pāpī — sinful; tathā — thus, also; āditya-dinaiḥ api — even on the days of Āditya; pūjayanti — worship; narāḥ — people; ye vai — who indeed; te yānti — they go; paramām gatim — to the highest state."],["When Sunday arrives, a man who worships Bhānu with devotion and faith, eating only at night, goes to the world of the immortals.","prāpte — having arrived; sūrya-dine — on the Sun's day; bhaktyā — with devotion; bhānum — Bhānu; sampūjya — having worshipped; śraddhayā — with faith; naktam karoti — takes food at night; puruṣaḥ — a man; saḥ yāti — he goes; amara-lokatām — to the world of the immortals."],["Whoever first offers five jewels to Ravi with devotion and a mantra goes to the world of the immortals.","yaḥ — whoever; pūrvam — first; raveḥ — to Ravi; bhaktyā — with devotion; pañca-ratna-samanvitam — furnished with five jewels; nivedayati — offers; mantreṇa — with a mantra; saḥ yāti — he goes; amara-lokatām — to the world of the immortals."],["Whoever performs śrāddha for Mārtaṇḍa according to rule at Saṅkrānti and at an ayana, O hero, goes to the world of the Sun.","mārtaṇḍa-prītaye — for the pleasure of Mārtaṇḍa; yaḥ — whoever; kuryāt — performs; śrāddham — śrāddha; vidhi-vat — according to rule; saṅkrāntau — at Saṅkrānti; ayane — at an ayana; vīra — O hero; sūrya-lokam — to the world of the Sun; saḥ gacchati — he goes."],["Having fasted on the sixth, the man who performs śrāddha properly on the seventh, saying May Bhāskara be pleased,","kṛtvā — having done; upavāsam — a fast; ṣaṣṭhyām — on the sixth; tu — and; saptamyām — on the seventh; yaḥ — whoever; mānavaḥ — man; karoti — performs; vidhi-vat — according to rule; śrāddham — śrāddha; bhāskaraḥ prīyatām iti — “may Bhāskara be pleased,”"],["Freed from all faults, he is honored in the world of the Sun. A man or a woman who worships Divākara on Saptamī,","sarva-doṣa-vinirmuktaḥ — freed from all faults; sūrya-loke — in the world of the Sun; mahīyate — is honored; mānavaḥ — a man; yaḥ — who; saptamyām — on the seventh; yoṣit vā api — or a woman; divākaram — Divākara;"],["Having worshipped Bhānu according to rule, obtains all desires, especially on his day and at an eclipse, O ruler of men.","prapūjya — having worshipped; vidhi-vat — according to rule; bhānum — Bhānu; sarvān kāmān — all desires; avāpnuyāt — obtains; viśeṣataḥ — especially; tasya dine — on that day; grahaṇe ca — and during an eclipse; nara-adhipa — O ruler of men."],["Know this, O Bhīṣma, no god is dearer than Bhāskara. Āditya alone, supreme among the gods, is worshipped.","iti — thus; bhīṣma — O Bhīṣma; vijānīhi — know; na devaḥ — no god; bhāskarāt priyaḥ — dearer than Bhāskara; ādityam ekam — Āditya alone; paramam — supreme; deva-deveṣu — among the gods; pūjitam — worshipped."],["As kings on earth ascend a mountain of jewels and obtain shares of jewels according to their capacity, completely,","ratna-parvatam — mountain of jewels; āruhya — having ascended; yathā — just as; bhuvi — on earth; nara-adhipāḥ — kings; sattva-anurūpam — according to capacity; gacchanti — they go; ratna-bhāgān — shares of jewels; aśeṣataḥ — completely;"],["So people, having worshipped Bhānu, obtain the fruit. One seeking wealth obtains wealth, one seeking a son obtains a son.","tathā — so; bhānum samārādhya — having worshipped Bhānu; prāpnuvanti — people obtain; narāḥ — people; phalam — fruit; dhana-arthī — one seeking wealth; prāpnuyāt — obtains; artham — wealth; putra-arthī — one seeking a son; prāpnuyāt — obtains; sutam — a son."],["One seeking liberation attains liberation, or goes to immortality. What use is saying much. Hear my words.","mokṣa-arthī — one seeking liberation; mokṣam āpnoti — attains liberation; atha vā — or; amaratām vrajet — goes to immortality; atha kim bahunā uktena — then what by much speaking; śṛṇu — hear; tvam — you; vacanam — words; mama — my."],["The groups of gods, beginning with Brahmā, having worshipped Bhānu, O Bhārata, obtained beautiful divine places in heaven,","brahma-ādayaḥ — beginning with Brahmā; deva-gaṇāḥ — groups of gods; bhānum ārādhya — having worshipped Bhānu; bhārata — O Bhārata; manoharāṇi — beautiful; divyāni — divine; divi — in heaven; sthānāni — places; avāpnuvan — obtained;"],["Unshakable and removing all sins, O greatly fortunate one.","acalāni — steadfast; mahābhāga — O greatly fortunate one; sarva-pāpa-harāṇi — removing all sins; ca — and."],["Sumantu said. Having spoken thus, the blessed Vyāsa disappeared right there. Bhīṣma also worshipped Bhānu with devotion, according to rule.","sumantuḥ uvāca — Sumantu said; iti uktvā — having spoken thus; bhagavān vyāsaḥ — the blessed Vyāsa; tatra eva — right there; antaradhīyata — disappeared; bhīṣmaḥ api — Bhīṣma also; pūjayām āsa — worshipped; bhaktyā — with devotion; bhānum — Bhānu; vidhi-vat — according to rule."],["Thus you too, O king of kings, worship this Divākara. Having worshipped Ravi with devotion, you will go to the eternal abode,","tathā — thus; tvam api — you too; rāja-indra — O king; pūjaya — worship; imam — this; divākaram — Divākara; pūjayitvā — having worshipped; ravim — Ravi; bhaktyā — with devotion; sthānam — abode; yāsi — you will go; śāśvatam — eternal;"],["Just as that blessed Vyāsa and Bhīṣma went, O giver of honor, having once worshipped the god Divākara with devotion on Saptamī.","yathā — just as; gataḥ — went; saḥ bhagavān vyāsaḥ — that blessed Vyāsa; bhīṣmaḥ ca — and Bhīṣma; māna-da — O giver of honor; sakṛt — once; prapūjya — having worshipped; saptamyām — on Saptamī; bhaktyā — with devotion; devam — the god; divākaram — Divākara."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:207,verseCount:26,subtitle:"Chapter 207 — Greatness of Āditya Worship",colophon:""},T);</script></body>
