<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 199 — Description of the Bhīṣma–Vyāsa Dialogue."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 199 — Description of the Bhīṣma–Vyāsa Dialogue — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 199 — Description of the Bhīṣma–Vyāsa Dialogue</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Bhīṣma said. By what does that Āditya soon become a giver of boons. I wish to hear that, O Vipra. Tell me truly.","saḥ ādityaḥ — that Āditya; bhavet — becomes; yena — by which; acirāt — soon; tu — indeed; vara-pradaḥ — giver of boons; tat — that; aham — I; śrotum icchāmi — wish to hear; vipra — O Brāhmaṇa; mām brūhi — tell me; tattvataḥ — truthfully."],["Vyāsa said. By worship, japa, homa, meditation, and concentration, having made the whole maṇḍala and likewise the time of initiation,","pūjayā — by worship; japa-homena — by japa and homa; dhyāna-dhāraṇayā — by meditation and concentration; saha — with; sakalam maṇḍalam — the whole maṇḍala; kṛtvā — having made; tat-dīkṣā-samayam — that initiation-time; tathā — likewise."],["Having obtained it, whoever worships with devotion, mind fixed on that, O hero, Bhānu soon becomes a giver of boons for him.","labdhvā — having obtained; radhayate — worships; yaḥ — whoever; tu — indeed; bhaktyā — with devotion; tat-gata-mānasaḥ — mind fixed on that; tasya — for him; bhānuḥ — Bhānu; bhavet — becomes; vīra — O hero; acirāt — soon; vara-pradaḥ — giver of boons."],["Strength, siddhi, great valor, splendor, his own body, wealth, grain, gold, beauty, and the prosperity of good fortune,","bala-siddhim — strength and accomplishment; mahat-vīryam — great valor; pratāpam — splendor; ca — and; sva-kāyanam — his own body; dhanam — wealth; dhānyam — grain; suvarṇam — gold; rūpam — beauty; saubhāgya-sampadam — prosperity of good fortune."],["Health, life, fame, glory, and sons, O giver of honor. Divākara gives these, no doubt, when he is pleased.","ārogyam — health; āyuḥ — life; kīrtim — fame; ca — and; yaśaḥ — glory; putrān — sons; ca — and; māna-da — O giver of honor; dadate — they give; na atra sandehaḥ — there is no doubt; yasya — when he; tuṣṭaḥ — is pleased; divākaraḥ — Divākara."],["Dharma, wealth, desire, knowledge, and the prosperity of mokṣa as well. The pleased Bhāskara gives these to people, no doubt.","dharmam — dharma; artham — wealth; tathā — likewise; kāmam — desire; vidyām — knowledge; mokṣa-śriyam — prosperity of liberation; tathā — likewise; dadate — gives; bhāskaraḥ — Bhāskara; tuṣṭaḥ — pleased; narāṇām — to people; na atra saṃśayaḥ — there is no doubt."],["Having worshipped Divākara by the solar procedure, O dear one, one obtains all desires and also the abode of Āditya, O king.","saureṇa vidhinā — by the solar procedure; tāta — O son; pūjayitvā — having worshipped; divākaram — Divākara; sarvān kāmān — all desires; avāpnōti — one obtains; tathā — likewise; āditya-ālayam — the abode of Āditya; nṛpa — O king."],["Bhīṣma said. Tell the solar bathing procedure with its secret, O great minded one, by which a pure man, having bathed, goes to worship Ravi.","saura-snāna-vidhim — solar bathing procedure; brūhi — tell; sa-rahasyam — with its secret; mahā-mate — O great-minded one; yena — by which; snātaḥ — bathed; amalaḥ — pure; yāti — goes; naraḥ — a man; pūjayitum — to worship; ravim — Ravi."],["Vyāsa said. Now I shall tell you the bath that destroys sin. In a clean, pleasant place, having gathered earth with the astra,","hanta — now; te — to you; sampravakṣyāmi — I shall tell; snānam — the bath; pāpa-praṇāśanam — destroying sin; śucau — in a clean; manorama-sthāne — pleasant place; saṃgṛhya — having gathered; astreṇa — with the weapon [mantra]; mṛttikām — earth."],["The sequence of junctions is the letter ha joined with ṭa, repha, and pha. Having gathered it with this astra, one should then bathe.","sandhi-saṅghaḥ — sequence of junctions; hakāraḥ — the letter ha; tu — indeed; ṭa-repha-pha-samanvite — joined with ṭa, repha, and pha; anena astreṇa — with this weapon [mantra]; saṃgṛhya — having gathered; tataḥ — then; snānam samācaret — one should perform the bath."],["Then one should perform the cleansing bath with the remaining half, in three portions together, free from grass and stones.","mala-snānam — cleansing bath; tataḥ paścāt — then afterwards; śeṣa-ardhena — with the remaining half; tu — indeed; kārayet — one should perform; bhāga-trayam — three portions; tu — indeed; sārdham — together; tṛṇa-pāṣāṇa-varjitam — free from grass and stones."],["One portion having been touched with the astra, another with Bhāskara, and the body with the third, one should consecrate each once.","ekam — one; astreṇa — with the weapon [mantra]; ca — and; ālabhya — having touched; tathā — likewise; anyam — another; bhāskareṇa — with Bhāskara; aṅgam — the body; ca eva — and; tṛtīyena — with the third; abhimantrya — having consecrated; sakṛt sakṛt — once each."],["Having recited the astra, one should cast the water in the directions, so the water becomes unobstructed. In the Sun sacred ford one should consecrate it with the second mantra each time.","japtvā — having recited; astreṇa — with the weapon [mantra]; kṣipet — one should cast; dikṣu — in the directions; nirvighnam — unobstructed; tu — indeed; jalam bhavet — the water becomes; sūrya-tīrthe — in the Sun’s sacred ford; dvitīyena — with the second [mantra]; abhimantrya — having consecrated; sakṛt sakṛt — each time."],["Having shaved, a man should then bathe in sacred fords. To the sound of drums and conch, he should meditate on the god Divākara.","muṇḍayitvā — having shaved; tataḥ — then; snāyāt — should bathe; iti — thus; tīrtheṣu — in sacred fords; mānavaḥ — a man; tūrya-śaṅkha-ninādena — with the sound of kettle-drum and conch; dhyātvā — having meditated; devam — the god; divākaram — Divākara."],["Having bathed with royal attendance and carefully sipped water again, then, O Bhīṣma, one should bathe joined with the mantra king.","snātvā — having bathed; rāja-upacāreṇa — with royal attendance; punaḥ — again; ācamya — having sipped water; yatnataḥ — carefully; snānam kṛtvā — having bathed; tataḥ — then; bhīṣma — O Bhīṣma; mantra-rājena saṃyutam — joined with the mantra-king."],["The two harephas joined with bindu, and likewise another with a long vowel, the mātrā joined with repha, and the letter ha with bindu.","harephau — the two harephas; bindu-yuktaḥ — joined with bindu; ca — and; tathā — likewise; anyaḥ — another; dīrghayā — with a long [vowel]; saha — joined; mātrayā — with the mātrā; repha-saṃyuktaḥ — joined with repha; hakāraḥ — the letter ha; bindunā saha — with bindu."],["The letter sa with visarga is called this mantra king. Then one should satisfy all the mantras with the fingertips.","sakāraḥ — the letter sa; sa-visargaḥ — with visarga; tu — indeed; mantra-rājaḥ — mantra-king; ayam — this; ucyate — is called; tataḥ — then; tu — indeed; tarpayed — one should satisfy; mantrān sarvān — all mantras; tān — them; kara-agrajaiḥ — with the tips of the hands."],["The gods are above the joints, and the sages likewise with the left hand. One should satisfy the ancestors with the right hand, with that seed.","parvaṇām — from the joints; ūrdhvataḥ — upward; devāḥ — the gods; savyena — with the left [hand]; munayaḥ tathā — and likewise the sages; pitaraḥ — the ancestors; ca — and; apasavyena — with the right [hand]; tat-bījena — with that seed; pratarpayet — one should satisfy."],["What is sung as foremost among syllables in the world by the wise is declared joined with bindu as the heart seed, no doubt.","yat — what; gītam — sung; pravaram — foremost; loke — in the world; akṣarāṇām — among syllables; manīṣibhiḥ — by the wise; tat — that; bindu-sahitam — joined with bindu; proktam — declared; hṛd-bījam — heart-seed; na saṃśayaḥ — no doubt."],["Having made the hand in the left hand, the wise knower of the procedure should meditate. Having bathed thus according to the procedure, one should worship the Sandhyā according to rule.","kṛtvā — having placed; vāma-kare — in the left hand; hastāt — from the hand; dhyātvā — having meditated; prājñaḥ — the wise; vidhi-vit — knower of the procedure; evam — thus; snātvā — having bathed; vidhānena — according to procedure; sandhyām — the sandhyā; vandet — should worship; vidhi-vat — according to rule."],["Then the learned one should cast a handful of water to Bhāskara and recite the three syllable mantra or Ṣaṇmukha, as desired.","tataḥ — then; vidvān — the learned one; kṣipet — should cast; paścāt — afterwards; bhāskarāya — to Bhāskara; udaka-añjalim — a handful of water; japet — should recite; ca — and; try-akṣaram mantram — the three-syllable mantra; ṣaṇ-mukham vā — or the six-faced [mantra]; yat-icchayā — as desired."],["The mantra king which I told you earlier, O king. Then in the sacred ford, having withdrawn the mantras, one should place the heart.","mantra-rājaḥ iti — ‘mantra-king’; yaḥ — which; pūrvam — earlier; tava — to you; ākhyātaḥ — told; mayā — by me; nṛpa — O king; paścāt — then; tīrthe — in the sacred ford; mantrān — the mantras; saṃhṛtya — having withdrawn; hṛdayam nyaset — one should place in the heart."],["Having made the self one with the mantras, one should offer arghya. Purely bathed on the earth with red sandalwood scents,","mantraiḥ — with the mantras; ātmānam — the self; ekatra kṛtvā — having made one; arghyam — arghya; pradāpayet — one should offer; rakta-candana-gandhaiḥ — with red sandalwood scents; tu — indeed; śuci-snātaḥ — cleanly bathed; mahī-tale — on the ground."],["Having made a maṇḍala, composed and steady in mind, one should take karavīra flowers and set them in a copper vessel.","kṛtvā — having made; maṇḍalakam — a maṇḍala; ekacittaḥ — composed in mind; vyavasthitaḥ — steady; gṛhītvā — having taken; karavīrāṇi — karavīras; saṃsthāpya — having set; tāmra-bhājane — in a copper vessel."],["Joined with sesame and rice, with fragrant water of kuśa, and with red sandalwood incense, one should prepare that arghya.","tila-taṇḍula-saṃyuktam — joined with sesame and rice grains; kuśa-gandha-udakena — with fragrant water of kuśa; tu — indeed; rakta-candana-dhūpena — with red sandalwood incense; yuktam — joined; arghyam — the arghya; prasādhya — having prepared; tat — that."],["Having placed that vessel on the head and gone to the ground on the knees, one should give Bhānu the arghya joined with the preceding mantra.","kṛtvā — having placed; śirasi — on the head; tat-pātram — that vessel; jānubhyām — with the knees; avanīm gataḥ — gone to the ground; pūrva-mantrena saṃyuktam — joined with the preceding mantra; arghyam — the arghya; dadyāt — should give; tu — indeed; bhānave — to Bhānu."],["Whoever thus offers is released from all sins. The fruit obtained with a thousand yuga beginnings and a hundred Vyatīpātas,","mucyate — is released; sarva-pāpaiḥ — from all sins; tu — indeed; yaḥ — whoever; hi — indeed; evam — thus; vinivedayet — offers; yat phalam — whatever fruit; yuga-ādi-sahasreṇa — by a thousand Yuga beginnings; vyatīpāta-śatena — and a hundred Vyatīpātas; ca — and."],["And a thousand solstices, likewise at a lunar eclipse, and by a hundred thousand cows given at Jyeṣṭha Puṣkara, O best of the Kuru lineage, that fruit one obtains by the arghya.","ayanānām sahasreṇa — by a thousand solstices; candrasya grahaṇe — at a lunar eclipse; tathā — likewise; gavām śata-sahasreṇa — by a hundred thousand cows; yat phalam — whatever fruit; jyeṣṭha-puṣkare — at Jyeṣṭha Puṣkara; datte — when given; kuru-kula-śreṣṭha — O best of the Kuru lineage; tat — that; arghyeṇa — by the arghya; phalam labhet — one obtains the fruit."],["Even one without an initiation mantra, with devotion over a year, obtains the fruit through arghya, O hero, no doubt.","dīkṣā-mantra-vihīnaḥ api — even without an initiation mantra; bhaktyā — with devotion; saṃvatsareṇa — over a year; tu — indeed; phalam — fruit; arghyeṇa — through the arghya; vai — indeed; vīra — O hero; labhate — obtains; na atra saṃśayaḥ — there is no doubt."],["The learned initiated one who offers arghya according to rule is not born on earth. He goes to dissolution in Bhāskara.","yaḥ punaḥ — but whoever; dīkṣitaḥ — initiated; vidvān — learned; vidhinā — according to rule; arghyam — the arghya; nivedayet — offers; na asau — he is not; utpadyate — born; bhūmau — on earth; saḥ — he; layam yāti — goes to dissolution; bhāskare — in Bhāskara."],["In this birth, soon he becomes a bearer of good fortune, life, and health, O hero, and a vessel of the happiness of his wife.","iha janmani — in this birth; saubhāgyam — good fortune; āyuḥ — life; ārogya-sampadām — prosperity of health; acirāt — in a short time; bhavate — becomes; vīra — O hero; saḥ — he; bhāryā-sukha-bhājanam — a vessel of a wife's happiness."],["This bathing procedure has been told by me to you in brief, for the welfare of human kings, a destroyer of all sins.","eṣaḥ — this; snāna-vidhiḥ — bathing procedure; proktaḥ — told; mayā — by me; saṃkṣepataḥ — in brief; tava — to you; hitāya — for the welfare; mānava-indrāṇām — of human kings; sarva-pāpa-praṇāśanaḥ — destroyer of all sins."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:199,verseCount:32,subtitle:"Chapter 199 — Description of the Bhīṣma–Vyāsa Dialogue",colophon:""},T);</script></body>
