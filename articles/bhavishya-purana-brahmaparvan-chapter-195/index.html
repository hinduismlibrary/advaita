<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 195 — Dream Description in the Sun–Aruṇa Dialogue."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 195 — Dream Description in the Sun–Aruṇa Dialogue — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-1" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 195 — Dream Description in the Sun–Aruṇa Dialogue</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["O Bhagavan, I wish to hear the supreme procedure of the Saptamīs, fitting to all. Tell [it], great sage.","bhagavan — O Bhagavan; śrotum icchāmi — I wish to hear; saptamīnām — of the Saptamīs; param vidhim — the supreme procedure; sarvāsām anurūpāṇām — fitting to all; kathayasva — tell; mahā-mune — O great sage."],["Saptāśvatilaka said: Hear, O hero, best of birds, the supreme procedure of the Saptamīs. I shall tell you all properly, as you ask.","śṛṇu — hear; vīra — O hero; khaga-śreṣṭha — O best of birds; saptamīnām param vidhim — the supreme procedure of the Saptamīs; kīrtayiṣyāmi — I shall tell; te sarvam — all to you; yathāvat — properly; paripṛcchate — as you ask."],["It is equal, indeed, to what was told by Vivasvat: when the bright fortnight has begun, on a Sunday, and in the northern course.","tulyam — equal; kila — indeed; yathā-ākhyātam — as told; vivasvatā — by Vivasvat; śukla-pakṣe — in the bright fortnight; ravi-dine — on Sunday; pravṛtte — having begun; ca — and; uttara-ayaṇe — in the northern course."],["One should undertake the Saptamī vow for son, wife, wealth, and field, [the vow] which is endowed with knowledge by the sages and gives the fruits of all desires.","putra-dāra-dhana-kṣetre — for son, wife, wealth, and field; gṛhṇīyāt — one should undertake; saptamī-vratam — the Saptamī vow; ṛṣibhiḥ — by sages; jñāna-sampannaiḥ — endowed with knowledge; sarva-kāma-phala-pradaiḥ — giving the fruits of all desires."],["Seven Saptamīs are declared; hear their names from me. One is with arka leaves, the second likewise with peppers.","saptamyaḥ sapta — seven Saptamīs; ākhyātāḥ — are declared; tāsām — of them; nāmāni — names; me — from me; śṛṇu — hear; arka-sampuṭakaiḥ — with arka leaves; ekā — one; dvitīyā — the second; maricaiḥ tathā — likewise with peppers."],["The third is with neem leaves, the fourth is Phala Saptamī. The seventh is named Kāmikā; learn their procedure from me.","tṛtīyā — the third; nimba-patraiḥ — with neem leaves; ca — and; caturthī — the fourth; phala-saptamī — Phala Saptamī; saptamī — the seventh; kāmikā nāmnā — by the name Kāmikā; vidhiṃ — procedure; āsām — of these; nibodha — learn; me — from me."],["On the fifth, one should take a single meal, with mind restrained. One should not eat little; one should abandon sexual intercourse far away.","pañcamyām — on the fifth; eka-bhaktam — a single meal; tu — indeed; kuryāt — one should do; niyata-mānasaḥ — with mind restrained; alpa-āhāram — little food; na kurvīta — one should not make; maithunam — sexual intercourse; dūrataḥ — from afar; tyajet — one should abandon."],["One should avoid honey and meat, and what is excessively sour, O lord of birds. In the morning of the sixth, in a single leaf-cup,","varjayet — one should avoid; madhu — honey; māṃsam ca — and meat; ati-amlām — excessively sour [food]; khaga-adhipa — O lord of birds; prabhāte — in the morning; eva — indeed; ṣaṣṭhyām — on the sixth; tu — and; ekaika-parṇa-sampuṭe — in a single leaf-cup."],["Having prepared ghee and rice, one should eat according to rule. Eating no other food, there should be a meal on the seventh.","ghṛta-śāli-odanam — ghee and rice; kṛtvā — having prepared; bhakṣayet — one should eat; tu — indeed; vidhānataḥ — according to rule; anya-annam — other food; abhuñjānaḥ — not eating; saptamyām — on the seventh; bhojanam bhavet — there should be a meal."],["Whoever lives with each one increased, O lord of birds, should eat pepper apart from [these], and thereafter neem leaves.","ekaika-vṛddha-abhiyuktaiḥ — with each one increased; yaḥ — whoever; vaset — lives; tu — indeed; khaga-īśvara — O lord of birds; anyatra — apart from [these]; maricam — pepper; bhakṣet — should eat; nimba-patrāṇi — neem leaves; ataḥ param — thereafter."],["Thus the fruits are obtained here in both fortnights. One should carefully be without foods; the Anodana is remembered as one who does not eat rice.","evam — thus; labdha-phalāni — fruits obtained; iha — here; pakṣayoḥ ubhayoḥ api — in both fortnights; anna-adāḥ rahitaḥ — free from those who eat food; yatnāt — carefully; an-odanāḥ — without cooked rice; iti — thus; smṛtaḥ — is remembered."],["Having worshipped Vibhāvasu with devotion according to rule, one should observe Vijaya Saptamī, living on air for a day and a night.","ācaret — one should observe; vidhi-vat — according to rule; bhaktyā — with devotion; pūjayitvā — having worshipped; vibhāvasum — Vibhāvasu; aho-rātram — for a day and night; vāyu-bhakṣaḥ — living on air; kuryāt — one should perform; vijaya-saptamīm — Vijaya Saptamī."],["Each of the seven Saptamīs should be observed right here according to rule. Having written their names separately on leaves,","eka-ekam — each one; sapta saptamīḥ — the seven Saptamīs; atra eva — right here; vidhi-vat — according to rule; caret — one should observe; prālekhya — having written; tāsām nāmāni — their names; patrakeṣu — on leaves; pṛthak-pṛthak — separately."],["Having written all those names, with a composed mind, on one anointed on the body with white sandal and adorned with garland strings,","tāni sarvāṇi nāmāni — all those names; vilekhya — having written; su-samāhitaḥ — with a composed mind; śveta-candana-digdha-aṅge — on one whose body is anointed with white sandal; mālya-dāma-upaśobhite — adorned with garland strings."],["Rich in seven grains and gold, resembling the moon, jasmine, and moon; filled with aśvattha and aśoka leaves, and furnished with curd-rice;","sapta-dhānya-hiraṇya-āḍhye — rich in seven grains and gold; śaśi-kunda-indu-sannibhe — resembling the moon, jasmine, and moon; aśvattha-aśoka-patra-āḍhye — filled with aśvattha and aśoka leaves; dadhi-odana-samanvite — furnished with curd-rice."],["One should worship it for that purpose with devotion, with those things seen [in the dream], without doubt. Having seen a good dream, one should not sleep again.","tat-artham — for that purpose; pūjayet — one should worship; bhaktyā — with devotion; taiḥ taiḥ — with those respective [things]; dṛṣṭaiḥ — seen; na saṃśayaḥ — without doubt; dṛṣṭvā — having seen; tu — indeed; śobhanam svapnam — a good dream; na bhūyaḥ — not again; śayanam svapet — should sleep."],["In the morning one should tell the dream as seen, O lord of birds, to wise Bhojakas, Brāhmaṇas, and friends.","prātaḥ — in the morning; ca — and; kīrtayet — one should tell; svapne — the dream; yathā-dṛṣṭam — as seen; khaga-adhipa — O lord of birds; prājña-bhojaka-viprebhyaḥ — to wise Bhojakas and Brāhmaṇas; suhṛdbhyaḥ ca — and to friends."],["Then, at midday, bathed and with mind restrained,","tataḥ — then; madhyāhna-samaye — at midday; snātaḥ — bathed; prayata-mānasaḥ — with mind restrained."],["Having worshipped that same god, Divākara, according to rule,","tam ca eva devam — that same god; vidhi-vat — according to rule; pūjayitvā — having worshipped; divākaram — Divākara."],["Having properly completed japa, silent, with fire offered, a man, leaving the temple of the god, should present [it] to a Bhojaka.","samyak — properly; kṛta-japaḥ — having completed japa; maunī — silent; naraḥ — a man; huta-hutāśanaḥ — with fire offered; niṣkramya — leaving; deva-āyatanāt — the temple of the god; bhojakāya — to a Bhojaka; nivedayet — should present."],["If there is no availability of Bhojakas, Brāhmaṇas who know the Purāṇas should receive it. Firm in the mantras, the Veda, and its limbs, having worshipped the Lord, they would go to heaven.","bhavet — if there is; alābhaḥ — absence; yadi — if; bhojakānām — of Bhojakas; viprāḥ — Brāhmaṇas; tam — it; arhanti — should receive; purāṇa-vijñāḥ — knowers of the Purāṇas; ye — who; mantra-veda-avayaveṣu — in the mantras, Veda, and its limbs; niścitāḥ — firm; vibhum — the Lord; samabhyarcya — having worshipped; divam vrajeyuḥ — they would go to heaven."],["Having thus performed seven Saptamīs, a man endowed with devotion and faith in the Sun—how would he not obtain the fruit?","kṛtvā — having performed; evam — thus; saptamīḥ sapta — seven Saptamīs; naraḥ — a man; bhakti-samanvitaḥ — endowed with devotion; śraddadhānaḥ api — even having faith; sūryasya — in the Sun; saḥ — he; katham na āpnuyāt phalam — how would he not obtain the fruit?"],["What fruit there would be from ten performed Aśvamedhas, that fruit a man obtains by performing seven Saptamīs with devotion.","daśānām — of ten; aśva-medhānām — Aśvamedhas; kṛtānām — performed; yat phalam bhavet — whatever fruit there would be; tat phalam — that fruit; saptamīḥ sapta — seven Saptamīs; kṛtvā — having performed; bhaktyā — with devotion; labhet naraḥ — a man obtains."],["There is no sin, O hero, which is not burned in Saptamī; and there is no disease in this world which is not pacified by these.","duṣpāpam — difficult sin; na asti — there is not; tat — that; vīra — O hero; saptamyām — in Saptamī; yat na dahyate — which is not burned; na ca rogaḥ asti — and there is no disease; asau loke — in this world; yaḥ etābhiḥ na śāmyati — which is not pacified by these."],["All the terrible leprosies, hard to cut off by physicians, are led away, just as serpents [are led away] by Garuḍa.","kuṣṭhāni — leprosies; yāni — which; raudrāṇi — terrible; duśchedyāni — hard to cut off; bhiṣag-janaiḥ — by physicians; nīyante — are led away; tāni sarvāṇi — all those; garuḍena iva — just as by Garuḍa; pannagāḥ — serpents."],["Honored by all the gods, self-luminous among people, consecrated to giving desired fruits, he is to be worshipped well; endowed with sons, wealth, family, enjoyments, happiness, and merits, he goes to an eternal beautiful [abode] of the sharp-rayed [Sun].","sakala-vibudha-mānyam — honored by all the gods; sva-prakāśam — self-luminous; janānām — among people; abhīṣṭa-phala-dāne — in giving desired fruits; dīkṣitam — consecrated; tam — him; su-pūjyam — to be worshipped well; suta-dhana-kula-bhogaiḥ — with sons, wealth, family, and enjoyments; saukhya-puṇyaiḥ upetam — endowed with happiness and merits; vrajati — he goes; ca — and; su-tanum kām — a beautiful [abode]; śāśvatām — eternal; tigma-raśmeḥ — of the sharp-rayed [Sun]."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:195,verseCount:26,subtitle:"Chapter 195 — Dream Description in the Sun–Aruṇa Dialogue",colophon:""},T);</script></body>
