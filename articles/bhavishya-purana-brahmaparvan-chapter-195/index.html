<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 195 — Dream Description in the Sun–Aruṇa Dialogue."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 195 — Dream Description in the Sun–Aruṇa Dialogue — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-6" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 195 — Dream Description in the Sun–Aruṇa Dialogue</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-194/">← Chapter 194</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-196/">Chapter 196 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20261019-unified-theme-4"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-6"></script><script>const R=[["O Bhagavan, I wish to hear the supreme procedure of the Saptamīs, suitable for all. Tell it, O great sage.","bhagavan — O Bhagavan; śrotum icchāmi — I wish to hear; saptamīnām — of the Saptamīs; param vidhim — the supreme procedure; sarvāsām anurūpāṇām — fitting to all; kathayasva — tell; mahā-mune — O great sage.","भगवञ्छ्रोतुमिच्छामि सप्तमीनां परं विधिम् । सर्वासामनुरूपाणां कथयस्व महामुने ॥ १ ॥"],["Hear, O hero, best of birds, the supreme procedure of the Saptamīs. I shall tell you everything fully, as you ask.","śṛṇu — hear; vīra — O hero; khaga-śreṣṭha — O best of birds; saptamīnām param vidhim — the supreme procedure of the Saptamīs; kīrtayiṣyāmi — I shall tell; te sarvam — all to you; yathāvat — properly; paripṛcchate — as you ask.","शृणु वीर खगश्रेष्ठ सप्तमीनां परं विधिम् । कीर्तयिष्यामि ते सर्वं यथावत्परिपृच्छते ॥ २ ॥"],["Indeed, O best of birds, it is as declared by Vivasvat, when the bright fortnight, Sunday, and the northern course had begun.","tulyam — equal; kila — indeed; yathā-ākhyātam — as told; vivasvatā — by Vivasvat; śukla-pakṣe — in the bright fortnight; ravi-dine — on Sunday; pravṛtte — having begun; ca — and; uttara-ayaṇe — in the northern course.","तुल्यं किल खगश्रेष्ठ यथाख्यातं विवस्वता । शुक्लपक्षे रविदिने प्रवृत्ते चोत्तरायणे ॥ ३ ॥"],["For sons, wife, wealth, and land, one should undertake the Saptamī vow taught by sages, who are endowed with knowledge and grant all desired fruits.","putra-dāra-dhana-kṣetre — for son, wife, wealth, and field; gṛhṇīyāt — one should undertake; saptamī-vratam — the Saptamī vow; ṛṣibhiḥ — by sages; jñāna-sampannaiḥ — endowed with knowledge; sarva-kāma-phala-pradaiḥ — giving the fruits of all desires.","पुत्रदारधनक्षेत्रे गृह्णीयात्सप्तमीव्रतम् । ऋषिभिर्ज्ञानसंपन्नैः सर्वकामफलप्रदैः ॥ ४ ॥"],["Seven Saptamīs are declared. Hear their names from me. One is with arka leaves, the second likewise with peppers.","saptamyaḥ sapta — seven Saptamīs; ākhyātāḥ — are declared; tāsām — of them; nāmāni — names; me — from me; śṛṇu — hear; arka-sampuṭakaiḥ — with arka leaves; ekā — one; dvitīyā — the second; maricaiḥ tathā — likewise with peppers.","सप्तम्यः सप्त आख्यातास्तासां नामानि मे शृणु । अर्कसंपुटकैरेका द्वितीया मरिचैस्तथा ॥ ५ ॥"],["The third is with neem leaves, and the fourth is Phala Saptamī. The seventh is named Kāmikā. Learn their procedure from me.","tṛtīyā — the third; nimba-patraiḥ — with neem leaves; ca — and; caturthī — the fourth; phala-saptamī — Phala Saptamī; saptamī — the seventh; kāmikā nāmnā — by the name Kāmikā; vidhiṃ — procedure; āsām — of these; nibodha — learn; me — from me.","तृतीया निंबपत्रैश्च चतुर्थी फलसप्तमी । सप्तमी कामिका नाम्ना विधिमासां निबोध मे ॥ ६ ॥"],["On the fifth, one should take a single meal with a restrained mind. One should not take little food. One should abstain from sexual intercourse.","pañcamyām — on the fifth; eka-bhaktam — a single meal; tu — indeed; kuryāt — one should do; niyata-mānasaḥ — with mind restrained; alpa-āhāram — little food; na kurvīta — one should not make; maithunam — sexual intercourse; dūrataḥ — from afar; tyajet — one should abandon.","पंचम्यामेकभक्तं तु कुर्यान्नियतमानसः । अल्पाहारं न कुर्वीत मैथुनं दूरतस्त्यजेत् ॥ ७ ॥"],["One should avoid honey, meat, and excessively sour food, O lord of birds. On the morning of the sixth, in a single leaf cup.","varjayet — one should avoid; madhu — honey; māṃsam ca — and meat; ati-amlām — excessively sour food; khaga-adhipa — O lord of birds; prabhāte — in the morning; eva — indeed; ṣaṣṭhyām — on the sixth; tu — and; ekaika-parṇa-sampuṭe — in a single leaf-cup.","वर्जयेन्मधु मांसं च अत्यम्लं च खगाधिप । प्रभाते चैव षष्ठ्यां तु एकैकपर्णसंपुटे ॥ ८ ॥"],["Having prepared rice with ghee, one should eat according to rule. One should eat no other food, and the meal should be on the seventh.","ghṛta-śāli-odanam — ghee and rice; kṛtvā — having prepared; bhakṣayet — one should eat; tu — indeed; vidhānataḥ — according to rule; anya-annam — other food; abhuñjānaḥ — not eating; saptamyām — on the seventh; bhojanam bhavet — there should be a meal.","घृतशाल्योदनं कृत्वा भक्षयेत्तु विधानतः । अन्यदन्नमभुंजानः सप्तम्यां भोजनं भवेत् ॥ ९ ॥"],["Whoever undertakes them in increasing order, O lord of birds, should eat pepper separately, and thereafter neem leaves.","ekaika-vṛddha-abhiyuktaiḥ — with each one increased; yaḥ — whoever; vaset — lives; tu — indeed; khaga-īśvara — O lord of birds; anyatra — apart from these; maricam — pepper; bhakṣet — should eat; nimba-patrāṇi — neem leaves; ataḥ param — thereafter.","एकैकवृद्धाभियुक्तैर्यो वसेत्तु खगेश्वर । अन्यत्र मरिचं भक्षेन्निंबपत्राण्यतः परम् ॥ १० ॥"],["Thus the fruits are gained here in both fortnights. By careful abstention from cooked rice, one is known as Anodana.","evam — thus; labdha-phalāni — fruits obtained; iha — here; pakṣayoḥ ubhayoḥ api — in both fortnights; annādaiḥ rahitaḥ — free from food; yatnāt — carefully; an-odana — without cooked rice; iti — thus; smṛtaḥ — is remembered.","एवं लब्धफलानीह पक्षयोरुभयोरपि । अन्नादै रहितो यत्नादनोदन इति स्मृतः ॥ ११ ॥"],["One should observe it with devotion according to rule, having worshipped Vibhāvasu. Living on air for a day and night, one should perform Vijaya Saptamī.","ācaret — one should observe; vidhi-vat — according to rule; bhaktyā — with devotion; pūjayitvā — having worshipped; vibhāvasum — Vibhāvasu; aho-rātram — for a day and night; vāyu-bhakṣaḥ — living on air; kuryāt — one should perform; vijaya-saptamīm — Vijaya Saptamī.","आचरेद्विधिवद्भक्त्या पूजयित्वा विभावसुम् । अहोरात्रं वायुभक्षः कुर्याद्विजयसप्तमीम् ॥ १२ ॥"],["Each of the seven Saptamīs should be observed here according to rule. Having written their names separately on leaves.","eka-ekam — each one; sapta saptamīḥ — the seven Saptamīs; atra eva — right here; vidhi-vat — according to rule; caret — one should observe; prālekhya — having written; tāsām nāmāni — their names; patrakeṣu — on leaves; pṛthak-pṛthak — separately.","एकैकं सप्त सप्तमीरत्रैव विधिवच्चरेत् । प्रालेख्य तासां नामानि पत्रकेषु पृथक्पृथक् ॥ १३ ॥"],["Having written all those names, with a composed mind, on the body anointed with white sandal and adorned with garlands.","tāni sarvāṇi nāmāni — all those names; vilekhya — having written; su-samāhitaḥ — with a composed mind; śveta-candana-digdha-aṅge — on one whose body is anointed with white sandal; mālya-dāma-upaśobhite — adorned with garland strings.","तानि सर्वाणि नामानि विलेख्य सुसमाहितः । श्वेतचंदनदिग्धांगे माल्यदामोपशोभिते ॥ १४ ॥"],["Rich in seven grains and gold, resembling the moon, kunda jasmine, and the moon, adorned with aśvattha and aśoka leaves, and furnished with curd rice.","sapta-dhānya-hiraṇya-āḍhye — rich in seven grains and gold; śaśi-kunda-indu-sannibhe — resembling the moon, jasmine, and moon; aśvattha-aśoka-patra-āḍhye — filled with aśvattha and aśoka leaves; dadhi-odana-samanvite — furnished with curd-rice.","सप्तधान्यहिरण्याढ्ये शशिकुन्देन्दुसन्निभे ॥ १३ ॥ अश्वत्थाशोकपत्राढ्ये दध्योदनसमन्विते ॥ १५ ॥"],["One should worship it for that purpose with devotion, with those various things seen, without doubt. Having seen an auspicious dream, one should not sleep again.","tat-artham — for that purpose; pūjayet — one should worship; bhaktyā — with devotion; taiḥ taiḥ — with those respective things; dṛṣṭaiḥ — seen; na saṃśayaḥ — without doubt; dṛṣṭvā — having seen; tu — indeed; śobhanam svapnam — a good dream; na bhūyaḥ — not again; śayanam svapet — should sleep.","तदर्थं पूजयेद्भक्त्या तैस्तैर्दृष्टैर्न संशयः । दृष्ट्वा तु शोभनं स्वप्नं न भूयः शयनं स्वपेत् ॥ १६ ॥"],["In the morning, one should tell the dream as seen, O lord of birds, to wise Bhojakas, Brāhmaṇas, and friends.","prātaḥ — in the morning; ca — and; kīrtayet — one should tell; svapne — the dream; yathā-dṛṣṭam — as seen; khaga-adhipa — O lord of birds; prājña-bhojaka-viprebhyaḥ — to wise Bhojakas and Brāhmaṇas; suhṛdbhyaḥ ca — and to friends.","प्रातश्च कीर्तयेत्स्वप्ने यथादृष्टं खगाधिप । प्राज्ञभोजकविप्रेभ्यः सुहृद्भ्यश्च खगाधिप ॥ १७ ॥"],["Then at midday, having bathed and restrained the mind, one should worship that same god, Divākara, according to rule.","tataḥ — then; madhyāhna-samaye — at midday; snātaḥ — bathed; prayata-mānasaḥ — with mind restrained; tam ca eva devam — that same god; vidhi-vat — according to rule; pūjayitvā — having worshipped; divākaram — Divākara.","ततो मध्याह्नसमये स्नातः प्रयतमानसः । तं चैव देवं विधिवत्पूजयित्वा दिवाकरम् ॥ १८ ॥"],["Having properly completed japa, a silent man who has made an offering to the fire should leave the temple of the god and present it to a Bhojaka.","samyak — properly; kṛta-japaḥ — having completed japa; maunī — silent; naraḥ — a man; huta-hutāśanaḥ — with fire offered; niṣkramya — leaving; deva-āyatanāt — the temple of the god; bhojakāya — to a Bhojaka; nivedayet — should present.","सम्यक्कृतजपो मौनी नरो हुतहुताशनः । निष्क्रम्य देवायतनाद्भोजकाय निवेदयेत् ॥ १९ ॥"],["If Bhojakas are unavailable, Brāhmaṇas versed in the Purāṇas may receive it. Those firm in the mantras, the Veda, and its limbs, having worshipped the Lord, may go to heaven.","bhavet — if there is; alābhaḥ — absence; yadi — if; bhojakānām — of Bhojakas; viprāḥ — Brāhmaṇas; tam — it; arhanti — should receive; purāṇa-vijñāḥ — knowers of the Purāṇas; ye — who; mantra-veda-avayaveṣu — in the mantras, Veda, and its limbs; niścitāḥ — firm; vibhum — the Lord; samabhyarcya — having worshipped; divam vrajeyuḥ — they would go to heaven.","भवेदलाभो यदि भोजकानां विप्रास्तमर्हंति पुराणविज्ञाः । ये मंत्रवेदावयवेषु निश्चिता विभुं समभ्यर्च्य दिवं व्रजेयुः ॥ २० ॥"],["How could a man endowed with devotion and faith in the Sun fail to obtain the fruit after performing seven Saptamīs.","kṛtvā — having performed; evam — thus; saptamīḥ sapta — seven Saptamīs; naraḥ — a man; bhakti-samanvitaḥ — endowed with devotion; śraddadhānaḥ api — even having faith; sūryasya — in the Sun; saḥ — he; katham na āpnuyāt phalam — how would he not obtain the fruit?","कृत्वैवं सप्तमी सप्त नरो भक्ति समन्वितः । श्रद्दधानोपि सूर्यस्य स कथं नाप्नुयात्फलम् ॥ २१ ॥"],["Whatever fruit comes from ten performed Aśvamedhas, a man obtains that fruit by performing seven Saptamīs with devotion.","daśānām — of ten; aśva-medhānām — Aśvamedhas; kṛtānām — performed; yat phalam bhavet — whatever fruit there would be; tat phalam — that fruit; saptamīḥ sapta — seven Saptamīs; kṛtvā — having performed; bhaktyā — with devotion; labhet naraḥ — a man obtains.","दशानामश्वमेधानां कृतानां यत्फलं भवेत् । तत्फलं सप्तमी सप्त कृत्वा भक्त्या लभेत ना ॥ २२ ॥"],["No sin, O hero, remains unburned in Saptamī, and no disease in this world remains unpacified by these.","duṣpāpam — difficult sin; na asti — there is not; tat — that; vīra — O hero; saptamyām — in Saptamī; yat na dahyate — which is not burned; na ca rogaḥ asti — and there is no disease; asau loke — in this world; yaḥ etābhiḥ na śāmyati — which is not pacified by these.","दुष्पापं नास्ति तद्वीर सप्तम्यां यन्न दह्यते । न च रोगोऽस्त्यसौ लोके य एताभिर्न शाम्यति ॥ २३ ॥"],["All terrible kuṣṭhas, hard for physicians to eradicate, are carried away, just as serpents are carried away by Garuḍa.","kuṣṭhāni — leprosies; yāni — which; raudrāṇi — terrible; duśchedyāni — hard to cut off; bhiṣag-janaiḥ — by physicians; nīyante — are led away; tāni sarvāṇi — all those; garuḍena iva — just as by Garuḍa; pannagāḥ — serpents.","कुष्ठानि यानि रौद्राणि दुश्छेद्यानि भिषग्जनैः । नीयन्ते तानि सर्वाणि गरुडेनेव पन्नगाः ॥ २४ ॥"],["That Sun, honored by all the gods, self luminous among people, consecrated to granting desired fruits, is worthy of worship. Endowed with sons, wealth, family, enjoyments, happiness, and merit, one goes to the beautiful eternal abode of the sharp rayed Sun.","sakala-vibudha-mānyam — honored by all the gods; sva-prakāśam — self-luminous; janānām — among people; abhīṣṭa-phala-dāne — in giving desired fruits; dīkṣitam — consecrated; tam — him; su-pūjyam — to be worshipped well; suta-dhana-kula-bhogaiḥ — with sons, wealth, family, and enjoyments; saukhya-puṇyaiḥ upetam — endowed with happiness and merits; vrajati — he goes; ca — and; su-tanum kām — a beautiful abode; śāśvatām — eternal; tigma-raśmeḥ — of the sharp-rayed Sun.","सकलविबुधमान्यं स्वप्रकाशं जनानामभिमतफलदाने दीक्षितं तं सुपूज्यम् । सुतधनकुलभोगैः सौख्यपुण्यैरुपेतो व्रजति च सुतनुं कां शाश्वता तिग्मरश्मेः ॥ २५ ॥"]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1],sa:r[2]}]));renderBhavishyaLiveChapter({chapter:195,verseCount:25,subtitle:"Chapter 195 — Dream Description in the Sun–Aruṇa Dialogue",colophon:"",preferEmbeddedSanskrit:true},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body>
