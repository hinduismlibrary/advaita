<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 211 — The Calotropis-Leaf Packet Vow for the Seventh Lunar Day."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 211 — The Calotropis-Leaf Packet Vow for the Seventh Lunar Day — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-2" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 211 — The Calotropis-Leaf Packet Vow for the Seventh Lunar Day</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-210/">← Chapter 210</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-212/">Chapter 212 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-2"></script><script>const R=[["Sumantu said. I have been well asked, O king. Hear me speaking. Formerly there was a very learned Brāhmaṇa, Sthānagottama.","sādhu—well; pṛṣṭaḥ asmi—I have been asked; rājendra—O king; śṛṇu—hear; āsīt—there was; purā—formerly; mahā-vidvān—very learned; brāhmaṇaḥ—Brāhmaṇa."],["That twice born went with his son to the hermitage of Janaka. There a dispute arose between them and other Brāhmaṇas, O best of kings.","saḥ—he; gataḥ—went; putra-sahitaḥ—with his son; janakasya āśramam—to Janaka’s hermitage; tatra—there; vādaḥ—dispute; abhavat—arose; vipraiḥ—with Brāhmaṇas."],["There the twice born was killed by Kauthumi, overcome by anger. Seeing the Brāhmaṇa killed, Kauthumi was abandoned by his father.","krodha-āviṣṭena—overcome by anger; hataḥ—killed; kauthuminā—by Kauthumi; dṛṣṭvā—having seen; hatam—killed; vipram—Brāhmaṇa; tyaktaḥ—abandoned; pitrā—by his father."],["By his brothers, O mighty armed one, and likewise by all the elders, he was rejected by everyone, filled with grief and sorrow.","bhrātṛbhiḥ—by brothers; śiṣṭaiḥ—by elders; kṛtsnaśaḥ—altogether; pratyuktaḥ—rejected; śoka-duḥkha-samanvitaḥ—joined with grief and sorrow."],["Then he went to tīrthas and divine shrines. That Brāhmaṇa was not at once freed from Brahmahatyā.","tīrthāni—tīrthas; divyāni āyatanāni—divine shrines; jagāma—went; na muktaḥ—not freed; sahasā—quickly; brahma-hatyayā—from brahmin-slaying."],["When he was not freed from it, a severe disease arose. He was without ears and nose, with pus and blood flowing.","amukte—when not freed; vipre—in the Brāhmaṇa; tayā—by it; paraḥ vyādhiḥ—a severe disease; ajāyata—arose; karṇa-nāsā-vihīnaḥ—without ears and nose; pūya-śoṇita-visravaḥ—with pus and blood flowing."],["Wandering over all the earth, he came again to his father house. His mind stricken with grief, he spoke these words to his father.","pṛthivīm—earth; paryaṭan—roaming; sarvām—whole; punaḥ—again; āgāt—came; pituḥ gṛham—to his father’s house; duḥkha-upahata-cittaḥ—mind stricken by grief; vākyam—words; abravīt—spoke."],["Father, I went to sacred tīrthas and shrines. I am not freed from this cruel Brahmahatyā, father.","pitṛ—father; gataḥ—went; tīrthāni—tīrthas; puṇyāni—sacred; āyatanāni—shrines; muktaḥ asmi—I am freed; na—not; krūrayā—cruel; brahma-hatyayā—from brahmin-slaying."],["Even though an excellent expiation was performed for me, O sinless one, what shall I do. Where shall I go, father. My pains are very severe.","kṛte—having been done; pare prāyaścitte—in an excellent expiation; anagha—O sinless one; kim karomi—what shall I do; kva gacchāmi—where shall I go; ati—very; rujāḥ—pains; mama—my."],["By what act, O lord, with little effort from me, would this Brahmahatyā and this disease perish, O scorcher of foes.","kṛtena karmaṇā—by a deed; yena—by which; alpa-āyāsena—with little effort; me—of mine; naśyet—would perish; brahma-hatyā—brahmin-slaying; vyādhiḥ—disease."],["Tell me without delay, father, make my highest good. The Brāhmaṇa Hiraṇyanābha, having heard his son words, overcome with grief and sorrow, spoke to his son.","kathyatām—let it be told; mā ciram—without delay; tāta—father; kuru—make; niḥśreyasam—highest welfare; śrutvā—having heard; vāk yam—words; śoka-duḥkha-abhibhūtaḥ—overcome by grief and sorrow; putram uvāca—spoke to his son."],["Hiraṇyanābha said. Your distress, son, which came to you as you roamed the earth, is known.","hiraṇya-nābhaḥ uvāca—Hiranyanābha said; jñātaḥ—known; putra—son; tava—your; kleśaḥ—distress; yaḥ—who/which; prāptaḥ—came; tvayā aṭatā—while you roamed; mahīm—the earth."],["You went to tīrthas, child, performing expiations, yet Brahmahatyā does not release you, O bearer of my lineage.","tīrthāni—tīrthas; tvayā—by you; vatsa—child; prāyaścittāni—expiations; kurvatā—performing; na muñcate—does not release; brahma-hatyā—brahmin-slaying; kula-udvaha—O bearer of the family."],["I shall tell one means by which you will attain release, my son, with little effort. Hear me as I speak.","upāyam—means; ekam—one; vakṣyāmi—I shall tell; yena—by which; mokṣam āpsyasi—you will obtain release; alpa-āyāsena—with little effort; śṛṇu—hear."],["Kauthumi said. Which god among Brahmā and the others should I worship, and how, O lord. I am without the body, the instrument for all actions.","kauthumiḥ uvāca—Kauthumi said; ārādhayāmi—I should worship; kam—which; devam—god; brahma-ādīnām—of Brahmā and the others; śarīreṇa—with the body; vihīnaḥ—bereft; sarva-karm aṇām—of all actions; hetunā—by cause."],["Hiraṇyanābha said. They attain satisfaction through an act joined with a succession of accomplishments. He is well worshipped even by the gods with anointing and sweeping.","siddhi-santati-yuktena—joined with a succession of accomplishments; karmaṇā—by an act; tuṣṭim—satisfaction; āpnuyuḥ—they attain; devaiḥ api—even by gods; upalepana-mārjanaiḥ—with anointing and sweeping."],["The wise have said that Bhānu is one, O best of the twice born. Brahmā, Viṣṇu, Mahādeva, the lord of waters, and Dhanada likewise.","bhānuḥ—Bhānu; ekaḥ—one; dvija-śreṣṭha—O best of the twice-born; ūcuḥ—said; manīṣiṇaḥ—the wise; brahmā—Brahmā; viṣṇuḥ—Viṣṇu; mahādevaḥ—Mahādeva; jaleśaḥ—lord of waters; dhanadaḥ—giver of wealth."],["All these, taking refuge in Bhānu, rejoice in heaven, my son. Therefore I see no god equal to Bhānu.","bhānum—Bhānu; āśritya—taking refuge; sarve—all; te—they; modante—rejoice; divi—in heaven; putraka—my son; bhānoḥ samam—equal to Bhānu; devam—god; na paśyāmi—I do not see; kañcana—any."],["Thus Bhānu is honoured by all and now grants every desire. He is the father and mother of people, dear one, without doubt.","evam—thus; bhānum—Bhānu; sarva-mānyam—honored by all; akhila-kāma-dam—giver of every desire; pitaraṃ mātaram—father and mother; narāṇām—of humans; na saṃśayaḥ—no doubt."],["Worship him with devotion, reciting the supreme mantra. Hear the Itihāsas and Purāṇas, endowed with faith.","tam—him; ārādhaya—worship; bhaktyā—with devotion; japan—reciting; mantram—mantra; anuttamam—excellent; itihāsa-purāṇāni—Itihāsas and Purāṇas; śṛṇu—hear; śraddhā-samanvitaḥ—endowed with faith."],["Worshipping Ravi with devotion and reciting the Sāman, you will attain liberation in the world through the Purāṇas, my son.","ārādhayan—worshipping; ravim—Ravi; bhaktyā—with devotion; japan—reciting; sāmān—the Sāman; purāṇāni—Purāṇas; tataḥ—then; mokṣam—liberation; prāpsyasi—you will attain; putraka—my son."],["Kauthumi said. Tell me the foremost Sāmans, father, O great minded one. Oṃkāra is foremost, Udgītha, and Prastāva, the fourfold.","diśa—direct; sāmāni—Sāmans; pravarāṇi—foremost; tāta—father; mahā-mate—O great-minded one; oṃkāra—Oṃkāra; pravara—foremost; udgītham—Udgītha; prastānam—Prastāva; catuṣṭayam—fourfold."],["The fifth is Parihāra, and the sixth they call Adbhuta. Nidhana is the seventh among the Sāmans. The sevenfold arrangement is remembered.","pañcamaḥ—the fifth; parihāraḥ—Parihāra; ṣaṣṭham—the sixth; āhuḥ—they call; adbhutam—Adbhuta; nidhanam—Nidhana; saptamam—the seventh; sāmnām—among Sāmans; saptavidhyam—sevenfold; smṛtam—remembered."],["The sevenfold arrangement is also declared among Hiṅkāra and Praṇava. Śāṭhya is the eighth for you, and Vāmadeva is the ninth.","saptavidhyam—sevenfold; proktam—declared; hiṅkāra-praṇaveṣu—in Hiṅkāra and Praṇava; aṣṭamam—the eighth; śāṭhyam—Śāṭhya; navamam—the ninth; vāmadevikam—Vāmadeva."],["Jyeṣṭha is the tenth Sāman, excellent and dear to the Creator. Which of these Sāmans is held the supreme japa in the throat, dear one. Having recited it with my power, I shall go to the highest state.","jyeṣṭham—Jyeṣṭha; daśamam—the tenth; sām a—the Sāman; vedhase—to the Creator; priyam—dear; e teṣām—of these; kaṇṭhe—in the throat; jāpyam—recitation; param—supreme; japtvā—having recited; paramam padam—the highest state."],["Hiraṇyanābha said. Well, son. The family is purified by a son like you. Though you have gone, the remembrance of the rite has arisen in you, son.","sādhu—well; putra—son; kulam—family; pūtam—purified; tvat-putreṇa—by your son; samena—with one equal; vidh eḥ—of the rite; smṛtiḥ—recollection; jātā—arisen."],["Indeed, father, there is no doubt. These are the common Sāmans, my son. The foremost Sāmans were declared by Brahmā.","evam—thus; tāta—father; na saṃdehaḥ—no doubt; sāmāny etāni—these are common; putraka—my son; pravarāṇi—foremost; sāmnām—of Sāmans; brahmaṇā—by Brahmā; kathitāni—declared."],["Among these too, two excellent Sāmans are declared supreme and unsurpassed. Therefore one supreme japa removes the fear of all sins.","eteṣām—of these; param—supreme; proktam—declared; sāma-dvayam—two Sāmans; anuttamam—excellent; tasmāt—therefore; ekam—one; jāp yam—recitation; sarva-pāpa-bhaya-apaham—removing fear of all sins."],["Kauthumi said. Tell me quickly, father, those two supreme Sāmans. Is there any other japa among these Sāmans.","kathyatām—let it be told; tāta—father; śīghram—quickly; sāma-dvayam—two Sāmans; param—supreme; eteṣām—of these; anyat—another; jāpyam—recitation; bhavet—there may be."],["Hiraṇyanābha said. Hear first the supreme Jyeṣṭha Sāman. Hear the second as I speak.","jyeṣṭha-sāma—Jyeṣṭha Sāman; param—supreme; pūrvam—first; dvitīyam—the second; gadataḥ—speaking; śṛṇu—hear."],["Then the third is to be heard, to be recited by one desiring liberation. After that, the supreme one was spoken by Bhānu himself.","tataḥ—then; śrāvyam—to be heard; tṛtīyam—the third; japtavyam—to be recited; mukti-icchatā—by one desiring liberation; paramam—supreme; proktam—declared; bhānunā svayam—by Bhānu himself."],["The deity itself was prescribed, the excellent vow among metres, always dear to Hiraṇyagarbha and dear to the Sun.","svayam—self; daivatam—deity; ādiṣṭam—prescribed; chandasām—among metres; uttamam—excellent; vratam—vow; priyam—dear; hiraṇya-garbhasya— to Hiraṇyagarbha; sūryasya—of the Sun."],["Hear from me the japa, its application, and its mark. The wise remember the Śūkara and the rest, joined with truth and tone.","japaḥ—japa; viniyogaḥ—application; lakṣaṇam—mark; nibodha—hear; satyena—with truth; svara-līnaḥ—joined with sound; śūkara-ādi—the Śūkara and the rest; smṛtam—remembered; budhaiḥ—by the wise."],["Ṛtu, bhāva, dharma, vidharma, truth making, likewise dharma and adharma are to be done, and the knowing of dharma.","ṛtuḥ—season; bhāvaḥ—state; dharmaḥ—dharma; vidh armaḥ—contrary dharma; satya-kṛt—truth-making; dharma-adharmau—dharma and adharma; kāryau—to be done; dharma-vedanam—knowing dharma."],["Whatever is sung by these sounds, pleasingly, at the proper times, by Brāhmaṇas, is declared the supreme japa by Bhānu himself.","yad—whatever; ebhiḥ—with these; gīyate—is sung; śabde—in sound; samayaiḥ—with proper times; dvijaiḥ—by twice-born; jāp yam—recitation; paramam—supreme; proktam—declared; bhānunā svayam—by Bhānu himself."],["Whoever recites this does not return again. Freed from all diseases, he is released from Brahmahatyā.","etat—this; japa-mānaḥ—reciting; na āvartate—does not return; sarva-roga-vinirmuktaḥ—freed from all diseases; mucyate—is released; brahma-hatyayā—from brahmin-slaying."],["Having recited this japa, worship Divākara. Singing the Sāman I have told you, hear the Purāṇic teaching, son.","etat japyam—this recitation; saṃjapya—having recited; ārādhaya—worship; divākaram—Divākara; gāyan—singing; sām a—the Sāman; proktam—told; śṛṇu—hear."],["I shall tell you, son, the mark of Jyeṣṭha Sāman. Ādyāyād Ājyadoha is the mark of Jyeṣṭha Sāman.","jyeṣṭha-sāmnaḥ—of Jyeṣṭha Sāman; lakṣaṇam—mark; kathayāmi—I shall tell; ādya-āyād-ājya-doha—Ādyāyād Ājyadoha; lakṣaṇam—mark."],["Ravi is always the Jyeṣṭha singer of the japa to be heard by you, son. Worship him while listening, O son, as a son among sons. Worshipping the Lord of gods thus, you will cast off sorrow.","śrāvyam—to be heard; japam—japa; putra—son; jyeṣṭha-gāyai—for the Jyeṣṭha chant; raviḥ—Ravi; sam ārādhaya—worship; śṛṇvan—listening; duḥkham—sorrow; prahāsyasi—you will abandon."],["Sumantu said. Then Kauthumi, a Sāman singer, having heard the words of his father,","tataḥ—then; śrutvā—having heard; pituḥ vākyam—father’s words; sāma-gaḥ—Sāman-singer; kauthumiḥ—Kauthumi."],["Worshipped Ravi with devotion and faith. Then, reciting before Ravi at the three junctions, O king,","ārādhayām āsa—worshipped; ravim—Ravi; bhaktyā—with devotion; śraddhā-samanvitaḥ—endowed with faith; śrāvyam—to be heard; japan—reciting; tri-kāle—at the three times; raveḥ purataḥ—before Ravi."],["While he was hearing the Purāṇas, Brahmahatyā departed, and the disease too, O tiger among the Kurus. This indeed is the fruit of hearing.","śṛṇvataḥ—while hearing; purāṇāni—the Purāṇas; brahma-hatyā—brahmin-slaying; gatā—departed; vyādhiḥ—disease; phalam—fruit; śrutasya—of hearing."],["The fruit obtained by one who recites and worships the god, he too reached Ravi, O king. Hear with a one pointed mind, O king.","japatā—by reciting; yat phalam—the fruit which; tena—by that; devam—the god; pūjayatā—by worshipping; saḥ api—he too; prāptaḥ—obtained; ravim—Ravi; eka-manāḥ—with one-pointed mind."],["That embodied Brāhmaṇa went by the favor of Bhāskara, entering the orb of Bhānu, to the highest state, O lord.","saḥ gataḥ—he went; mūrtimān—embodied; vipraḥ—Brāhmaṇa; prasādāt—by favor; bhāskarasya—of Bhāskara; praviśya—entering; maṇḍalam—the orb; bhānoḥ—of Bhānu; paramam padam—the highest state."],["He does not return even now, he has gone to the highest state. Thus I have told you, O king, the great twice born attained success.","na āvartate—does not return; adya api—even now; gataḥ—gone; asau—he; paramam padam—to the highest state; siddhim—success; mahā-dvijaḥ—the great twice-born; gataḥ—attained."],["By fasting on this Saptamī, Kauthumi, O tiger among men, goes to Bhāskara by the favor of Bhāskara, O hero.","upoṣya—fasting; imām—this; saptamīm—Saptamī; yāti—goes; bhāskaram—to Bhāskara; kauthumiḥ—Kauthumi; nara-śārdūla—O tiger among men; prasādāt—by favor."],["He too recites and likewise hears the Purāṇa. Thus, O king, this first Saptamī has been told.","japamānaḥ—reciting; purāṇa-śravaṇaḥ—hearing the Purāṇa; tathā—likewise; eṣā—this; kathitā—told; prathamā—the first; saptamī—Saptamī."],["The holy Arka puṭikā, which gives wealth and is dear to Ravi.","arka-puṭikā—the Arka-cup; puṇyā—sacred; vittadā—giving wealth; yā—which; priyā—dear; raveḥ—to Ravi."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:211,verseCount:48,subtitle:"Chapter 211 — The Calotropis-Leaf Packet Vow for the Seventh Lunar Day",colophon:""},T);</script></body>
