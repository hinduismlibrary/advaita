<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 211 — The Arka-Cup Saptamī Vow."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 211 — The Arka-Cup Saptamī Vow — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 211 — The Arka-Cup Saptamī Vow</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-210/">← Chapter 210</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-212/">Chapter 212 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Sumantu said: Well have I been asked, O king; hear as I speak. Formerly there was a very learned Brāhmaṇa, Sthānagottama.","sādhu—well; pṛṣṭaḥ asmi—I have been asked; rājendra—O king; śṛṇu—hear; āsīt—there was; purā—formerly; mahā-vidvān—very learned; brāhmaṇaḥ—Brāhmaṇa."],["That twice-born man went with his son to Janaka’s hermitage. There a dispute arose between them and other Brāhmaṇas, O best of kings.","saḥ—he; gataḥ—went; putra-sahitaḥ—with his son; janakasya āśramam—to Janaka’s hermitage; tatra—there; vādaḥ—dispute; abhavat—arose; vipraiḥ—with Brāhmaṇas."],["There, overcome by anger, the Brāhmaṇa was killed by Kauthumi. Seeing the Brāhmaṇa killed, Kauthumi was abandoned by his father.","krodha-āviṣṭena—overcome by anger; hataḥ—killed; kauthuminā—by Kauthumi; dṛṣṭvā—having seen; hatam—killed; vipram—Brāhmaṇa; tyaktaḥ—abandoned; pitrā—by his father."],["By his brothers and likewise by all the elders, he was rejected; he was accompanied by grief and sorrow, O mighty-armed one.","bhrātṛbhiḥ—by brothers; śiṣṭaiḥ—by elders; kṛtsnaśaḥ—altogether; pratyuktaḥ—rejected; śoka-duḥkha-samanvitaḥ—joined with grief and sorrow."],["Then he went to tīrthas and divine shrines, but that Brāhmaṇa was not at once freed from the killing of a Brāhmaṇa.","tīrthāni—tīrthas; divyāni āyatanāni—divine shrines; jagāma—went; na muktaḥ—not freed; sahasā—quickly; brahma-hatyayā—from brahmin-slaying."],["When he was not freed by it, a severe disease arose; he was without ears and nose, with pus and blood flowing.","amukte—when not freed; vipre—in the Brāhmaṇa; tayā—by it; paraḥ vyādhiḥ—a severe disease; ajāyata—arose; karṇa-nāsā-vihīnaḥ—without ears and nose; pūya-śoṇita-visravaḥ—with pus and blood flowing."],["Roaming over the whole earth, he again came to his father’s house. His mind stricken by grief, he spoke these words to his father.","pṛthivīm—earth; paryaṭan—roaming; sarvām—whole; punaḥ—again; āgāt—came; pituḥ gṛham—to his father’s house; duḥkha-upahata-cittaḥ—mind stricken by grief; vākyam—words; abravīt—spoke."],["“Father, I went to sacred tīrthas and shrines; I am not freed by them, father, from this cruel killing of a Brāhmaṇa.”","pitṛ—father; gataḥ—went; tīrthāni—tīrthas; puṇyāni—sacred; āyatanāni—shrines; muktaḥ asmi—I am freed; na—not; krūrayā—cruel; brahma-hatyayā—from brahmin-slaying."],["“Even though an excellent expiation was performed for me, O sinless one, what shall I do? Where shall I go, father? My pains are very severe.”","kṛte—having been done; pare prāyaścitte—in an excellent expiation; anagha—O sinless one; kim karomi—what shall I do; kva gacchāmi—where shall I go; ati—very; rujāḥ—pains; mama—my."],["“By what deed, O lord, with little effort of mine, would this killing of a Brāhmaṇa and this disease perish?”","kṛtena karmaṇā—by a deed; yena—by which; alpa-āyāsena—with little effort; me—of mine; naśyet—would perish; brahma-hatyā—brahmin-slaying; vyādhiḥ—disease."],["“Tell me without delay, father; make my highest welfare.” Hearing his son’s words, Hiranyanābha, overcome with grief, spoke to his son.","kathyatām—let it be told; mā ciram—without delay; tāta—father; kuru—make; niḥśreyasam—highest welfare; śrutvā—having heard; vāk yam—words; śoka-duḥkha-abhibhūtaḥ—overcome by grief and sorrow; putram uvāca—spoke to his son."],["Hiranyanābha said: “Your distress, son, which came to you as you roamed the earth, is known to me.”","hiraṇya-nābhaḥ uvāca—Hiranyanābha said; jñātaḥ—known; putra—son; tava—your; kleśaḥ—distress; yaḥ—who/which; prāptaḥ—came; tvayā aṭatā—while you roamed; mahīm—the earth."],["“You went to tīrthas, child, performing expiations; yet the killing of a Brāhmaṇa does not release you, O bearer of my lineage.”","tīrthāni—tīrthas; tvayā—by you; vatsa—child; prāyaścittāni—expiations; kurvatā—performing; na muñcate—does not release; brahma-hatyā—brahmin-slaying; kula-udvaha—O bearer of the family."],["“I shall tell one means by which you will obtain release, my son, with little effort. Hear me as I speak.”","upāyam—means; ekam—one; vakṣyāmi—I shall tell; yena—by which; mokṣam āpsyasi—you will obtain release; alpa-āyāsena—with little effort; śṛṇu—hear."],["Kauthumi said: “Which god should I worship among Brahmā and the others, O lord? I am without a body, the instrument of all actions.”","kauthumiḥ uvāca—Kauthumi said; ārādhayāmi—I should worship; kam—which; devam—god; brahma-ādīnām—of Brahmā and the others; śarīreṇa—with the body; vihīnaḥ—bereft; sarva-karm aṇām—of all actions; hetunā—by cause."],["Hiranyanābha said: “They attain satisfaction by an act joined with a succession of accomplishments. He is well worshipped even by the gods with anointing and sweeping.”","siddhi-santati-yuktena—joined with a succession of accomplishments; karmaṇā—by an act; tuṣṭim—satisfaction; āpnuyuḥ—they attain; devaiḥ api—even by gods; upalepana-mārjanaiḥ—with anointing and sweeping."],["“Bhānu is one, O best of the twice-born, so the wise have said: Brahmā, Viṣṇu, Mahādeva, the lord of waters, and the giver of wealth,”","bhānuḥ—Bhānu; ekaḥ—one; dvija-śreṣṭha—O best of the twice-born; ūcuḥ—said; manīṣiṇaḥ—the wise; brahmā—Brahmā; viṣṇuḥ—Viṣṇu; mahādevaḥ—Mahādeva; jaleśaḥ—lord of waters; dhanadaḥ—giver of wealth."],["“all of them, taking refuge in Bhānu, rejoice in heaven, my son. Therefore I see no god whatever equal to Bhānu.”","bhānum—Bhānu; āśritya—taking refuge; sarve—all; te—they; modante—rejoice; divi—in heaven; putraka—my son; bhānoḥ samam—equal to Bhānu; devam—god; na paśyāmi—I do not see; kañcana—any."],["“Thus Bhānu is honored by all, now the bestower of every desire, the father and mother of human beings, father; there is no doubt.”","evam—thus; bhānum—Bhānu; sarva-mānyam—honored by all; akhila-kāma-dam—giver of every desire; pitaraṃ mātaram—father and mother; narāṇām—of humans; na saṃśayaḥ—no doubt."],["“Worship him with devotion, reciting the excellent mantra; hear the Itihāsas and Purāṇas, endowed with faith.”","tam—him; ārādhaya—worship; bhaktyā—with devotion; japan—reciting; mantram—mantra; anuttamam—excellent; itihāsa-purāṇāni—Itihāsas and Purāṇas; śṛṇu—hear; śraddhā-samanvitaḥ—endowed with faith."],["“Worshipping Ravi with devotion and reciting the Sāman, you will then attain liberation in the world through the Purāṇas, my son.”","ārādhayan—worshipping; ravim—Ravi; bhaktyā—with devotion; japan—reciting; sāmān—the Sāman; purāṇāni—Purāṇas; tataḥ—then; mokṣam—liberation; prāpsyasi—you will attain; putraka—my son."],["Kauthumi said: “Tell me the foremost Sāmans, father, O great-minded one: Oṃkāra, the foremost, Udgītha, and Prastāva, the fourfold,”","diśa—direct; sāmāni—Sāmans; pravarāṇi—foremost; tāta—father; mahā-mate—O great-minded one; oṃkāra—Oṃkāra; pravara—foremost; udgītham—Udgītha; prastānam—Prastāva; catuṣṭayam—fourfold."],["“the fifth is Parihāra; the sixth they call Adbhuta; Nidhana is the seventh among the Sāmans; this sevenfold arrangement is remembered.”","pañcamaḥ—the fifth; parihāraḥ—Parihāra; ṣaṣṭham—the sixth; āhuḥ—they call; adbhutam—Adbhuta; nidhanam—Nidhana; saptamam—the seventh; sāmnām—among Sāmans; saptavidhyam—sevenfold; smṛtam—remembered."],["“The sevenfold arrangement is also declared in Hiṅkāra and Praṇava; the eighth is Śāṭhya for you, and the ninth is Vāmadeva.”","saptavidhyam—sevenfold; proktam—declared; hiṅkāra-praṇaveṣu—in Hiṅkāra and Praṇava; aṣṭamam—the eighth; śāṭhyam—Śāṭhya; navamam—the ninth; vāmadevikam—Vāmadeva."],["“The Jyeṣṭha Sāman is the tenth, dear to the Creator. Of these Sāmans, which japa is held supreme in the throat? Having recited it with my power, I shall go to the highest state.”","jyeṣṭham—Jyeṣṭha; daśamam—the tenth; sām a—the Sāman; vedhase—to the Creator; priyam—dear; e teṣām—of these; kaṇṭhe—in the throat; jāpyam—recitation; param—supreme; japtvā—having recited; paramam padam—the highest state."],["Hiranyanābha said: “Well, son; the family is purified by one such as your son. Even though you have gone, the recollection of the rite has arisen in you, son.”","sādhu—well; putra—son; kulam—family; pūtam—purified; tvat-putreṇa—by your son; samena—with one equal; vidh eḥ—of the rite; smṛtiḥ—recollection; jātā—arisen."],["“Thus, father, there is no doubt; these are the common [Sāmans], my son. They were declared as foremost Sāmans by Brahmā.”","evam—thus; tāta—father; na saṃdehaḥ—no doubt; sāmāny etāni—these are common; putraka—my son; pravarāṇi—foremost; sāmnām—of Sāmans; brahmaṇā—by Brahmā; kathitāni—declared."],["“Among these also, two excellent Sāmans are declared supreme; therefore one supreme recitation removes the fear of all sins.”","eteṣām—of these; param—supreme; proktam—declared; sāma-dvayam—two Sāmans; anuttamam—excellent; tasmāt—therefore; ekam—one; jāp yam—recitation; sarva-pāpa-bhaya-apaham—removing fear of all sins."],["Kauthumi said: “Tell me quickly, father, those two supreme Sāmans; is there any other recitation among these Sāmans?”","kathyatām—let it be told; tāta—father; śīghram—quickly; sāma-dvayam—two Sāmans; param—supreme; eteṣām—of these; anyat—another; jāpyam—recitation; bhavet—there may be."],["Hiranyanābha said: “Hear first the supreme Jyeṣṭha Sāman; hear the second as I speak.”","jyeṣṭha-sāma—Jyeṣṭha Sāman; param—supreme; pūrvam—first; dvitīyam—the second; gadataḥ—speaking; śṛṇu—hear."],["“Then the third is to be heard by one desiring liberation; after that, the supreme one was declared by Bhānu himself,”","tataḥ—then; śrāvyam—to be heard; tṛtīyam—the third; japtavyam—to be recited; mukti-icchatā—by one desiring liberation; paramam—supreme; proktam—declared; bhānunā svayam—by Bhānu himself."],["“the deity itself was prescribed, the excellent vow among metres, always dear to Hiraṇyagarbha and dear to the Sun.”","svayam—self; daivatam—deity; ādiṣṭam—prescribed; chandasām—among metres; uttamam—excellent; vratam—vow; priyam—dear; hiraṇya-garbhasya— to Hiraṇyagarbha; sūryasya—of the Sun."],["“Hear from me the japa, its application, and its mark: the wise remember the Śūkara and the rest, joined with truth and sound.”","japaḥ—japa; viniyogaḥ—application; lakṣaṇam—mark; nibodha—hear; satyena—with truth; svara-līnaḥ—joined with sound; śūkara-ādi—the Śūkara and the rest; smṛtam—remembered; budhaiḥ—by the wise."],["“Ṛtu, bhāva, dharma, adharma, truth-making, and likewise dharma and adharma are to be done, and the knowing of dharma.”","ṛtuḥ—season; bhāvaḥ—state; dharmaḥ—dharma; vidh armaḥ—contrary dharma; satya-kṛt—truth-making; dharma-adharmau—dharma and adharma; kāryau—to be done; dharma-vedanam—knowing dharma."],["“Whatever is sung by these sounds, with the proper times, by Brāhmaṇas, is declared the supreme japa by Bhānu himself.”","yad—whatever; ebhiḥ—with these; gīyate—is sung; śabde—in sound; samayaiḥ—with proper times; dvijaiḥ—by twice-born; jāp yam—recitation; paramam—supreme; proktam—declared; bhānunā svayam—by Bhānu himself."],["“Whoever recites this does not return again; freed from all diseases, he is released from the killing of a Brāhmaṇa.”","etat—this; japa-mānaḥ—reciting; na āvartate—does not return; sarva-roga-vinirmuktaḥ—freed from all diseases; mucyate—is released; brahma-hatyayā—from brahmin-slaying."],["“Having recited this japa, worship Divākara. Singing the Sāman I have told you, hear the Purāṇic [teaching], son.”","etat japyam—this recitation; saṃjapya—having recited; ārādhaya—worship; divākaram—Divākara; gāyan—singing; sām a—the Sāman; proktam—told; śṛṇu—hear."],["“I shall tell you, son, the mark of Jyeṣṭha Sāman: ‘Ādyāyād Ājyadoha’ is the mark of Jyeṣṭha Sāman.”","jyeṣṭha-sāmnaḥ—of Jyeṣṭha Sāman; lakṣaṇam—mark; kathayāmi—I shall tell; ādya-āyād-ājya-doha—Ādyāyād Ājyadoha; lakṣaṇam—mark."],["“Ravi is always the Jyeṣṭha singer for the japa to be heard by you, son. Worship the Lord of gods while listening, as a son among sons; thus worshipping, you will cast off sorrow.”","śrāvyam—to be heard; japam—japa; putra—son; jyeṣṭha-gāyai—for the Jyeṣṭha chant; raviḥ—Ravi; sam ārādhaya—worship; śṛṇvan—listening; duḥkham—sorrow; prahāsyasi—you will abandon."],["Sumantu said: Then Kauthumi, a Sāman-singer, having heard his father’s words,","tataḥ—then; śrutvā—having heard; pituḥ vākyam—father’s words; sāma-gaḥ—Sāman-singer; kauthumiḥ—Kauthumi."],["worshipped Ravi with devotion and endowed with faith; then, reciting the Sāman to be heard three times before Ravi, O king,","ārādhayām āsa—worshipped; ravim—Ravi; bhaktyā—with devotion; śraddhā-samanvitaḥ—endowed with faith; śrāvyam—to be heard; japan—reciting; tri-kāle—at the three times; raveḥ purataḥ—before Ravi."],["while he was hearing the Purāṇas, the killing of a Brāhmaṇa departed, and the disease too, O tiger among the Kurus—the fruit of hearing this.","śṛṇvataḥ—while hearing; purāṇāni—the Purāṇas; brahma-hatyā—brahmin-slaying; gatā—departed; vyādhiḥ—disease; phalam—fruit; śrutasya—of hearing."],["The fruit that comes through reciting it and worshipping the god, he too obtained Ravi, O king; hear with a one-pointed mind.","japatā—by reciting; yat phalam—the fruit which; tena—by that; devam—the god; pūjayatā—by worshipping; saḥ api—he too; prāptaḥ—obtained; ravim—Ravi; eka-manāḥ—with one-pointed mind."],["That embodied Brāhmaṇa went, by Bhāskara’s favor, entering Bhānu’s orb, to the highest state, O lord.","saḥ gataḥ—he went; mūrtimān—embodied; vipraḥ—Brāhmaṇa; prasādāt—by favor; bhāskarasya—of Bhāskara; praviśya—entering; maṇḍalam—the orb; bhānoḥ—of Bhānu; paramam padam—the highest state."],["He does not return even now; he has gone to the highest state. Thus the great Brāhmaṇa attained success, O king.","na āvartate—does not return; adya api—even now; gataḥ—gone; asau—he; paramam padam—to the highest state; siddhim—success; mahā-dvijaḥ—the great twice-born; gataḥ—attained."],["By fasting and performing this Saptamī, Kauthumi, O tiger among men, goes to Bhāskara by Bhāskara’s favor.","upoṣya—fasting; imām—this; saptamīm—Saptamī; yāti—goes; bhāskaram—to Bhāskara; kauthumiḥ—Kauthumi; nara-śārdūla—O tiger among men; prasādāt—by favor."],["That one too, reciting and hearing the Purāṇa—thus this first Saptamī has been told, O king,","japamānaḥ—reciting; purāṇa-śravaṇaḥ—hearing the Purāṇa; tathā—likewise; eṣā—this; kathitā—told; prathamā—the first; saptamī—Saptamī."],["the sacred Arka-cup, which gives wealth and is dear to Ravi.","arka-puṭikā—the Arka-cup; puṇyā—sacred; vittadā—giving wealth; yā—which; priyā—dear; raveḥ—to Ravi."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:211,verseCount:48,subtitle:"Chapter 211 — The Arka-Cup Saptamī Vow",colophon:""},T);</script></body>
