<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 212 — Solar Worship Procedure."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 212 — Solar Worship Procedure — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-6" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 212 — Solar Worship Procedure</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-211/">← Chapter 211</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-213/">Chapter 213 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20261019-unified-theme-4"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-6"></script><script>const R=[["Thus this Arka-saṃpuṭikā has been told to you, O hero. Hear from me as I speak of the second, which is with marīca.","iti—thus; eṣā—this; kathitā—has been told; vīra—O hero; arka-saṃpuṭikā—Arka-saṃpuṭikā; tava—to you; dvitīyā—the second; maricaiḥ—with marīca; yā—which; tu—indeed; śṛṇuṣva—hear; gadataḥ—from me speaking; mama—my."],["In the bright fortnight of Caitra, having properly fasted on the sixth day, one should worship Bhāskara with devotion, according to the rule of Sauradharma.","śukla-pakṣe—in the bright fortnight; tu—indeed; caitrasya—of Caitra; ṣaṣṭhyām—on the sixth day; samyak—properly; upoṣitaḥ—having fasted; pūjayet—one should worship; bhāskaram—Bhāskara; bhaktyā—with devotion; saura-dharma-vidhānataḥ—according to the rule of Sauradharma."],["Śatānīka said: Tell me all the mantras, O Brāhmaṇa, the sacred ones especially, and also the Sūrya-hṛdaya, likewise those joined with śiro-nyāsa.","śatānīkaḥ uvāca—Śatānīka said; brūhi—tell; sarvān—all; mama—to me; brahman—O Brāhmaṇa; mantrān—mantras; puṇyān—sacred; viśeṣataḥ—especially; sūrya-ādi-hṛdayam—the Sūrya-hṛdaya and the rest; ca—and; api—also; śiro-nyāsa-yutān—joined with śiro-nyāsa; tathā—likewise."],["Sumantu said: I shall tell you the supreme secret, O lord, which was formerly spoken by Brahmā, with devotion to the great Bhānu.","sumantuḥ uvāca—Sumantu said; aham—I; te—to you; kathayiṣyāmi—I shall tell; rahasyam—secret; paramam—supreme; vibho—O lord; yat—which; uktam—spoken; brahmaṇā—by Brahmā; pūrvam—formerly; bhaktyā—with devotion; bhānoḥ—of Bhānu; mahātmanaḥ—the great-souled."],["Hear that, O great-minded one, for the destruction of all sins: the sacred Āditya, remover of all sins, worshipped by the worlds.","sarva-pāpa-kṣaya-arthāya—for the destruction of all sins; tat—that; śṛṇu—hear; mahā-mate—O great-minded one; sarva-pāpa-haram—removing all sins; puṇyam—sacred; ādityam—Āditya; loka-pūjitam—worshipped by the worlds."],["Joined with a crest-garland, the excellent immortal syllable Va. Oṃ vaṃ phaṭ. Oṃ, this Sun himself, dear one, is mantra-bodied and greatly powerful.","śikhā-dāma-samāyuktam—joined with a crest-garland; vakāra—the syllable Va; amṛtam—immortal; uttamam—excellent; oṃ—Oṃ; vaṃ—vaṃ; phaṭ—phaṭ; oṃ—Oṃ; eṣaḥ—this; sūryaḥ—the Sun; svayam—himself; tāta—dear one; mantra-mūrtiḥ—mantra-bodied; mahā-balaḥ—greatly powerful."],["By remembering this, the mantra-knower, always eating sweet food, sees the Lord of gods, Bhānu himself, directly within a year.","asya—of this; anusmaraṇāt—from remembering; mantrī—the mantra-knower; nityam—always; madhura-bhojanaḥ—eating sweet food; saṃvatsareṇa—within a year; deva-īśam—the Lord of gods; sākṣāt—directly; bhānum—Bhānu; prapaśyati—sees."],["Freed from disease and death, he goes to the world of the Sun, always reciting, O king, foremost among mantra-knowers.","vyādhi-mṛtyoḥ—from disease and death; ca—and; nirmuktaḥ—freed; sūrya-lokam—to the world of the Sun; saḥ—he; gacchati—goes; satatam—always; japamānaḥ—reciting; tu—but; rājan—O king; mantra-vidām—among mantra-knowers; varaḥ—foremost."],["By mind, deed, and speech, and by curse or favour; living on milk, resorting to silence in a secluded place, with senses restrained,","manasā—by mind; karmaṇā—by deed; vācā—by speech; śāpa-anugrahataḥ—by curse or favour; api—and; vā—or; kṣīra-aśī—living on milk; maunam—silence; āśritya—resorting to; vivikte—in a secluded place; niyata-indriyaḥ—with senses restrained."],["Having recited twelve lakhs, he would go to heaven in his body. He wanders through the three worlds at will, like a cintāmaṇi, O king.","japitvā—having recited; dvādaśa-lakṣam—twelve lakhs; sa-śarīraḥ—with his body; divam—to heaven; vrajet—would go; trailokyam—the three worlds; carate—wanders; rājan—O king; icchayā—at will; cintāmaṇiḥ iva—like a cintāmaṇi."],["Now hear this supreme left [hṛdaya], the heart of the Sun, to be remembered always by a pure person, remover of all sin and fear.","atha—now; idam—this; paramam—supreme; vāmam—left; sūryasya—of the Sun; hṛdayam—the heart; śṛṇu—hear; smartavyam—to be remembered; śucinā—by a pure person; nityam—always; sarva-pāpa-bhaya-apaham—removing all sin and fear."],["Separated, joined with Candra and Ṛ-kāra, and indeed illumined by Oṃ-kāra, it is proclaimed as the hṛdaya, O Bhārata.","viyuktam—separated; candra—with Candra; saṃyuktam—joined; ṛ-kāreṇa—with Ṛ-kāra; bhārata—O Bhārata; oṃ-kāra-dīpitam—illumined by Oṃ-kāra; ca—and; eva—indeed; hṛdayam—the hṛdaya; parikīrtitam—proclaimed."],["Joined with Y-kāra and bindu, it is called Vaiśākha by the wise. Y-kāra and V-kāra, mātrā and bindu likewise, O king.","yakāra-bindu-saṃyuktam—joined with Y-kāra and bindu; vaiśākhaḥ—Vaiśākha; kathitaḥ—is called; budhaiḥ—by the wise; yakāraḥ—Y-kāra; ca—and; vakāraḥ—V-kāra; ca—and; mātrā—mātrā; binduḥ—bindu; tathā—likewise; nṛpa—O king."],["The desired kavaca is prescribed. I shall tell the astra; hear from me. The syllable Du, beginning with Praṇava, with anusvāra, and Kaṭa likewise.","iṣṭam—desired; kavacam—the kavaca; ādiṣṭam—is prescribed; astram—the astra; vakṣye—I shall tell; nibodha—hear; me—from me; praṇava-ādim—beginning with Praṇava; dukāram—the syllable Du; ca—and; sa-anusvāram—with anusvāra; kaṭaḥ—Kaṭa; tathā—likewise."],["This is remembered as the astra, O king; hear the amṛta too. The V-kāra joined with bindu and Candra is remembered as amṛta.","idam—this; astram—the astra; smṛtam—is remembered; rājan—O king; amṛtam—the amṛta; ca—and; nibodha—hear; me—from me; bindu-candra-samāyuktam—joined with bindu and Candra; vakāram—the V-kāra; amṛtam—as amṛta; smṛtam—is remembered."],["Oṃ, O Brāhmaṇa: the astra, amṛta, Gāyatrī, and your disease are proclaimed as the cow. Y-kāra and V-kāra—one should indicate the riro-vetra.","oṃ—Oṃ; brahman—O Brāhmaṇa; astram—the astra; amṛtam—the amṛta; gāyatrīm—the Gāyatrī; ca—and; api—also; te—your; rogam—disease; dhenuḥ—the cow; vai—indeed; parikīrtitam—is proclaimed; yakāraḥ—Y-kāra; ca—and; vakāraḥ—V-kāra; ca—and; riro-vetram—the riro-vetra; ādiśet—one should indicate."],["These are the limbs of the Sun of immeasurable splendour. Having placed Āditya on the head, one should place the hṛdaya in the heart.","vyanetra—[name of a limb]; etāni—these; aṅgāni—limbs; sūryasya—of the Sun; amita-tejasaḥ—of immeasurable splendour; ādityam—Āditya; mūrdhni—on the head; vinyasya—having placed; hṛdaye—in the heart; hṛdayam—the hṛdaya; nyaset—one should place."],["One should contemplate Sāvitrī at the throat, and the whole [mantra] on the head. I have described Arka-nyāsa; the learned one should arrange the nyāsa.","sāvitrīm—Sāvitrī; kaṇṭha-deśe—at the throat; tu—but; aśeṣam—the whole; mūrdhni—on the head; cintayet—one should contemplate; arka-nyāsaḥ—Arka-nyāsa; mayā—by me; ākhyātaḥ—is described; vidvān—the learned one; nyāsam—the nyāsa; prakalpayet—should arrange."],["Hear the supreme worship-procedure of the one-syllabled Sun. First, having bound the Kiṅkiṇī-mudrā at the heart, O king,","eka-akṣarasya—of the one-syllabled; sūryasya—Sun; śṛṇu—hear; arcana-vidhim—the worship-procedure; paramam—supreme; prathamam—first; kiṅkiṇī-mudrām—the Kiṅkiṇī-mudrā; baddhvā—having bound; tu—indeed; hṛdaye—at the heart; nṛpa—O king."],["During prāṇāyāma likewise, accompanied by the surrounding heroes, one attains the one syllable with care for self-purification.","prāṇāyāme—in prāṇāyāma; ca—and; tathā—likewise; parivīra-samanvitam—accompanied by the surrounding heroes; eka-akṣaram—the one syllable; samāvetti—one attains; ātma-śuddhi-artham—for self-purification; ādarāt—with care."],["Again, you yourself should obtain the binding with the V-kāra, as the self.","punaḥ—again; tvam—you; eva—yourself; vadhyam—the binding; tu—indeed; vakāreṇa—with V-kāra; ātmanā—as the self; labhet—should obtain."],["Having done this, one becomes equal to Āditya, without doubt. Having made the mudrā in the temple, one should apply the astra, O king.","etat—this; kṛtvā—having done; āditya-samaḥ—equal to Āditya; bhavati—becomes; iti—thus; na—not; saṃśayaḥ—doubt; kṛtvā—having made; ca—and; mudrām—the mudrā; prāsāde—in the temple; astram—the astra; yojya—having applied; mahī-pate—O king."],["The temple should thus become beautiful, O best of the Bharatas. With the kavaca one should cleanse Arka’s desired enemy and the rite of increase.","prāsāda-śobhanam—temple-beauty; syāt—should become; vai—indeed; kṛtvā—having done; tat—that; bharata-ṛṣabha—O best of the Bharatas; kavacena—with the kavaca; arka-vāñ-chatrum—Arka’s desired enemy; kṣālayet—one should cleanse; vardhana-kriyām—the rite of increase."],["Then, O king, one should worship the arghya-vessel with flowers according to rule. One should bathe the god with the hṛdaya, then perform worship.","tataḥ—then; arghya-pātram—the arghya-vessel; puṣpaiḥ—with flowers; ca—and; pūjayet—one should worship; vidhi-vat—according to rule; nṛpa—O king; hṛdinā—with the hṛdaya; snāpayet—one should bathe; devam—the god; tataḥ—then; pūjām—worship; samācaret—one should perform."],["One should place the god in the lotus-mudrā with the flower in its centre, on the head. Thus Divākara, the god of gods, becomes invoked.","padma-mudrā—in the lotus-mudrā; puṣpa-garbhā—with the flower in its centre; devam—the god; śirasi—on the head; vinyaset—one should place; āvāhitaḥ—invoked; bhavet—becomes; evam—thus; deva-devaḥ—the god of gods; divākaraḥ—Divākara."],["With the hṛdaya, one should bind the worship joined with arghya, O Bhārata. With the hṛdaya, naivedya too should be given according to one’s ability.","hṛdayena—with the hṛdaya; arghya-saṃyuktām—joined with arghya; pūjām—the worship; badhnīta—one should bind; bhārata—O Bhārata; hṛdayena—with the hṛdaya; ca—and; naivedyam—naivedya; dātavyam—should be given; śaktitaḥ—according to ability; vibho—O lord."],["A person of good vows, with speech and senses restrained, should perform japa according to ability. By this procedure, O king, one should accomplish all tasks.","yathā-śakti—according to ability; japam—japa; kuryāt—one should perform; su-vratī—a person of good vows; vāg-yata-indriyaḥ—with speech and senses restrained; anena—by this; vidhinā—procedure; rājan—O king; sarva-kāryāṇi—all tasks; sādhayet—one should accomplish."],["There should be no obstruction anywhere, nor should there be wrongdoing. Having bound the supreme Vyoma-mudrā and also performed circumambulation,","na—not; kvacit—anywhere; pratighātaḥ—obstruction; syāt—should be; na—not; ca—and; api—also; duritam—wrongdoing; bhavet—should be; vyoma-mudrām—the Vyoma-mudrā; parām—the supreme; baddhvā—having bound; kṛtvā—having performed; ca—and; api—also; pradakṣiṇam—circumambulation."],["Afterwards, O lord of the earth, one should dismiss the god with the hṛdaya.","devam—the god; visarjayet—one should dismiss; paścāt—afterwards; hṛdayena—with the hṛdaya; mahī-pate—O lord of the earth."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:212,verseCount:29,subtitle:"Chapter 212 — Solar Worship Procedure",colophon:""},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body>
