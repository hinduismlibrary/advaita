<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 212 — Solar Worship Procedure."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 212 — Solar Worship Procedure — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 212 — Solar Worship Procedure</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-211/">← Chapter 211</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-213/">Chapter 213 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["This Arka saṃpuṭikā has been told to you, O hero. Hear from me as I tell the second, which is with pepper.","eṣā—this; kathitā—told; arka-sampuṭikā—Arka-cup; tava—to you; vīra—O hero; dvitīyā—the second; maricaiḥ—with pepper; śṛṇu—hear."],["In the bright fortnight of Caitra, having properly fasted on the sixth day, one should worship Bhāskara with devotion according to the rule of Sauradharma.","śukla-pakṣe—in the bright fortnight; caitrasya—of Caitra; ṣaṣṭhyām—on the sixth; samyak—properly; upoṣitaḥ—having fasted; pūjayet—should worship; bhaktyā—with devotion."],["Tell me all the mantras, O Brāhmaṇa, especially the sacred ones, and also the Sūrya hṛdaya, likewise those joined with śiro nyāsa.","brūhi—tell; sarvān—all; mantrān—mantras; brahman—O Brāhmaṇa; puṇyān—sacred; viśeṣataḥ—especially; sūrya-ādi-hṛdayam—the Sūrya-heart and the rest; śiro-nyāsa-yutān—joined with head-placement."],["I shall tell you the supreme secret, O lord, formerly spoken by Brahmā with devotion to the great Bhānu.","ahaṃ—I; te—to you; kathayiṣyāmi—shall tell; rahasyam—secret; paramam—supreme; yat—which; uktam—spoken; brahmaṇā—by Brahmā; pūrvam—formerly; bhānoḥ—of Bhānu; mahātmanaḥ—of the great-souled."],["Hear that, O great minded one, for the destruction of all sins, Āditya, holy, remover of all sins, worshipped by the worlds,","sarva-pāpa-kṣaya-arthāya—for destruction of all sins; tat—that; śṛṇu—hear; mahā-mate—O great-minded one; sarva-pāpa-haram—removing all sins; puṇyam—sacred; ādityam—Āditya; loka-pūjitam—worshipped by the worlds."],["Joined with a crest garland, the excellent immortal Va syllable. Oṃ vaṃ phaṭ. Oṃ, this Sun himself, dear one, is mantra formed and greatly powerful.","śikhā-dāma-samāyuktam—joined with a crest-garland; vakāra-amṛtam—the immortal syllable Va; uttamam—excellent; eṣaḥ—this; sūryaḥ—Sun; mantra-mūrtiḥ—mantra-formed; mahā-balaḥ—greatly powerful."],["By remembering this, the mantra knower always eats sweet food. Within a year, he sees Bhānu himself, the lord of the gods.","asya anusmaraṇāt—from remembering this; mantrī—mantra-knower; nityam—always; madhura-bhojanaḥ—eating sweet food; saṃvatsareṇa—within a year; deva-īśam—the Lord of gods; sākṣāt—directly; bhānum—Bhānu; prapaśyati—sees."],["Freed from disease and death, he goes to the world of the Sun. Always reciting, O king, he is foremost among mantra knowers.","vyādhi-mṛtyoḥ—from disease and death; vimuktaḥ—freed; sūrya-lokam—to the world of the Sun; saḥ—he; gacchati—goes; satatam—always; japamānaḥ—reciting; mantra-vidām—among mantra-knowers; varaḥ—foremost."],["By mind, deed, and speech, and by curse or favor, living on milk, resorting to silence in a secluded place, with senses restrained,","manasā—by mind; karmaṇā—by deed; vācā—by speech; śāpa-anugrahataḥ api vā—and also by curse or favor; kṣīra-aśī—living on milk; maunam āśritya—undertaking silence; vivikte—in a secluded place; niyata-indriyaḥ—with senses controlled."],["Having recited twelve hundred thousand, he goes to heaven in his body. He wanders through the three worlds as he wishes, like a cintāmaṇi, O king.","japitvā—having recited; dvādaśa-lakṣam—twelve hundred thousand; sa-śarīraḥ—with his body; divam—to heaven; vrajet—would go; trailokyam—the three worlds; carate—wanders; icchayā—as desired; cintāmaṇiḥ iva—like a cintāmaṇi."],["Now hear this supreme Vāma, the heart of the Sun, always to be remembered by a pure person, remover of all sin and fear.","atha—now; idam—this; paramam—supreme; vāmam—left; sūryasya hṛdayam—the Sun’s heart; śṛṇu—hear; smar tav yam—to be remembered; śucinā—by a pure person; nityam—always; sarva-pāpa-bhaya-apaham—removing all sin and fear."],["Detached, joined with Candra and Ṛ kāra, and illumined by Oṃ kāra, it is declared the heart, O Bhārata.","viyuktam—separated; candra—with Moon; saṃyuktam—joined; ṛ-kāreṇa—with Ṛ-kāra; oṃ-kāra-dīpitam—illumined by Oṃ-kāra; hṛdayam—heart; parikīrtitam—declared."],["Joined with Y kāra and bindu, Vaiśākha is said by the wise. Y kāra and V kāra, mātrā and bindu likewise, O king.","yakāra-bindu-saṃyuktam—joined with Y-syllable and bindu; vaiśākhaḥ—Vaiśākha; kathitaḥ—spoken; budhaiḥ—by the wise; yakāraḥ—Y-syllable; vakāraḥ—V-syllable; mātrā—mātrā; binduḥ—bindu."],["The desired kavaca is prescribed. I shall tell the astra, hear from me. Beginning with Praṇava, Du kāra with anusvāra, and Kaṭa likewise.","iṣṭam—desired; kavacam—armor; ādiṣṭam—prescribed; astram—weapon; vakṣye—I shall tell; nibodha—hear; praṇava-ādim—beginning with Praṇava; dukāram—the Du-syllable; sa-anusvāram—with anusvāra; kaṭaḥ tathā—and Kaṭa likewise."],["This is remembered as the astra, O king. Hear the amṛta too. V kāra joined with bindu and Candra is remembered as amṛta.","idam—this; astram—weapon; smṛtam—remembered; rāj an—O king; amṛtam—immortal; nibodha—hear; bindu-candra-samāyuktam—joined with bindu and Moon; vakāram—the V-syllable; amṛtam—immortal."],["Oṃ, O Brāhmaṇa, astra, amṛta, Gāyatrī, and your illness are indeed proclaimed as dhenu. Y kāra and V kāra are to be indicated as riro vetra.","oṃ—Oṃ; brahman—O Brāhmaṇa; astram—weapon; amṛtam—immortal; gāyatrīm—Gāyatrī; te—your; rogam—disease; dhenuḥ—the cow; parikīrtitam—declared; yakāraḥ ca vakāraḥ—and Y- and V-syllables; ādiśet—one should indicate."],["These are the limbs of the Sun of immeasurable splendor. Having placed Āditya on the head, one should place the hṛdaya in the heart.","etāni—these; aṅgāni—limbs; sūryasya—of the Sun; amita-tejasaḥ—of immeasurable splendor; ādityam—Āditya; mūrdhni—on the head; vinyasya—having placed; hṛdaye—in the heart; hṛdayam—the heart; nyaset—one should place."],["One should contemplate Sāvitrī at the throat, and the whole on the head. I have described Arka nyāsa, the learned one should arrange the nyāsa.","sāvitrīm—Sāvitrī; kaṇṭha-deśe—at the throat; cintayet—should contemplate; aśeṣam—the whole; mūrdhni—on the head; arka-nyāsaḥ—Arka-nyāsa; mayā—by me; ākhyātaḥ—told; vidvān—the learned one; nyāsam—nyāsa; prakalpayet—should arrange."],["Hear the supreme worship procedure of the one syllabled Sun. First, having bound the Kiṅkiṇī mudrā at the heart, O king.","eka-akṣarasya—of the one-syllabled; sūryasya—Sun; arcana-vidhim—worship-procedure; paramam—supreme; śṛṇu—hear; prathamam—first; kiṅkiṇī-mudrām—Kiṅkiṇī-mudrā; baddhvā—having bound; hṛdaye—at the heart; nṛpa—O king."],["And likewise in prāṇāyāma, accompanied by the surrounding heroes, one should carefully place the one syllable for the purification of the self.","prāṇāyāme—in prāṇāyāma; parivīra-samanvitam—joined with surrounding heroes; eka-akṣaram—the one syllable; samāveśayet—one should place; ātma-śuddhi-artham—for self-purification; ādarāt—carefully."],["Again, one should obtain the bound form as the self through V kāra.","punaḥ—again; tu—indeed; vadhyam—bound; vakāreṇa—by the V-syllable; ātmanā—as the self; labhet—one should obtain."],["Having done this, he becomes equal to Āditya, without doubt. Having made the mudrā in the temple, one should apply the astra, O king.","etat kṛtvā—having done this; āditya-samaḥ—equal to Āditya; bhavati—becomes; na saṃśayaḥ—without doubt; mudrām kṛtvā—having made the mudrā; prāsāde—in the temple; astram—weapon; yojayet—should apply."],["By doing that, the temple becomes beautiful, O best of the Bharatas. With the kavaca, one should cleanse the enemy of Arka and the rite of increase.","prāsāda-śobhanam—temple-beauty; syāt—becomes; kṛtvā—having done; bharata-ṛṣabha—O best of the Bharatas; kavacena—with the armor; arka-vāñ-chatrum—enemy desiring Arka; kṣālayet—should cleanse; vardhana-kriyām—rite of increase."],["Then, O king, one should worship the arghya vessel with flowers according to rule. One should bathe the god with the hṛdaya, then perform worship.","tataḥ—then; arghya-pātram—the arghya-vessel; puṣpaiḥ—with flowers; pūjayet—should worship; vidhi-vat—according to rule; hṛdinā—with the heart [mantra]; snāpayet—should bathe; devam—the god; pūjām—worship; samācaret—should perform."],["With the lotus mudrā containing a flower, one should place the god on the head. Thus the god of gods Divākara is invited.","padma-mudrā—lotus-mudrā; puṣpa-garbhā—with the flower in the womb; devam—the god; śirasi—on the head; vinyaset—one should place; āvāhitaḥ—invited; bhavet—becomes; deva-devaḥ—god of gods; divākaraḥ—Divākara."],["With the hṛdaya one should bind the worship joined with arghya, O Bhārata. With the hṛdaya, naivedya should also be given to the Lord according to ability.","hṛdayena—with the heart [mantra]; arghya-saṃyuktām—joined with arghya; pūjām—worship; badhnīt—should bind; naivedyam—food-offering; dātavyam—is to be given; śaktitaḥ—according to ability."],["A keeper of a good vow, with speech and senses restrained, should perform japa according to ability. By this procedure, O king, he should accomplish all acts.","yathā-śakti—according to ability; japam—japa; kuryāt—should perform; su-vratī—of good vow; vāg-yata-indriyaḥ—with speech and senses restrained; anena vidhinā—by this procedure; sarva-kāryāṇi—all acts; sādhayet—should accomplish."],["There should be no opposition anywhere, nor should there be wrongdoing. Having bound the supreme Vyoma mudrā and also performed circumambulation,","na kvacit—nowhere; pratighātaḥ—opposition; syāt—would be; na ca api—and not; duritam—wrongdoing; vyoma-mudrām—the Vyoma-mudrā; parām—supreme; baddhvā—having bound; pradakṣiṇam—circumambulation; kṛtvā—having done."],["Afterwards, O ruler of the earth, one should dismiss the god with the hṛdaya.","devam—the god; visarjayet—should dismiss; paścāt—afterward; hṛdayena—with the heart [mantra]; mahīpate—O ruler of the earth."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:212,verseCount:29,subtitle:"Chapter 212 — Solar Worship Procedure",colophon:""},T);</script></body>
