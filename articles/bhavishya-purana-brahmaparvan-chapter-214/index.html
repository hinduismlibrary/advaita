<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 214 — The Marīca Vow for the Seventh Lunar Day."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 214 — The Marīca Vow for the Seventh Lunar Day — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-2" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 214 — The Marīca Vow for the Seventh Lunar Day</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-213/">← Chapter 213</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-215/">Chapter 215 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-2"></script><script>const R=[["Padminī, and another, Madhyamā, Namanī likewise, Arkiṇī, Jvālinī, Tejanī, and Gabhastinī.","padminī—Padminī; anyā—another; madhyamā—Madhyamā; namanī—Namanī; arkiṇī—Arkiṇī; jvālinī—Jvālinī; tejanī—Tejanī; gabhastinī—Gabhastinī."],["The Śaṅkha mudrā is the tenth. Sūrya vaktrā is another, and Sahasrakiraṇa. Twelve mudrās are declared.","śaṅkha-mudrā—Śaṅkha-mudrā; daśamī—the tenth; sūrya-vaktrā—Sūrya-vaktrā; sahasra-kiraṇā—Sahasrakiraṇa; mudrāḥ—mudrās; dvādaśa—twelve; kīrtitāḥ—declared."],["The wise one should offer arghya with Padminī, bind Vyoma, and recite. Udayā is the support in attraction. Madhyamā destroys disease.","dadyāt—should give; arghyam—arghya; padminyā—with Padminī; vyoma—Vyoma; baddhvā—having bound; japed—should recite; madhyamā—Madhyamā; vyādhi-nāśinī—destroying disease."],["If one is established in the procedure, he sees the Sun through Arkiṇī. Having bound Jvālinī, he should recite facing the Sun.","arkiṇyā—through Arkiṇī; paśyate—sees; sūryam—the Sun; vidhi-sthaḥ—established in the procedure; jvālinīm—Jvālinī; baddhvā—having bound; sūrya-mukhaḥ—facing the Sun; japet—should recite."],["After a week he sees the Sun, and accomplishment itself arises. Having descended to a lotus cluster, the man faces the Sun.","saptāhāt—after a week; vīkṣate—sees; sūryam—the Sun; sidhyate—accomplishment arises; tataḥ—then; avatīrya—having descended; padma-khaṇḍam—to a lotus-piece; sūrya-abhimukhaḥ—facing the Sun; naraḥ—a man."],["Reciting a hundred thousand, indeed, he obtains an inexhaustible treasure. Hear this procedure of the Sun circle with Śaṅkha mudrā and the rest.","japan—reciting; śata-sahasram—a hundred thousand; akṣayam—inexhaustible; labhate—obtains; nidhim—treasure; śaṅkha-mudrā-ādibhiḥ—with Śaṅkha-mudrā and the rest; sūrya-cakra-vidhim—Sun-cakra procedure; śṛṇu—hear."],["Having fasted day and night, having bound it, and facing the Sun, the man should sit in lotus posture and recite the mantra ten thousand times, O king.","ahaḥ-rātra—day and night; upoṣitaḥ—having fasted; baddhvā—having bound; sūrya-mukhaḥ—facing the Sun; naraḥ—a man; padma-āsane—in lotus-posture; sthitaḥ—seated; japet—should recite; ayutam—ten thousand; manum—the mantra."],["After three days he sees the Sun, and mental accomplishment arises. Having bound Sahasrakiraṇa, he stands in water up to the navel.","paśyate—sees; try-ahāt—after three days; sūryam—the Sun; siddhiḥ—accomplishment; mānasī—mental; sahasra-kiraṇam—Sahasrakiraṇa; baddhvā—having bound; nābhi-mātra-jale—in water up to the navel; sthitaḥ—standing."],["He should recite ten thousand times, his mind on him, the supreme god Sahasrakiraṇa, covered with rays.","japet—should recite; ayuta-mātram—ten thousand; tataḥ—then; gata-mānasaḥ—with mind gone to him; sahasra-kiraṇam—of a thousand rays; devam—god; param—supreme; raśmibhiḥ—with rays; āvṛtam—covered."],["He sees the supreme abode, and his accomplishment becomes abundant. He becomes the maker of curse and favor for all living beings.","saḥ—he; paśyati—sees; paramam dhāma—the supreme abode; siddhiḥ—accomplishment; puṣkalā—abundant; śāpa-anugraha-kartā—maker of curse and favor; sarveṣām prāṇinām—of all beings; bhavet—becomes."],["Having removed the covering on every side, he becomes free from fever.","sarvataḥ—from every side; kañcukam—covering; muktvā—having removed; bhavet—becomes; vigata-jvaraḥ—free of fever."],["Having joined both ankles and hands together, one should cross the right little finger with the left ring finger.","parau—both; gulphau—heels; karau—hands; kṛtvā—having made; saṃlagnau—joined; parasparam—together; vāma-anāmikayā—with the left ring finger; ākramya—crossing; dakṣiṇām—the right; kaniṣṭhikām—little finger."],["The left with the right, and the right likewise with the left. This highly meritorious mudrā is declared Vyoma mudrā.","vāmā—left; dakṣiṇayā—by the right; dakṣiṇā—right; vāmayā—by the left; tathā—likewise; mudrā—mudrā; mahā-puṇyā—very sacred; vyoma-mudrā—Vyoma-mudrā; prakīrtitā—declared."],["When bound with this, the diseases of people are immediately diminished. No practitioner without this attains accomplishment.","baddhayā—when bound; anayā—by this; sadyaḥ—immediately; hīyante—are diminished; vyādhayaḥ—diseases; nṛṇām—of people; na—no; anayā rahitaḥ—without this; kaścit—anyone; siddhim—accomplishment; prāpnoti—attains."],["This is indeed supreme everywhere, remembered as mantra fist. It is known as the Arka mudrā, the heart of the Sun.","sarvatra—everywhere; uttamā—supreme; eṣā—this; mantra-muṣṭiḥ—mantra-fist; smṛtā—remembered; sūryasya hṛdayam—the Sun’s heart; arka-mudrā—Arka-mudrā; viśrutā—known."],["One should bind it continually with mantras for increase of life and health. The mantra knower stands before the solar orb at sunrise.","badhnīyāt—should bind; satatam—always; mantraiḥ—with mantras; āyuḥ-ārogya-vṛddhaye—for increase of life and health; sūrya-maṇḍala-abhyagre—before the solar orb; sūryodaye—at sunrise; sthitaḥ—standing."],["Facing the Sun, the practitioner should recite the mantra, meditating and intent on japa. He should see him in three days.","sūrya-abhimukhaḥ—facing the Sun; bhūtvā—having become; japet—should recite; mantram—the mantra; sādhakaḥ—the practitioner; dina-trayeṇa—in three days; vīkṣet—should see; dhyānī—meditating; japa-parāyaṇaḥ—intent on japa."],["Having seen him, he does not meet death, nor is he sorrowful, without doubt. He attains the highest abode where the god Divākara is.","tam—him; dṛṣṭvā—having seen; na aśnute—does not meet; mṛtyum—death; duḥkhī—sorrowful; na—not; na saṃśayaḥ—without doubt; prāpnoti—attains; paramam sthānam—the supreme abode; divākaraḥ—Divākara."],["Having turned both hands upward, their backs joined to one another, one should bind all the fingers, spread well, without doubt.","uttānau—turned upward; karau—both hands; kṛtvā—having made; pṛṣṭha-lagnau—with backs joined; parasparam—to one another; baddhvā—having bound; aṅgulayaḥ—fingers; sarvāḥ—all; su-prakīrṇāḥ—well spread."],["Having pressed the roots of the fingers in order with the thumbs, this mudrā is named Udayā. One should bind it at sunrise.","ākrāmya—having pressed; aṅgulī-mūlam—the roots of the fingers; aṅguṣṭhābhyām—with the thumbs; yathā-kramam—in order; udayā—Udayā; nāma—named; mudrā—mudrā; badhnīyāt—one should bind; udaye raveḥ—at the Sun’s rising."],["After twelve days he sees the Sun, without doubt. It is the remover of all sins and the destroyer of all sins.","dvādaśāt dināt—by the twelfth day; vīkṣate—sees; sūryam—the Sun; na saṃśayaḥ—without doubt; sarva-pāpa-harā—remover of all sins; sarva-pāpa-vināśinī—destroyer of all sins."],["Without Udayā, one should place the left in the middle. It is known by the name Madhyamā, and one should contemplate the mid Sun.","udayā vinā—without Udayā; vāmam—the left; madhyataḥ—in the middle; kṣipet—one should place; madhyamā—Madhyamā; nāma—by name; vikhyātā—known; madhya-sūrye—on the mid-Sun; cintayet—should contemplate."],["Having bound the Madhyamā mudrā in that manner, the practitioner should properly join the two thumbs at the ends of the fingers.","madhyamā—Madhyamā; vidhinā—in the proper way; tena—that; baddhvā—having bound; mudrām—the mudrā; sādhakaḥ—the practitioner; aṅgulyoḥ—to the fingers; param—at the end; aṅguṣṭhau—both thumbs; vidhinā—properly; grathayet—should join."],["This auspicious mudrā is called Astamanī, sovereign of all tantras. Having bound the mudrā at sunset, one should begin japa.","mudrā—mudrā; sā—this; astamanī—Astamanī; sarva-tantra-īśvarī—sovereign of all tantras; śubhā—auspicious; sūryasya astamane—at the Sun’s setting; baddhvā—having bound; japam—japa; sam ārabhet—should begin."],["The wise one should recite a thousand or a hundred, having bound the mudrā. Joined with all sins, he becomes splendid after a week.","sahasram—a thousand; śatam vā—or a hundred; mudrām baddhvā—having bound the mudrā; japet—should recite; budhaḥ—the wise one; sarva-pātaka-saṃyuktaḥ—joined with all sins; saptāhāt—after a week; anuśobhanam—becoming beautiful."],["Having joined both hands to one another, with the thumbs upward, one should raise both thumbs, join them, and place them on the head.","karau—hands; parasparam—to one another; lagnau—joined; aṅguṣṭhau—thumbs; ūrdhva-saṃsthitau—standing upward; ubhau—both; saṃlagnau—joined; mūrdhni—on the head; saṃsthitau—placed."],["This Mālinī mudrā burns the cage of sins. Placed on the head, it burns sins beginning with Brahmahatyā.","mudrā—mudrā; mālinī—Mālinī; nird ahet—burns; pāpa-pañjaram—the cage of sins; brahma-hatyā-ādi—beginning with brahmin-slaying; pāpam—sin; yojitā—placed; mūrdhani—on the head."],["Having folded all the fingers slightly toward the middle and forward, with both thumbs upward, this is remembered as the Tarjanī mudrā.","vidarbhya—having folded; aṅgulayaḥ—fingers; sarvāḥ—all; īṣat—slightly; madhye—in the middle; agrataḥ—forward; ūrdhva-sthitau—standing upward; aṅguṣṭhau—thumbs; tarjanī—Tarjanī; smṛtā—remembered."],["This goddess removes all diseases and destroys all enemies. Having bound this greatly meritorious mudrā, he immobilizes all enemies.","sarva-vyādhi-harā—remover of all diseases; devī—goddess; sarva-śatru-vināśinī—destroyer of all enemies; etām—this; baddhvā—having bound; mahā-puṇyām—greatly sacred; stambhayate—restrains; ripūn—enemies."],["Having extended both hands, with the middle set halfway, he should bend the remaining fingers, then the thumb tips in order.","ubhau—both; prasārya—having extended; hastau—hands; madhye—in the middle; sārdhena—with a half; saṃsthitau—placed; śeṣa—remaining; anām yā—ring-finger; aṅguṣṭha-agram—thumb-tip; kramāt—in order."],["The mudrā named Gabhastinī is the supreme heart of the Sun. It destroys death, and is auspicious when bound at sunrise.","mudrā—mudrā; gabhastinī—Gabhastinī; nāma—named; sūryasya—of the Sun; hṛdayam—heart; paramam—supreme; mṛtyum—death; nāśayate—destroys; baddhvā—having bound; sūryodaye—at sunrise; śubhā—auspicious."],["At the time of arghya one should bind it and worship Agni. At the time of japa one should bind the mantras, without doubt.","arghya-kāle—at the time of arghya; badhnīyāt—should bind; arcayā—by worship; agnim—the fire; prapūjayet—should worship; japa-kāle—at the time of japa; mantrāṇām—of mantras; badhnīyāt—should bind; na saṃśayaḥ—without doubt."],["Thus it should be made with the right little finger and forefingers. Likewise, the forefingers and thumbs are joined together. Whoever recites daily is purified in three months.","dakṣiṇa-kaniṣṭhikābhyām—with the right little fingers; tarjanībhyām—with forefingers; tathā—likewise; aṅguṣṭhau—thumbs; saṃlagnau—joined; japaṃ yaḥ karute—whoever recites; nityam—daily; tri-bhiḥ māsaiḥ—in three months; viśudhyati—is purified."],["Having made both hands cupped together, one should bend the two forefingers.","karau—hands; sampuṭau—cupped; kṛtvā—having made; tarjan yau—forefingers; dve—two; kuñcayet—should bend."],["This Sahasrakiraṇa is sovereign among all mudrās. The practitioner should bind it at the three sandhyās, at the head of the mantra. It destroys all sins as the Sun destroys a mass of darkness.","sahasra-kiraṇā—Sahasrakiraṇa; sarva-mudrā-īśvarī—sovereign of all mudrās; tri-sandhyam—at the three junctions; badhnīyāt—should bind; sādhakaḥ—the practitioner; mantra-mūrdhani—at the crown of the mantra; nāśayet—destroys; sarva-pāpāni—all sins; aṃśumān—the Sun; tamaḥ-rāśim iva—like a mass of darkness."],["Having bound the mudrā called Mudraka Kumbha, one should then recite the mantra. It destroys kuṣṭha in a month, and in three months, without doubt. Whoever thus worships the Sun with the limbs of the mudrās.","mudrā—mudrā; mudraka-kumbha—Mudraka-kumbha; baddhvā—having bound; paścāt—afterward; mantray et—should recite the mantra; mā sena—in a month; kuṣṭham—leprosy; nāśayet—destroys; tri-bhiḥ māsaiḥ—in three months; sūryam—the Sun; mudrā-aṅga-sahitam—with mudrā-limbs; pūjayate—worships."],["By this procedure, O king, Brahmā worships Ravi. Therefore, O king of kings, you too worship Bhāskara by this procedure.","anena vidhinā—by this procedure; rājan—O king; brahmā—Brahmā; pūjayate—worships; ravim—Ravi; tasmāt—therefore; tvam api—you too; rāja-indra—O king; bhāskaram—Bhāskara; pūjaya—worship."],["Then, having attained the Sun here, he goes to the world of the Sun. Whoever worships Ravi continually by this procedure,","tataḥ—then; sūryam—the Sun; avāpya—having attained; iha—here; sūrya-lokam—to the world of the Sun; saḥ gacchati—he goes; anena vidhinā—by this procedure; yaḥ tu—whoever; pūjayet—worships; satatam—always; ravim—Ravi."],["He goes to the highest abode where the god Divākara is, having thus worshipped the Lord of gods by this procedure, O king.","saḥ yāti—he goes; paramam sthānam—to the highest abode; yatra—where; devaḥ—the god; divākaraḥ—Divākara; ittham—thus; pūjya—having worshipped; deva-īśam—the Lord of gods; nṛpa—O king."],["Having fed Brāhmaṇas according to ability and rule, one should also consume pepper with mantra on Saptamī.","bhojayitvā—having fed; yathā-śakti—according to ability; brāhmaṇān—Brāhmaṇas; vidhi-vat—according to rule; saptamyām—on Saptamī; prāśayet—should swallow; maricam—pepper; mantrataḥ—with a mantra."],["Taking one unblemished and very firm pepper, one should consume it with water, O king, with this mantra as remembered.","ekam—one; gṛhītvā—having taken; maricam—pepper; avraṇam—unblemished; dṛḍham—firm; param—very; sa-jalam—with water; prāśayet—should swallow; rājan—O king; mantr eṇa—with a mantra; smṛtam—remembered."],["Having worshipped Divākara by the stated procedure, having thus consumed the pepper, he should then eat with speech restrained.","yathā-uktena vidhānena—by the stated procedure; pūjayitvā—having worshipped; divākaram—Divākara; saṃprāśya—having swallowed; maricam—pepper; tataḥ—then; bhuñjīta—should eat; vāk-yataḥ—speech restrained."],["He obtains union with the beloved at that very moment, and not otherwise. This is the holy Saptamī, giver of union with the beloved.","priya-saṅgamam—union with the beloved; avāpnoti—obtains; tat-kṣaṇāt—at that moment; eva—indeed; na anyathā—not otherwise; iyam—this; saptamī—Saptamī; puṇyā—holy; dāyinī—giving."],["By performing it with one pepper, one obtains desires within a year, O best of men, and again obtains union with sons and the like.","kur yāt—should perform; ekena—with one; kāmān—desires; tu—indeed; vatsareṇa—within a year; saḥ gacchati—he goes; putra-ādibhiḥ—with sons and the like; punaḥ—again; saṅgamam—union; ṛcchati—obtains."],["Therefore, O mighty armed one, you yourself perform the Saptamī that grants the beloved. Indra fasted properly on Sura Marīca Saptamī and made union according to rule with Śacī.","kuru—perform; tasmāt—therefore; mahā-bāho—O mighty-armed one; tvam eva—you yourself; priya-dāyinīm—giver of the beloved; upoṣya—having fasted; indraḥ—Indra; vidhi-vat—properly; surā-marica-saptamīm—Sura-Marīca-Saptamī; saṃyogam—union; śacyā—with Śacī; kṛtavān—made."],["The mighty Nala too, having fasted on this, made union with Damayantī.","upoṣya—having fasted; enām—on this; nalaḥ—Nala; api—also; damayantyā—with Damayantī; mahā-balaḥ—the mighty one."],["Rāma went with Sītā, O king, having fasted on this.","rāmaḥ—Rāma; agāt—went; sītayā saha—together with Sītā; upoṣya—having fasted; enām—on this; nara-adhipa—O king."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:214,verseCount:47,subtitle:"Chapter 214 — The Marīca Vow for the Seventh Lunar Day",colophon:""},T);</script></body>
