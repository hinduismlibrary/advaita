<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 214 — The Marīca Vow for the Seventh Lunar Day."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 214 — The Marīca Vow for the Seventh Lunar Day — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-6" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 214 — The Marīca Vow for the Seventh Lunar Day</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-213/">← Chapter 213</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-215/">Chapter 215 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-6"></script><script>const R=[["And Padminī; likewise another, Madhyamā, and Namanī; also Arkiṇī, Jvālinī, Tejanī, and Gabhastinī.","padminī—Padminī; ca—and; tathā—likewise; anyā—another; tu—but; madhyamā—Madhyamā; namanī—Namanī; tathā—likewise; arkiṇī—Arkiṇī; jvālinī—Jvālinī; ca—and; eva—indeed; tejanī—Tejanī; ca—and; gabhastinī—Gabhastinī."],["The Śaṅkha-mudrā is the tenth; Sūryavaktrā is another likewise, and Sahasrakiraṇa. Twelve mudrās are declared.","śaṅkha-mudrā—the Śaṅkha-mudrā; ca—and; daśamī—the tenth; sūrya-vaktrā—Sūryavaktrā; tathā—likewise; aparā—another; sahasra-kiraṇā—Sahasrakiraṇa; ca—and; eva—indeed; mudrāḥ—mudrās; dvādaśa—twelve; kīrtitāḥ—declared."],["One should offer arghya with Padminī; having formed Vyoma, the wise one should recite. Udayā is the support in attraction; Madhyamā destroys disease.","dadyāt—one should give; arghyam—arghya; tu—indeed; padminyā—with Padminī; vyoma—Vyoma; baddhvā—having formed; japet—one should recite; budhaḥ—the wise one; udayā—Udayā; āśrayaḥ—support; samākarṣe—in attraction; madhyamā—Madhyamā; vyādhi-nāśinī—disease-destroying."],["If one is established in the procedure, one sees the Sun by Arkiṇī. Having bound Jvālinī to approach, one should recite facing the Sun.","arkiṇyā—by Arkiṇī; paśyate—one sees; sūryam—the Sun; vidhi-sthaḥ—established in the procedure; tu—but; bhavet—would be; yadi—if; jvālinīm—Jvālinī; upasaṃgantum—to approach; baddhvā—having bound; sūrya-mukhaḥ—facing the Sun; japet—one should recite."],["After seven days one sees the Sun; then accomplishment arises by itself. The man, having descended to a lotus patch, faces the Sun.","saptāhāt—after seven days; vīkṣate—one sees; sūryam—the Sun; sidhyate—accomplishment arises; ca—and; tataḥ—then; svayam—by itself; avatīrya—having descended; padma-khaṇḍam—a lotus patch; sūrya-abhimukhaḥ—facing the Sun; naraḥ—the man."],["Indeed, reciting a hundred thousand, one obtains an inexhaustible treasure. Hear this Sun-wheel procedure with the Śaṅkha-mudrā and the rest.","japan—reciting; śata-sahasram—a hundred thousand; hi—indeed; akṣayam—inexhaustible; labhate—one obtains; nidhim—a treasure; śaṅkha-mudrā-ādibhiḥ—with the Śaṅkha-mudrā and the rest; imam—this; sūrya-cakra-vidhim—the Sun-wheel procedure; śṛṇu—hear."],["Having fasted day and night, having bound [the mudrā] and facing the Sun, the man, seated in lotus posture, should recite the mantra ten thousand times, O king.","ahaḥ-rātra—day and night; uṣitaḥ—having fasted; bhūtvā—having become; baddhvā—having bound; sūrya-mukhaḥ—facing the Sun; naraḥ—the man; sthitaḥ—seated; padma-āsane—in lotus posture; rājan—O king; japan—reciting; ca—and; api—also; ayutam—ten thousand; manum—the mantra."],["But after three days one sees the Sun, and mental accomplishment arises. Having bound Sahasrakiraṇa, one stands in water up to the navel.","paśyate—one sees; tu—but; try-ahāt—after three days; sūryam—the Sun; bhavet—arises; siddhiḥ—accomplishment; ca—and; mānasī—mental; sahasra-kiraṇam—Sahasrakiraṇa; baddhvā—having bound; nābhi-mātra-jale—in water up to the navel; sthitaḥ—standing."],["One should recite ten thousand times, with the mind fixed on him: the supreme god Sahasrakiraṇa, covered with rays.","japet—one should recite; ayuta-mātram—ten thousand times; tu—but; bhavet—becomes; tad-gata-mānasaḥ—one whose mind is fixed on him; sahasra-kiraṇam—Sahasrakiraṇa; devam—the god; param—supreme; raśmibhiḥ—with rays; āvṛtam—covered."],["He sees the supreme abode, and abundant accomplishment arises. He becomes the giver of curses and favour to all living beings.","saḥ—he; paśyati—sees; paramam dhāma—the supreme abode; bhavet—arises; siddhiḥ—accomplishment; ca—and; puṣkalā—abundant; śāpa-anugraha-kartā—giver of curse and favour; asau—he; sarveṣām—of all; prāṇinām—living beings; bhavet—becomes."],["Having released the covering on every side, one indeed becomes free of fever.","sarvataḥ—on every side; kañcukam—the covering; muktvā—having released; bhavet—one becomes; vai—indeed; vigata-jvaraḥ—free from fever."],["Having placed both ankles and hands together, and pressing the left ring finger against the right little finger,","parau—both; gulphau—ankles; karau—hands; kṛtvā—having placed; saṃlagnau—joined; ca—and; parasparam—to each other; vāma-anāmikayā—with the left ring finger; ākramya—pressing; dakṣiṇām—the right; tu—but; kanīyasīm—the little finger."],["The left [finger] with the right, and likewise the right with the left: this very meritorious mudrā is proclaimed as the Vyoma-mudrā.","vāmā—the left; dakṣiṇayā—with the right; ca—and; eva—indeed; dakṣiṇā—the right; vāmayā—with the left; tathā—likewise; mudrā—mudrā; eṣā—this; hi—indeed; mahā-puṇyā—very meritorious; vyoma-mudrā—Vyoma-mudrā; prakīrtitā—proclaimed."],["When this is bound, the diseases of people quickly diminish. No practitioner without this attains accomplishment.","baddhayā—when bound; ca—and; anayā—by this; sadyaḥ—quickly; hīyante—diminish; vyādhayaḥ—diseases; nṛṇām—of people; na—not; anayā—by this; rahitaḥ—without; kaścit—anyone; siddhim—accomplishment; prāpnoti—attains; sādhakaḥ—a practitioner."],["This is indeed best everywhere, remembered as the Mantra-muṣṭi. It is renowned as the Arka-mudrā, the heart of Sūrya.","sarvatra—everywhere; eva—indeed; uttamā—best; hi—indeed; eṣā—this; mantra-muṣṭiḥ—Mantra-muṣṭi; iti—thus; smṛtā—remembered; sūryasya—of Sūrya; hṛdayam—the heart; sā—this; iyam—this; arka-mudrā—Arka-mudrā; iti—thus; viśrutā—renowned."],["One should bind it always with mantras for the increase of life and health. The mantra-knower stands before the solar orb at sunrise.","badhnīyāt—one should bind; satatam—always; mantraiḥ—with mantras; āyuḥ—life; ārogya—health; vṛddhaye—for increase; sūrya-maṇḍala—in front of the solar orb; abhyagre—in front; mantrī—the mantra-knower; sūryodaye—at sunrise; sthitaḥ—standing."],["Facing the Sun, that practitioner should recite the mantra. The meditator, devoted to recitation, should see [him] within three days.","saḥ—that; sūrya-abhimukhaḥ—facing the Sun; bhūtvā—having become; japet—should recite; mantram—the mantra; tu—indeed; sādhakaḥ—the practitioner; dina-trayeṇa—within three days; vīkṣeta—should see; dhyānī—the meditator; japa-parāyaṇaḥ—devoted to recitation."],["Having seen him, one does not meet death and is not sorrowful, no doubt. One reaches the supreme abode where the god Divākara is.","tam—him; dṛṣṭvā—having seen; na—not; aśnute—meets; mṛtyum—death; duḥkhī—sorrowful; na—not; ca—and; na—not; saṃśayaḥ—doubt; prāpnoti—one reaches; ca—and; paramam—the supreme; sthānam—abode; yatra—where; devaḥ—the god; divākaraḥ—Divākara."],["Having placed both hands extended upward, with their backs joined to each other, all the fingers should be bound, well spread, without doubt.","uttānau—extended upward; tu—indeed; karau—hands; kṛtvā—having placed; pṛṣṭha-lagnau—with backs joined; parasparam—to each other; baddhvā—having bound; aṅgulayaḥ—fingers; sarvāḥ—all; su-prakīrṇā—well spread; na—not; saṃśayaḥ—doubt."],["Pressing the roots of the fingers in order with the thumbs, this mudrā named Udayā should be bound at sunrise.","ākramya—pressing; ca—and; aṅgulī-mūlam—the roots of the fingers; aṅguṣṭhābhyām—with the thumbs; yathā-kramam—in order; udayā—Udayā; nāma—named; mudrā—mudrā; eṣā—this; badhnīyāt—one should bind; udaye—at sunrise; raveḥ—of the Sun."],["On the twelfth day one sees the Sun, indeed, without doubt. It is the remover of all sins and the destroyer of all sins.","dvādaśāt—after twelve days; vīkṣate—one sees; sūryam—the Sun; dināt—on the day; saḥ—he; hi—indeed; na—not; saṃśayaḥ—doubt; sarva-pāpa-harā—removing all sins; ca—and; eva—indeed; sarva-pāpa-vināśinī—destroying all sins."],["Without the left [hand] in Udayā, one should place that [finger] in the middle; Madhyamā is renowned. One should contemplate [it] when the Sun is in the middle.","udayā—in Udayā; ca—and; vinā—without; vāmam—the left; madhyataḥ—in the middle; ca—and; eva—indeed; tam—that; kṣipet—one should place; madhyamā—Madhyamā; nāma—named; vikhyātā—renowned; madhya-sūrye—when the Sun is in the middle; tu—but; cintayet—one should contemplate."],["The practitioner, having bound the Madhyamā-mudrā by that procedure, should join both thumbs to the fingers according to rule.","madhyamā—Madhyamā; vidhinā—by the procedure; tena—that; baddhvā—having bound; mudrām—the mudrā; tu—indeed; sādhakaḥ—the practitioner; aṅgulyoḥ—of the fingers; parama-aṅguṣṭhau—the two thumbs; vidhinā—according to rule; tau—those two; ubhau—both; grathet—should join."],["This auspicious mudrā, the mistress of all tantras, is called Astamanī. Having bound the mudrā at sunset, one should begin recitation.","mudrā—the mudrā; sā—she; astamanī—Astamanī; hi—indeed; eṣā—this; sarva-tantra-īśvarī—mistress of all tantras; śubhā—auspicious; sūryasya—of the Sun; astamane—at sunset; mudrā—the mudrā; baddhvā—having bound; japtam—recitation; samārabhet—one should begin."],["The wise one, having bound the mudrā, should recite one thousand or one hundred [times]. Joined with all sins, he becomes radiant after seven days.","sahasram—one thousand; hi—indeed; śatam—one hundred; vā—or; api—even; mudrām—the mudrā; baddhvā—having bound; japet—should recite; budhaḥ—the wise one; sarva-pātaka-saṃyuktaḥ—joined with all sins; saptāhāt—after seven days; anuśobhanam—radiant thereafter."],["The hands are joined to each other, with the thumbs placed upward. Both thumbs are joined above and placed at the crown.","karau—the hands; parasparam—to each other; lagnau—joined; aṅguṣṭhau—the thumbs; ca—and; ūrdhva-saṃsthitau—placed upward; ubhau—both; ca—and; aṅguṣṭhakau—the thumbs; ca—and; ūrdhvau—upward; saṃlagnau—joined; mūrdhni—at the crown; saṃsthitau—placed."],["This is the Mālinī-mudrā, which burns the cage of sins. Applied on the head, it [burns] sins such as Brahmahatyā.","mudrā—the mudrā; nu—indeed; mālinī—Mālinī; ca—and; eva—indeed; nirdahet—would burn; pāpa-pañjaram—the cage of sins; brahma-hatyā-ādi—beginning with Brahmahatyā; yat—which; pāpam—sin; yojitā—applied; sā—that; tu—but; mūrdhani—on the head."],["All the fingers are bent, slightly [curved] in the middle and in front; their thumbs are raised. This mudrā is remembered as Tarjanī.","vidarbhi—bent; aṅgulayaḥ—fingers; sarvāḥ—all; īṣat—slightly; madhye—in the middle; tathā—and; agrataḥ—in front; ūrdhva-sthitau—raised; teṣām—of them; aṅguṣṭhau—the thumbs; mudrā—mudrā; iyam—this; tarjanī—Tarjanī; smṛtā—is remembered."],["The goddess removes all diseases and destroys all enemies. Having bound this greatly meritorious mudrā, one immobilizes all enemies.","sarva-vyādhi-harā—removing all diseases; devī—the goddess; sarva-śatru-vināśinī—destroying all enemies; etām—this; baddhvā—having bound; mahā-puṇyām—greatly meritorious; sarvān—all; stambhayate—immobilizes; ripūn—enemies."],["Having extended both hands, with [the fingers] set together in the middle, one should bend the remaining fingers, then the thumb-tips in order.","ubhau—both; prasārya—having extended; vai—indeed; hastau—hands; madhye—in the middle; sa-ardhena—with half; saṃsthitau—placed together; śeṣān—the remaining ones; āmyā—bending; tataḥ—then; ca—and; eva—indeed; aṅguṣṭha-agram—the tips of the thumbs; tathā—thus; kramāt—in order."],["This is the Gabhastinī-mudrā, the highest heart of Sūrya. Bound at sunrise, this auspicious [mudrā] destroys death.","mudrā—the mudrā; gabhastinī—Gabhastinī; nāma—named; sūryasya—of Sūrya; hṛdayam—the heart; param—the highest; mṛtyum—death; nāśayate—destroys; hi—indeed; eṣā—this; baddhvā—having bound; sūryodaye—at sunrise; śubhā—auspicious."],["At the time of arghya, one should bind it and worship Agni with worship. At the time of recitation, one should also bind the mantras; there is no doubt about this.","arghya-kāle—at the time of arghya; tu—but; badhnīyāt—one should bind; arcayā—by worship; agnim—Agni; prapūjayet—one should worship; japa-kāle—at the time of recitation; ca—and; badhnīyāt—one should bind; mantrāṇām—of the mantras; na—not; atra—here; saṃśayaḥ—doubt."],["It should be done with the right little finger and the index fingers; the index fingers and thumbs are joined to each other. Whoever recites daily is purified in three months.","vidakṣiṇa-kaniṣṭhikayā—with the right little finger; tarjanībhyām—with the index fingers; tathā—likewise; bhavet—it should be; tarjanībhyām—with the index fingers; tathā—likewise; aṅguṣṭhau—the thumbs; saṃlagnau—joined; tu—but; parasparam—to each other; japam—recitation; yaḥ—whoever; kurute—does; nityam—daily; tribhiḥ—with three; māsaiḥ—months; viśudhyati—is purified."],["Having formed a cup with both hands, one should bend both index fingers.","karau—hands; tu—and; saṃpuṭau—cupped together; kṛtvā—having made; tarjanyau—the index fingers; dve—both; ca—and; kuñcayet—one should bend."],["This is Sahasrakiraṇa, mistress of all mudrās. The practitioner should bind it at the head of the mantra at the three junctions of the day; it destroys all sins, like the Sun [dispels] heaps of darkness.","sahasra-kiraṇā—Sahasrakiraṇa; hi—indeed; eṣā—this; sarva-mudrā-īśvarī—mistress of all mudrās; tri-saṃdhyam—at the three daily junctions; etām—this; badhnīyāt—should bind; sādhakaḥ—the practitioner; mantra-mūrdhani—at the head of the mantra; nāśayet—it destroys; sarva-pāpāni—all sins; tamaḥ-rāśim—a heap of darkness; iva—as; aṃśumān—the Sun."],["Having bound the Mudraka-kumbha mudrā, one should then recite the mantra. In one month it destroys kuṣṭha; in three months, without doubt. Thus one worships Sūrya together with the limbs of the mudrā.","mudrā—the mudrā; mudraka-kumbhā—Mudraka-kumbha; iti—thus; baddhvā—having bound; paścāt—afterwards; tu—indeed; mantrayet—one should recite the mantra; māsena—in one month; nāśayet—it destroys; kuṣṭham—kuṣṭha; tribhiḥ—with three; māsaiḥ—months; na—not; saṃśayaḥ—doubt; iti—thus; mudrā-aṅga-sahitam—together with the mudrā-limbs; sūryam—Sūrya; pūjayate—one worships; tu—indeed; yaḥ—whoever."],["By this procedure, O king, Brahmā worships Ravi. Therefore, O king, you too should worship Bhāskara by this procedure.","anena—by this; vidhinā—procedure; rājan—O king; brahmā—Brahmā; pūjayate—worships; ravim—Ravi; tasmāt—therefore; tvam—you; api—also; rājendra—O king; pūjaya—worship; anena—by this; bhāskaram—Bhāskara."],["Then, having obtained the Sun here, he goes to the world of the Sun. Whoever continually worships Ravi by this procedure,","tataḥ—then; sūryam—the Sun; avāpya—having obtained; iha—here; sūrya-lokam—the world of the Sun; saḥ—he; gacchati—goes; anena—by this; vidhinā—procedure; yaḥ—whoever; tu—but; pūjayet—worships; satatam—continually; ravim—Ravi."],["He goes to the supreme abode where the god Divākara is. Thus, O king, having worshipped the Lord of the gods by this procedure,","saḥ—he; yāti—goes; paramam—the supreme; sthānam—abode; yatra—where; devaḥ—the god; divākaraḥ—Divākara; ittham—thus; pūjya—having worshipped; ca—and; deva-īśam—the Lord of the gods; anena—by this; vidhinā—procedure; nṛpa—O king."],["Having fed the Brāhmaṇas according to rule and to one’s ability, one should also partake of marīca on Saptamī, with the mantra.","bhojayitvā—having fed; yathā-śakti—according to ability; brāhmaṇān—the Brāhmaṇas; ca—and; vidhānataḥ—according to rule; saptamyām—on Saptamī; prāśayet—one should partake; vā—or; api—even; marīcam—marīca; mantrataḥ—with the mantra; tathā—likewise."],["Taking one marīca, unblemished, firm, and excellent, one should partake of it with water, O king, by this mantra, as prescribed.","ekam—one; gṛhītvā—having taken; marīcam—marīca; avraṇam—unblemished; ca—and; dṛḍham—firm; param—excellent; sa-jalam—with water; prāśayet—one should partake; rājan—O king; mantreṇa—with the mantra; anena—this; vā—or; smṛtam—prescribed."],["Having worshipped Divākara by the stated procedure, and thus having partaken of marīca, one should then eat with speech restrained.","yathā-uktena—by what was stated; vidhānena—procedure; pūjayitvā—having worshipped; divākaram—Divākara; iti—thus; saṃprāśya—having partaken; marīcam—marīca; tataḥ—then; bhuñjīta—one should eat; vāg-yataḥ—with speech restrained."],["He obtains union with the beloved at that very moment, not otherwise. This is the meritorious Saptamī, which gives union with the beloved.","priya-saṃgamam—union with the beloved; avāpnoti—one obtains; tat-kṣaṇāt—at that moment; eva—indeed; na—not; anyathā—otherwise; iti—thus; iyam—this; saptamī—Saptamī; puṇyā—meritorious; priya-saṃgama-dāyinī—giving union with the beloved."],["Performing it with one [marīca], he obtains the desired [result] in a year; O best of men, he again gains reunion with his sons and others.","kuryāt—one should perform; ekena—with one; kāmān—desires; tu—but; vatsareṇa—in a year; saḥ—he; gacchati—obtains; putra-ādibhiḥ—with sons and others; nara-śreṣṭha—O best of men; punaḥ—again; saṃgamam—union; ṛcchati—he attains."],["Therefore, O mighty-armed one, you yourself should perform the beloved-giving [observance], as Indra observed the Sura-Marīca Saptamī according to rule.","kuru—perform; tasmāt—therefore; mahā-bāho—O mighty-armed one; tvam—you; eva—yourself; priya-dāyinīm—the beloved-giving [observance]; upoṣya—having fasted; indraḥ—Indra; vidhi-vat—according to rule; surā-marīca-saptamīm—the Sura-Marīca Saptamī."],["Indra made union with Śacī according to rule, O hero. The mighty Nala too, having fasted on this, [reunited] with Damayantī.","saṃyogam—union; kṛtavān—made; vīra—O hero; saha—with; śacyā—Śacī; vidhi-vat—according to rule; upoṣya—having fasted; enām—this; nalaḥ—Nala; ca—and; api—also; damayantyā—with Damayantī; mahā-balaḥ—the mighty one."],["Rāma went with Sītā, having fasted on this, O lord of men.","rāmaḥ—Rāma; agāt—went; sītayā—with Sītā; sārdham—together; upoṣya—having fasted; enām—this; nara-adhipa—O lord of men."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:214,verseCount:47,subtitle:"Chapter 214 — The Marīca Vow for the Seventh Lunar Day",colophon:""},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body>
