<style>
:root {
  color-scheme: light;
  --paper: #faf9f6;
  --ink: #282a26;
  --muted: #73766f;
  --rule: #d8d9d2;
  --empty: #f1e1de;
  --empty-ink: #80574f;
  --green: #dce9dd;
  --green-ink: #28593d;
  --parallel: #dce9ed;
  --parallel-ink: #315e69;
  --red: #a14a40;
  --serif: Georgia, 'Times New Roman', serif;
  --sans: Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 13px/1.42 var(--sans); }
a { color: inherit; text-underline-offset: 2px; }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--green-ink); outline-offset: 2px; }
.page { width: min(1160px, calc(100% - 40px)); margin: 0 auto; }
.top {
  min-height: 42px; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; border-bottom: 1px solid var(--ink); font-size: 10px;
  letter-spacing: .1em; text-transform: uppercase;
}
.top a { text-decoration: none; white-space: nowrap; }
.top > a { font-weight: 700; }
.top-links { display: flex; gap: 18px; color: var(--muted); }
header {
  display: flex; align-items: end; justify-content: space-between; gap: 20px;
  padding: 24px 0 15px; border-bottom: 1px solid var(--ink);
}
h1 { margin: 0; font: 400 clamp(34px, 4.2vw, 46px)/1.04 var(--serif); letter-spacing: -.04em; }
.text-link { margin-bottom: 4px; color: var(--muted); font-size: 11px; white-space: nowrap; }
.legend {
  display: flex; flex-wrap: wrap; align-items: center; gap: 7px 18px;
  padding: 9px 0 10px; border-bottom: 1px solid var(--rule);
  color: var(--muted); font-size: 10px;
}
.legend span { white-space: nowrap; }
.swatch { display: inline-block; width: 11px; height: 11px; margin-right: 6px; vertical-align: -2px; background: var(--empty); }
.swatch.quoted { background: var(--green); }
.swatch.parallel { background: var(--parallel); }
.swatch.missing { background: #fff; border-bottom: 3px solid var(--red); }
.grid {
  display: grid; grid-template-columns: repeat(24, minmax(0,1fr)); gap: 2px;
  max-width: 1000px; padding: 11px 0 15px;
}
.tile {
  position: relative; aspect-ratio: 1; min-width: 0; padding: 0;
  border: 1px solid #e1e0d9; border-radius: 2px;
  color: var(--empty-ink); background: var(--empty); cursor: pointer;
  font-size: 11px; line-height: 1; font-variant-numeric: tabular-nums;
}
.tile.quoted { border-color: #c6d9ca; color: var(--green-ink); background: var(--green); font-weight: 600; }
.tile.parallel { border-color: #c9d9dd; color: var(--parallel-ink); background: var(--parallel); font-weight: 600; }
.tile.both { border-color: #d0d6cd; color: var(--ink); background: linear-gradient(135deg,var(--green) 0 49%,var(--parallel) 51% 100%); font-weight: 600; }
.tile:hover, .tile[aria-pressed="true"] { border-color: var(--ink); }
.tile[aria-pressed="true"] { box-shadow: inset 0 0 0 1px var(--ink); }
.tile.gap::after { position: absolute; right: 1px; bottom: 1px; left: 1px; height: 3px; background: var(--red); content: ""; }
.detail {
  max-width: 1000px; margin: 0 0 14px; padding: 9px 12px 10px;
  border: 1px solid var(--rule); border-left: 2px solid var(--ink); background: #fff;
}
.detail[hidden] { display: none; }
.detail-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); }
.detail-head h2 { margin: 0; font: 400 20px/1.15 var(--serif); }
.group { display: grid; grid-template-columns: 118px minmax(0,1fr); gap: 8px; padding-top: 7px; }
.group + .group { margin-top: 6px; border-top: 1px solid #edf0ec; }
.group h3 { margin: 2px 0 0; color: var(--muted); font: 700 9px/1.3 var(--sans); letter-spacing: .08em; text-transform: uppercase; }
.items { margin: 0; padding: 0; list-style: none; }
.items li + li { margin-top: 5px; }
.work { font-size: 12px; font-weight: 600; }
.refs { display: block; margin-top: 1px; color: var(--muted); font-size: 11px; line-height: 1.4; font-variant-numeric: tabular-nums; }
.parallel-line { font-size: 12px; line-height: 1.4; }
.parallel-line strong { font-weight: 600; font-variant-numeric: tabular-nums; }
.parallel-line .arrow { padding: 0 5px; color: var(--muted); }
.note { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.35; }
.missing-line { color: var(--red); font-size: 11px; line-height: 1.4; }
.no-entry { margin: 8px 0 0; color: var(--muted); font-size: 11px; }
footer { padding: 0 0 24px; color: var(--muted); font-size: 10px; }
@media (max-width: 720px) {
  .page { width: calc(100% - 24px); }
  .top { min-height: 38px; font-size: 9px; }

  .group h3 { font-size: 8px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

<script>
(() => {
  "use strict";
  const data = JSON.parse(document.getElementById("map-data").textContent);
  const grid = document.getElementById("grid");
  const detail = document.getElementById("detail");
  let selected = null;

  function addGroup(parent, title, entries, type) {
    if (!entries || !entries.length) return;
    const group = document.createElement("div");
    group.className = "group";
    const heading = document.createElement("h3");
    heading.textContent = title;
    group.appendChild(heading);
    const list = document.createElement("ul");
    list.className = "items";
    entries.forEach(entry => {
      const item = document.createElement("li");
      if (type === "parallel") {
        const line = document.createElement("div");
        line.className = "parallel-line";
        const left = document.createElement("strong");
        left.textContent = entry.left;
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "↔";
        const right = document.createElement("strong");
        right.textContent = entry.right;
        line.append(left, arrow, right);
        item.appendChild(line);
        if (entry.note) {
          const note = document.createElement("span");
          note.className = "note";
          note.textContent = entry.note;
          item.appendChild(note);
        }
      } else if (type === "missing") {
        item.className = "missing-line";
        item.textContent = entry;
      } else if (type === "notes") {
        const note = document.createElement("span");
        note.className = "note";
        note.textContent = entry;
        item.appendChild(note);
      } else {
        const work = document.createElement("div");
        work.className = "work";
        work.textContent = entry.work;
        const refs = document.createElement("span");
        refs.className = "refs";
        refs.textContent = entry.refs;
        item.append(work, refs);
      }
      list.appendChild(item);
    });
    group.appendChild(list);
    parent.appendChild(group);
  }

  function openChapter(chapter, button) {
    if (selected) selected.setAttribute("aria-pressed", "false");
    if (selected === button) {
      selected = null;
      detail.hidden = true;
      detail.replaceChildren();
      return;
    }
    selected = button;
    selected.setAttribute("aria-pressed", "true");
    const record = data[String(chapter)] || {};
    detail.replaceChildren();
    const head = document.createElement("div");
    head.className = "detail-head";
    const title = document.createElement("h2");
    title.textContent = "Mārkaṇḍeya Purāṇa " + chapter;
    head.appendChild(title);
    detail.appendChild(head);
    addGroup(detail, "Quoted in", record.quoted, "quoted");
    addGroup(detail, "Parallel in another Purāṇa", record.parallel, "parallel");
    addGroup(detail, "Cited line not found", record.missing, "missing");
    addGroup(detail, "Note", record.notes, "notes");
    if (!record.quoted && !record.parallel && !record.missing && !record.notes) {
      const empty = document.createElement("p");
      empty.className = "no-entry";
      empty.textContent = "No reference listed for this chapter.";
      detail.appendChild(empty);
    }
    detail.hidden = false;
    detail.scrollIntoView({behavior:"smooth", block:"nearest"});
  }

  for (let chapter = 1; chapter <= 137; chapter += 1) {
    const record = data[String(chapter)] || {};
    const button = document.createElement("button");
    button.type = "button";
    button.className = "tile";
    button.textContent = String(chapter);
    button.setAttribute("aria-pressed", "false");
    const hasQuoted = Boolean(record.quoted && record.quoted.length);
    const hasParallel = Boolean(record.parallel && record.parallel.length);
    if (hasQuoted && hasParallel) button.classList.add("both");
    else if (hasQuoted) button.classList.add("quoted");
    else if (hasParallel) button.classList.add("parallel");
    if (record.missing && record.missing.length) button.classList.add("gap");
    button.setAttribute("aria-label", "Mārkaṇḍeya Purāṇa chapter " + chapter);
    button.addEventListener("click", () => openChapter(chapter, button));
    grid.appendChild(button);
  }
})();
</script>
</body>
</html>
