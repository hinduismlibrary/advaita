<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 197 — Varāṭikā Description."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 197 — Varāṭikā Description — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261015-3" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 197 — Varāṭikā Description</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261015-4"></script><script>const R=[["Further I shall declare the desired results of flowers, incense, and the rest: by each particular gift one obtains its respective fruit.","ataḥ param — further; pravakṣyāmi — I shall declare; puṣpa-dhūpa-ādi-kāmikam — the desired [results] of flowers, incense, and the rest; yena yena dānena — by each particular gift; tat tat phalam — its respective fruit; avāpnuyāt — one obtains."],["Worship with Mālatī flowers brings presence; with karavīras come health and lasting wealth.","mālatī-kusumaiḥ — with Mālatī flowers; pūjā — worship; bhavet — becomes; sānnidhya-kārikā — causing presence; ārogyam — health; karavīraiḥ tu — with karavīras; bhavati — comes; arthaḥ ca — and wealth; śāśvataḥ — lasting."],["Incomparable lordship and abundant fame [come]; with Mallikā flowers one becomes before the Lord.","aiśvaryam atulam — incomparable lordship; ca eva — and indeed; yaśaḥ ca — and fame; vipulam — abundant; tathā — likewise; mallikāyāḥ kusumaiḥ — with Mallikā flowers; bhagavat-sammukhaḥ — before the Lord; bhavet — one becomes."],["With lotuses one obtains good fortune and supreme lordship; with lotus, blue lily, and jasmine come fame, knowledge, and strength.","saubhāgyam — good fortune; puṇḍarīkaiḥ tu — with lotuses; param-aiśvaryam — supreme lordship; āpnuyāt — one obtains; kamala-utpala-kundaiḥ tu — with lotus, blue lily, and jasmine; yaśaḥ — fame; vidyā — knowledge; balam — strength; bhavet — comes."],["With various fine flowers one is quickly freed from disease, and food becomes inexhaustible for one who worships Ravi daily.","nānā-vidhaiḥ su-kusumaiḥ — with various fine flowers; kṣipram — quickly; rogāt — from disease; pramucyate — one is freed; bhavati — becomes; akṣayam annam — inexhaustible food; ca — and; nityam — daily; arcayataḥ — for one worshipping; ravim — Ravi."],["Worship with Mandāra flowers removes all leprosy; with bilva leaves and flowers one obtains great prosperity.","mandāra-kusumaiḥ — with Mandāra flowers; pūjā — worship; sarva-kuṣṭha-nivāriṇī — removing all leprosy; bilvasya patra-kusumaiḥ — with bilva leaves and flowers; mahatīm śriyam — great prosperity; āpnuyāt — one obtains."],["With an arka garland, Arka is always a boon-giving Lord; worshipped with a bakula garland, he gives a beautiful maiden.","arka-srajā — with an arka garland; bhavati — becomes; arkaḥ — Arka; sarvadā — always; vara-daḥ — boon-giving; prabhuḥ — Lord; pradadyāt — he gives; rūpiṇīm kanyām — a beautiful maiden; arcitaḥ — worshipped; bakula-srajā — with a bakula garland."],["Worshipped with kiṃśuka flowers, the god Bhāskara does not afflict; with agastya flowers he grants success and favor.","kiṃśukaiḥ — with kiṃśuka flowers; pūjitaḥ — worshipped; devaḥ — the god; na pīḍayati — does not afflict; bhāskaraḥ — Bhāskara; agastya-kusumaiḥ — with agastya flowers; siddhim — success; sānukūlyam — favor; prayacchati — grants."],["Worshipped with a garland of campaka, he gives a beautiful woman himself; worshipped with a flower garland, one is always without distress.","svayam — himself; rūpavatīm — a beautiful woman; dadyāt — he gives; pūjitaḥ — worshipped; campaka-srajā — with a campaka garland; nirudvegaḥ — free from distress; bhavet — one becomes; nityam — always; pūjitaḥ — worshipped; puṣpa-mālayā — with a flower garland."],["Whoever worships Divākara with aśoka flowers should avoid the flower of āmrātaka, which is seen as a discarded offering; because it is not fresh outside, therefore he should avoid it.","aśoka-kusumaiḥ — with aśoka flowers; devam — the god; arcayet — should worship; yaḥ — whoever; divākaram — Divākara; āmrātakasya kusumam — the flower of āmrātaka; nirmālyam iva — like a discarded offering; dṛśyate — is seen; apratyagram — not fresh; bahiḥ — outside; yasmāt — because; tasmāt — therefore; tat — that; parivarjayet — one should avoid."],["By nine [there is] enduring fame; by ten, excellent happiness.","navabhiḥ tu — by nine; acalām — enduring; kīrtim — fame; daśabhiḥ — by ten; sukham uttamam — excellent happiness."],["By eleven one obtains enjoyments here, there is no doubt; by twelve one obtains an enduring kingdom, called Dvādaśa.","bhogān — enjoyments; ekādaśena — by eleven; iha — here; prāpnuyāt — one obtains; na atra saṃśayaḥ — there is no doubt; dvādaśena — by twelve; acalam rājyam — an enduring kingdom; dvādaśa-ākhyam — called Dvādaśa; avāpnuyāt — one obtains."],["First one should worship with devotion and always bow to the form of Earth; second, [say] ‘Bhuvaḥ namaḥ’; third, a man should bow to ‘Svaḥ’.","prathamam — first; pūjayet — one should worship; bhaktyā — with devotion; bhū-rūpam — the form of Earth; praṇamet — should bow; sadā — always; bhuvaḥ namaḥ — homage to Bhuvaḥ; dvitīyam — second; ca — and; tṛtīyam — third; svaḥ — Svaḥ; namet — should bow; naraḥ — a man."],["‘Mahaḥ, homage’ fourth; ‘Janaḥ, homage’ fifth; likewise ‘Tapaḥ, homage’ sixth; ‘Satya, homage’ seventh.","mahaḥ namaḥ — homage to Mahaḥ; caturtham — fourth; tu — indeed; pañcamam — fifth; tu — indeed; janaḥ namaḥ — homage to Janaḥ; tapaḥ namaḥ — homage to Tapaḥ; tathā — likewise; ṣaṣṭham — sixth; namaḥ satyam — homage to Satya; tu — indeed; saptamam — seventh."],["The eighth is ‘Bhūr Bhuvaḥ’; the ninth, O best of birds; the tenth, ‘Ṣaḍ’; then, O hero, homage to Ulkā.","aṣṭamam — eighth; bhūḥ-bhuvaḥ — Bhūr Bhuvaḥ; iti — thus; navamam — ninth; khaga-sattama — O best of birds; daśamam — tenth; ṣaṭ — Ṣaḍ; ataḥ — then; vīra — O hero; namaḥ — homage; ulkāya — to Ulkā."],["The twelfth is ‘Khaṣolka’; with ‘Oṃ namaḥ’ one should worship, O bird. Thus, making a maṇḍala, one obtains the fruit in due order.","dvādaśam — twelfth; tu — indeed; khaṣolkā — Khaṣolkā; iti — thus; oṃ namaḥ — Oṃ homage; pūjayet — one should worship; khaga — O bird; evam — thus; maṇḍala-kārī — making a maṇḍala; tu — indeed; kramāt — in due order; evam — thus; phalam — fruit; labhet — one obtains."],["By giving a ghee lamp, a man becomes sighted; by a lamp of pungent oil, he becomes a refuge of enemies; by Madhūka oil, he obtains supreme good fortune.","ghṛta-dīpa-pradānena — by giving a ghee lamp; cakṣuṣmān — sighted; jāyate — becomes; naraḥ — a man; kaṭu-tailasya dīpena — by a lamp of pungent oil; śatrūṇām — of enemies; saṃśrayaḥ — a refuge; bhavet — becomes; madhūkānām tailena — by Madhūka oil; saubhāgyam paramam — supreme good fortune; labhet — one obtains."],["Having worshipped the god according to rule with flowers, incense, and the rest, a man should then prepare an offering according to his ability.","sampūjya — having worshipped; vidhi-vat — according to rule; devam — the god; puṣpa-dhūpa-ādibhiḥ — with flowers, incense, and the rest; naraḥ — a man; yathā-śaktyā — according to ability; tataḥ paścāt — then afterwards; naivedyam — an offering; tu — indeed; prakalpayet — should prepare."],["Jāti is foremost among flowers, sandalwood among incenses; saffron is best among scents, and modakas among offerings.","puṣpāṇām — among flowers; pravarā — foremost; jātī — jāti; dhūpānām — among incenses; ca eva — and indeed; candanam — sandalwood; gandhānām — among scents; kuṅkumam — saffron; śreṣṭham — best; modakāḥ ca — and modakas; nivedane — among offerings."],["The Lord of gods is pleased with these and attains presence; he gives excellent desired things to the giver and likewise a heavenly course.","etaiḥ — with these; tuṣyati — is pleased; deva-īśaḥ — the Lord of gods; sānnidhyam — presence; ca — and; adhigacchati — attains; dadāti — gives; pravarān iṣṭān — excellent desired things; dātuḥ — to the giver; ca — and; svarga-gatim — heavenly course; tathā — likewise."],["Thus having worshipped according to rule and made circumambulation, having bowed his head to Bhāskara, remover of darkness, he mounts a fine chariot and goes to the world of Bhānu.","evam — thus; sampūjya — having worshipped; vidhi-vat — according to rule; kṛtvā — having made; pradakṣiṇām — circumambulation; praṇamya — having bowed; śirasā — with the head; devam — the god; bhāskaram — Bhāskara; timira-apaham — remover of darkness; āruhya — mounting; su-vimānam — a fine chariot; saḥ — he; yāti — goes; bhānoḥ sa-lokatām — to the world of Bhānu."],["Again having worshipped the Lord of gods, one should perform japa as desired and offer into the fire with the rite seen in the rule; thus each of the seven Saptamīs should always be performed.","punaḥ — again; sampūjya — having worshipped; deva-īśam — the Lord of gods; japam kuryāt — one should perform japa; yathā-iṣṭakam — as desired; hutāśane — into the fire; ca — and; juhuyāt — one should offer; vidhi-dṛṣṭena karmaṇā — with the rite seen in the rule; evam — thus; eka-ekaśaḥ — each one; kāryāḥ — should be performed; saptamyaḥ sapta — the seven Saptamīs; sadā — always."],["That Saptamī which is performed after drinking a flow of water is to be known, O hero, always as the happiness-giving Udaka Saptamī.","udaka-prasṛtim — a flow of water; pītvā — having drunk; kriyate — is performed; yā — which; tu — indeed; saptamī — Saptamī; sā — that; jñeyā — is to be known; sukhadā — happiness-giving; vīra — O hero; sadā — always; udaka-saptamī — Udaka Saptamī."],["Whatever Saptamī has not been told, I shall always tell you: whatever is obtained in order by a varāṭikā, one should eat it.","yā kācit — whatever; saptamī — Saptamī; na uktā — not told; tām — that; te — to you; vakṣyāmi — I shall tell; sarvadā — always; varāṭikā — by a varāṭikā; krameṇa — in order; āptam — obtained; yat kiñcit — whatever; prati-bhakṣayet — one should eat."],["Whatever is obtained for the price given with this, that one should eat; whether inedible or edible, no consideration is to be made here.","anena — with this; deya-mūlyena — for the price given; yat labdham — whatever is obtained; tat — that; prabhakṣayet — one should eat; abhakṣyam — inedible; ca api — and even; bhakṣyam vā — or edible; na atra — not here; kāryā — to be made; vicāraṇā — consideration."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:197,verseCount:25,subtitle:"Chapter 197 — Varāṭikā Description",colophon:""},T);</script></body>
