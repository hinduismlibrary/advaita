star-shaped vimānas; whoever makes a salutation obtains that very fruit.","tārā-rūpa-vimānānām — of star-shaped vimānas; imāḥ santi — these are; ca koṭayaḥ — millions; yaḥ kuryāt — whoever makes; tu namaskāram — a salutation; tasya eva — for him indeed; ca phalam bhavet — the fruit comes to be."],["Thus the great destinations of those practising solar dharma have been declared; therefore solar dharma should always be practised by one desiring happiness.","iti — thus; etāḥ gatayaḥ — these destinations; proktāḥ — have been declared; mahatyaḥ — great; saura-dharmiṇām — of those practising solar dharma; tasmāt — therefore; sauraḥ dharmaḥ — solar dharma; sadā — always; kartavyaḥ — should be practised; sukham icchatā — by one desiring happiness."],["Now the accumulated gross sins, causes of hell, are stated briefly through the means of mind, speech, and body.","idānīm — now; pāpa-nicayāḥ — accumulated sins; sthūlāḥ — gross; naraka-hetavaḥ — causes of hell; te — they; samāsena — briefly; kathyante — are stated; manaḥ-vāk-kāya-sādhanaiḥ — by means of mind, speech, and body."],["Placing [something] on cow-paths, in forests, by fires, in towns, and in villages: these sins here are equal to drinking liquor.","gavām mārge — on cow-paths; vane — in forests; ca — and; agneḥ — by fires; pure — in towns; grāme — in villages; samarpanam — placing/depositing; iti — thus; etāni pāpāni — these sins; iha — here; surā-pāna-samāni — equal to drinking liquor; ca — and."],["Stealing everything in a forest belonging to men, women, elephants, and horses, and the herbs growing near cows and land, O Khecara…","vane — in a forest; sarvasya haraṇam — stealing everything; nara-strī-gaja-vājinām — of men, women, elephants, and horses; go-bhū-samīpa-jātānām — growing near cows and land; oṣadhīnām ca — and of herbs; khacara — O Khecara."],["…the taking by hand of sandalwood, aguru, camphor, musk, and silk garments is remembered as equal to stealing gold.","candana-aguru-karpūra-kastūrī-paṭṭa-vāsasām — of sandalwood, aguru, camphor, musk, and silk garments; hasta-nyāsa-apaharaṇam — taking by hand/appropriation; rukma-steya-samam — equal to stealing gold; smṛtam — is remembered."],["Wrongful taking of maidens fit for marriage, and going to sons, friends, wives, and sisters…","kanyānām — of maidens; vara-yogyānām — fit for marriage; ākarṣaṇam — taking/enticing; asaṅgataḥ — improperly; putra-mitra-kalatreṣu — to sons, friends, and wives; gamanam — going; bhaginīṣu ca — and to sisters."],["…violation of a maiden, intercourse with an antyaja woman, and intercourse with a woman of one’s own varṇa are remembered as equal to the guru’s bed.","kumārī-sāhasam — violation of a maiden; ghoram — terrible; antyaja-strī-niṣevaṇam — intercourse with an antyaja woman; sa-varṇāyāḥ ca gamanam — and intercourse with a woman of one’s own varṇa; guru-talpa-samam — equal to the guru’s bed; smṛtam — is remembered."],["Sins that are equal to great transgressions have been stated; and we now speak of the upapātaka.","mahā-pātaka-tulyāni — equal to great transgressions; pāpāni — sins; uktāni — have been stated; yāni tu — whatever; tāni — those; pātaka-saṃjñāni — called transgressions; brūmahe — we speak; ca — and; upapātakam — of the secondary transgression."],["A dvija who, having promised something to a dvija, does not give it, and abandonment of good wives, virtuous relatives, and ascetics…","dvijāya — to a dvija; artham — a thing; pariśrutya — having promised; na prayacchati — does not give; yaḥ dvija — a dvija who; sad-bhāryāṇām — of good wives; ca — and; saṃtyāgaḥ — abandonment; sādhu-bandhu-tapasvinām — of virtuous relatives and ascetics."],["…taking cows, land, gold, and garments by force, and inflicting great harm on those whose minds are offered to the Lord…","go-bhū-hiraṇya-vastrāṇām — of cows, land, gold, and garments; apahāraḥ — taking away; prayatnataḥ — deliberately/by effort; īśvara-arpita-buddhīnām — of those whose minds are offered to the Lord; pīḍanam — harming; su-mahat kṛtam — is a very great wrong."],["Whoever causes even slight suffering in an āśrama and to its dependants, cattle, grain, and wealth…","yaḥ — whoever; pīḍām — suffering; āśrama-sthāne — in an āśrama place; ācaret — causes; alpikām api — even slight; tat-bhṛtya — its dependants; upari-bhūtasya — those dwelling above/there; paśu-dhānya-dhanasya ca — and its cattle, grain, and wealth."],["…stealing wells, grain, and cattle; officiating for those not fit for sacrifice; selling sacrificial gardens, tanks, wives, and children…","kūpa-dhānya-paśu-steyam — stealing wells, grain, and cattle; ayājyānām yājanam — officiating for those not fit for sacrifice; yajña-ārāma-taḍāgānām — of sacrificial gardens and tanks; dāra-apatyasya vikrayaḥ — selling wives and children."],["…and sinful people who take women’s wealth during pilgrimages, fasts, vows, and acts of japa…","tīrtha-yātrā-upavāsānām — during pilgrimages and fasts; vrate ca — and in a vow; japa-karmaṇi — in the act of japa; strī-dhanāni — women’s wealth; upakarṣanti — take away; ye janāḥ — those people; pāpa-karmāṇaḥ — sinful in action."],["…failure to protect women, intercourse with a woman who drinks liquor, not giving to sages, and pursuing increase of grain…","a-rakṣaṇam — failure to protect; ca nārīṇām — women; madya-pa-strī-niṣevaṇam — intercourse with a woman who drinks liquor; ṛṣīṇām apradānam — not giving to sages; ca — and; dhānya-vṛddhi-upasevanam — pursuing the increase of grain."],["…slander of gods, fire, good men and women, cows, and Brāhmaṇas, and even regional rulers, whether directly or indirectly…","deva-agni-sādhu-sādhvīnām — of gods, fire, good men and women; nindā — slander; go-brāhmaṇasya ca — and of cows and Brāhmaṇas; pratyakṣam vā — whether directly; parokṣam vā — or indirectly; rāja-māṇḍalikān api — and even regional rulers."],["…those who let the ancestors and gods lapse, abandon their own duties, are ill-conducted, atheists, sinners, and speakers who declare good and evil empty…","utsanna-pitṛ-devāḥ — those whose ancestors and gods have lapsed; ca — and; sva-karmatyāginaḥ — abandoners of their own duties; ye — who; duḥśīlāḥ — ill-conducted; nāstikāḥ — atheists; pāpāḥ — sinners; sat-asat-śūnya-vādinaḥ — speakers who declare good and evil empty."],["…and whoever, when desire is indulged, has intercourse in an improper womb or animal womb, or with a menstruating woman or in an improper opening…","evam kāme pravṛtte tu — when desire is thus indulged; viyonau — in an improper womb; paśu-yoniṣu — among animal kinds; rajasvalāsu — with menstruating women; ayoniṣu tu — or in improper openings; maithunam — intercourse; yaḥ samācaret — whoever performs."],["…those who sever affection among wife, sons, and friends, speak what is disliked by people, and divide people’s intentions…","strī-putra-mitra-samprīte — affection among wife, sons, and friends; rārāma-ucchhedakāḥ ca — and those who cut it off; ye — who; janasya — to people; apriya-vaktāraḥ — speak what is disliked; jana-abhiprāya-bhedinaḥ — divide people’s intentions."],["…one who breaks the embankments of tanks, causeways, and water-channels, and whoever creates a division in the row of those seated in one line.","bhet­tā — breaker; taḍāga-vaprāṇām — of the embankments of tanks; saṃkramāṇām — of causeways; rasasya ca — and of water-channels; eka-paṅkti-sthitānām — of those seated in one row; paṅkti-bhedam karoti yaḥ — whoever creates a division in the row."],["By these sins people are remembered as upapātakins.","iti — thus; etaiḥ pāpaiḥ — by these sins; tu — indeed; narāḥ — people; upapātakinaḥ — upapātakins; smṛtāḥ — are remembered."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:190,verseCount:21,subtitle:"Chapter 190 — Sins in the Sun–Anūru Dialogue",colophon:""},T);</script></body></html>
