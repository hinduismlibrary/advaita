R=[["The Seven-Horsed Sun said: There are crores of star-shaped celestial cars. Whoever bows obtains that very reward.","tārā-rūpa-vimānānām — of star-shaped vimānas; imāḥ santi — these are; ca koṭayaḥ — millions; yaḥ kuryāt — whoever makes; tu namaskāram — a salutation; tasya eva — for him indeed; ca phalam bhavet — the fruit comes to be.","सप्ताश्वतिलक उवाच ।। तारारूपविमानानामिमाः संति च कोटयः ।। यः कुर्यात्तु नमस्कारं तस्यैव च फलं भवेत् ।। १ ।।"],["Thus the great destinations of those who practise worship of the Sun have been declared. Therefore one who seeks happiness should always practise that worship.","iti — thus; etāḥ gatayaḥ — these destinations; proktāḥ — have been declared; mahatyaḥ — great; saura-dharmiṇām — of those practising solar dharma; tasmāt — therefore; sauraḥ dharmaḥ — solar dharma; sadā — always; kartavyaḥ — should be practised; sukham icchatā — by one desiring happiness.","इत्येता गतयः प्रोक्ता महत्यः सौरधर्मिणाम् ।। तस्मात्सौरः सदा धर्मः कर्तव्यः सुखमिच्छता ।। २ ।।"],["Now the accumulated grave sins that lead to hell are stated briefly as acts of mind, speech, and body.","idānīm — now; pāpa-nicayāḥ — accumulated sins; sthūlāḥ — gross; naraka-hetavaḥ — causes of hell; te — they; samāsena — briefly; kathyante — are stated; manaḥ-vāk-kāya-sādhanaiḥ — by means of mind, speech, and body.","इदानीं पापनिचयाः स्थूला नरकहेतवः ।। ते समासेन कथ्यन्ते मनोवाक्कायसाधनैः ।। ३ ।।"],["Depositing filth on cow paths, in forests, by fires, in towns, and in villages is equal to drinking liquor.","gavām mārge — on cow-paths; vane — in forests; ca — and; agneḥ — by fires; pure — in towns; grāme — in villages; samarpanam — placing/depositing; iti — thus; etāni pāpāni — these sins; iha — here; surā-pāna-samāni — equal to drinking liquor; ca — and.","गवां मार्गे वने चाग्नेः पुरे ग्रामे समर्पणम् ।। इत्येतानीह पापानि सुरापानसमानि च ।। ४ ।।"],["Stealing in the forest all that belongs to men, women, elephants, and horses, and herbs growing near cattle and land, O Sky-Walker.","vane — in a forest; sarvasya haraṇam — stealing everything; nara-strī-gaja-vājinām — of men, women, elephants, and horses; go-bhū-samīpa-jātānām — growing near cows and land; oṣadhīnām ca — and of herbs; khacara — O Khecara.","वने सर्वस्य हरणं नरस्त्रीगजवाजिनाम् ।। गोभूसमीपजातानामोषधीनां च खेचर ।। ५ ।।"],["Taking sandalwood, agarwood, camphor, musk, and silk garments is considered equal to stealing gold.","candana-aguru-karpūra-kastūrī-paṭṭa-vāsasām — of sandalwood, aguru, camphor, musk, and silk garments; hasta-nyāsa-apaharaṇam — taking by hand/appropriation; rukma-steya-samam — equal to stealing gold; smṛtam — is remembered.","चन्दनागुरुकर्पूरकस्तूरीपट्टवाससाम् ।। हस्तन्यासापहरणं रुक्मस्तेयसमं स्मृतम् ।। ६ ।।"],["The improper taking of marriageable maidens; sexual relations with sons, friends, wives, and sisters.","kanyānām — of maidens; vara-yogyānām — fit for marriage; ākarṣaṇam — taking/enticing; asaṅgataḥ — improperly; putra-mitra-kalatreṣu — to sons, friends, and wives; gamanam — going; bhaginīṣu ca — and to sisters.","कन्यानां वरयोग्यानामाकर्षणमसंगतः ।। पुत्रमित्रकलत्रेषु गमनं भगिनीषु च ।। ७ ।।"],["Violently violating a maiden, having relations with an outcaste woman, and having relations with a woman of one’s own varṇa are considered equal to intercourse with one’s teacher’s wife.","kumārī-sāhasam — violation of a maiden; ghoram — terrible; antyaja-strī-niṣevaṇam — intercourse with an antyaja woman; sa-varṇāyāḥ ca gamanam — and intercourse with a woman of one’s own varṇa; guru-talpa-samam — equal to the guru’s bed; smṛtam — is remembered.","कुमारीसाहसं घोरमंत्यजस्त्रीनिषेवणम् ।। सवर्णायाश्च गमनं गुरुतल्पसमं स्मृतम् ।। ८ ।।"],["Those sins stated to be equal to the great transgressions are called transgressions; now we speak of lesser transgressions.","mahā-pātaka-tulyāni — equal to great transgressions; pāpāni — sins; uktāni — have been stated; yāni tu — whatever; tāni — those; pātaka-saṃjñāni — called transgressions; brūmahe — we speak; ca — and; upapātakam — of the secondary transgression.","महापातकतुल्यानि पापान्युक्तानि यानि तु ।। तानि पातकसंज्ञानि ब्रूमहे चोपपातकम् ।। ९ ।।"],["A twice-born man’s failure to give what he has promised to another twice-born man; abandoning good wives, virtuous kin, and ascetics.","dvijāya — to a dvija; artham — a thing; pariśrutya — having promised; na prayacchati — does not give; yaḥ dvija — a dvija who; sad-bhāryāṇām — of good wives; ca — and; saṃtyāgaḥ — abandonment; sādhu-bandhu-tapasvinām — of virtuous relatives and ascetics.","द्विजायार्थं परिश्रुत्य न प्रयच्छति यो द्विज ।। सद्भार्याणां च संत्यागः साधुबन्धुतपस्विनाम् ।। १० ।।"],["The deliberate seizure of cows, land, gold, and clothing, and the grievous harming of those who have devoted their minds to God.","go-bhū-hiraṇya-vastrāṇām — of cows, land, gold, and garments; apahāraḥ — taking away; prayatnataḥ — deliberately/by effort; īśvara-arpita-buddhīnām — of those whose minds are offered to the Lord; pīḍanam — harming; su-mahat kṛtam — is a very great wrong.","गोभू हिरण्यवस्त्राणामपहारः प्रयत्नतः ।। ईश्वरार्पितबुद्धीनां पीडनं सुमहत्कृतम् ।। ११ ।।"],["Whoever causes even slight suffering at a hermitage to those who serve there, and to its cattle, grain, and wealth.","yaḥ — whoever; pīḍām — suffering; āśrama-sthāne — in an āśrama place; ācaret — causes; alpikām api — even slight; tat-bhṛtya — its dependants; upari-bhūtasya — those dwelling above/there; paśu-dhānya-dhanasya ca — and its cattle, grain, and wealth.","यः पीडामाश्रमस्थान आचरेदल्पिकामपि ।। तद्भूत्युपरिभूतस्य पशुधान्यधनस्य च ।। १२ ।।"],["Stealing wells, grain, and cattle; officiating for those unfit to offer sacrifice; selling sacrificial gardens, tanks, wives, and children.","kūpa-dhānya-paśu-steyam — stealing wells, grain, and cattle; ayājyānām yājanam — officiating for those not fit for sacrifice; yajña-ārāma-taḍāgānām — of sacrificial gardens and tanks; dāra-apatyasya vikrayaḥ — selling wives and children.","कूपधान्यपशुस्तेयमयाज्यानां च याजनम् ।। यज्ञारामतडागानां दारापत्यस्य विक्रयः ।। १३ ।।"],["Those who seize women’s wealth during pilgrimages, fasts, vows, and sacred recitation act sinfully.","tīrtha-yātrā-upavāsānām — during pilgrimages and fasts; vrate ca — and in a vow; japa-karmaṇi — in the act of japa; strī-dhanāni — women’s wealth; upakarṣanti — take away; ye janāḥ — those people; pāpa-karmāṇaḥ — sinful in action.","तीर्थयात्रोपवासानां व्रते च जपकर्मणि ।। स्त्रीधनान्युपकर्षंति ये जनाः पापकर्मणा ।। १४ ।।"],["Failure to protect women; sexual relations with women who drink liquor; giving nothing to sages; and pursuing an increase in grain.","a-rakṣaṇam — failure to protect; ca nārīṇām — women; madya-pa-strī-niṣevaṇam — intercourse with a woman who drinks liquor; ṛṣīṇām apradānam — not giving to sages; ca — and; dhānya-vṛddhi-upasevanam — pursuing the increase of grain.","अरक्षणं च नारीणां मद्यपस्त्रीनिषेवणम् ।। ऋषीणामप्रदानं च धान्यवृद्ध्युपसेवनम् ।। १५ ।।"],["Slander—openly or secretly—of gods, fire, good men and women, cows, Brahmins, and even regional rulers.","deva-agni-sādhu-sādhvīnām — of gods, fire, good men and women; nindā — slander; go-brāhmaṇasya ca — and of cows and Brāhmaṇas; pratyakṣam vā — whether directly; parokṣam vā — or indirectly; rāja-māṇḍalikān api — and even regional rulers.","देवाग्निसाधुसाध्वीनां निन्दा गोब्राह्मणस्य च ।। प्रत्यक्षं वा परोक्षं वा राजमाण्डलिकानपि ।। १६ ।।"],["Those who neglect their ancestors and gods, abandon their own duties, behave badly, are atheists and sinners, and declare good and evil to be empty.","utsanna-pitṛ-devāḥ — those whose ancestors and gods have lapsed; ca — and; sva-karmatyāginaḥ — abandoners of their own duties; ye — who; duḥśīlāḥ — ill-conducted; nāstikāḥ — atheists; pāpāḥ — sinners; sat-asat-śūnya-vādinaḥ — speakers who declare good and evil empty.","उत्सन्नपितृदेवाश्च स्वकर्मत्यागिनश्च ये ।। दुःशीला नास्तिकाः पापाः सदसच्छून्यवादिनः ।। १७ ।।"],["When desire arises, whoever has intercourse in an improper place, with animals, with menstruating women, or through improper openings.","evam kāme pravṛtte tu — when desire is thus indulged; viyonau — in an improper womb; paśu-yoniṣu — among animal kinds; rajasvalāsu — with menstruating women; ayoniṣu tu — or in improper openings; maithunam — intercourse; yaḥ samācaret — whoever performs.","एवं कामे प्रवृत्ते तु वियोनौ पशुयोनिषु ।। रजस्वलास्वयोनौ तु मैथुनं यः समाचरेत् ।। १८ ।।"],["Those who sever affection among wives, sons, and friends, speak words displeasing to people, and divide people’s views.","strī-putra-mitra-samprīte — affection among wife, sons, and friends; rārāma-ucchhedakāḥ ca — and those who cut it off; ye — who; janasya — to people; apriya-vaktāraḥ — speak what is disliked; jana-abhiprāya-bhedinaḥ — divide people’s intentions.","स्त्रीपुत्रमित्रसंप्रीते रारामोच्छेदकाश्च ये ।। जनस्याप्रियवक्तारो जनाभिप्रायभेदिनः ।। १९ ।।"],["Whoever breaks the embankments of tanks, the causeways, and water channels, and whoever disrupts a row of people seated together.","bhet­tā — breaker; taḍāga-vaprāṇām — of the embankments of tanks; saṃkramāṇām — of causeways; rasasya ca — and of water-channels; eka-paṅkti-sthitānām — of those seated in one row; paṅkti-bhedam karoti yaḥ — whoever creates a division in the row.","भेत्ता तडागवप्राणां संक्रमाणां रसस्य च ।। एकपंक्तिस्थितानां च पंक्तिभेदं करोति यः ।। २० ।।"],["Thus, on account of these sins, men are considered guilty of lesser transgressions.","iti — thus; etaiḥ pāpaiḥ — by these sins; tu — indeed; narāḥ — people; upapātakinaḥ — upapātakins; smṛtāḥ — are remembered.","इत्येतैस्तु नराः पापैरुपपातकिनः स्मृताः ।। २१ ।।"]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1],sa:r[2]}]));renderBhavishyaLiveChapter({chapter:190,verseCount:21,preferEmbeddedSanskrit:true,subtitle:"Chapter 190 — The Sun–Anūru Dialogue on Solar Worship",colophon:""},T);</script></body></html>
