<script>
(function () {
  var target = new URL("/advaita/books/adi-shankaracharya/book-chapter.html", window.location.origin);
  var work = "svsss";
  var legacy = new URLSearchParams(window.location.search);
  target.searchParams.set("work", work);
  target.searchParams.set("full", "1");
  if (legacy.has("unit")) target.searchParams.set("unit", legacy.get("unit"));
  if (window.location.hash) target.hash = window.location.hash;
  else {
    var section = legacy.get("section") || legacy.get("chapter");
    if (section && /^\d+$/.test(section)) target.hash = "section-" + work + "-" + section;
    else if (legacy.has("verse")) target.hash = "verse-" + legacy.get("verse");
  }
  window.location.replace(target.href);
}());
</script>
