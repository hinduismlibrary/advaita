<body class="post-page gita-page shankara-reader-page">
<header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="site-nav" aria-expanded="false"><span></span><span></span><span></span></button><nav class="site-nav" id="site-nav" aria-label="Primary navigation"><a href="/advaita/">Home</a><a href="/advaita/books/adi-shankaracharya/">Advaita texts</a></nav></div></header>
<main class="site-main"><article class="article-shell"><div class="article-body">

<header class="gita-hero">
<p class="eyebrow">Advaita Treatises</p>
<h1 id="work-title">Loading text…</h1>
<p class="shankara-author" id="work-author"></p>
<p class="shankara-chapter-title" id="chapter-title"></p>
<p class="shankara-reader-links"><a id="contents-link">All chapters</a><a id="full-text-link">Full text</a></p>

</header>

</div>

<script src="/advaita/assets/js/shankara-reader.js?v=reader-gloss-20261027b"></script>
<script>
(function(){
"use strict";
var allowed=new Set(["aparokshanubhuti","vedantasara","svsss","mandukya-karika","brahma-siddhi","panchadasi","vivekachudamani","upadesha-sahasri","naishkarmya-siddhi","advaita-makaranda","atma-bodha","atmavidya-vilasa","brahmajnanavali-mala","drg-drsya-viveka","tattvabodha","bhaja-govindam"]);
var params=new URLSearchParams(window.location.search);
var work=params.get("work")||"";
var requestedUnit=params.get("unit")||"";
var root=document.getElementById("chapter-reader");
var titleNode=document.getElementById("work-title");
var authorNode=document.getElementById("work-author");
var chapterTitle=document.getElementById("chapter-title");
var contentNode=document.getElementById("chapter-content");
var listNode=document.getElementById("chapter-list");
var coverageNode=document.getElementById("word-coverage");
var contentsLink=document.getElementById("contents-link");
var fullTextLink=document.getElementById("full-text-link");
var rootUrl=new URL("/advaita/books/adi-shankaracharya/",window.location.origin);
function chapterUrl(id){
 var url=new URL("book-chapter.html",rootUrl);
 url.searchParams.set("work",work);
 url.searchParams.set("unit",id);
 return url.href;
}
function setError(message){
 contentNode.replaceChildren();
 var p=document.createElement("p");
 p.className="shankara-reader-error";
 p.setAttribute("role","alert");
 p.textContent=message+" ";
 var a=document.createElement("a");
 a.href=contentsLink.href;
 a.textContent="Return to the contents";
 p.append(a);
 contentNode.append(p);
}
function decodeHash(value){try{return decodeURIComponent(value)}catch(e){return value}}
function topBlock(node,column){
 var current=node;
 while(current&&current.parentElement!==column)current=current.parentElement;
 return current&&current.parentElement===column?current:null;
}
function makeGloss(details,words){
 details.className="gita-details shankara-word-gloss";
 details.replaceChildren();
 var summary=document.createElement("summary");
 summary.textContent="Word for Word";
 var reveal=document.createElement("div");
 reveal.className="gita-reveal";
 var list=document.createElement("div");
 list.className="gita-word-list";
 words.forEach(function(word){
  if(!word||!word.sa||!word.en)return;
  var row=document.createElement("div");
  row.className="gita-word-row";
  var source=document.createElement("span");
  source.className="gita-word-source";
  var deva=document.createElement("span");
  deva.className="gita-word-dev";
  deva.lang="sa-Deva";
  deva.textContent=String(word.sa).trim();
  source.append(deva);
  var gloss=document.createElement("span");
  gloss.className="gita-word-gloss";
  gloss.textContent=String(word.en).trim();
  row.append(source,gloss);
  list.append(row);
 });
 reveal.append(list);
 details.append(summary,reveal);
}
if(!allowed.has(work)){
 titleNode.textContent="Text not found";
 contentsLink.href=rootUrl.href;
 fullTextLink.href=rootUrl.href;
 setError("Choose a longer text from the Advaita texts page.");
 return;
}
root.dataset.work=work;
var readerUrl=new URL(work+"/",rootUrl);
var dataUrl=new URL("/advaita/assets/data/shankara/"+encodeURIComponent(work)+".json",window.location.origin);
dataUrl.searchParams.set("v","reader-gloss-20261027b");
var contentsUrl=new URL("book-contents.html",rootUrl);
contentsUrl.searchParams.set("work",work);
contentsLink.href=contentsUrl.href;
fullTextLink.href=readerUrl.href;
function unitChapter(unit){
 if(unit.chapter!==undefined&&unit.chapter!==null)return String(unit.chapter);
 var match=String(unit.id||"").match(/^(?:panchadasi|svsss)-(\d+)-/);
 return match?match[1]:"";
}
function chapterItems(data){
 var units=Array.isArray(data&&data.units)?data.units:[];
 var sections=Array.isArray(data&&data.sections)?data.sections:[];
 if(sections.length){
  var explicit=sections.map(function(section){
   var target=units.find(function(unit){return unit.sectionTitle&&unit.sectionTitle===section.title;});
   if(!target&&section.id!==undefined)target=units.find(function(unit){return unitChapter(unit)===String(section.id);});
   if(!target&&section.startVerse!==undefined){
    target=units.find(function(unit){
     var numbers=Array.isArray(unit.sourceNumbers)?unit.sourceNumbers:[unit.number];
     return numbers.some(function(number){var value=Number(String(number).split(".")[0]);return Number.isFinite(value)&&value>=Number(section.startVerse)&&value<=Number(section.endVerse||section.startVerse);});
    });
   }
   var index=target?units.indexOf(target):-1;
   return index>=0?{label:section.title,id:target.id,index:index}:null;
  }).filter(Boolean);
  if(explicit.length)return explicit;
 }
 var panchadasiTitles={1:"Tattva-viveka",2:"Pañca-mahā-bhūta-viveka",3:"Pañca-kośa-viveka",4:"Dvaita-viveka",5:"Mahā-vākya",6:"Citra-dīpa",7:"Tṛpti-dīpa",8:"Kūṭastha-dīpa",9:"Dhyāna-dīpa",10:"Nāṭa-dīpa",11:"Brahmānanda",12:"Ātmānanda",13:"Advaitānanda",14:"Vidyānanda",15:"Viṣayānanda"};
 var svsssTitles={1:"The Topic of this Study and the Successful Student",2:"Identifying Only with Ultimate Reality",3:"Otherwise Mis-identifying with Untruth",4:"You are Only that Ultimate Reality",5:"Assimilating this Knowledge"};
 var mandukyaTitles={1:"Āgama-prakaraṇa",2:"Vaitathya-prakaraṇa",3:"Advaita-prakaraṇa",4:"Alāta-śānti-prakaraṇa"};
 var grouped=[];
 units.forEach(function(unit,index){
  var chapterNo=unitChapter(unit),title=unit.sectionTitle||"";
  if(!title&&chapterNo){
   if(work==="panchadasi")title="Chapter "+chapterNo+(panchadasiTitles[chapterNo]?": "+panchadasiTitles[chapterNo]:"");
   else if(work==="svsss")title="Part "+chapterNo+(svsssTitles[chapterNo]?": "+svsssTitles[chapterNo]:"");
   else if(work==="mandukya-karika")title="Chapter "+chapterNo+": "+(mandukyaTitles[chapterNo]||"");
   else title="Chapter "+chapterNo;
  }
  if(!title)return;
  var prior=grouped[grouped.length-1];
  if(!prior||prior.label!==title)grouped.push({label:title,id:unit.id,index:index});
 });
 var hasTraditional=units.some(function(unit){return unit.chapter!==undefined&&unit.chapter!==null;})||work==="panchadasi"||work==="svsss";
 if(grouped.length&&(hasTraditional||grouped.length<=20))return grouped;
 if(units.length<=50)return [];
 var result=[],chunkSize=Math.max(1,Math.ceil(units.length/12));
 for(var i=0;i<units.length;i+=chunkSize){
  var part=units.slice(i,i+chunkSize);
  var nums=part.flatMap(function(unit){return Array.isArray(unit.sourceNumbers)?unit.sourceNumbers:[unit.number];}).filter(function(value){return value!==undefined&&value!==null;});
  var first=String(part[0].label||"");
  var kind=/page/i.test(first)?"Pages":/passage/i.test(first)?"Passages":/section/i.test(first)?"Sections":/entry/i.test(first)?"Entries":"Verses";
  result.push({label:kind+" "+(nums[0]||part[0].number||String(i+1))+"–"+(nums[nums.length-1]||part[part.length-1].number||String(Math.min(i+part.length,units.length))),id:part[0].id,index:i});
 }
 return result;
}
function renderUnit(unit,index){
 var card=document.createElement("article");
 var label=unit.label||"Verse "+(index+1);
 card.className="gita-verse shankara-verse";
 card.id=String(unit.id);
 card.setAttribute("aria-label",label);
 var heading=document.createElement("h2");
 heading.textContent=String(unit.number||index+1);
 var rule=document.createElement("hr");
 rule.className="gita-verse-rule";
 var source=document.createElement("div");
 source.className="gita-sanskrit sa-text";
 source.lang="sa-Deva";
 source.setAttribute("data-iast",String(unit.iast||""));
 source.textContent=String(unit.deva||"");
 card.append(heading,rule,source);
 var translation=document.createElement("p");
 translation.className="gita-translation";
 translation.textContent=String(unit.translation||"");
 card.append(translation);
 var controls=document.createElement("div");
 controls.className="gita-controls";
 var details=document.createElement("details");
 makeGloss(details,unit.gloss);
 controls.append(details);
 card.append(controls);
 return card;
}
dataUrl.searchParams.set("v","reader-gloss-20261027b");
fetch(dataUrl.href,{credentials:"same-origin",cache:"no-cache"}).then(function(response){
 if(!response.ok)throw new Error("Glossary data is unavailable.");
 return response.json();
}).then(function(data){
 if(!data||!Array.isArray(data.units)||data.units.length!==data.expectedUnits||!data.units.length)throw new Error("The complete text data is incomplete.");
 var units=data.units;
 if(units.some(function(unit){return !unit||!unit.id||!unit.deva||!unit.iast||!unit.translation||!Array.isArray(unit.gloss)||!unit.gloss.length||unit.gloss.some(function(word){return !word||!word.sa||!word.en;});}))throw new Error("A Sanskrit, translation, transliteration, or word-gloss field is missing.");
 titleNode.textContent=data.title||work;
 authorNode.textContent=data.author?"By "+data.author:"";
 document.title=titleNode.textContent+" — Chapter reader — Viveka Dṛṣṭi";
 var items=chapterItems(data);
 if(!items.length)throw new Error("No named chapter or contents divisions were found.");
 listNode.replaceChildren();
 items.forEach(function(item,index){
  var li=document.createElement("li"),a=document.createElement("a");
  a.href=chapterUrl(item.id);
  a.textContent=item.label;
  if(index===0&&!requestedUnit)a.setAttribute("aria-current","page");
  li.append(a);listNode.append(li);
 });
 var selectedIndex=items.findIndex(function(item){return item.id===requestedUnit;});
 if(selectedIndex<0&&requestedUnit){
  var verseIndex=units.findIndex(function(unit){return unit.id===requestedUnit;});
  if(verseIndex>=0){
   selectedIndex=items.findIndex(function(item,index){return verseIndex>=item.index&&verseIndex<(items[index+1]?items[index+1].index:units.length);});
  }
  if(selectedIndex<0){
   var legacy=requestedUnit.match(/^treatise-[a-z0-9-]+-section-(\d+)$/);
   if(legacy)selectedIndex=Number(legacy[1])-1;
  }
 }
 if(selectedIndex<0&&!requestedUnit)selectedIndex=0;
 if(selectedIndex<0||selectedIndex>=items.length){
  chapterTitle.textContent="Section not found";
  setError("That chapter or contents section is not in this text.");
  return;
 }
 var selectedStart=items[selectedIndex].index;
 var selectedEnd=items[selectedIndex+1]?items[selectedIndex+1].index:units.length;
 var selectedUnits=units.slice(selectedStart,selectedEnd);
 if(!selectedUnits.length)throw new Error("The selected section is empty.");
 chapterTitle.textContent=items[selectedIndex].label;
 contentNode.replaceChildren();
 selectedUnits.forEach(function(unit,index){contentNode.append(renderUnit(unit,selectedStart+index));});
 var panelCounts=window.ShankaraReaderControls?window.ShankaraReaderControls.apply(contentNode):{total:selectedUnits.length,available:0};
 var total=panelCounts.total||selectedUnits.length,withGloss=panelCounts.available||0;
 coverageNode.textContent=withGloss===total
  ?"Word for Word glosses are available for all "+total+" entries in this section."
  :"Word for Word glosses are available for "+withGloss+" of "+total+" entries in this section.";
 var currentLink=listNode.querySelector('a[href="'+chapterUrl(items[selectedIndex].id)+'"]');
 if(currentLink)currentLink.setAttribute("aria-current","page");
 var pager=document.createElement("nav");
 pager.className="shankara-work-nav";
 pager.setAttribute("aria-label","Chapter navigation");
 if(selectedIndex>0){var previous=document.createElement("a");previous.rel="prev";previous.href=chapterUrl(items[selectedIndex-1].id);previous.textContent="← "+items[selectedIndex-1].label;pager.append(previous)}
 else{var spacer=document.createElement("span");pager.append(spacer)}
 var middle=document.createElement("a");middle.className="shankara-index-link";middle.href=contentsUrl.href;middle.textContent="All chapters";pager.append(middle);
 if(selectedIndex<items.length-1){var next=document.createElement("a");next.rel="next";next.href=chapterUrl(items[selectedIndex+1].id);next.textContent=items[selectedIndex+1].label+" →";pager.append(next)}
 else{var spacerEnd=document.createElement("span");pager.append(spacerEnd)}
 contentNode.append(pager);
}).catch(function(error){
 chapterTitle.textContent="Could not load this section";
 setError("The selected text could not be loaded. "+error.message);
 console.error(error);
});
})();
</script>
</body>
</html>
