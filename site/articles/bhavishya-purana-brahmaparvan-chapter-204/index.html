<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 204 — Description of the Sky-Worship Procedure."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 204 — Description of the Sky-Worship Procedure — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-6" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 204 — Description of the Sky-Worship Procedure</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20261019-unified-theme-4"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-6"></script><script>const R=[["Sumantu said. Hereafter I shall declare the supremely revered procedure for worshipping Bhānu at the installation of the jewel sky.","ataḥ param — further; pravakṣyāmi — I shall tell; vidhim — the procedure; parama-pūjitam — highly worshipped; ratna-vyoma-pratiṣṭhāyām — in installing the jeweled sky; yathā — how; bhānum — Bhānu; prapūjayet — one should worship."],["Having worshipped Prakṛti with scents, flowers, and akṣata, O Lord, with a water filled añjali, or with flowers and akṣata.","arcayitvā — having worshipped; tu — indeed; prakṛtim — Nature; gandha-puṣpa-akṣataiḥ — with scents, flowers, and unbroken rice grains; vibho — O Lord; saha-udakena añjalinā — with a handful containing water; saha-puṣpa-akṣatena vā — or with flowers and unbroken rice grains."],["One should invoke the great god Khaṣolka, Bhāskara, the all pervading, with a mantra for the visible ray, O tiger among Kurus.","āvāhayet — one should invoke; mahā-devam — the great god; khaṣolkam — Khaṣolka; bhāskaram — Bhāskara; vibhum — the Mighty One; mantreṇa — with a mantra; kuru-śārdūla — O tiger among Kurus; pratyak-kiraṇāya — for the visible ray; vai — indeed."],["Oṃ, I invoke Khaṣolka. Oṃ Bhūr Bhuvaḥ Svar Oṃ. This is the mantra in the worship of Āditya.","oṃ — Oṃ; khaṣolkam — Khaṣolka; āvāhayāmi — I invoke; oṃ bhūḥ bhuvaḥ svaraḥ — Oṃ Bhūr Bhuvaḥ Svar; āditya-ārādhane — in worship of Āditya; mantraḥ — the mantra."],["Having consecrated the earth with the measure and the Sāvitrī ṛc, O Lord, with Āpo Hiṣṭhā, which is declared, for the Sun always.","abhimantrya — having consecrated; bhuve — the earth; mātram — the measure; sāvitrī — with the Sāvitrī; ca — and; ṛcā — with the ṛc; vibho — O Lord; āpaḥ hi ṣṭhā — “Āpo Hiṣṭhā”; iti — thus; yā proktā — which is declared; vṛthā — always; sūryasya — of the Sun; sadā — always."],["Having washed according to rule, one should fill from another place. The wise one should wash with Hiraṇyagarbhaḥ Samavartata.","yathā-nyāyam — according to rule; saṃkṣālya — having washed; pūrayet — one should fill; ca — and; anyataḥ yataḥ — from another place; hiraṇya-garbhaḥ-samavartata — “Hiraṇyagarbhaḥ Samavartata”; iti — thus; anayā — with this; kṣālayet — should wash; budhaḥ — the wise one."],["With Savitā Paścātāt Savitā, the wise one should fill it. Having thus filled the water with flowers and akṣata, the wise one.","savitā — Savitā; paścātāt — behind; savitā — Savitā; hi — indeed; anayā — with this; pūrayet — should fill; budhaḥ — the wise one; iti evam — thus; pūrayitvā — having filled; vāri — the water; puṣpa-akṣataiḥ — with flowers and unbroken rice grains; budhaḥ — the wise one."],["Taking an udumbara vessel, one should show it entirely to the Sun. With Udutyaṃ Jātavedasam, one should cast it into the sky.","pātram — a vessel; audumbaram — of udumbara; gṛhya — taking; kṛtsnam — completely; sūryasya — to the Sun; darśayet — should show; udutyam-jātavedasam — “Udutyaṃ Jātavedasam”; anayā — with this; vyomni — into the sky; nikṣipet — should cast."],["The discerning one should give pādya with Haṃsaḥ Śuciṣad. One should soothe with milk and then bathe Khaṣolka.","haṃsaḥ-śuciṣat — “Haṃsaḥ Śuciṣad”; iti — thus; pādyam — pādya; dadyāt — should give; vicakṣaṇaḥ — the discerning one; nirvāpayet — should soothe; ca — and; payasā — with milk; khaṣolkam — Khaṣolka; snāpayet — should bathe; tataḥ — then."],["Agni is praised with seven verses in full, O hero. Next in due order, with three verses called Āpo Hiṣṭhā, O delight of the Kurus.","agniḥ — Agni; tu — indeed; saptabhiḥ — with seven [verses]; vīra — O hero; kīrtitāḥ — spoken; tāḥ — those; ca — and; kṛtsnaśaḥ — in full; āpaḥ hi ṣṭhā — “Āpo Hiṣṭhā”; iti — thus; krameṇa — in order; tisṛbhiḥ — with three [verses]; kuru-nandana — O delight of the Kurus."],["With Hiraṇyavarṇā in due order with four verses, O king. Having consecrated the water with three ṛcs, one should cast it.","hiraṇya-varṇā — “Hiraṇyavarṇā”; iti — thus; krameṇa — in order; caturbhiḥ — with four; nara-adhipa — O king; abhimantrya — having consecrated; udakam — the water; ṛgbhiḥ — with ṛcs; tisṛbhiḥ — with three; nikṣipet — should cast; nṛpa — O king."],["Having circumambulated Bhānu, also with Kṛṇuṣva Pājaḥ. The Vājinam verses are proclaimed first.","bhānoḥ — of Bhānu; pradakṣiṇam kṛtvā — having made circumambulation; kṛṇuṣva-pājaḥ — “Kṛṇuṣva Pājaḥ”; iti — thus; api — likewise; ityamūṣu — in these; vājinam — “Vājinam”; giraḥ — verses; prathamā — first; parikīrtitā — declared."],["Patim Indra Stavācām is declared the second. Patim Indra Tu Śuddho Nāgahi is declared the third.","patim-indra-stavācām — “Patim Indra Stavācām”; dvitīyā — second; parikīrtitā — declared; patim-indra-tu-śuddho-na-āgahi — “Patim Indra Tu Śuddho Nāgahi”; tṛtīyā — third; parikīrtitā — declared."],["One should worship Bhānu with fragrant substances by Sidhye Vṛtrāṇi Jighne. With Asya Vāmasya one should worship Ravi with akṣata.","sidhye-vṛtrāṇi-jighne — “Sidhye Vṛtrāṇi Jighne”; śa-gandhaiḥ — with fragrant pastes; bhānum — Bhānu; prapūjayet — one should worship; asya-vāmasya — “Asya Vāmasya”; iti — thus; anayā — with this; akṣataiḥ — with unbroken rice grains; pūjayet — should worship; ravim — Ravi."],["With Sapta Yuñjanti Ratham one should worship Ravi. Worship him continually with flowers, O tiger among Bharatas, the imperishable one.","sapta-yuñjanti-ratham — “Sapta Yuñjanti Ratham”; anayā — with this; pūjayet — one should worship; ravim — Ravi; puṣpaiḥ — with flowers; bharata-śārdūla — O tiger among Bharatas; satatam — always; tam — him; anāśanam — the undestroying one."],["With Ko Dadarśa Prathamam one should offer incense. With Pākaḥ Pṛcchāmi one should present sandalwood.","kaḥ dadarśa prathamam — “Ko Dadārśa Prathamam”; anayā — with this; dhūpam — incense; ādiśet — one should direct; pākaḥ pṛcchāmi — “Pākaḥ Pṛcchāmi”; anayā — with this; candanam — sandalwood; pratipādayet — one should present."],["With Uddīpyasva one should give a lamp to Vibhāvasu. Having worshipped kuṅkuma also, one should offer the head, milk, and the maṇḍala.","uddīpyasva — “Uddīpyasva”; iti — thus; anayā — with this; dīpam — a lamp; dadyāt — should give; vibhāvasoḥ — to Vibhāvasu; arcitvā — having worshipped; kuṅkumam — saffron; ca eva — also; śīrṣam — the head; kṣīram — milk; tu — indeed; maṇḍalam — maṇḍala."],["With Yuktā Mātāsi one should present naivedya. With Gaurīr Mimāya one should give white garments also.","yuktā-mātā-asi — “Yuktā Mātāsi”; anayā — with this; naivedyam — the offering; pratipādayet — one should present; gaurīḥ-mimāya — “Gaurīr Mimāya”; iti — thus; dadyāt — should give; tathā — likewise; śukle — white; ca — and; vāsasī — garments."],["With Tasyāḥ Samudre one should offer the upavīta. Thus having worshipped the Lord of gods, one should then make supreme praise.","tasyāḥ-samudre — “Tasyāḥ Samudre”; iti — thus; anayā — with this; upavītam — the upavīta; nivedayet — one should offer; iti — thus; sampūjya — having worshipped; deva-īśam — the Lord of gods; tataḥ — then; kuryāt — one should make; parām stutim — supreme praise."],["Hear the five ṛcs indeed, O dear one, with one mind and without disregard. Ukṣāṇaṃ Pṛśnim is declared first.","ṛgbhiḥ — with ṛcs; vai — indeed; pañcabhiḥ — five; tāta — O son; śṛṇu — hear; eka-manāḥ — with one mind; anādṛtaḥ — without disregard; ukṣāṇam-pṛśnim — “Ukṣāṇaṃ Pṛśnim”; iti — thus; ca — and; prathamā — first; parikīrtitā — declared."],["Catvāri Vāk is declared the second. Indraṃ Mitraṃ is the third, declared for abundance of boons.","catvāri-vāk — “Catvāri Vāk”; iti — thus; bhavet — becomes; dvitīyā — second; parikīrtitā — declared; indram-mitram — “Indraṃ Mitraṃ”; tṛtīyā — third; tu — indeed; vara-ādhikye — for increase of boons; parikīrtitā — declared."],["Kṛṣṇaṃ Niyānam is declared the fourth. With Yo Ratnavāhī one should set a crown on Ravi.","kṛṣṇam-niyānam — “Kṛṣṇaṃ Niyānam”; hi — indeed; tathā — thus; caturthī — fourth; parikīrtitā — declared; yaḥ ratna-vāhī — “Yo Ratnavāhī”; iti — thus; anayā — with this; kirīṭam — a crown; yojayet — should set; ravau — on Ravi."],["With Gatehanām one should place Bhāskara complete. Iyam Adadād Rabhasam Ṛṇacyutam, beginning with that ṛc.","gatehanām — “Gatehanām”; iti — thus; anayā — with this; avyaṅgam — unblemished; bhāskaram — Bhāskara; nyaset — one should place; iyam-adadāt-rabhasam-ṛṇacyutam — “Iyam Adadād Rabhasam Ṛṇacyutam”; iti — thus; ṛk-āditaḥ — from the ṛc onward."],["Having made the worship, then with eight ṛcs, O Acyuta, one should worship the eight śaktis of the god in due order.","kṛtvā — having made; pūjām — worship; tataḥ — then; ṛgbhiḥ — with ṛcs; aṣṭābhiḥ — eight; iti — thus; ca — and; acyuta — O Acyuta; devasya — of the god; śaktayaḥ aṣṭau — the eight śaktis; pūjayet — one should worship; vidhi-vat — according to rule; kramāt — in due order."],["This procedure for image worship has been told by me to you, O mighty armed one, which was formerly told by Brahmā to Viṣṇu.","iti — thus; eṣaḥ — this; te — to you; mayā — by me; ākhyātaḥ — told; prati-mā-pūjane — in image-worship; vidhiḥ — procedure; yaḥ — which; pura-uktaḥ — told formerly; mahā-bāho — O great-armed one; brahmaṇā — by Brahmā; viṣṇave — to Viṣṇu; tathā — likewise."],["Whoever constantly worships Ravi by this procedure obtains all desires in this world and in the next.","anena vidhinā — by this procedure; yaḥ tu — whoever; satatam — constantly; pūjayet — worships; ravim — Ravi; saḥ — he; prāpnoti — obtains; akhilān kāmān — all desires; iha loke — in this world; paratra ca — and in the next."],["One desiring sons obtains sons. One desiring wealth obtains wealth. One desiring a daughter obtains a daughter. One desiring Veda becomes a knower of Veda.","putra-arthī — one desiring a son; labhate — obtains; putrān — sons; dhana-arthī — one desiring wealth; labhate — obtains; dhanam — wealth; kanyā-arthī — one desiring a daughter; labhate — obtains; kanyām — a daughter; veda-arthī — one desiring Veda; veda-vit — a knower of Veda; bhavet — becomes."],["The man who worships without desire may attain mokṣa. Worshipping by this procedure, he has attained siddhi and is a Vaiṣṇava.","niṣkāmaḥ — without desire; pūjayet — worships; yaḥ tu — whoever; saḥ — he; mokṣam — mokṣa; prāpnuyāt — may obtain; naraḥ — a man; anena vidhinā — by this procedure; pūjya — worshipped; gataḥ — reached; siddhim — accomplishment; saḥ — he; vaiṣṇavaḥ — a Vaiṣṇava."],["Brahmā and the rest likewise, having worshipped the god Vibhāvasu, by this procedure having worshipped, the saints attained supreme siddhi.","brahma-ādayaḥ — Brahmā and the others; tathā — likewise; devam — the god; pūjayitvā — having worshipped; vibhāvasum — Vibhāvasu; anena vidhinā — by this procedure; pūjya — worshipped; santaḥ — the saints; siddhim parām — supreme accomplishment; gatāḥ — attained."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:204,verseCount:29,subtitle:"Chapter 204 — Description of the Sky-Worship Procedure",colophon:""},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body>
