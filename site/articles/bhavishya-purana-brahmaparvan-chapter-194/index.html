<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 194 — Description of Dreams in the Sun–Aruṇa Dialogue."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 194 — Description of Dreams in the Sun–Aruṇa Dialogue — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-6" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 194 — Description of Dreams in the Sun–Aruṇa Dialogue</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">← Chapter 193</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-195/">Chapter 195 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20261019-unified-theme-4"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-6"></script><script>const R=[["I shall now declare what fruit a man of fixed observance obtains from each dream seen on the seventh lunar day.","ataḥ param — thereafter; pravakṣyāmi — I shall declare; yaiḥ yaiḥ — each/whatever; yat phalam — what fruit; aśnute — he obtains; svapne dṛṣṭe — when seen in a dream; saptamyām — on the seventh lunar day; puruṣaḥ — a man; niyata-vrataḥ — of fixed observance.","अतः परं प्रवक्ष्यामि यैर्यैर्यत्फलमश्नुते । स्वप्ने दृष्टे तु सप्तम्यां पुरुषो नियतव्रतः ॥ १ ॥"],["Having completed according to rule all rites beginning with recitation and fire offerings, one should take a bed on the ground and contemplate the god of gods.","samāpya — having completed; vidhi-vat — according to rule; sarvām — all; japa-homa-ādikām kriyām — rites beginning with recitation and fire offerings; bhūmau — on the ground; śayyām samāsthāya — having taken a bed; deva-devam — the God of gods; vicintayet — one should contemplate.","समाप्य विधिवत्सर्वां जपहोमादिकां क्रियाम् । भूमौ शय्यां समास्थाय देवदेवं विचिन्तयेत् ॥ २ ॥"],["If a sleeping man sees in a dream the Sun, Indra’s banner, or the Moon, all prosperities are his.","hanta — indeed; suptaḥ — asleep; yadi — if; naraḥ — a man; paśyet — sees; svapne — in a dream; divākaram — the Sun; śakra-dhvajam vā — or Indra’s banner; candram vā — or the Moon; tasya — for him; sarvāḥ samṛddhayaḥ — all prosperities.","हन्त सुप्तो यदि नरः पश्येत्स्वप्ने दिवाकरम् । शक्रध्वजं वा चन्द्रं वा तस्य सर्वाः समृद्धयः ॥ ३ ॥"],["A water vessel, a fly whisk, a mirror, golden ornaments, the flow of blood, and falling hair cause prosperity. Climbing a tree in a dream quickly brings prosperity in battle.","bhṛṅgāra — water-vessel; camara — fly-whisk; ādarśa — mirror; kanaka-ābharaṇāni ca — and gold ornaments; rudhirasya srutiḥ — flow of blood; keśa-pātam — falling hair; aiśvarya-kārakaḥ — causes of prosperity; svapne — in a dream; vṛkṣa-adhirohe — in climbing a tree; tu — indeed; kṣipram — quickly; aiśvaryam āhave — prosperity in battle.","भृंगारचमरादर्शकनकाभरणानि च । रुधिरस्य स्रुतिः केशपातं ऐश्वर्यकारकः । स्वप्ने वृक्षाधिरोहे तु क्षिप्रमैश्वर्यमाहवे ॥ ४ ॥"],["The milking of female buffaloes, lionesses, monitor lizards, and cows with one’s own hand, and their binding, bring gain of a kingdom. Touching the navel brings an evil disposition.","dohanam — milking; mahiṣī-siṃhī-godha-dhenūnām — of female buffaloes, lionesses, monitor lizards, and cows; kare sve — with one’s own hand; bandhaḥ ca āsām — and their binding; rājya-lābhaḥ — gain of kingship; nābheḥ sparśe tu — but at the touch of the navel; durmatiḥ — an evil mind.","दोहनं महिषीसिंहीगोधेनूनां करे स्वके । बन्धश्चासां राज्यलाभो नाभेः स्पर्शे तु दुर्मतिः ॥ ५ ॥"],["Killing a sheep and eating it oneself; eating a lion, a lotus, one’s own limb, a bone, or fire; drinking liquor, O lord of birds.","avim hatvā — having killed a sheep; svayam khādet — one would eat oneself; siṃham — a lion; ambujam eva ca — and a lotus; sva-aṅgam — one’s own limb; asthi — bone; hutāśam ca — and fire; surā-pānam — drinking liquor; khaga-adhipa — O lord of birds.","अविं हत्वा स्वयं खादेत्सिंहमम्बुजमेव च । स्वाङ्गमस्थि हुताशं च सुरापानं खगाधिप ॥ ६ ॥"],["A man who eats rice pudding from a gold or silver vessel, or from a dish or lotus leaf, will have equal prosperity.","haime vā — in a golden [vessel], or; rājate vā — in a silver [one]; yaḥ — whoever; bhuṃkte — eats; pāyasam — rice pudding; naraḥ — a man; pātre tu — in a vessel; padma-patre vā — or on a lotus leaf; tasya — for him; aiśvaryam samam bhavet — prosperity becomes equal.","हैमे वा राजते वापि यो भुङ्क्ते पायसं नरः । पात्रे तु पद्मपत्रे वा तस्यैश्वर्यं समं भवेत् ॥ ७ ॥"],["Victory in gambling or in battle indeed brings happiness. Burning one’s own body and binding one’s head bring prosperity.","dyūte — in gambling; ca — and; atha vā — or; yuddhe — in battle; vijayaḥ — victory; hi — indeed; sukha-āvahaḥ — happiness-bringing; gātrasya svasya jvalanam — burning of one’s own body; śiraḥ-bandhaḥ ca — and binding of the head; bhūtaye — for prosperity.","द्यूते च वाथ वा युद्धे विजयो हि सुखावहः । गात्रस्य स्वस्य ज्वलनं शिरोबन्धश्च भूतये ॥ ८ ॥"],["The gain of white garlands and garments, horses, animals, and birds is always praised; so too is smearing with excrement.","mālyāmbarāṇām śuklānām — of white garlands and garments; hayānām — of horses; paśu-pakṣiṇām — animals and birds; sadā — always; lābham praśaṃsanti — they praise as gain; viṣṭhānām ca anulepanam — and smearing with excrement.","माल्याम्बराणां शुक्लानां हयानां पशुपक्षिणाम् । सदा लाभं प्रशंसन्ति विष्ठानां चानुलेपनम् ॥ ९ ॥"],["Prosperity comes quickly from riding a horse; riding a chariot brings the arrival of offspring; having many heads and arms brings prosperity to a householder.","haya-yāne — in riding a horse; bhavet kṣipram — it comes quickly; ratha-yāne — in riding a chariot; prajā-āgamaḥ — arrival of children; nānā-śiraḥ-bāhutā ca — and having many heads and arms; gṛha-sthām — for a householder; kurute śriyam — makes prosperity.","हययाने भवेत्क्षिप्रं रथयाने प्रजागमः । नानाशिरोबाहुता च गृहस्थां कुरुते श्रियम् ॥ १० ॥"],["Approaching what is forbidden is auspicious; study of the Veda is excellent; gods, the foremost twice-born, heroes, teachers, elders, and ascetics.","agamya-āgamanam — approaching what is forbidden; dhanyam — auspicious; veda-adhyayanam — study of the Veda; uttamam — excellent; deva-dvija-śreṣṭha-vīra-guru-vṛddha-tapasvinaḥ — gods, the foremost twice-born, heroes, teachers, elders, and ascetics.","अगम्यागमनं धन्यं वेदाध्ययनमुत्तमम् । देवद्विजश्रेष्ठवीरगुरुवृद्धतपस्विनः ॥ ११ ॥"],["Whatever these say to a man in a dream, they know to be true; their appearance is auspicious and a blessing, O lord of birds.","yat vadanti — what they say; naram — to a man; svapne — in a dream; satyam eva — as true indeed; iti — thus; tat viduḥ — they know that; praśastam — auspicious; darśanam ca — and the sight; eṣām — of these; āśīrvādaḥ — a blessing; khaga-adhipa — O lord of birds.","यद्वदन्ति नरं स्वप्ने सत्यमेवेति तद्विदुः । प्रशस्तं दर्शनं चैषामाशीर्वादः खगाधिप ॥ १२ ॥"],["Kingship results from one’s own head being cut off; wealth from killing many; food from weeping; kingship from being bound in chains.","rājyam syāt — there would be kingship; sva-śiraḥ-chede — in the cutting off of one’s own head; dhanam — wealth; bahu-vadhe bhavet — comes from a great killing; rudite — in weeping; bhakṣya-samprāptiḥ — attainment of food; rājyam — kingship; nigada-bandhane — in being bound in chains.","राज्यं स्यात्स्वशिरश्छेदे धनं बहुवधे भवेत् । रुदिते भक्ष्यसंप्राप्ती राज्यं निगडबन्धने ॥ १३ ॥"],["Whoever boldly mounts a mountain, a horse, a lion, a bull, or an elephant obtains great sovereignty.","parvatam — a mountain; turagam — a horse; siṃham — a lion; vṛṣabham — a bull; gajam eva hi — and indeed an elephant; yaḥ — whoever; vikramya — boldly; adhirohati — mounts; mahad-aiśvaryam āpnoti — obtains great sovereignty.","पर्वतं तुरगं सिंहं वृषभं गजमेव हि । महदैश्वर्यमाप्नोति यो विक्रम्याधिरोहति ॥ १४ ॥"],["Taking planets and stars in hand, turning a ray of light, and uprooting mountains, one becomes king on earth.","āgṛhṇānaḥ — taking; grahān — planets; tārāḥ — stars; marīcim — a ray of light; parivartayan — turning; unmūlayati — uproots; parvatān ca — and mountains; rājā bhavati — becomes king; bhūtale — on earth.","आगृह्णानो ग्रहांस्तारा मरीचिं परिवर्तयन् । उन्मूलयति पर्वतांश्च राजा भवति भूतले ॥ १५ ॥"],["The coming out of all the intestines from the body, O lord of birds, and drinking oceans and rivers cause prosperity and happiness.","dehāt niṣkrāntiḥ — coming out from the body; antrāṇām sarveṣām — of all the intestines; khaga-adhipa — O lord of birds; pānam — drinking; samudra-saritām — oceans and rivers; aiśvarya-sukha-kārakam — causes prosperity and happiness.","देहान्निष्क्रान्तिरन्त्राणां सर्वेषां च खगाधिप । पानं समुद्रसरितामैश्वर्यसुखकारकम् ॥ १६ ॥"],["Whoever reaches by strength even the far shore of the ocean, O hero, will have firm offspring, O lord of birds.","balam — by strength; ca — and; ambu-nidhim vā api — even the ocean; tīrtha-pāram — the far shore; prayāti yaḥ — whoever reaches; tasya — his; apatyam — offspring; bhavet — will be; vīra — O hero; acalam ca — and firm; khaga-adhipa — O lord of birds.","बलं चाम्बुनिधिं वापि तीर्थपारं प्रयाति यः । तस्यापत्यं भवेद्वीर अचलञ्च खगाधिप ॥ १७ ॥"],["Wealth comes quickly if a worm eats; there is gain and sight of beautiful limbs, union with auspicious things, health, and wealth.","bhavati — comes to be; artha-āgamaḥ — arrival of wealth; śīghram — quickly; kṛmiḥ vā — or a worm; yadi bhakṣayet — if it eats; aṅgānām surūpāṇām — of beautiful limbs; lābhaḥ — gain; darśanam eva ca — and seeing; saṃyogaḥ ca eva — and union; māṅgalyaiḥ — with auspicious things; ārogyam — health; dhanam eva ca — and wealth.","भवत्यर्थागमः शीघ्रं कृमिर्वा यदि भक्षयेत् । अङ्गानां च सुरूपाणां लाभो दर्शनमेव च । संयोगश्चैव माङ्गल्यैरारोग्यं धनमेव च ॥ १८ ॥"],["A dream brings prosperity and gain of a kingdom. It comes to fruition within seven days, without doubt; within four days, the result is excellent.","aiśvaryam — prosperity; rājya-lābhaḥ ca — and gain of a kingdom; yasmin svapne udāhṛtaḥ — in which dream is declared; sapta syāt — it would be seven; na atra saṃdehaḥ — there is no doubt here; caturbhiḥ — by four; śrutaḥ — heard; uttamaḥ — excellent.","ऐश्वर्यं राज्यलाभश्च यस्मिन्स्वप्न उदाहृतः । सप्त स्यान्नात्र संदेहश्चतुर्भिः श्रुत उत्तमः ॥ १९ ॥"],["Within five days, abundance of sons; within six, long life, sons, and wealth; within seven, various desires; within eight, varied fame.","pañcabhiḥ — within five days; putra-bāhulyam — abundance of sons; ṣaḍbhiḥ — within six days; āyuḥ — long life; sutān — sons; dhanam — wealth; saptabhiḥ — within seven days; vividhān kāmān — various desires; aṣṭabhiḥ — within eight days; vividham yaśaḥ — varied fame.","पञ्चभिः पुत्रबाहुल्यं षड्भिरायुः सुतान्धनम् । सप्तभिर्विविधान्कामानष्टभिर्विविधं यशः ॥ २० ॥"]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1],sa:r[2]}]));renderBhavishyaLiveChapter({chapter:194,verseCount:20,preferEmbeddedSanskrit:true,subtitle:"Chapter 194 — Description of Dreams in the Sun–Aruṇa Dialogue",colophon:""},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body></html>
