<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 215 — Solar Mantra Extraction."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 215 — Solar Mantra Extraction — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-6" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 215 — Solar Mantra Extraction</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-214/">← Chapter 214</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-216/">Chapter 216 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20261019-unified-theme-4"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-6"></script><script>const R=[["Hear me speak, O hero, of the third Saptamī, which is remembered with neem leaves, supreme, destroyer of disease.","tṛtīyām—the third; saptamīm—Saptamī; vīra—O hero; śṛṇuṣva—hear; gadataḥ—from [me] speaking; mama—my; nimba-patraiḥ—with neem leaves; smṛtā—remembered; yā—which; tu—indeed; paramā—supreme; roga-nāśinī—disease-destroying."],["What other worship procedure is there by which one worships Ravi, the god of gods, Śārṅgapāṇi, holding conch, discus, and mace?","yathā—what; arcana-vidhiḥ—worship procedure; vā—or; anyaḥ—another; yena—by which; pūjayate—one worships; ravim—Ravi; deva-devaḥ—god of gods; śārṅga-pāṇiḥ—Śārṅgapāṇi; śaṅkha-cakra-gadā-dharaḥ—holding conch, discus, and mace."],["Now I shall tell the worship procedure; hear from me the extraction of the mantra.","atha—now; arcana-vidhim—the worship procedure; vacmi—I speak; mantra-uddhāram—the extraction of mantras; nibodha—hear; me—from me."],["Oṃ, salutation to Khaṣolka: the root mantra. Oṃ, Viṭi twice: the head. Oṃ, to the thousand-rayed one: the weapon. Oṃ, to the thousand-rayed one: the upper bond. Oṃ, salutation to Ghana, the source of beings: thus, the bond of beings. Oṃ, blaze twice, blaze forth twice: the fire enclosure.","oṃ—Oṃ; khaṣolkāya—to Khaṣolka; namaḥ—salutation; mūla-mantraḥ—root mantra; oṃ—Oṃ; viṭi—Viṭi; 2—twice; śiraḥ—head; oṃ—Oṃ; sahasra-raśmaye—to the thousand-rayed one; astram—weapon; oṃ—Oṃ; sahasra-kiraṇāya—to the thousand-rayed one; 200—200; ūrdhva-bandhaḥ—upper bond; oṃ—Oṃ; ghanāya—to Ghana; bhūta-bhāvine—to the source of beings; namaḥ—salutation; iti—thus; bhūta-bandhaḥ—bond of beings; oṃ—Oṃ; jvala—blaze; 2—twice; prajvala—blaze forth; 2—twice; agni-prakara—fire enclosure."],["Oṃ, may we know Āditya; we meditate on Viśvabhāga. May that Sun impel us.","oṃ—Oṃ; ādityāya—to Āditya; vidmahe—may we know; viśva-bhāgāya—to Viśvabhāga; dhīmahi—we meditate; tat—that; naḥ—us; sūryaḥ—the Sun; pracodayāt—may impel."],["This is the joining of the Gāyatrī. Oṃ, salutation to Dharmātman in the northeast; Oṃ, salutation to Dakṣiṇa in the southeast; Oṃ, salutation to Vajrapāṇi, Ananta, in the north; Oṃ, salutation to Śyāma-Piṅgala in the northeast; Oṃ, salutation to Amṛta in the southeast; Oṃ, salutation to Budha, son of Soma, in the south; Oṃ, salutation to Vāgīśvara, lord of all knowledge, in the southwest; Oṃ, salutation to Śukra, great seer, Bhūta, in the west; Oṃ, salutation to Īśvara, whose self is the Sun, in the northwest; Oṃ, salutation to Kṛtavat in the north; Oṃ, salutation to Rāhu in the northeast; Oṃ, salutation to Antara, whose self is the Sun, in the east; Oṃ, salutation to Dhruva in the northeast. O blessed Pūṣan, garlanded one, lord of the whole world, rider of seven horses, ruler of the earth: receive the radiant form gone to the summit of supreme attainment, endless flame twice. This is the invocation mantra. Oṃ, salutation to blessed Āditya, the thousand-rayed one, for returning again at pleasure.","gāyatrī-saṃkalīkaraṇam—the joining of the Gāyatrī; idam—this; oṃ—Oṃ; dharmātmane—to Dharmātman; namaḥ—salutation; eśānyām—in the northeast; oṃ—Oṃ; dakṣiṇāya—to Dakṣiṇa; namaḥ—salutation; āgneyyām—in the southeast; oṃ—Oṃ; vajra-pāṇaye—to Vajrapāṇi; anantāya—to Ananta; namaḥ—salutation; uttarataḥ—in the north; oṃ—Oṃ; śyāma-piṅgalāya—to Śyāma-Piṅgala; namaḥ—salutation; aiśānyām—in the northeast; oṃ—Oṃ; amṛtāya—to Amṛta; namaḥ—salutation; āgneyyām—in the southeast; oṃ—Oṃ; budhāya—to Budha; soma-sutāya—to the son of Soma; namaḥ—salutation; dakṣiṇataḥ—in the south; oṃ—Oṃ; vāg-īśvarāya—to Vāgīśvara; sarva-vidyā-adhipataye—to the lord of all knowledge; nairṛtyām—in the southwest; oṃ—Oṃ; śukrāya—to Śukra; mahā-ṛṣaye—to the great seer; bhūtāya—to Bhūta; paścimataḥ—in the west; oṃ—Oṃ; īśvarāya—to Īśvara; sūryātmane—whose self is the Sun; namaḥ—salutation; vāyavyām—in the northwest; oṃ—Oṃ; kṛtavate—to Kṛtavat; namaḥ—salutation; uttarataḥ—in the north; oṃ—Oṃ; rāhave—to Rāhu; namaḥ—salutation; aiśānyām—in the northeast; oṃ—Oṃ; antarāya—to Antara; sūryātmane—whose self is the Sun; namaḥ—salutation; pūrvataḥ—in the east; oṃ—Oṃ; dhruvāya—to Dhruva; namaḥ—salutation; aiśānyām—in the northeast; oṃ—Oṃ; bhagavate—to the blessed one; pūṣan—O Pūṣan; mālin—garlanded; sakala-jagat-pate—lord of the whole world; sapta-aśva-vāhana—having seven horses as vehicle; bhū-bhuja—ruler of the earth; parama-siddhi-śirasi-gatam—gone to the summit of supreme attainment; gṛhṇa—receive; tejo-rūpam—the radiant form; ananta-jvāla—endless flame; 2—twice; āvāhana-mantraḥ—the invocation mantra; oṃ—Oṃ; namaḥ—salutation; bhagavate—to the blessed one; ādityāya—to Āditya; sahasra-kiraṇāya—to the thousand-rayed one; yathā-sukham—as desired; punar-āgamanāya—for returning again; iti—thus."]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1]}]));renderBhavishyaLiveChapter({chapter:215,verseCount:6,subtitle:"Chapter 215 — Solar Mantra Extraction",colophon:""},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body>
