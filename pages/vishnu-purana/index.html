<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Viṣṇu Purāṇa — Sanskrit, H. H. Wilson’s English translation, word-for-word material, transliteration, and Śrīdhara Bhāṣya.">
<title>Viṣṇu Purāṇa — Śrīdhara Bhāṣya — Viveka Dṛṣṭi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--outer:#2b261f;--paper:#f4f4f4;--ink:#3c362e;--muted:#756e67;--teal:#00787a;--purple:#65516f;--rule:#d8d3cd}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--outer);color:var(--ink);font-family:Merriweather,Georgia,serif}.topbar{width:1080px;max-width:100%;height:58px;margin:0 auto;padding:0 42px;display:flex;align-items:center;background:var(--paper);border-bottom:1px solid rgba(119,119,119,.12)}.topbar a{color:var(--teal);font-family:Vollkorn,Georgia,serif;font-size:20px;text-decoration:none}.page{width:1080px;max-width:100%;min-height:100vh;margin:0 auto;padding:50px 54px 82px;background:var(--paper)}.hero{width:700px;max-width:100%;margin:0 auto 44px;text-align:center}.hero h1{margin:0;color:var(--teal);font-family:Vollkorn,Georgia,serif;font-size:50px;font-weight:400;line-height:1.08}.hero:after{content:"";display:block;width:326px;max-width:50%;height:1px;margin:24px auto 0;background:var(--rule)}.reader{display:grid;grid-template-columns:210px minmax(0,700px);gap:38px;justify-content:center;align-items:start}.side{position:sticky;top:28px;padding-right:24px;border-right:1px solid var(--rule)}.side h2{margin:0 0 14px;color:var(--teal);font-family:Vollkorn,Georgia,serif;font-size:28px;font-weight:400}.side a{display:block;margin:0 0 7px;color:#5d554e;font-size:13px;line-height:1.35;text-decoration:none}.side a:hover{color:var(--purple)}.book{margin:0 0 32px}.book h3{margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--rule);color:#4a443e;font-family:Vollkorn,Georgia,serif;font-size:23px;font-weight:400}.chapter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 20px}.chapter-grid a{display:block;padding:7px 0;border-bottom:1px solid #e2ddd7;color:#4a443e;font-size:13px;line-height:1.45;text-decoration:none}.chapter-grid a:hover{color:var(--purple)}@media(max-width:900px){body{background:var(--paper)}.page{padding:38px 24px 68px}.reader{display:block;width:700px;max-width:100%;margin:0 auto}.side{position:static;margin:0 0 26px;padding:0 0 16px;border:0;border-bottom:1px solid var(--rule)}.side h2{font-size:23px;margin-bottom:8px}.side a{display:inline-block;margin-right:12px}.chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.topbar{height:50px;padding:0 18px}.topbar a{font-size:18px}.page{padding:30px 16px 56px}.hero h1{font-size:39px;line-height:1.1}.chapter-grid{grid-template-columns:1fr}.chapter-grid a{padding:10px 0;font-size:14px;line-height:1.5}.book{margin-bottom:30px}}
</style>
</head>
<body>
<header class="topbar"><a href="/advaita/">Viveka Dṛṣṭi</a></header>
<main class="page">
<header class="hero">
<h1>Viṣṇu Purāṇa — Śrīdhara Bhāṣya</h1>
</header>
<div class="reader">
<aside class="side"><h2>Contents</h2>
<a href="#book-1">Book 1</a><a href="#book-2">Book 2</a><a href="#book-3">Book 3</a><a href="#book-4">Book 4</a><a href="#book-5">Book 5</a><a href="#book-6">Book 6</a>
<a href="/advaita/">← Home</a>
</aside>
<section class="main"><div id="book-list"></div>
</section>
</div>
</main>
<script>
(()=>{const root=document.getElementById('book-list');if(!root)return;const books=[{book:1,name:'Creation and the origin of the universe',count:22},{book:2,name:'The earth and its regions',count:16},{book:3,name:'The Manus and Manvantaras',count:18},{book:4,name:'The royal dynasties',count:24},{book:5,name:'The life of Kṛṣṇa',count:38},{book:6,name:'Dissolution and liberation',count:8}];const base='/advaita/articles/vishnu-purana-book-';books.forEach(({book,name,count})=>{const section=document.createElement('section');section.className='book';section.id='book-'+book;const h=document.createElement('h3');h.textContent='Book '+book+(name?' — '+name:'');const grid=document.createElement('div');grid.className='chapter-grid';for(let chapter=1;chapter<=count;chapter+=1){const a=document.createElement('a');a.href=base+String(book)+'-chapter-'+String(chapter)+'/';a.textContent=book+'.'+chapter+' — Chapter '+chapter;grid.appendChild(a)}section.append(h,grid);root.appendChild(section)})})();
</script>
</body>
</html>
