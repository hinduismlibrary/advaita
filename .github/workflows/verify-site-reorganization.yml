name: Verify docs site organization
on:
  push:
    branches: [site-organization-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published paths and required assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          from xml.etree import ElementTree
          import re
          root=Path('docs')
          assert all((root/name).exists() for name in ('index.html','404.html','favicon.svg','sitemap.xml','articles','books','pages','assets','contact','puranas'))
          urls=[node.text for node in ElementTree.parse(root/'sitemap.xml').iter() if node.tag.endswith('loc') and node.text]
          missing=[]
          for url in urls:
              path=unquote(urlsplit(url).path).removeprefix('/advaita/').strip('/')
              choices=[root/path,root/path/'index.html',root/(path+'.html')] if path else [root/'index.html']
              if not any(x.is_file() for x in choices): missing.append(url)
          assert not missing, f'Missing sitemap URLs: {missing[:20]}'
          html=(root/'index.html').read_text()
          linked=re.findall(r'(?:href|src)\s*=\s*["\']([^"\']+)["\']',html)
          problems=[]
          for link in linked:
              if link.startswith(('#','https:','http:','//','mailto:','tel:','data:')): continue
              path=urlsplit(link).path.removeprefix('/advaita/').strip('/')
              target=root/path
              if not (target.is_file() or (target/'index.html').is_file() or (root/(path+'.html')).is_file()): problems.append(link)
          assert not problems, f'Missing local links on homepage: {problems}'
          print(f'PASS: {len(urls)} sitemap URLs, {len(linked)} homepage references')
          PY
      - name: Check active reader JavaScript syntax
        run: |
          node --check docs/assets/js/bhagavatam-sridhara-reader.js
          node --check docs/assets/js/article-reader-paged.js
          node --check docs/assets/js/shaiva-complete-reader.js
          echo "PASS: 3 active reader scripts. Existing syntax problems in unrelated scripts are tracked separately."
      - name: Build preview Pages output using Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site-preview
      - name: Verify built Pages routes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          from urllib.parse import unquote,urlsplit
          root=Path('_site-preview')
          urls=[x.text for x in ElementTree.parse('docs/sitemap.xml').iter() if x.tag.endswith('loc') and x.text]
          missing=[]
          for u in urls:
              p=unquote(urlsplit(u).path).removeprefix('/advaita/').strip('/')
              options=[root/p,root/p/'index.html',root/(p+'.html')] if p else [root/'index.html']
              if not any(x.is_file() for x in options): missing.append(u)
          assert not missing, f'Pages build omitted listed URLs: {missing[:20]}'
          for a in ('index.html','404.html','favicon.svg','sitemap.xml'):
              assert (root/a).is_file(), f'Pages build missing {a}'
          print(f'PASS: Jekyll build keeps all {len(urls)} sitemap routes and root resources')
          PY
