name: Validate complete static article readers
on:
  push:
    paths:
      - 'site/articles/**'
      - 'site/assets/js/article-standard.js'
      - 'site/assets/css/article-standard.css'
      - 'tools/article-content-audit.json'
      - 'tools/scripts/site-checks/**'
      - '.github/workflows/validate-full-scroll-readers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check reading enhancements
        run: node --check site/assets/js/article-standard.js
      - name: Check document quote and citation alignment
        run: python3 tools/scripts/site-checks/verify-quote-alignment.py
      - name: Prepare and validate all published pages
        run: |
          python3 tools/scripts/site-checks/prepare-site-deploy.py
          VERIFY_PREPARED=1 python3 tools/scripts/site-checks/verify-site-chrome.py
          python3 tools/scripts/site-checks/verify-site-integrity.py
