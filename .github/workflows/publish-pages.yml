name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Advaita reader data and routes
        run: python3 tools/scripts/site-checks/validate-shankara-reader-data.py
      - name: Verify every standardized reader and mirrored publication file
        run: node tools/scripts/site-checks/verify-advaita-reader-standardization.js
      - name: Recover stalled Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale="62cd733e9ca56b8ff6014b7c78f00260d1815805"
          state=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${stale}" --jq '.status' 2>/dev/null || true)
          echo "Previous Pages deployment status: ${state:-unavailable}"
          case "$state" in
            succeed|success|failed|cancelled|canceled)
              echo "Previous Pages deployment has completed."
              ;;
            *)
              echo "Attempting cancellation of the stalled Pages deployment."
              gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/deployments/${stale}/cancel" || true
              ;;
          esac
      - name: Wait briefly for legacy branch Pages workflow
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | sort_by(.created_at) | last | [.status // "pending", .conclusion // ""] | @tsv' || true)
            if [ -z "$state" ] && [ "$attempt" -ge 3 ]; then exit 0; fi
            read -r status conclusion <<< "$state"
            if [ "$status" = completed ]; then
              echo "Branch publisher finished (${conclusion:-unknown}); proceeding with Actions."
              exit 0
            fi
            sleep 5
          done
          echo "Branch publisher is slow; attempting the Actions deployment anyway."
      - name: Prepare site deployment
        run: python3 tools/scripts/site-checks/prepare-site-deploy.py
      - name: Verify prepared shared chrome on every page
        run: VERIFY_PREPARED=1 python3 tools/scripts/site-checks/verify-site-chrome.py
      - name: Validate routes, complete article content, and SEO
        run: python3 tools/scripts/site-checks/verify-site-integrity.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build local site search index
        run: npx --yes pagefind@1.5.2 --site site
      - name: Verify local search bundle
        run: test -s site/pagefind/pagefind.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published article routes
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          # Confirm the public landing page and Chapter 1 are reachable as well as
          # the previously checked article routes.
          for attempt in $(seq 1 12); do
            base="${PAGE_URL%/}"
            home_status=$(curl --location --silent --show-error --max-time 20 -o /tmp/vd-home.html -w '%{http_code}' "$base/" || true)
            chapter_status=$(curl --location --silent --show-error --max-time 20 -o /tmp/vd-chapter.html -w '%{http_code}' "$base/books/adi-shankaracharya/book-chapter.html?work=panchadasi&unit=panchadasi-1-01" || true)
            echo "Public site HTTP: ${home_status:-unreachable}; Pañcadaśī Chapter 1 HTTP: ${chapter_status:-unreachable} (attempt ${attempt}/12)"
            if [ "$home_status" != "200" ] || [ "$chapter_status" != "200" ] \
              || ! grep -Fq 'Vivekadrishti' /tmp/vd-home.html \
              || ! grep -Fq 'id="chapter-reader"' /tmp/vd-chapter.html; then
              sleep 10
              continue
            fi
            manuscript_url="${PAGE_URL%/}/articles/a-defence-of-the-manusmriti/"
            women_url="${PAGE_URL%/}/articles/hinduism-on-women/"
            if manuscript=$(curl --fail --silent --show-error --location --max-time 20 "$manuscript_url") \
              && women=$(curl --fail --silent --show-error --location --max-time 20 "$women_url") \
              && grep -Fq 'A Defence of the Manusmṛti' <<< "$manuscript" \
              && grep -Fq 'article-standard.css' <<< "$manuscript" \
              && grep -Fq 'women-reader-page' <<< "$women" \
              && grep -Fq 'women-reader-typography' <<< "$women" \
              && grep -Fq 'hinduism-on-women' <<< "$women"; then
              echo "Both published articles, including Hinduism on Women, are reachable."
              exit 0
            fi
            echo "Waiting for both published article routes (attempt ${attempt}/12)."
            sleep 10
          done
          echo "GitHub Pages did not serve both article routes after deployment." >&2
          exit 1

      - name: Verify every public Advaita contents route, legacy route, and source file
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          works="advaita-makaranda aparokshanubhuti atma-bodha atmavidya-vilasa upadesha-panchakam upadesha-sahasri ekashloki tattvabodha dashashloki drg-drsya-viveka naishkarmya-siddhi panchadasi panchikarana-prakarana brahmajnanavali-mala brahma-siddhi mandukya-karika vedantasara vivekachudamani svsss advaita-pancharatnam kashi-panchakam nirvana-shatkam bhaja-govindam manisha-panchakam maya-panchakam shatpadi-stotram yati-panchakam dakshinamurti-ashtakam hastamalaka-stotram"
          for work in $works; do
            contents_status=$(curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base/books/adi-shankaracharya/book-contents.html?work=$work" || true)
            source_status=$(curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base/assets/data/shankara/$work.json" || true)
            legacy_status=$(curl --location --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' "$base/books/adi-shankaracharya/$work/" || true)
            echo "$work contents=$contents_status source=$source_status legacy=$legacy_status"
            if [ "$contents_status" != "200" ] || [ "$source_status" != "200" ] || [ "$legacy_status" != "200" ]; then
              echo "A public route or source file is unavailable for $work." >&2
              exit 1
            fi
          done
          curl --fail --silent --show-error --location --max-time 20 "$base/assets/css/shankara-reader-standard.css" -o /dev/null
          curl --fail --silent --show-error --location --max-time 20 "$base/assets/js/shankara-reader-navigation.js" -o /dev/null
          curl --fail --silent --show-error --location --max-time 20 "$base/assets/js/shankara-reader-runtime.js" -o /dev/null
          echo "All 29 public contents pages, legacy reader URLs, source JSON files, and shared bundles are available."

