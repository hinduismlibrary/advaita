name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate Advaita reader data and routes
        run: python3 tools/scripts/site-checks/validate-shankara-reader-data.py
      - name: Wait for legacy branch Pages deployment if present
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Once Pages is configured to use Actions, there is no branch build to wait for.
          # Until then, allow the old automatic branch deployment to finish first.
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | sort_by(.created_at) | last | [.status // "pending", .conclusion // ""] | @tsv')
            if [ -z "$state" ]; then
              if [ "$attempt" -ge 3 ]; then
                echo 'No branch Pages run: proceeding with GitHub Actions publishing.'
                exit 0
              fi
              sleep 5
              continue
            fi
            read -r status conclusion <<< "$state"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ] || [ "$conclusion" = cancelled ]; then exit 0; fi
              echo "Legacy branch Pages deployment failed: ${conclusion:-unknown}" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Legacy branch Pages deployment did not complete in time' >&2
          exit 1
      - name: Prepare site deployment
        run: python3 tools/scripts/site-checks/prepare-site-deploy.py
      - name: Verify prepared shared chrome on every page
        run: VERIFY_PREPARED=1 python3 tools/scripts/site-checks/verify-site-chrome.py
      - name: Validate routes, complete article content, and SEO
        run: python3 tools/scripts/site-checks/verify-site-integrity.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build local site search index
        run: npx --yes pagefind@1.5.2 --site site
      - name: Verify local search bundle
        run: test -s site/pagefind/pagefind.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4


