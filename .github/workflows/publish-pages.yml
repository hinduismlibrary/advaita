name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  page_build:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Wait for branch Pages deployment
        if: ${{ github.event_name == 'page_build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '.workflow_runs | map(select(.name == "pages build and deployment")) | sort_by(.created_at) | last | .status // "pending"')
            if [ "$status" = completed ]; then exit 0; fi
            sleep 10
          done
          echo 'Timed out waiting for branch Pages deployment' >&2
          exit 1
      - name: Prepare site deployment
        run: python3 tools/scripts/site-checks/prepare-site-deploy.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build local site search index
        run: npx --yes pagefind@1.5.2 --site site
      - name: Verify local search bundle
        run: test -s site/pagefind/pagefind.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
