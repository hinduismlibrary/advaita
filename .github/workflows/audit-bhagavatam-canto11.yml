name: Audit Bhagavatam Canto 11 source mapping
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-bhagavatam-canto11.yml'
      - '.github/maintenance/scripts/audit_bhagavatam_canto11.py'
      - '.github/maintenance/scripts/reconcile_bhagavatam_canto11_verified.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct source-confirmed entries and retract unverified completion labels
        run: python .github/maintenance/scripts/reconcile_bhagavatam_canto11_verified.py
      - name: Collate all 31 chapters against pinned Sanskrit and English mirrors
        run: python .github/maintenance/scripts/audit_bhagavatam_canto11.py
      - name: Assemble complete pinned comparison corpus for manual review
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil, urllib.request, zipfile
          m = json.loads(Path('assets/data/bhagavatam-sridhara-reader-manifest.json').read_text())
          c = m['cantos']['11']
          pin = m['primary_sanskrit']['commit']
          root = Path('.github/maintenance/audit/canto11/pinned-review-bundle')
          root.mkdir(parents=True, exist_ok=True)
          for ch in range(1, 32):
              src = m['primary_sanskrit']['path_root'] + '/' + c['sridhara_paths'][str(ch)]
              eng = m['english_source']['mirror_path_root'] + '/' + c['english_path_template'].replace('{chapter2}', f'{ch:02d}').replace('{chapter}', str(ch))
              for kind, path in [('source', src), ('mirror', eng)]:
                  with urllib.request.urlopen('https://raw.githubusercontent.com/vishvAsa/purANam_vaiShNavam/' + pin + '/' + path, timeout=75) as response:
                      (root / f'{kind}-{ch:02d}.md').write_bytes(response.read())
          for f in Path('assets/data').glob('bhagavatam-sridhara-wfw-canto11-*.json'):
              shutil.copy2(f, root / f.name)
          for f in ['assets/js/bhagavatam-sridhara-reader.js', 'assets/js/bhagavatam-sridhara-clarity.js', 'assets/data/bhagavatam-sridhara-reader-manifest.json', 'assets/data/bhagavatam-sridhara-english-checkpoints.json']:
              shutil.copy2(f, root / Path(f).name)
          with zipfile.ZipFile('.github/maintenance/audit/canto11/pinned-review-bundle.zip', 'w', compression=zipfile.ZIP_DEFLATED) as z:
              for f in root.iterdir():
                  z.write(f, f.name)
          print('Source bundle ready, files:', len(list(root.iterdir())))
          PY
      - name: Store full verse mapping and flagged cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhagavatam-canto11-verse-audit
          path: .github/maintenance/audit/canto11/automated-*
          if-no-files-found: warn
      - name: Store complete pinned comparison corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bhagavatam-canto11-pinned-sources
          path: .github/maintenance/audit/canto11/pinned-review-bundle.zip
          if-no-files-found: error
      - name: Commit audited repairs and result
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/docs/BHAGAVATAM_COMPLETION.md articles/srimad-bhagavatam-canto-11-sridhara-svami/index.html
          git add assets/data/bhagavatam-sridhara-wfw-canto11-ch11-verses01-49.json assets/data/bhagavatam-sridhara-wfw-canto11-ch12-verses01-24.json assets/data/bhagavatam-sridhara-wfw-canto11-ch31-verses01-28.json
          git add .github/maintenance/audit/canto11/automated-summary.md .github/maintenance/audit/canto11/automated-summary.json .github/maintenance/audit/canto11/automated-verse-map.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Correct verified Canto 11 commentary errors and retract completion claim'
            git push
          fi
