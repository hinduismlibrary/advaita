name: Repair Other document pages
on:
  push:
    paths:
      - .github/workflows/repair-other-document-pages.yml
      - assets/js/article-reader-paged.js
      - assets/css/document-paged.css
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate reader and refresh all four manuscript pages
        run: |
          node --check assets/js/article-reader-paged.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          slugs = (
            'a-shashtric-lens-of-varna-part-one',
            'meat-eating-in-hinduism-through-the-lens-of-shastra',
            'a-vaishnava-lens-on-vishnu-as-the-supreme-deity',
            'a-shaiva-lens-on-shiva-as-the-supreme-deity',
          )
          static_slugs = {
            'a-shashtric-lens-of-varna-part-one',
            'a-shaiva-lens-on-shiva-as-the-supreme-deity',
          }
          for slug in slugs:
            if slug in static_slugs:
              print(f'Skipping static academic article: {slug}')
              continue
            path = Path('articles') / slug / 'index.html'
            html = path.read_text(encoding='utf-8')
            assert 'id="article-config"' in html, f'Missing article config: {path}'
            assert 'id="source-document"' in html, f'Missing manuscript: {path}'
            assert 'article-reader-paged.js' in html, f'Missing shared reader: {path}'
            assert 'document-paged.css' in html, f'Missing shared style: {path}'
            html, n = re.subn(r'(assets/js/article-reader-paged\.js)\?v=[^"\']+', r'\1?v=20261016-subcontent-nav-1', html)
            assert n == 1, f'Unexpected reader links in {path}: {n}'
            html, n = re.subn(r'(assets/css/document-paged\.css)\?v=[^"\']+', r'\1?v=20261016-subcontent-nav-1', html)
            assert n == 1, f'Unexpected style links in {path}: {n}'
            if 'id="other-document-noscript"' not in html:
              html=html.replace('</head>', '<noscript id="other-document-noscript"><style>#source-document[hidden]{display:block!important}#source-document .site-header,#source-document .site-footer{display:none!important}#source-document .article-body{max-width:652px;margin:auto;padding:24px}</style></noscript>\n</head>', 1)
            path.write_text(html, encoding='utf-8')
            print(f'Validated and refreshed: {path}')
          PY
          if ! git diff --quiet -- articles; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add articles/a-shashtric-lens-of-varna-part-one/index.html articles/meat-eating-in-hinduism-through-the-lens-of-shastra/index.html articles/a-vaishnava-lens-on-vishnu-as-the-supreme-deity/index.html articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html
            git commit -m 'Refresh all Other articles after shared PDF-reader repair'
            git push
          fi
