name: Review article reading and search
on:
  push:
    branches: [main]
    paths:
      - 'site/articles/**'
      - 'site/assets/css/article-standard.css'
      - 'site/assets/js/article-standard.js'
      - 'site/assets/js/site-search.js'
      - 'tools/scripts/site-checks/**'
      - 'tools/article-content-audit.json'
      - '.github/workflows/shaiva-visual-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare full site and search index
        run: |
          python3 tools/scripts/site-checks/prepare-site-deploy.py
          npx --yes pagefind@1.5.2 --site site
      - name: Install browser QA dependencies
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Check desktop, mobile, no-JavaScript reading, and search
        run: python3 tools/scripts/site-checks/article-browser-checks.py
      - name: Save article review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-reading-review
          path: article-review-output/
          retention-days: 7
