name: Review all seven document Contents layouts
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/shaiva-visual-review.yml
      - .github/workflows/validate-full-scroll-readers.yml
      - site/articles/a-case-for-the-scriptural-validity-of-the-agamas/index.html
      - site/articles/a-defence-of-the-manusmriti/index.html
      - site/articles/index.html
      - site/assets/pdfs/manusmriti-defence.pdf
      - site/sitemap.xml
      - site/articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html
      - site/articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/source-original.html
      - site/articles/a-shashtric-lens-of-varna-part-one/index.html
      - site/articles/a-vaishnava-lens-on-vishnu-as-the-supreme-deity/index.html
      - site/articles/hinduism-on-women/index.html
      - site/articles/meat-eating-in-hinduism-through-the-lens-of-shastra/index.html
      - site/articles/varna-vicara/index.html
      - site/articles/varna-vicara/preface.html
      - site/articles/varna-vicara/purvapaksha.html
      - site/articles/varna-vicara/rejection.html
      - site/assets/js/varna-vicara-paged.js
      - site/assets/js/article-reader-paged.js
      - site/assets/js/vishnu-source-restoration.js
      - site/assets/js/vishnu-editorial-enhancements.js
      - site/assets/css/vishnu-article-editorial.css
      - site/assets/css/site-chrome.css
      - site/assets/js/shaiva-complete-reader.js
      - site/assets/data/shaiva-manuscript.b64
      - site/assets/css/varna-vicara-paged.css
      - site/assets/css/article-reader-template.css
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Wait for this commit's Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq '[.workflow_runs[] | select(.name == "Deploy GitHub Pages")] | sort_by(.created_at) | last // {} | [.status // "pending", .conclusion // ""] | @tsv')
            read -r status conclusion <<< "$state"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then exit 0; fi
              echo "Pages deployment ended with conclusion: ${conclusion:-unknown}" >&2
              exit 1
            fi
            sleep 10
          done
          echo 'Timed out waiting for this commit's Pages deployment' >&2
          exit 1
      - name: Install browser QA dependencies
        run: |
          python3 -m pip install --user --quiet playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python3 -m playwright install chromium; fi
      - name: Verify full-scroll content and Contents across all seven documents
        env:
          PAGE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p /tmp/shaiva-qa
          python3 - <<'PY'
          import json, os, shutil, time
          from pathlib import Path
          from urllib.parse import quote, urlsplit
          from playwright.sync_api import sync_playwright
          
          out = Path('/tmp/shaiva-qa')
          root = 'https://hinduismlibrary.github.io/advaita/articles/'
          revision = os.environ.get('PAGE_REVISION', '')
          articles = [
            ('agamas', 'a-case-for-the-scriptural-validity-of-the-agamas'),
            ('shaiva', 'a-shaiva-lens-on-shiva-as-the-supreme-deity'),
            ('varna', 'a-shashtric-lens-of-varna-part-one'),
            ('vaishnava', 'a-vaishnava-lens-on-vishnu-as-the-supreme-deity'),
            ('women', 'hinduism-on-women'),
            ('meat', 'meat-eating-in-hinduism-through-the-lens-of-shastra'),
            ('varna-vicara', 'varna-vicara'),
          ]
          expected_article_images = {
            'agamas': {'cover.webp'},
            'shaiva': {'shaiva-original-cover.webp'},
            'varna': {'varna-cover-art.webp', 'varna-om.webp'},
            'vaishnava': {'vishnu-lakshmi.webp', 'vishnu-veda-divisions.webp', 'vishnu-smriti-sources.webp', 'vishnu-emblem.webp'},
            'women': {'cover-art.webp', 'dress-code-diagram.webp', 'daily-ornaments-diagram.webp', 'ornaments-diagram.webp'},
            'meat': {'om-cover.png'},
            'varna-vicara': set()
          }
          
          def versioned(url, attempt):
            query = 'qa-attempt=' + str(attempt)
            if revision:
              query += '&rev=' + quote(revision)
            return url + ('&' if '?' in url else '?') + query
          
          def open_reader(page, url, errors):
            deadline = time.monotonic() + 120
            attempt = 0
            last_status = None
            last_error = ''
            last_state = {}
            while time.monotonic() < deadline:
              attempt += 1
              errors.clear()
              try:
                response = page.goto(versioned(url, attempt), wait_until='domcontentloaded', timeout=45000)
                last_status = response.status if response else None
                page.wait_for_timeout(500)
                ready = page.evaluate("""() => {
                  const article = document.querySelector('#source-content');
                  const sections = article ? article.querySelectorAll(':scope > .document-section').length : 0;
                  const status = document.querySelector('.page-context span, #section-count')?.textContent.trim() || '';
                  const readerScript = performance.getEntriesByType('resource').map(resource=>resource.name).find(url=>/(?:article-reader-paged|shaiva-complete-reader|varna-vicara-paged)\.js(?:\?|$)/.test(url)) || '';
                  const sharedStyle = document.querySelector('link[href*="article-reader-template.css"]');
                  const contentReady = !!article && sections >= 3 && status === 'Full document' && article.innerText.trim().length >= 5000;
                  const readerVersion = location.pathname.includes('/a-shaiva-lens-on-shiva-as-the-supreme-deity/') ? '20261030-shaiva-outline-fallback-3' : location.pathname.includes('/varna-vicara/') ? '20261027-full-scroll-3' : '20261030-source-quote-order-2';
                  const tocLink = document.querySelector('.toc-index-link');
                  const tocTransition = tocLink && getComputedStyle(tocLink).transitionProperty.split(',').map(value=>value.trim()).includes('color');
                  const smoothScroll = getComputedStyle(document.documentElement).scrollBehavior === 'smooth';
                  const editorialStyle = document.querySelector('link[href*="vishnu-article-editorial.css"]');
                  const usesEditorialTemplate = true;
                  const editorialReady = !usesEditorialTemplate ||
                    (editorialStyle?.href.includes('20261030-vishnu-citations-11') && !!editorialStyle.sheet);
                  const chromeStyle = document.querySelector('link[href*="site-chrome.css"]');
                  const chromeReady = !usesEditorialTemplate ||
                    (chromeStyle?.href.includes('20261029-vishnu-exception-1') && !!chromeStyle.sheet && document.body.classList.contains('vishnu-editorial-reader'));
                  const enhancementScript = document.querySelector('script[src*="vishnu-editorial-enhancements.js"]');
                  const enhancementReady = !usesEditorialTemplate ||
                    enhancementScript?.src.includes('20261030-vishnu-citations-10');
                  const assetsReady = sharedStyle?.href.includes('20261030-shared-reader-refresh-1') &&
                    readerScript.includes(readerVersion) && contentReady && smoothScroll && tocTransition && editorialReady && chromeReady && enhancementReady;
                  return assetsReady;
                }""")
                last_state = page.evaluate("""() => {
                  const article = document.querySelector('#source-content');
                  const readerScript = performance.getEntriesByType('resource').map(resource=>resource.name).find(url=>/(?:article-reader-paged|shaiva-complete-reader|varna-vicara-paged)\\.js(?:\\?|$)/.test(url)) || '';
                  const editorialStyle=document.querySelector('link[href*="vishnu-article-editorial.css"]');
                  const chromeStyle=document.querySelector('link[href*="site-chrome.css"]');
                  const enhancementScript=document.querySelector('script[src*="vishnu-editorial-enhancements.js"]');
                  const tocLink=document.querySelector('.toc-index-link');
                  return {
                    readiness:{editorialHref:editorialStyle?.href||'',editorialSheet:!!editorialStyle?.sheet,chromeHref:chromeStyle?.href||'',chromeSheet:!!chromeStyle?.sheet,enhancementSrc:enhancementScript?.src||'',bodyClass:document.body.className,tocTransition:tocLink?getComputedStyle(tocLink).transitionProperty:'',scrollBehavior:getComputedStyle(document.documentElement).scrollBehavior},
                    title: document.title,
                    pageText: document.body?.innerText?.slice(0,300) || '',
                    status: document.querySelector('.page-context span, #section-count')?.textContent.trim() || '',
                    sections: article ? article.querySelectorAll(':scope > .document-section').length : 0,
                    textChars: article?.innerText.trim().length || 0,
                    readerScript: performance.getEntriesByType('resource').map(resource=>resource.name).find(url=>/(?:article-reader-paged|shaiva-complete-reader|varna-vicara-paged)\\.js(?:\\?|$)/.test(url)) || '',
                    sharedStyle: document.querySelector('link[href*="article-reader-template.css"]')?.href || ''
                  };
                }""")
                last_state['pageErrors']=errors[-10:]
                if response and response.status == 200 and ready:
                  page.evaluate("""async () => {
                    const images=[...document.querySelectorAll('img')];
                    images.forEach(image=>image.loading='eager');
                    await Promise.all(images.map(image=>image.decode().catch(()=>null)));
                  }""")
                  return response
              except Exception as error:
                last_error = str(error)
              time.sleep(3)
            raise AssertionError('The full-scroll article did not finish deploying: ' + url +
              '; last HTTP=' + str(last_status) +
              '; state=' + json.dumps(last_state, ensure_ascii=False) +
              '; error=' + last_error)

          def metrics(page):
            return page.evaluate("""() => {
              const article = document.querySelector('#source-content');
              const sections = [...article.querySelectorAll(':scope > .document-section')];
              const sectionLengths = sections.map(section => ({
                title: section.querySelector('h3')?.textContent.trim() || '',
                visibleChars: section.innerText.trim().length,
                allChars: section.textContent.trim().length
              }));
              const nav = document.querySelector('.side-toc .toc') || document.querySelector('.mobile-toc .toc');
              const links = nav ? [...nav.querySelectorAll('a.toc-index-link')] : [];
              const broken = links.filter(link => {
                try {
                  const id = decodeURIComponent(new URL(link.href).hash.slice(1));
                  return !id || !document.getElementById(id);
                } catch { return true; }
              });
              const sourceSections = sections.filter(section => /^sources(?: and tables)?$/i.test(section.querySelector('h3')?.textContent.trim() || ''));
              const paragraphs = [...article.querySelectorAll('p')].filter(p =>
                !p.closest('details') &&
                !p.matches('.reference,.source-citation,.scripture-source,.citation,.translation,.scripture-translation,.women-scripture-translation,.sanskrit-text') &&
                !p.closest('.source-page-body')
              );
              const paragraph = paragraphs[0] || article.querySelector('p');
              const quote = article.querySelector('p.translation,p.scripture-translation,blockquote.translation,blockquote.scripture-translation,.women-scripture-translation');
              const sectionHeading = article.querySelector('h3.document-section-title');
              const pStyle = paragraph ? getComputedStyle(paragraph) : null;
              const qStyle = quote ? getComputedStyle(quote) : null;
              const hStyle = sectionHeading ? getComputedStyle(sectionHeading) : null;
              const sourceSelector='p.reference,p.source-citation,p.scripture-source,p.citation';
              const sanskritSelector='details.sanskrit-reveal:not(.quote-source-note),p[lang^="sa"],.sanskrit-text';
              const translationSelector='p.translation,p.scripture-translation,.women-scripture-translation,blockquote.translation,blockquote.scripture-translation';
              const quotePairs=[...article.querySelectorAll('.scripture-quote-pair,.women-scripture-pair')];
              const quoteGroups=quotePairs.filter(pair=>pair.querySelector(sanskritSelector)&&pair.querySelector(translationSelector));
              const sourceNodeSelector=':scope > p.reference,:scope > p.source-citation,:scope > p.scripture-source,:scope > p.citation';
              const citedQuoteGroups=quoteGroups.filter(pair=>pair.querySelector(sourceNodeSelector));
              const uncitedQuoteGroups=quoteGroups.filter(pair=>!pair.querySelector(sourceNodeSelector)).map(pair=>{
                const previous=[];
                let cursor=pair.previousElementSibling,depth=0;
                while(cursor&&depth<4){
                  previous.push({tag:cursor.tagName,className:typeof cursor.className==='string'?cursor.className:'',text:(cursor.innerText||'').trim().slice(0,220)});
                  cursor=cursor.previousElementSibling;depth++;
                }
                return {text:pair.innerText.trim().slice(0,140),previous};
              });
              const citationExamples=citedQuoteGroups.flatMap(pair=>[...pair.querySelectorAll(sourceNodeSelector)].map(node=>node.textContent.trim()));
              const translationPairs=quotePairs.filter(pair=>pair.querySelector(translationSelector));
              const uncitedTranslationGroups=translationPairs.filter(pair=>!pair.querySelector(sourceNodeSelector)).map(pair=>pair.innerText.trim().slice(0,180));
              const articleLinks=[...article.querySelectorAll('a[href]')].map(link=>({href:link.href,text:link.innerText.trim().slice(0,100)}));
              const brokenPageLinks=articleLinks.filter(item=>{
                try {
                  const url=new URL(item.href,location.href);
                  if(url.origin!==location.origin||!url.hash||url.pathname!==location.pathname)return false;
                  return !document.getElementById(decodeURIComponent(url.hash.slice(1)));
                } catch { return true; }
              });
              const citationNode=article.querySelector('p.reference,p.source-citation,p.scripture-source,p.citation');
              const citationColor=citationNode?getComputedStyle(citationNode).color:'';
              const contentsLinkColor=links[0]?getComputedStyle(links[0]).color:'';
              const articleImages=[...document.querySelectorAll('img')];
              const articleImageSources=articleImages.map(image=>new URL(image.currentSrc||image.src,location.href).pathname.split('/').pop());
              const articleImageIssues=articleImages.filter(image=>{
                const box=image.getBoundingClientRect();
                const naturalRatio=image.naturalWidth&&image.naturalHeight?image.naturalWidth/image.naturalHeight:0;
                const renderedRatio=box.width&&box.height?box.width/box.height:0;
                return !image.alt.trim()||!image.complete||!image.naturalWidth||!image.naturalHeight||Math.abs(naturalRatio-renderedRatio)>0.03||box.right>window.innerWidth+1;
              }).map(image=>({src:image.currentSrc||image.src,alt:image.alt,complete:image.complete,naturalWidth:image.naturalWidth,naturalHeight:image.naturalHeight,renderedWidth:image.getBoundingClientRect().width,renderedHeight:image.getBoundingClientRect().height}));
              const captionIssues=[...document.querySelectorAll('figcaption')].filter(caption=>{
                const figure=caption.closest('figure');
                return !figure||!figure.querySelector('img');
              }).map(caption=>caption.textContent.trim());
              const meatCitation=[...article.querySelectorAll('p.reference,p.source-citation,p.citation')]
                .find(node=>/Yajurveda\s+22\.42/i.test(node.textContent));
              const meatCitationStyle=meatCitation?{
                text:meatCitation.textContent.trim(),
                className:meatCitation.className,
                italic:getComputedStyle(meatCitation).fontStyle,
                emphasized:!!meatCitation.querySelector('em,i')
              }:null;
              const scriptureSourceLabels=article.querySelectorAll('p.scripture-source').length;
              const quoteKind=node=>node.matches(sourceSelector)?'source':node.matches(sanskritSelector)?'sanskrit':node.matches(translationSelector)?'translation':null;
              const quoteOrderErrors=quoteGroups.filter(pair=>{
                const orderedKinds=[...pair.children].map(child=>({child,kind:quoteKind(child)})).filter(item=>item.kind)
                  .sort((a,b)=>Number(getComputedStyle(a.child).order)-Number(getComputedStyle(b.child).order))
                  .map(item=>item.kind);
                const visual=orderedKinds.filter((kind,index)=>kind!==orderedKinds[index-1]);
                return visual.join(',')!=='source,translation,sanskrit';
              }).map(pair=>pair.innerText.trim().slice(0,140));
              const sourceDisclosures=[...article.querySelectorAll('.document-section:not(.document-reference-section) details.sanskrit-reveal:not(.quote-source-note)')]
                .filter(details=>/[\\u0900-\\u097f]/.test(details.textContent));
              const badDisclosureLabels=sourceDisclosures.filter(details=>{
                const summary=details.querySelector(':scope > summary');
                return summary&&!/^(?:Show|Hide) Sanskrit$/.test(summary.textContent.trim());
              }).length;
              const sanskritToggleAvailable=sourceDisclosures.length>0&&sourceDisclosures.every(details=>{const summary=details.querySelector(':scope > summary');return !details.open&&summary?.textContent.trim()==='Show Sanskrit';});
              const translationCandidates=[...article.querySelectorAll(translationSelector+',p')].filter(node=>
                (node.matches(translationSelector)||/^[“"'‘]/u.test(node.textContent.trim()))&&!node.closest('.source-page-body'));
              const unpairedTranslationNodes=translationCandidates.filter(node=>!node.closest('.scripture-quote-pair,.women-scripture-pair'));
              const unpairedTranslations=unpairedTranslationNodes.length;
              const unpairedTranslationExamples=unpairedTranslationNodes.map(node=>({
                text:node.textContent.trim().slice(0,260),
                previous:node.previousElementSibling?.textContent.trim().slice(0,180)||'',
                next:node.nextElementSibling?.textContent.trim().slice(0,180)||''
              }));
              const editorialNotes=article.querySelectorAll('.editorial-note,.quote-source-note,.translation-note').length;
              return {
                status: document.querySelector('.page-context span, #section-count')?.textContent.trim() || '',
                sections: sections.length,
                sectionLengths,
                textLength: article.innerText.trim().length,
                links: links.length,
                broken: broken.map(link => link.textContent.trim()),
                sourceSections: sourceSections.length,
                pageNav: !!document.querySelector('.page-nav,#page-prev,#page-next'),
                scrollWidth: document.documentElement.scrollWidth,
                width: window.innerWidth,
                paragraphStyle: pStyle ? {fontFamily:pStyle.fontFamily,fontSize:pStyle.fontSize} : null,
                quoteStyle: qStyle ? {fontSize:qStyle.fontSize,color:qStyle.color,borderLeftWidth:qStyle.borderLeftWidth} : null,
                headingStyle: hStyle ? {fontFamily:hStyle.fontFamily,fontSize:hStyle.fontSize} : null,
                quoteGroups: quoteGroups.length,
                citationGroups: citedQuoteGroups.length,
                uncitedQuoteGroups,
                citationExamples,
                quoteOrderErrors,
                articleImages: articleImages.length,
                articleImageSources,
                articleImageIssues,
                captionIssues,
                scriptureSourceLabels,
                meatCitationStyle,
                sanskritDisclosures: sourceDisclosures.length,
                badDisclosureLabels,
                sanskritToggleAvailable,
                unpairedTranslations,
                unpairedTranslationExamples,
                uncitedTranslationGroups,
                brokenPageLinks:brokenPageLinks.map(item=>item.text||item.href),
                articleLinks,
                citationColor,
                contentsLinkColor,
                editorialNotes
              };
            }""")
          
          def scroll_candidates(page, toc_selector):
            return page.evaluate("""selector => {
              const nav = document.querySelector(selector);
              if (!nav) return [];
              const links = [...nav.querySelectorAll('a.toc-index-link')];
              const visibleTarget = link => {
                const id = link.dataset.subsection || (() => {
                  try { return decodeURIComponent(new URL(link.href).hash.slice(1)); }
                  catch { return ''; }
                })();
                const target = id && document.getElementById(id);
                return target && target.getClientRects().length ? id : '';
              };
              const subsections = links.filter(link => link.dataset.subsection && visibleTarget(link));
              let chosen = [];
              if (subsections.length) {
                chosen = [subsections[0], subsections[subsections.length - 1]];
              } else {
                const roots = links.filter(link => !link.dataset.subsection && visibleTarget(link));
                chosen = [roots[0], roots[roots.length - 1]];
              }
              const seen = new Set();
              return chosen.map(link => {
                const id = visibleTarget(link);
                const item = link.dataset.subsection
                  ? {kind:'sub',id}
                  : {kind:'root',id,group:link.dataset.group || '',section:link.dataset.section || ''};
                const key = JSON.stringify(item);
                if (!id || seen.has(key)) return null;
                seen.add(key);
                return item;
              }).filter(Boolean);
            }""", toc_selector)
          
          def verify_article_links(page, label, article_links, cache):
            broken = []
            unavailable = []
            checked = set()
            current_page = urlsplit(page.url)
            for item in article_links:
              href = item['href']
              parsed = urlsplit(href)
              if parsed.scheme.lower() not in ('http', 'https'):
                continue
              if (parsed.scheme.lower() == current_page.scheme.lower() and
                  parsed.netloc.lower() == current_page.netloc.lower() and
                  parsed.path == current_page.path):
                continue
              target = href.split('#', 1)[0]
              if not target or target in checked:
                continue
              checked.add(target)
              if target not in cache:
                status = 0
                error = ''
                for attempt in range(2):
                  try:
                    response = page.request.head(target, timeout=12000, max_redirects=5)
                    status = response.status
                    if status in (404, 405, 410, 501):
                      response = page.request.get(target, timeout=12000, max_redirects=5, headers={'Range':'bytes=0-0'})
                      status = response.status
                    if status >= 500 and attempt == 0:
                      continue
                    break
                  except Exception as exc:
                    error = str(exc)
                    if attempt == 1:
                      status = 0
                cache[target] = {'status':status,'error':error}
              result = cache[target]
              status = result['status']
              entry = {'url':target,'status':status,'text':item['text']}
              if status in (404, 410):
                broken.append(entry)
              elif status == 0 or status in (401, 403, 429) or status >= 500:
                entry['error'] = result['error']
                unavailable.append(entry)
            return {'checked':len(checked),'broken':broken,'unavailable':unavailable}

          def verify_sanskrit_disclosure(page, label):
            disclosures = page.locator('#source-content .document-section:not(.document-reference-section) details.sanskrit-reveal:not(.quote-source-note)').filter(has=page.locator('[lang^="sa"]'))
            count = disclosures.count()
            assert count, f'{label}: Sanskrit disclosure is missing'
            for index in range(count):
              disclosure = disclosures.nth(index)
              summary = disclosure.locator(':scope > summary')
              assert summary.inner_text().strip() == 'Show Sanskrit', f'{label}: Sanskrit disclosure {index + 1} label is not standardized'
              handle = disclosure.element_handle()
              summary.focus()
              summary.press('Enter')
              page.wait_for_function("(element) => element.open && element.querySelector(':scope > summary').textContent.trim() === 'Hide Sanskrit'", arg=handle, timeout=5000)
              summary.press('Enter')
              page.wait_for_function("(element) => !element.open && element.querySelector(':scope > summary').textContent.trim() === 'Show Sanskrit'", arg=handle, timeout=5000)
            return count

          def verify_scrollspy(page, label, mobile=False):
            selector = '.mobile-toc .toc' if mobile else '.side-toc .toc'
            if mobile:
              page.evaluate("""() => { const toc=document.querySelector('.mobile-toc'); if(toc)toc.open=true; }""")
            samples = scroll_candidates(page, selector)
            assert samples, f'{label}: Contents has no valid scroll targets'
            for sample in samples:
              page.evaluate('id => document.getElementById(id).scrollIntoView({block:"start"})', sample['id'])
              try:
                page.wait_for_function("""sample => {
                  const nav = document.querySelector(innerWidth < 900 ? '.mobile-toc .toc' : '.side-toc .toc');
                  if (!nav) return false;
                  const active = [...nav.querySelectorAll('a.toc-index-link.is-active, a.toc-index-link.is-active-subsection')];
                  if (active.length !== 1) return false;
                  return active.some(link => {
                    if (sample.kind === 'sub')
                      return link.classList.contains('is-active-subsection') && link.dataset.subsection === sample.id;
                    if (link.dataset.subsection) return false;
                    const key = sample.group || sample.section;
                    return link.classList.contains('is-active') &&
                      (sample.group ? link.dataset.group === sample.group : link.dataset.section === sample.section);
                  });
                }""", arg=sample, timeout=15000)
                expected_color = 'rgb(50, 100, 102)'
                page.wait_for_function("""({selector,color}) => {
                  const active=document.querySelector(selector+' a.toc-index-link.is-active, '+selector+' a.toc-index-link.is-active-subsection');
                  return active && getComputedStyle(active).color===color;
                }""", arg={'selector':selector,'color':expected_color}, timeout=7000)
                visual = page.evaluate("""selector => {
                  const nav=document.querySelector(selector);
                  const active=nav?.querySelector('a.toc-index-link.is-active, a.toc-index-link.is-active-subsection');
                  if(!active)return null;
                  const style=getComputedStyle(active);
                  return {
                    color:style.color,
                    weight:style.fontWeight,
                    background:style.backgroundColor,
                    borderColor:style.borderLeftColor,
                    borderWidth:style.borderLeftWidth,
                    transition:style.transitionProperty.split(',').map(value=>value.trim()),
                    scroll:getComputedStyle(document.documentElement).scrollBehavior
                  };
                }""", selector)
                expected_weight = '700'
