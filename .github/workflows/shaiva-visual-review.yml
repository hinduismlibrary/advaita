name: Review all six article Contents layouts
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/shaiva-visual-review.yml
      - .github/workflows/validate-full-scroll-readers.yml
      - site/articles/a-case-for-the-scriptural-validity-of-the-agamas/index.html
      - site/articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html
      - site/articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/source-original.html
      - site/articles/a-shashtric-lens-of-varna-part-one/index.html
      - site/articles/a-vaishnava-lens-on-vishnu-as-the-supreme-deity/index.html
      - site/articles/hinduism-on-women/index.html
      - site/articles/meat-eating-in-hinduism-through-the-lens-of-shastra/index.html
      - site/assets/js/article-reader-paged.js
      - site/assets/js/vishnu-source-restoration.js
      - site/assets/js/shaiva-complete-reader.js
      - site/assets/data/shaiva-manuscript.b64
      - site/assets/css/varna-vicara-paged.css
      - site/assets/css/article-reader-template.css
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Install browser QA dependencies
        run: |
          python3 -m pip install --user --quiet playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then python3 -m playwright install chromium; fi
      - name: Verify full-scroll content and Contents across all six articles
        env:
          PAGE_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p /tmp/shaiva-qa
          python3 - <<'PY'
          import json, os, shutil, time
          from pathlib import Path
          from urllib.parse import quote
          from playwright.sync_api import sync_playwright
          
          out = Path('/tmp/shaiva-qa')
          root = 'https://krishnavyasmuni.github.io/advaita/articles/'
          revision = os.environ.get('PAGE_REVISION', '')
          articles = [
            ('agamas', 'a-case-for-the-scriptural-validity-of-the-agamas'),
            ('shaiva', 'a-shaiva-lens-on-shiva-as-the-supreme-deity'),
            ('varna', 'a-shashtric-lens-of-varna-part-one'),
            ('vaishnava', 'a-vaishnava-lens-on-vishnu-as-the-supreme-deity'),
            ('women', 'hinduism-on-women'),
            ('meat', 'meat-eating-in-hinduism-through-the-lens-of-shastra'),
          ]
          
          def versioned(url, attempt):
            query = 'qa-attempt=' + str(attempt)
            if revision:
              query += '&rev=' + quote(revision)
            return url + ('&' if '?' in url else '?') + query
          
          def open_reader(page, url, errors):
            deadline = time.monotonic() + 120
            attempt = 0
            last_status = None
            last_error = ''
            last_state = {}
            while time.monotonic() < deadline:
              attempt += 1
              errors.clear()
              try:
                response = page.goto(versioned(url, attempt), wait_until='domcontentloaded', timeout=45000)
                last_status = response.status if response else None
                page.wait_for_timeout(500)
                ready = page.evaluate("""() => {
                  const article = document.querySelector('#source-content');
                  const sections = article ? article.querySelectorAll(':scope > .document-section').length : 0;
                  const status = document.querySelector('.page-context span, #section-count')?.textContent.trim() || '';
                  const readerScript = performance.getEntriesByType('resource').map(resource=>resource.name).find(url=>/(?:article-reader-paged|shaiva-complete-reader)\.js(?:\?|$)/.test(url)) || '';
                  const sharedStyle = document.querySelector('link[href*="article-reader-template.css"]');
                  const contentReady = !!article && sections >= 3 && status === 'Full document' && article.innerText.trim().length >= 5000;
                  const readerVersion = location.pathname.includes('/a-shaiva-lens-on-shiva-as-the-supreme-deity/') ? '20261026-shaiva-citation-3' : '20261027-document-cleanup-4';
                  const assetsReady = sharedStyle?.href.includes('20261027-document-template-2') && readerScript.includes(readerVersion) && contentReady;
                  return assetsReady;
                }""")
                last_state = page.evaluate("""() => {
                  const article = document.querySelector('#source-content');
                  const readerScript = performance.getEntriesByType('resource').map(resource=>resource.name).find(url=>/(?:article-reader-paged|shaiva-complete-reader)\\.js(?:\\?|$)/.test(url)) || '';
                  return {
                    title: document.title,
                    pageText: document.body?.innerText?.slice(0,300) || '',
                    status: document.querySelector('.page-context span, #section-count')?.textContent.trim() || '',
                    sections: article ? article.querySelectorAll(':scope > .document-section').length : 0,
                    textChars: article?.innerText.trim().length || 0,
                    readerScript: performance.getEntriesByType('resource').map(resource=>resource.name).find(url=>/(?:article-reader-paged|shaiva-complete-reader)\\.js(?:\\?|$)/.test(url)) || '',
                    sharedStyle: document.querySelector('link[href*="article-reader-template.css"]')?.href || ''
                  };
                }""")
                if response and response.status == 200 and ready:
                  page.evaluate("""async () => {
                    const images=[...document.querySelectorAll('#source-content figure.source-document-figure img')];
                    images.forEach(image=>image.loading='eager');
                    await Promise.all(images.map(image=>image.decode().catch(()=>null)));
                  }""")
                  return response
              except Exception as error:
                last_error = str(error)
              time.sleep(3)
            raise AssertionError('The full-scroll article did not finish deploying: ' + url +
              '; last HTTP=' + str(last_status) +
              '; state=' + json.dumps(last_state, ensure_ascii=False) +
              '; error=' + last_error)

          def metrics(page):
            return page.evaluate("""() => {
              const article = document.querySelector('#source-content');
              const sections = [...article.querySelectorAll(':scope > .document-section')];
              const sectionLengths = sections.map(section => ({
                title: section.querySelector('h3')?.textContent.trim() || '',
                visibleChars: section.innerText.trim().length,
                allChars: section.textContent.trim().length
              }));
              const nav = document.querySelector('.side-toc .toc') || document.querySelector('.mobile-toc .toc');
              const links = nav ? [...nav.querySelectorAll('a.toc-index-link')] : [];
              const broken = links.filter(link => {
                try {
                  const id = decodeURIComponent(new URL(link.href).hash.slice(1));
                  return !id || !document.getElementById(id);
                } catch { return true; }
              });
              const sourceSections = sections.filter(section => /^sources$/i.test(section.querySelector('h3')?.textContent.trim() || ''));
              const paragraphs = [...article.querySelectorAll('p')].filter(p =>
                !p.closest('details') &&
                !p.matches('.reference,.source-citation,.scripture-source,.citation,.translation,.scripture-translation,.women-scripture-translation,.sanskrit-text') &&
                !p.closest('.source-page-body')
              );
              const paragraph = paragraphs[0] || article.querySelector('p');
              const quote = article.querySelector('p.translation,p.scripture-translation,blockquote.translation,blockquote.scripture-translation,.women-scripture-translation');
              const sectionHeading = article.querySelector('h3.document-section-title');
              const pStyle = paragraph ? getComputedStyle(paragraph) : null;
              const qStyle = quote ? getComputedStyle(quote) : null;
              const hStyle = sectionHeading ? getComputedStyle(sectionHeading) : null;
              const sourceSelector='p.reference,p.source-citation,p.scripture-source,p.citation';
              const sanskritSelector='details.sanskrit-reveal:not(.quote-source-note),p[lang^="sa"],.sanskrit-text';
              const translationSelector='p.translation,p.scripture-translation,.women-scripture-translation,blockquote.translation,blockquote.scripture-translation';
              const quotePairs=[...article.querySelectorAll('.scripture-quote-pair,.women-scripture-pair')];
              const quoteGroups=quotePairs.filter(pair=>pair.querySelector(sanskritSelector)&&pair.querySelector(translationSelector));
              const sourceNodeSelector=':scope > p.reference,:scope > p.source-citation,:scope > p.scripture-source,:scope > p.citation';
              const citedQuoteGroups=quoteGroups.filter(pair=>pair.querySelector(sourceNodeSelector));
              const uncitedQuoteGroups=quoteGroups.filter(pair=>!pair.querySelector(sourceNodeSelector)).map(pair=>{
                const previous=[];
                let cursor=pair.previousElementSibling,depth=0;
                while(cursor&&depth<4){
                  previous.push({tag:cursor.tagName,className:typeof cursor.className==='string'?cursor.className:'',text:(cursor.innerText||'').trim().slice(0,220)});
                  cursor=cursor.previousElementSibling;depth++;
                }
                return {text:pair.innerText.trim().slice(0,140),previous};
              });
              const citationExamples=citedQuoteGroups.flatMap(pair=>[...pair.querySelectorAll(sourceNodeSelector)].map(node=>node.textContent.trim()));
              const sourceDiagramImages=[...article.querySelectorAll('figure.source-document-figure img')];
              const sourceDiagramIssues=sourceDiagramImages.filter(image=>{
                const box=image.getBoundingClientRect();
                const naturalRatio=image.naturalWidth&&image.naturalHeight?image.naturalWidth/image.naturalHeight:0;
                const renderedRatio=box.width&&box.height?box.width/box.height:0;
                return !image.alt.trim()||!image.complete||!image.naturalWidth||!image.naturalHeight||Math.abs(naturalRatio-renderedRatio)>0.03;
              }).map(image=>({src:image.currentSrc||image.src,alt:image.alt,complete:image.complete,naturalWidth:image.naturalWidth,naturalHeight:image.naturalHeight}));
              const meatCitation=[...article.querySelectorAll('p.reference,p.source-citation,p.citation')]
                .find(node=>/Yajurveda\s+22\.42/i.test(node.textContent));
              const meatCitationStyle=meatCitation?{
                text:meatCitation.textContent.trim(),
                className:meatCitation.className,
                italic:getComputedStyle(meatCitation).fontStyle,
                emphasized:!!meatCitation.querySelector('em,i')
              }:null;
              const scriptureSourceLabels=article.querySelectorAll('p.scripture-source').length;
              const orderRank=node=>node.matches(sourceSelector)?0:node.matches(sanskritSelector)?1:node.matches(translationSelector)?2:9;
              const quoteOrderErrors=quoteGroups.filter(pair=>{
                const ranks=[...pair.children].map(orderRank).filter(rank=>rank<9);
                return ranks.some((rank,index)=>index>0&&rank<ranks[index-1]);
              }).map(pair=>pair.innerText.trim().slice(0,140));
              const sourceDisclosures=[...article.querySelectorAll('.document-section:not(.document-reference-section) details.sanskrit-reveal:not(.quote-source-note)')]
                .filter(details=>/[\\u0900-\\u097f]/.test(details.textContent));
              const badDisclosureLabels=sourceDisclosures.filter(details=>! /^(?:Show|Hide) Sanskrit$/.test(details.querySelector(':scope > summary')?.textContent.trim()||'')).length;
              const translationCandidates=[...article.querySelectorAll(translationSelector+',p')].filter(node=>
                (node.matches(translationSelector)||/^[“"'‘]/u.test(node.textContent.trim()))&&!node.closest('.source-page-body'));
              const unpairedTranslations=translationCandidates.filter(node=>!node.closest('.scripture-quote-pair,.women-scripture-pair')).length;
              const editorialNotes=article.querySelectorAll('.editorial-note,.quote-source-note,.translation-note').length;
              return {
                status: document.querySelector('.page-context span, #section-count')?.textContent.trim() || '',
                sections: sections.length,
                sectionLengths,
                textLength: article.innerText.trim().length,
                links: links.length,
                broken: broken.map(link => link.textContent.trim()),
                sourceSections: sourceSections.length,
                pageNav: !!document.querySelector('.page-nav,#page-prev,#page-next'),
                scrollWidth: document.documentElement.scrollWidth,
                width: window.innerWidth,
                paragraphStyle: pStyle ? {fontFamily:pStyle.fontFamily,fontSize:pStyle.fontSize} : null,
                quoteStyle: qStyle ? {fontSize:qStyle.fontSize,color:qStyle.color,borderLeftWidth:qStyle.borderLeftWidth} : null,
                headingStyle: hStyle ? {fontFamily:hStyle.fontFamily,fontSize:hStyle.fontSize} : null,
                quoteGroups: quoteGroups.length,
                citationGroups: citedQuoteGroups.length,
                uncitedQuoteGroups,
                citationExamples,
                quoteOrderErrors,
                sourceDiagramImages: sourceDiagramImages.length,
                sourceDiagramIssues,
                scriptureSourceLabels,
                meatCitationStyle,
                sanskritDisclosures: sourceDisclosures.length,
                badDisclosureLabels,
                unpairedTranslations,
                editorialNotes
              };
            }""")
          
          def scroll_candidates(page, toc_selector):
            return page.evaluate("""selector => {
              const nav = document.querySelector(selector);
              if (!nav) return [];
              const links = [...nav.querySelectorAll('a.toc-index-link')];
              const visibleTarget = link => {
                const id = link.dataset.subsection || (() => {
                  try { return decodeURIComponent(new URL(link.href).hash.slice(1)); }
                  catch { return ''; }
                })();
                const target = id && document.getElementById(id);
                return target && target.getClientRects().length ? id : '';
              };
              const subsections = links.filter(link => link.dataset.subsection && visibleTarget(link));
              let chosen = [];
              if (subsections.length) {
                chosen = [subsections[0], subsections[subsections.length - 1]];
              } else {
                const roots = links.filter(link => !link.dataset.subsection && visibleTarget(link));
                chosen = [roots[0], roots[roots.length - 1]];
              }
              const seen = new Set();
              return chosen.map(link => {
                const id = visibleTarget(link);
                const item = link.dataset.subsection
                  ? {kind:'sub',id}
                  : {kind:'root',id,group:link.dataset.group || '',section:link.dataset.section || ''};
                const key = JSON.stringify(item);
                if (!id || seen.has(key)) return null;
                seen.add(key);
                return item;
              }).filter(Boolean);
            }""", toc_selector)
          
          def verify_sanskrit_disclosure(page, label):
            disclosure = page.locator('#source-content .document-section:not(.document-reference-section) details.sanskrit-reveal:not(.quote-source-note)').filter(has=page.locator('[lang^="sa"]')).first
            assert disclosure.count(), f'{label}: Sanskrit disclosure is missing'
            summary = disclosure.locator(':scope > summary')
            assert summary.inner_text().strip() == 'Show Sanskrit', f'{label}: Sanskrit disclosure label is not standardized'
            handle = disclosure.element_handle()
            summary.click()
            page.wait_for_function("(element) => element.open && element.querySelector(':scope > summary').textContent.trim() === 'Hide Sanskrit'", arg=handle, timeout=5000)
            summary.click()
            page.wait_for_function("(element) => !element.open && element.querySelector(':scope > summary').textContent.trim() === 'Show Sanskrit'", arg=handle, timeout=5000)

          def verify_scrollspy(page, label, mobile=False):
            selector = '.mobile-toc .toc' if mobile else '.side-toc .toc'
            if mobile:
              page.evaluate("""() => { const toc=document.querySelector('.mobile-toc'); if(toc)toc.open=true; }""")
            samples = scroll_candidates(page, selector)
            assert samples, f'{label}: Contents has no valid scroll targets'
            for sample in samples:
              page.evaluate('id => document.getElementById(id).scrollIntoView({block:"start"})', sample['id'])
              try:
                page.wait_for_function("""sample => {
                  const nav = document.querySelector(innerWidth < 900 ? '.mobile-toc .toc' : '.side-toc .toc');
                  if (!nav) return false;
                  const active = [...nav.querySelectorAll('a.toc-index-link.is-active, a.toc-index-link.is-active-subsection')];
                  if (active.length !== 1) return false;
                  return active.some(link => {
                    if (sample.kind === 'sub')
                      return link.classList.contains('is-active-subsection') && link.dataset.subsection === sample.id;
                    if (link.dataset.subsection) return false;
                    const key = sample.group || sample.section;
                    return link.classList.contains('is-active') &&
                      (sample.group ? link.dataset.group === sample.group : link.dataset.section === sample.section);
                  });
                }""", arg=sample, timeout=15000)
              except Exception:
                state = page.evaluate("""({selector,id}) => {
                  const nav=document.querySelector(selector);
                  const target=document.getElementById(id);
                  return {
                    active:nav?[...nav.querySelectorAll('a.is-active,a.is-active-subsection')].map(a=>({text:a.textContent.trim(),section:a.dataset.section,subsection:a.dataset.subsection})):[],
                    section:document.querySelector('#section-parent')?.textContent || document.querySelector('.page-context strong')?.textContent || '',
                    targetTop:target?.getBoundingClientRect().top,
                    scrollY:window.scrollY
                  };
                }""", {'selector':selector,'id':sample['id']})
                issue = {'site':label,'mobile':mobile,'sample':sample,'state':state}
                scrollspy_errors.append(issue)
                print('SCROLLSPY_DIAGNOSTIC ' + json.dumps(issue,ensure_ascii=False),flush=True)
          
          with sync_playwright() as playwright:
            chrome = shutil.which('google-chrome') or shutil.which('chromium')
            browser = playwright.chromium.launch(headless=True, executable_path=chrome) if chrome else playwright.chromium.launch(headless=True)
            records = []
            uncited_quote_diagnostics = []
            scrollspy_errors = []
            paragraph_reference = None
            heading_reference = None
            quote_reference = None
            for label, slug in articles:
              page = browser.new_page(viewport={'width':1365,'height':900})
              errors = []
              page.on('pageerror', lambda error, bucket=errors: bucket.append(str(error)))
              url = root + slug + '/'
              response = open_reader(page, url, errors)
              verify_sanskrit_disclosure(page, label)
              if label == 'shaiva':
                for verse in range(36, 41):
                  expected_source = f'Shiva Purana, Rudra Samhita 16.{verse}'
                  pair = page.locator('.scripture-quote-pair').filter(has_text=expected_source)
                  assert pair.count() == 1, f'shaiva: missing unique citation pair for {expected_source}'
                  assert pair.locator(':scope > p.reference').inner_text().strip() == expected_source, f'shaiva: wrong source label for {expected_source}'
                  assert pair.locator(':scope > details.sanskrit-reveal').count() == 1, f'shaiva: Sanskrit reveal missing for {expected_source}'
                  assert pair.locator(':scope > p.translation').count() == 1, f'shaiva: English translation missing for {expected_source}'
                  quote_text = pair.locator(':scope > p.translation').inner_text().strip()
                  assert quote_text.startswith('“') and quote_text.endswith('”'), f'shaiva: English quotation marks missing for {expected_source}'
                  order = pair.evaluate("(node) => Array.from(node.children).map(child => child.matches('p.reference') ? 'source' : child.matches('details.sanskrit-reveal') ? 'sanskrit' : child.matches('p.translation') ? 'translation' : 'other')")
                  assert order == ['source', 'sanskrit', 'translation'], f'shaiva: quote order differs for {expected_source}: {order}'
              desktop = metrics(page)
              print(json.dumps({'site':label,'desktop':desktop},ensure_ascii=False),flush=True)
              assert response.status == 200, f'{label}: HTTP {response.status}'
              assert desktop['status'] == 'Full document', f'{label}: page still has section pagination'
              assert desktop['sections'] >= 3, f'{label}: only {desktop["sections"]} sections rendered'
              assert desktop['textLength'] >= 5000, f'{label}: full document text is missing ({desktop["textLength"]} chars)'
              assert desktop['links'] >= 3, f'{label}: Contents entries are missing'
              assert not desktop['broken'], f'{label}: broken Contents anchors {desktop["broken"]}'
              assert desktop['sourceSections'] <= 1, f'{label}: Sources split into multiple sections'
              assert desktop['quoteGroups'] > 0, f'{label}: source, Sanskrit and English quote groups are missing'
              assert desktop['citationGroups'] > 0, f'{label}: no source labels appear with the scripture quotes'
              if desktop['uncitedQuoteGroups']:
                uncited_quote_diagnostics.append({'site':label,'total':len(desktop['uncitedQuoteGroups']),'examples':desktop['uncitedQuoteGroups'][:8]})
              assert desktop['scriptureSourceLabels'] == 0, f'{label}: unstandardized scripture-source labels remain'
              assert not desktop['quoteOrderErrors'], f'{label}: quote order differs from source, Sanskrit, English: {desktop["quoteOrderErrors"]}'
              assert desktop['sanskritDisclosures'] > 0, f'{label}: Devanagari disclosures are missing'
              assert desktop['badDisclosureLabels'] == 0, f'{label}: Sanskrit disclosure labels differ from the shared reader'
              assert desktop['editorialNotes'] == 0, f'{label}: editorial or source-process notes remain visible'
              expected_source = {
                'agamas':'Taittiriya Samhita 2.2.10.2',
                'shaiva':'Shiva Purana, Rudra Samhita 16.36',
                'varna':'Bhagavad Gita 16.23',
                'vaishnava':'Rigveda 10.113.2',
                'women':'Saundarya Laharī, verse 97',
                'meat':'Manusmrti 5.48'
              }[label]
              assert any(expected_source.lower() in item.lower() for item in desktop['citationExamples']), f'{label}: expected source label is missing: {expected_source}'
              if label == 'women':
                for source_label in ('Manusmrti 6.86–87','Mahabharata 12.261.7','Padma Purana 2.59.16–17'):
                  assert any(source_label.lower() in item.lower() for item in desktop['citationExamples']), f'women: source label missing: {source_label}'
              if label == 'meat':
                assert desktop['meatCitationStyle'], 'meat: Yajurveda 22.42 source label is missing'
                assert desktop['meatCitationStyle']['italic'] == 'normal' and not desktop['meatCitationStyle']['emphasized'], f'meat: Yajurveda 22.42 source label is still italic: {desktop["meatCitationStyle"]}'
              if label == 'vaishnava':
                assert desktop['sourceDiagramImages'] == 2, f'vaishnava: expected both source diagrams, got {desktop["sourceDiagramImages"]}'
                assert not desktop['sourceDiagramIssues'], f'vaishnava: source diagram assets are missing, cropped, or missing alt text: {desktop["sourceDiagramIssues"]}'
                cite_pair=page.locator('.scripture-quote-pair').filter(has_text='Taittiriya Samhita (5.5.1)')
                assert cite_pair.count() == 1, 'vaishnava: Taittiriya source was not paired with its own quote'
                cite_order=cite_pair.evaluate("(node) => Array.from(node.children).map(child => child.matches('p.reference,p.source-citation,p.scripture-source,p.citation') ? 'source' : child.matches('details.sanskrit-reveal') ? 'sanskrit' : child.matches('p.translation,p.scripture-translation,blockquote.translation,blockquote.scripture-translation') ? 'translation' : 'other')")
                assert cite_order == ['source','sanskrit','translation'], f'vaishnava: Taittiriya quote group order is wrong: {cite_order}'
                assert 'MahabharataBhagavad Gita' not in page.locator('#source-content').inner_text(), 'vaishnava: the old joined diagram labels remain'
              assert not desktop['pageNav'], f'{label}: old Previous/Next navigation remains'
              assert desktop['paragraphStyle'], f'{label}: no article paragraph rendered'
              assert desktop['headingStyle'], f'{label}: no section heading rendered'
              if paragraph_reference is None:
                paragraph_reference = desktop['paragraphStyle']
                heading_reference = desktop['headingStyle']
              else:
                assert desktop['paragraphStyle'] == paragraph_reference, f'{label}: article font differs {desktop["paragraphStyle"]} != {paragraph_reference}'
                assert desktop['headingStyle'] == heading_reference, f'{label}: section heading style differs {desktop["headingStyle"]} != {heading_reference}'
              if desktop['quoteStyle']:
                if quote_reference is None:
                  quote_reference = desktop['quoteStyle']
                else:
                  assert desktop['quoteStyle'] == quote_reference, f'{label}: quote style differs {desktop["quoteStyle"]} != {quote_reference}'
              verify_scrollspy(page, label)
              page.set_viewport_size({'width':390,'height':844})
              page.wait_for_timeout(250)
              mobile = metrics(page)
              assert mobile['sections'] == desktop['sections'], f'{label}: sections disappeared on mobile'
              assert mobile['textLength'] >= 5000, f'{label}: mobile article text is incomplete'
              assert mobile['scrollWidth'] <= mobile['width'], f'{label}: horizontal overflow at mobile width'
              verify_scrollspy(page, label, mobile=True)
              page.screenshot(path=str(out / (label + '-mobile.png')), full_page=False)
              record = {'site':label,'http':response.status,'sections':desktop['sections'],'textChars':desktop['textLength'],'sectionLengths':desktop['sectionLengths'],
                        'contentsLinks':desktop['links'],'sourcesSections':desktop['sourceSections'],
                        'quoteGroups':desktop['quoteGroups'],'citationGroups':desktop['citationGroups'],
                        'uncitedQuoteGroups':desktop['uncitedQuoteGroups'],'quoteOrderErrors':desktop['quoteOrderErrors'],
                        'citationExamples':desktop['citationExamples'],'scriptureSourceLabels':desktop['scriptureSourceLabels'],
                        'mobileWidth':mobile['scrollWidth'],'errors':errors}
              records.append(record)
              print(json.dumps(record,ensure_ascii=False),flush=True)
              assert not errors, f'{label}: browser errors {errors}'
              page.close()
            (out / 'results.json').write_text(json.dumps(records,ensure_ascii=False,indent=2))
            browser.close()
          assert len(records) == 6
          if uncited_quote_diagnostics: raise AssertionError('Scripture quote groups without source labels: ' + json.dumps(uncited_quote_diagnostics,ensure_ascii=False))
          if scrollspy_errors: raise AssertionError('Contents highlight mismatches: ' + json.dumps(scrollspy_errors,ensure_ascii=False))
          
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shaiva-actual-page-visual-review
          path: /tmp/shaiva-qa
          retention-days: 7
