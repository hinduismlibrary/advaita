name: Install Shaiva manuscript layout repair
on:
  push:
    paths:
      - .github/workflows/install-shaiva-all-layout.yml
      - assets/js/shaiva-repair-all.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Refine text detection and install responsive layout after article renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          js=Path('assets/js/shaiva-repair-all.js')
          source=js.read_text(encoding='utf-8')
          source=source.replace('if(saCount<12||enCount<45)return;', 'if(enCount<45||!(saCount>=70||(saCount>=25&&/[॥।]/.test(raw))))return;')
          js.write_text(source,encoding='utf-8')
          html_path=Path('articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html')
          html=html_path.read_text(encoding='utf-8')
          assert 'id="source-document"' in html
          assert 'article-reader-paged.js' in html
          tag='<script src="/vivekadrishti/assets/js/shaiva-repair-all.js?v=20260920-all-layout-2"></script>'
          old='<script src="/vivekadrishti/assets/js/shaiva-repair-all.js?v=20260920-all-layout-1"></script>'
          if old in html:html=html.replace(old,tag,1)
          elif tag not in html:
              pat=r'(<script\s+src="/vivekadrishti/assets/js/article-reader-paged\.js\?v=[^"]+"\s*></script>)'
              html, count=re.subn(pat,lambda m:m.group(1)+'\n'+tag,html,count=1)
              assert count==1, 'Could not locate article renderer'
          assert html.count(tag)==1
          html_path.write_text(html,encoding='utf-8')
          print('Validated selective full-article mixed-script reflow')
          PY
          node --check assets/js/shaiva-repair-all.js
          if ! git diff --quiet -- assets/js/shaiva-repair-all.js articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/js/shaiva-repair-all.js articles/a-shaiva-lens-on-shiva-as-the-supreme-deity/index.html
            git commit -m 'Refine Sanskrit passage detection and refresh manuscript reader'
            git push
          fi