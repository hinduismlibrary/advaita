name: Verify rendered site layout and controls
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/visual-smoke.yml
      - tools/scripts/site-checks/visual-smoke.py
      - tools/scripts/site-checks/prepare-site-deploy.py
      - site/assets/css/site-chrome.css
      - site/assets/js/site-chrome.js
      - site/assets/js/site.js
      - site/assets/js/bhavishya-controls.js
      - site/assets/js/shankara-reader.js
      - site/index.html
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: python3 tools/scripts/site-checks/prepare-site-deploy.py
      - name: Install browser
        run: |
          python3 -m pip install --user --quiet playwright
          python3 -m playwright install chromium
      - name: Check rendered pages
        run: python3 tools/scripts/site-checks/visual-smoke.py
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-visual-smoke
          path: visual-smoke-output/
