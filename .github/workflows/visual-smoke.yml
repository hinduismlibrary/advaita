name: Manual visual smoke review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: python3 tools/scripts/site-checks/prepare-site-deploy.py
      - name: Install browser
        run: |
          python3 -m pip install --user --quiet playwright
          python3 -m playwright install chromium
      - name: Check rendered pages
        run: python3 tools/scripts/site-checks/visual-smoke.py
      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-visual-smoke
          path: visual-smoke-output/
