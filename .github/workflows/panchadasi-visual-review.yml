name: Review all Advaita readers
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/panchadasi-visual-review.yml
      - site/assets/js/shankara-reader-navigation.js
      - site/assets/js/shankara-reader-runtime.js
      - site/assets/css/shankara-reader-standard.css
      - site/books/adi-shankaracharya/book-chapter.html
      - site/books/adi-shankaracharya/book-contents.html
      - site/books/adi-shankaracharya/index.html
      - site/books/adi-shankaracharya/*/index.html
      - site/books/adi-shankaracharya/stotrams/index.html
      - tools/scripts/site-checks/verify-advaita-reader-standardization.js
      - tools/scripts/site-checks/verify-advaita-reader-browser.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/panchadasi-visual-review.yml
      - site/assets/js/shankara-reader-navigation.js
      - site/assets/js/shankara-reader-runtime.js
      - site/assets/css/shankara-reader-standard.css
      - site/books/adi-shankaracharya/book-chapter.html
      - site/books/adi-shankaracharya/book-contents.html
      - site/books/adi-shankaracharya/index.html
      - site/books/adi-shankaracharya/*/index.html
      - site/books/adi-shankaracharya/stotrams/index.html
      - tools/scripts/site-checks/verify-advaita-reader-standardization.js
      - tools/scripts/site-checks/verify-advaita-reader-browser.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Audit all text data, routes, and publication mirrors
        run: node tools/scripts/site-checks/verify-advaita-reader-standardization.js
      - name: Prepare deployed site
        run: python3 tools/scripts/site-checks/prepare-site-deploy.py
      - name: Install Chromium
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
      - name: Run complete reader and responsive browser audit
        env:
          READER_TEST_BASE: http://127.0.0.1:8765/advaita
          READER_TEST_OUTPUT: advaita-reader-browser-output
        run: |
          mkdir -p preview-root
          ln -s "$GITHUB_WORKSPACE/site" preview-root/advaita
          python3 -m http.server 8765 --bind 127.0.0.1 --directory preview-root >/tmp/advaita-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/advaita/books/adi-shankaracharya/ >/dev/null; then break; fi
            sleep 1
          done
          python3 tools/scripts/site-checks/verify-advaita-reader-browser.py
      - name: Save screenshots and browser audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advaita-reader-review-${{ github.run_id }}
          path: advaita-reader-browser-output/
          if-no-files-found: warn
