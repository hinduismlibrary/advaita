<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 192 — Description of the Dialogue Between the Seven-Horsed Sun and Anūru."><title>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 192 — Description of the Dialogue Between the Seven-Horsed Sun and Anūru — Viveka Dṛṣṭi</title><link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet"><link href="/advaita/assets/css/site.css" rel="stylesheet"/><link href="/advaita/assets/css/bhavishya-reader.css?v=20261016-6" rel="stylesheet"/><style>.bp-source span{display:none}</style></head><body class="post-page"><header class="site-header"><div class="nav-wrap"><a class="brand" href="/advaita/">Viveka Dṛṣṭi</a><button aria-controls="site-nav" aria-expanded="false" aria-label="Open navigation" class="menu-toggle" type="button"><span></span><span></span><span></span></button><nav aria-label="Primary navigation" class="site-nav" id="site-nav"><a href="/advaita/">Home</a><a href="/advaita/introduction-to-hinduism/">Introduction to Hinduism</a><a href="/advaita/indology/">Indology</a><a href="/advaita/purana-library/">Purāṇa Library</a></nav></div></header><main class="site-main"><article class="article-shell"><header class="article-heading"><h1>Bhaviṣya Purāṇa — Brāhmaparvan — Chapter 192 — Description of the Dialogue Between the Seven-Horsed Sun and Anūru</h1><div class="section-rule"></div></header><div class="article-body"><div id="chapter-mount"></div><nav class="chapter-nav"><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-191/">← Chapter 191</a><a href="/advaita/articles/bhavishya-purana-brahmaparvan-chapter-193/">Chapter 193 →</a></nav></div></article></main><footer class="site-footer"><p>Viveka Dṛṣṭi</p></footer><script src="/advaita/assets/js/site.js?v=20260915-2"></script><script src="/advaita/assets/js/bhavishya-live-reader.js?v=20261016-6"></script><script>const R=[["Terrifying, bringing terror to sinners and evildoers, it is travelled by those in the womb, those being born, children, youths, and middle-aged people.","saṃtrāsa-jananam — producing terror; ghoram — terrible; pāpānām — for sinners; pāpa-kāriṇām — for evildoers; garbha-sthaiḥ — by those in the womb; jāyamānaiḥ — those being born; ca — and; bālaiḥ — by children; taruṇa-madhyamaiḥ — by the young and middle-aged.","संत्रासजननं घोरं पापानां पापकारिणाम् । गर्भस्थैर्जायमानैश्च बालैस्तरुणमध्यमैः ॥ १ ॥"],["Women, men, eunuchs, and the aged—all beings—must go there; there embodied beings must experience the fruits of good and evil.","strī-puṃ-napuṃsakaiḥ — by women, men, and eunuchs; vṛddhaiḥ — by the old; gantavyam — it must be gone to; sarva-jantuṣu — among all beings; śubha-aśubha-phalam — good and evil fruit; tatra — there; bhoktavyam — must be experienced; dehibhiḥ tathā — likewise by embodied beings.","स्त्रीपुनपुंसकैर्वृद्धैर्गन्तव्यं सर्वजन्तुषु । शुभाशुभफलं तत्र भोक्तव्यं देहिभिस्तथा ॥ २ ॥"],["Whatever good or evil deed the truth-speakers established in righteousness, beginning with Citragupta, declare before Yama, King of Justice, that deed must surely be experienced after judgment.","citraguptādibhiḥ — by those beginning with Citragupta; sarvaiḥ — all; dharma-sthaiḥ — established in righteousness; satya-vādibhiḥ — truth-speakers; proktam — declared; vai — indeed; dharma-rājasya nikaṭe — before Yama, King of Justice; yat śubha-aśubham — whatever good or evil; avaśyam — surely; kṛtaṃ karma — deed done; bhoktavyam — must be experienced; tat vicāritam — after that is judged.","चित्रगुप्तादिभिः सर्वैर्धर्मस्थैः सत्यवादिभिः । प्रोक्तं वै धर्मराजस्य निकटे यच्छुभाशुभम् । अवश्यं हि कृतं कर्म भोक्तव्यं तद्विचारितम् ॥ ३ ॥"],["Those who have done good deeds, whose minds are gentle and who are endowed with compassion, go by a gentle road to Yama’s abode.","tatra — there; ye — those who; śubha-karmāṇaḥ — have done good deeds; saumya-cittāḥ — gentle-minded; dayā-anvitāḥ — endowed with compassion; te narāḥ — those people; yānti — go; saumyenā — by a gentle way; yathā — to; yama-niketanam — the dwelling of Yama.","तत्र ये शुभकर्माणः सौम्यचित्ता दयान्विताः । ते नरा यान्ति सौम्येन यथा यमनिकेतनम् ॥ ४ ॥"],["Whoever gives footwear, wood, and an umbrella to eminent Brahmins goes happily to Yama’s abode through great merit.","yaḥ — whoever; pradadyāt — gives; dvija-indrāṇām — to the eminent Brahmins; upānat — footwear; kāṣṭha — wood; chatram — umbrella; saḥ — he; dharmeṇa mahatā — through great merit; sukham — happily; yāti — goes; yama-ālayam — to Yama’s abode.","यः प्रदद्याद्द्विजेन्द्राणामुपानत्काष्ठछत्रकम् । स च धर्मेण महता सुखं याति यमालयम् ॥ ५ ॥"],["A man who enters a temple wearing footwear, especially its inner sanctum, meets terror.","sa-upānatkaḥ — wearing footwear; naraḥ — a man; yaḥ — who; deva-āyatanam — a divine shrine; āviśet — enters; viśeṣataḥ — especially; garbha-gṛham — the inner sanctum; saḥ — he; saṃtrāsam upāśnute — meets with terror.","सोपानत्को नरो यस्तु देवायतनमाविशेत् । विशेषतो गर्भगृहं स संत्रासमुपाश्नुते ॥ ६ ॥"],["Gifts of footwear, and especially food, let a man go easily to the city of the King of Justice. Therefore he should practise righteousness.","sa-upānatkāni dānāni — gifts of footwear; tathā — and; annam tu viśeṣataḥ — food in particular; evam dāna-viśeṣeṇa — by this distinction of giving; dharma-rāja-puram — to the city of the King of Justice; naraḥ — a man; yasmāt yāti sukhena eva — since he goes quite happily; tasmāt — therefore; dharmam samācaret — he should practise righteousness.","सोपानत्कानि दानानि तथान्नं तु विशेषतः । एवं दानविशेषेण धर्मराजपुरं नरः । यस्माद्याति सुखेनैव तस्माद्धर्मं समाचरेत् ॥ ७ ॥"],["But men who do cruel deeds and delight in sin, O bird, go by the dreadful southern road to Yama’s abode.","ye punaḥ — but those; krūra-karmāṇaḥ — doing cruel deeds; narāḥ — men; pāpa-ratāḥ — delighting in sin; khaga — O Bird; te — they; ghorena — by the terrible [way]; tathā — thus; yānti — go; dakṣiṇena — by the southern way; yama-ālayam — to the abode of Yama.","ये पुनः क्रूरकर्माणो नराः पापरताः खग । ते घोरेण तथा यान्ति दक्षिणेन यमालयम् ॥ ८ ॥"],["Yama’s city should be known to be 86,080 leagues in extent and to have many forms.","ṣaḍ-aśīti-sahasrāṇi — eighty-six thousand; yojanānām — leagues; aśīti ca — and eighty; vaivasvata-puram — Yama’s city; jñeyam — should be known; nānā-rūpam — of many forms; iti sthitam — thus established.","षडशीतिसहस्राणि योजनानामशीति च । वैवस्वतपुरं ज्ञेयं नानारूपमिति स्थितम् ॥ ९ ॥"],["To people of good conduct it appears near; to sinners travelling the dreadful road, it is very far.","samīpa-stham iva ābhāti — appears as if nearby; narāṇām — to people; śubha-cāriṇām — of good conduct; pāpānām — to sinners; ati-dūra-stham — very far; tathā — and; raudreṇa gacchatām — for those travelling by the dreadful way.","समीपस्थमिवाभाति नराणां शुभचारिणाम् । पापानामतिदूरस्थं तथा रौद्रेण गच्छताम् ॥ १० ॥"],["With sharp thorns, piled gravel, razor-edged swords, and stones strewn along the way.","tīkṣṇa-kaṇṭaka-yuktena — joined with sharp thorns; śarkarā-nicitena — heaped with gravel; ca — and; kṣura-dhāra-ati-nistriṃśaiḥ — with swords having very sharp razor edges; pāṣāṇaiḥ — with stones; cintitena — strewn.","तीक्ष्णकण्टकयुक्तेन शर्करानिचितेन च । क्षुरधारातिनिस्त्रिंशैः पाषाणैश्चिन्तितेन च ॥ ११ ॥"],["In some places, a great scorching sun and dreadful pits; elsewhere, they are cut by iron stakes and furnished with swords.","kvacit — in some places; arkeṇa mahatā — by a great sun; duranta-khātakaiḥ — with terrible pits; loha-śaṅkubhiḥ — by iron stakes; ācchinnāḥ — cut; tathā — and; khaḍgaiḥ samanvitāḥ — furnished with swords.","क्वचिदर्केण महता दुरन्तैश्चैव खातकैः । लोहशङ्कुभिराच्छिन्नास्तथा खड्गैः समन्विताः ॥ १२ ॥"],["Then the distressed travel a road with falling bright mountains crowded with trees and a rampart of ghosts.","tataḥ — then; patadbhiḥ — by falling; vimalaiḥ parvataiḥ — bright mountains; vṛkṣa-saṃkulaiḥ — crowded with trees; preta-prākāra-yuktena — with a rampart of pretas; yānti — they go; mārgeṇa — along the road; duḥkhitāḥ — distressed.","ततः पतद्भिर्विमलैः पर्वतैर्वृक्षसङ्कुलैः । प्रेतप्राकारयुक्तेन यान्ति मार्गेण दुःखिताः ॥ १३ ॥"],["In some places, uneven pits; elsewhere, slippery clods, scorching hot sand, and sharp stakes.","kvacit — in some places; viṣama-gartābhiḥ — with uneven pits; kvacit — in others; loṣṭaiḥ sa-picchalaiḥ — with clods and slippery things; su-tapta-vālukābhiḥ — with very hot sand; tathā — and; tīkṣṇaiḥ śaṅkubhiḥ — with sharp stakes.","क्वचिद्विषमगर्ताभिः क्वचिल्लोष्टैः सपिच्छलैः । सुतप्तवालुकाभिश्च तथा तीक्ष्णैश्च शङ्कुभिः ॥ १४ ॥"],["In some places the road is covered with bamboo forests woven with many branches; it is difficult, very dreadful, dark, and without support.","aneka-śākhā-racitaiḥ — woven with many branches; vyāptaiḥ — covered; vaṃśa-vanaiḥ — with bamboo forests; kvacit — at times; kaṣṭena — with difficulty; tamasaḥ mārge — on the road of darkness; anālambe — unsupported; su-dāruṇi — very dreadful.","अनेकशाखारचितैर्व्याप्तैर्वंशवनैः क्वचित् । कष्टेन तमसो मार्ग अनालम्बे सुदारुणि ॥ १५ ॥"],["Then in some places it is covered with thorny thickets and forest fire; elsewhere with heated stones, and in others with snow.","atha — then; śṛṅgāṭakaiḥ — with thorny thickets; vyāptaiḥ — covered; kvacit — in some places; dāva-agninā — with forest fire; punaḥ — again; kvacit — in some places; tapta-śilābhiḥ — with heated stones; ca — and; kvacit — in some places; vyāptam himena — covered with snow.","अथ शृङ्गाटकैर् व्याप्तैः क्वचिद्दावाग्निना पुनः । क्वचित्तप्तशिलाभिश्च क्वचिद्व्याप्तं हिमेन तु ॥ १६ ॥"],["In some places they are forced into sand up to their throats; in some the road is filled with foul water, and in others with burning dung.","kvacit — in some places; vālukayā vyāptam — covered with sand; ākaṇṭha-antam — up to the throat; praveśayet — one makes [them] enter; kvacit — in some places; duṣṭa-ambunā vyāptam — filled with foul water; kvacit ca — and in some places; kariṣa-agninā — with burning dung.","क्वचिद्वालुकया व्याप्तमाकण्ठान्तं प्रवेशयेत् । क्वचिद्दुष्टाम्बुना व्याप्तं क्वचिच्च करीषाग्निना ॥ १७ ॥"],["In some places there are lions, in some tigers and terrible biting insects; in some great leeches, and in others pythons.","kvacit — in some places; siṃhaiḥ — with lions; kvacit — in some places; vyāghraiḥ — with tigers; daṃśaiḥ — with biting insects; kīṭaiḥ ca dāruṇaiḥ — and with fierce insects; kvacit — in some places; mahā-jalaukābhiḥ — with huge leeches; kvacit ca — and in some places; ajagaraiḥ — with pythons.","क्वचित्सिंहैः क्वचिद्व्याघ्रैर्दंशैः कीटैश्च दारुणैः । क्वचिन्महाजलौकाभिः क्वचिद्वाजगरैः पुनः ॥ १८ ॥"],["In some places there are fierce flies and highly venomous snakes; young giant elephants, maddened by strength and trampling.","makṣikābhiḥ — with flies; ca raudrābhiḥ — fierce; kvacit — in some places; sarpaiḥ viṣa-ulbaṇaiḥ — with snakes of intense poison; mahā-gaja-indra-yūnaiḥ — with mighty young elephants; bala-unmattaiḥ — maddened by strength; pramāthibhiḥ — trampling.","मक्षिकाभिश्च रौद्राभिः क्वचित्सर्पैर्विषोल्बणैः । महागजेन्द्रयूनैश्च बलोन्मत्तैः प्रमाथिभिः ॥ १९ ॥"],["With great bulls whose sharp horns furrow the road, great-horned buffaloes, and camels maddened and driven by rut.","panthānam ullikhadbhiḥ — furrowing the road; tīkṣṇa-śṛṅgaiḥ — with sharp horns; mahā-vṛṣaiḥ — with great bulls; mahā-śṛṅgaiḥ ca — and with great horns; mahiṣaiḥ — with buffaloes; uṣṭraiḥ — with camels; mattaiḥ — maddened; mada-āturaiḥ — intoxicated.","पन्थानमुल्लिखद्भिश्च तीक्ष्णशृङ्गैर्महावृषैः । महाशृङ्गैश्च महिषैरुष्ट्रैर्मत्तैर्मदातुरैः ॥ २० ॥"],["Tormented by fierce demonesses, hideous ogres, and very terrible diseases, they go on.","ḍākinībhiḥ — by demonesses; ca raudrābhiḥ — and fierce; vikrālaiḥ rākṣasaiḥ — by hideous ogres; vyādhibhiḥ — by diseases; mahā-ghoraiḥ — very terrible; pīḍyamānāḥ — tormented; vrajanti hi — they indeed proceed.","डाकिनीभिश्च रौद्राभिर्विकरालैश्च राक्षसैः । व्याधिभिश्च महाघोरैः पीड्यमाना व्रजन्ति हि ॥ २१ ॥"],["Struck by an extremely fierce wind mixed with great nooses, and by a rain of huge stones, they go without shelter.","mahā-pāśa-vimiśreṇa — mixed with great nooses; mahā-caṇḍena vāyunā — by an extremely fierce wind; mahā-pāṣāṇa-varṣeṇa — by a rain of huge stones; hanyamānāḥ — being struck; nirāśrayāḥ — without shelter.","महापाशविमिश्रेण महाचण्डेन वायुना । महापाषाणवर्षेण हन्यमाना निराश्रयाः ॥ २२ ॥"],["In some places they go, torn by lightning strikes, struck by falling clusters of thunderbolts and dreadful meteors.","kvacit — in some places; vidyut-prapātena — by lightning strikes; dīryamāṇāḥ — being torn; vrajanti hi — they indeed go; patadbhiḥ — by falling; vajra-saṃghātaiḥ — clusters of thunderbolts; ulkā-pātaiḥ ca dāruṇaiḥ — and dreadful meteor-falls.","क्वचिद्विद्युत्प्रपातेन दीर्यमाणा व्रजन्ति हि । पतद्भिर्वज्रसङ्घातैरुल्कापातैश्च दारुणैः ॥ २३ ॥"],["Burning from a rain of blazing coals, they go on; tormented by great darkness and its bright light, they go on.","pradīpta-aṅgāra-varṣeṇa — by a rain of blazing coals; dahyamānāḥ — burning; vrajanti hi — they indeed go; mahā-andhakāra-śukreṇa — by great darkness and bright light; pīḍyamānāḥ — tormented; vrajanti hi — they go.","प्रदीप्ताङ्गारवर्षेण दह्यमाना व्रजन्ति हि । महान्धकारशुक्रेण पीड्यमाना व्रजन्ति हि ॥ २४ ॥"],["Again and again they are terrified by the terrible rumbling of great clouds; they are filled on every side with sharp stones.","mahā-megha-ravaiḥ — by the thunder of great clouds; ghoraiḥ — dreadful; vitrasyante — they are frightened; muhuḥ muhuḥ — again and again; tīkṣṇa-pāṣāṇa-yuktena — with sharp stones; pūryamāṇāḥ — being filled; samantataḥ — all around.","महामेघरवैर्घोरैर्वित्रास्यन्ते मुहुर्मुहुः । तीक्ष्णपाषाणयुक्तेन पूर्यमाणाः समन्ततः ॥ २५ ॥"],["They travel afflicted by great streams of razor-sharp water; again and again they are terrified by the terrible rumbling of great clouds.","mahā-kṣura-ambu-dhārābhiḥ — by great streams of razor-sharp water; sevyamānāḥ — afflicted; vrajanti hi — they indeed proceed; mahā-megha-ravaiḥ ghoraiḥ — by dreadful thunder of great clouds; vitrasyante — they are frightened; muhuḥ muhuḥ — again and again.","महाक्षुराम्बुधाराभिः सेव्यमाना व्रजन्ति हि । महामेघरवैर्घोरैर्वित्रास्यन्ते मुहुर्मुहुः ॥ २६ ॥"],["They go along a dreadful road without provisions, through a fiercely cold, sharp, and dry wind.","bhṛśam — fiercely; śītena — by cold; tīkṣṇena — sharp; rūkṣeṇa — dry; mārutena ca — and by wind; ittham — thus; mārgeṇa raudreṇa — by a dreadful road; pātheya-rahitena ca — and without provisions.","भृशं शीतेन तीक्ष्णेन रूक्षेण मारुतेन च । इत्थं मार्गेण रौद्रेण पाथेयरहितेन च ॥ २७ ॥"],["Without support, dangerous, deserted on every side, without rest, vast, devoid of safety, and difficult to endure.","nirālambena — without support; durgeṇa — dangerous; nirjanena samantataḥ — deserted on every side; aviśrāmeṇa — without rest; mahatā — vast; vigata-apāya-durdharaiḥ — devoid of safety and hard to endure.","निरालम्बेन दुर्गेण निर्जनेन समन्ततः । अविश्रामेण महता विगतापायदुर्धरैः ॥ २८ ॥"],["All embodied beings who are deluded and do evil are led. Knowing this, a man should perform meritorious acts and abandon sin. Through merit he attains divinity; through sin he goes to hell.","nīyante — are led; dehinaḥ sarve — all embodied beings; ye mūḍhāḥ — who are deluded; pāpa-kāriṇaḥ — evildoers; iti jñātvā — knowing thus; naraḥ — a man; kuryāt puṇyam — should do merit; pāpam ca varjayet — and abandon sin; puṇyena — by merit; yāti devatvam — he goes to divinehood; pāpena — by sin; narakam vrajet — he goes to hell.","नीयन्ते देहिनः सर्वे ये मूढाः पापकारिणः । इति ज्ञात्वा नरः कुर्यात्पुण्यं पापं च वर्जयेत् । पुण्येन याति देवत्वं पापेन नरकं व्रजेत् ॥ २९ ॥"],["Those who have worshipped the Sun, lord of gods, even a little in their minds, never see Yama’s face, O bird.","yaiḥ — by whom; manāk api — even a little; deva-īśaḥ — the Lord of gods; manasā pūjitaḥ raviḥ — Ravi worshipped in the mind; te — they; kadā api na paśyanti — never see; yamasya vadanam — the face of Yama; khaga — O Bird.","यैर्मनागपि देवेशो मनसा पूजितो रविः । ते कदापि न पश्यन्ति यमस्य वदनं खग ॥ ३० ॥"],["But because of very dreadful sins, for a little while and by your command, they become kings of ghosts; then they go to the city of the Sun.","kiṃ tu — but; pāpaiḥ mahā-ghoraiḥ — because of very terrible sins; kiñcit kālam — for a little time; tava ājñayā — by your command; bhavanti — they become; preta-rājānaḥ — kings of ghosts; tataḥ — then; yānti — they go; raveḥ puram — to the city of Ravi.","किं तु पापैर्महाघोरैः किञ्चित्कालं तवाज्ञया । भवन्ति प्रेतराजानस्ततो यान्ति रवेः पुरम् ॥ ३१ ॥"],["Those who worship the Sun on earth with their whole being are not stained by sin, like a lotus leaf by water.","ye — those who; punaḥ — indeed; sarva-bhāvena — with their whole being; bhajante — worship; bhuvi — on earth; bhāskaram — the Sun; na te lim­panti — they are not stained; pāpena — by sin; padma-patram iva — like a lotus leaf; ambhasā — by water.","ये पुनः सर्वभावेन भजन्ते भुवि भास्करम् । न ते लिम्पन्ति पापेन पद्मपत्रमिवाम्भसा ॥ ३२ ॥"],["Therefore a man should constantly show devotion to the Sun. Whoever desires abundant wealth should worship the Sun with faith.","tasmāt — therefore; prakuryāt — should practise; bhaktim — devotion; vai — indeed; bhāskare — to the Sun; satatam — constantly; naraḥ — a man; śraddhayā — with faith; pūjayet bhānum — should worship Bhānu; yaḥ icchet — whoever desires; vipulam dhanam — abundant wealth.","तस्मात्प्रकुर्याद्भक्तिं वै भास्करे सततं नरः । श्रद्धया पूजयेभानुं य इच्छेद्विपुलं धनम् ॥ ३३ ॥"]];const T=Object.fromEntries(R.map((r,i)=>[i+1,{en:r[0],wfw:r[1],sa:r[2]}]));renderBhavishyaLiveChapter({chapter:192,verseCount:33,preferEmbeddedSanskrit:true,subtitle:"Chapter 192 — Description of the Dialogue Between the Seven-Horsed Sun and Anūru",colophon:""},T);</script><script src="/advaita/assets/js/bhavishya-controls.js?v=20261018-toggle-close-1"></script></body></html>
