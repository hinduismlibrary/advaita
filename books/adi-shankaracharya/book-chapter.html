function unitChapter(unit){
 if(unit.chapter!==undefined&&unit.chapter!==null)return String(unit.chapter);

function chapterItems(data){
 var units=Array.isArray(data&&data.units)?data.units:[];
 var sections=Array.isArray(data&&data.sections)?data.sections:[];
 if(sections.length){
  var explicit=sections.map(function(section){
   var target=units.find(function(unit){return unit.sectionTitle&&unit.sectionTitle===section.title;});
   if(!target&&section.id!==undefined)target=units.find(function(unit){return unitChapter(unit)===String(section.id);});
   if(!target&&section.startVerse!==undefined){
    target=units.find(function(unit){
     var numbers=Array.isArray(unit.sourceNumbers)?unit.sourceNumbers:[unit.number];
     return numbers.some(function(number){var value=Number(String(number).split(".")[0]);return Number.isFinite(value)&&value>=Number(section.startVerse)&&value<=Number(section.endVerse||section.startVerse);});
    });
   }
   var index=target?units.indexOf(target):-1;
   return index>=0?{label:section.title,id:target.id,index:index}:null;
  }).filter(Boolean);
  if(explicit.length)return explicit;
 }
 var panchadasiTitles={1:"Tattva-viveka",2:"Pañca-mahā-bhūta-viveka",3:"Pañca-kośa-viveka",4:"Dvaita-viveka",5:"Mahā-vākya",6:"Citra-dīpa",7:"Tṛpti-dīpa",8:"Kūṭastha-dīpa",9:"Dhyāna-dīpa",10:"Nāṭa-dīpa",11:"Brahmānanda",12:"Ātmānanda",13:"Advaitānanda",14:"Vidyānanda",15:"Viṣayānanda"};

 var mandukyaTitles={1:"Āgama-prakaraṇa",2:"Vaitathya-prakaraṇa",3:"Advaita-prakaraṇa",4:"Alāta-śānti-prakaraṇa"};
 var grouped=[];
 units.forEach(function(unit,index){

   else if(work==="svsss")title="Part "+chapterNo+(svsssTitles[chapterNo]?": "+svsssTitles[chapterNo]:"");
   else if(work==="mandukya-karika")title="Chapter "+chapterNo+": "+(mandukyaTitles[chapterNo]||"");
   else title="Chapter "+chapterNo;
  }
  if(!title)return;
  var prior=grouped[grouped.length-1];
  if(!prior||prior.label!==title)grouped.push({label:title,id:unit.id,index:index});
 });
 var hasTraditional=units.some(function(unit){return unit.chapter!==undefined&&unit.chapter!==null;})||work==="panchadasi"||work==="svsss";
 if(grouped.length&&(hasTraditional||grouped.length<=20))return grouped;
 if(units.length<=50)return [];
 var result=[],chunkSize=Math.max(1,Math.ceil(units.length/12));
 for(var i=0;i<units.length;i+=chunkSize){
  var part=units.slice(i,i+chunkSize);

  var first=String(part[0].label||"");

  result.push({label:kind+" "+(nums[0]||part[0].number||String(i+1))+"–"+(nums[nums.length-1]||part[part.length-1].number||String(Math.min(i+part.length,units.length))),id:part[0].id,index:i});

function renderVerseNavigation(units,chapters,selectedChapter){
 listNode.replaceChildren();
 if(isPanchadasi){
  var current=chapters[selectedChapter];
  if(!current)return;
  var next=chapters[selectedChapter+1];
  var start=current.index,end=next?next.index:units.length;
  var verses=units.slice(start,end);
  if(selectedChapter===0){
   for(var first=0;first<verses.length;first+=10){
    var group=document.createElement("li"),details=document.createElement("details");
    group.className="reader-verse-band";
    details.className="reader-verse-band-details";
    details.open=first===0;
    var summary=document.createElement("summary");
    summary.textContent="Verses "+(first+1)+"–"+Math.min(first+10,verses.length);
    var links=document.createElement("ol");
    links.className="reader-verse-band-links";
    verses.slice(first,first+10).forEach(function(unit,offset){
     var item=document.createElement("li"),link=document.createElement("a");
     link.className="reader-verse-link";
     link.href="#"+encodeURIComponent(String(unit.id));
     link.textContent=String(unit.number||start+first+offset+1);
     link.dataset.verseId=String(unit.id);
     link.setAttribute("aria-label","Read verse "+link.textContent);
     item.append(link);
     links.append(item);
    });
    details.append(summary,links);
    group.append(details);
    listNode.append(group);
   }
  }else{
   verses.forEach(function(unit,verseIndex){
    var item=document.createElement("li"),link=document.createElement("a");
    link.className="reader-verse-link";
    link.href="#"+encodeURIComponent(String(unit.id));
    link.textContent=String(unit.number||start+verseIndex+1);
    link.dataset.verseId=String(unit.id);
    link.setAttribute("aria-label","Read verse "+link.textContent);
    item.append(link);
    listNode.append(item);
   });
  }
  return;
 }
 chapters.forEach(function(chapter,chapterIndex){
  var start=chapter.index,end=chapters[chapterIndex+1]?chapters[chapterIndex+1].index:units.length;
  var subset=units.slice(start,end);
  var wrapper=document.createElement("li");
  wrapper.className="reader-chapter-group";
  wrapper.dataset.chapter=String(chapterIndex+1);
  var details=document.createElement("details");
  details.className="reader-chapter-details";
  details.open=chapterIndex===selectedChapter;
  var summary=document.createElement("summary");
  var number=document.createElement("span");
  number.className="reader-chapter-num";
  number.textContent=String(chapterIndex+1).padStart(2,"0");
  var heading=document.createElement("span");
  heading.className="reader-chapter-title";
  heading.textContent=chapter.label.replace(/^Chapter\s+\d+\s*[:—-]\s*/i,"").split(" — ")[0];
  var count=document.createElement("span");
  count.className="reader-chapter-count";
  count.textContent=String(subset.length);
  summary.append(number,heading,count);
  var verseList=document.createElement("ol");
  verseList.className="reader-verse-grid";
  subset.forEach(function(unit,verseIndex){
   var li=document.createElement("li"),link=document.createElement("a");
   link.className="reader-verse-link";
   link.href=(chapterIndex===selectedChapter?"":chapterUrl(chapter.id))+"#"+encodeURIComponent(unit.id);
   link.textContent=String(unit.number||start+verseIndex+1);
   link.dataset.verseId=String(unit.id);
   link.setAttribute("aria-label","Read verse "+link.textContent);
   li.append(link);
   verseList.append(li);
  });
  details.append(summary,verseList);
  wrapper.append(details);
  listNode.append(wrapper);
 });
}

function trackActiveVerse(units){
 var cards=Array.from(contentNode.querySelectorAll(".shankara-verse"));
 var links=Array.from(listNode.querySelectorAll(".reader-verse-link"));
 var chapterLinks=Array.from(contentNode.querySelectorAll(".reader-section-verse-link"));
 var activeId="";
 function setActive(id){
  if(!id||id===activeId)return;
  activeId=id;
  var activeLink=null;
  links.forEach(function(link){
   var selected=link.dataset.verseId===id;
   link.classList.toggle("is-active",selected);
   if(isPanchadasi&&root.dataset.activeChapter==="1"){
    link.style.setProperty("color",selected?"#67328a":"#5d5961","important");
    link.style.setProperty("background-color",selected?"#f6f0fa":"transparent","important");
    link.style.setProperty("border-left-color",selected?"#823fa7":"transparent","important");
   }
   if(selected){link.setAttribute("aria-current","location");activeLink=link;}
   else link.removeAttribute("aria-current");
  });
  chapterLinks.forEach(function(link){
   var selected=link.dataset.verseId===id;
   link.classList.toggle("is-active",selected);
   if(selected)link.setAttribute("aria-current","location");
   else link.removeAttribute("aria-current");
  });
  var unit=units.find(function(item){return String(item.id)===id});
  if(unit)tocProgress.textContent="Reading verse "+(unit.number||"")+" · "+units.length+" in this chapter";
  if(activeLink&&isPanchadasi&&root.dataset.activeChapter==="1"){
   var band=activeLink.closest(".reader-verse-band-details");
   if(band&&!band.open){
    listNode.querySelectorAll(".reader-verse-band-details[open]").forEach(function(other){if(other!==band)other.open=false;});
    band.open=true;
   }
  }
  if(activeLink){
   var toc=document.getElementById("reader-toc");
   var box=toc.getBoundingClientRect(),position=activeLink.getBoundingClientRect();
   if(position.top<box.top+85||position.bottom>box.bottom-12){
    toc.scrollTop+=position.top-(box.top+Math.min(box.height*.42,170));
   }
  }
 }
 var queued=false;
 function update(){
  queued=false;
  var id=cards[0]?cards[0].id:"";
  cards.forEach(function(card){
   if(card.getBoundingClientRect().top<=Math.min(175,window.innerHeight*.33))id=card.id;
  });
  setActive(id);
 }
 function schedule(){
  if(queued)return;
  queued=true;
  window.requestAnimationFrame(update);
 }
 window.addEventListener("scroll",schedule,{passive:true});
 window.addEventListener("resize",schedule);
 window.addEventListener("hashchange",schedule);
 var hashed=decodeHash(window.location.hash.replace(/^#/,""));

  window.requestAnimationFrame(function(){target.scrollIntoView({block:"start"});schedule();});
 }else schedule();
}
dataUrl.searchParams.set("v","reader-gloss-20261027b");
fetch(dataUrl.href,{credentials:"same-origin",cache:"no-cache"}).then(function(response){
 if(!response.ok)throw new Error("Glossary data is unavailable.");
 return response.json();
}).then(function(data){
 if(!data||!Array.isArray(data.units)||data.units.length!==data.expectedUnits||!data.units.length)throw new Error("The complete text data is incomplete.");
 var units=data.units;
 if(units.some(function(unit){return !unit||!unit.id||!unit.deva||!unit.iast||!unit.translation||!Array.isArray(unit.gloss)||!unit.gloss.length||unit.gloss.some(function(word){return !word||!word.sa||!word.en;});}))throw new Error("A Sanskrit, translation, transliteration, or word-gloss field is missing.");
 titleNode.textContent=data.title||work;
 authorNode.textContent=data.author?"By "+data.author:"";
 document.title=titleNode.textContent+" — Chapter reader — Viveka Dṛṣṭi";
 if(isPanchadasi){
  var overline=document.querySelector(".gita-hero .eyebrow");
  var tocOverline=document.querySelector(".reader-toc-head .reader-overline");
  var tocHeading=document.querySelector(".reader-toc-head h2");
  if(overline)overline.textContent="Pañcadaśī";
  if(authorNode)authorNode.hidden=true;
  if(contentsLink)contentsLink.hidden=true;

  if(tocHeading)tocHeading.textContent="Contents";
  if(tocProgress)tocProgress.hidden=true;
 }
 var items=chapterItems(data);
 if(!items.length)throw new Error("No named chapter or contents divisions were found.");
 var selectedIndex=items.findIndex(function(item){return item.id===requestedUnit;});
 if(selectedIndex<0&&requestedUnit){
  var verseIndex=units.findIndex(function(unit){return unit.id===requestedUnit;});
  if(verseIndex>=0){
   selectedIndex=items.findIndex(function(item,index){return verseIndex>=item.index&&verseIndex<(items[index+1]?items[index+1].index:units.length);});
  }
  if(selectedIndex<0){
   var legacy=requestedUnit.match(/^treatise-[a-z0-9-]+-section-(\d+)$/);
   if(legacy)selectedIndex=Number(legacy[1])-1;
  }
 }
 if(selectedIndex<0&&!requestedUnit)selectedIndex=0;
 if(selectedIndex<0||selectedIndex>=items.length){
  chapterTitle.textContent="Section not found";
  setError("That chapter or contents section is not in this text.");
  return;
 }
 var selectedStart=items[selectedIndex].index;
 var selectedEnd=items[selectedIndex+1]?items[selectedIndex+1].index:units.length;
 var selectedUnits=units.slice(selectedStart,selectedEnd);
 if(!selectedUnits.length)throw new Error("The selected section is empty.");
 chapterTitle.textContent=items[selectedIndex].label;
