<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Chapter and section contents for the longer Advaita texts.">
<meta name="color-scheme" content="light">
<title>Text contents — Viveka Dṛṣṭi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;500;700&family=Vollkorn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--paper:#f7f6f4;--ink:#3c362e;--muted:#817970;--teal:#2f7f82;--line:#dedbd6;--link:#5d4c68}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.6 Merriweather,Georgia,serif}
a{color:var(--link)}
a:focus-visible{outline:3px solid #7ab8bb;outline-offset:3px}
.topbar{height:41px;border-bottom:1px solid var(--line);padding:5px max(24px,calc((100% - 1200px)/2));}
.topbar a{color:var(--teal);font:600 18px Vollkorn,Georgia,serif;text-decoration:none}
.page{width:min(1200px,100%);margin:0 auto;padding:0 24px 52px}
.hero{max-width:820px;margin:0 auto 42px;padding:44px 0 23px;text-align:center;border-bottom:1px solid var(--line)}
.eyebrow{margin:0 0 9px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
h1{margin:0;color:var(--teal);font:500 clamp(34px,5vw,48px)/1.1 Vollkorn,Georgia,serif}
.author{margin:11px 0 0;color:#655e57;font-style:italic}
.hero-links{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:16px}
.hero-links a{color:var(--teal);text-decoration:none;font-size:12px}
.hero-links a:hover{text-decoration:underline}
.reading-grid{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);column-gap:clamp(24px,3.6vw,44px);align-items:start}
.sidebar{position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;padding:0 16px 8px 0;border-right:1px solid var(--line)}
.sidebar h2{margin:0 0 12px;color:var(--teal);font:500 27px/1.2 Vollkorn,Georgia,serif}
.sidebar nav{display:grid;gap:6px}
.sidebar a{color:var(--ink);font-size:12px;text-decoration:none}
.sidebar a:hover{text-decoration:underline}
.sections{min-width:0}
.contents-group{margin:0 0 32px;scroll-margin-top:18px}
.contents-group h2{margin:0 0 8px;padding:0 0 10px;border-bottom:1px solid var(--line);font:600 23px/1.35 Vollkorn,Georgia,serif}
.chapter-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:22px}
.chapter-link{display:block;min-width:0;padding:8px 0;border-bottom:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.5;text-decoration:none;overflow-wrap:anywhere}
.chapter-link:hover{text-decoration:underline;color:var(--teal)}
.loading,.error{padding:18px 0;color:var(--muted)}
.complete-link{font-weight:700}
@media(max-width:760px){
 .page{padding-right:18px;padding-left:18px}
 .hero{padding-top:34px;margin-bottom:26px}
 .reading-grid{grid-template-columns:1fr;gap:26px}
 .sidebar{position:static;max-height:none;padding:0 0 18px;border-right:0;border-bottom:1px solid var(--line)}
 .sidebar nav{display:flex;flex-wrap:wrap;gap:8px 16px}
 .chapter-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px}
}
@media(max-width:420px){.chapter-grid{grid-template-columns:1fr}.contents-group h2{font-size:21px}}
</style>
</head>
<body>
<header class="topbar"><a href="/advaita/">Viveka Dṛṣṭi</a></header>
<main class="page">
  <header class="hero">
    <p class="eyebrow">Advaita Texts</p>
    <h1 id="work-title">Contents</h1>
    <p class="author" id="work-author"></p>
    <div class="hero-links">
      <a href="/advaita/books/adi-shankaracharya/">← All Advaita texts</a>
      <a class="complete-link" id="complete-link" href="/advaita/books/adi-shankaracharya/">Open full text</a>
    </div>
  </header>
  <div class="reading-grid">
    <aside class="sidebar" aria-label="Contents">
      <h2>Contents</h2>
      <nav id="group-nav" aria-label="Book sections"></nav>
    </aside>
    <div class="sections" id="sections" aria-live="polite">
      <p class="loading" role="status">Loading the chapter list…</p>
    </div>
  </div>
</main>
<script>
(function(){
  "use strict";
  var params=new URLSearchParams(window.location.search);
  var work=params.get("work")||"";
  var validWorks=new Set(["aparokshanubhuti","vedantasara","svsss","mandukya-karika","prasthanabheda","brahma-siddhi","panchadasi","vivekachudamani","upadesha-sahasri","naishkarmya-siddhi"]);
  var sections=document.getElementById("sections");
  var groupNav=document.getElementById("group-nav");
  var titleNode=document.getElementById("work-title");
  var authorNode=document.getElementById("work-author");
  var completeLink=document.getElementById("complete-link");
  function showError(message,readerUrl){
    sections.replaceChildren();
    var box=document.createElement("p");
    box.className="error";
    box.textContent=message+" ";
    var link=document.createElement("a");
    link.href=readerUrl.href;
    link.textContent="Open the full text";
    box.append(link);
    sections.append(box);
  }
  if(!validWorks.has(work)){
    showError("Choose a longer text from the Advaita texts page.",new URL("/advaita/books/adi-shankaracharya/",window.location.origin));
    return;
  }
  var readerUrl=new URL(work+"/",window.location.href);
  completeLink.href=readerUrl.href;
  fetch(readerUrl.href,{credentials:"same-origin"})
    .then(function(response){if(!response.ok)throw new Error("The text page could not be loaded.");return response.text();})
    .then(function(markup){
      var doc=new DOMParser().parseFromString(markup,"text/html");
      var sourceTitle=doc.querySelector(".gita-hero h1")||doc.querySelector("h1");
      if(sourceTitle)titleNode.textContent=sourceTitle.textContent.trim();
      var sourceAuthor=doc.querySelector(".shankara-author");
      if(sourceAuthor)authorNode.textContent=sourceAuthor.textContent.trim();
      document.title="Contents — "+titleNode.textContent+" — Viveka Dṛṣṭi";
      var sourceNav=doc.querySelector(".gita-contents");
      var items=[];
      if(sourceNav){
        items=Array.from(sourceNav.querySelectorAll("li a[href^='#']")).map(function(anchor){
          return {label:anchor.textContent.trim(),hash:anchor.getAttribute("href").slice(1)};
        }).filter(function(item){return item.label&&item.hash;});
      }
      if(!items.length){
        items=Array.from(doc.querySelectorAll(".shankara-unit-column [id]")).map(function(node){
          var label=node.querySelector(".shankara-unit-label")||node.querySelector("h2")||node;
          return {label:label.textContent.trim(),hash:node.id};
        }).filter(function(item){return item.label&&item.hash;});
      }
      if(!items.length)throw new Error("No chapter or section links were found.");
      var groups=[{title:"Chapters and sections",items:items}];
      if(work==="panchadasi"&&items.length>=15){
        groups=[
          {title:"Book I — Discrimination (Viveka)",items:items.slice(0,5)},
          {title:"Book II — Light (Dīpa)",items:items.slice(5,10)},
          {title:"Book III — Bliss (Ānanda)",items:items.slice(10,15)}
        ];
        if(items.length>15)groups.push({title:"Additional sections",items:items.slice(15)});
      }
      sections.replaceChildren();
      groupNav.replaceChildren();
      groups.forEach(function(group,index){
        var groupId="contents-group-"+(index+1);
        var sidebarLink=document.createElement("a");
        sidebarLink.href="#"+groupId;
        sidebarLink.textContent=group.title;
        groupNav.append(sidebarLink);
        var section=document.createElement("section");
        section.className="contents-group";
        section.id=groupId;
        var heading=document.createElement("h2");
        heading.textContent=group.title;
        section.append(heading);
        var grid=document.createElement("nav");
        grid.className="chapter-grid";
        grid.setAttribute("aria-label",group.title);
        group.items.forEach(function(item){
          var link=document.createElement("a");
          link.className="chapter-link";
          link.href=new URL("#"+encodeURIComponent(item.hash),readerUrl).href;
          link.textContent=item.label;
          grid.append(link);
        });
        section.append(grid);
        sections.append(section);
      });
    })
    .catch(function(error){showError("The contents list could not be loaded. "+error.message,readerUrl);});
})();
</script>
</body>
</html>
